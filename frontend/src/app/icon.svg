<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>SkillAtlas</title>
  <!--
    The same lucide "map" mark the site header uses, so the tab matches the page.

    Stroke colour follows the browser's theme. A favicon cannot inherit the
    page's palette, and this app's primary is near-black — which vanishes
    against a dark tab strip. Chrome and Firefox honour prefers-color-scheme
    inside an SVG favicon; Safari ignores it and takes the light value, which
    is the safer one to default to.
  -->
  <style>
    path { stroke: #262626; }
    @media (prefers-color-scheme: dark) {
      path { stroke: #f5f5f5; }
    }
  </style>
