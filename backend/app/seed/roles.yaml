# Job roles the dashboard measures readiness against.
#
# readiness % = sum(weight of completed skills) / sum(weight of all skills)
#
# Weights are relative importance for *that role*, so the same concept can
# matter a lot in one role and only a little in another. Keep them on a 1-5
# scale: 5 = you will be asked about this in every interview, 1 = nice to have.

