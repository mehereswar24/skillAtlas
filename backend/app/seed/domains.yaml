# Top-level areas of study. `icon` is a lucide-react component name and `color`
# a Tailwind class — the Explore page renders straight from these rows.
#
# `has_content` is NOT set here: the loader turns it on only for domains that
# actually have a track, so the UI can honestly say "Coming soon" for the rest.

domains:
  # --- Technology ---
  - slug: frontend
    name: Frontend
    category: Technology
    icon: Monitor
    color: text-blue-500
    description: Build the interfaces people actually touch — HTML, CSS, JavaScript and modern component frameworks.

  - slug: backend
    name: Backend
    category: Technology
    icon: Server
    color: text-green-500
    description: Design the APIs, databases and services that power applications behind the scenes.

  - slug: fullstack
