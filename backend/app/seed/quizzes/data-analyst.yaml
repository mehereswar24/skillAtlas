concepts:
  data-analyst-data-cleanup:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-21T15:16:41Z'
    quiz:
    - prompt: Which method is preferred over range when dealing with outliers in a dataset?
      explanation: Interquartile Range (IQR) is preferred over range when dealing with outliers because
        it measures the spread of the middle 50% of the data, making it less sensitive to outliers.
      options:
      - text: Variance
      - text: Interquartile Range (IQR)
        correct: true
      - text: Standard Deviation
      - text: Mean
    - prompt: What is the primary purpose of data transformation in data analysis?
      explanation: The primary purpose of data transformation is to ensure accuracy and improve data quality,
        making the data more suitable for analysis.
      options:
      - text: To make the data look prettier
      - text: To ensure accuracy and improve data quality
        correct: true
      - text: To increase the size of the dataset
      - text: To reduce the number of variables
    - prompt: Which method can be used to detect outliers in a dataset?
      explanation: Z-scores are commonly used to detect outliers by identifying data points that fall
        outside the expected range based on their standard deviation from the mean.
      options:
      - text: Z-scores
        correct: true
      - text: Standard Deviation
      - text: Mean
      - text: Histogram
    interview:
    - question: Can you explain why interquartile range (IQR) is a better measure of dispersion than range
        when dealing with outliers?
      answer_md: Interquartile Range (IQR) is a better measure of dispersion than the range because it
        focuses on the middle 50% of the data, making it less sensitive to outliers. The IQR gives us
        an idea of how spread out the central values are, which can be more informative in datasets with
        extreme values or skewed distributions.
      difficulty: medium
    - question: What strategies would you use to handle missing data in a dataset?
      answer_md: Handling missing data requires careful consideration of the context and the amount of
        missingness. Common strategies include removing rows with missing values, imputing missing values
        using the mean or median, predicting missing values based on other variables, or flagging missingness
        as its own category. The choice depends on the extent of the missing data and the reason for it.
      difficulty: hard
    - question: How would you decide whether to remove or retain outliers in a dataset?
      answer_md: Deciding whether to remove or retain outliers involves understanding their source. If
        they are due to errors, such as data entry mistakes, it might be appropriate to remove them. However,
        if the outliers represent genuine extreme values, they should be retained and possibly analyzed
        further. Visualizing the data using box plots can help identify potential outliers, but ultimately,
        domain knowledge is crucial in making this decision.
      difficulty: hard
  data-analyst-data-collection:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-21T15:16:07Z'
    quiz:
    - prompt: What is the primary purpose of using APIs in data collection?
      explanation: APIs are used to collect, exchange, and manipulate data in a secure and efficient manner.
      options:
      - text: To manually enter data into databases
      - text: To securely exchange and manipulate data from different sources
        correct: true
      - text: To format data for printing reports
      - text: To visualize data on a dashboard
    - prompt: What is an advantage of using CSV files over other file formats in data analysis?
      explanation: CSV files are easy to import into various tools, making them a preferred format in
        data analysis.
      options:
      - text: CSV files are more secure than other formats
      - text: CSV files can be easily read into tools like Pandas and Excel
        correct: true
      - text: CSV files require complex parsing to extract data
      - text: CSV files are better for storing large images
    - prompt: Why is care required when handling CSV files in data analysis?
      explanation: CSV files can have special characters, encoding problems, or missing values that need
        careful handling.
      options:
      - text: Because they cannot be read into tools like Pandas
      - text: Due to potential issues with special characters, encoding, and missing values
        correct: true
      - text: They do not contain any structured data
      - text: CSV files are inherently unreliable
    - prompt: What is the difference between web scraping and APIs in terms of data collection?
      explanation: Web scraping involves extracting data directly from websites, while APIs are predefined
        methods for exchanging structured data.
      options:
      - text: Web scraping involves programming to extract data from websites, while APIs are predefined
          methods for exchanging structured data
        correct: true
      - text: APIs require manual entry into databases, whereas web scraping does not
      - text: Web scraping is less secure than using APIs
      - text: APIs can only collect data from CSV files, unlike web scraping
    interview:
    - question: How would you choose between using an API and web scraping for collecting data?
      answer_md: When deciding between APIs and web scraping, consider the reliability and structure of
        the data. APIs are generally more reliable as they provide a structured interface with well-defined
        endpoints. They also ensure that data is collected in a controlled manner, which can be crucial
        for maintaining data integrity. Web scraping, on the other hand, might be necessary when dealing
        with websites that do not offer an API or when you need to extract specific information from unstructured
        web pages. However, web scraping can be more complex and may require handling issues like rate
        limiting and legal compliance.
      difficulty: medium
    - question: Can you explain the difference between range, variance, and standard deviation in terms
        of dispersion?
      answer_md: Range measures the spread by finding the difference between the maximum and minimum values.
        Variance calculates the average of squared differences from the mean, giving a measure of how
        far each number is from the mean on average. Standard deviation is the square root of variance,
        providing an estimate of the typical distance of individual data points from the mean in their
        original units. Range gives a quick overview, while variance and standard deviation offer more
        detailed insights into the spread of the data.
      difficulty: medium
    - question: What are some potential issues you might face when using CSV files for data analysis?
      answer_md: When working with CSV files, several issues can arise. Special characters in fields may
        cause parsing errors if not properly handled. Different encodings across files can lead to misinterpretation
        of text. Missing values need to be addressed to avoid skewing the results or causing errors in
        calculations. Additionally, large datasets might pose performance challenges when read into memory.
        Proper handling and validation are crucial to ensure data integrity and accurate analysis.
      difficulty: hard
  data-analyst-data-manipulation-libraries:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-21T15:15:09Z'
    quiz:
    - prompt: Which Python library is best suited for handling tabular data and provides easy manipulation
        and analysis of large datasets?
      explanation: Pandas is the most versatile library for handling tabular data in Python, providing
        DataFrames that facilitate easy manipulation and analysis.
      options:
      - text: NumPy
      - text: Pandas
        correct: true
      - text: Matplotlib
      - text: Seaborn
    - prompt: What is a key operation in data analysis that helps in drawing meaningful insights from
        large datasets?
      explanation: The 'sum' operation is fundamental for summarizing numerical data, which is crucial
        for trend analysis and forecasting.
      options:
      - text: Sum
        correct: true
      - text: Min-Max functions
      - text: Plotting graphs
      - text: Filtering
    - prompt: Which library in Python provides support for large, multi-dimensional arrays and matrices
        along with mathematical functions?
      explanation: NumPy is the library that offers support for large, multi-dimensional arrays and matrices,
        as well as a collection of mathematical functions.
      options:
      - text: Pandas
      - text: NumPy
        correct: true
      - text: Matplotlib
      - text: Seaborn
    - prompt: What are the primary roles of Pandas and NumPy in data manipulation?
      explanation: Pandas handles tabular data, while NumPy performs numerical operations on large arrays,
        together facilitating tasks like data cleaning, merging, reshaping, and statistical analysis.
      options:
      - text: Data visualization
      - text: Handling tabular data and performing numerical operations
        correct: true
      - text: Web scraping
      - text: Natural language processing
    - prompt: Why is understanding the minimum and maximum values in a dataset important for data analysts?
      explanation: Identifying the lowest and highest values helps data analysts inspect the distribution
        of the dataset, understand variability, and detect possible outliers.
      options:
      - text: To identify outliers
        correct: true
      - text: For plotting graphs
      - text: To calculate average values
      - text: For filtering data
    interview:
    - question: Explain why Pandas is considered a versatile library for handling tabular data in Python.
      answer_md: Pandas provides DataFrames that allow for easy manipulation and analysis of large datasets.
        It offers a wide range of operations such as filtering, grouping, merging, and reshaping data,
        making it highly versatile for various data science tasks.
      difficulty: medium
    - question: How do Min-Max functions contribute to the accuracy of predictive models in machine learning?
      answer_md: Min-Max functions help identify the range of a dataset by finding the lowest and highest
        values. This is crucial for data normalization, which ensures that all features contribute equally
        to the model's predictions, thereby improving the overall accuracy.
      difficulty: hard
    - question: Describe a scenario where summing up numerical data would be critical in data analysis.
      answer_md: Summing up numerical data is critical when performing trend analysis or forecasting.
        For example, if you are analyzing sales data over time to predict future trends, calculating the
        total sales for each period can provide insights into growth patterns and help make informed business
        decisions.
      difficulty: medium
