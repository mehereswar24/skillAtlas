    verified_at: '2026-08-21T15:06:14Z'
    quiz:
    - prompt: Why is Node.js considered performant?
      explanation: Node.js runs the V8 JavaScript engine, which is Google Chrome's core, outside the browser.
        This allows Node.js to be very performant.
      options:
      - text: Because it uses a single-threaded architecture
      - text: Because it runs on Google Chrome's V8 engine outside the browser
        correct: true
      - text: Because it creates a new thread for every request
      - text: Because it is written in C++
    - prompt: What does Node.js provide to prevent JavaScript code from blocking?
      explanation: Node.js provides a set of asynchronous I/O primitives in its standard library that
        prevent JavaScript code from blocking.
      options:
      - text: Synchronous I/O primitives
      - text: Asynchronous I/O primitives
        correct: true
      - text: Multithreading capabilities
      - text: Event-driven architecture
    - prompt: What is a key characteristic of asynchronous I/O in Node.js?
      explanation: Node.js provides asynchronous I/O primitives that prevent JavaScript code from blocking,
        allowing it to handle multiple requests efficiently without creating a new thread for each one.
      options:
      - text: It blocks the execution of JavaScript code
      - text: It prevents JavaScript code from blocking
        correct: true
      - text: It requires a new thread for every request
      - text: It uses synchronous operations
    - prompt: What are libraries in Node.js typically written using?
      explanation: Libraries in Node.js are generally written using non-blocking paradigms, which is a
        key feature of the platform.
      options:
      - text: Blocking paradigms
      - text: Non-blocking paradigms
        correct: true
      - text: Synchronous operations
      - text: Threaded models
    - prompt: Which statement best describes the use of promises and async/await in Node.js?
      explanation: Promises and async/await in Node.js help manage asynchronous code flow, making it easier
        to write non-blocking, asynchronous code that is more readable and maintainable.
      options:
      - text: They are only used for frontend development
      - text: They are not necessary for asynchronous operations
      - text: They help manage asynchronous code flow and improve readability
        correct: true
      - text: They block JavaScript execution
    interview:
    - question: Explain why Node.js is considered performant.
      answer_md: Node.js runs on Google Chrome's V8 engine outside the browser. This allows it to be very
        performant because the V8 engine is highly optimized and can handle JavaScript code efficiently
        without the overhead of a web browser environment.
      difficulty: medium
    - question: How does Node.js manage concurrency in its applications?
      answer_md: Node.js manages concurrency through non-blocking I/O operations and asynchronous programming.
        It uses callbacks, promises, and `async`/`await` to handle tasks without blocking the event loop,
        allowing it to process multiple requests efficiently.
      difficulty: hard
