  full-stack-redis:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-21T15:08:05Z'
    quiz:
    - prompt: What feature of Redis allows it to be used as a cache?
      explanation: Redis is an in-memory data structure store, which makes it suitable for caching. Persistent
        disk storage and real-time database querying are not primary features of Redis as a cache.
      options:
      - text: In-memory data storage
        correct: true
      - text: Persistent disk storage
      - text: Real-time database querying
      - text: Message queueing
    - prompt: Which feature allows Redis to provide high availability?
      explanation: Redis Sentinel provides automatic failover and monitoring, ensuring high availability.
        Lua scripting is used for in-memory data manipulation, bitmaps are a type of data structure, and
        hyperloglogs are used for cardinality estimation.
      options:
      - text: Lua scripting
      - text: Redis Sentinel
        correct: true
      - text: Bitmaps
      - text: Hyperloglogs
    - prompt: What does LRU eviction refer to in Redis?
      explanation: LRU (Least Recently Used) eviction is a memory management technique where the least
        recently used data is removed from Redis to make space for new data. This ensures that frequently
        accessed data remains in memory.
      options:
      - text: Least Recently Used data removal
        correct: true
      - text: Least Recently Updated data removal
      - text: Most Recently Used data retention
      - text: Most Frequently Accessed data prioritization
    interview:
    - question: Explain the use case for using Redis as a cache in a web application.
      answer_md: Redis can be used as a cache to store frequently accessed data, such as user sessions
        or database query results. This reduces the load on the main database and improves response times
        by serving requests directly from memory. For example, when a user visits a website, their session
        information can be stored in Redis, allowing quick access without hitting the slower database
        each time.
      difficulty: medium
    - question: Describe how Redis Sentinel works to provide high availability.
      answer_md: Redis Sentinel is a monitoring and automatic failover system for Redis. It continuously
        monitors the state of Redis instances, ensuring that if one instance fails, another can take over
        seamlessly. Sentinels form a cluster and monitor each other, allowing them to detect failures
        and initiate a failover process automatically. This ensures that the Redis service remains available
        even when individual nodes go down.
      difficulty: hard
    - question: What are some scenarios where using Redis Cluster might be preferred over Master-Slave
        replication?
      answer_md: Redis Cluster is preferred in scenarios requiring automatic partitioning and high availability
        without manual failover. It allows for horizontal scaling by distributing data across multiple
        nodes, making it ideal for large-scale applications with high write throughput requirements. Unlike
        Master-Slave, where writes are limited to the master node, Redis Cluster supports distributed
        writes, leading to better performance and fault tolerance.
      difficulty: hard
