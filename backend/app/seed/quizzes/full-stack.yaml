  full-stack-basic-aws-services:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-21T15:09:55Z'
    quiz:
    - prompt: Which AWS service can be used to purchase or setup a domain name?
      explanation: Route 53 is primarily for DNS management, but it can also be used to purchase or setup
        a domain name.
      options:
      - text: S3
      - text: Route 53
        correct: true
      - text: EC2
      - text: VPC
    - prompt: What should you do if the security group of the EC2 instance does not allow HTTP and HTTPS
        traffic?
      explanation: Modifying the security group rules is necessary to allow traffic on HTTP (port 80)
        and HTTPS (port 443).
      options:
      - text: Change the region of the EC2 instance
      - text: Modify the security group to open ports 80 and 443
        correct: true
      - text: Increase the RAM of the EC2 instance
      - text: Restart the EC2 instance
    - prompt: Which service would you use if you need to purchase or setup a domain name for your application?
      explanation: Route53 is used for DNS services, including purchasing and setting up domain names.
      options:
      - text: EC2
      - text: Route53
        correct: true
      - text: S3
      - text: SES
    - prompt: What would happen if you forgot to install the database on your EC2 instance?
      explanation: Without a database, applications that require persistent storage of data (like user
        sessions or transactional data) will not function correctly.
      options:
      - text: Your application could face performance issues
      - text: The security group will block all traffic
      - text: You won't be able to access your application via HTTP or HTTPS
      - text: Your application might crash because it cannot store data
        correct: true
    - prompt: Which service would you use to install and configure HTTPS for your application?
      explanation: Certbot is a tool used to automate the process of obtaining and installing an SSL/TLS
        certificate, which can then be configured for HTTPS.
      options:
      - text: EC2
      - text: Route53
      - text: S3
      - text: Certbot
        correct: true
    interview:
    - question: How would you ensure that your application running on an EC2 instance is secure from unauthorized
        access?
      answer_md: To ensure security, you should configure a security group with specific inbound and outbound
        rules. Allow only necessary traffic (e.g., HTTP/HTTPS) and restrict all other incoming connections.
        Additionally, use strong SSH keys for authentication and regularly update the operating system
        to patch vulnerabilities.
      difficulty: medium
    - question: What are some best practices when deploying an application on EC2?
      answer_md: Best practices include using a recent AMI, setting up proper security groups, installing
        necessary software (like Node.js), and regularly updating the system. Additionally, consider using
        automated backups and monitoring tools to ensure your application is running smoothly.
      difficulty: medium
    - question: What potential issues might arise from not properly configuring the security group of
        an EC2 instance?
      answer_md: Not properly configuring the security group can lead to several issues. Without opening
        the necessary ports, your application may be inaccessible over the internet. Additionally, it
        could expose your application to unauthorized access or attacks if the wrong rules are set up.
        Proper configuration ensures that only authorized traffic is allowed in and out of the instance.
      difficulty: hard
  full-stack-devops-starts-here:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-21T15:08:56Z'
    quiz:
    - prompt: Which AWS service would you use to manage domains and redirect traffic in your application?
      explanation: The study notes state that Route53 is AWS's Domain Name System (DNS) service for managing
        domains and redirecting traffic.
      options:
      - text: EC2
      - text: Route53
        correct: true
      - text: S3
      - text: VPC
    - prompt: Which AWS service would you use if you need to store and serve user-generated content like
        blog posts, images, and templates?
      explanation: The study notes state that S3 is a service for storing files in the cloud and serving
        them to users.
      options:
      - text: EC2
      - text: Route53
      - text: S3
        correct: true
      - text: VPC
    - prompt: Which of the following services would you use if you needed to send transactional emails
        to users for account verification?
      explanation: Amazon SES is specifically designed for sending transactional emails, making it the
        correct choice.
      options:
      - text: Route53
      - text: SES (Simple Email Service)
        correct: true
      - text: EC2
      - text: VPC
    - prompt: Which service would be most useful for storing and serving static files such as design templates
        in a single page site builder?
      explanation: Amazon S3 is specifically mentioned as a service that allows you to store files in
        the cloud and serve them to your users, making it ideal for storing static files.
      options:
      - text: Route53
      - text: SES (Simple Email Service)
      - text: EC2
      - text: S3
        correct: true
    interview:
    - question: Can you explain the role of VPC in a DevOps setup?
      answer_md: VPC stands for Virtual Private Cloud and it allows you to create a private, isolated
        section within AWS where you can define your own virtual network. This service provides a more
        secure and controlled environment, enabling you to easily launch and manage resources within your
        personal network. In a DevOps setup, VPC helps in isolating different environments (like development,
        testing, production) and ensures that only authorized traffic is allowed between them.
      difficulty: medium
    - question: How would you use Route53 to manage the DNS for your application?
      answer_md: Route53 can be used to manage domains and redirect traffic in your application. You can
        easily set up domain names, create records (like A, CNAME, MX), and configure routing policies
        to direct user requests to specific resources within your infrastructure. For example, you could
        use Route53 to point a custom domain name to an S3 bucket or EC2 instance.
      difficulty: medium
    - question: What are the key differences between using EC2 and S3 for storing application data?
      answer_md: EC2 is used for running virtual servers, providing resizable compute capacity in the
        form of instances. It's ideal for applications that require a server environment to run code or
        services. On the other hand, S3 is a service designed specifically for storing files and serving
        them to users. While EC2 can be used to host application data, it requires more management overhead
        as you need to set up and maintain servers. S3 offers simpler storage with automatic scaling and
        built-in security features, making it easier to manage large volumes of unstructured data.
      difficulty: hard
  full-stack-node-js:
