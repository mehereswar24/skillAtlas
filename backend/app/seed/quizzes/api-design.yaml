        the pipeline then verifies before release. This ensures that changes to the API are backward-compatible
        with existing consumers.
      difficulty: hard
    - question: Why is it important to run load tests as part of the CI pipeline rather than manually?
      answer_md: Running load tests as part of the CI pipeline ensures that performance testing is automated
        and consistent. It allows for threshold-based assertions on key endpoints against realistic data
        volumes, such as p95 and p99 percentiles. This approach helps catch performance issues early in
        the development cycle without relying on manual intervention before launch.
