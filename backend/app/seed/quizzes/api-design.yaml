concepts:
  api-design-api-authentication-and-authorization:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-22T17:11:52Z'
    quiz:
    - prompt: Which of the following is NOT a recommended flow for user-facing applications in OAuth 2.0?
      explanation: The implicit flow was deprecated because it exposed tokens directly in the URL fragment,
        making them vulnerable to interception. It is not recommended for user-facing applications.
      options:
      - text: Authorization code with PKCE
      - text: Client credentials
      - text: Device authorization grant
      - text: Implicit flow
        correct: true
    - prompt: What does PKCE (Proof Key for Code Exchange) protect against in OAuth 2.0?
      explanation: PKCE protects against token theft via intercepted redirects by ensuring that a stolen
        code is useless without the original `code_verifier`.
      options:
      - text: Man-in-the-Middle attacks on the client
      - text: Denial of Service attacks
      - text: Cross-Site Request Forgery
      - text: Token theft via intercepted redirects
        correct: true
    - prompt: What is the main difference between an OAuth 2.0 access token and an OpenID Connect ID token?
      explanation: An OAuth 2.0 access token grants API access, while an OpenID Connect ID token proves
        user identity to the client. The ID token is not intended for use as an API access token.
      options:
      - text: An access token grants API access, while an ID token proves user identity to the client
        correct: true
      - text: An access token is used for encryption, while an ID token is used for authentication
      - text: An access token is issued by the resource server, while an ID token is issued by the authorization
          server
      - text: An access token has a longer lifespan than an ID token
    interview:
    - question: Describe how refresh tokens can be rotated in a public client application to ensure token
        revocability.
      answer_md: In a public client application, each time an access token is issued, it should generate
        and use a new `refresh_token`. When the access token expires, the client can exchange this new
        `refresh_token` for a new set of tokens. This process ensures that if a refresh token is compromised,
        only its specific instance is invalidated, rather than all previous or future tokens. The old
        `refresh_token` should be marked as used and no longer accepted by the authorization server.
      difficulty: hard
    - question: Discuss the implications of treating an OpenID Connect ID token as an API access token
        in a resource server implementation.
      answer_md: Treating an OpenID Connect ID token as an API access token can lead to significant security
        vulnerabilities. The ID token is intended for client-side authentication and does not contain
        sufficient information or mechanisms to securely validate and enforce API permissions on the server
        side. Using it directly would bypass proper OAuth 2.0 flows, potentially allowing unauthorized
        access to protected resources. Instead, the resource server should validate tokens using standard
        methods such as introspection or direct validation of JWTs, ensuring that only properly authorized
        requests are allowed.
      difficulty: hard
  api-design-api-documentation-tools:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-22T17:14:50Z'
    quiz:
    - prompt: Why should reference documentation be generated from your specification?
      explanation: The notes state that hand-maintained reference documentation is wrong within a month,
        and renderers like Redoc, Swagger UI, Scalar, and docs platforms all take an OpenAPI document.
      options:
      - text: To ensure it is always up to date
        correct: true
      - text: Because hand-maintained reference documentation is easier to write
      - text: To make the documentation look more professional
      - text: Because automated tools are not reliable
    - prompt: What is the most important feature of real examples in API documentation?
      explanation: The notes state that developers read examples first, and the examples should have realistic
        values including errors.
      options:
      - text: They should be complex to showcase advanced usage
      - text: They must include realistic values for fields and errors
        correct: true
      - text: They need to be generated from code comments
      - text: They should only cover successful requests
    - prompt: What should be included in the error catalogue of API documentation?
      explanation: The notes state that every error code, its cause, and the client's action should be
        included in the error catalogue.
      options:
      - text: Only success responses and their formats
      - text: Every error code, what causes it, and what the client should do
        correct: true
      - text: A list of all possible HTTP status codes
      - text: Just a brief description of common errors
    interview:
    - question: Explain why treating documentation as code is important.
      answer_md: Treating documentation as code means keeping it in version control, reviewing changes
        with other team members, and building it in CI. This ensures that the documentation stays up to
        date, accurate, and consistent with the implementation. Automated checks can validate examples
        against schemas and test environments, while failing the pipeline on spec changes without corresponding
        changelog entries helps maintain a clear history of changes.
      difficulty: hard
    - question: Describe the importance of real examples in API documentation.
      answer_md: Real examples are crucial because developers often read them first before diving into
        prose. They should include realistic values, including errors, to help developers understand how
        to use the API correctly. Examples should be generated from test fixtures or code to ensure they
        remain accurate and useful over time.
      difficulty: hard
    - question: What are some common mistakes in API documentation that can lead to poor developer experience?
      answer_md: Common mistakes include publishing bare Swagger UI without any additional explanation,
        using placeholder values in examples that don't work, omitting error documentation entirely, and
        providing documentation only for the current version while ignoring older versions. These issues
        can lead to confusion, frustration, and ultimately abandoned integrations.
      difficulty: hard
  api-design-api-keys-management:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-22T17:12:29Z'
    quiz:
    - prompt: What should you do when rotating an API key to minimize downtime?
      explanation: Creating a new key, deploying it, confirming traffic has moved, and then revoking the
        old one is the best practice for rotating an API key with minimal downtime.
      options:
      - text: Create a new key and immediately revoke the old one
      - text: Create a new key, deploy it, confirm traffic has moved, then revoke the old one
        correct: true
      - text: Rotate the key every 9 months without any additional steps
      - text: Use only one key per account to simplify rotation
    - prompt: Why should you sign requests when using bearer credentials?
      explanation: Signing requests with an HMAC is necessary to prevent replay attacks. It ensures that
        only authorized parties can replay a request.
      options:
      - text: To prevent replay attacks
        correct: true
      - text: To increase the request's lifespan
      - text: To make the request more readable
      - text: To reduce the size of the request
    - prompt: What is the main reason for prefixing and labeling API keys?
      explanation: Prefixing and labeling API keys is done so that secret-scanning tools can recognize
        them as credentials. This helps in identifying leaked keys.
      options:
      - text: To make them easier to read
      - text: For secret-scanning tools to recognize them as credentials
        correct: true
      - text: To increase their entropy
      - text: To make them more memorable
    interview:
    - question: How would you design a system to securely manage API keys for your company's server-to-server
        integrations?
      answer_md: 'To securely manage API keys, I would follow these steps: Generate the keys using a cryptographically
        secure random source with enough entropy. Store only the hash of the key in the database to prevent
        plaintext exposure. Prefix and label the keys appropriately so that secret-scanning tools can
        recognize them as credentials. Scope each key to specific permissions, environments, and IP ranges.
        Implement rotation without downtime by creating new keys, deploying them, confirming traffic has
        moved, and then revoking old keys. Ensure keys have expiry dates and record their last usage timestamps
        for monitoring and auditing purposes.'
      difficulty: hard
    - question: What are the key differences between API keys and tokens in server-to-server integrations?
      answer_md: API keys are long-lived, opaque credentials used for straightforward integrations. They
        provide developer experience benefits but suffer from revocation latency issues if leaked. Tokens,
        on the other hand, are short-lived and obtained through a flow, offering better revocation capabilities
        at the cost of more complex implementation. API keys should be used where simplicity is preferred,
        while tokens are suitable when centralised, auditable access with shorter lifetimes is required.
      difficulty: medium
    - question: Can you explain why storing a key's hash in the database instead of the plaintext value
        is important?
      answer_md: Storing a key's hash in the database ensures that even if the database is compromised,
        the actual credentials remain secure. Hashing provides an additional layer of security because
        it makes it computationally infeasible for attackers to reverse-engineer the original key from
        its hash. Additionally, using a fast SHA-256 function and indexing on the hash allows for efficient
        lookups without introducing unnecessary computational overhead.
      difficulty: hard
  api-design-api-lifecycle-management:
    generated_by: nvidia/nemotron-3-super-120b-a12b:free
    verified_at: '2026-08-23T12:14:40Z'
    quiz:
    - prompt: Which stability tier provides the full compatibility guarantee and support commitment for
        an API?
      explanation: The generally available (stable) stage promises full compatibility and support commitment,
        whereas earlier tiers allow breaking changes or are only for testing.
      options:
      - text: Draft or design
      - text: Alpha or experimental
      - text: Beta
      - text: Generally available (stable)
        correct: true
    - prompt: What is the main benefit of conducting a design review before any implementation work begins?
      explanation: A pre‑implementation design review checks the spec for consistency and supportability,
        avoiding costly rework later; it is not about style, documentation generation, or ownership assignment.
      options:
      - text: It ensures the implementation follows the team's coding style.
      - text: It prevents years of future support burden by catching specification issues early.
        correct: true
      - text: It automatically generates the API documentation and client SDKs.
      - text: It assigns ownership of the new endpoint to a specific team.
    - prompt: Why is maintaining a consumer inventory important for API lifecycle management?
      explanation: Without knowing which clients call an endpoint, the team cannot target communications
        or assess impact during deprecation or incidents; the inventory does not handle rate limiting,
        dashboards, or policy creation.
      options:
      - text: It allows the gateway to enforce rate limits per consumer.
      - text: It enables the team to know who is affected when deprecating or incident occurs.
        correct: true
      - text: It automates the generation of usage dashboards in the developer portal.
      - text: It replaces the need for a formal deprecation policy with dates.
    - prompt: How does a brownout differ from a hard cutoff when retiring a deprecated API endpoint?
      explanation: Brownouts schedule brief error responses that grow longer, giving integrators time
        to react, unlike a hard cutoff that fails all requests at once.
      options:
      - text: A brownout returns increasing periods of error responses on scheduled days, while a hard
          cutoff immediately stops all traffic.
        correct: true
      - text: A brownout gradually reduces latency, whereas a hard cutoff increases latency over time.
      - text: A brownout logs usage metrics for billing, while a hard cutoff disables logging.
      - text: A brownout requires consumer opt‑in, while a hard cutoff applies to all traffic automatically.
    interview:
    - question: Explain why lacking an experimental tier leads teams to fear shipping new functionality,
        and how having such a tier changes that dynamic.
      answer_md: Without an experimental tier, every prototype is treated as a permanent commitment, so
        teams worry that any mistake will become a long‑term support burden; this makes them hesitant
        to ship early versions. An experimental tier explicitly allows breaking changes with little notice
        and requires partners to opt in, giving teams freedom to iterate and learn without locking consumers
        into an unstable contract.
      difficulty: medium
    - question: Describe how a deprecation policy that includes minimum notice periods, signalling methods,
        and brownouts improves the retirement process compared to ad‑hoc notices in a changelog.
      answer_md: A written policy sets clear expectations for how much warning each stability tier receives
        and how deprecation is communicated (headers, banners, direct contact), preventing surprise when
        an endpoint disappears. Brownouts provide incremental, visible failures that catch integrators
        who miss emails, making the transition gentler than a single hard cutoff. Together, these mechanisms
        turn deprecation from a guesswork exercise into a measurable, trackable process aimed at driving
        usage to zero before sunset.
      difficulty: hard
    - question: What are the core responsibilities of an API owning team, and why is maintaining a consumer
        inventory essential to fulfilling those responsibilities?
      answer_md: The owning team must provide a named support channel, define response expectations, and
        ensure the API follows organisational conventions throughout its lifecycle. A consumer inventory
        tells the team exactly who is calling the endpoint, at what volume and with which credentials,
        which is necessary for targeted communication during deprecation, accurate impact analysis during
        incidents, and informed decisions about retirement or extension.
      difficulty: medium
  api-design-api-performance:
    generated_by: nvidia/nemotron-3-super-120b-a12b:free
    verified_at: '2026-08-23T12:13:45Z'
    quiz:
    - prompt: An API endpoint returns a list of users, and each user object in the list requires a separate
        call to fetch their profile details. Why is this pattern particularly costly on mobile networks?
      explanation: Each extra call incurs another network round‑trip (50‑200 ms on mobile), so the total
        latency grows linearly with the number of items, making handler optimisation ineffective.
      options:
      - text: It increases the size of each JSON response dramatically.
      - text: It forces the server to perform expensive database joins.
      - text: It adds a round‑trip latency for every item, which dominates total latency regardless of
          handler speed.
        correct: true
      - text: It prevents the use of HTTP/2 multiplexing because each request needs a new TLS connection.
    - prompt: Which HTTP caching directive allows a cache to serve a slightly stale response immediately
        while silently fetching a fresh copy in the background?
      explanation: stale-while-revalidate tells the cache to return the stale copy right away and revalidate
        it asynchronously.
      options:
      - text: 'Cache-Control: max-age'
      - text: 'Cache-Control: stale-while-revalidate'
        correct: true
      - text: 'Cache-Control: must-revalidate'
      - text: 'Cache-Control: no-transform'
    - prompt: A response varies based on the client’s Accept‑Encoding header. What must be present in
        the response to prevent a shared cache from serving a compressed variant to a client that cannot
        decompress it?
      explanation: The Vary header signals to caches that the representation differs by Accept‑Encoding,
        so they store and serve the correct variant.
      options:
      - text: An ETag header.
      - text: 'A Vary: Accept-Encoding header.'
        correct: true
      - text: 'A Cache-Control: private directive.'
      - text: A Content-Length header.
    - prompt: Why should latency be measured as percentiles at the edge rather than only inside the application
        handler?
      explanation: Measuring at the edge reveals the full client‑experienced latency, including network
        and queuing time that internal handler metrics do not see.
      options:
      - text: Edge measurements include TLS handshake time, which handler metrics ignore.
      - text: Percentiles at the edge capture queueing and network delay that handler‑level metrics miss.
        correct: true
      - text: Handler‑level measurements are always slower than edge measurements.
      - text: Only edge measurements can be broken down by HTTP version.
    interview:
    - question: How would you fix an endpoint that suffers from the N+1 problem across the API boundary,
        and what design techniques from the notes would you apply?
      answer_md: I would first examine the client workflow to see what data is truly needed for the common
        task. If the client needs a list of items plus a few related fields, I would add those fields
        to the list response using resource expansion or a purpose‑built aggregate endpoint, thereby eliminating
        the per‑item detail calls. For cases where the client needs varied shapes, I would offer a batch
        endpoint or support GraphQL so the client can request exactly what it wants in a single round‑trip.
        Finally, I would ensure the created object is returned on POST operations to avoid a follow‑up
        read.
      difficulty: medium
    - question: Compare the latency benefits of using Cache‑Control max‑age with stale‑while‑revalidate
        versus relying on ETag validation (304 Not Modified) for a read‑heavy endpoint. When would you
        prefer each approach?
      answer_md: With max‑age plus stale‑while‑revalidate, the cache can serve a response instantly without
        any round‑trip, and only occasionally background‑fetches a fresh copy, which greatly reduces perceived
        latency for frequently accessed data. ETag validation still requires a round‑trip on every client
        check, though it avoids sending the payload when the resource is unchanged, saving bandwidth on
        large responses. I would prefer stale‑while‑revalidate when the data can tolerate slight staleness
        and latency is critical; I would use ETag validation when strong consistency is required or when
        the payload is large and the cost of sending it outweighs the extra round‑trip.
      difficulty: hard
    - question: What steps would you take to ensure that JSON responses are properly compressed at the
        edge, and what common misconfigurations should you watch out for?
      answer_md: 'First, I would enable gzip and Brotli compression on the CDN or edge proxy, confirming
        that the Accept‑Encoding header is respected and that the Vary: Accept‑Encoding header is present
        so caches store separate compressed and uncompressed variants. I would verify that no middleware
        is disabling compression (e.g., by setting Cache‑Control: no‑transform incorrectly) and that large
        base64‑encoded binaries are not embedded in JSON, as they defeat both compression and caching.
        Finally, I would monitor response sizes and compression ratios at the edge to catch regressions
        early.'
      difficulty: medium
  api-design-api-security:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-22T17:13:00Z'
    quiz:
    - prompt: Which of the following best describes 'mass assignment' in the context of API security?
      explanation: Mass assignment allows setting any field on an entity, which can lead to unintended
        changes.
      options:
      - text: The process of validating input against a schema
      - text: Binding request body fields directly onto an entity without explicit validation
        correct: true
      - text: Restricting resource consumption to prevent abuse
      - text: Defending against server-side request forgery
    - prompt: What is the recommended approach for handling third-party data consumption in APIs?
      explanation: An allowlist with DNS resolution checks is the recommended approach for defending against
        SSRF.
      options:
      - text: Allowing all schemes and hosts without restrictions
      - text: Using a denylist of disallowed URLs
      - text: Implementing an allowlist with DNS resolution checks and egress firewall rules
        correct: true
      - text: Disabling all external requests to prevent SSRF
    - prompt: Why should input validation be performed at the edge of the API?
      explanation: Input validation at the edge prevents unknown fields and generic mass assignment vulnerabilities.
      options:
      - text: To ensure that all client requests are valid and consistent
      - text: To prevent unexpected fields from being processed, mitigating mass assignment risks
        correct: true
      - text: To enforce strict data formats for internal consistency
      - text: To improve the performance of the API by reducing processing time
    interview:
    - question: Can you explain why relying on the client to enforce anything is a mistake in API security?
      answer_md: Relying on the client to enforce anything is a mistake because clients can be manipulated
        or bypassed. The server should handle all validation and enforcement, as it has full control over
        the data flow and can ensure that only valid requests are processed.
      difficulty: hard
    - question: How can an API developer ensure that they do not accidentally expose sensitive information
        through side channels?
      answer_md: API developers should avoid distinguishing between different error messages, controlling
        response timing to prevent leaks of data volume, and hiding sequential integer IDs. They should
        also ensure that logs contain only necessary details without including secrets or personal data.
      difficulty: hard
