    verified_at: '2026-08-23T11:27:07Z'
    quiz:
    - prompt: A system uses self-contained tokens that validate signatures locally without server lookups.
        What is the fundamental drawback of this approach regarding credential lifecycle?
      explanation: Self-contained tokens are valid for their duration even if the user is deleted or permissions
        change, meaning you cannot un-issue them without adding a revocation list. Adding such a list
        reintroduces server-side lookups to validate validity, which defeats one of the main benefits
        of stateless validation.
      options:
      - text: The token cannot be un-issued until it expires or a revocation list is checked, reintroducing
          lookup costs.
        correct: true
      - text: Tokens are encrypted by default to prevent reading claims unless explicitly configured otherwise.
      - text: State-changing endpoints automatically fail without CSRF protection headers regardless of
          storage method.
      - text: They require shared session storage across instances which limits horizontal scaling.
    - prompt: When storing authentication credentials in a browser for an application that requires CSRF
        protection, why is `HttpOnly` cookies generally preferred over tokens stored in memory?
      explanation: Cookies with HttpOnly flags prevent injected scripts from reading the token value directly,
        offering genuine protection against XSS theft. While this requires CSRF protection for state-changing
        endpoints, storing tokens in memory or LocalStorage exposes them to script access if an XSS vulnerability
        exists.
      options:
      - text: Cookies with HttpOnly flags are unreadable by injected scripts, mitigating XSS token theft
          while requiring manual CSRF handling.
        correct: true
      - text: Memory storage prevents the credentials from being sent automatically to state-changing
          endpoints without explicit headers.
      - text: LocalStorage is safer because it survives page reloads but remains readable only by top-level
          domains.
      - text: Tokens in memory are encrypted by default whereas cookies rely on transport layer security.
    - prompt: Why is checking the `aud` claim and pinning algorithms critical when validating a JWT?
      explanation: The audience claim stops a token intended for one service from being replayed against
        another system. Pinning algorithms prevents attackers from exploiting bugs where verification
        logic might accept HS256 with the public key as the secret instead of verifying signatures correctly.
      options:
      - text: To prevent replay attacks against different services and stop attackers from switching verification
          algorithms like RS256 to HS256.
        correct: true
      - text: Because the audience field contains encryption keys that must be verified before decryption
          occurs.
      - text: The `aud` claim is required by law for cross-service communication in all jurisdictions
          involving public data.
      - text: Pinning algorithms ensures that tokens minted with a specific key are never accepted if
          they were signed using an older version of OpenSSL.
    - prompt: What is the primary security risk associated with placing a bearer token in a URL query
        parameter?
      explanation: 'Tokens sent via URL parameters are logged by web servers and visible in browser history
        or referrer headers, creating significant leakage risks. Best practice dictates using `Authorization:
        Bearer` headers instead of custom headers or query strings to keep credentials out of logs.'
      options:
      - text: The token ends up exposed in access logs, browser history, and referrer headers where it
          can be harvested by third parties.
        correct: true
      - text: Query parameters are automatically stripped from requests when crossing network boundaries
          between different subdomains.
      - text: URL encoding causes the signature to become invalid unless base64url is used instead of
          standard percent-encoding.
      - text: Browsers will block any request containing a token in the query string due to SameSite cookie
          policy violations.
    - prompt: For service-to-service traffic where certificate lifecycle management is a concern, why
        might mutual TLS be preferred over API keys?
      explanation: Mutual TLS authenticates both ends using certificates at the transport layer and provides
        very strong security guarantees. Although certificate lifecycle management adds complexity that
        requires automation like service meshes, this approach is preferred for robust machine-to-machine
        authentication over simpler schemes.
      options:
      - text: Mutual TLS authenticates both ends at the transport layer and brings strong security with
          automation tools like service meshes to handle certificates.
        correct: true
      - text: API keys are easier to rotate but lack the ability to authenticate based on certificate
          identity without additional headers.
      - text: Service-to-service traffic never uses API keys because they can be intercepted by network
          proxies during transmission.
      - text: Mutual TLS is required for all internal communication regardless of complexity, making it
