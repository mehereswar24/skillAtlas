    interview:
    - question: Why would you choose a session over a token for a browser-based first-party application
        despite the scaling benefits of tokens?
      answer_md: Sessions store state server-side allowing trivial revocation by deleting rows and immediate
        permission updates without waiting for token expiry, which aligns well with the automatic cookie
        handling of first-party browsers. While they require lookups per request and shared storage across
        instances compared to self-contained tokens that validate signatures locally, this overhead is
        acceptable given the XSS protection provided by HttpOnly cookies versus the script-accessible
        LocalStorage alternatives often used for tokens.
      difficulty: medium
    - question: A developer wants to use JWTs but insists on storing sensitive claims inside them. Why
        does this violate security best practices described here?
      answer_md: Storing secrets like passwords or keys inside a JWT violates the principle that tokens
        are signed, not encrypted; anyone holding it can read its contents regardless of how complex the
        signature verification process is. If you need confidentiality for specific claims, they must
        be transmitted via an encrypted channel rather than hidden within the payload structure which
        relies solely on integrity protection against tampering and replay attacks across services.
      difficulty: medium
    - question: In a service-to-service architecture without external identity providers, why might mutual
        TLS be preferred over API keys?
      answer_md: Mutual TLS authenticates both ends using certificates at the transport layer rather than
        relying on shared secrets that can be leaked or rotated manually like API keys. Although it introduces
        certificate lifecycle management complexity which often necessitates service meshes for automation,
        this approach provides stronger authentication guarantees and avoids the credential stuffing risks
        associated with static key-based endpoints exposed to public networks.
      difficulty: hard
