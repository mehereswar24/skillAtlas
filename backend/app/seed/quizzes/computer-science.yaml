      - text: An infrequently accessed key with a long TTL.
      - text: A cold start scenario where the cache is empty.
    - prompt: In the context of caching, what does false sharing refer to?
      explanation: False sharing occurs when two threads write to different variables on the same cache
        line and cause coherence protocol overhead. This can lead to unnecessary cache invalidations and
        performance degradation.
      options:
      - text: When two threads write to different variables on the same cache line and cause coherence
          protocol overhead.
        correct: true
      - text: When a single thread writes to multiple variables on different cache lines causing unnecessary
          cache invalidations.
      - text: When two threads read from the same cache line but do not modify it, leading to wasted bandwidth.
      - text: When a thread reads stale data from the cache before it has been updated in memory.
    interview:
