    generated_by: qwen2.5:7b
    verified_at: '2026-08-22T16:07:05Z'
    quiz:
    - prompt: Why can't you rely on `len(s)` to count characters in a string?
      explanation: The length of a string in Python or JavaScript can vary depending on the encoding.
        For example, `len('😀')` returns 2 because it counts UTF-16 code units, not grapheme clusters.
        This can lead to bugs where visually identical strings compare unequal.
      options:
      - text: Because it always returns zero for non-ASCII strings.
      - text: Because it counts code points, not grapheme clusters.
        correct: true
      - text: Because it only works with UTF-8 encoded strings.
      - text: Because it includes whitespace and control characters.
    - prompt: Why does reversing a string using `str[::-1]` not always reverse the characters correctly?
      explanation: Reversing a string using `str[::-1]` can move combining marks onto the wrong character,
        such as reversing 'José' to produce 'éoJ'. This is because combining marks are attached to base
        characters and should not be reversed independently.
      options:
      - text: Because it only works for ASCII strings.
      - text: Because it reverses combining marks incorrectly, placing them before base characters.
        correct: true
      - text: Because it doesn't handle surrogate pairs in UTF-16 properly.
      - text: Because it doesn't support multi-byte encodings.
    - prompt: What is the main difference between NFC and NFD normalization?
      explanation: NFC (Normalization Form C) composes characters into their shortest form by combining
        base characters with combining marks. NFD (Normalization Form D) decomposes characters into their
        base and combining parts, expanding them to a longer form. This difference is crucial for ensuring
        consistent comparison of visually identical strings.
      options:
      - text: NFC decomposes characters into their base form, while NFD composes them.
      - text: NFC applies compatibility mappings, while NFD does not.
      - text: NFC normalizes to a shorter form, while NFD expands characters.
        correct: true
      - text: NFC is used for sorting, while NFD is used for searching.
    interview:
    - question: Explain the concept of grapheme clusters and why they are important in text processing.
      answer_md: Grapheme clusters represent the smallest units of a readable character sequence that
        users perceive as single characters. They can include base characters, combining marks, or even
        multiple code points that together form a single visual unit. Understanding grapheme clusters
        is crucial for tasks like slicing strings without breaking characters, reversing strings correctly,
        and ensuring accurate comparison of visually identical text.
      difficulty: hard
    - question: Describe the differences between UTF-8, UTF-16, and UTF-32 encodings. In what scenarios
        would you choose each one?
      answer_md: UTF-8 uses one to four bytes per code point, making it space-efficient for most text
        and self-synchronising, which is why it's widely used on the web. UTF-16 uses two bytes for BMP
        characters and surrogate pairs for characters beyond U+FFFF, making it suitable for languages
        that use a wide range of characters but can be less efficient in terms of memory usage. UTF-32
        uses four fixed bytes per code point, which simplifies indexing but wastes space, so it's rarely
        used on the wire.
      difficulty: hard
    - question: How does normalisation (NFC and NFD) affect string comparison in Unicode text processing?
      answer_md: Normalisation ensures that visually identical strings are represented consistently. NFC
        composes characters into their shortest form, while NFD decomposes them into base and combining
        parts. This is important for accurate comparisons because two strings can look the same but have
        different internal representations. For example, 'é' as a single code point or 'é' (base letter
        e plus combining acute accent) should be treated as equivalent in NFC normalization.
      difficulty: hard
