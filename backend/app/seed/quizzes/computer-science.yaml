    quiz:
    - prompt: Which of the following correctly describes how to isolate the lowest set bit in an integer
        `x`?
      explanation: The correct operation is `x & -x`, as it leaves everything below the lowest set bit
        unchanged and inverts everything above. This isolates the lowest set bit.
      options:
      - text: Using `x & (x - 1)` clears the lowest set bit.
      - text: Using `x & -x` isolates the lowest set bit.
        correct: true
      - text: Using `x >> 32` shifts the bits to isolate the lowest set bit.
      - text: Using `x / 2` divides by two, which is equivalent to shifting right.
    - prompt: Which of these operations correctly tests if an integer `x` has its 5th bit (from the right)
        set?
      explanation: The correct operation is `(x & 1 << 5) != 0`, as it masks the 6th bit (from the right,
        counting from 0) and tests if it's set.
      options:
      - text: (x & 1 << 5) != 0
        correct: true
      - text: (x | 1 << 5) == 0
      - text: (x ^ 1 << 5) == x
      - text: (x >> 5) & 1 != 0
    - prompt: Which of these statements about integer shifts in C++ is true?
      explanation: The correct statement is that signed left shift `x << k` always fills with zeros, as
        it does not change the sign of the number in two's complement representation.
      options:
      - text: Signed left shift `x << k` always fills with zeros.
        correct: true
      - text: Unsigned right shift `x >> k` always fills with ones.
      - text: Arithmetic right shift `x >> k` on a negative number rounds towards zero.
      - text: Logical right shift `x >>> k` on a negative number replicates the sign bit.
    interview:
    - question: Explain why using `x & (x - 1)` in a loop is an efficient way to count the number of set
        bits in an integer.
      answer_md: Using `x & (x - 1)` clears the lowest set bit each iteration, effectively reducing the
        problem size. This works because subtracting 1 from a binary number flips all the bits after the
        rightmost 1-bit, including the 1-bit itself. Thus, when you AND this with the original number,
        it clears the lowest 1-bit. The loop continues until `x` becomes zero, which means all set bits
        have been cleared, and the count of iterations gives the total number of set bits.
      difficulty: medium
    - question: Describe a scenario where using bit manipulation for file permissions would be beneficial
        over using a hash set to store these permissions.
      answer_md: Using bit manipulation for file permissions is beneficial when you need to perform operations
        on multiple flags efficiently. For example, checking if a user has read and write permissions
        can be done with `permissions & (1 << READ) & (1 << WRITE)` in constant time, whereas using a
        hash set would require iterating over the elements, which could take linear time. Additionally,
        bit manipulation allows for compact storage, as each permission is represented by a single bit,
        making it more memory-efficient compared to storing multiple booleans or strings.
      difficulty: hard
    - question: Why might `x >> 32` not behave as expected on a 32-bit system?
      answer_md: '`x >> 32` is undefined behavior in C and C++ when `x` is a 32-bit integer. In practice,
        it often results in the value of `x` being unchanged because shifting by the width of the type
        (32) modulo the width yields zero. This means that even though the operation appears to shift
        all bits off the top, the result might not be what you expect due to implementation-defined behavior.'
      difficulty: medium
