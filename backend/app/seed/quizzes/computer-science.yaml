concepts:
  computer-science-asymptotic-notation:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-22T16:08:27Z'
    quiz:
    - prompt: Which of the following is true about amortized analysis for a dynamic array that doubles
        in size when full?
      explanation: Using the potential method, we can show that each append operation has an amortized
        cost of Θ(1) by charging two credits for future resizes and one credit for the current element.
      options:
      - text: The amortized cost per append operation is O(n) because each append may require resizing.
      - text: The amortized cost per append operation is Θ(1) using the potential method with Phi = 2*(size
          - capacity/2).
        correct: true
      - text: The amortized cost per append operation is O(log n) due to the logarithmic number of resizes
          needed over time.
      - text: Amortized analysis cannot be applied to dynamic arrays because their size changes.
    - prompt: Which of the following recurrences would you solve using the Master Theorem?
      explanation: The Master Theorem applies to recurrences of the form T(n) = a*T(n/b) + f(n), where
        a and b are constants. Option D fits this form, while the others do not.
      options:
      - text: T(n) = 2T(n/3) + n^2
      - text: T(n) = T(n-1) + log n
      - text: T(n) = T(√n) + n
      - text: T(n) = 4T(n/2) + n
        correct: true
    - prompt: Which of the following scenarios would require an amortized analysis rather than just worst-case
        or average-case analysis?
      explanation: Amortized analysis is necessary when dealing with sequences of operations where some
        are cheap and others are expensive. Dynamic array resizing is a classic example that requires
        amortized analysis to determine the overall cost over many operations.
      options:
      - text: Determining the maximum number of operations required to sort a list.
      - text: Calculating the expected time for searching in a balanced binary search tree.
      - text: Analyzing the total cost of a sequence of operations that occasionally require expensive
          resizing, such as dynamic array allocations.
        correct: true
      - text: Finding the minimum number of comparisons needed in comparison-based sorting algorithms.
    interview:
    - question: Explain how you would use asymptotic notation to compare two sorting algorithms, one with
        O(n^2) and another with Θ(n log n), in terms of their efficiency as the input size grows.
      answer_md: When comparing two sorting algorithms using Big-O and Theta notations, we focus on the
        upper bound for the worst-case scenario (Big-O) and the tight bound for both average and worst
        cases (Theta). For an algorithm with O(n^2), this means that as the input size n grows, the running
        time will be at most proportional to n squared. In contrast, an algorithm with Θ(n log n) has
        a guaranteed upper and lower bound of n log n, meaning its performance is consistently better
        than O(n^2) for large inputs. Therefore, in terms of efficiency as the input size grows, the algorithm
        with Θ(n log n) would generally be preferred over one with O(n^2).
      difficulty: hard
    - question: Describe a situation where you might use amortized analysis instead of worst-case or average-case
        analysis. Provide an example and explain why.
      answer_md: Amortized analysis is useful when analyzing the cost of a sequence of operations, especially
        when some operations are cheap and others are expensive. For instance, consider a dynamic array
        that doubles in size when full. While individual insertions might occasionally require costly
        resizing, amortized analysis can show that each insertion operation has an average cost of O(1)
        over many operations. This is because the cost of resizing is spread out over multiple insertions,
        making it more efficient than analyzing just the worst-case scenario for each operation.
      difficulty: hard
    - question: Provide a real-world example where asymptotic analysis might lead to an incorrect conclusion
        about algorithm performance. Explain why this happens and how you would address it in practice.
      answer_md: Asymptotic analysis often ignores constant factors, which can be significant for small
        input sizes or specific hardware configurations. For instance, insertion sort has a worst-case
        time complexity of O(n^2), but it performs well on small lists due to lower constant factors compared
        to more complex algorithms like merge sort. In practice, you would need to consider both asymptotic
        behavior and empirical performance data to make informed decisions about which algorithm to use
        in different scenarios. For example, for input sizes below a certain threshold, insertion sort
        might outperform merge sort despite its higher Big-O complexity.
      difficulty: hard
  computer-science-back-tracking:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-22T16:18:33Z'
    quiz:
    - prompt: In backtracking, why is it crucial to undo a choice (un-choose) after exploring a path?
      explanation: It is crucial to undo a choice because `path` and `used` are shared across every branch
        below this node. Missing one un-choose step can corrupt sibling branches, far from the line of
        code that caused it.
      options:
      - text: To avoid creating redundant copies of the state
      - text: To ensure that the algorithm can backtrack and explore other paths
        correct: true
      - text: To prevent memory leaks from deep copying states
      - text: To make sure that all nodes in the tree are visited
    - prompt: Which type of pruning is always worth implementing in backtracking algorithms?
      explanation: Feasibility pruning rejects a partial solution that already violates a constraint,
        making it cheap and always worth implementing.
      options:
      - text: Feasibility pruning
        correct: true
      - text: Bound-based pruning
      - text: Constraint propagation
      - text: Iterative deepening
    - prompt: In the context of backtracking for solving Sudoku puzzles, which technique would most likely
        be used to reduce the number of branches explored?
      explanation: Constraint propagation in Sudoku involves filling cells that have only one candidate,
        which reduces the number of branches by eliminating impossible choices early.
      options:
      - text: Sorting the input array before processing
      - text: Using three boolean arrays to track column, diagonal and row constraints
      - text: Applying constraint propagation by deducing consequences before branching
        correct: true
      - text: Implementing iterative deepening with a growing limit
    - prompt: In a knapsack problem using branch and bound, what type of bound would you compute to prune
        unpromising branches?
      explanation: For a knapsack problem, you would compute the fractional-knapsack value of the remaining
        items to determine if further exploration is worthwhile.
      options:
      - text: The fractional-knapsack value of the remaining items
        correct: true
      - text: The total weight of the current solution
      - text: The number of items left in the knapsack
      - text: The sum of the cheapest incident edges for unvisited vertices
    interview:
    - question: Explain how feasibility pruning works in backtracking and provide an example.
      answer_md: Feasibility pruning rejects a partial solution that already violates a constraint. For
        instance, in the N-queens problem, if you place a queen on a square that is under attack by another
        queen, you can immediately prune this path because it cannot lead to a valid solution.
      difficulty: medium
    - question: Describe how bound-based pruning works in branch and bound for the Travelling Salesman
        Problem (TSP).
      answer_md: Bound-based pruning in TSP involves computing an optimistic estimate of the best achievable
        completion from a given node. For example, you can sum over the unvisited vertices the cheapest
        incident edges to get a lower bound on the cost of any path that includes these vertices. If this
        lower bound is higher than the current best solution (incumbent), you can prune the branch.
      difficulty: hard
  computer-science-balanced-search-trees:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-22T16:15:24Z'
    quiz:
    - prompt: Why might you choose an AVL tree over a red-black tree for a particular application?
      explanation: AVL trees provide a stricter balance guarantee with a guaranteed height of approximately
        1.44 log n, making the performance more predictable.
      options:
      - text: AVL trees have a simpler implementation
      - text: AVL trees guarantee a height of 1.44 log n, which is more predictable
        correct: true
      - text: Red-black trees are not suitable for concurrent access
      - text: Red-black trees use less memory
    - prompt: In which scenario would you prefer using a B+ tree over a B-tree?
      explanation: B+ trees are preferred when fast range scans and sequential access are needed, as they
        keep all leaf nodes at the same level.
      options:
      - text: When you need to store a large number of keys in memory
      - text: When you require fast range scans and sequential access
        correct: true
      - text: When the fan-out is not critical for performance
      - text: When disk I/O operations are infrequent
    - prompt: What is the primary reason for choosing a skip list over other balanced tree structures?
      explanation: Skip lists are simpler to implement for concurrent access because they do not use rotations,
        making them easier to manage in a multi-threaded environment.
      options:
      - text: It provides faster insertions and deletions
      - text: It uses less memory due to its probabilistic structure
      - text: It simplifies concurrent access by avoiding rotations
        correct: true
      - text: It supports more complex queries like order statistics
    interview:
    - question: Explain the difference between AVL and red-black trees in terms of their balance strategies
        and performance characteristics.
      answer_md: AVL trees maintain a stricter balance by ensuring that the heights of the two child subtrees
        of any node differ by at most one. This results in a more predictable height of approximately
        1.44 log n, but it requires more frequent rotations during insertions and deletions. Red-black
        trees use a different approach with color constraints to ensure that no path is more than twice
        as long as any other, leading to a height bound of 2 log(n+1). This allows for fewer rotations
        per update, making red-black trees suitable for scenarios where updates are frequent.
      difficulty: hard
    - question: How would you choose between a hash table and a balanced tree (like B-tree or AVL) for
        an application that requires fast lookups but also needs to maintain order of keys?
      answer_md: 'For applications requiring fast lookups, a hash table is generally more suitable due
        to its O(1) average-case time complexity. However, if the application also needs to maintain the
        order of keys or perform range queries, a balanced tree like B-tree would be more appropriate.
        The choice depends on the specific access patterns: use a hash table for unordered key-value lookups
        and a balanced tree for ordered operations.'
      difficulty: medium
    - question: Describe how you would implement an order-statistic tree using a B-tree, and explain why
        this augmentation is useful.
      answer_md: To implement an order-statistic tree using a B-tree, you can store the size of each subtree
        in its root node. This allows for efficient computation of the k-th smallest key or the number
        of keys below a given value. By maintaining these sizes during rotations and insertions, you can
        answer such queries in O(log n) time. This augmentation is useful because it enables operations
        like order statistics without significantly impacting the height of the tree.
      difficulty: hard
  computer-science-basic-math-skills:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-22T16:03:11Z'
    quiz:
    - prompt: Which of the following is a common mistake when using induction in proofs?
      explanation: Assuming the statement to be proven as part of the proof itself is a circular reasoning
        mistake and can lead to incorrect conclusions. Induction should not rely on what it aims to prove.
      options:
      - text: Proving the base case but not the inductive step.
      - text: Assuming the statement to be proven as part of the proof itself (circular reasoning).
        correct: true
      - text: Using a different variable for the inductive hypothesis than the one used in the conclusion.
      - text: Failing to check the base case for small values.
    - prompt: Which of the following statements about modular arithmetic is true?
      explanation: The result of `a mod n` is always less than or equal to `n`, and it can be exactly
        `n` when `a` is a multiple of `n`. This property ensures that the remainder is within the range
        `[0, n-1]`.
      options:
      - text: Modular arithmetic only works with prime numbers.
      - text: The result of `a mod n` is always less than `n`.
        correct: true
      - text: Euclid's algorithm can be used to find the greatest common divisor (gcd) of two numbers,
          but not their least common multiple (lcm).
      - text: Modular arithmetic cannot handle negative numbers.
    - prompt: Which of the following is a common mistake when proving statements in discrete mathematics?
      explanation: Proving the converse is a common mistake because it does not prove the original statement.
        The correct approach is to prove 'if P then Q' directly, not its converse or contrapositive.
      options:
      - text: Proving the converse instead of the original statement
        correct: true
      - text: Assuming independence between correlated events
      - text: Using strong induction without a base case
      - text: Treating tests as proof
    - prompt: Which of the following best describes why modular arithmetic is important in cryptography?
      explanation: Modular arithmetic, particularly with prime moduli, is crucial in cryptography because
        it makes certain operations (like multiplication) tractable but keeps others (like factoring large
        numbers) computationally hard, which underpins algorithms like RSA.
      options:
      - text: It provides a way to perform fast multiplication operations.
      - text: It is used to generate random numbers for secure communication.
      - text: It underpins algorithms like RSA by making factoring difficult while keeping multiplication
          easy.
        correct: true
      - text: It simplifies the implementation of hash functions.
    interview:
    - question: Explain how you would use induction to prove the correctness of a binary search algorithm.
      answer_md: 'To prove the correctness of a binary search algorithm using induction, we need to establish
        two things: the base case and the inductive step. The base case is when the list has only one
        element, which is trivially correct because it will return that single element if it matches the
        target value or indicate that the target does not exist otherwise. For the inductive step, assume
        the algorithm works for a list of length `n`. Then consider a list of length `2n`, and show that
        by dividing this list into two halves (one of which must contain the target), we can apply the
        same logic as before to each half. This ensures that if one half contains the target, the search
        will correctly narrow down the range; otherwise, it will continue on the other half. The inductive
        step confirms that the algorithm maintains its correctness for any list size.'
      difficulty: hard
    - question: How would you use linearity of expectation to calculate the expected number of collisions
        in a hash table with `n` keys and `m` buckets?
      answer_md: To calculate the expected number of collisions using linearity of expectation, we first
        consider each pair of keys. The probability that any two specific keys collide is `1/m`, since
        there are `m` possible slots for one key to hash into, and only one of them would cause a collision
        with the other key. Since there are `n(n-1)/2` such pairs (assuming `n > 1`), we can use linearity
        of expectation to sum these probabilities over all pairs. The expected number of collisions is
        thus `(n(n-1)/2) * (1/m)`, which simplifies to `(n^2 - n)/(2m)`. This approach avoids the complexity
        of counting all possible collision scenarios directly.
      difficulty: hard
    - question: Discuss the implications of treating tests as proof in algorithm correctness arguments.
      answer_md: Treating tests as proof is a common mistake because passing test cases only confirms
        that the algorithm works for the specific inputs tested, not necessarily for all possible inputs.
        Tests can confirm the absence of bugs for the scenarios considered but do not provide a general
        guarantee of correctness. To truly prove an algorithm's correctness, one must use formal methods
        such as loop invariants and induction to cover all possible cases. Tests are valuable for identifying
        errors and edge cases but should be complemented with rigorous mathematical proofs to ensure that
        the algorithm behaves correctly under all conditions.
      difficulty: hard
  computer-science-bitwise-operators:
