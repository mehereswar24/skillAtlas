    - prompt: What is the primary reason for using an LRU (Least Recently Used) eviction policy in a cache?
      explanation: LRU is used to minimize the number of cache misses by evicting the least recently used
        items first. This policy helps maintain a high hit ratio and ensures that frequently accessed
        data remains in the cache.
      options:
      - text: To ensure that all data remains fresh and up-to-date.
      - text: To minimize the number of cache misses by evicting less frequently used items first.
        correct: true
      - text: To simplify the implementation of the cache.
      - text: To increase the size of the cache.
    - prompt: Which of the following scenarios would most likely lead to a cache stampede?
      explanation: When a hot key expires and many threads access it simultaneously, causing a stampede.
        This can be mitigated by using request coalescing or jittered TTLs to ensure that not all threads
        hit the origin at once.
      options:
      - text: A single thread accessing a rarely used key.
      - text: Many threads accessing a hot key after its TTL has expired.
