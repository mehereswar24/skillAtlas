        protocols like MESI.
      answer_md: 'A CPU cache is divided into cache lines, each typically 64 bytes. An address split includes
        an offset within the line, an index selecting a *set*, and a tag compared against the lines in
        that set. Real caches are usually set-associative with multiple ways per set, meaning a line can
        be stored in any of those slots. MESI (Modified, Exclusive, Shared, Invalid) is a coherence protocol
        used across cores to manage cache ownership: a core takes exclusive ownership before writing,
        and other cores see the data as invalid until it''s shared.'
