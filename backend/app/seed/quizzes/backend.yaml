    - prompt: Which strategy is recommended for handling retries in background job processing?
      explanation: Exponential backoff with jitter and a maximum number of attempts is recommended to
        avoid thundering herds and ensure retries are not retried too frequently.
      options:
      - text: Immediate retry with exponential backoff
      - text: Exponential backoff with jitter and a maximum number of attempts
        correct: true
      - text: Linear backoff without any jitter or ceiling
      - text: Randomly retrying jobs at different intervals
    - prompt: Why is idempotency crucial in background job processing?
      explanation: Idempotency ensures that retrying a job does not cause duplicate side effects, such
        as charging a customer's card twice.
      options:
      - text: To ensure that jobs can be safely retried without causing duplicate side effects
        correct: true
      - text: To make sure that each job is processed exactly once, even if it fails and retries
      - text: To allow for easier debugging of failed jobs
      - text: To reduce the amount of data stored in the queue
    - prompt: How should long-running jobs be designed to handle interruptions during deployment?
      explanation: Long-running jobs should be designed to handle `SIGTERM` by finishing or abandoning
        the current job within the shutdown grace period, allowing for safe interruptions during deployment.
      options:
      - text: By pausing the job and restarting it after deployment
      - text: By saving progress periodically and handling SIGTERM signals to finish or abandon safely
        correct: true
      - text: By terminating the job immediately without saving any state
      - text: By ignoring SIGTERM signals and continuing execution
    interview:
    - question: Explain how you would design a background job system that handles retries with backoff
        and jitter.
      answer_md: To handle retries with backoff and jitter, I would implement an exponential backoff strategy
        where the initial delay is one second, doubling each time until reaching a maximum. Jitter can
        be added to randomize the retry intervals slightly to avoid thundering herds. This approach ensures
        that jobs are retried in a controlled manner without overwhelming the system during transient
        failures.
      difficulty: medium
    - question: Describe how you would ensure idempotency for a background job that charges a customer's
        card.
      answer_md: To ensure idempotency, I would use an idempotency key to guard the charge operation.
        Each request would include a unique identifier (e.g., a UUID) in the payload or headers. The worker
        would check if this key already exists before performing the charge. If it does, the job would
        be skipped, preventing duplicate charges. Additionally, I would use a transactional write to record
        the success of the charge, ensuring that even if the job is retried, the customer's card is only
        charged once.
      difficulty: medium
    - question: How would you handle scheduled work in a distributed system where multiple instances could
        potentially fire jobs at the same time?
      answer_md: To handle scheduled work in a distributed system, I would use a scheduler that enqueues
        one job onto a shared queue. This approach leverages existing retry and visibility mechanisms
        for background jobs. The workers then process these jobs according to their normal semantics,
        ensuring that only one instance of the job runs at a time even if multiple instances are running.
        This method reuses the infrastructure already in place for handling retries and dead-letter jobs.
      difficulty: hard
