    - prompt: What is a key reason for using structured logs over unstructured ones?
      explanation: Structured logs can be filtered and aggregated, making it easier to analyze large volumes
        of data.
      options:
      - text: To make them easier to read by humans
      - text: To allow filtering and aggregation of log data
        correct: true
      - text: To ensure that every log line contains the same correlation id
      - text: To increase the verbosity of logging
    - prompt: Why should you alert on symptoms rather than causes?
      explanation: Alerting on symptoms ensures that only users who experience the problem get notified,
        reducing unnecessary paging.
      options:
      - text: Because users care about the underlying cause of an issue
      - text: To reduce pager fatigue and ensure alerts are actionable
        correct: true
      - text: To make it easier to debug issues in production
      - text: Because causes can be easily determined from logs
    - prompt: What is a cardinality issue in metrics?
      explanation: High cardinality can lead to an explosion in the number of time series, making it difficult
        for the metrics system to handle.
      options:
      - text: When you have too many unique values for a label
        correct: true
      - text: When your metrics system runs out of memory
      - text: When you use too many different types of metrics
      - text: When your metric aggregation is not accurate
    - prompt: What should be the first question asked when starting an incident?
      explanation: The first question should be about whether there was a recent deployment, as most incidents
        are caused by new code.
      options:
      - text: What is the root cause of the issue?
      - text: Did this start with a deploy?
        correct: true
      - text: Why are users experiencing issues?
      - text: How can we fix it quickly?
    interview:
    - question: Can you explain the difference between logs, metrics, and traces in observability?
      answer_md: Logs provide discrete events with context, while metrics offer cheap numeric aggregates
        over time. Traces connect the work of one request across services. Logs are structured to allow
        filtering and aggregation, metrics help monitor performance, and traces show where time is spent.
      difficulty: hard
    - question: How can you ensure your observability setup is usable in an incident?
      answer_md: Ensure there are links from alerts to service dashboards, exemplar traces of failing
        requests, and logs for specific requests. Version and deploy markers on dashboards help identify
        changes that might have caused the issue.
      difficulty: hard
