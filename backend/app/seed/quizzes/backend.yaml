        they function correctly with predefined inputs and expected outcomes. Integration testing, on
        the other hand, verifies how these components interact with each other to ensure they work together
        as intended. Unit tests are typically automated and performed by developers during coding, while
        integration tests check for issues like data mismatches that unit tests might miss.
      difficulty: medium
    - question: How would you approach testing a new feature in your application?
      answer_md: To test a new feature, I would start with unit testing to ensure the individual components
        of the feature work as expected. Then, I would perform integration testing to verify how these
        components interact and function together. Finally, functional testing would be conducted to ensure
        the feature meets its functional requirements from an end-user perspective. This approach ensures
        that all aspects of the new feature are thoroughly tested before deployment.
      difficulty: hard
    - question: What are some common challenges when performing integration testing?
      answer_md: Common challenges in integration testing include ensuring proper data flow between components,
        handling complex interactions like database transactions and API calls, and dealing with third-party
        services. These can lead to issues such as data mismatches or protocol errors that might not be
        caught by unit tests alone. Effective communication among developers and thorough planning are
        key to overcoming these challenges.
      difficulty: hard
