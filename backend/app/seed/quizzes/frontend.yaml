      answer_md: Using a short-lived access token and a long-lived refresh token is a common strategy
        to balance security and usability. The short-lived access token ensures that even if an attacker
        gains possession of it, they cannot use it for long. The longer-lived refresh token can be tracked
        server-side, allowing the server to invalidate the family of tokens when necessary. This approach
        avoids the need for un-issuance of JWTs, which is not possible once issued.
      difficulty: medium
    - question: How does the `BroadcastChannel` or `storage` event help in managing session state across
        multiple browser tabs?
      answer_md: The `BroadcastChannel` or `storage` event can be used to notify other tabs that a user
        has logged out. When a tab logs out, it can broadcast this information through a `BroadcastChannel`,
        and other tabs listening for the channel will receive the notification and clear their local state.
        This ensures that even if one tab is still showing a signed-in state, all other tabs are aware
        of the logout event.
      difficulty: hard
