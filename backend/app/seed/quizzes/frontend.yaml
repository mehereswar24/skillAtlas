        correct: true
      - text: Reduced dependency between packages
      - text: Improved performance of individual applications
      - text: Better code organization
    - prompt: Which approach is recommended for large-scale frontend migrations?
      explanation: The strangler pattern, paired with codemods, is recommended for large-scale migrations
        as it allows gradual adoption.
      options:
      - text: Big-bang rewrites to ensure consistency
      - text: Codemods and a strangler pattern to route traffic gradually
        correct: true
      - text: Implementing micro-frontends immediately across the application
      - text: Rebuilding the entire codebase from scratch
    interview:
    - question: Explain how you would use a monorepo with workspaces and task graphs in a large frontend
        project.
      answer_md: In a large frontend project, using a monorepo with workspaces can simplify dependency
        resolution across packages. However, the primary challenge is managing CI time, which can be addressed
        by implementing a task graph that hashes inputs and reuses outputs locally and shared across the
        team and CI. This allows for faster builds when changes have been made to dependencies.
      difficulty: medium
    - question: Discuss the trade-offs between micro-frontends and a modular monolith with enforced boundaries.
      answer_md: Micro-frontends are useful in scenarios where teams need to deploy independently of each
        other, but they come with costs such as duplicated framework runtimes, version skew, cross-application
        state management issues, and performance challenges. A modular monolith with enforced boundaries
        can be more maintainable and easier to reason about, especially if the organisational constraints
        that micro-frontends address are not present.
      difficulty: hard
    - question: How would you handle a large legacy codebase using the strangler pattern?
      answer_md: The strangler pattern involves routing one subtree of the application to the new implementation,
        running old and new versions side by side, migrating slices incrementally, and deleting the old
        path once it is no longer used. This approach allows for controlled migration without disrupting
        ongoing development. Codemods can be used to automate mechanical portions of the migration.
      difficulty: hard
