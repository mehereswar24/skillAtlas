concepts:
  frontend-accessibility:
    generated_by: nvidia/nemotron-3-super-120b-a12b:free
    verified_at: '2026-08-23T12:12:17Z'
    quiz:
    - prompt: When should you avoid using a positive tabindex value on an element?
      explanation: A positive tabindex jumps the element ahead of the entire document, breaking the logical
        tab order defined by the DOM, so it should never be used when you intend to follow the natural
        order.
      options:
      - text: When you want the element to receive focus only via script.
      - text: When you want the element to be part of the natural tab order.
        correct: true
      - text: When you need to move focus to a dialog after it opens.
      - text: When you want the element to be skipped entirely by keyboard navigation.
    - prompt: Why is it problematic to add aria-label='Submit' to a button that already displays the visible
        text 'Send'?
      explanation: The accessible name algorithm gives aria-label higher priority than the button’s own
        text, so the name becomes 'Submit' while the visible label stays 'Send'; voice‑control users who
        say what they see will not activate the button.
      options:
      - text: Because aria-label is ignored when the element has inner text, so the label has no effect.
      - text: Because the accessible name computed from aria-label overrides the visible text, causing
          a mismatch for voice‑control users.
        correct: true
      - text: Because aria-label can only be used on elements that have no visible content.
      - text: Because the button will lose its native role and become non‑focusable.
    - prompt: According to the first rule of ARIA, what is the primary effect of adding ARIA attributes
        to an element?
      explanation: ARIA’s role is to describe the element (role, name, states) but does not alter its
        inherent keyboard behavior; developers must still ensure the element is operable.
      options:
      - text: It changes both the element’s appearance and its keyboard behavior.
      - text: It changes only how the element is described to assistive technology, not how it behaves.
        correct: true
      - text: It makes the element focusable regardless of its native tabindex value.
      - text: It removes the need to provide an accessible name for interactive elements.
    - prompt: What contrast ratio does WCAG 2.2 AA require for normal text and for large text (approximately
        24 px or 18.66 px bold)?
      explanation: AA specifies a minimum of 4.5:1 contrast for regular‑size text and 3:1 for large‑scale
        text and UI component boundaries.
      options:
      - text: 4.5:1 for normal text and 3:1 for large text.
        correct: true
      - text: 3:1 for normal text and 4.5:1 for large text.
      - text: 5:1 for both normal and large text.
      - text: 7:1 for normal text and 5:1 for large text.
    - prompt: Why should a developer not rely solely on an automated accessibility scanner to declare
        a page accessible?
      explanation: Automated tools are good at objective checks like contrast and missing attributes,
        but they cannot judge logical focus sequence or whether alternative text truly conveys the image’s
        purpose, which needs human review.
      options:
      - text: Because scanners can detect every WCAG 2.2 AA criterion, including focus order and meaningful
          alt text.
      - text: Because scanners reliably catch contrast, missing alt text, and missing names but cannot
          assess focus order or the meaningfulness of alt text.
        correct: true
      - text: Because scanners require a mouse to be plugged in to function correctly.
      - text: Because scanners only work with Chrome DevTools and not with Firefox or Safari.
    interview:
    - question: Explain why integrating accessibility considerations into the markup phase, rather than
        treating them as a later audit, reduces overall development cost.
      answer_md: When accessibility is addressed while writing HTML, the semantic elements already provide
        correct roles, names, and keyboard behavior for free, so little extra work is needed. If you wait
        until after the structure is set, you must retrofit attributes, tabindex, and ARIA, which often
        requires changing already‑hardened DOM decisions and can introduce bugs. Early integration also
        catches problems like missing labels or focus order before CSS and JavaScript are layered on,
        reducing rework and testing effort. Consequently, the defect count is lower and the effort to
        fix issues is far less than a post‑hoc audit.
      difficulty: medium
    - question: Describe how you would make a custom composite widget (like a tab panel) keyboard‑operable
        using tabindex and focus management, including when to use tabindex='0' and tabindex='-1'.
      answer_md: Place each tab in the natural tab order by giving it tabindex='0' so users can reach
        them with Tab. When a tab is selected, use script to move focus to the associated panel, which
        you keep out of the tab order with tabindex='-1' until it becomes visible. Inside the panel, manage
        focus with arrow keys or Tab as appropriate, and when the panel hides, return focus to the triggering
        tab. This approach ensures that keyboard users can navigate the widget predictably without getting
        trapped.
      difficulty: medium
    - question: Summarize the five rules of ARIA and explain why the first rule—preferring native elements—is
        considered the most important.
      answer_md: 'The five rules are: 1) prefer a native element over ARIA; 2) do not change native semantics;
        3) every ARIA control must be keyboard‑operable; 4) do not apply role=''presentation'' or aria-hidden=''true''
        to a focusable element; 5) every interactive element needs an accessible name. The first rule
        is most important because native HTML elements already have the correct role, name, states, and
        built‑in keyboard behavior; using them avoids the risk of breaking behavior and reduces the amount
        of ARIA you need to write and test.'
      difficulty: medium
