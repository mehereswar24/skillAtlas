  frontend-async-javascript:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-22T15:50:21Z'
    quiz:
    - prompt: What is the correct order of execution for the following code snippet?
      explanation: The correct order is A, B, C, D. `console.log('A')` runs first as a task, then the
        microtask queue is drained, running `Promise.resolve().then(() => console.log('C'))`. Next, `callback()`
        (which could be anything) runs and finally `setTimeout(() => console.log('D'), 0)` runs after
        all pending microtasks.
      options:
      - text: console.log('A'); setTimeout(() => console.log('D'), 0); Promise.resolve().then(() => console.log('C'));
          callback();
      - text: callback(); console.log('A'); Promise.resolve().then(() => console.log('C')); setTimeout(()
          => console.log('D'), 0);
      - text: console.log('A'); callback(); Promise.resolve().then(() => console.log('C')); setTimeout(()
          => console.log('D'), 0);
      - text: console.log('A'); Promise.resolve().then(() => console.log('C')); callback(); setTimeout(()
          => console.log('D'), 0)
        correct: true
    - prompt: What is the purpose of using `Promise.race` in asynchronous programming?
      explanation: The purpose of `Promise.race` is to settle with the first promise that settles, whether
        it's fulfilled or rejected. This allows for early termination and handling of the first result.
      options:
      - text: To run multiple promises concurrently and wait for all of them to resolve before proceeding.
      - text: To execute a promise only after a specified timeout, even if it hasn't resolved yet.
      - text: To handle partial failures by resolving with the status and value-or-reason of each input
          promise.
      - text: To settle with the first promise that settles in either direction (fulfilled or rejected),
          allowing for early termination.
        correct: true
    - prompt: What is the expected output of this code snippet?
      explanation: The correct order is A B C D because the console.log statements are synchronous, followed
        by the microtask Promise.then call, and then the setTimeout callback.
      options:
      - text: A B C D
        correct: true
      - text: A D B C
      - text: D A B C
      - text: C B A D
    interview:
    - question: Explain how you would refactor a search box to ensure that stale responses are aborted
        when new keystrokes arrive.
      answer_md: To refactor a search box so that stale requests are aborted and only the most recent
        request is processed, I would use an `AbortController` for each search query. When a user types
        in the search box, I would create a new controller and pass it to the `fetch` call. If another
        keystroke arrives before the current request completes, I would abort the previous request using
        the old controller's signal. This ensures that only one request is active at any time, preventing
        stale responses from overwriting fresh results.
      difficulty: hard
    - question: Why does `setTimeout(fn, 0)` not run immediately or before an already-queued `.then` callback?
      answer_md: '`setTimeout(fn, 0)` schedules the function to be executed after all currently executing
        tasks and microtasks have completed. The event loop first runs any pending tasks (like a `Promise.then`),
        then drains the microtask queue. Therefore, `setTimeout(fn, 0)` cannot run immediately or before
        an already-queued `.then` callback because it must wait for the current task to complete.'
      difficulty: hard
    - question: Describe how you would use `Promise.allSettled` in a scenario where partial failure is
        acceptable but full success is not.
      answer_md: '`Promise.allSettled` can be used when you need to know the status of all promises, even
        if some fail. In a scenario where partial failure is acceptable but full success is not, `Promise.allSettled`
        would be useful because it returns an array of objects with each promise''s status and value or
        reason. You could then check for any rejections and handle them appropriately without the entire
        operation being marked as failed.'
      difficulty: medium
