    - prompt: What is the primary function of SMTP in email communication?
      explanation: SMTP is used for sending and relaying electronic mail between servers, primarily handling
        the outgoing transmission of messages.
      options:
      - text: To encrypt emails during transmission
      - text: To deliver emails to recipients' mail servers
        correct: true
      - text: To store emails on a server
      - text: To manage user accounts for email clients
    - prompt: Which cloud provider runs its services on the same infrastructure as its end-user products
        like Google Search and YouTube?
      explanation: Google Cloud is a suite of cloud computing services offered by Google that runs on
        the same infrastructure used internally for its end-user products, such as Google Search and YouTube.
      options:
      - text: AWS
      - text: Azure
      - text: IBM Cloud
      - text: Google Cloud
        correct: true
    interview:
    - question: Explain how DMARC works in protecting against email spoofing.
      answer_md: DMARC works by building upon SPF and DKIM standards. When an email is sent from a domain,
        the sender includes a DKIM signature that can be verified by receiving mail servers. If the domain
        has a DMARC policy set up, it instructs these servers on what to do if the email fails authentication
        (e.g., reject or quarantine). This helps prevent unauthorized senders from using the domain's
        name in their emails, reducing the risk of phishing and other spoofing attacks.
      difficulty: hard
    - question: Compare and contrast AWS and Azure cloud services. In what scenarios might a company prefer
        one over the other?
      answer_md: AWS is market-leading with over 200 services, global data centers, and broad adoption
        in DevOps practices. It offers scalable and cost-effective solutions across various operations
        like compute power, database storage, content delivery, etc. Azure provides a comprehensive cloud
        platform for building, deploying, and managing applications through its global network of data
        centers. It supports a wide range of services including computing, analytics, storage, and networking,
        making it suitable for organizations that need integrated tools to support their development workflows.
        A company might prefer AWS if they require more flexibility in scaling or cost-effectiveness,
        while Azure could be preferred for its comprehensive suite of services and integration capabilities.
      difficulty: hard
    - question: How does IMAP differ from POP3 in managing emails?
      answer_md: IMAP (Internet Message Access Protocol) allows users to access and manage their emails
        directly on the server, keeping messages synchronized across multiple devices. Because it stores
        mail on the server rather than downloading it locally, it provides a centralized way to organize
        folders, search content, and view the status of emails from anywhere. POP3 (Post Office Protocol
        version 3), on the other hand, downloads emails to the local device, making them unavailable on
        other devices until re-downloaded. IMAP is more suitable for users who need access to their emails
        from multiple devices, while POP3 is often preferred by those who primarily use a single device
        or want to delete messages after downloading.
      difficulty: hard
