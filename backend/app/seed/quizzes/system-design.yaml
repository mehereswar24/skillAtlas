    - prompt: Which of the following best describes Little's Law in the context of queues?
      explanation: Little's Law states that the average number of items in a system is equal to the arrival
        rate multiplied by the average time an item spends in the system. This directly impacts the wait
        time and queueing delay, especially as utilization approaches 100%.
      options:
      - text: It states that the average number of items in a system is proportional to the service rate
          divided by the arrival rate.
      - text: It asserts that the wait time in a queue is inversely proportional to the utilization of
          the system.
      - text: It indicates that the average number of items in a system equals the arrival rate times
          the average time an item spends in the system.
        correct: true
      - text: It claims that the service time increases as the queue depth decreases.
    - prompt: Why is it important to size consumer parallelism based on service time and target latency
