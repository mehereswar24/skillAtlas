concepts:
  system-design-99-9-availability-three-9s:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-22T16:35:46Z'
    quiz:
    - prompt: Which of the following statements is true regarding the nines table?
      explanation: Five nines availability does not mean no outages; it means an outage of less than 5.26
        minutes per year, which is so small that it's practically unnoticeable to users and requires automatic
        failover mechanisms.
      options:
      - text: Five nines availability means no outages in a year.
      - text: Four nines availability guarantees that 99.99% of user requests are successful every month.
      - text: Three nines availability equates to about 43 minutes of downtime per year, which is the
          same as saying it happens once every two months.
      - text: Two nines availability means a system will be down for approximately one day in a year.
        correct: true
    - prompt: Why might a team claiming five nines availability still experience significant user impact?
      explanation: A team claiming five nines availability may still experience significant user impact
        if they include human recovery time in their calculations, as five nines is only achievable with
        automatic failover and typically requires the failing component's absence to be invisible by design.
      options:
      - text: Because the five nines target guarantees no outages.
      - text: Because they are measuring availability from an incorrect perspective, such as including
          human recovery time in their calculations.
        correct: true
      - text: Because the five nines figure is only relevant for internal systems and not for end-user
          experiences.
      - text: Because the five nines table does not account for partial failures.
    - prompt: What does the distribution of outages matter more than the total availability percentage?
      explanation: The distribution of outages is critical because identical availability can lead to
        vastly different business impacts. For example, one long outage or many short ones can have very
        different effects on user experience and business operations.
      options:
      - text: The total availability is always a better measure for business impact.
      - text: Outage frequency and duration can significantly affect user experience, even if the overall
          availability looks good.
        correct: true
      - text: Partial failures are not visible in global SLIs, making them irrelevant.
      - text: Independent components ensure that outages will be distributed evenly.
    - prompt: Which of the following is a common mistake when using the nines table?
      explanation: Quoting a nines figure without specifying the measurement scope or window makes it
        unfalsifiable. This is a common mistake because it can lead to misleading claims about system
        reliability.
      options:
      - text: Quoting availability percentages without specifying the measurement scope or window.
        correct: true
      - text: Assuming that independent components are always reliable.
      - text: Ignoring outages that do not affect all users equally.
      - text: Focusing solely on full outages and ignoring partial failures.
    interview:
    - question: What are the two assumptions behind availability arithmetic that are usually wrong, and
        why are they problematic?
      answer_md: The first assumption is independence, which assumes components fail independently. In
        reality, real components share resources like power, network, deployment pipelines, configuration
        systems, and DNS providers, leading to correlated failures. The second assumption is prompt detection
        and recovery of failures. Redundancy only provides benefits if the failed component is detected
        and recovered promptly; otherwise, it offers far less than expected. These assumptions are problematic
        because they oversimplify real-world scenarios, potentially leading to incorrect predictions about
        system availability.
      difficulty: hard
    - question: How does the distribution of outages affect system reliability and user experience?
      answer_md: The distribution of outages can significantly affect both system reliability and user
        experience. While a high availability percentage might suggest that downtime is infrequent, it
        doesn't provide information about how often outages occur or their duration. A single long outage
        during peak usage times can have a much greater impact than multiple short outages spread throughout
        the year. Additionally, partial failures affecting specific subsets of users can be more damaging
        to user experience than complete outages for all users.
      difficulty: hard
    - question: Discuss the assumptions behind availability arithmetic and why they are often incorrect
        in real-world scenarios.
      answer_md: 'Availability arithmetic assumes two key things: that component failures are independent,
        and that failures are detected and recovered promptly. However, these assumptions are frequently
        incorrect. Components often share resources or infrastructure, leading to correlated failures
        rather than independent ones. Additionally, many systems fail to detect outages quickly, meaning
        the availability reported may be much lower in practice because users continue to experience downtime
        without realizing it. These factors mean that the calculated availability might not accurately
        reflect the actual user experience.'
      difficulty: hard
