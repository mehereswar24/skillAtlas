        the remaining regions, leading to performance degradation and potential service disruption.
      options:
      - text: Increased data transfer costs
      - text: Reduced read performance
      - text: Overload on surviving regions during a failure
        correct: true
      - text: Compromised security
    - prompt: What is the primary reason to choose partitioning by key over accepting concurrent writes
        anywhere?
      explanation: Partitioning by key avoids cross-region write conflicts, ensuring that no two regions
        write to the same record.
      options:
      - text: To avoid cross-region write conflicts
        correct: true
      - text: For global state management
      - text: To reduce data transfer costs
      - text: To simplify the routing layer
    - prompt: In an active-active system with natural per-user partitioning and a genuine latency requirement,
        what is the recommended approach?
      explanation: The notes recommend multi-region active-active for such systems as it provides the
        benefits of active-active while managing latency and partitioning.
      options:
      - text: Accept concurrent writes anywhere
      - text: Partition writes by key
      - text: Route all writes to one region
      - text: Multi-region active-active
        correct: true
    - prompt: What is a common mistake when implementing an active-active system without proper failover
        testing?
      explanation: Not testing regional failures can lead to a system that is less reliable than a single-region
        setup, as the added machinery may fail more often.
      options:
      - text: Choosing a conflict resolution strategy
      - text: Failing to test regional failure scenarios
        correct: true
      - text: Implementing global uniqueness constraints
      - text: Sizing regions with adequate failover headroom
    interview:
    - question: Explain why active-active deployment for reads is often chosen over other strategies despite
        its complexity.
      answer_md: Active-active deployment for reads is often chosen because it eliminates failover delay,
        reduces local latency by serving traffic from nearby regions, and ensures continuous testing of
        all regions. While it requires more complex management compared to routing writes to a single
        region, the benefits in terms of performance and reliability make it a preferred choice for many
        global consumer products.
      difficulty: hard
    - question: Discuss the challenges of implementing active-active deployment with global uniqueness
        constraints.
      answer_md: Implementing active-active deployment while ensuring global uniqueness constraints is
        challenging because these constraints need to be enforced across multiple regions. Without a centralized
        or consensus-based mechanism, conflicts can arise when writes occur in different regions for the
        same data. This requires careful design and often involves complex conflict resolution strategies,
        such as version vectors or application-level merging.
      difficulty: hard
    - question: What are some common mistakes teams make when adopting multi-region active-active deployments?
      answer_md: Teams commonly make several mistakes when adopting multi-region active-active deployments.
        These include not testing regional failures, lacking a conflict resolution policy, forgetting
        about global uniqueness constraints, failing to size regions with adequate failover headroom,
        and assuming replication lag is negligible. Additionally, teams often treat the global routing
        layer as infrastructure rather than recognizing it as the highest-risk component in the design.
      difficulty: hard
  system-design-active-passive:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-22T16:40:25Z'
    quiz:
    - prompt: What is the primary risk of promoting a standby without properly disabling the old primary
        node?
      explanation: Promoting a standby without disabling the old primary can lead to data divergence and
        split brain, where both nodes believe they are the primary.
      options:
      - text: Data divergence and potential split brain
        correct: true
      - text: Increased network traffic
      - text: Resource overutilization on the new primary
      - text: Unnecessary hardware usage
    - prompt: In an active-passive failover setup with two nodes, why cannot a failover occur if there
        is no witness or arbiter node?
      explanation: In a two-node cluster without a witness or arbiter node, each side sees exactly one
        node and cannot claim a majority.
      options:
      - text: Because the network partition makes it impossible to determine which node should be the
          primary
      - text: Because both nodes will always see each other and refuse to promote themselves
      - text: Because the lack of an odd number of members means neither can form a majority
        correct: true
      - text: Because the nodes are too similar in performance, leading to indecision
    - prompt: What is the main purpose of using fencing in an active-passive failover setup?
      explanation: Fencing is used to ensure that only one node can be promoted as the primary by disabling
        the old primary.
      options:
      - text: To ensure that only one node can be promoted as the primary
        correct: true
      - text: To speed up the failover process by changing DNS records
      - text: To increase network bandwidth during failover
      - text: To monitor the health of the standby node
    interview:
    - question: Can you explain why a two-node cluster cannot failover on its own and what solutions exist
        to address this issue?
      answer_md: In a two-node active-passive setup, each node sees exactly one other node. Therefore,
        neither can form a majority in a consensus-based system, making it impossible for either to claim
        the role of primary during a network partition. To solve this, you would need an arbiter or witness
        node that provides additional votes, ensuring that at least one node can always see a majority
        and thus promote itself as the new primary.
      difficulty: hard
    - question: How does STONITH (Shoot The Other Node In The Head) work in practice to prevent split
        brain scenarios?
      answer_md: STONITH involves forcibly disabling or shutting down the old primary node before promoting
        a new one. This can be done through various means such as powering off the node, revoking its
        storage access, or cutting its network connection. By doing so, you ensure that the old primary
        cannot continue to accept writes and hold client connections, thus preventing data divergence.
      difficulty: hard
    - question: What are some common mistakes organizations make when setting up active-passive failovers,
        and how can they be avoided?
      answer_md: Common mistakes include failing to implement proper fencing mechanisms, relying solely
        on DNS for redirection which can lead to caching issues, not keeping the standby warm and ready,
        and automatic failover that flaps between nodes during network instability. To avoid these, organizations
        should ensure robust fencing procedures are in place, use fast and reliable redirection methods
        like virtual IPs or proxies, maintain a warm standby, and add hysteresis and cooldown periods
        to prevent frequent failovers.
      difficulty: hard
  system-design-ap-availability-partition-tolerance:
