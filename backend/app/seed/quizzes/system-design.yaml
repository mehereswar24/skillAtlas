    - question: Explain how probabilistic early expiry can prevent stampede failures in a cache.
      answer_md: Probabilistic early expiry works by allowing each request to compute a small probability
        of refreshing the cache entry before its actual expiry time. This means that as an entry approaches
        its expiration, more requests will attempt to refresh it, spreading out the load over time. As
        a result, the likelihood of all concurrent requests hitting the database at once is reduced, preventing
        stampede failures.
