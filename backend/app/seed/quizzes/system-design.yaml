      explanation: Sizing consumer parallelism based on service time and target latency ensures that consumers
        can handle the workload without causing a backlog during peak times. This helps maintain the desired
        response time and user experience.
      options:
      - text: Because sizing by queue depth ensures that the system can handle bursts of work
      - text: Because sizing by service time and target latency helps prevent under-provisioned consumers
          from causing a backlog during peak times
        correct: true
      - text: Because it is easier to monitor and manage based on queue depth than on service time
      - text: Because consumer parallelism does not affect the overall performance of the system
    interview:
    - question: Discuss the trade-offs between different backpressure mechanisms when dealing with a producer
        that cannot push back due to being the public internet.
      answer_md: When the producer is the public internet, load shedding is the most appropriate mechanism.
        It involves rejecting a fraction of requests immediately and cheaply, providing clear signals
        like HTTP 429 or 503 with Retry-After. This approach keeps 80% of the system healthy while avoiding
        the pitfalls of over-provisioned consumers hitting other bottlenecks. Bounded queues, credit-based
        flow control, blocking the producer, and rate limiting at the edge are less suitable in this scenario
        due to their limitations or risks.
      difficulty: hard
    - question: How should consumer parallelism be sized for a system with variable service times and
        bursty arrivals?
      answer_md: Consumer parallelism should be sized based on the average service time and target latency,
        not just queue depth. This approach ensures that during peak loads, consumers can handle the increased
        workload without causing a backlog. Under-provisioning can lead to a growing backlog, while over-provisioning
        might result in hitting other bottlenecks like databases. Autoscaling should be done carefully,
        considering both arrival rate and service time to avoid exacerbating issues.
      difficulty: hard
    - question: How would you design a system to handle a variable arrival rate with backpressure and
        bounded queues?
      answer_md: To handle a variable arrival rate, I would use bounded queues that reject on full. This
        ensures that the producer is aware of when it should slow down or stop producing work. Additionally,
