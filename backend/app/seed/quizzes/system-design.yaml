    - question: How can you prevent 'penetration' in your cache?
      answer_md: To prevent penetration, you should implement negative caching with short TTLs. This means
        that when a request for a non-existent key misses the cache, the cache stores a negative result
        (indicating that the key does not exist) with a short TTL. Additionally, using a Bloom filter
        to quickly identify keys that definitely do not exist can help prevent unnecessary database queries.
      difficulty: medium
    - question: Describe how jittering TTLs can mitigate 'avalanche' in a cache.
      answer_md: Jittering TTLs involves adding a small random variation to the expiration time of each
        key. By doing so, keys will expire at slightly different times rather than all expiring simultaneously.
        This spreads out the load on the database and prevents a sudden spike in traffic. A simple implementation
        could involve adding or subtracting up to 10% from the TTL value.
