    quiz:
    - prompt: How does hinted handoff ensure eventual consistency in an AP system?
      explanation: Hinted handoff ensures eventual consistency by storing a hint on the substitute node
        that points to the correct replica. When the intended node returns, it receives these hints and
        updates its state accordingly.
      options:
      - text: By ensuring all nodes have the latest version of the data.
      - text: By replicating writes to multiple nodes before returning success.
      - text: By storing a hint on the substitute node that points to the correct replica, which is then
          used when the intended node becomes available again.
        correct: true
      - text: By using a consensus algorithm to decide which node should hold the data.
    - prompt: What is a potential downside of using read repair in an AP system?
      explanation: Read repair may not catch all divergences if reads are infrequent, as it only repairs
        data that is actually read. This means rarely-read data can stay divergent indefinitely.
      options:
      - text: It can lead to increased write latency.
      - text: It may not catch all divergences if reads are infrequent.
        correct: true
      - text: It requires complex consensus algorithms.
      - text: It guarantees linearizability.
    - prompt: Why might an application developer encounter a 'read-after-write' failure in an AP system?
      explanation: A 'read-after-write' failure occurs if a write operation immediately followed by a
        read returns the old value due to a partitioned network. This is because the system may not have
        propagated the new value to all nodes yet.
      options:
      - text: Because the system guarantees linearizability.
      - text: If a write operation immediately followed by a read returns the old value due to a partitioned
          network.
        correct: true
      - text: Due to incorrect implementation of hinted handoff.
      - text: Because all nodes have the same view of the data.
    - prompt: What mechanism does an AP system use to efficiently detect and reconcile small divergences
        in large datasets?
      explanation: AP systems use Merkle trees to efficiently detect and reconcile small divergences in
        large datasets. Merkle trees allow comparing two roots with one hash, and mismatches are narrowed
        by descending only the differing branches, making it a logarithmic effort.
      options:
      - text: Linearizable quorums.
      - text: Merkle trees used for comparing replicas.
        correct: true
      - text: Consensus algorithms.
      - text: Read repair mechanisms.
    interview:
    - question: Describe how hinted handoff and read repair work together in an AP system to ensure eventual
        consistency.
      answer_md: Hinted handoff works by storing a hint on the substitute node that points to the correct
        replica. When the intended node returns, it receives these hints and updates its state accordingly.
        Read repair ensures that if replicas disagree during a read, the stale ones are updated. Together,
        they ensure eventual consistency by making sure that data is eventually propagated to all nodes,
        even if it takes some time.
      difficulty: hard
    - question: Why might an application developer encounter a 'delete comes back' issue in an AP system?
      answer_md: In an AP system, deletes are recorded as tombstones rather than absences. If a replica
        misses the delete operation due to a partition, it will see its copy as newer than the absence
        and helpfully resurrect the record. This can lead to data inconsistencies where deleted records
        reappear in some replicas but not others.
      difficulty: hard
