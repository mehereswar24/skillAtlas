    - prompt: In an interview, what is the most common mistake candidates make when discussing complexity?
      explanation: The single most common error is stating a complexity without stating what it's a function
        of. 'O(n)' is meaningless without saying what n is — the array length, the number of distinct
        values, the graph's vertex count, or something else entirely.
      options:
      - text: Failing to state the complexity in terms of input size
        correct: true
      - text: Choosing the wrong data structure
      - text: Overcomplicating simple solutions
      - text: Not considering edge cases
    - prompt: What does Big-O notation ignore when describing an algorithm’s time complexity?
      explanation: Big-O describes an upper bound on that growth, ignoring constant factors and lower-order
        terms — which is why an O(n) algorithm with a huge constant can still be slower in practice than
        an O(n log n) one on realistic input sizes, even though asymptotically it 'wins.'
      options:
      - text: The input size
      - text: Constant factors and lower-order terms
        correct: true
      - text: The exact number of operations
      - text: The programming language used
    interview:
    - question: Explain why stating a complexity without specifying what n represents is a mistake.
      answer_md: Stating a complexity like 'O(n)' without specifying what n refers to (e.g., the array
        length, number of distinct values) can lead to misunderstandings. For example, if you say an algorithm
        has O(n) time complexity but don't clarify that n is the number of elements in a graph, it could
        be misinterpreted as having linear complexity with respect to some other variable.
      difficulty: medium
    - question: Describe how you would analyze the space complexity of an algorithm that uses recursion
        and memoization.
      answer_md: To analyze the space complexity of a recursive algorithm with memoization, I would first
        consider the maximum depth of the recursion tree. In this case, each level of recursion has O(1)
        work per call due to memoization, but the number of levels is determined by the input size n (e.g.,
        if halving the problem at each step, it's O(log n)). Additionally, I would account for the space
        used by the memoization table, which could be proportional to the input size. Thus, the overall
        space complexity would be O(n) due to the memoization table and O(log n) from recursion depth,
        making it O(n) in practice.
      difficulty: hard
    - question: How would you approach a problem that requires an algorithm with better than O(n^2) time
        complexity but has explicit constraints on space usage?
      answer_md: To address such a problem, I would first implement the brute-force O(n^2) solution to
        ensure it meets the basic requirements. Then, I would analyze the constraints and look for opportunities
        to optimize. For example, if the input is a graph, I might consider using a more efficient data
        structure like an adjacency list instead of an adjacency matrix. If space is limited, I could
        explore algorithms that use iterative techniques or in-place modifications to reduce memory usage
        while maintaining better time complexity. The key would be to balance between time and space efficiency,
        ensuring the solution meets both constraints.
      difficulty: hard
