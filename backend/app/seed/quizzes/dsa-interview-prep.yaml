# Concept quizzes and interview questions - dsa-interview-prep
#
# Generated by scripts/generate_quizzes.py against each concept's own
# content_md, then re-checked question by question against that same body;
# anything the body could not support was discarded. Loaded by
# app.seed.loader.seed_quizzes and keyed by concept slug.
#
# This file is authored content and belongs in git. Do not move it into
# app/seed/tracks/, which the roadmap.sh importer regenerates.

concepts:
  dsa-advanced-string-algorithms:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-21T14:07:20Z'
    quiz:
    - prompt: Which of the following algorithms precomputes a failure function to avoid re-examining already
        matched text characters?
      explanation: KMP precomputes a failure function to skip directly to the next position that could
        still match, without re-examining already matched text characters.
      options:
      - text: Rabin-Karp
      - text: KMP
        correct: true
      - text: Z-function
      - text: Manacher's algorithm
    - prompt: What is the primary advantage of using the Z-function over naive substring search?
      explanation: The Z-function computes the length of the longest substring starting at each position
        that matches a prefix of the string, allowing it to find all occurrences in O(n+m) time.
      options:
      - text: It uses less memory
      - text: It can find all occurrences in linear time
        correct: true
      - text: It is easier to implement
      - text: It handles collisions more effectively
    - prompt: Which algorithm is most likely to require multiple hash functions for production-quality
        implementations?
      explanation: Rabin-Karp uses a rolling hash and may require multiple hash functions to make collisions
        negligible in production.
      options:
      - text: KMP
      - text: Rabin-Karp
        correct: true
      - text: Z-function
      - text: Manacher's algorithm
    - prompt: In which scenario would you prefer using the naive substring search over advanced algorithms
        like KMP or Rabin-Karp?
      explanation: Naive substring search may be preferred when the pattern and text are both short, as
        advanced algorithms like KMP or Rabin-Karp have overhead that can make them slower in such cases.
      options:
      - text: When the text length is very large
      - text: When the pattern and text are both short
      - text: When performance guarantees are not critical
        correct: true
      - text: When multiple queries on the same text are required
    - prompt: What is a common mistake to avoid when implementing these string matching algorithms?
      explanation: Not verifying potential matches after a rolling hash comparison can lead to false positives,
        which must be explicitly checked.
      options:
      - text: Using a weak hash function for Rabin-Karp
      - text: Not verifying potential matches after rolling hash comparison
        correct: true
      - text: Failing to precompute the failure function in KMP
      - text: Overusing Manacher's algorithm
    interview:
    - question: Explain the difference between KMP and Rabin-Karp algorithms in terms of their approach
        to handling mismatches.
      answer_md: KMP uses a failure function to skip directly to the next position that could still match,
        without re-examining already matched text characters. In contrast, Rabin-Karp uses a rolling hash
        to quickly filter out positions that can't match and then verifies real matches character-by-character.
      difficulty: hard
    - question: Why is Rabin-Karp considered less favorable than other string matching algorithms in certain
        scenarios?
      answer_md: Rabin-Karp can produce false positives due to hash collisions, which require explicit
        verification. This overhead makes it less favorable when performance guarantees are critical or
        the text length and number of queries are large.
      difficulty: hard
  dsa-arrays:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-21T13:56:58Z'
    quiz:
    - prompt: What is a key advantage of using prefix sums over direct summation for subarray sum queries?
      explanation: Using prefix sums allows for constant-time range sum queries after a single pass through
        the array, making it more efficient than direct summation which requires O(n) operations per query.
      options:
      - text: Prefix sums require less memory.
      - text: Prefix sums allow for constant-time range sum queries after preprocessing.
        correct: true
      - text: Prefix sums can be computed in linear time.
      - text: Prefix sums are easier to implement.
    - prompt: In Kadane's algorithm, what is the correct action when the running sum becomes negative?
      explanation: Kadane's algorithm requires tracking the best sum ending at each position, resetting
        to the current element when the running sum goes negative. This ensures that negative contributions
        are ignored and only positive contributions are considered for the maximum subarray.
      options:
      - text: Reset the running sum to zero and continue.
      - text: Continue adding elements to the running sum hoping for a positive turn.
      - text: Reset the running sum to the current element and keep track of the maximum sum seen so far.
        correct: true
      - text: Stop the algorithm as it indicates an error in the input.
    - prompt: How can you efficiently find duplicates in an array using O(1) extra space?
      explanation: Marking visited values by negating or offsetting them in place is an efficient way
        to find duplicates without using extra space. This method uses the array itself as a hash set,
        making it O(1) extra space.
      options:
      - text: By sorting the array and then scanning for adjacent equal elements.
      - text: Using a hash set to store seen values.
      - text: Marking visited values by negating or offsetting them in place.
        correct: true
      - text: Applying Kadane's algorithm on the array.
    - prompt: What is the time complexity of Kadane's algorithm?
      explanation: Kadane's algorithm runs in linear time, O(n), by iterating through the array once and
        maintaining a running sum.
      options:
      - text: O(n^2)
      - text: O(log n)
      - text: O(n)
        correct: true
      - text: O(n log n)
    interview:
    - question: Explain how you would use prefix sums to solve the problem of finding subarrays with a
        given sum.
      answer_md: To find subarrays with a given sum using prefix sums, first compute the prefix sum array.
        Then, for each starting index i, check if there exists an ending index j such that the difference
        between the prefix sums at j and i equals the target sum. This can be done in O(n) time by maintaining
        a hash map of prefix sums to their indices.
      difficulty: medium
    - question: Describe how you would implement Kadane's algorithm for an array with both positive and
        negative numbers, including edge cases like all elements being negative.
      answer_md: Kadane's algorithm works by iterating through the array while maintaining a running sum.
        If the running sum becomes negative, it is reset to the current element because any previous negative
        contributions would only decrease the maximum subarray sum. If all numbers are negative, Kadane's
        algorithm still correctly identifies the least-negative number as the best subarray sum.
      difficulty: hard
    - question: Given a 2D matrix, how would you implement an in-place solution to rotate it by 90 degrees?
      answer_md: To rotate a 2D matrix in place, first transpose the matrix (swap rows with columns) and
        then reverse each row. This approach works because transposing swaps elements across the diagonal
        while reversing each row effectively rotates the matrix clockwise by 90 degrees.
      difficulty: medium
  dsa-binary-search:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-21T13:57:38Z'
    quiz:
    - prompt: Which of the following scenarios would allow you to use binary search on an array that is
        not necessarily sorted?
      explanation: Binary search on the answer can be used when you are searching for a value that defines
        a monotonic predicate over a range of possible answers, such as minimizing the maximum pages assigned
        to any student. This is not limited to sorted arrays but can be applied to other scenarios where
        the answer space is well-defined.
      options:
      - text: Finding the first occurrence of a target value in a rotated sorted array.
      - text: Counting how many times a specific number appears in a sorted array using lower_bound/upper_bound.
      - text: Allocating books to minimize the maximum pages assigned, where the answer space is monotonic.
        correct: true
      - text: Searching for an exact match in a partially sorted array.
    - prompt: What is the most common implementation bug in binary search that can lead to infinite loops?
      explanation: Using `lo = mid` and `hi = mid - 1` without adjusting the loop condition can lead to
        infinite loops. The correct template uses `mid = lo + (hi - lo) / 2`, `while lo <= hi`, and updates
        either `lo = mid + 1` or `hi = mid - 1` consistently.
      options:
      - text: Using `lo = mid` and `hi = mid - 1` without adjusting the loop condition.
        correct: true
      - text: Using `while lo < hi` instead of `while lo <= hi`.
      - text: Using `(lo + hi) / 2` for midpoint calculation to avoid integer overflow.
      - text: Incorrectly updating the search space by not properly halving it.
    - prompt: Why does using `(lo + hi) / 2` for midpoint calculation potentially cause issues?
      explanation: Using `(lo + hi) / 2` can lead to integer overflow in languages with fixed-width integers,
        whereas using `lo + (hi - lo) / 2` avoids this issue and provides a consistent way to calculate
        the midpoint.
      options:
      - text: It can lead to incorrect loop termination conditions.
      - text: It may result in integer overflow in languages with fixed-width integers.
        correct: true
      - text: It doesn't provide a consistent way to update the search space.
      - text: It is less accurate than `lo + (hi - lo) / 2`.
    interview:
    - question: How would you modify a binary search algorithm to handle finding the last occurrence of
        a target value in a rotated sorted array?
      answer_md: To find the last occurrence of a target value, you can use a similar approach but with
        slight modifications. Start by comparing the middle element with the start and end elements. If
        the middle element is less than or equal to the end element, it means the right half is properly
        sorted; otherwise, the left half is. Compare the target with the middle and end elements to determine
        which part of the array contains the last occurrence. Adjust the search space by updating `lo`
        or `hi`. Continue this process until you find the target value at its last occurrence.
      difficulty: hard
    - question: Describe a scenario where binary search on the answer would be more appropriate than traditional
        binary search on a sorted array. Provide an example problem and explain how to apply it.
      answer_md: Binary search on the answer is useful when you need to find a value that defines a monotonic
        predicate over a range of possible answers, rather than searching for an exact match in a sorted
        array. For example, consider the problem of allocating books to minimize the maximum pages assigned
        to any student. Here, you can use binary search on the answer by defining the target as the maximum
        number of pages per book and checking if this value is feasible. You would start with a low bound
        (0) and high bound (total pages / number of students), then check the midpoint to see if it's
        possible to allocate books such that no student gets more than the current midpoint value. If
        it's possible, you adjust the search space to the lower half; otherwise, to the upper half. This
        approach reduces a combinatorial problem into an efficient O(n log(range)) solution.
      difficulty: hard
  dsa-binary-search-trees:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-21T14:04:31Z'
    quiz:
    - prompt: What is the correct approach to validate whether a binary search tree (BST) is valid?
      explanation: The correct approach is to thread a valid `(min, max)` range down the recursion, tightening
        it at each step. This ensures that every node is checked against every relevant ancestor, not
        just its immediate parent.
      options:
      - text: Check that each node's value is greater than its immediate left child and less than its
          immediate right child.
      - text: Thread a valid `(min, max)` range down the recursion, tightening it at each step.
        correct: true
      - text: Validate only the root node against an initial min/max bound.
      - text: Assume all nodes are valid if they have no children.
    - prompt: What are the three cases for deleting a node with two children in a binary search tree (BST)?
      explanation: Deleting a node with two children involves finding the inorder successor (the smallest
        value in the right subtree), copying its value into the node being deleted, and then recursively
        deleting that successor. This ensures the BST invariant is maintained.
      options:
      - text: Delete the node and replace it with its inorder predecessor or successor.
      - text: Delete the node and replace it with its left child, then delete the right child recursively.
      - text: Splice out the node's right subtree and attach it to the node's parent.
      - text: Find the inorder successor, copy its value into the node being deleted, then delete that
          successor.
        correct: true
    - prompt: What is the time complexity of search, insert, and delete operations in a balanced Binary
        Search Tree?
      explanation: These operations are O(h) in a balanced BST, with h being the height of the tree. A
        balanced tree ensures that h = O(log n).
      options:
      - text: O(n)
      - text: O(log n)
      - text: O(h), where h is the height of the tree
        correct: true
      - text: O(1)
    - prompt: What is the consequence of inserting already-sorted data into an unbalanced Binary Search
        Tree?
      explanation: Inserting already-sorted data into an unbalanced BST can make it degenerate, turning
        the tree into a linked list. This results in O(n) operations for search, insert, and delete.
      options:
      - text: The tree becomes perfectly balanced.
      - text: The tree degenerates to a linked list, with poor performance for search, insert, and delete
          operations.
        correct: true
      - text: The tree's height decreases significantly.
      - text: The tree's nodes' values get shuffled.
    - prompt: Which of the following is a correct approach to validate a Binary Search Tree?
      explanation: The correct approach is to thread a valid (min, max) range down the recursion, ensuring
        that each node's value stays within its bounds relative to ancestors as well.
      options:
      - text: Check that each node's value is greater than its immediate left child and less than its
          immediate right child.
      - text: Thread a valid (min, max) range down the recursion, tightening it at each step.
        correct: true
      - text: Validate only the root node against an initial min/max bound.
      - text: Perform inorder traversal and check if all nodes are in increasing order.
    interview:
    - question: Explain why an inorder traversal of a BST gives sorted order.
      answer_md: Inorder traversal (left, node, right) visits every value in ascending order automatically
        due to the BST invariant — every left subtree contains only smaller values and every right subtree
        only larger ones. This ensures that nodes are visited from smallest to largest during the traversal.
      difficulty: medium
    - question: Describe how you would validate a binary search tree (BST) correctly, avoiding common
        pitfalls.
      answer_md: To validate a BST correctly, you need to thread a valid `(min, max)` range down the recursion.
        This ensures that every node is checked against every relevant ancestor, not just its immediate
        parent. Common pitfalls include only checking immediate children or assuming all nodes are valid
        if they have no children.
      difficulty: hard
    - question: Explain why an unbalanced Binary Search Tree can degenerate into a linked list.
      answer_md: An unbalanced BST can degenerate into a linked list if nodes are inserted in sorted order.
        In this case, the tree's height becomes n (linear), and operations like search, insert, and delete
        degrade to O(n) due to the linear structure of the tree, similar to a singly linked list.
      difficulty: medium
  dsa-binary-trees:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-21T14:03:33Z'
    quiz:
    - prompt: Which traversal order visits the current node before visiting its children?
      explanation: The preorder traversal visits the current node first, then its left child, and finally
        its right child.
      options:
      - text: Preorder
        correct: true
      - text: Inorder
      - text: Postorder
      - text: Level-order
    - prompt: Why is a bottom-up postorder traversal preferred for computing properties like height or
        diameter?
      explanation: A bottom-up postorder traversal computes and returns the needed subtree information
        exactly once, avoiding redundant computations.
      options:
      - text: It avoids recomputing subtree information
        correct: true
      - text: It uses less memory than recursion
      - text: It's easier to implement iteratively
      - text: It's faster on unbalanced trees
    - prompt: What is a common mistake when computing properties like height or diameter of a binary tree?
      explanation: Recomputing subtree heights from scratch at every node can lead to O(n^2) time complexity,
        whereas computing them in a single bottom-up postorder pass is more efficient.
      options:
      - text: Using an iterative approach
      - text: Confusing BFS with DFS
      - text: Recomputing subtree heights from scratch at each node
        correct: true
      - text: Using recursion without a stack
    - prompt: Which traversal order visits the nodes level by level?
      explanation: The level-order traversal uses a queue to visit nodes level by level, making it fundamentally
        different from depth-first traversals like preorder, inorder, and postorder.
      options:
      - text: Preorder
      - text: Inorder
      - text: Postorder
      - text: Level-order
        correct: true
    interview:
    - question: Explain the difference between height and diameter of a binary tree.
      answer_md: 'The height of a binary tree is the length of the longest path from the root to a leaf
        node. The diameter, on the other hand, is the length of the longest path between any two nodes
        in the tree. While both are computed using postorder traversal, they serve different purposes:
        height measures the depth of the deepest leaf, and diameter measures the widest part of the tree.'
      difficulty: medium
    - question: How would you implement a function to find the lowest common ancestor (LCA) in a binary
        search tree?
      answer_md: To find the LCA in a BST, start at the root and move down the tree. If both nodes are
        less than the current node's value, move to the left child; if both nodes are greater, move to
        the right child. Otherwise, the current node is the LCA. This works because in a BST, all values
        in the left subtree are less than the root, and all values in the right subtree are greater.
      difficulty: hard
    - question: Describe how you would solve a path-sum problem where the target sum can be achieved by
        any node-to-node path, not just from root to leaf.
      answer_md: To solve this problem, use a recursive approach. For each node, check if it matches the
        target sum and return true if so. Then, recursively check both left and right subtrees for paths
        that match the remaining sum (target - current node value). If either subtree returns true, then
        there exists a path through this node that sums to the target. This requires keeping track of
        the current path sum as you traverse the tree.
      difficulty: hard
  dsa-bit-manipulation:
    generated_by: qwen2.5:7b
    verified_at: '2026-08-21T14:00:45Z'
    quiz:
    - prompt: What is the result of `x & (x - 1)` when applied to a positive integer `x`?
      explanation: Clearing the lowest set bit is a key trick for counting set bits efficiently. It works
        because subtracting 1 from `x` flips all the lower bits and then borrows, which when AND-ed with
        `x`, clears the lowest set bit.
      options:
      - text: It clears the lowest set bit in `x`.
        correct: true
      - text: It sets all bits in `x` to 1.
      - text: It increments `x` by 1.
      - text: It returns the highest set bit in `x`.
    - prompt: Which of these bitwise operations correctly sets the i-th bit in an integer `x`?
      explanation: Setting the i-th bit is done by OR-ing `x` with a value that has only the i-th bit
        set. This can be achieved using `1 << i`, which creates such a value, and then OR-ing it with
        `x`.
      options:
      - text: '`x | (1 << i)`'
        correct: true
      - text: '`x & (1 << i)`'
      - text: '`x ^ (1 << i)`'
      - text: '`x >> (1 << i)`'
    - prompt: Which operation would you use to set bit 2 in a variable `x`?
      explanation: The correct operation is `x | (1 << 2)`, which sets the bit at position 2 in `x`. The
        other options either clear or toggle the bit.
      options:
      - text: x | (1 << 2)
        correct: true
      - text: x & ~(1 << 2)
      - text: x ^ (1 << 2)
      - text: x >> 2
    - prompt: What does the expression `(x >> i) & 1` do?
      explanation: The expression `(x >> i) & 1` checks if the ith bit of `x` is set. The right shift
        moves the bit to position 0, and the AND with 1 isolates it.
      options:
      - text: It clears the ith bit of x
      - text: It checks if the ith bit of x is set
        correct: true
      - text: It sets the ith bit of x
      - text: It toggles the ith bit of x
    - prompt: How can you clear the lowest set bit in a variable `x`?
      explanation: The correct operation is `x & (x - 1)`, which clears the lowest set bit. The other
        options involve setting or toggling bits.
      options:
      - text: x | (1 << (x & -x))
      - text: x & (x - 1)
        correct: true
      - text: x ^ (1 << (x & -x))
      - text: x >> (x & -x)
    interview:
    - question: Explain how you would use XOR to find a single number in an array where every other number
        appears twice.
      answer_md: To solve this problem, we can leverage the properties of XOR. XOR-ing all numbers in
        the array will result in 0 because each pair of identical numbers will cancel out (a ^ a = 0).
        The remaining unpaired number will be the result. This works in O(n) time and O(1) space.
      difficulty: medium
    - question: Why might you choose to use bit manipulation over a boolean array for tracking states
        in a problem with up to 20 elements?
      answer_md: Bit manipulation can be more efficient in terms of memory usage, especially when the
        number of states is large. For problems involving up to 20 elements, using a single integer as
        a bitmask can represent all possible combinations (2^20 = 1,048,576) with just one variable. This
        makes it a compact and fast solution compared to an array that would require 20 boolean variables.
      difficulty: medium
    - question: Describe the Brian Kernighan's algorithm for counting the number of set bits in an integer
        `x`.
      answer_md: Brian Kernighan's algorithm works by repeatedly clearing the lowest set bit in `x` using
        the operation `x & (x - 1)`. Each iteration reduces the count of set bits by one. The process
        continues until all bits are cleared, and the number of iterations gives the total number of set
        bits. This approach is efficient because it only processes each set bit once.
      difficulty: hard
