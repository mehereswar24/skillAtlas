    solution_md: |
      ```js
      function renderRows(container, count) {
        container.textContent = '';
        const fragment = document.createDocumentFragment();

        for (let i = 1; i <= count; i++) {
          const row = document.createElement('div');
          row.className = 'row';
          row.textContent = 'Row ' + i;
          fragment.append(row);          // off-document: no layout yet
        }

        container.append(fragment);      // one insertion, one layout
        return count;
      }
      ```

      Two changes, and the second is the bigger one. Building into a fragment
      means the nodes are not in the document while you assemble them, so no
      layout happens per row. And dropping the `offsetHeight` read removes the
      forced synchronous layout entirely — that read was asking the browser
      "where is everything now?" two thousand times, and each answer required
      redoing the work the previous write invalidated.

      If you genuinely need measurements, do all the writes, then all the reads,
      in separate passes.
