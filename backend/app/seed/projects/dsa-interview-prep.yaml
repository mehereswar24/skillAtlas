          class FenwickTree:
              """A Fenwick (binary indexed) tree over `size` zero-initialised slots."""

              def __init__(self, size: int):
                  self.size = size
                  self.tree = [0] * (size + 1)

              def update(self, index: int, delta: int) -> None:
                  """Add `delta` to the value at `index` (0-indexed)."""
                  raise NotImplementedError("Start here")

              def prefix_sum(self, index: int) -> int:
                  """Sum of [0, index] inclusive (0-indexed)."""
                  raise NotImplementedError

              def range_sum(self, left: int, right: int) -> int:
                  """Sum of [left, right] inclusive (0-indexed)."""
                  raise NotImplementedError
