        code: |
          values = [1, 3, 5, 7, 9, 11]
          ft = FenwickTree(len(values))
          for i, v in enumerate(values):
              ft.update(i, v)
          assert ft.prefix_sum(2) == 9, ft.prefix_sum(2)
          assert ft.prefix_sum(5) == 36, ft.prefix_sum(5)
      - name: range_sum matches a plain slice sum
        code: |
          values = [1, 3, 5, 7, 9, 11]
          ft = FenwickTree(len(values))
          for i, v in enumerate(values):
              ft.update(i, v)
          assert ft.range_sum(1, 3) == 15, ft.range_sum(1, 3)
          assert ft.range_sum(0, 5) == 36
      - name: A point update changes exactly the sums that include it
        code: |
          values = [1, 3, 5, 7, 9, 11]
          ft = FenwickTree(len(values))
          for i, v in enumerate(values):
              ft.update(i, v)
          ft.update(2, 10)          # index 2 (value 5) becomes 15
          assert ft.prefix_sum(1) == 4, "sums before index 2 must be untouched"
          assert ft.prefix_sum(2) == 19, ft.prefix_sum(2)
