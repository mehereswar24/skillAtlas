          ft.update(3, 42)
          assert ft.range_sum(3, 3) == 42
          assert ft.range_sum(0, 2) == 0
      - name: A sequence of updates matches a brute-force list simulation
        hidden: true
        code: |
          values = [2, 4, 6, 8, 10]
          ft = FenwickTree(len(values))
          for i, v in enumerate(values):
              ft.update(i, v)

          for idx, delta in [(0, 5), (3, -3), (4, 1), (1, 10)]:
              ft.update(idx, delta)
              values[idx] += delta

          for l in range(len(values)):
              for r in range(l, len(values)):
                  expected = sum(values[l:r + 1])
                  got = ft.range_sum(l, r)
                  assert got == expected, f"range_sum({l},{r}) = {got}, expected {expected}"
      - name: A fresh tree is all zeros
        hidden: true
        code: |
          ft = FenwickTree(4)
          assert ft.prefix_sum(3) == 0
          assert ft.range_sum(0, 3) == 0
    solution_md: |
      ```python
      def update(self, index, delta):
          i = index + 1
          while i <= self.size:
              self.tree[i] += delta
              i += i & (-i)

      def prefix_sum(self, index):
          i = index + 1
          total = 0
          while i > 0:
              total += self.tree[i]
              i -= i & (-i)
          return total

      def range_sum(self, left, right):
          if left == 0:
              return self.prefix_sum(right)
          return self.prefix_sum(right) - self.prefix_sum(left - 1)
      ```

      `i & (-i)` works because of how two's-complement negation flips every
      bit up to and including the lowest set bit — the AND of a number and
      its negation is exactly that lowest set bit, isolated. `update` uses it
      to climb toward larger-and-larger ranges that all cover `index`;
      `prefix_sum` uses the same expression to descend, peeling off one
      covered range at a time. It is the same bit trick read in two
      directions, which is the whole reason the class needs no recursion and
      no rebuilding.
