# Flipkart.
#
# Sourcing rules for every file in this directory:
#   * `source_url` is required on every question — the loader rejects one
#     without it.
#   * Questions are written in our own words from what the source describes.
#     Nothing is copied out of a proprietary question bank; where the useful
#     artefact *is* the bank (LeetCode's company tag), we link to it instead.
#   * `fetched_on` records when the sources were last checked, and the UI shows
#     it, so stale data is visible rather than silently trusted.

company:
  slug: flipkart
  name: Flipkart
  industry: E-commerce
  hq: Bengaluru, Karnataka
  website: https://www.flipkartcareers.com/
  icon: ShoppingCart
  fetched_on: 2026-08-21
  sort_order: 20
  description: >-
    India's largest homegrown e-commerce marketplace. Runs its own logistics
    (Ekart) and payments (Flipkart Pay Later) stack, which is why its loop
    leans harder on object-oriented design than a typical big-tech interview.
  hiring_process_md: |
    Flipkart's loop looks like big tech for the first two rounds and then
    turns into something services-background candidates rarely expect: a
    **machine coding round** where you build a small, actually-running program
    rather than talk about one.

    **The shape of it**

    1. **Online assessment** — usually 2–3 DSA problems in 90 minutes, plus an
       MCQ section on CS fundamentals for campus hires.
    2. **DSA technical round(s)** — one or two live rounds, arrays/graphs/DP,
       explain complexity as you go.
    3. **Machine coding round** — the signature round. You get a prompt like
       "build a parking lot" or "build an expense splitter" and 90–120 minutes
       to produce running, compiling code with proper classes — not
       pseudocode, not a design doc. Graded on OOP design, extensibility (can
       you add a new vehicle type or split strategy in five minutes?), and
       whether it actually runs.
    4. **System design (SDE-2 and above)** — high-level design: data
       modelling, API shape, where the system falls over under load.
    5. **Hiring manager / bar-raiser** — projects, ownership, conflict stories.
    6. **HR** — compensation, notice period, offer.

    **What trips people up.** Candidates who prepared only LeetCode clear the
    OA and the DSA rounds and then stall in machine coding, because it grades
    a completely different skill: turning a vague prompt into a class
    hierarchy under a clock, with no time to redesign halfway through. Decide
    your entities and their relationships in the first ten minutes and resist
    the urge to perfect them later — a working v1 beats an elegant half-built
    v2.
