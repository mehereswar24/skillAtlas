company:
  slug: zoho
  name: Zoho Corporation
  industry: Product (India)
  hq: Chennai, India
  website: https://www.zoho.com/careers/
  icon: Boxes
  fetched_on: 2026-07-31
  sort_order: 12
  description: >-
    A bootstrapped product company with a famously long, purely
    skill-based hiring process — no degree filter, and a coding round measured
    in hours rather than minutes.
  hiring_process_md: |
    Zoho is the counter-example to every "CGPA cutoff" in Indian hiring: the
    process is long, difficulty rises with each round, and what carries you
    through is being able to actually write programs.

    **The shape of it (up to five rounds)**

    1. **Aptitude** — around 20 questions in 60 minutes: quantitative, logical
       reasoning and verbal.
    2. **Programming round 1 (basic)** — around 5 problems in up to 3 hours,
       historically expected in C. Moderate to high difficulty.
    3. **Programming round 2 (advanced)** — a longer, more open-ended build,
       sometimes a small application rather than isolated problems.
    4. **Technical interview** — computer science fundamentals: OOP, DBMS,
       operating systems, networks, plus your code from the earlier rounds.
    5. **HR round** — background, motivation, and whether you want to be there.

    **What makes it different.** Three hours for five problems means these are
    not one-liners: expect string manipulation, matrix work, date arithmetic
    and simulation problems where the specification itself is the difficulty.
    Reading the requirement precisely matters as much as the algorithm, and
    partial credit is real — a working solution to four of five beats elegant
    fragments of all five.

