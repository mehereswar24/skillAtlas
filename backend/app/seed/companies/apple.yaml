    questions:
      - kind: interview
        round: coding
        topic: Graphs
        difficulty: medium
        year: 2025
        question: >-
          Given a graph representing similarity between items (or users),
          find the shortest path — in terms of number of hops — between two
          given nodes.
        answer_md: |
          Unweighted shortest path is a BFS problem, not Dijkstra — BFS
          guarantees the first time you reach a node is via the fewest edges,
          because it explores layer by layer. Track a visited set and a
          distance map seeded at the source with distance 0; for each
          neighbour of a dequeued node that hasn't been visited, set its
          distance to `current + 1` and enqueue it.

          The reason this shows up in an ML round rather than a pure coding
          round is usually the follow-up: if the graph is a similarity graph
          built from embeddings (edges added when cosine similarity exceeds a
          threshold), how does the threshold choice affect the graph's
          density and therefore this algorithm's practical runtime? A tight
          threshold gives a sparse graph and cheap BFS; a loose one can make
          the graph near-complete, and at that point you should be asking
          whether a graph traversal is even the right tool versus a direct
          nearest-neighbour index.
        source_name: Exponent — Apple Machine Learning Engineer interview guide
        source_url: https://www.tryexponent.com/guides/apple-machine-learning-engineer-interview

      - kind: interview
        round: system-design
        topic: On-device ML pipeline
        difficulty: hard
        year: 2025
        question: >-
          Design an on-device feature that suggests captions for photos as
          the user takes them, using a model that runs entirely on the
          iPhone. Walk through the pipeline from training to what actually
          executes on the device.
        answer_md: |
          Split the answer into two pipelines that share almost nothing:
          training happens on Apple's infrastructure against a large,
          diverse dataset, but the artefact that ships is a compressed,
          quantised model small enough to sit in the app bundle or be
          delivered as an on-device asset — think tens of megabytes, not the
          gigabytes a server-side model might be.

          On the device, the constraint set flips from "how accurate" to "how
          fast, how much battery, how much memory while other apps are also
          running." Discuss quantisation (int8 instead of float32 weights),
          pruning, or a distilled smaller model trained to mimic a larger
          server-side teacher — this is where naming Core ML explicitly as
          Apple's on-device inference runtime is worth doing.

          The privacy angle is the part interviewers are listening for
          unprompted: because inference runs on-device, the photo and its
          caption never need to leave the phone, which is both a genuine
          Apple design principle and a real technical constraint — you can't
          fall back to "just call a bigger model in the cloud if the on-device
          one is unsure," because that reintroduces the privacy leak the
          whole design was meant to avoid. If you need to improve the model
          over time, the answer is usually aggregated, differentially-private
          telemetry about failure cases, not raw user photos.
        source_name: Apple Machine Learning Research
        source_url: https://machinelearning.apple.com/

      - kind: online-assessment
        round: coding
        topic: Linked lists
        difficulty: easy
        year: 2024
        question: >-
          Given a linked list, detect whether it contains a cycle, and if so,
          find the node where the cycle begins.
        answer_md: |
          Floyd's cycle detection (tortoise and hare): a slow pointer moves
          one node at a time, a fast pointer moves two; if there's a cycle,
          they're guaranteed to meet inside it, because the fast pointer
          gains one node of distance on the slow one every step and can't
          "jump over" it once both are inside the loop.

          Finding the start of the cycle is the part worth memorising the
          proof for, not just the trick: once slow and fast meet, reset one
          pointer to the head and advance both one step at a time — they meet
          exactly at the cycle's start. This falls out of the distance
          algebra (distance from head to cycle start equals distance from the
          meeting point to the cycle start, going forward around the loop),
          and being able to sketch that proof on request is a stronger signal
          than reciting the two-pointer trick alone.
        source_name: GeeksforGeeks — Apple SDE interview questions and answers
        source_url: https://www.geeksforgeeks.org/dsa/apple-sde-interview-questions-and-answers/

      - kind: interview
        round: technical
        topic: Model evaluation
        difficulty: medium
        year: 2024
        question: >-
          You ship a new on-device classifier and offline metrics look
          better than the model it replaced, but a week after rollout,
          user complaints go up. What do you check?
        answer_md: |
          The gap between "offline metrics improved" and "real-world
          experience got worse" almost always means the offline evaluation
          set doesn't represent production traffic. Check first whether the
          eval set is stale or skewed relative to current usage — new device
          types, new locales, or a seasonal shift in what users are actually
          doing with the feature.

          Second, look at the error distribution, not just the aggregate
          metric: a model can raise average accuracy while getting
          catastrophically worse on a specific slice (a particular accent, a
          low-light photo condition, an underrepresented device) that the
          aggregate number hides completely. On-device adds a third
          candidate that's easy to miss: the model that shipped to devices
          might not be the exact model you evaluated offline if quantisation
          or a conversion step (e.g., to Core ML format) changed its
          behaviour — always re-validate the actual on-device artefact, not
          just the training-time checkpoint.
        source_name: Exponent — Apple Machine Learning Engineer interview guide
        source_url: https://www.tryexponent.com/guides/apple-machine-learning-engineer-interview

      - kind: interview
        round: technical
        topic: Project deep dive
        difficulty: medium
        year: 2025
        question: >-
          Tell me about an ML model you took from prototype to production.
          What was the biggest gap between how it performed in your notebook
          and how it performed once real users hit it?
        answer_md: |
          The interviewer wants a concrete story with a specific failure, not
          a description of the whole project. A strong structure: what the
          offline metric said, what you observed once it was live, what you
          did to diagnose the gap, and what changed as a result — in the
          model, the data pipeline, or the serving infrastructure.

          Common real gaps worth having a genuine answer for: training-serving
          skew (a feature computed differently at train time than at
          inference time), distribution shift between your training data and
          live traffic, or latency/resource constraints that forced a smaller
          or quantised model than the one you validated offline. If your
          honest answer is "we never shipped anything, so I don't have a real
          gap to describe," that's a signal to prepare a different project for
          this round — Apple interviewers are reported to probe hard enough
          that a purely academic project doesn't hold up well here.
        source_name: interviewing.io — Apple onsite interview loop breakdown
        source_url: https://spacecomplexity.ai/blog/apple-onsite-interview

      - kind: interview
        round: managerial
        topic: Cross-functional collaboration
        difficulty: easy
        year: 2024
        question: >-
          Tell me about a time an ML model you built worked well
          technically, but a product or design partner didn't want to ship
          it. What happened?
        answer_md: |
          This question is checking whether you can operate on a
          cross-functional team where "the model is more accurate" isn't
          automatically the deciding argument — a very live scenario in
          consumer ML, where a technically superior model can still be
          rejected for latency, battery, explainability, or user-trust
          reasons.

          A good answer names the actual objection (not a strawman), shows
          you engaged with it rather than just re-arguing your metric, and
          describes the resolution honestly — including if the answer is
          "they were right and I hadn't considered X." Apple's own ML
          research repeatedly frames its models around user-facing
          constraints like privacy and on-device latency rather than raw
          benchmark performance, so an answer that shows you understand why
          "more accurate" isn't always "better to ship" lands well here.
        source_name: interviewing.io — Apple onsite interview loop breakdown
        source_url: https://spacecomplexity.ai/blog/apple-onsite-interview
