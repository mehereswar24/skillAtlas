#
# Sourcing rules for every file in this directory:
#   * `source_url` is required on every question — the loader rejects one
#     without it.
#   * Questions are written in our own words from what the source describes.
#     Nothing is copied out of a proprietary question bank; where the useful
#     artefact *is* the bank (LeetCode's company tag, GeeksforGeeks' sheet),
#     we link to it instead.
#   * `fetched_on` records when the sources were last checked, and the UI
#     shows it, so stale data is visible rather than silently trusted.

company:
  slug: apple
  name: Apple
  industry: Big Tech
  hq: Cupertino, California
  website: https://www.apple.com/careers/us/
  icon: Apple
  fetched_on: 2026-08-21
  sort_order: 2
  description: >-
    iPhone, Mac, the silicon under both, and the services layered on top.
    Apple hires into a specific team rather than a generalist pool, writes
    its own interview questions per team, and grades a resume project deep
    dive as hard as it grades your code.

  hiring_process_md: |
    Apple's process is the opposite of Google's in one structural way: **you
    interview for a team, not for the company.** There is no central hiring
    committee reading anonymised feedback and no shared question bank — your
    recruiter, your interviewers, and the exact shape of your loop all sit
    inside the org you applied to. That has two practical consequences.

    First, the job description you applied to is the syllabus. A Wallet team
    loop and a WebKit team loop share almost nothing beyond "coding round"
    and "system design round" as labels; the actual content is written by
    that team's engineers about that team's problems. Ask your recruiter what
    the loop looks like — Apple candidates are explicitly told this is a fair
    question, because there is no public standard to fall back on.

    Second, Apple leans harder than most Big Tech companies on one round type:
    the **project deep dive**. An interviewer picks something off your resume
    and spends 30–45 minutes pushing on it — not "what did you build" but "why
    that data store, what would you change now, what broke in production and
    what did you add so it wouldn't happen again." This round exists because
    it is very hard to fake, and it is where candidates who inflated their
    resume role usually get caught.

    **The shape of it, for most software/hardware engineering roles**

    1. **Recruiter screen** — background, motivation, "why Apple, why this
       team," level and timing.
    2. **Hiring manager screen** — role fit, a light technical conversation,
       and this is usually the person who schedules the rest of your loop.
    3. **Technical phone screens (one to two, 45–60 min)** — a coding problem
       in a shared editor, sometimes with 10–15 minutes of CS fundamentals
       first.
    4. **Onsite loop (five to eight rounds in a day)** — two to three coding
       rounds, one system/architecture design round (constrained by
       on-device compute, battery, and Apple's privacy rules rather than
       Google-style horizontal scaling), the project deep dive, and a
       behavioural round.
    5. **Hiring manager decision** — Apple does not run a separate hiring
       committee the way Google does; the hiring manager and loop panel
       decide directly, which is faster but means one bad round carries more
       weight than at a company with a review board.

    **What they say they are grading.** Apple's own careers material talks
    about "craftsmanship," attention to detail, and cross-functional
    collaboration rather than a numbered rubric. In practice: correctness and
    code quality over algorithmic showmanship in coding rounds, genuine
    ownership (not "my team did X") in the deep dive, and — because of the
    NDA culture everyone works under before a product ships — a comfort with
    being told "I can't tell you which team this is for" and reasoning about
    the problem anyway.

