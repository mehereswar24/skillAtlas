# Databricks.
#
# Sourcing rules for every file in this directory:
#   * `source_url` is required on every question — the loader rejects one
#     without it.
#   * Questions are written in our own words from what the source describes.
#     Nothing is copied out of a proprietary question bank; where the useful
#     artefact *is* the bank (a company-tag list), we link to it instead.
#   * `fetched_on` records when the sources were last checked, and the UI shows
#     it, so stale data is visible rather than silently trusted.

company:
  slug: databricks
  name: Databricks
  industry: Data & AI Platform
  hq: San Francisco, California
  website: https://www.databricks.com/company/careers
  icon: Database
  fetched_on: 2026-08-21
  sort_order: 6
  description: >-
    The company behind Apache Spark, Delta Lake and the "lakehouse" pitch —
    it sells the platform that most Fortune 500 data teams run their Spark
    jobs, streaming pipelines and MLflow-tracked models on. The product you
    would be hired to help build is a distributed system, and the interview
    loop is unusually honest about that.
  hiring_process_md: |
    Unlike a generalist pool like Google's, you interview **for a specific
    team's open req** — the posting you apply to is close to the team you'll
    land on, so it pays to read the job description literally rather than
    treating it as a template.

    **The shape of it**

    1. **Recruiter screen (~30 min)** — background, motivation, level, comp
       expectations. For new-grad and intern pipelines this is sometimes
       preceded by a timed online assessment (historically on CodeSignal) —
       a handful of algorithmic problems under a strict clock, no interviewer
       present.
    2. **Technical phone screen (~1 hr)** — one engineer, one shared editor
       (CoderPad). Medium-to-hard data-structure problems, often with a
       systems flavor rather than a pure LeetCode template.
    3. **Hiring manager call (~1 hr)** — behavioral and a deep dive into a
       project on your resume; this is also where team fit gets checked,
       since (unlike Google) there is no separate matching step afterward.
    4. **Onsite / virtual onsite loop (4–5 rounds, ~1 hr each)** — for
       engineering roles this typically includes two coding rounds, one round
       that is explicitly about concurrency or systems programming, one
       system-design round (from mid-level up), and one behavioral /
       cross-functional round.
    5. **Team match confirmation and offer.**

    **What actually gets graded.** The coding bar is comparable to any Big
    Tech loop, but the *flavor* is distributed-systems-heavy: expect
    questions to bend toward concurrency, streaming, and data-at-scale rather
    than pure interview-puzzle shapes. The system-design round in particular
    tends to land on a piece of a data platform — a job scheduler, an
    ingestion pipeline, a query cache — rather than a generic "design
    Twitter." Candidates who prepare only classic system design (load
    balancers, sharded SQL, CDNs) are consistently surprised by how much the
    round wants to talk about schema evolution, exactly-once semantics, and
    metadata scalability instead.
