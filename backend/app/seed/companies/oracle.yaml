# Oracle.
#
# Sourcing rules for every file in this directory:
#   * `source_url` is required on every question — the loader rejects one
#     without it.
#   * Questions are written in our own words from what the source describes.
#     Nothing is copied out of a proprietary question bank; where the useful
#     artefact *is* the bank (a company's LeetCode tag, a Glassdoor thread),
#     we link to it instead.
#   * `fetched_on` records when the sources were last checked, and the UI
#     shows it, so stale data is visible rather than silently trusted.

company:
  slug: oracle
  name: Oracle
  industry: Enterprise Software / Cloud Infrastructure
  hq: Austin, Texas
  website: https://www.oracle.com/careers/
  icon: Database
  fetched_on: 2026-08-21
  sort_order: 13
  description: >-
    Oracle Database, Fusion Applications and Oracle Cloud Infrastructure
    (OCI). A genuinely different company depending on which org you land
    in — OCI runs a distributed-systems-heavy loop close to AWS or GCP's,
    while Fusion Apps and the database org lean harder on SQL, data
    modeling and enterprise reliability requirements.
  hiring_process_md: |
    Oracle's process is more structured and predictable than most Big Tech
    loops — there is less randomness in what gets asked, and the evaluation
    rubric is more standardized across interviewers — but *which* org you're
    interviewing into changes what "technical" means substantially.

    **The shape of it, typically six stages:**

    1. **Application + resume screen.**
    2. **Online assessment (60–90 min, HackerRank/Codility or Oracle's own
       platform)** — 2–3 medium-to-hard problems spanning DSA, SQL and OOP.
       This gates entry to the human rounds.
    3. **Recruiter/HR screen** — logistics, timeline, comp expectations.
    4. **Two technical/coding rounds** — DSA in your language of choice,
       often with an OOP design component (class design, SOLID principles).
    5. **System design round** — the content here is where the org split
       matters most (see below).
    6. **Hiring manager / bar-raiser round** — team fit, past project depth.

    **OCI (cloud infrastructure) roles** weight distributed systems heavily:
    consistency models, replication, and how a design holds up across a
    cluster of machines rather than one node — interviewers will explicitly
    ask you to modify an algorithm's approach for a distributed setting
    partway through, not just design one system once.

    **Fusion Applications and Database org roles** weight SQL, schema
    design and enterprise reliability requirements (ACID guarantees,
    backward compatibility, upgrade paths) more than distributed-systems
    trivia — because the product being built has decades of enterprise
    customers who cannot tolerate a breaking change.

    **What's consistent:** Java is the dominant language across nearly
    every org (though other languages are accepted), and interviewers are
    explicitly told to evaluate cultural fit — collaboration and customer
    focus — alongside raw technical correctness, not as an afterthought.
