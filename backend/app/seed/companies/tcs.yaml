company:
  slug: tcs
  name: Tata Consultancy Services
  industry: IT Services (India)
  hq: Mumbai, India
  website: https://www.tcs.com/careers
  icon: Building2
  fetched_on: 2026-07-31
  sort_order: 10
  description: >-
    India's largest IT employer, hiring at a scale no product company matches.
    Entry is through the National Qualifier Test — a single standardised exam
    that most of the selection actually happens in.
  hiring_process_md: |
    TCS is the clearest example of a hiring process where **the exam matters
    more than the interview**. The NQT filters hundreds of thousands of
    candidates down; the interview that follows is comparatively short and
    conversational.

    **The shape of it**

    1. **TCS NQT** — roughly three hours, in English, in two parts:
       - *Foundation section (~75 min)*: verbal ability, numerical ability,
         reasoning ability.
       - *Advanced section (~115 min)*: advanced quantitative and reasoning,
         plus 2–3 hands-on coding questions.
       Your score bands you: Ninja, Digital or Prime, and the band determines
       the role and the salary you are offered.
    2. **Technical interview (30–60 min)** — core subjects and, heavily, your
       final-year project.
    3. **Managerial and HR rounds** — increasingly merged into a single panel
       with the technical round rather than held separately.

    **Where candidates lose it.** Two places, consistently. The aptitude
    sections are speed tests as much as ability tests — practice against the
    clock or the section timer will beat you. And the technical round is
    dominated by *your own project*: an interviewer who finds you cannot
    explain the thing on your CV stops trusting the rest of it.

  resources:
    - kind: careers
      title: "TCS Careers — off-campus and NQT"
      url: https://www.tcs.com/careers
    - kind: prep
      title: "TCS NQT hiring process — PrepInsta"
      url: https://prepinsta.com/tcs-nqt/hiring-process/
    - kind: prep
      title: "TCS NQT hiring process, exam pattern and eligibility — Unstop"
