      - kind: interview
        round: hr
        topic: Fit
        difficulty: easy
        question: >-
          Why should we hire you?
        answer_md: |
          Anchor on one or two concrete, checkable pieces of evidence — a
          skill you taught yourself and shipped in a project, a specific
          improvement you made to something that existed before you touched
          it — rather than a list of adjectives like "hardworking" or
          "fast learner."

          On this track especially, where the interviewer has often already
          looked at your GitHub or LeetCode profile, an answer that matches
          what they can already see is far stronger than one that doesn't.
