company:
  slug: accenture
  name: Accenture
  industry: IT Services & Consulting
  hq: Dublin, Ireland
  website: https://www.accenture.com/in-en/careers
  icon: Compass
  fetched_on: 2026-08-21
  sort_order: 18
  description: >-
    A global consultancy that hires more engineering graduates out of India
    than almost anywhere else in the world. The online test now includes a
    genuinely eliminating coding round, and how well you clear it decides
    which of two starting packages you land in.
  hiring_process_md: |
    Accenture's fresher funnel runs five stages, and the newest change is the
    one that matters most: **the coding round now eliminates**, where in
    older cycles it sometimes didn't.

    **The shape of it**

    1. **Cognitive Ability Assessment** — increasingly delivered as short
       "gamified" tasks (memory puzzles, pathfinding mazes, pattern
       recognition) rather than plain MCQs, though the classic
       verbal/analytical/numerical MCQ format still runs in parallel drives.
    2. **Technical Assessment** — MCQs on pseudocode, common office/desktop
       applications, and networking, cloud and security fundamentals.
    3. **Coding round (45–60 min, 2–3 problems)** — your choice of
       C/C++/Java/.NET/Python/JavaScript, or a SQL + frontend combination on
       the more technical tracks. This is now an elimination round, and how
       completely you clear it decides your package band.
    4. **Communication assessment** — an AI-graded, Versant-style spoken
       English test: read-aloud, sentence repeat, and story retelling. Mostly
       non-eliminating, but it still shapes the offer you get.
    5. **Final interview** — technical and HR questions merged into a single
       25–45 minute virtual round with one or two panellists, built almost
       entirely around your resume and your final-year project.

    **The package split is decided inside the coding round, not after it.**
    Clear both problems fully and you are in range for the higher-paying
    Advanced Associate Software Engineer band; a partial clear on the second
    problem keeps you on the standard Associate Software Engineer track.
    Communication-assessment scores factor in too, so the spoken test is not
    the formality it looks like.

    **Eligibility** for the 2026 cycle: 60–65% or 6.5 CGPA across Class 10,
    Class 12 and your degree, no *active* backlog at application or joining
    (cleared backlogs are fine), no gap over a year after Class 10, and no
    more than 11 months of prior work experience to still count as a
    fresher. You cannot reapply within three months of a rejection.
    Accenture's own hiring FAQ is explicit that its online assessments are
    proctored and prohibit external AI tools — do not risk it.

    No source, including Accenture's own careers pages, documents a formal
    service bond for India fresher hires the way some other IT services
    firms do; treat that as simply undocumented rather than absent.

