      - { concept: machine-learning-convolutional-neural-network, label: "Computer vision / CNNs", weight: 4,
          notes: "Directly relevant to Photoshop and Firefly's image models." }
      - { concept: ai-engineer-multimodal-ai, label: "Multimodal / generative models", weight: 4,
          notes: "Firefly is a text-to-image and generative-fill product; multimodal reasoning comes up directly." }
      - { concept: machine-learning-metrics-to-evaluate, label: "Model evaluation & metrics", weight: 4 }
      - { concept: machine-learning-validation-techniques, label: "Validation & monitoring in production", weight: 3 }
      - { concept: ai-engineer-ai-safety-and-ethics, label: "Responsible AI", weight: 3,
          notes: "Asked directly on generative-AI-facing roles, not just as a compliance checkbox." }
      - { concept: computer-science-system-design, label: "ML system design", weight: 4 }
    questions:
      - kind: interview
        round: technical
        topic: CNN fundamentals
        difficulty: medium
        year: 2025
        question: >-
          Why do convolutional layers use far fewer parameters than a fully
          connected layer would for the same image input, and what do you
          give up by making that trade?
        answer_md: |
          A fully connected layer learns a separate weight for every
          pixel-to-neuron connection, which explodes in parameter count for
          any realistic image size. A convolutional layer instead learns a
          small filter (say 3×3) that's *shared* across every spatial
          position in the image — the same weights slide across the whole
          input, which is both far fewer parameters and encodes an
          assumption: that a useful local pattern (an edge, a texture) is
          worth detecting the same way regardless of where in the image it
          appears.

          What you give up is exactly that assumption's cost: a CNN has no
          built-in notion of absolute position, so tasks where *where*
          something is matters as much as *what* it is need additional
          structure (positional encoding, or later layers) to recover that
          information.
        source_name: "Adobe Machine Learning Engineer interview guide — InterviewQuery"
        source_url: https://www.interviewquery.com/interview-guides/adobe-machine-learning-engineer

      - kind: interview
        round: system-design
        topic: Generative image pipeline
        difficulty: hard
        year: 2025
        question: >-
          Design the serving pipeline for a text-to-image generation
          feature like Firefly — a user submits a prompt and expects an
          image back in a few seconds.
        answer_md: |
          Start with the latency budget, because it drives every downstream
          choice: a diffusion model's iterative denoising is the dominant
          cost, so the design has to pick a model/step-count trade-off
          (fewer denoising steps, or a distilled faster model) that fits
          the "few seconds" target rather than chasing maximum quality at
          any latency.

          Beyond the model itself: a request queue with GPU batching (group
          concurrent requests onto the same GPU pass where possible), a
          content-safety filter both on the prompt (block clearly unsafe
          requests before spending GPU time) and on the output image before
          it's returned, and a fallback path (a cached "generation failed,
          try again" state) since generative inference has a real, non-zero
          failure rate at scale.
        source_name: "Adobe Machine Learning Engineer interview experience — Taro"
        source_url: https://www.jointaro.com/interviews/companies/adobe/experiences/machine-learning-engineer-october-10-2025-declined-offer-positive-8cd590c4/

      - kind: interview
        round: technical
        topic: Model evaluation
        difficulty: medium
        year: 2025
        question: >-
          A recommendation model has 95% offline accuracy but click-through
          rate barely moved after launch. What do you check?
        answer_md: |
          This is the classic offline/online metric mismatch, and the first
          thing to check is whether the offline metric is even measuring
          the right thing — accuracy on historical data doesn't capture
          whether the *top-ranked* recommendations (the only ones users
          actually see first) are good, which is what click-through
          actually depends on. A ranking metric like NDCG or precision@k
          is usually more honest here than raw accuracy.

          Beyond the metric mismatch: check for training/serving skew (is
          the feature pipeline computing features identically online and
          offline?), and check whether the offline evaluation set reflects
          the live traffic distribution — a model trained and evaluated on
          old user behavior can look great offline while being stale for
          current users.
        source_name: "Adobe Machine Learning Engineer interview guide — InterviewQuery"
        source_url: https://www.interviewquery.com/interview-guides/adobe-machine-learning-engineer

      - kind: online-assessment
        round: coding
        topic: K-means from scratch
        difficulty: medium
        year: 2025
        question: >-
          Implement k-means clustering from scratch, and explain what
          happens if you initialize all centroids to the same point.
        answer_md: |
          The core loop: assign each point to its nearest centroid
          (Euclidean distance), recompute each centroid as the mean of its
          assigned points, repeat until assignments stop changing or a
          max-iteration cap is hit.

          If every centroid starts at the same point, every point is
          equidistant from all centroids (they're identical), so the first
          assignment step ties every point to the same cluster, and the
          recomputed centroids stay identical — the algorithm never
          diverges into separate clusters and converges immediately to a
          useless single-cluster result. This is exactly why k-means++
          initialization (spreading initial centroids apart, weighted by
          distance from already-chosen centroids) is used in practice
          instead of naive random or identical starts.
        source_name: "Adobe Machine Learning Engineer interview guide — InterviewQuery"
        source_url: https://www.interviewquery.com/interview-guides/adobe-machine-learning-engineer

      - kind: interview
        round: managerial
        topic: Responsible AI
        difficulty: medium
        year: 2025
        question: >-
          Describe a time you raised a concern about how a model's output
          could be misused, before or after launch.
        answer_md: |
          On a generative product like Firefly, this is asked directly
          rather than folded into a generic ethics question. Strong
          answers name a specific, concrete misuse scenario (not "bias in
          general") — deepfake-style misuse, copyright-adjacent training
          data, or a content-safety gap — and describe what you actually
          did: a mitigation you proposed, a filter you helped build, or a
          launch you helped delay, not just that you "flagged concerns" in
          the abstract.
        source_name: "Adobe Machine Learning Engineer interview guide — InterviewQuery"
        source_url: https://www.interviewquery.com/interview-guides/adobe-machine-learning-engineer

      - kind: interview
        round: technical
        topic: Transformers
        difficulty: hard
        year: 2025
        question: >-
          Explain, at a mechanical level, what the attention mechanism in a
          Transformer actually computes, and why it scales better for long
          sequences than an RNN's approach.
        answer_md: |
          For each token, attention computes a weighted combination of
          every other token's value vector, where the weights come from a
          similarity score (dot product, scaled and softmaxed) between that
          token's query vector and every other token's key vector — so
          each token directly "looks at" every other token in one step,
          rather than information having to flow through a chain of hidden
          states.

          An RNN processes tokens sequentially, so information from token 1
          reaching token 1000 has to survive 999 sequential updates,
          degrading with distance and preventing parallelization across the
          sequence. Attention's direct, all-pairs comparison removes that
          sequential dependency entirely, which is what makes Transformer
          training parallelizable across the whole sequence — at the cost
          of attention's compute scaling quadratically with sequence
          length, which is the trade-off worth naming as the honest
          downside.
        source_name: "Adobe Machine Learning Engineer interview guide — InterviewQuery"
        source_url: https://www.interviewquery.com/interview-guides/adobe-machine-learning-engineer

  - slug: software-engineer-web
    title: Software Engineer, Web
    level: entry to mid
    maps_to_role: frontend-developer
    sort_order: 3
    source_url: https://www.techprep.app/companies/adobe
    description: >-
      Builds the web surfaces of Creative Cloud and Adobe Express. Keeps
      Adobe's CS-fundamentals bent but layers frontend-specific rounds —
      rendering performance and browser behaviour — on top of it.
    focus_md: |
      Even on frontend-labeled loops, Adobe candidates report CS
      fundamentals questions showing up directly rather than being replaced
      by pure framework trivia — don't assume a "web" role means skipping
      OS/networking prep entirely. On top of that baseline, expect concrete
      performance questions: not "do you know what a reflow is" in the
      abstract, but "here's a component that's janky, find why."
    focus_areas:
      - { concept: frontend-javascript, label: "JavaScript fundamentals", weight: 5 }
      - { concept: frontend-performance, label: "Rendering performance", weight: 4,
          notes: "Diagnosing a janky, real component is a more common prompt than reciting the concept." }
      - { concept: frontend-web-apis, label: "Browser & Web APIs", weight: 3 }
      - { concept: computer-science-data-structures, label: "Data structures & algorithms", weight: 4,
          notes: "The DSA bar is not lowered for frontend candidates at Adobe." }
      - { concept: frontend-accessibility, label: "Accessibility", weight: 3 }
      - { concept: computer-science-networking, label: "Networking fundamentals", weight: 2 }
      - { concept: react-hooks, label: "React", weight: 3,
          notes: "The dominant framework across Adobe's web surfaces." }
    questions:
      - kind: interview
        round: technical
        topic: Rendering performance
        difficulty: medium
        year: 2025
        question: >-
          A list component re-renders every row whenever any single row's
          data changes, and the page visibly jitters on a large list. Find
          the cause and fix it.
        answer_md: |
          The usual cause is a parent component passing a new inline object
          or callback to every child on every render, which breaks
          reference-equality checks (`React.memo`, `shouldComponentUpdate`)
          even when a given row's actual data hasn't changed — so every
          child re-renders regardless of memoization because its props
          "changed" by reference even though not by value.

          The fix: memoize the callback (`useCallback`) and any object
          props passed down, and wrap each row in `React.memo` so it only
          re-renders when its own data actually changes. For very large
          lists, windowing (rendering only the rows currently in the
          viewport) is the complementary fix that avoids paying render cost
          for off-screen rows at all.
        source_name: "Adobe interview questions — Coding Interview"
        source_url: https://www.codinginterview.com/guide/adobe-coding-interview-questions/

      - kind: interview
        round: coding
        topic: Trees
        difficulty: medium
        year: 2025
        question: >-
          Given a binary search tree, find two nodes such that their sum
          equals a given value k.
        answer_md: |
          Same underlying technique regardless of "frontend" vs "backend"
          labeling — Adobe doesn't lower the DSA bar for web roles. Convert
          the BST to a sorted view via in-order traversal (or use two BST
          iterators, one ascending and one descending, for an O(h)-space
          version) and run the standard two-pointer sum search from both
          ends.

          Framing the language choice matters here too: doing this in
          JavaScript is fine and expected — Adobe doesn't require Java/C++
          for a web-track candidate, but the algorithmic reasoning bar is
          identical either way.
        source_name: "GeeksforGeeks — Adobe interview questions and experience — CodingKaro"
        source_url: https://www.codingkaro.in/jobs-internships/leetcode-interview-experience/Adobe

      - kind: interview
        round: technical
        topic: Browser fundamentals
        difficulty: easy
        year: 2025
        question: >-
          What's the difference between a DNS lookup, a TCP handshake and a
          TLS handshake, in terms of what each one is actually establishing?
        answer_md: |
          DNS resolves a hostname to an IP address — nothing is connected
          yet, it's a lookup. The TCP handshake (SYN, SYN-ACK, ACK)
          establishes a reliable, ordered connection between client and
          server at that IP — a transport-layer agreement to exchange
          bytes reliably. The TLS handshake, layered on top of the now-open
          TCP connection, negotiates encryption (cipher suite, key
          exchange) and verifies the server's certificate, establishing a
          secure channel before any application data (the actual HTTP
          request) is sent.

          The practical reason this order matters for a frontend engineer:
          each of these adds a round trip before the first byte of your
          page arrives, which is exactly why connection reuse (keep-alive,
          HTTP/2) and DNS prefetching are real performance levers, not
          just trivia.
        source_name: "Top Adobe interview questions and answers — TechPrep"
        source_url: https://www.techprep.app/companies/adobe

      - kind: online-assessment
        round: coding
        topic: String parsing
        difficulty: medium
        year: 2025
        question: >-
          Given an array of stock prices by day, output for each day the
          count of consecutive days (looking backward) with strictly
          increasing prices.
        answer_md: |
          A monotonic stack does this in one pass: keep a stack of indices
          whose prices are still "active" (haven't been beaten by a later
          higher price in a way that resolves them). For each new day, pop
          indices from the stack while the current price is higher than the
          price at the stack's top index — each pop means "the streak ending
          here extends back past that day" — and the answer for the current
          day is its index minus the index now at the top of the stack
          (or the streak count accumulates as you pop). Push the current
          index.

          Every index is pushed and popped at most once, so the whole pass
          is O(n) despite the nested-looking pop loop — a detail worth
          stating explicitly, since it's easy to misjudge this as O(n²) at
          a glance.
        source_name: "GeeksforGeeks — Salesforce interview experience"
        source_url: https://www.geeksforgeeks.org/interview-experiences/salesforce-interview-experience-set-1-for-sde-1/

      - kind: interview
        round: technical
        topic: Accessibility
        difficulty: medium
        year: 2025
        question: >-
          A custom dropdown component works fine with a mouse but is
          unusable with a keyboard alone. What's likely missing, and how do
          you fix it?
        answer_md: |
          The usual gaps: the component isn't in the natural tab order
          (missing `tabindex`, or built on a non-interactive element like a
          `div` instead of a `button`), arrow-key navigation between
          options isn't implemented, and there's no `aria-expanded` /
          `role="listbox"` semantics telling assistive tech what the
          control actually is.

          The fix is building it on native interactive elements where
          possible (a native `<select>`, or a `button` triggering a
          `role="listbox"` with `role="option"` children), wiring arrow
          keys and Escape explicitly, and managing focus so opening the
          dropdown moves focus into it and closing it returns focus to the
          trigger — accessibility here isn't a CSS afterthought, it's
          keyboard event handling and ARIA semantics done deliberately.
        source_name: "Adobe's interview process & questions — interviewing.io"
        source_url: https://interviewing.io/adobe-interview-questions

      - kind: interview
        round: managerial
        topic: Working across product/design/eng
        difficulty: easy
        year: 2025
        question: >-
          Tell me about a time a design you were asked to implement wasn't
          technically feasible as specified. What did you do?
        answer_md: |
          The signal here is whether you brought a concrete alternative to
          the design/product conversation rather than just a rejection —
          "here's what's not feasible and here's the closest thing that
          is" reads far better than "I told them it wasn't possible."
          Naming how you explained the *technical reason* in terms the
          designer could actually use (a performance budget, a browser API
          limitation) rather than jargon shows the collaboration skill
          being tested.
        source_name: "Adobe's interview process & questions — interviewing.io"
        source_url: https://interviewing.io/adobe-interview-questions
