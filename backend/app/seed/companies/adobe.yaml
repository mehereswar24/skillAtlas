roles:
  - slug: software-engineer
    title: Software Engineer
    level: entry to mid
    maps_to_role: backend-developer
    sort_order: 1
    source_url: https://www.interviewquery.com/interview-guides/adobe-software-engineer
    description: >-
      The generalist backend role behind Document Cloud and Creative Cloud
      services. The loop most consistently tests raw CS fundamentals
      alongside DSA and OOP design.
    focus_md: |
      The distinguishing prep move for Adobe specifically: don't treat OS,
      DBMS and networking as background knowledge you'll only need if a
      coding problem happens to touch them — they show up as direct,
      standalone questions ("explain paging," "what does a semaphore do
      that a mutex doesn't," "what's the difference between a load balancer
      operating at layer 4 vs layer 7"). Candidates who over-invest in DSA
      grinding and under-invest in this direct-recall layer report losing
      rounds they otherwise coded well.
    focus_areas:
      - { concept: computer-science-data-structures, label: "Data structures & algorithms", weight: 5 }
      - { concept: computer-science-design-patterns, label: "OOP design", weight: 4,
          notes: "Class design and SOLID-style reasoning shows up as its own topic, not just inside coding rounds." }
      - { concept: computer-science-processes-and-threads, label: "Operating systems", weight: 4,
          notes: "Paging, semaphores, process vs. thread — asked directly, often verbally." }
      - { concept: computer-science-databases, label: "DBMS fundamentals", weight: 4,
          notes: "Indexing and normalization specifically, asked as standalone questions." }
      - { concept: computer-science-networking, label: "Networking", weight: 3,
          notes: "DNS resolution and load-balancer types are named as recurring 2025/2026 topics." }
      - { concept: computer-science-system-design, label: "System design", weight: 3,
          notes: "Weighted in for experienced candidates specifically." }
      - { concept: java-basics-of-oop, label: "Java", weight: 3,
          notes: "The most common language in the technology screen, alongside C/C++." }
    questions:
      - kind: online-assessment
        round: technical
        topic: Technology screen (C/C++/Java)
        difficulty: easy
        year: 2025
        question: >-
          The HackerRank technology test includes objective and subjective
          questions in your chosen language before any human interview.
          What kind of subjective question actually appears?
        answer_md: |
          Expect short-answer prompts like "what does this code snippet
          output, and why" (testing whether you actually trace execution
          rather than pattern-match), and small write-a-function prompts —
          reverse a linked list, implement a basic stack — that are more
          about clean, bug-free code under mild time pressure than
          algorithmic cleverness. The objective half leans on OOP concepts
          (what does `virtual` do, what's function overriding vs.
          overloading) more than pure trivia.
        source_name: "GeeksforGeeks — Adobe interview preparation"
        source_url: https://www.geeksforgeeks.org/interview-experiences/adobe-interview-preparation/

      - kind: interview
        round: coding
        topic: Linked lists
        difficulty: medium
        year: 2025
        question: >-
          Given two singly linked lists that may intersect at some node,
          find the intersection node — without using extra space
          proportional to either list's length.
        answer_md: |
          The two-pointer trick: walk a pointer down each list; when a
          pointer hits the end of its list, redirect it to the head of the
          *other* list and keep going. If the lists intersect, both
          pointers will meet at the intersection node after at most
          `lenA + lenB` steps, because each pointer ends up traveling the
          same total distance (its own list's non-shared part plus the
          other list's non-shared part plus the shared part).

          If they don't intersect, both pointers reach `null` at the same
          step, which doubles as the "no intersection" detection — no
          separate check needed. O(m+n) time, O(1) space.
        source_name: "GeeksforGeeks — Adobe interview experience, Set 41"
        source_url: https://www.geeksforgeeks.org/interview-experiences/adobe-interview-experience-set-41-software-engineer/

      - kind: interview
        round: technical
        topic: Operating systems
        difficulty: medium
        year: 2025
        question: >-
          What's the difference between a mutex and a semaphore, and give a
          scenario where only a semaphore, not a mutex, would work.
        answer_md: |
          A mutex is binary and owned — only the thread that locked it can
          unlock it, and it protects exactly one critical section from
          concurrent access. A semaphore holds a count and isn't
          ownership-bound — any thread can signal it, and it can allow up
          to N concurrent holders rather than just one.

          The scenario that needs a semaphore specifically: a connection
          pool with, say, 10 available connections. You want up to 10
          threads to proceed concurrently and block the 11th until one is
          released — a mutex only ever allows one thread through, so it
          can't express "up to N concurrent," which is exactly what a
          counting semaphore initialized to 10 does directly.
        source_name: "Adobe's interview process & questions — interviewing.io"
        source_url: https://interviewing.io/adobe-interview-questions

      - kind: interview
        round: technical
        topic: DBMS — indexing & normalization
        difficulty: medium
        year: 2025
        question: >-
          Why would a database team deliberately denormalize a schema that
          was already in third normal form?
        answer_md: |
          Third normal form minimizes redundancy and update anomalies, but
          it does so by spreading related data across more tables, which
          means more joins to answer a common read query. If a specific
          read pattern is hit heavily and joins across several normalized
          tables are the measured bottleneck, deliberately duplicating some
          data (e.g., storing a customer's name directly on an order row
          instead of always joining to the customers table) trades a small
          amount of write-time complexity and redundancy for a
          meaningfully faster, join-free read path.

          The honest caveat worth stating: denormalization should follow a
          measured bottleneck, not precede one — doing it speculatively
          just re-introduces the update-anomaly problems normalization
          exists to prevent, without a proven performance win to justify
          it.
        source_name: "GeeksforGeeks — Adobe interview preparation"
        source_url: https://www.geeksforgeeks.org/interview-experiences/adobe-interview-preparation/

      - kind: interview
        round: system-design
        topic: File versioning system
        difficulty: hard
        year: 2025
        question: >-
          Design the backend for a "version history" feature on a document
          (think Creative Cloud files) — every save creates a restorable
          version, potentially for large files.
        answer_md: |
          Storing a full copy of the file on every save is simple but
          expensive at scale for large files with frequent saves; the
          standard fix is storing the first version in full, then storing
          each subsequent version as a diff (a binary delta) against the
          previous version, reconstructing any specific version by
          replaying deltas from the nearest earlier full snapshot.

          The trade-off worth naming: pure delta chains make restoring an
          old version slower (you replay many deltas), so a real design
          periodically stores a full snapshot again (every N versions) to
          bound how many deltas any single restore has to replay — a
          direct trade between storage cost and restore latency.
        source_name: "Adobe Software Engineer interview guide — InterviewQuery"
        source_url: https://www.interviewquery.com/interview-guides/adobe-software-engineer

      - kind: interview
        round: managerial
        topic: Clean, explained code
        difficulty: easy
        year: 2025
        question: >-
          Tell me about a time you caught a bug in your own code after
          shipping it. How did you find it, and what did you change in your
          process afterward?
        answer_md: |
          Adobe's own reported interviewer preference is explaining
          reasoning clearly over just landing on the correct answer, and
          this question is the behavioural version of the same test:
          candidates who describe *how* they noticed (a specific metric,
          a customer report, a test they added afterward) score better
          than ones who say "I just found it while reviewing," which
          suggests luck rather than a repeatable practice.

          Naming a concrete process change — a new test category, a
          different code review checklist item — is what makes the answer
          land as growth rather than a one-off story.
        source_name: "Adobe's interview process & questions — interviewing.io"
        source_url: https://interviewing.io/adobe-interview-questions

      - kind: online-assessment
        round: coding
        topic: Trees
        difficulty: medium
        year: 2025
        question: >-
          Given a binary search tree, find two nodes whose values sum to a
          given target k.
        answer_md: |
          An in-order traversal of a BST produces values in sorted order,
          so the cleanest approach converts the tree to a sorted sequence
          (or uses two BST iterators — one walking in-order for ascending
          values, one walking reverse-in-order for descending) and applies
          the standard two-pointer technique from both ends, moving inward
          based on whether the current pair's sum is above or below k.

          Doing this with two iterators instead of materializing the full
          sorted array first is the space-optimized version worth
          mentioning as a follow-up — O(h) space instead of O(n), where h
          is the tree's height.
        source_name: "GeeksforGeeks — Adobe interview questions and experience — CodingKaro"
        source_url: https://www.codingkaro.in/jobs-internships/leetcode-interview-experience/Adobe

  - slug: machine-learning-engineer
