    sort_order: 2
    source_url: https://www.interviewquery.com/interview-guides/adobe-machine-learning-engineer
    description: >-
      Ships ML into Adobe's actual products — Firefly's generative image
      models, Sensei's personalization and Experience Platform's fraud and
      recommendation systems. Graded on ML depth, coding, and product
      intuition together, not any one in isolation.
    focus_md: |
      The distinguishing thread through this loop is that a correct model
      is only half the answer — every design question expects you to also
      cover the production path: how it's served, how it's evaluated
      post-launch, and how failure is monitored. Given Firefly is a public
      generative product, expect at least one question that isn't purely
      technical: how you'd advocate for responsible-AI practices on a
      generative feature, since Adobe is vocal about that publicly and asks
      about it directly.
    focus_areas:
