  slug: razorpay
  name: Razorpay
  industry: Fintech / Payments infrastructure
  hq: Bengaluru, Karnataka
  website: https://razorpay.com/jobs/
  icon: CreditCard
  fetched_on: 2026-08-21
  sort_order: 23
  description: >-
    Payments and business-banking infrastructure processing transactions at
    national scale. The domain shapes the loop: correctness under failure
    (idempotency, reconciliation, exactly-once-ish semantics) matters as much
    as raw algorithmic speed.
  hiring_process_md: |
    Razorpay's loop is shorter than most peers — often 3–5 rounds — and
    noticeably weighted toward **past work as evidence of judgment** rather
    than pure whiteboard performance. Expect interviewers to keep steering
    conversation back to your resume: specific architecture decisions you
    made, why, and what you'd do differently.

    **The shape of it**

    1. **Online assessment** — around 90 minutes: MCQs across OS, DBMS, OOP
       and DSA, plus 2–3 coding problems, for campus and early-career hires.
    2. **Technical round(s) (1–2)** — DSA plus, at increasing seniority, a
       machine-coding or low-level design problem ("design an in-memory
       relational database", "build a load balancer") — Razorpay treats this
       as its own signature round the way Flipkart and Swiggy do, just
       phrased around payments primitives (transactions, ledgers, idempotent
       retries) rather than generic ones.
    3. **System design / hiring manager round** — payments-flavoured design
       (a UPI transaction system, a notification service with delivery
       guarantees) blended with a conversation about your past architecture
       decisions.
    4. **HR round** — compensation, notice period.

    **Why "past work" carries real weight here.** A fintech processing
    payments cares more than most about whether an engineer's default
    instinct is "what happens if this fails halfway through" — and the
    fastest way to check that isn't a fresh whiteboard problem, it's asking
    you to defend a real decision you already made. Come prepared to discuss
    *trade-offs*, not just outcomes, on 2–3 projects from your resume.
