company:
  slug: meta
  name: Meta
  industry: Big Tech
  hq: Menlo Park, California
  website: https://www.metacareers.com/
  icon: Infinity
  fetched_on: 2026-07-31
  sort_order: 4
  description: >-
    Facebook, Instagram, WhatsApp and Reality Labs. The most time-pressured
    coding loop in big tech — two problems in 45 minutes is the norm, so speed
    is part of the bar.
  hiring_process_md: |
    Meta's loop is the one where **pace is explicitly part of the signal**.
    Coding rounds typically ask two medium problems in 45 minutes, which leaves
    roughly 20 minutes each including clarification and testing. Candidates who
    solve everything but slowly do get rejected here in a way they would not at
    Microsoft.

    **The shape of it**

    1. **Recruiter pre-screen (~20 min)** — background and behavioural fit.
    2. **Technical phone screen (~45 min)** — one or two DSA problems in a
       shared editor, usually CoderPad.
    3. **The full loop (4–5 rounds, 45 min each)** — two coding rounds, one or
       two system design rounds ("Ninja" rounds at senior levels), and a
       behavioural round Meta calls "Jedi".
    4. **Hiring committee and team matching.**

    **The 2026 change worth knowing.** Meta began piloting an AI-assisted
    coding interview in late 2025: a 60-minute round in a CoderPad environment
    with an AI assistant built in, replacing one of the two coding rounds. It
    is being rolled out more widely through 2026. Practise *using* an assistant
    well — asking it precise questions, checking its output, keeping ownership
    of the design — rather than pretending it is not there.

    **The behavioural round is graded, not a chat.** 45 minutes on what you are
    passionate about in tech and what impact you want to have. Meta is
    assessing whether you would thrive in a fast-moving org, and vague answers
    about "great culture" score badly.

  resources:
    - kind: careers
      title: "Meta hiring process"
      url: https://www.metacareers.com/hiring-process/
