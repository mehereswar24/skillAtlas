company:
  slug: swiggy
  name: Swiggy
  industry: Food delivery & quick commerce
  hq: Bengaluru, Karnataka
  website: https://careers.swiggy.com/
  icon: UtensilsCrossed
  fetched_on: 2026-08-21
  sort_order: 21
  description: >-
    On-demand food delivery and, through Instamart, quick commerce — both
    real-time logistics problems at national scale. The loop is unusually
    honest about which round actually filters: low-level design.
  hiring_process_md: |
    Swiggy's process is direct about what matters: DSA gets you in the door,
    but the **low-level design round is where most rejections happen**, even
    for candidates who cleared DSA cleanly. That's a structural signal worth
    taking seriously if you're prepping.

    **The shape of it**

    1. **Online assessment** — typically three LeetCode-medium-equivalent
       problems, plus language-fundamentals questions for backend roles
       (Java/Spring Boot basics are common).
    2. **DSA technical round(s)** — one to two rounds, live coding, standard
       array/graph/DP territory.
    3. **Low-level design round** — the filter round. A prompt like "design a
       shopping cart with add/remove/apply-coupon" or "design a hotel room
       booking system", graded on class structure, SOLID adherence, and
       whether your design survives a requirement change introduced mid-round.
    4. **Bar-raiser / managerial round** — a senior engineer from *outside*
       your prospective team, explicitly there to catch anyone the earlier
       rounds went soft on. Expect systems questions (networking, OS,
       concurrency, databases) alongside behavioural ones.
    5. **HR** — compensation and offer.

    **What the LLD round actually grades.** Not whether you know design
    patterns by name, but whether your first class diagram survives a
    follow-up. A design where "add discount coupon types" requires touching
    three existing classes instead of adding one new one is the failure mode
    interviewers are trained to probe for.
