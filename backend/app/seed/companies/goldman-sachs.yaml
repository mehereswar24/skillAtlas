  description: >-
    Investment banking with one of the largest engineering divisions in
    finance. Engineering interviews add probability, mental arithmetic and
    "why do you want finance" to the usual coding loop.
  hiring_process_md: |
    Goldman hires engineers in volume — a large share of the firm is technology
    — and the loop looks like a software loop with two additions that catch
    candidates out: **quantitative reasoning under pressure**, and a genuine
    check on why you want to work in finance rather than at a product company.

    **The shape of it**

    1. **Online assessment** — coding problems, plus for many programmes a
       **HireVue** recorded video interview: pre-set questions, a short
       preparation timer, one or two takes.
    2. **Superday** — several back-to-back rounds in one day: coding, CS
       fundamentals, probability and brain-teasers, and behavioural/fit.

    **Two things to prepare that other loops do not need.** Probability
    questions asked conversationally — expected value, conditional
    probability, and the classic urn and dice setups — where the interviewer
    is watching you set up the problem rather than recall a formula. And a
    real answer to "why finance", because a candidate who is clearly using
    Goldman as a fallback is visible immediately.

