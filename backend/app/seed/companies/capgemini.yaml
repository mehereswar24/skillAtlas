  slug: capgemini
  name: Capgemini
  industry: IT Services & Consulting
  hq: Paris, France
  website: https://www.capgemini.com/in-en/careers/join-capgemini/recruitment-process/
  icon: Blocks
  fetched_on: 2026-08-21
  sort_order: 19
  description: >-
    A French-origin IT consultancy with a large India delivery base. Its
    fresher aptitude round has quietly moved from a classic MCQ paper to a
    set of short gamified cognitive tasks — and which package band you land
    in is decided by how much of the coding round you clear.
  hiring_process_md: |
    Capgemini's fresher funnel runs four stages, and the one candidates
    consistently get wrong-footed by is the second: the traditional
    "20 quant + 20 logical reasoning" MCQ paper has been **replaced by a
    game-based cognitive assessment** — four short games (roughly six
    minutes each) drawn from a larger pool, with names like Geo-Sudo, Grid
    Challenge, Motion Challenge and Switch Challenge.

    **The shape of it**

    1. **Online Assessment ("Assessment 1")** — a technical MCQ/pseudocode
       section (25–40 questions on data structures, OOP, DBMS/SQL, OS,
       networking and cloud, mostly "predict the output" style), an English
       communication section (30 questions on grammar and comprehension),
       the game-based cognitive round described above, and an untimed
       behavioural/PowerSkills psychometric section with no right or wrong
       answers.
    2. **Coding Assessment ("Assessment 2")** — required only for candidates
       scoring above a threshold on Assessment 1: 2 problems, 45 minutes,
       language of choice.
    3. **Spoken English assessment** — read-and-repeat, listen-and-answer,
       and a 30-second-prep / 45-second-speak impromptu topic, with no
       repeats allowed.
    4. **Technical + HR interview**, sometimes combined into one 25–35
       minute session — resume and project deep-dive first, then rapid CS
       fundamentals and often a short live-coding task (reverse a string,
       check a palindrome, print binary).

    **The band you land in is gated by the coding assessment, not applied
    for separately.** Clear Assessment 1 alone and you're tracked as
    **Analyst**; clear it at a higher cutoff and solve one of the two coding
    problems and you move to **Star Analyst**; solve both, at higher
    cutoffs throughout, and you reach **Senior Analyst**. Capgemini's own
    careers pages don't name a separate "Digital" or "ADP" fresher track —
    third-party sources consistently describe this three-tier, coding-gated
    structure instead, so that's what this profile uses.

    **Eligibility** runs 60% (or equivalent CGPA) across Class 10, 12,
    diploma (if any) and degree, with sources disagreeing on backlog policy
    — some describe zero active backlogs required, others describe one
    active backlog being tolerated, so confirm against the live posting
    rather than assuming either. Academic gap up to roughly two years is
    accepted, and there's a six-month cooldown before reapplying after a
    rejection.

    **No source, including Capgemini's own pages, publishes an official
    service-bond figure.** Informal candidate and employee reports describe
    something in the range of a three-month training period and a bond
    around ₹1.5–2 lakh tied to a roughly two-year minimum stay, reimbursed
    pro-rata on early exit — treat that as widely reported rather than
    confirmed.

