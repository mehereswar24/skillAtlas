# Atlassian.
#
# Sourcing rules for every file in this directory:
#   * `source_url` is required on every question — the loader rejects one
#     without it.
#   * Questions are written in our own words from what the source describes.
#     Nothing is copied out of a proprietary question bank; where the useful
#     artefact *is* the bank (a company's LeetCode tag, a Glassdoor thread),
#     we link to it instead.
#   * `fetched_on` records when the sources were last checked, and the UI
#     shows it, so stale data is visible rather than silently trusted.

company:
  slug: atlassian
  name: Atlassian
  industry: Enterprise Software
  hq: Sydney, Australia / San Francisco, California
  website: https://www.atlassian.com/company/careers
  icon: Layers
  fetched_on: 2026-08-21
  sort_order: 10
  description: >-
    Jira, Confluence, Trello and Bitbucket. Atlassian is unusually open about
    its interview format, and grades a dedicated values round with the same
    rigour it grades code — a strong loop with a generic values answer is a
    real way to lose an offer here.
  hiring_process_md: |
    Atlassian publishes its interview loop, which is rarer than it sounds, and
    the loop rewards candidates who take that publication seriously rather
    than treating the published guide as marketing.

    **The shape of it**

    1. **Recruiter screen (30 min)** — background, motivation, logistics.
    2. **Technical screen (45–60 min, usually run by Karat, a third-party
       interviewing service, not an Atlassian engineer)** — often opens with
       rapid-fire fundamentals (networking, OS, complexity) before one or two
       coding problems in a shared editor.
    3. **Virtual onsite loop (4–5 rounds, ~60 min each):**
       - **Coding** — data structures and algorithms, plus a low-level design
         problem (design a class, not a distributed system).
       - **System design** — one full round from mid-level up.
       - **Values interview** — a dedicated round, run by someone *outside*
         your hiring chain, that maps structured questions to Atlassian's five
         values.
       - **Manager interview** — career trajectory, collaboration style, why
         this team.
    4. **Hiring committee** — reviews the packet before an offer goes out.

    **What actually gets graded.** The published guide is explicit that
    Atlassian does not grade language trivia — you pick your language, and
    fluency in it matters less than how you reason through a problem out
    loud. The one place candidates consistently underprepare is the values
    round: it is graded on a rubric, not vibes, and a technically strong
    candidate with a generic "I'm a team player" answer can still be rejected
    there. The five values — Open company, no bullshit; Build with heart and
    balance; Don't #@!% the customer; Play, as a team; Be the change you seek
    — each need at least one concrete STAR story, ideally with a result you'd
    do differently in hindsight, because a story where you were simply right
    the whole time reads as rehearsed.
  resources:
    - kind: careers
      title: "Engineering Interview Guide — Atlassian Careers"
      url: https://www.atlassian.com/company/careers/resources/interviewing/engineering
    - kind: careers
      title: "Atlassian's values"
      url: https://www.atlassian.com/company/values
    - kind: careers
      title: "Atlassian Careers"
