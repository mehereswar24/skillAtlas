company:
  slug: wipro
  name: Wipro
  industry: IT Services (India)
  hq: Bengaluru, India
  website: https://careers.wipro.com/
  icon: Sun
  fetched_on: 2026-08-21
  sort_order: 17
  description: >-
    A large Indian IT services employer running several parallel fresher
    tracks at once — Elite, Turbo and the sponsored-degree WILP program —
    each with its own online test, pay band and bar to clear.
  hiring_process_md: |
    Wipro doesn't run one fresher pipeline, it runs several, and which one
    you land in changes what the online test actually contains.

    **The tracks**

    - **Elite (NTH)** — the main engineering-degree track. ₹6.5 LPA. The
      online assessment includes a coding section.
    - **Turbo** — a lighter, higher-volume entry track. ₹3.5 LPA. The online
      assessment is aptitude and an essay, with no coding component reported.
    - **Hexa** — a smaller, harder top band (₹10 LPA) with DSA and
      system-design content, for candidates who want to push for it.
    - **WILP (Work Integrated Learning Program)** — for B.Sc/BCA graduates.
      Pays ₹2.5–3.5 LPA plus a reported ₹75,000 joining bonus, and bundles
      the job with a Wipro-sponsored M.Tech pursued alongside live client
      work, across five specialisations (IT Infrastructure, Testing, Project
      Engineering, Digital Workspace Services, Cloud Services).

    **The shape of it, Elite/Hexa track:**

    1. **Online test** — quant, logical reasoning and verbal, plus a coding
       section (2 problems, your choice of Java/C/C++/Python).
    2. **Technical interview** — programming fundamentals, OOP, DBMS, OS, and
       your resume project; sometimes live coding or debugging.
    3. **HR interview** — self-intro, relocation, and comfort with the
       service agreement.

    **Turbo/WILP track** drops the coding section from the online test —
    it's aptitude plus a timed essay — and WILP inserts an extra **Business
    Discussion round** (a resume-and-behavioural panel) between the test and
    the HR round.

    **No source, including Wipro's own careers pages, publishes a negative
    marking policy or sectional cutoffs for any of these tests** — treat
    both as undisclosed rather than assume either exists.

    **The service agreement is the one thing every track's HR round asks
    about directly.** A 15-month bond is widely reported by candidates and
    former employees, sometimes cited with a ₹75,000 exit penalty tied to
    the cost of Wipro's 45–60 day structured training — but this figure
    comes from candidate and employee reports rather than an official Wipro
    page, so treat it as commonly reported rather than confirmed for the
    current cycle. Whatever the number, expect the question, and answer it
    honestly rather than agreeing reflexively.

    **Eligibility** for 2026 typically runs 60% or 6.0 CGPA across Class 10,
    12 and graduation for Elite/Turbo (some listings for Turbo specifically
    cite 65%/6.5 — check the live posting), zero *active* backlogs at
    joining, and a maximum academic gap of one year for Elite/Turbo (wider,
    2–3 years, for WILP). Age limits are typically 28 for Elite/Turbo and 30
    for WILP.

