company:
  slug: cognizant
  name: Cognizant
  industry: IT Services (India)
  hq: Teaneck, New Jersey, USA
  website: https://careers.cognizant.com/india-en/pathways-to-cognizant/genc-program/
  icon: Network
  fetched_on: 2026-08-21
  sort_order: 15
  description: >-
    Runs one umbrella campus drive that bands candidates into three fresher
    tracks — GenC, GenC Pro and GenC Next — by assessment and interview
    performance, the same score-decides-your-band model TCS uses with the
    NQT. Cognizant is also unusual among its peers for publicly stating
    freshers sign no service bond.
  hiring_process_md: |
    You apply to one Cognizant campus drive, not to a named track — GenC,
    GenC Pro (also called GenC Elevate in some cycles) and GenC Next are
    assigned afterward, at Cognizant's discretion, based on how you score.

    **The shape of it, GenC (baseline track)**

    1. **Communication Assessment** (~60 min) — reading, listening, speaking
       and grammar, AI-scored.
    2. **Aptitude Assessment** (~80 min) — 30 quantitative-aptitude
       questions, plus a gamified logical-reasoning block: 4 tasks drawn
       from a pool of roughly 24 (named examples include Deductive Challenge,
       Switch Challenge and Grid Challenge).
    3. **Technical Assessment** (120 min, at a test centre) — pick one skill
       cluster before you start (Java+Web, Python+Cloud, or C#+Web), then
       answer 2 coding questions, 2 SQL queries, one web-layout task and 10
       cloud MCQs. **No negative marking** is explicitly stated for this
       round.
    4. **Combined technical + HR interview** (30–45 min).

    **The banding mechanic that decides your track lives inside the
    technical assessment.** At the GenC bar, you only need to solve **3 of
    the 4** core SQL/coding questions to pass. Score high enough overall —
    roughly the 90th percentile — and you're routed to **GenC Next**
    interviews instead, where the same round requires **all 4** questions
    solved; land between the two cutoffs and you're routed to **GenC
    Pro/Elevate**, which also requires all 4. GenC Next additionally opens
    with a Code Debugging round (20 MCQs on programming constructs, DSA and
    SQL) rather than a plain aptitude test, and maps you into a
    specialisation — AI/ML, Full Stack, Cloud/AWS, Cybersecurity or Data
    Science — based on your declared skills.

    **Eligibility.** GenC and GenC Pro: 60% (or 6.0 CGPA) consistently
    across Class 10, 12, and your degree. **GenC Next asks for 70%** across
    the same set — a genuinely higher bar, not just a harder interview. All
    three require zero active backlogs, a full-time degree with no more
    than a two-year total academic gap, and Indian citizenship (or
    OCI/PIO status) with willingness to work any location or shift.

    **Cognizant's own careers page states GenC runs "no bonds": employment
    based on trust rather than contractual obligation.** That's a genuine
    point of difference from Wipro, TCS and Infosys, all of which describe
    a service agreement of some kind. No source found documents a specific
    notice period for accepting or declining an offer — treat that as
    simply undisclosed rather than assume a figure.

