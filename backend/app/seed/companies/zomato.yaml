  description: >-
    Restaurant discovery, food delivery, and — through Blinkit — quick
    commerce, under parent company Eternal. Loop is a shorter, more
    conversational version of the standard product-company pattern, with
    scalability discussion woven into the coding rounds rather than isolated
    in a single system-design round.
  hiring_process_md: |
    Zomato's loop is compact — often 4 rounds inside two to three weeks — and
    distinctive in one way: interviewers reward candidates who bring up
    **scale considerations unprompted** during ordinary coding rounds, not
    just in a dedicated design round.

    **The shape of it**

    1. **Online assessment** — 2–4 questions (DSA plus debugging-style
       problems) in 90–120 minutes, run on Intervue or HackerRank depending
       on the drive.
    2. **Technical rounds (2–3)** — DSA (arrays, trees, graphs, DP), live
       coding in your language of choice, and — for SDE-1/2 — a system
       design component folded into the same round rather than always split
       out separately.
    3. **Managerial round** — a senior engineer or eng lead from a different
       team, deliberately outside your reporting line, covering project
       depth and how you've handled disagreement or ambiguity.
    4. **HR** — compensation, offer.

    **What "reward scalability discussion" means in practice.** If a coding
    round question can plausibly be a production system (a rate limiter, a
    URL shortener, an order queue), interviewers are listening for whether
    you mention caching, sharding, or a message queue as a natural extension
    — even briefly — rather than stopping once the algorithm works. Frontend
    candidates get an analogous version: after a correct implementation,
    expect a question about how it'd hold up in a production React app
    (re-render cost, memoization) rather than a separate round for it.
