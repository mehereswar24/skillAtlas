    questions:
      - kind: online-assessment
        round: coding
        topic: Arrays
        difficulty: medium
        year: 2023
        question: >-
          Given an array of prices seen over time, find the greatest
          difference between two elements where the larger one appears after
          the smaller one.
        answer_md: |
          This is "best time to buy and sell a stock" under a different
          name — a single pass tracking the minimum value seen so far and
          the best difference found so far, updating both as you scan left
          to right. O(n) time, O(1) space; no nested loop is needed because
          you never need to re-examine an earlier minimum once a smaller one
          has appeared.

          Recognising the shape instantly and saying so is worth more than
          the algorithm itself here — this is exactly the kind of "don't
          burn ten minutes re-deriving something standard" moment a phone
          screen is timed around.
        source_name: JoinTaro — Uber Site Reliability Engineer interview experience
        source_url: https://www.jointaro.com/interviews/companies/uber/experiences/site-reliability-engineer-san-francisco-ca-may-1-2017-no-offer-neutral-9d1c86c7/

      - kind: interview
        round: coding
        topic: Caching & data structures
        difficulty: medium
        year: 2023
        question: >-
          Whiteboard an LRU cache with O(1) get and put. Then: where would
          you actually use one in a service that looks up a driver's last
          known location?
        answer_md: |
          A hashmap from key to node, plus a doubly linked list ordered by
          recency, gives O(1) for both operations: the map finds the node
          instantly, the list lets you unlink and re-splice it to the front
          without shifting anything. On eviction, drop the tail.

          The follow-up is the real test. A driver-location cache *is* an
          LRU-friendly access pattern — a small number of drivers get looked
          up repeatedly while they're active. But LRU alone is wrong for
          this use case, because eviction by recency doesn't guarantee
          freshness: a driver who's been quiet for thirty seconds but was
          heavily queried a minute ago would stay cached with a stale
          position. You'd pair the cache with a short TTL on top of LRU
          eviction, not rely on LRU by itself.
        source_name: JoinTaro — Uber Site Reliability Engineer interview experience
        source_url: https://www.jointaro.com/interviews/companies/uber/experiences/site-reliability-engineer-san-francisco-ca-may-1-2017-no-offer-neutral-9d1c86c7/

      - kind: interview
        round: technical
        topic: Linux troubleshooting
        difficulty: hard
        year: 2023
        question: >-
          A production VM is misbehaving and you cannot get an SSH session
          onto it. Walk through everything you'd try, starting from the
          network layer down.
        answer_md: |
          Work outward-in rather than guessing at a cause. First: is the
          instance actually running, per the cloud provider's console, not
          just "is it pingable" — a hung box and a network partition look
          identical from outside. If it's running, use the provider's
          out-of-band console/serial access rather than the network path,
          since that's exactly what SSH failing rules out.

          From there, the usual culprits in order of how fast they rule
          things in or out: load average so high the box can't fork a new
          shell (a fork bomb or thrashing process); the disk full, so no new
          PTY can be allocated at all; or a security-group/firewall change
          that blocked port 22 specifically while everything else still
          works. The grading signal is the order you check things in, not
          just the list — climbing from "is the box alive" to "is the
          daemon alive" to "is the daemon starved" rules things out in the
          fewest steps.
        source_name: JoinTaro — Uber Site Reliability Engineer interview experience
        source_url: https://www.jointaro.com/interviews/companies/uber/experiences/site-reliability-engineer-san-francisco-ca-may-1-2017-no-offer-neutral-9d1c86c7/

      - kind: interview
        round: technical
        topic: Production troubleshooting
        difficulty: hard
        year: 2024
        question: >-
          One in twenty requests to a service starts failing with a 500
          about ten minutes ago. There's been no deploy of that service.
          Walk through how you'd find the cause.
        answer_md: |
          "No recent deploy of mine" doesn't mean "no recent change" —
          that's the trap in the prompt. A fixed fraction like 1-in-20 is a
          strong hint it's structural rather than random: one of N replicas
          behind a load balancer, one bad AZ, or a dependency that only
          some request paths touch.

          This is exactly what Uber's own observability stack is built for:
          pull Jaeger traces on a sample of the failing requests to see
          which downstream hop is actually erroring, rather than guessing,
          then slice an M3/Grafana dashboard by host, region, and dependency
          instead of staring at one global error-rate line — a global graph
          can look almost flat while one shard is on fire. Other non-deploy
          causes worth naming: a config or feature-flag rollout, a
          certificate expiring on a single host, or a dependency's *own*
          deploy that you wouldn't see in your service's history at all.
        source_name: "Uber Engineering blog — Optimizing Observability with Jaeger, M3, and XYS"
        source_url: https://www.uber.com/en-GB/blog/optimizing-observability/

      - kind: interview
        round: system-design
        topic: Global-scale ingestion
        difficulty: hard
        year: 2023
        question: >-
          Design a pipeline that ingests roughly 100TB per day of trip and
          location events from every city Uber operates in, queryable within
          minutes for real-time dashboards and downstream ML training.
        answer_md: |
          Don't backhaul everything to one region before processing it —
          ingest close to where it's generated, and only aggregate what
          actually needs to be global. Put a durable log (a Kafka-shaped
          queue) as the front door so a slow downstream consumer applies
          back-pressure to itself, not to every producer upstream.

          Split the read side into two paths rather than one system trying
          to serve both: a stream processor for the "queryable within
          minutes" dashboard path, and a batch/lake path for ML training
          data that doesn't need minute-fresh guarantees. Partition
          everything by city or H3 cell so one unusually busy city can't
          skew shard load for the rest. The bottleneck worth naming
          explicitly: fan-out to many independent consumers — dashboards,
          ML pipelines, billing — is usually the actual scaling problem
          here, not raw ingest throughput.
        source_name: JoinTaro — Uber Site Reliability Engineer interview experience
        source_url: https://www.jointaro.com/interviews/companies/uber/experiences/site-reliability-engineer-san-francisco-ca-may-1-2017-no-offer-neutral-9d1c86c7/

      - kind: interview
        round: managerial
        topic: Ownership & ambiguity
        difficulty: medium
        year: 2024
        question: >-
          Tell me about an incident where the fix that actually worked
          wasn't the first thing you tried. What did you learn, and did
          anything change beyond that one incident?
        answer_md: |
          The story should include a wrong hypothesis you pursued and
          abandoned — "I nailed it on the first try" answers a different,
          less interesting question than the one being asked. Interviewers
          are listening for how you updated when your first theory didn't
          pan out, not for a flawless diagnosis.

          The ending matters more than the middle: a story that stops at
          "and then we fixed it" is weaker than one that ends at "and that's
          why this class of incident stopped recurring" — a new alert
          threshold, a runbook that didn't exist before, a monitor that
          would have caught it sooner. That's the blameless-postmortem
          instinct the round is actually checking for, and it's the
          difference between a story about a fix and a story about ownership.
        source_name: TechPrep — Uber's Interview Process
        source_url: https://www.techprep.app/blog/uber-interview-process
