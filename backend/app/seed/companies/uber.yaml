# Uber.
#
# Sourcing rules for every file in this directory:
#   * `source_url` is required on every question — the loader rejects one
#     without it.
#   * Questions are written in our own words from what the source describes.
#     Nothing is copied out of a proprietary question bank; where the useful
#     artefact *is* the bank (LeetCode's company tag), we link to it instead.
#   * `fetched_on` records when the sources were last checked, and the UI shows
#     it, so stale data is visible rather than silently trusted.

company:
  slug: uber
  name: Uber
  industry: Transportation & Logistics
  hq: San Francisco, California
  website: https://jobs.uber.com/en/teams/engineering/
  icon: Navigation
  fetched_on: 2026-08-21
  sort_order: 2
  description: >-
    Ride-hailing, food delivery and freight, coordinated in real time across
    thousands of cities. Its interviews test the same instinct the product
    needs: can you reason about a live, two-sided marketplace under geography
    and latency constraints, not just clear a DSA bar.
  hiring_process_md: |
    Uber's loop is a fairly standard big-tech shape — recruiter, screen,
    onsite, committee — with one real difference: **the questions inside it
    are pulled from Uber's own domain far more often than at a generalist
    shop.** Expect the interviewer to hand you a version of a problem Uber
    actually has, not an abstract "design Twitter" — matching a driver to a
    rider, pricing a trip in real time, keeping a location fresh across a
    fleet.

    **The shape of it**

    1. **Recruiter call** — background, level, timing.
    2. **Online assessment (sometimes skipped)** — 3 problems in about an
       hour, run on CodeSignal or HackerRank depending on which pipeline you
       land in. Medium-to-hard DS&A.
    3. **Technical phone screen** — one more live-coded problem with an
       engineer, 45–60 minutes.
    4. **Onsite (4–6 rounds, on one day or spread over two)** — typically a
       general coding round, a second "machine coding" round where you write
       a working class model rather than talk about one (a parking lot, an
       elevator, a small booking engine), a system design round, and a
       collaboration/leadership round. Senior loops add a dedicated
       bar-raiser.
    5. **Hiring committee**, then an offer.

    **What actually gets graded differently here.** The machine-coding round
    catches people who over-prepared for whiteboard-only interviews — it
    wants code that runs against a couple of cases the interviewer hands you,
    not a class diagram. The system design round rewards candidates who can
    talk about geospatial data structures and real-time staleness, because
    that is the substrate under almost everything Uber builds. And the
    behavioural round is graded against Uber's own stated values, so a story
    that is all technical execution and no judgment call under ambiguity
    tends to underperform it, regardless of how strong the rest of the loop
    was.
