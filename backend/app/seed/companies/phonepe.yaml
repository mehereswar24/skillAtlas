    focus_md: |
      The distinguishing round at this level is a take-home LLD problem on
      some tracks: roughly two hours to submit a working design, followed by
      a live discussion of *why* you made specific choices — which means the
      round is really testing whether you can defend trade-offs under
      questioning, not just produce a clean diagram. Treat the live
      discussion as the graded part, not the submission.

      System design at SDE-2 is explicitly UPI-flavoured. Understand the
      actual UPI request/collect flow, why settlement between banks is
      asynchronous, and what a reconciliation job does — PhonePe's design
      rounds assume this domain knowledge rather than teaching it to you
      inside the interview.
    focus_areas:
