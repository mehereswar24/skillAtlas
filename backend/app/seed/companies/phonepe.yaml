  slug: phonepe
  name: PhonePe
  industry: Fintech / Digital payments
  hq: Bengaluru, Karnataka
  website: https://www.phonepe.com/careers/
  icon: Smartphone
  fetched_on: 2026-08-21
  sort_order: 24
  description: >-
    India's largest UPI payments app by transaction volume, plus an
    insurance and wealth-management arm (Pulse). The loop is unapologetically
    machine-coding-heavy and its system design rounds are consistently
    payments-flavoured rather than generic.
  hiring_process_md: |
    PhonePe's loop is close in shape to Flipkart's and Razorpay's — both
    unsurprising, since all three lean on machine coding as a serious filter
    — but PhonePe pushes the payments framing deeper into the system design
    round than most: expect UPI-specific vocabulary (settlement, ledgers,
    reconciliation) rather than generic "design a URL shortener" prompts.

    **The shape of it**

    1. **Online assessment** — 4 questions across a spread of difficulty (1
       easy, 2 medium, 1 hard is a commonly reported mix), plus some UNIX/
       shell-flavoured questions for certain tracks.
    2. **Technical/DSA rounds (2)** — each typically 2 DSA problems, live
       coding, standard product-company syllabus.
    3. **Machine coding round** — roughly 90 minutes to build a small,
       actually-running object-oriented system, graded the same way as
       Flipkart's and Swiggy's: does it run, is it extensible, are the
       abstractions clean. Some tracks instead give a **take-home LLD
       problem** with ~2 hours to submit, followed by a live discussion of
       the trade-offs with a senior engineer.
    4. **System design (SDE-2 and above)** — payments-domain design: UPI
       transaction status, distributed ledgers, reconciliation between
       PhonePe's system and a bank's.
    5. **Hiring manager & HR** — project depth, ownership, then compensation.

    **What to prepare beyond generic system design.** Spend real time
    understanding how UPI actually works end to end — the request/collect
    flow, why settlement is asynchronous, what a reconciliation job is for —
    because PhonePe's design rounds assume you can reason about *this*
    domain's specific failure modes, not just generic distributed-systems
    trade-offs.
