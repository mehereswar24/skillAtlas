      - { concept: backend-relational-databases, label: "Transactions & ledgers", weight: 4 }
      - { concept: system-design-reliability-patterns, label: "Reconciliation & failure handling", weight: 4,
          notes: "Async settlement means stuck/ambiguous transaction states are a first-class design concern." }
      - { concept: backend-message-brokers, label: "Async processing & queues", weight: 3 }
      - { concept: computer-science-data-structures, label: "Data structures & algorithms", weight: 3 }
      - { label: "Hiring manager round", weight: 3 }
    questions:
      - kind: interview
        round: technical
        topic: Low-level design
        difficulty: hard
        year: 2025
        question: >-
          Design a flight aggregator system: it pulls availability and pricing
          from multiple airline partners, and users search and book flights
          across them.
        answer_md: |
          The core abstraction is an `AirlineAdapter` interface with a
          uniform `searchFlights(query)` and `bookFlight(details)` contract,
          with one concrete implementation per airline partner translating
          the aggregator's uniform request format into each airline's own
          API shape — this isolates the "every partner has a different API"
          problem behind a stable internal contract, so adding a new airline
          partner means writing one new adapter, not touching the search or
          booking flow.

          The design's hard edge is booking: a user selects a flight based on
          a price/availability snapshot that may be stale by the time they
          confirm (another user booked the last seat in between). The
          realistic pattern is a short-lived reservation hold — call the
          airline's hold-or-reserve API (if offered) at selection time with a
          TTL, and only finalize payment after confirming the hold is still
          valid — rather than assuming the search-time snapshot is still
          accurate at booking time. Naming this staleness problem unprompted
          is the differentiator between a working sketch and a production-
          aware one.
        source_name: GeeksforGeeks — PhonePe Interview Experience for SDE
        source_url: https://www.geeksforgeeks.org/interview-experiences/phonepe-interview-experience-for-sde-2-5-years-experienced/

      - kind: interview
        round: system-design
        topic: Payments
        difficulty: hard
        year: 2025
        question: >-
          A UPI transaction is initiated but the status callback from the
          bank never arrives — the transaction sits in "pending" indefinitely
          from the user's point of view. Design the mechanism that resolves
          this.
        answer_md: |
          This is a reconciliation-job design question — the same underlying
          problem as Razorpay's stuck-transaction question, phrased around
          UPI specifically. A background job periodically scans transactions
          stuck in `PENDING` past a threshold (e.g. 2 minutes) and actively
          queries the bank/NPCI's status-check API for each one, rather than
          waiting indefinitely for a callback that may simply never arrive
          due to a dropped connection on the bank's side.

          The design needs an explicit state machine beyond
          `PENDING`/`SUCCESS`/`FAILED`: something like
          `PENDING → RECONCILING → RESOLVED(SUCCESS/FAILED)`, so the
          reconciliation job's in-progress checks don't race with a late-
          arriving callback that resolves the transaction independently —
          whichever resolves it first should make the other a no-op, which
          usually means the resolution write itself needs to be idempotent
          and conditioned on the transaction still being in a resolvable
          state. The strongest answers explicitly say "the callback is
          best-effort; the reconciliation job is the actual guarantee" —
          reversing which mechanism you trust is the point of the question.
        source_name: GeeksforGeeks — PhonePe Interview Experience for SDE
        source_url: https://www.geeksforgeeks.org/interview-experiences/phonepe-interview-experience-for-sde-2-5-years-experienced/

      - kind: online-assessment
        round: coding
        topic: Graphs
        difficulty: medium
        year: 2025
        question: >-
          Given a directed graph representing service dependencies, determine
          if there's a circular dependency, and if not, return a valid
          initialization order.
        answer_md: |
          This is cycle detection plus topological sort. Run a DFS tracking
          three states per node — unvisited, in the current recursion stack
          ("visiting"), and fully processed ("visited"). If you ever reach a
          node that's currently "visiting" (on the recursion stack), that's a
          back edge, meaning a cycle exists. If DFS completes with no back
          edge found, appending each node to the front of a result list as
          its DFS call finishes gives a valid topological order.

          The distinction worth stating clearly: "visiting" (grey, currently
          on the call stack) versus "visited" (black, fully done) is what
          distinguishes a real cycle from just revisiting an already-
          processed node through a different path, which is not a cycle —
          conflating the two states is the most common bug in this pattern.
        source_name: GeeksforGeeks — PhonePe Interview Experience for SDE
        source_url: https://www.geeksforgeeks.org/interview-experiences/phonepe-interview-experience-for-sde-2-5-years-experienced/

      - kind: interview
        round: managerial
        topic: Ownership
        difficulty: medium
        question: >-
          Describe a time you had to make a call with incomplete information
          because a decision couldn't wait. How did it turn out?
        answer_md: |
          The hiring-manager round is checking judgment under uncertainty,
          not whether the decision was ultimately "correct" — payments
          systems regularly force exactly this kind of call (ship a fix now
          with a known partial risk, or wait and leave users blocked longer).

          Structure the answer around what information you *did* have, what
          you explicitly decided to accept as risk rather than resolve, and
          how you communicated that risk to stakeholders rather than hiding
          it. A story where the decision turned out imperfectly but the risk
          was flagged and monitored reads as more mature than a story where
          everything worked out but you got lucky and never named the risk
          at all.
        source_name: PhonePe Interview Experience — Roundz (Substack)
        source_url: https://roundz.substack.com/p/interview-experience-130-phonepe-sde2

      - kind: interview
        round: technical
        topic: Concurrency
        difficulty: hard
        question: >-
          Two services need to process the same UPI collect-request exactly
          once each, even though messages can be redelivered by the queue.
          How do you guarantee that?
        answer_md: |
          Message queues typically guarantee at-least-once delivery, not
          exactly-once, so "exactly once" has to be engineered at the
          consumer, not assumed from the queue's guarantee — the standard
          pattern is idempotent consumption: each message carries a unique
          id, and the consumer records processed message ids (in the same
          transaction as whatever side effect processing the message causes)
          before considering it done.

          On redelivery, the consumer checks whether it's already processed
          that message id and, if so, acknowledges without reprocessing. The
          subtlety: the "record as processed" write and the actual business
          effect (crediting a wallet, updating a transaction status) must
          happen atomically — recording completion in a separate step from
          the effect reopens the same race the idempotency-key pattern is
          meant to close, so this is the same principle as Razorpay's
          double-charge question, applied at the message-consumer layer
          instead of the API layer.
        source_name: GeeksforGeeks — PhonePe Interview Experience for SDE
        source_url: https://www.geeksforgeeks.org/interview-experiences/phonepe-interview-experience-for-sde-2-5-years-experienced/

      - kind: online-assessment
        round: aptitude
        topic: Databases
        difficulty: medium
        question: >-
          Explain database sharding and how you'd choose a shard key for a
          table of UPI transactions.
        answer_md: |
          Sharding splits one logical table across multiple physical database
          instances by a chosen key, so no single instance holds — or needs
          to handle write load for — the entire dataset. The choice of shard
          key determines which query patterns stay fast (single-shard) and
          which become expensive (cross-shard scatter-gather).

          For UPI transactions specifically, sharding by `user_id` (or the
          payer's account identifier) keeps "show this user's transaction
          history" — a very common query — confined to a single shard, at
          the cost of making "total transaction volume across all users
          today" (an analytics query, not an operational one) require
          aggregating across every shard. That's usually the right trade to
          make: optimise the shard key for the hot operational query path,
          and push cross-shard analytical queries to a separate pipeline
          (CDC into a warehouse) rather than trying to serve them efficiently
          from the sharded operational store directly.
        source_name: GeeksforGeeks — PhonePe Interview Experience for SDE
        source_url: https://www.geeksforgeeks.org/interview-experiences/phonepe-interview-experience-for-sde-2-5-years-experienced/
