      The OA's mixed difficulty (1 easy, 2 medium, 1 hard is the commonly
      reported shape) rewards time management over raw speed — don't burn 40
      minutes perfecting the easy one. Budget time proportional to points,
      not to how satisfying a clean solution feels.

      For the machine coding round, PhonePe's prompts skew toward things with
      obvious real-world analogues in its own product (a wallet balance
      system, a simple order/booking tracker) — practicing exactly this
      shape of prompt (state + transitions + a service layer around it) pays
      off more than generic LeetCode grinding once you're past the DSA
      rounds.
