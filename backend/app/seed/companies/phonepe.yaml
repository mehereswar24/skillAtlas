    questions:
      - kind: online-assessment
        round: coding
        topic: Dynamic programming
        difficulty: hard
        year: 2025
        question: >-
          Given an encoded string where a number followed by a bracketed
          substring means "repeat that substring that many times" (e.g.
          "3[ab]" → "ababab"), decode the full string, including nested
          brackets (e.g. "2[3[a]b]").
        answer_md: |
          A stack-based approach handles the nesting cleanly: walk the string
          character by character, and whenever you hit `[`, push the current
          decoded-string-so-far and the current repeat count onto separate
          stacks, then reset both to start building the inner bracket's
          content fresh. When you hit `]`, pop the previous string and
          repeat count, and append `count × innerString` onto the popped
          string — this naturally handles arbitrary nesting depth because
          each `[` creates a fresh "frame" and each `]` resolves one level.

          The habit worth stating out loud: recognising "nested, recursively-
          structured input" as a stack signal, the same way balanced-
          parentheses problems are, is the actual insight — the repeat-and-
          append mechanics are secondary once you've identified the shape.
        source_name: GeeksforGeeks — PhonePe Interview Experience for SDE
        source_url: https://www.geeksforgeeks.org/interview-experiences/phonepe-interview-experience-for-sde-2-5-years-experienced/

      - kind: interview
        round: technical
        topic: Machine coding
        difficulty: hard
        year: 2025
        question: >-
          Design and implement a digital wallet: users can top up, transfer
          money to other users, and view a transaction history, with a
          balance that must never go negative.
        answer_md: |
          Model `Wallet` as owning a `balance` and a list of `Transaction`
          records (type: TOPUP/TRANSFER_IN/TRANSFER_OUT, amount, timestamp,
          counterparty). The transfer operation is the actual design test:
          it must debit one wallet and credit another as a single unit — if
          you model it as two independent calls (`walletA.debit()` then
          `walletB.credit()`), a failure between the two leaves the system
          inconsistent, which is exactly the bug this prompt is checking
          whether you'll introduce.

          Guard the never-negative constraint at the debit boundary — reject
          the transfer atomically if the balance check fails, rather than
          debiting first and validating after. In a single-process in-memory
          version, wrapping the debit-and-credit pair in a synchronized block
          (or equivalent) keyed appropriately prevents a race between two
          concurrent transfers from the same wallet; naming that this is the
          same problem a real distributed wallet service solves with a
          database transaction is worth a sentence even though you won't
          implement a database in 90 minutes.
        source_name: PhonePe Interview Experience — Roundz (Substack)
        source_url: https://roundz.substack.com/p/interview-experience-130-phonepe-sde2

      - kind: interview
        round: coding
        topic: Trees
        difficulty: medium
        question: >-
          Given a binary tree, serialize it to a string and deserialize it
          back to the original tree.
        answer_md: |
          Pre-order DFS traversal is the standard approach: serialize by
          visiting root, then left, then right, writing a sentinel value
          (e.g. "#") for null children, separated by a delimiter. E.g. a
          tree with root 1, left null, right 2 serializes to `"1,#,2,#,#"`.

          Deserializing reconstructs by reading tokens in the same order they
          were written: read one token, if it's the null sentinel return
          null, otherwise create a node with that value and recursively
          deserialize its left and right children from the remaining tokens
          — the recursion naturally consumes tokens in the exact order
          pre-order serialization produced them, which is why pre-order
          (not in-order) is the traversal to use here: pre-order alone,
          with null markers, is enough to uniquely reconstruct the tree,
          while in-order alone is not.
        source_name: GeeksforGeeks — PhonePe Interview Experience for SDE
        source_url: https://www.geeksforgeeks.org/interview-experiences/phonepe-interview-experience-for-sde-2-5-years-experienced/

      - kind: online-assessment
        round: technical
        topic: Operating systems
        difficulty: easy
        question: >-
          What does the UNIX command `chmod 750 file.sh` set, and why might
          a payments-adjacent system care about this specific permission
          pattern?
        answer_md: |
          `chmod 750` sets read+write+execute (7) for the owner, read+execute
          (5) for the group, and no permissions (0) for others. In octal,
          each digit is a sum of read=4, write=2, execute=1.

          The "why care" half connects to the domain: a script that touches
          sensitive data (transaction logs, credentials, reconciliation
          files) should follow least-privilege — the owning service account
          gets full control, a defined group (e.g. an ops team) gets
          read/execute for debugging, and everyone else gets nothing. This
          is the kind of "boring infra hygiene" question PhonePe's OA
          includes precisely because a payments company's production
          incidents are disproportionately caused by overly permissive
          access, not algorithmic bugs.
        source_name: GeeksforGeeks — PhonePe Interview Questions
        source_url: https://www.geeksforgeeks.org/gfg-academy/phonepe-interview-questions/

      - kind: interview
        round: hr
        topic: Behavioural
        difficulty: easy
        question: >-
          Tell me about your most significant project. What was your specific
          contribution versus the team's?
        answer_md: |
          The follow-up ("your specific contribution versus the team's") is
          the part that catches unprepared candidates — a project narrated
          entirely in "we" language gives the interviewer nothing to
          calibrate your individual level against, which is exactly what
          this round exists to do.

          Restructure the story around decisions *you* made: a specific
          technical trade-off you owned, a bug only you tracked down, a piece
          you designed. It's fine for the project itself to be a team effort
          — the answer just needs to isolate your slice of it clearly enough
          that the interviewer could describe your contribution back to you
          in one sentence.
        source_name: GeeksforGeeks — PhonePe Interview Experience for SDE
        source_url: https://www.geeksforgeeks.org/interview-experiences/phonepe-interview-experience-for-sde-2-5-years-experienced/

      - kind: interview
        round: coding
        topic: Arrays
        difficulty: medium
        question: >-
          Given an array of transaction amounts and a target balance change,
          find if there exist three transactions that sum exactly to the
          target.
        answer_md: |
          This is 3-sum: sort the array first (O(n log n)), then for each
          index `i`, run a two-pointer scan over the remainder of the array
          looking for a pair that sums to `target - arr[i]`, moving the low
          pointer up if the running sum is too small and the high pointer
          down if too large. O(n²) total, which is the accepted complexity
          for this problem — the sort-plus-two-pointer structure is what
          gets you from the naive O(n³) triple-nested-loop to O(n²).

          The detail worth handling explicitly: duplicate values can produce
          duplicate triplets, so skip over repeated values at each of the
          three positions (outer index and both pointers) once a match is
          found, to avoid returning the same triplet multiple times if the
          question wants distinct triplets.
        source_name: GeeksforGeeks — PhonePe Interview Experience
        source_url: https://www.geeksforgeeks.org/interview-experiences/phonepe-interview-experience-on-campus-2023/

