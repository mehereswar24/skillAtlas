#     without it.
#   * Questions are written in our own words from what the source describes.
#     Nothing is copied out of a proprietary question bank; where the useful
#     artefact *is* the bank (LeetCode's company tag), we link to it instead.
#   * `fetched_on` records when the sources were last checked, and the UI shows
#     it, so stale data is visible rather than silently trusted.

company:
  slug: google
  name: Google
  industry: Big Tech
  hq: Mountain View, California
  website: https://www.google.com/about/careers/
  icon: Search
  fetched_on: 2026-07-31
  sort_order: 1
  description: >-
    Search, Android, Cloud and YouTube. Hires generalist engineers against a
    company-wide bar rather than to a specific team — you are matched to a team
    after you pass.
  hiring_process_md: |
    Google's process is unusual in one structural way: **you interview for
    Google, not for a team.** A hiring committee that never met you reads the
    written feedback from your interviews and decides; team matching happens
    afterwards. Two consequences follow, and both should change how you
    prepare.

    First, the interviewer's *written notes* are the artefact that gets judged,
    not their impression of you. Everything you reason out loud that they do
    not write down effectively did not happen. Narrate.

    Second, breadth beats depth in a niche. There is no "we needed a Kafka
    person" to fall back on.

    **The shape of it**

    1. **Recruiter call** — background, level, timing.
    2. **Phone/video technical screens (usually two, 45 min each)** — data
       structures and algorithms in a shared editor.
    3. **Onsite loop (4–5 rounds, 45 min each)** — two to three coding rounds,
       one system design round for anyone above entry level, and one
       "Googleyness and leadership" behavioural round.
    4. **Hiring committee** — reviews the packet. Then team matching, then an
       offer.

    **What they say they are grading.** Google publishes its rubric areas:
    coding, data structures and algorithms, computer science fundamentals, and
    Googleyness and leadership. In practice the coding rounds mark you on
    getting to a working solution, stating its complexity, and handling edge
    cases without being prompted.

