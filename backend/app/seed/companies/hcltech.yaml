company:
  slug: hcltech
  name: HCLTech
  industry: IT Services (India)
  hq: Noida, India
  website: https://www.hcltech.com/careers
  icon: Workflow
  fetched_on: 2026-08-21
  sort_order: 16
  description: >-
    India's fourth-largest IT services firm, and the one whose fresher
    hiring looks least like its peers — a lightweight interview-led process
    for degree holders, a 12th-pass earn-while-you-learn track called
    TechBee, and a newer, thinly documented AI-specialist band.
  hiring_process_md: |
    HCLTech runs three fresher tracks that share almost nothing except the
    company name.

    **The standard track (degree holders)** is notably interview-heavy
    compared to Infosys or TCS: several recent campus drives run just three
    stages — a written test, a technical interview, and an HR interview —
    with the group discussion and second written round that some sources
    describe appearing only on certain drives, not every one.

    **The shape of it, standard track:**

    1. **Online written test** (~90–95 minutes, ~75–77 questions, adaptive,
       no negative marking) — quant, verbal, logical reasoning, a Computer
       Fundamentals block (DS/OOP/DBMS/OS/networking, rated the hardest
       section), and a short coding block.
    2. **Optional group discussion** — a general/social topic, run on some
       drives and skipped on others.
    3. **Document verification** — 10th/12th/degree marksheets checked
       against the eligibility bar. This is a real gate: at least one
       candidate reported clearing every interview round and still being
       rejected here for an active backlog.
    4. **Technical interview** — resume and project walkthrough first, then
       DSA/DBMS/OOP/OS fundamentals and one or two live coding problems.
    5. **HR interview** — fit, relocation, and a self-rating on
       communication.

    **Eligibility** is typically 60% across Class 10, 12 and degree, though
    individual candidate accounts describe some drives applying a stricter
    70% bar — check the live posting rather than assuming either number.
    No active backlog at interview time; a maximum one-year gap after
    Class 12 only (no gaps between degree semesters); a six-month cooldown
    before reapplying if rejected.

    **Service agreement.** Employee reports describe bond terms ranging from
    a 15-month agreement with a ₹1.25 lakh exit penalty to a 12-month
    agreement with a ₹50,000 surety — but neither figure appears on
    HCLTech's own careers pages, so treat both as commonly reported rather
    than officially confirmed. A roughly 12-month probation period is
    similarly reported but not independently confirmed from a primary
    source.

    **TechBee** is a genuinely different program, not a lighter version of
    the standard track: a 12-month early-career scheme for 12th-pass
    candidates (any stream, 60%+, with Maths compulsory for IT roles),
    combining classroom training with on-the-job work and a path to a
    higher-education tie-up (IIT Guwahati, BITS Pilani and others) while
    earning. Selection runs through an aptitude test (the "HCL CAT" — JEE
    Mains 80th-percentile scorers can skip it), a Versant spoken-English
    test, and a face-to-face interview.

    **Elite AI** is a newer, higher band (₹18–22 LPA) for candidates with a
    demonstrated AI/GenAI/data-engineering/cybersecurity project portfolio.
    It's the least publicly documented of the three tracks — expect the same
    core technical interview as the standard track, with an added layer on
    your deployed projects and the LLM APIs or architectures you've actually
    used.

