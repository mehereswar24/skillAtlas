company:
  slug: infosys
  name: Infosys
  industry: IT Services (India)
  hq: Bengaluru, India
  website: https://www.infosys.com/careers/
  icon: Building
  fetched_on: 2026-07-31
  sort_order: 11
  description: >-
    India's second-largest IT services firm. Three rounds for freshers, usually
    inside two weeks, with an adaptive online test doing most of the filtering.
  hiring_process_md: |
    Infosys runs a short process — three rounds, typically over one to two
    weeks — and the online test is where most candidates are eliminated.

    **The shape of it**

    1. **Online test (~95 minutes)** — quantitative aptitude, logical
       reasoning and verbal ability, with **adaptive** difficulty: answer well
       and the questions get harder. For the 2026 cycle the paper also includes
       mathematical puzzles and English grammar sections.
    2. **Technical interview** — core subjects (C/C++ fundamentals, data
       structures, DBMS, OS) and your final-year project.
    3. **HR interview** — behaviour, communication, and willingness to
       relocate.

    **Two structural facts to plan around.** There is **no negative marking**,
    but there are **sectional cutoffs** and **sectional timing** with no
    switching between sections — so never leave a question blank, and never
    bank time from an easy section hoping to spend it on a hard one. And
    because the test is adaptive, an early run of correct answers raises the
    difficulty; do not read harder questions as a sign you are doing badly.

    **Eligibility** for the 2026 batch is generally 60% or 6.0 CGPA throughout
    Class 10, Class 12 and graduation, with no active backlogs at selection.
    Confirm against the official posting, since criteria move between cycles.

