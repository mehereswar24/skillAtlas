# Airbnb.
#
# Sourcing rules for every file in this directory:
#   * `source_url` is required on every question — the loader rejects one
#     without it.
#   * Questions are written in our own words from what the source describes.
#     Nothing is copied out of a proprietary question bank; where the useful
#     artefact *is* the bank (LeetCode's company tag), we link to it instead.
#   * `fetched_on` records when the sources were last checked, and the UI shows
#     it, so stale data is visible rather than silently trusted.

company:
  slug: airbnb
  name: Airbnb
  industry: Travel & Marketplace
  hq: San Francisco, California
  website: https://careers.airbnb.com/
  icon: Home
  fetched_on: 2026-08-21
  sort_order: 6
  description: >-
    The two-sided marketplace for stays and experiences. Airbnb's loop looks
    like a standard FAANG process on paper, but it runs a separately-scored
    Core Values interview alongside it — and a strong technical performance
    does not save you from a weak one.

  hiring_process_md: |
    Airbnb's loop is structurally close to a generic big-tech process — phone
    screen, technical screen, onsite panel — but it adds one thing most
    companies treat as a soft gate and Airbnb treats as a hard one: **Core
    Values are scored as their own independent signal**, usually by a
    dedicated interviewer who is not on your immediate team and sometimes
    not even in your discipline. Passing every technical round and failing
    that one interview is a real, commonly-reported way to lose an offer
    here, not a hypothetical.

    The four values you will be measured against: **Champion the Mission**
    (belonging, at a company level rather than a slogan), **Be a Host**
    (do you make the people around you — teammates, not just users — feel
    looked after), **Embrace the Adventure** (comfort with ambiguity and
    change), and **Be a Cereal Entrepreneur** (a deliberately corny pun on
    the founders funding the company with cereal boxes — it means
    scrappiness, doing the unscalable thing first). Prepare two distinct
    STAR stories per value; interviewers compare notes, and reusing one
    story to answer three different values reads as thin.

    **The shape of it, role-dependent but roughly:**

    1. **Recruiter screen (30 min)** — background, level, why Airbnb, and an
       early gut check on mission alignment.
    2. **Technical screen (45–60 min)** — live coding on CoderPad, or an
       automated CodeSignal/HackerRank assessment depending on the pipeline.
       Working code is required; talking through pseudocode is not enough.
    3. **Onsite / virtual onsite (4–5 rounds, same day or split across two)**
       — for engineers this typically includes two coding rounds, one system
       design round, a distinctive **code-review round** (you critique
       someone else's pull request rather than write from scratch), and one
       or two Core Values interviews. For data and design roles the coding
       rounds are swapped for domain rounds — SQL/product-sense/experiment
       design for DS, portfolio review/design exercise/cross-functional for
       PD — but the Core Values round stays in every loop.
    4. **Hiring manager / team-match conversation**, then a decision.

    What differentiates this from a generic loop: the system design and
    take-home prompts are almost always grounded in Airbnb's actual product
    surface (booking race conditions, host/guest messaging, search ranking,
    a waitlist for a fully-booked listing) rather than abstract
    infrastructure, and the code-review round tests whether you can spot a
    real bug and explain it kindly — a proxy for what it's like to work with
    you, which is exactly what the Core Values round is also measuring from
    a different angle.

