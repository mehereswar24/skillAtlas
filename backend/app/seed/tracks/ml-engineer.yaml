track:
  slug: ml-engineer
  title: Master Machine Learning
  domain: ml
  target_role: Machine Learning Engineer
  difficulty: intermediate
  description: >-
    The mathematics, algorithms and evaluation discipline behind predictive
    models — plus the feature and time-series work that decides whether a model
    survives contact with real data.

concepts:
  - slug: math-linear-algebra
  - slug: math-calculus-optimization
  - slug: statistics-probability
  - slug: numpy-pandas
  - slug: classical-ml
  - slug: model-evaluation
  - slug: deep-learning-foundations

  - slug: feature-engineering
    name: Feature Engineering
    domain: ml
    est_hours: 30
    difficulty: intermediate
    prerequisites:
      - classical-ml
    summary: >-
      Turning raw records into signal: encoding, scaling, interactions and the
      leakage traps that make a model look brilliant and behave uselessly.
    content_md: |
      On tabular problems, features usually matter more than the model. A
      gradient-boosted tree on good features beats a deep network on bad ones,
      reliably and cheaply.

      **Encoding categoricals.** One-hot for low cardinality. Ordinal only when
      the order is real (small/medium/large, not city names — a model given
      arbitrary integers will infer an ordering that does not exist). Target
      encoding is powerful and leaks badly unless computed inside
      cross-validation folds.

      **Scaling** matters for distance- and gradient-based models (kNN, SVM,
      linear, neural nets) and not at all for trees. Standardise or normalise
      inside the pipeline, fitted on the training fold only.

      **Interactions and transforms.** Ratios often carry more signal than their
      components — price per square metre beats price and area separately. Log
      transforms tame skew. Dates should be decomposed into the parts that
      matter: hour, day of week, is-holiday, days-since-event.

      **Leakage is the career-defining mistake.** Any feature computed using
      information unavailable at prediction time — a value derived from the
      target, an aggregate over the full dataset including the test set, a
      timestamp written after the outcome — inflates offline scores and collapses
      in production. If a model is suspiciously good, look for leakage before
      celebrating.
    resources:
      - kind: doc
        title: "scikit-learn — Preprocessing and pipelines"
        url: https://scikit-learn.org/stable/modules/preprocessing.html
        provider: scikit-learn
        duration_min: 180
      - kind: course
        title: "Kaggle Learn — Feature Engineering"
        url: https://www.kaggle.com/learn/feature-engineering
        provider: Kaggle
        duration_min: 300
      - kind: article
        title: "Google — Rules of Machine Learning (feature rules)"
        url: https://developers.google.com/machine-learning/guides/rules-of-ml
        provider: Google
        duration_min: 90
    quiz:
      - prompt: Why is label-encoding city names as integers a mistake for a linear model?
        explanation: Integers imply an ordering and a distance the categories do not have, so the model learns a relationship that is not real.
        options:
          - text: "It implies an order and magnitude between categories that does not exist"
            correct: true
          - text: "It uses too much memory"
          - text: "Linear models cannot handle categories"
          - text: "It always causes leakage"
      - prompt: Which model family is essentially indifferent to feature scaling?
        explanation: Tree-based models split on thresholds per feature, so monotone rescaling does not change the splits.
        options:
          - text: "Decision trees and their ensembles"
            correct: true
          - text: "k-nearest neighbours"
          - text: "Support vector machines"
          - text: "Neural networks"
      - prompt: Your model's accuracy jumps from 0.71 to 0.99 after adding a feature. What should you check?
        explanation: A jump like that almost always means the feature encodes the target or uses future information.
        options:
          - text: "Whether the feature leaks the target or future information"
            correct: true
          - text: "Whether to deploy immediately"
          - text: "Whether to add more trees"
          - text: "Whether the learning rate is too low"
    interview:
      - question: How do you avoid target leakage when using target encoding?
        difficulty: hard
        answer_md: |
          Compute the encoding using only the training portion of each
          cross-validation fold, never the whole dataset — otherwise every row's
          encoding has seen its own label. Practical approaches: out-of-fold
          encoding, leave-one-out with smoothing, or adding noise. Wrap it in a
          pipeline transformer so it is fitted per fold automatically rather than
          relying on discipline. And validate against a time-based holdout, since
          leakage often shows up as an offline/online gap rather than an obvious
          bug.

  - slug: time-series-forecasting
    name: Time Series & Forecasting
    domain: ml
    est_hours: 30
    difficulty: advanced
    prerequisites:
      - model-evaluation
      - statistics-probability
    summary: >-
      Trend, seasonality and autocorrelation — and why almost every standard ML
      habit is wrong when time is involved.
    content_md: |
      Time series break the assumption that underpins ordinary machine learning:
      that observations are independent. Almost every default has to change.

      **Decomposition.** Most series are trend + seasonality + residual.
      Seasonality is often multiple (daily and weekly and annual). Plot it before
      modelling — a series that looks random usually is not.

      **Stationarity.** Many classical methods assume constant mean and variance.
      Differencing removes a trend; a log transform stabilises variance that
      grows with level. The ADF test gives you a check rather than a feeling.

      **Validation must respect time.** A random train/test split lets the model
      learn from the future, producing a fantastic score that will never be
      reproduced. Use a rolling or expanding-window backtest that only ever
      trains on the past, and be careful that features built from rolling
      windows do not straddle the split.

      **Baselines are strong.** "Tomorrow equals today" (naive) and "this week
      equals last week" (seasonal naive) beat a great many elaborate models.
      Always report against them; a model that cannot beat seasonal naive is not
      a model.

      **Methods.** ARIMA and exponential smoothing for single well-behaved
      series; gradient boosting on lag and calendar features for many related
      series; deep sequence models when you have a great deal of data and a real
      need. Forecast intervals matter more than point estimates — a number with
      no uncertainty invites false confidence.
    resources:
      - kind: book
        title: "Forecasting: Principles and Practice (free online)"
        url: https://otexts.com/fpp3/
        provider: Hyndman & Athanasopoulos
        duration_min: 1200
      - kind: doc
        title: "scikit-learn — TimeSeriesSplit"
        url: https://scikit-learn.org/stable/modules/cross_validation.html#time-series-split
        provider: scikit-learn
        duration_min: 30
      - kind: doc
        title: "Prophet — forecasting at scale"
        url: https://facebook.github.io/prophet/docs/quick_start.html
        provider: Meta
        duration_min: 120
    quiz:
      - prompt: Why is a random train/test split wrong for forecasting?
        explanation: It puts future observations in the training set, so the model is scored on information it could not have had.
        options:
          - text: "It trains on the future, producing a score that cannot be reproduced live"
            correct: true
          - text: "It uses too little data"
          - text: "Time series cannot be split at all"
          - text: "It biases towards the mean"
      - prompt: What does differencing a series achieve?
        explanation: Subtracting the previous value removes a trend and moves the series toward stationarity.
        options:
          - text: "It removes trend, making the series closer to stationary"
            correct: true
          - text: "It removes seasonality entirely"
          - text: "It normalises the variance"
          - text: "It fills missing values"
      - prompt: What baseline should every forecast be compared against?
        explanation: Naive and seasonal-naive forecasts are surprisingly hard to beat and are the honest bar for a new model.
        options:
          - text: "Naive and seasonal-naive forecasts"
            correct: true
          - text: "A random number generator"
          - text: "Last year's average only"
          - text: "The most complex model available"
    interview:
      - question: You must forecast demand for 10,000 products. How do you approach it?
        difficulty: hard
        answer_md: |
          Fitting 10,000 separate ARIMA models is neither maintainable nor
          usually best. Prefer one global model over lag, calendar and product
          features — gradient boosting is a strong default — so sparse products
          borrow strength from similar ones. Handle intermittent demand and new
          products explicitly (they have no history; use hierarchy or attributes
          instead). Backtest with a rolling origin, report intervals not point
          estimates, and evaluate with a scale-free metric since a
          10,000-unit product and a 3-unit product cannot share an MAE. Compare
          everything against seasonal naive.
