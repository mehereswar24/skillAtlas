track:
  slug: music-production
  title: Learn Music Production
  domain: music
  target_role: Music Producer
  difficulty: beginner
  description: >-
    Theory you can actually use, arranging and recording in a DAW, and the
    mixing and mastering that turns a demo into a finished record.

concepts:
  - slug: music-theory-basics
    name: Practical Music Theory
    domain: music
    est_hours: 25
    difficulty: beginner
    prerequisites: []
    summary: >-
      Rhythm, scales, chords and progressions — the working vocabulary, without
      the exam.
    content_md: |
      You need enough theory to make decisions quickly and explain them. That is
      much less than a conservatoire syllabus.

      **Rhythm first.** Tempo, time signature, and where the beat subdivides.
      Most popular music is in four, and most of its interest comes from
      syncopation — placing accents off the beat. Groove lives in timing and
      velocity, not in the notes.

      **Notes and intervals.** The chromatic scale, half and whole steps, and
      intervals as the distance between notes. The major scale is the reference
      everything else is described against; the minor scale is its relative,
      built from the same notes starting elsewhere.

      **Chords** stack thirds: major (bright), minor (dark), diminished
      (unstable), seventh chords (colour and tension). Inversions change the
      bass note and therefore the feel without changing the harmony.

      **Progressions.** Roman numerals describe function independently of key —
      I-V-vi-IV underpins an enormous amount of popular music. Understanding
      tension and resolution (V wants to go to I) is more useful than memorising
      progressions.

      **Keys and transposition.** Knowing the key tells you which notes are
      available and lets you transpose to suit a vocal range — a practical skill
      you will use constantly.
    resources:
      - kind: course
        title: "Musictheory.net — lessons and exercises"
        url: https://www.musictheory.net/lessons
        provider: musictheory.net
        duration_min: 300
      - kind: video
        title: "Ableton — Learning Music (interactive)"
        url: https://learningmusic.ableton.com/
        provider: Ableton
        duration_min: 240
      - kind: video
        title: "Adam Neely — music theory in practice"
        url: https://www.youtube.com/@AdamNeely
        provider: YouTube
        duration_min: 300
    quiz:
      - prompt: What does the Roman numeral notation I-V-vi-IV describe?
        explanation: Chord function relative to the key, so the same progression can be played in any key.
        options:
          - text: "A chord progression described by function, independent of key"
            correct: true
          - text: "A rhythm pattern"
          - text: "A specific set of four notes"
          - text: "A tempo marking"
      - prompt: Where does groove primarily come from?
        explanation: Micro-timing and velocity — how notes sit against the grid and how hard they are played.
        options:
          - text: "Timing and velocity rather than note choice"
            correct: true
          - text: "The choice of scale"
          - text: "The tempo alone"
          - text: "The key signature"
      - prompt: What does inverting a chord change?
        explanation: The bass note and voicing, and therefore the character — while the harmony stays the same.
        options:
          - text: "The bass note and feel, not the underlying harmony"
            correct: true
          - text: "The key"
          - text: "The tempo"
          - text: "Whether it is major or minor"
    interview:
      - question: A track feels harmonically boring. What do you try?
        difficulty: medium
        answer_md: |
          Change one thing at a time. Try inversions so the bass line moves
          stepwise rather than jumping with the root. Add sevenths or ninths for
          colour. Borrow a chord from the parallel minor for a moment of
          surprise. Change the rhythm of the chords rather than the chords
          themselves — anticipating or delaying a change is often all that is
          missing. And check whether the problem is actually harmonic: boredom is
          frequently an arrangement issue, where nothing enters or leaves for
          thirty seconds.

  - slug: daw-and-arrangement
    name: DAW Workflow & Arrangement
    domain: music
    est_hours: 30
    difficulty: beginner
    prerequisites:
      - music-theory-basics
    summary: >-
      Recording, MIDI, sound selection and structuring a track so it goes
      somewhere.
    content_md: |
      The digital audio workstation is the studio. Learning one deeply beats
      sampling five.

      **MIDI versus audio.** MIDI is instructions — notes, velocity, timing —
      endlessly editable and re-voiceable. Audio is a recording, fixed in pitch
      and timbre but real. Most productions combine both.

      **Sound selection does more than processing.** A well-chosen sample or
      preset needs little work; the wrong one cannot be mixed into rightness.
      Spend time choosing before reaching for plugins.

      **Recording basics.** Set gain so peaks land comfortably below clipping —
      digital clipping is irreversible. Manage latency with a low buffer while
      recording and a high one while mixing. Watch the room: a cheap microphone
      in a treated space beats an expensive one in a bathroom.

      **Arrangement is where tracks succeed or fail.** Sections need contrast —
      something must enter or leave every eight or sixteen bars, or attention
      drifts. Build tension by removing elements before a drop rather than only
      adding them. Reference a professionally produced track in the same genre
      for structure and length.

      **Finish things.** A folder of unfinished eight-bar loops teaches far less
      than one completed three-minute song, however imperfect.
    resources:
      - kind: doc
        title: "Ableton Live — learning resources"
        url: https://www.ableton.com/en/live/learn-live/
        provider: Ableton
        duration_min: 360
      - kind: doc
        title: "Reaper — free-to-try DAW and user guide"
        url: https://www.reaper.fm/userguide.php
        provider: Cockos
        duration_min: 300
      - kind: video
        title: "Arrangement and song structure fundamentals"
        url: https://www.youtube.com/@youmustcreate
        provider: YouTube
        duration_min: 180
    quiz:
      - prompt: Why is digital clipping worse than analogue overdrive?
        explanation: It hard-clips the waveform and destroys information irreversibly, producing harsh distortion.
        options:
          - text: "It irreversibly destroys the waveform and sounds harsh"
            correct: true
          - text: "It raises the noise floor"
          - text: "It shifts the pitch"
          - text: "It only affects MIDI"
      - prompt: What is the main advantage of MIDI over recorded audio?
        explanation: Notes, timing, velocity and the instrument itself can all be changed after the fact.
        options:
          - text: "Everything about the performance and sound can be changed later"
            correct: true
          - text: "It sounds more realistic"
          - text: "It uses more CPU"
          - text: "It cannot be quantised"
      - prompt: What keeps a listener engaged through an arrangement?
        explanation: Contrast — elements entering and leaving so each section differs from the last.
        options:
          - text: "Elements entering and leaving so sections contrast"
            correct: true
          - text: "A constant number of layers"
          - text: "A faster tempo"
          - text: "More reverb"
    interview:
      - question: You have fifty unfinished loops and no finished songs. What changes?
        difficulty: easy
        answer_md: |
          Impose constraints and a definition of done. Pick one loop, commit to
          finishing it in a fixed number of sessions, and forbid starting
          anything new until it is exported. Limit the palette — a fixed set of
          instruments removes the endless-options paralysis that causes
          loop-hopping. Arrange to a reference track's structure so the shape is
          decided rather than agonised over. Accept that the first finished
          tracks will be worse than the loops felt; finishing is the skill being
          practised, and it is the one that does not develop by starting again.

  - slug: mixing-and-mastering
    name: Mixing & Mastering
    domain: music
    est_hours: 30
    difficulty: intermediate
    prerequisites:
      - daw-and-arrangement
    summary: >-
      Balance, EQ, compression and space — and what mastering actually does.
    content_md: |
      Mixing is balance in three dimensions: level, frequency and space.

      **Start with faders.** A mix that is not working at the balance stage will
      not be rescued by plugins. Get a static balance first, in mono — if the
      elements separate in mono, they will separate anywhere.

      **EQ is mostly subtractive.** Cut what conflicts before boosting what you
      want. Two instruments occupying the same frequency band fight; carving a
      little space in one for the other is how you fit everything in. High-pass
      anything that does not need low end — accumulated rumble is what makes
      mixes muddy.

      **Compression controls dynamics.** Threshold, ratio, attack and release.
      Slow attack lets transients through and keeps punch; fast attack tames
      them. Compressing everything by default flattens the life out of a mix.

      **Space.** Panning creates width; reverb and delay create depth. Use a
      shared reverb send rather than an instance per track, so everything sits
      in the same room.

      **Mastering** is the final stage: overall tonal balance, glue, and loudness
      appropriate to the platform. It is not a repair service — it cannot fix a
      poor mix, and streaming normalisation means crushing a master for loudness
      now mostly costs you dynamics for nothing.

      **Reference constantly**, at low volume, against a commercial track.
    resources:
      - kind: doc
        title: "Sound on Sound — mixing technique archive"
        url: https://www.soundonsound.com/techniques
        provider: Sound on Sound
        duration_min: 480
      - kind: doc
        title: "iZotope — mixing and mastering guides"
        url: https://www.izotope.com/en/learn.html
        provider: iZotope
        duration_min: 300
      - kind: article
        title: "Loudness normalisation on streaming platforms"
        url: https://www.loudnesspenalty.com/
        provider: MeterPlugs
        duration_min: 30
    quiz:
      - prompt: Why check a mix in mono?
        explanation: If elements separate in mono they will separate in stereo, and it exposes phase problems that stereo width can hide.
        options:
          - text: "It exposes masking and phase problems that stereo width can hide"
            correct: true
          - text: "Most listeners use mono speakers"
          - text: "It doubles the loudness"
          - text: "Reverb only works in mono"
      - prompt: What makes mixes sound muddy more than anything else?
        explanation: Accumulated low-frequency energy across many tracks that do not need it.
        options:
          - text: "Low-frequency build-up from tracks that should be high-passed"
            correct: true
          - text: "Too much reverb"
          - text: "Excessive panning"
          - text: "High-frequency boost"
      - prompt: Can mastering fix a bad mix?
        explanation: No. It refines a finished mix; structural problems must be solved in the mix.
        options:
          - text: "No — it refines a good mix, it does not repair a bad one"
            correct: true
          - text: "Yes, that is its purpose"
          - text: "Only for electronic music"
          - text: "Only if the mix is loud enough"
    interview:
      - question: The mix sounds great on your monitors and terrible in the car. Why?
        difficulty: medium
        answer_md: |
          You have mixed to your room rather than to the music. Untreated rooms
          have strong bass nulls and peaks, so you compensate for a problem that
          exists only where you sit. Fix it by referencing commercial tracks in
          the same session, checking on multiple systems including phone speakers
          and headphones, mixing at low volume where the ear's frequency response
          is flattest, and checking mono. Longer term: treat the room, or use a
          familiar pair of headphones with a known response as your reference.
