  - slug: backend-learn-about-apis
    name: "The Interface Your Service Exposes"
    domain: backend
    est_hours: 6
    difficulty: beginner
    prerequisites:
      - backend-introduction
    summary: |-
      An API as a promise to people you will never meet: what a contract contains, why compatibility is the constraint that shapes everything, and how HTTP's own semantics do half the work for you.
    content_md: |-
      Once someone else's code depends on your endpoint, you have taken on an obligation you cannot unilaterally revoke. Every design decision in this concept follows from that.

      ### The contract

      An API contract is more than a list of URLs. It specifies, for each operation: the path and method; what may appear in the request (parameters, headers, body shape, required versus optional, value ranges); what comes back on success (status code and body shape); what comes back on each failure and how a client should distinguish retryable from fatal; what authentication and authorisation are required; and what the operation costs in rate-limit terms. If any of that lives only in one engineer's head, clients discover it by guessing in production.

      ### Let HTTP mean what it means

      HTTP already defines properties your clients rely on, and reusing them is free correctness. **Safe** methods (`GET`, `HEAD`, `OPTIONS`) do not change state, which is why a crawler, a browser prefetch or a link-preview bot may call them at any time — putting a delete behind a `GET` is how a well-meaning corporate link scanner erases someone's data. **Idempotent** methods (`GET`, `PUT`, `DELETE`, plus the safe ones) can be retried without changing the outcome beyond the first call, which is exactly what a client with a flaky connection will do. `POST` is neither, which is why creating things needs the idempotency machinery covered later.

      Status codes carry the same kind of meaning: `400` means the client should fix the request and not retry it, `401` means authenticate, `403` means authenticated but not permitted, `404` means no such resource, `409` means a state conflict, `429` means slow down and try later, `5xx` means our fault and probably retryable. Returning `200` with `{"error": ...}` inside throws all of that away and forces every client, proxy and monitoring system to parse your body to know whether anything worked.

      ### Compatibility is the real constraint

      A change is backward compatible if a client written against the old contract still works. Adding an optional request field, adding a response field, adding a new endpoint or a new enum value that old clients can ignore: compatible. Removing or renaming a field, tightening validation, changing a type, making an optional field required, changing a status code, changing the meaning of an existing value: breaking. The uncomfortable one is that even *adding* an enum value breaks clients that exhaustively switch on it — which is why documented forward-compatibility rules ("ignore values you do not recognise") are part of a good contract.

      ### Write the contract down, mechanically

      A machine-readable description — OpenAPI for HTTP, a protobuf or GraphQL schema for those styles — is what makes the contract enforceable rather than aspirational. It generates documentation, client libraries and server stubs; it lets you validate responses in tests; and it turns "did this pull request break the API?" into a diff a pipeline can fail on. The API Design track in this catalogue takes this much further.

      ### The mistakes people actually make

      Designing the API around the database schema, so every internal refactor becomes an externally breaking change. Designing it around the first screen of the first client, so the second client needs six round trips. Inventing a private error format per endpoint. And shipping without any written contract, then treating the current implementation's behaviour as the specification — including its bugs, which someone is now depending on.
