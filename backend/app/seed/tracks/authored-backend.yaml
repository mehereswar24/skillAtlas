  - slug: backend-containerization
    name: "Containers: Images, Layers and Reproducible Builds"
    domain: backend
    est_hours: 7
    difficulty: intermediate
    prerequisites:
      - backend-ci-cd
    summary: |-
      What a container actually is at the kernel level, how to build an image that is small, cacheable and safe, and the runtime behaviours a containerised process must get right.
    content_md: |-
      A container is not a lightweight virtual machine. It is an ordinary Linux process with a restricted view of the system, and understanding that removes most of the mystery.

      ### The mechanism

      Two kernel features do the work. **Namespaces** give the process its own view of a resource class — its own process tree (so your app is PID 1), its own mount table and root filesystem, its own network stack and interfaces, its own hostname and user mapping. **Cgroups** limit and account for what it may consume: CPU shares, memory, I/O. The kernel is shared, which is why containers start in milliseconds and why the isolation boundary is weaker than a VM's.

      An **image** is a stack of read-only filesystem layers plus metadata. At run time a thin writable layer sits on top; anything written there dies with the container. That immutability is the point — the same image runs identically everywhere — and it is why configuration and state must come from outside, via environment variables and mounted volumes.

      ### Building a good image

      **Layer order is cache strategy.** Each instruction produces a layer, and a layer is rebuilt when it or anything above it changes. Copy the dependency manifest and install dependencies *before* copying your source, and a source-only change reuses the dependency layer. Copy everything first and every build reinstalls from scratch.

      **Multi-stage builds** are the single biggest win. Compile in a stage with the full toolchain, then copy only the resulting artefact into a minimal runtime stage. A Go service goes from hundreds of megabytes to a handful; a Node service ships without dev dependencies. Smaller images pull faster, which directly shortens deploys and autoscaling response, and they carry fewer packages for a scanner to find vulnerabilities in.

      **Pin what you depend on.** `FROM node:latest` means your build is not reproducible and can break overnight. Pin to a specific version, or a digest for real reproducibility, and update deliberately.

      **Do not put secrets in the image.** A build argument or a copied file remains visible in the layer history even if a later step deletes it. Use build-time secret mounts, or inject at run time.

      Also: add a `.dockerignore` (or you will copy `.git`, `node_modules` and local environment files into your build context), and run as a **non-root user**, because a container escape from root is a much shorter path to the host.

      ### Behaving well at run time

      Log to stdout and stderr as unstructured-free-as-possible text — ideally JSON — and let the platform collect it; writing log files inside a container means writing them into a layer that disappears. Handle `SIGTERM`: the orchestrator sends it, waits a grace period, then sends `SIGKILL`, so a process that ignores it drops in-flight requests on every deploy. Watch out for PID 1 semantics — a shell-form entrypoint puts a shell at PID 1 which does not forward signals, so use the exec form or a small init. And set memory limits knowing that exceeding them gets you `OOMKill`ed by the kernel with no graceful exit and, often, no useful log line.

      ### The mistakes people actually make

      Shipping the build toolchain to production. Running `apt-get update` in a separate layer from `install`, so the cached update is stale. Storing user uploads on the container filesystem. Baking configuration into the image, which destroys promote-the-tested-artefact. And treating an image scanner's output as noise until an auditor asks.
