        url: "https://learngitbranching.js.org/"

  - slug: backend-repo-hosting-services
    name: "Collaborating on a Codebase: Review, Branching and Ownership"
    domain: backend
    est_hours: 4
    difficulty: beginner
    prerequisites:
      - backend-version-control-systems
    summary: |-
      Pull requests, branch protection and code ownership as the mechanism that keeps a shared codebase from degrading — and what a review that actually finds bugs looks like.
    content_md: |-
      A hosting service (GitHub, GitLab, Bitbucket, a self-hosted Forgejo) adds three things to Git that Git itself does not have: a canonical remote everyone agrees on, a review workflow, and automation hooks. Learning the workflow matters more than learning any one vendor's buttons.

      ### The pull request as a unit of change

      A pull request proposes moving one branch's commits into another. Its real value is not the merge — Git could do that — but that it creates a reviewable, discussable, permanently-linked artefact tying a change to a reason. Branch protection rules turn that from convention into enforcement: require a passing pipeline, require one or two approvals, require the branch to be up to date with the target, forbid force-pushes to the default branch. Without protection, "we review everything" is a claim nobody can verify.

      ### Trunk-based development versus long-lived branches

      In **trunk-based** development everyone merges small changes into one main branch many times a day, and unfinished work hides behind feature flags rather than behind a branch. In **Gitflow**-style models, long-lived develop/release/hotfix branches accumulate changes for weeks. The trade is real: long-lived branches defer integration pain until it is maximal, because the longer two branches diverge, the more merge conflicts *and* semantic conflicts they accumulate — the ones where both sides merge cleanly and the result is still broken. Teams shipping continuously converge on trunk-based with short-lived branches for exactly this reason; teams shipping versioned, installed software have a legitimate reason to keep release branches.

      ### Review that finds something

      Effective review has a size limit. Review quality falls off sharply past a few hundred changed lines — past that, reviewers skim and approve. Split large changes into a mechanical refactor commit and a behavioural change commit, and reviewers can actually see the behaviour change. Ask, in order: is this correct at the boundaries (empty input, concurrent callers, failure of the thing it calls)? Does it change the data model or an API contract, and is that change backward compatible? Is there a test that would fail if this were reverted? Style belongs to a formatter and a linter, never to a human reviewer.

      **CODEOWNERS** files route reviews automatically to the people who will maintain the code, which is how a growing codebase avoids the state where every change waits on one overloaded person.

      ### The mistakes people actually make

      Opening a 3,000-line pull request and being surprised it sat for a week. Treating approval as a formality between friends. Letting the default branch go red and living with it, which trains everyone to ignore the signal CI exists to give. And configuring protection on the default branch while leaving the release branch unprotected, so the only branch that reaches customers is the one nobody guards.
    resources:
      - kind: doc
        title: "GitHub Docs: About protected branches"
        url: "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches"
      - kind: doc
