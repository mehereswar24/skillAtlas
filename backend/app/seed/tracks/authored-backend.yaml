  - slug: backend-learn-about-web-servers
    name: "Reverse Proxies, TLS Termination and the Edge"
    domain: backend
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - backend-server-side
    summary: |-
      What nginx, Caddy, Envoy or a cloud load balancer does in front of your application, and the handful of its settings that decide whether your service stays up.
    content_md: |-
      Your application almost never faces the internet directly. Something sits in front: nginx, Caddy, HAProxy, Envoy, or a managed load balancer. Learning what that layer is responsible for prevents an entire genre of "the logs show nothing" incidents.

      ### What the proxy is for

      **TLS termination.** Certificates, cipher suites and protocol negotiation (ALPN) live at the edge, so your application speaks plain HTTP on a private network. This centralises certificate renewal — with ACME, as Let's Encrypt popularised and Caddy automates by default — instead of scattering it across every service.

      **Load balancing and health checks.** The proxy holds a pool of backends, checks their health on an interval, and stops sending traffic to unhealthy ones. This is why your application needs a health endpoint that is cheap and honest: one that checks nothing is useless, and one that checks every downstream dependency turns a partial outage into a total one by making every instance report unhealthy at once.

      **Protocol translation.** The edge can speak HTTP/2 or HTTP/3 to clients — multiplexing many streams over one connection and removing head-of-line blocking at the HTTP layer — while speaking simple HTTP/1.1 to your app. Clients get the modern protocol without your framework implementing it.

      **Buffering and slow clients.** A proxy can read a slow client's entire request before handing it to your application, so a mobile user on a bad connection occupies a cheap proxy connection rather than an expensive application worker. This is a real defence against Slowloris-style exhaustion.

      **Cross-cutting concerns.** Compression, request size limits, static file serving, coarse rate limiting and access logs are all cheaper here than in your handler.

      ### The settings that bite

      Timeouts, in three flavours: how long to wait to connect to a backend, how long to wait for the first response byte, and how long to wait between subsequent bytes. Defaults are usually thirty or sixty seconds, and they are the reason a long-running request "just disappears" with a 504 while your application, unaware, keeps working on a response nobody will read. Set them deliberately, and set your application's own timeouts *shorter*, so the application is the component that logs the failure.

      Header handling is the other trap. Behind a proxy the client's IP is in `X-Forwarded-For` or `Forwarded`, not in the socket's peer address; frameworks need explicit configuration to trust it, and trusting it blindly lets a client spoof its own IP and defeat your rate limiter. The same applies to `X-Forwarded-Proto`: get it wrong and your application generates `http://` redirect URLs on an HTTPS site, producing an infinite redirect loop.

      ### The mistakes people actually make

      Serving TLS at the edge and then leaving the internal hop unauthenticated on a network that is not actually private. Raising the maximum body size to accept uploads and discovering the upload now exhausts memory. And making the health check hit the database, so a database blip evicts every instance from the pool simultaneously.
