  - slug: backend-message-brokers
    name: "Message Brokers: Queues, Logs and Delivery Guarantees"
    domain: backend
    est_hours: 9
    difficulty: advanced
    prerequisites:
      - backend-server-side
      - backend-relational-databases
    summary: |-
      The difference between a queue and a log, what "at-least-once" forces you to build, and the outbox pattern that stops your database and your broker from disagreeing.
    content_md: |-
      A broker decouples the producer of work from its consumer in time, in rate and in identity. That is genuinely powerful and it introduces an entire new class of bugs, all of which come from the same source: the message and your database are two systems that can disagree.

      ### Queue or log?

      **Queue brokers** (RabbitMQ, ActiveMQ, SQS, and Redis-based workers) hold messages until a consumer acknowledges them, then delete them. Routing can be rich — exchanges, topics, bindings, priorities, per-message TTL, delayed delivery. Competing consumers naturally share the load. What you cannot do is replay what has already been consumed.

      **Log brokers** (Kafka, Redpanda, Pulsar) append messages to a partitioned, ordered, durable log and keep them for a retention period regardless of consumption. Each consumer group tracks its own offset, so a new consumer can start from the beginning, and a broken consumer can be fixed and replayed. Ordering is guaranteed *within a partition*, which is why the partition key is your most important design decision: key by entity id and all events for one entity stay ordered, at the cost of a hot partition if one entity dominates.

      Choose a log when you need replay, multiple independent consumers of the same stream, or very high throughput. Choose a queue when you need per-message routing, delays, priorities, and simple work distribution.

      ### Delivery guarantees, stated honestly

      **At-most-once** loses messages on failure. **At-least-once** is what essentially every broker gives you in practice, and it means duplicates are not an edge case but a normal event: a consumer that processes a message and then crashes before acknowledging will see it again. **Exactly-once** end to end does not exist across system boundaries in the general case; what Kafka's transactional producer offers is exactly-once *within* Kafka, and the moment your consumer writes to an external database that guarantee stops applying.

      The practical consequence is unavoidable: **consumers must be idempotent**. Either the operation is naturally idempotent (setting a value, upserting by a natural key) or you make it so by recording processed message ids in a table and skipping repeats, in the same transaction as the effect.

      ### The dual-write problem and the outbox

      The commonest bug in event-driven systems: your handler commits a database transaction and then publishes an event. If the publish fails, the world believes something that did not happen — or, in the other order, you publish and then the transaction rolls back, and consumers act on an event that was undone. There is no ordering of two independent writes that fixes this.

      The **transactional outbox** does fix it. Write the event into an `outbox` table in the *same transaction* as the state change, so either both happen or neither. A separate relay process reads unpublished outbox rows and sends them to the broker, marking them sent. Since the relay can crash after sending and before marking, delivery becomes at-least-once — which is fine, because your consumers are already idempotent. Change-data-capture tools that tail the database log achieve the same effect from the other side.

      ### Poison messages and dead letters

      A message your consumer cannot process will be redelivered forever, blocking the partition or consuming the queue's capacity. Every consumer needs a retry limit and a **dead-letter queue** to park failures, plus an alert on its depth — a silently filling dead-letter queue is data loss on a delay.

      ### The mistakes people actually make

      Putting the whole payload in the message and then finding it stale by the time it is processed; often better to send an id plus an event type and re-read. Assuming ordering across partitions or across topics. Using a queue as a database. Retrying non-idempotent work without a deduplication key. And having no consumer-lag monitoring, so the first sign of a stalled consumer is a customer complaint.
