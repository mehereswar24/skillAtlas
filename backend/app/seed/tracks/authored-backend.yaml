  - slug: backend-real-time-data
    name: "Real-Time: WebSockets, Server-Sent Events and Fan-Out"
    domain: backend
    est_hours: 7
    difficulty: advanced
    prerequisites:
      - backend-server-side
      - backend-message-brokers
    summary: |-
      Pushing data to clients: choosing between polling, SSE and WebSockets, then surviving reconnects, sticky sessions and fan-out to a hundred thousand listeners.
    content_md: |-
      "Real-time" spans three genuinely different requirements — a notification badge, a live dashboard, and a collaborative editor — and the right transport differs for each.

      ### The four options

      **Polling** on an interval is unfashionable and frequently correct. It is stateless, cacheable, trivially load-balanced, and works through every proxy on earth. Its cost is wasted requests and latency equal to half the interval. For anything where a few seconds is fine, start here and stop.

      **Long polling** holds the request open until data exists or a timeout fires, then the client immediately re-requests. Near-instant delivery over ordinary HTTP. It occupies a server connection per waiting client, which is fine on an event-loop or lightweight-thread runtime and expensive on thread-per-request.

      **Server-Sent Events** is a one-way stream over a normal HTTP response: the server writes `data:` lines and the browser's `EventSource` delivers them, reconnecting automatically and resuming from the `Last-Event-ID` it saw. It is dramatically simpler than WebSockets, works with existing HTTP infrastructure and authentication, and is the right answer for notifications, progress, live feeds and streaming model output. It is one-way, and over HTTP/1.1 it consumes one of the browser's six connections per host — a real constraint that HTTP/2 removes.

      **WebSockets** upgrade the connection to a persistent bidirectional frame-based channel. Necessary when the client sends a high rate of messages too — chat, multiplayer, collaborative editing, live cursors. The cost is that you leave HTTP behind: your own framing, your own reconnect logic, your own auth story, and proxies that need explicit configuration.

      ### The problems that appear at scale

      **Connection state.** A persistent connection pins a client to one instance. Deploys therefore disconnect everyone, so clients need reconnect with backoff and jitter — or a deploy becomes a self-inflicted thundering herd of reconnections. Load balancers need sticky sessions or a design that does not care which instance a client lands on.

      **Fan-out.** With many instances, a message produced on instance A must reach subscribers on instances B and C. The standard solution is a backplane: publish to Redis Pub/Sub, NATS or a broker, and every instance forwards to its own local subscribers. Do not attempt instance-to-instance meshing.

      **Delivery gaps.** A client that was disconnected for eight seconds missed whatever happened. Design for it explicitly: give every message a monotonic sequence number or id, let the client send the last id it saw on reconnect, and replay the gap from a short buffer. Otherwise "real-time" quietly means "real-time except when it matters."

      **Backpressure.** A slow client whose messages you keep queuing will grow your memory until something dies. Bound the per-connection buffer and drop, coalesce (send only the latest state) or disconnect when it overflows.

      **Auth and liveness.** Browsers cannot set headers on a `WebSocket` or `EventSource` handshake, so tokens usually arrive as a query parameter (which lands in access logs) or a cookie — pick deliberately. And a long-lived token on a connection that lasts for hours needs a revocation story. Finally, use heartbeats: TCP will happily keep a dead connection open for a long time, and an application-level ping is the only reliable way to notice.

      ### The mistakes people actually make

      Reaching for WebSockets when SSE or polling would do, and inheriting the whole operational cost. Broadcasting every event to every client and filtering in the browser, which leaks data and wastes bandwidth. Forgetting that a reconnect storm after a deploy is a load spike you must survive. And treating the stream as reliable, with no resume and no reconciliation against a plain HTTP fetch.
