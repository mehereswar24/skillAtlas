  - slug: backend-applications
    name: "Structuring an Application: Layers, Boundaries and the Domain"
    domain: backend
    est_hours: 7
    difficulty: intermediate
    prerequisites:
      - backend-pick-a-backend-language
      - backend-relational-databases
    summary: |-
      How to arrange code so that business rules are testable without a database, framework choices stay replaceable, and the codebase is still navigable at fifty thousand lines.
    content_md: |-
      Frameworks give you a way to answer a request. They do not give you a way to organise a system, and the default — everything in the route handler — degrades predictably: logic duplicated across endpoints, rules that only exist inside an HTTP request, and tests that need a live database to check an `if` statement.

      ### The layering that actually earns its keep

      Three responsibilities, kept separate.

      The **transport layer** (controllers, route handlers, resolvers) deals with the protocol and nothing else: parse and validate input, call one thing, map the result or the error to a status code. It should contain no business rules, no queries, and no branching on domain state.

      The **domain or service layer** holds the rules — what is allowed, what happens when, what invariants must hold. This is the part that is genuinely yours, and it should be callable from an HTTP handler, a background worker, a CLI command or a test with equal ease. If a rule can only run inside a request, a scheduled job will eventually violate it.

      The **persistence layer** knows about tables, queries and the store. Whether you hide it behind a repository interface is a judgement call. The case for it is testability and a single place where query patterns live; the case against is that a repository which merely wraps an ORM adds a layer without adding a boundary. A useful rule: introduce the interface when you have a second implementation or a genuine need to test without I/O, not preemptively.

      ### Keep I/O at the edges

      The most portable structural idea in this concept is to push I/O outward and keep the middle pure. A function that takes data and returns a decision is trivially testable, deterministic and fast. A function that fetches, decides and writes is none of those. Concretely: load what you need, pass plain values into the rule, get a result, then perform the writes. This is the underlying idea behind hexagonal architecture, ports and adapters, and "functional core, imperative shell" — different names, same move.

      ### Dependencies point inward

      The domain should not import the web framework, the ORM's session, or the payment provider's SDK. It defines what it needs — an interface, a protocol, a callable — and the outer layers supply implementations at start-up. This is all dependency injection is; a container is optional and often unnecessary. The payoff is not swapping databases, which almost never happens; it is that a change to the framework, the queue or the third party touches the adapter and not the rules.

      ### Organise by feature, not by layer

      At the directory level, grouping `controllers/`, `services/`, `models/` means every feature is smeared across the tree and every change touches four directories. Grouping by feature — `billing/`, `orders/`, `identity/`, each containing its own transport, domain and persistence — keeps related code together, makes ownership obvious, and marks the seams along which a module could later become a separate service.

      ### The mistakes people actually make

      An "anemic" domain: data classes with only getters, all logic in a service, so the object cannot protect its own invariants. The opposite: a model class that knows about HTTP and email. A shared `utils` module that becomes a dependency magnet everything imports. And layering so elaborate that adding a field means editing seven files — layers are a tool for managing change, and if they are not paying for themselves, remove some.
