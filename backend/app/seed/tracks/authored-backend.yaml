  - slug: backend-ai-in-development
    name: "AI in the Delivery Pipeline"
    domain: backend
    est_hours: 4
    difficulty: intermediate
    prerequisites:
      - backend-ai-assisted-coding
      - backend-ci-cd
    summary: |-
      Automated review, test generation, incident triage and documentation — which of these survive contact with a real pipeline, and what breaks when a non-deterministic step becomes a gate.
    content_md: |-
      Assistance at the keyboard is one thing; putting a model inside your automated delivery process is another, because a pipeline stage is expected to be deterministic, fast and trustworthy, and a model is none of those by default.

      ### What works well

      **Review assistance, as a commenter and never as a gate.** A bot that leaves suggestions on a pull request catches a real class of issue — an unhandled error path, a missing null check, a log line containing a token, an inconsistency with a nearby pattern. Its correct role is to add signal for human reviewers. Making it a blocking approver is a mistake: it will block correct code and approve subtly broken code, and it cannot be held accountable for either.

      **Triage and summarisation.** Grouping similar exceptions, drafting an incident timeline from logs and deploy markers, summarising a long thread, or proposing which team owns an alert. These are low-risk because a human immediately checks the output against reality.

      **Documentation drafts.** Generating a first pass of API descriptions, changelog entries and runbooks from code and commits. The generated text still needs an owner, because documentation nobody verified is worse than none — people trust it.

      **Test generation for the boring half.** Enumerating edge cases and filling in fixtures is genuinely useful. Generating the assertions themselves is where it goes wrong, because the assistant infers intent from the implementation and so encodes the bug as the expected behaviour.

      ### What breaks

      **Non-determinism in a pipeline.** The same commit producing different results on re-run destroys the property that makes CI useful. If a model-based step must exist, make it advisory, or pin the model version and temperature and accept that you are still not fully reproducible.

      **Latency and cost per run.** A stage that adds three minutes and a per-run charge to every push is a stage people will find a way to skip.

      **Confident wrongness at scale.** Automation multiplies whatever the model gets wrong. A bot that mass-files issues or mass-opens fix pull requests can bury a team in plausible-looking noise faster than it can be reviewed.

      **Supply chain and prompt injection.** A pipeline agent that reads a pull request's contents and has permission to push, comment or deploy is executing instructions authored by whoever opened that pull request. Treat any automation with write access exactly as you would treat running an untrusted contributor's code: least privilege, no secrets in reach, and no self-approval.

      ### Judging whether it is helping

      Use the delivery metrics you already track rather than vibes. Did lead time fall? Did change failure rate rise? Are reviewers spending less time, or the same time plus a new queue of bot comments to dismiss? Adopt one integration at a time so the answer is attributable, and be willing to remove it.

      ### The mistakes people actually make

      Giving a pipeline bot broad repository write permissions. Auto-merging its changes. Letting generated documentation ship unreviewed. Adding four AI stages at once so nobody can tell which helped. And treating a summary of an incident as the postmortem, when the value of a postmortem is the humans reasoning about causes.
