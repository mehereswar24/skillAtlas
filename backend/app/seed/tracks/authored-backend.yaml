  - slug: backend-ai-providers
    name: "Calling a Model From a Service"
    domain: backend
    est_hours: 7
    difficulty: intermediate
    prerequisites:
      - backend-integration-patterns
    summary: |-
      Treating a model API as what it is — a slow, expensive, rate-limited, non-deterministic upstream — and engineering the call accordingly.
    content_md: |-
      The interesting part of adding a model to a backend is not the prompt. It is that you have introduced a dependency with a worse latency profile, a worse error profile and a real per-request cost, and every pattern from the integration step now applies with unusual force.

      ### What is different about this upstream

      **Latency is seconds, not milliseconds**, and it is proportional to output length, which you do not know in advance. That breaks any synchronous request/response design with a normal timeout. The two viable shapes are **streaming** the response to the user as tokens arrive — over SSE, which is why that transport appears earlier in this track — or making it a **background job** and notifying on completion. Blocking a request thread for thirty seconds is the third option and it is the one that takes services down.

      **Cost is per token, in both directions.** Prompt tokens and output tokens are billed separately and usually at different rates. This makes prompt size an engineering constraint: stuffing an entire document into every request is a decision with a monthly invoice attached. Track cost per request as a first-class metric next to latency, and set per-user and per-tenant budgets before launch, not after the bill.

      **Context windows are finite.** Inputs must be truncated or summarised to fit, and a request that exceeds the window fails outright — so the truncation strategy is part of the design, not a detail.

      **Rate limits are aggressive** and usually expressed in both requests and tokens per minute. Respect `Retry-After`, back off exponentially with jitter, and consider a client-side queue that smooths bursts rather than discovering the limit at peak.

      **Output is non-deterministic.** The same input can produce different output, which means your tests cannot assert on exact strings, and any downstream code that parses the output must handle it being malformed. Where the provider supports structured output or JSON-schema-constrained generation, use it — it converts a parsing problem into a validation problem. Validate regardless, and have a defined behaviour for "the model returned something unusable."

      ### Engineering the call

      Wrap the provider behind your own interface so the SDK is one adapter, not a dependency threaded through your domain. That gives you one place to add timeouts, retries, budget checks, logging and — importantly — a **fallback**: a second provider or a smaller model when the primary is down or rate-limiting you. Note that failover is not free, because prompts are not perfectly portable between models, so the fallback path needs its own testing.

      **Cache aggressively.** Identical or near-identical requests are common in practice, and a cache keyed on the normalised prompt plus model plus parameters removes both latency and cost. Several providers also support prompt caching for a long shared prefix, which is worth structuring your prompts around: put the stable instructions first and the variable input last.

      **Keys and tenancy.** The API key is a high-value credential attached to a spending account; keep it server-side, never in a client, and scope and rotate it like any other. If users can influence the prompt — and they nearly always can — you have a path by which a user can spend your money, which is an abuse-prevention problem as much as a security one.

      ### The mistakes people actually make

      No timeout, so a hung stream holds a worker forever. Retrying a non-idempotent generation and being billed twice. Logging full prompts and responses containing customer data. Hard-coding one provider's SDK across the codebase. Sending far more context than the task needs. And shipping with no per-user rate limit, so one script turns a feature into an expense.
