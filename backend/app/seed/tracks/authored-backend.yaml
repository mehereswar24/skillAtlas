  - slug: backend-architectural-patterns
    name: "Monolith, Modular Monolith, Microservices"
    domain: backend
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - backend-integration-patterns
      - backend-applications
    summary: |-
      What splitting a system across process boundaries actually buys, what it costs, and how to find a seam that is worth cutting along.
    content_md: |-
      This is the most over-discussed and under-analysed decision in backend engineering. It helps to be precise about what changes when a function call becomes a network call.

      ### What the boundary changes

      An in-process call is nanoseconds, cannot half-succeed, refactors atomically, and is typed by your compiler. A network call is milliseconds, can time out with the work having happened anyway, requires versioned compatibility because the two sides deploy separately, and needs its own auth, retries, tracing and monitoring. Everything good and everything bad about microservices follows from that single substitution.

      What you gain is **independent deployability** — a team ships without coordinating with five others — plus independent scaling of a hot component, fault isolation if you actually built the isolation, and freedom to use different technologies. What you pay is distributed debugging, eventual consistency where you previously had transactions, network failure modes on every interaction, per-service operational overhead, and the need for real infrastructure maturity before you start.

      ### The modular monolith

      Most systems that "need microservices" actually need **modules**: one deployable, one database, but strict internal boundaries — each module owning its own tables, exposing an explicit interface, and forbidden by a lint rule or build constraint from reaching into another module's internals. You get most of the design benefit (clear ownership, contained change, comprehensible structure) with none of the distributed cost. And you get something better: if a module later needs to be extracted, the seam already exists and the extraction is mechanical. Starting with a monolith and splitting when a real pressure appears is the empirically better path than the reverse, because early on you do not yet know where the boundaries are.

      ### Finding a seam

      The best boundary follows **data ownership**: one service owns a set of tables, and nobody else writes to them. If two candidate services must be transactionally consistent, they are one service — a boundary that requires a distributed transaction to be correct is a boundary in the wrong place. Domain-driven design's bounded contexts are the vocabulary here, and the practical test is whether the two sides use the same word to mean different things. "Order" means something different in fulfilment and in billing, which is a strong hint about where the line goes.

      Team structure matters too. Conway's law observes that systems mirror the communication structure of the organisations that build them; the inverse — arranging teams to match the architecture you want — is a real lever and is usually easier than fighting it.

      ### The failure mode with a name

      A **distributed monolith** is the worst of both: services split by technical layer or by CRUD entity rather than by capability, sharing a database, requiring lockstep deployment, and chattering synchronously so that any one being down means all are. Symptoms: you cannot deploy service A without deploying B; a single user action fans out to eight synchronous calls; two services write the same table. The cure is to merge them back and re-cut the boundary, which is embarrassing and much cheaper than continuing.

      ### Migrating

      Do not rewrite. The **strangler fig** pattern puts a routing layer in front of the existing system and moves one capability at a time behind it, with the old path available until the new one is proven. It is slower to plan and vastly more likely to finish.

      ### The mistakes people actually make

      Splitting for scale when only one component is hot — extract that one component and leave the rest. Giving each service its own database and then joining across them in application code. Adopting microservices without tracing, centralised logging, automated deployment or on-call rotation, so every incident is a manual scavenger hunt. And measuring success in service count rather than in how quickly a change reaches production.
