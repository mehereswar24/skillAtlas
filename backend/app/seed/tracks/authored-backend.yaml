  - slug: backend-caching
    name: "Caching: Invalidation, Stampedes and a Staleness Budget"
    domain: backend
    est_hours: 9
    difficulty: intermediate
    prerequisites:
      - backend-relational-databases
    summary: |-
      Where to put a cache, how entries get out of it, and the failure modes — stampede, inconsistency, and the cache that becomes a single point of failure — that only appear under load.
    content_md: |-
      Caching is the cheapest performance win available and the easiest place to introduce a correctness bug. The discipline is to decide, explicitly, how stale a piece of data is allowed to be, and then choose a mechanism that enforces that budget.

      ### Where caches live

      There are at least five layers, and confusing them causes most cache bugs. The **browser or client** cache, controlled by HTTP headers. A **CDN or edge** cache, same headers, shared across users — which is why a `Cache-Control: public` on a personalised response leaks one user's data to another. An **application in-process** cache, fastest and smallest, but per-instance, so ten instances mean ten different views of the truth and no way to invalidate them all. A **shared cache** such as Redis or Memcached, consistent across instances at the cost of a network hop. And the **database's own** buffer cache, which you influence but do not control.

      ### Patterns

      **Cache-aside** (lazy loading) is the default: read from the cache; on a miss, read the source, write it into the cache, return it. Simple, resilient — if the cache is down, everything still works, slowly. **Write-through** writes to cache and source together, keeping them consistent at the cost of write latency and of caching data nobody reads. **Write-behind** buffers writes and flushes asynchronously, which is fast and can lose data.

      ### Invalidation

      Two honest options. **Expiry** (TTL) is simple and self-healing; the cost is bounded staleness, and you must be able to say what bound is acceptable. **Explicit invalidation** on write is precise but only as good as your ability to enumerate every key affected by a change, which quietly becomes impossible as the codebase grows. A robust compromise is short TTLs plus explicit invalidation on the paths you care most about, so a missed invalidation self-corrects in seconds rather than never.

      Key design carries most of the weight. Include everything that varies the result — entity id, version, locale, tenant, and the schema version of the serialised shape. Bumping a prefix in the key is then a global invalidation you can deploy, which is far easier than deleting keys by pattern.

      ### The failure modes

      **Stampede (thundering herd).** A popular key expires; a thousand concurrent requests all miss and all hit the database simultaneously. Mitigations: add random jitter to TTLs so keys do not expire in lockstep; use a lock or single-flight so only one request recomputes while the others wait; or serve the stale value while refreshing in the background.

      **Cold-start collapse.** If your database can only survive because the cache absorbs 95% of reads, a cache restart is an outage. Test it. Warm critical keys on deploy, or shed load rather than pass it all through.

      **Negative results.** If a miss is not cached, a stream of requests for non-existent ids becomes a stream of database queries — a cheap denial-of-service. Cache the "not found" too, with a short TTL.

      ### The mistakes people actually make

      Caching without measuring the hit rate, and so never learning the cache is useless. Caching a user-specific response under a key that omits the user. Setting a TTL of a day on something users expect to change instantly. And treating Redis as durable: it is a cache with optional persistence, and a plan that requires it never to lose data is a plan that will be tested.
