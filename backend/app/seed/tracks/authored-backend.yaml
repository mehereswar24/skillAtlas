  - slug: backend-more-about-databases
    name: "Transactions, Isolation Levels and Concurrency Anomalies"
    domain: backend
    est_hours: 10
    difficulty: advanced
    prerequisites:
      - backend-relational-databases
    summary: |-
      What a transaction actually guarantees, which anomalies each isolation level still permits, and why the bug that only appears under load is almost always in this list.
    content_md: |-
      Single-user correctness is easy. The bugs that survive code review and QA and then appear once a week in production are almost always concurrency bugs, and the vocabulary for them lives here.

      ### What ACID buys you

      **Atomicity**: the whole transaction commits or none of it does. **Consistency**: constraints hold at commit time. **Isolation**: concurrent transactions do not see each other's uncommitted mess — but *how much* they do not see is configurable, and this is where the surprises live. **Durability**: once committed, it survives a crash.

      ### The anomalies, and the levels that allow them

      The SQL standard names four isolation levels by which anomalies they forbid.

      - **Read uncommitted** allows dirty reads — seeing another transaction's uncommitted writes. PostgreSQL does not actually implement this level; it silently behaves as read committed.
      - **Read committed** (the PostgreSQL and Oracle default, and SQL Server's default) forbids dirty reads. It still allows **non-repeatable reads**: the same `SELECT` twice in one transaction can return different values, because each statement sees a fresh snapshot.
      - **Repeatable read** (MySQL InnoDB's default) gives every statement in the transaction the same snapshot. In PostgreSQL this also eliminates phantom reads via snapshot isolation, but it still permits **write skew**: two transactions each read the same state, each decides its write is safe, and together they violate an invariant neither could violate alone. The canonical example is an on-call rota where two doctors simultaneously check "is someone else on call?", both see yes, and both go off duty.
      - **Serializable** forbids everything by guaranteeing the outcome equals *some* serial order. PostgreSQL implements this with Serializable Snapshot Isolation, which does not lock but does abort transactions that would violate serialisability — so your application **must** be prepared to retry a transaction that fails with a serialisation error. Code that does not retry has not really enabled serializable isolation; it has just added a new source of 500s.

      ### MVCC, in one paragraph

      PostgreSQL and MySQL's InnoDB use multi-version concurrency control: a write creates a new row version rather than overwriting, and each transaction reads the versions visible to its snapshot. The enormous benefit is that readers never block writers and writers never block readers. The cost is dead row versions that a vacuum process must reclaim, and the fact that a long-running transaction pins old versions and prevents that reclamation — which is the mechanism behind table bloat and the surprising rule that an idle-in-transaction connection is genuinely dangerous.

      ### Explicit locking, and the deadlock rule

      When read-modify-write must be atomic and you are not on serializable, `SELECT ... FOR UPDATE` takes a row lock for the rest of the transaction. Deadlocks happen when two transactions take the same locks in opposite orders; the database detects the cycle and kills one. The prevention is a convention, not a clever algorithm: **always acquire locks in a consistent order**, for example ascending primary key.

      ### The mistakes people actually make

      Doing an HTTP call inside an open transaction, so a slow third party holds database locks and blocks vacuum. Wrapping an entire request handler in one transaction "for safety" and creating a five-second lock hold. Assuming a `UNIQUE` constraint means you never need to handle a duplicate-key error — two concurrent inserts will both pass a `SELECT`-then-`INSERT` check, and the constraint is what saves you, so catch the violation and treat it as success. And never testing under concurrency at all, which is why these bugs reach production.
