  - slug: backend-background-jobs
    name: "Background Jobs and Scheduled Work"
    domain: backend
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - backend-message-brokers
    summary: |-
      Getting slow work out of the request path: job queues, retries with backoff and jitter, idempotent workers, scheduled tasks, and the visibility every one of them needs.
    content_md: |-
      Sending an email, generating a report, transcoding a video, calling a slow third party, expiring stale rows at midnight — none of these belong inside a user's request. Background work is the most common asynchronous pattern in real backends and, oddly, one of the least taught.

      ### The shape

      A handler enqueues a job — an identifier and a small payload — and returns immediately, usually `202 Accepted` with a way to check status. A pool of workers, running as a separate process or deployment, pulls jobs and executes them. The queue may be a broker, a managed service, or simply a table in your database with `SELECT ... FOR UPDATE SKIP LOCKED`, which is a perfectly respectable choice at moderate volume and has the enormous advantage of enqueueing in the same transaction as your data change.

      ### Retries: backoff, jitter, and a ceiling

      Jobs fail. Retrying immediately is almost always wrong: the dependency that just failed is usually still failing, and a tight retry loop turns a small outage into a self-inflicted denial of service. Use **exponential backoff** — one second, two, four, eight — with a maximum, and add **jitter**, a random component, because without it every job that failed during the same blip retries at exactly the same instant and produces a synchronised thundering herd. Cap the attempts and dead-letter the rest.

      Retries make idempotency mandatory rather than optional. A worker can be killed at any point, including after the side effect and before recording success, so "charge the card" must be guarded by an idempotency key and "send the email" needs a sent-marker written transactionally, or the customer gets billed twice and emailed six times.

      Distinguish **retryable** from **permanent** failures. A timeout or a `503` deserves a retry; a `400`, a validation error or a missing record does not, and retrying it thirty times just delays the alert and pollutes your metrics.

      ### Scheduled work

      Cron-style scheduling has a trap: run it on three instances and it fires three times. Solutions in ascending order of robustness: a single designated instance (fragile), a distributed lock or leader election around the job, or a scheduler that enqueues one job onto the shared queue and lets normal worker semantics take over. The last is usually best, because it reuses the retry, visibility and dead-letter machinery you already have. Remember that cron also does not fire at all if the machine was down at the time, so anything financial or legal needs a catch-up query — "process everything not yet processed" — rather than "process what happened in the last hour."

      Long jobs need to be interruptible. Deploys kill workers, so a worker must handle `SIGTERM` by finishing or safely abandoning the current job within the shutdown grace period. Break large jobs into chunks that record progress, so a restart resumes rather than starting over.

      ### Visibility

      Background work fails silently by nature — no user is watching. The minimum instrumentation is: queue depth and oldest-job age per queue (age matters more than depth), success and failure counts by job type, execution duration, and an alert on the dead-letter queue. Give every job a correlation id from the request that created it, so a user's complaint can be traced into the worker logs.

      ### The mistakes people actually make

      Enqueueing a job inside a transaction that then rolls back, so a worker picks up an id that does not exist — enqueue after commit, or use the outbox. Passing whole objects rather than ids, so the worker acts on stale data. Sharing one queue for a five-millisecond job and a twenty-minute job, so the fast ones starve. Running workers in the same process as the web server, so a memory-hungry job takes down request serving. And having no way to re-run a failed job without a database edit.
