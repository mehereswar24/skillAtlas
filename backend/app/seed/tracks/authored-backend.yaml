  - slug: backend-building-for-scale
    name: "Capacity, Tail Latency and Load Testing"
    domain: backend
    est_hours: 9
    difficulty: advanced
    prerequisites:
      - backend-advanced-backend
      - backend-caching
    summary: |-
      Why systems fall over a cliff rather than degrading gently, what queueing theory predicts about your p99, and how to find your real limit before your users do.
    content_md: |-
      Scaling is not "add servers". It is knowing where your capacity actually ends, what happens at that edge, and choosing the behaviour there deliberately.

      ### Two laws worth internalising

      **Little's Law**: the average number of requests in your system equals arrival rate times average time in system (`L = λW`). Rearranged, it tells you the concurrency you must support to serve a given throughput at a given latency — 1,000 requests per second at 100 ms means 100 concurrent requests in flight, minimum. It also tells you that if latency doubles under load and arrivals do not slow down, in-flight work doubles, which is why overload compounds.

      **Queueing behaviour**: as utilisation approaches 100%, queue length and waiting time do not rise linearly — they rise asymptotically. This is the mathematical reason a system that is fine at 70% utilisation collapses at 90%, and why you cannot safely plan to run any component near full. It is also why the answer to "why is p99 so much worse than p50?" is usually queueing, not slow code.

      ### Tail latency is the user experience

      Averages hide everything. If a page makes ten backend calls, and each has a 1% chance of being slow, roughly 10% of page loads hit at least one slow call — tail latency at the component level becomes typical latency at the user level. Sources of tails: garbage collection pauses, cache misses, connection pool waits, lock contention, a noisy neighbour, a retry after a timeout. Two techniques help directly: **hedged requests** (issue a duplicate to another replica if the first is slow, take the first answer, at the cost of extra load) and simply removing the sequential dependencies that let one slow call gate everything else.

      ### Find the limit on purpose

      A **load test** applies expected traffic and confirms the system meets its objectives. A **stress test** keeps increasing until something breaks, which is the one that teaches you something: you learn the actual ceiling, which resource is the bottleneck, and — most importantly — the *failure mode*. Does the system shed load and stay responsive, or does it queue everything, exhaust memory and stop entirely?

      Test realistically or do not bother. Uniform traffic against one endpoint with a hot cache and an empty database measures nothing. Use production-shaped traffic mixes, realistic data volumes, realistic key distributions (real traffic is Zipfian — a few items get most of the requests), and think-time between requests. Run long enough to expose leaks and cache turnover, not for ninety seconds.

      ### Choosing what happens at the edge

      Every system has a limit; the decision is what it does there. **Load shedding** rejects excess work quickly with a `429` or `503` and a `Retry-After`, which keeps the accepted work fast — far better than accepting everything and serving all of it slowly, since a timed-out request consumed resources and delivered nothing. **Concurrency limits** at the entry point, per endpoint and per dependency, are the mechanism. **Graceful degradation** turns off the recommendations panel and serves the core page. **Prioritisation** protects checkout traffic at the expense of analytics ingestion.

      Be careful with autoscaling as the answer: it takes tens of seconds to minutes, so it handles trends, not spikes, and a scaling event during overload can make things worse as new instances start cold and hammer the database. Keep headroom.

      ### Profile before you optimise

      When something is slow, measure where. A profiler and a flame graph will tell you in minutes what a week of reading code will not, and the answer is regularly something unglamorous: JSON serialisation of an oversized payload, a regular expression compiled per request, logging at debug level in production, or a connection pool sized at five.

      ### The mistakes people actually make

      Optimising code when the bottleneck is a database round trip. Load testing against staging hardware a fraction of production's size and extrapolating linearly. Adding capacity to a system whose bottleneck is a single-writer database. Removing a limit to make an error go away, thereby converting a contained failure into a total one. And having no idea what the current headroom is, so every launch is a gamble.
    resources:
      - kind: article
        title: "AWS Builders' Library: Using load shedding to avoid overload"
        url: "https://aws.amazon.com/builders-library/using-load-shedding-to-avoid-overload/"
