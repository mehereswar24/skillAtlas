  - slug: backend-scaling-databases
    name: "Scaling the Data Layer: Pooling, Replication, Partitioning, Sharding"
    domain: backend
    est_hours: 10
    difficulty: advanced
    prerequisites:
      - backend-more-about-databases
      - backend-nosql-databases
    summary: |-
      The escalation ladder from a bigger machine to a sharded cluster, in the order you should actually climb it, and the read-your-writes bug that replication always introduces.
    content_md: |-
      Database scaling is a ladder, and almost every team that struggles has skipped rungs. Climb it in order and stop as soon as the problem goes away.

      ### Rung 0: stop wasting what you have

      Before anything else: fix the missing index, kill the N+1, delete the query nobody reads, add a cache. A single modern PostgreSQL instance on decent hardware handles workloads that most teams never reach. Sharding a database that has never been profiled is the most expensive way to avoid reading a query plan.

      ### Rung 1: connection pooling

      Every PostgreSQL connection is a backend process with its own memory; a few hundred is a lot, and `max_connections` is a real wall. Serverless functions and multi-process application servers hit it easily, because each instance holds its own pool. A pooler like PgBouncer multiplexes many client connections onto few server connections. Know the modes: **session** pooling assigns a server connection for the client's whole session and is safe but barely helps; **transaction** pooling returns the connection between transactions and is the useful mode — but it breaks anything that relies on session state, including prepared statements in some drivers, `SET` parameters, advisory locks and `LISTEN`/`NOTIFY`.

      ### Rung 2: read replicas

      Stream the write-ahead log to replicas and send read-only queries there. This scales reads and gives you a standby for failover. It does not scale writes at all, and it introduces the single most common bug in this area: **replication lag**. A user updates their profile, is redirected, the read hits a replica that is 200 ms behind, and their change appears to have vanished. The fixes are all deliberate choices, not defaults: route reads to the primary for a short window after a write, pin a session to the primary, or pass the write's log position and wait for the replica to catch up. Also budget for lag spikes — a bulk backfill or a long-running query on the replica can push it from milliseconds to minutes.

      ### Rung 3: partitioning

      Split one logical table into physical partitions by range (usually time) or by hash, inside the same database. Queries that include the partition key touch one partition instead of the whole table, and — often the real prize — dropping last year's data becomes a metadata operation instead of a `DELETE` of a billion rows. Cheap to adopt, low risk. Do this before you consider sharding.

      ### Rung 4: sharding

      Split data across separate databases by a shard key. This is the only rung that scales writes, and it is where the difficulty jumps. You lose cross-shard joins, cross-shard transactions and global uniqueness; you gain a routing layer, a rebalancing problem and a much harder operational story. The shard key decision is close to irreversible: pick something with high cardinality and even access distribution (tenant id is a natural choice until one tenant is a hundred times bigger than the rest, at which point you need a plan for that tenant).

      ### The mistakes people actually make

      Adding replicas to fix a write bottleneck. Enabling transaction pooling and then wondering why prepared statements fail intermittently. Sharding on a monotonically increasing key, which sends all new writes to one shard. Forgetting that a replica is not a backup — a `DROP TABLE` replicates faithfully in milliseconds — so you still need point-in-time recovery, and you still need to have practised a restore.
