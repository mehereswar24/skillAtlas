  - slug: backend-container-orchestration
    name: "Orchestration: Scheduling, Health and Graceful Rollouts"
    domain: backend
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - backend-containerization
    summary: |-
      What Kubernetes and its alternatives actually do for you, the probe and resource settings that decide whether rollouts are safe, and how to know when you do not need any of it.
    content_md: |-
      Orchestration answers a small set of questions that become hard the moment you have more than one machine: where should this container run, is it healthy, how do other things find it, and how do I replace it without dropping traffic?

      ### The reconciliation model

      The idea that explains everything else is **declarative reconciliation**. You submit desired state — "five replicas of this image, with this configuration" — and controllers continuously compare it against actual state and act to close the gap. A crashed container is restarted, a dead node's pods are rescheduled, a changed image triggers a rollout. You never issue imperative commands; you edit the desired state.

      The scheduler places pods on nodes using **resource requests** as its input, plus constraints you supply — node selectors, affinity and anti-affinity (spread replicas across zones so one zone's failure is survivable), taints and tolerations. **Services** give a stable virtual address and load-balance across the matching pods, so callers never track individual pod IPs.

      ### The settings that decide whether a rollout is safe

      **Requests versus limits.** The request is what the scheduler reserves and what you are effectively guaranteed; the limit is the hard ceiling. Exceeding a memory limit is fatal — the kernel `OOMKill`s the container, and the pod restarts with a status people spend hours misreading. Exceeding a CPU limit is not fatal but is throttling: the container is simply given less CPU, producing mysterious latency with no error anywhere. Requests set too low get your pods scheduled onto crowded nodes and evicted first; set too high, you pay for idle capacity.

      **Three probes, three different jobs, and confusing them causes outages.** The **readiness** probe controls whether the pod receives traffic; failing it removes the pod from the service endpoints without killing it — exactly what you want during warm-up or when a dependency is briefly unavailable. The **liveness** probe restarts the container when it fails; it should test only whether *this process* is wedged. Pointing a liveness probe at a database is a classic self-inflicted outage: the database blips, every replica fails liveness, every replica restarts simultaneously, and now you have a cold cache and a restart storm on top of the original problem. The **startup** probe gives slow-booting applications time before the liveness probe applies.

      **Graceful shutdown.** On termination, the pod is removed from endpoints and sent `SIGTERM` — but those two events are asynchronous, so a pod can receive requests for a moment after `SIGTERM` arrives. The standard remedy is a short `preStop` sleep so endpoint propagation completes, followed by a real drain: stop accepting new work, finish in-flight requests, close pools, exit within `terminationGracePeriodSeconds`.

      **Autoscaling.** The horizontal pod autoscaler adds replicas on a metric. It reacts in tens of seconds at best, and new pods still need to start and warm up, so it handles a rising trend and does not handle an instant spike — that is what headroom and load shedding are for.

      ### Do you need this?

      Honestly: often not. A managed container platform, a scale-to-zero serverless runtime or a couple of VMs behind a load balancer runs a small service with a fraction of the operational surface. Kubernetes earns its complexity when you have many services, many teams, real multi-tenancy or genuine bin-packing pressure. Adopting it for three services means the platform becomes the on-call burden.

      ### The mistakes people actually make

      No resource requests at all, so the scheduler cannot make good decisions and one noisy pod starves a node. Liveness and readiness pointing at the same deep health endpoint. Storing state in a `Deployment` instead of a `StatefulSet` with real volumes. `latest` image tags, which make "what is actually running?" unanswerable. And using the cluster as a configuration store rather than keeping manifests in Git.
