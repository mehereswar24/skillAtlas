        url: "https://docs.gitlab.com/ee/user/project/merge_requests/"

  - slug: backend-server-side
    name: "Concurrency Models: Processes, Threads, Sockets and Event Loops"
    domain: backend
    est_hours: 9
    difficulty: intermediate
    prerequisites:
      - backend-introduction
    summary: |-
      How a single machine serves thousands of simultaneous connections, why the answer differs by runtime, and what actually runs out first.
    content_md: |-
      A server is a program that accepts connections and does not exit. Everything interesting about it comes from one question: while it is waiting for a slow thing, what else is it doing?

      ### Sockets and file descriptors

      The kernel gives a process a listening socket; each accepted connection becomes another file descriptor. File descriptors are limited per process (`ulimit -n`) and system-wide, and hitting either produces the memorable failure "too many open files" — a symptom that in practice almost always means a leak: connections, files or HTTP clients created per request and never closed.

      ### Three ways to wait

      **Thread- or process-per-request.** Each connection gets its own execution context, which blocks while waiting on I/O. Simple to reason about; the cost is memory per thread (an OS thread stack is typically around a megabyte by default on Linux) and context-switching overhead. This is classic Apache prefork, PHP-FPM, and most Java servlet containers before virtual threads.

      **Event loop.** One thread, a readiness API (`epoll` on Linux, `kqueue` on BSD), and callbacks or coroutines. The loop asks the kernel "which of these ten thousand sockets is ready?" and processes only those. Memory per connection collapses to a small buffer. This is Node.js, nginx, and Python's `asyncio`. The cost is that **any blocking call poisons everything**: one synchronous CPU-heavy or blocking-I/O call on the loop stalls every other connection, which is why "why is my whole Node service slow" so often traces to a synchronous parse of a huge body or a password-hashing call on the main thread.

      **Lightweight threads.** Go's goroutines and Java's virtual threads give you blocking-style code with event-loop economics: the runtime parks the lightweight thread on I/O and reuses the OS thread underneath. This is the model most new server runtimes converge on, because it keeps the readable code shape without the poisoning problem.

      ### What runs out first

      Rarely CPU. Usually one of: file descriptors; memory, since each in-flight request holds its buffers and objects; database connections, because a pool of twenty means at most twenty concurrent queries no matter how many requests are in flight; or an upstream's capacity. Concurrency limits are therefore not a tuning detail — they are the mechanism by which you decide *what to reject* when demand exceeds capacity. A server with no limit does not serve everyone; it queues everyone, exhausts its memory, and serves nobody.

      ### The mistakes people actually make

      Setting a worker count to a made-up number instead of deriving it from the bottleneck. Running an event-loop runtime and then calling a blocking library. Sizing a database connection pool larger than the database's own connection limit, so the failure moves from "requests queue" to "database refuses connections." And forgetting that a request with no timeout occupies its slot forever, so one hung upstream can consume the entire pool — the classic path from a partial outage to a total one.
    resources:
      - kind: doc
        title: "Linux man page: epoll(7)"
        url: "https://man7.org/linux/man-pages/man7/epoll.7.html"
      - kind: doc
        title: "Node.js: The event loop, timers and process.nextTick()"
        url: "https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick"
