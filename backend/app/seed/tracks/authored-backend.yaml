  - slug: backend-search-engines
    name: "Full-Text Search and the Inverted Index"
    domain: backend
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - backend-relational-databases
    summary: |-
      Why `LIKE '%term%'` cannot work at scale, what an analyzer and an inverted index actually do, and how to keep a search index in sync with your source of truth.
    content_md: |-
      Search feels like a feature and behaves like a second database. Treating it as one — with its own consistency story and its own failure modes — is most of what separates a search box that works from one that quietly returns nothing.

      ### The mechanism

      A B-tree index sorts whole values, so it can answer "starts with" but not "contains". Full-text search uses an **inverted index** instead: a map from each term to the list of documents containing it. Building it requires **analysis** — a pipeline that turns text into terms. Typically: tokenise on word boundaries, lowercase, strip or keep stop words, and **stem** or lemmatise so that "running", "runs" and "ran" collapse to one term. Querying applies the same analysis to the query text, then intersects posting lists.

      This is why analysis choices are the whole game. Index with an English analyzer and query with a different one, and you get zero results for a document you can see with your own eyes. Choose aggressive stemming and "university" matches "universe". Language matters: a German analyzer must handle compound words, and a Chinese one cannot tokenise on spaces at all.

      ### Ranking

      Matching is boolean; usefulness is ranking. The standard is **BM25**, which scores a document higher when the query term appears often in it (with diminishing returns), when the term is rare across the corpus, and when the document is short relative to average. On top of that, real systems boost fields (a match in the title beats one in the body), boost recency, and boost business signals like popularity. Relevance tuning is empirical: capture real queries, build a judgement set of what *should* rank, and measure changes against it rather than eyeballing one example.

      ### Postgres or a dedicated engine?

      PostgreSQL's `tsvector`/`tsquery` with a GIN index is genuinely good: real analysis, ranking, phrase search, no extra system to operate, and — decisively — no synchronisation problem, because the index is in the same transaction as the data. Reach for Elasticsearch or OpenSearch when you need faceted aggregation over large corpora, per-field analyzers at scale, fuzzy matching and typo tolerance, "more like this", or horizontal scale beyond one machine. Vector search for semantic similarity is an increasingly common complement (`pgvector`, or the vector types in the dedicated engines), usually combined with BM25 in a hybrid ranking rather than replacing it.

      ### Keeping the index in sync

      With a separate engine you now have two stores and a consistency problem. The naive approach — write to the database, then write to the index — loses updates whenever the second write fails. Durable options: write an event to an outbox table in the same transaction as the data change and have a worker ship it to the index; or tail the database's replication log with change-data-capture. Either way, **plan for a full reindex from the source of truth**, script it, and run it periodically, because drift is not a possibility but a certainty.

      ### The mistakes people actually make

      Shipping `LIKE '%q%'` and only discovering at a million rows that it cannot use an index. Indexing the whole document including fields nobody searches, tripling index size. Forgetting that deletes must propagate, so search returns items that 404. Making the search engine the source of truth for anything. And exposing raw query syntax to users, so a stray colon or bracket returns a parse error instead of results.
