# Hand-authored for SkillAtlas. Do NOT regenerate with scripts/import_roadmapsh.py.
#
# Written independently from our own knowledge of the subject and from primary
# sources (RFCs, MDN, PostgreSQL/Kafka/Kubernetes documentation, the AWS
# Builders' Library, the Google SRE book). Nothing here is derived from
# roadmap.sh's backend roadmap.
#
# The syllabus is deliberately outcome-shaped rather than a topic checklist.
# The spine is: understand one request end to end -> get the data layer right,
# because that is where correctness actually lives -> build and structure the
# service -> make it asynchronous where it must be -> prove it works -> ship
# and operate it -> only then add AI features.
#
# Slugs are stable: projects, role skills, quizzes and company focus areas
# reference them. A few slugs inherited from the imported track have been
# repurposed to a topic that earns its place.

track:
  slug: backend
  title: "Backend Engineering: From One Request to Production"
  domain: backend
  target_role: "Backend Developer"
  difficulty: intermediate
  description: "A 35-step path from 'what actually happens when a request arrives' to running a service other teams depend on. Data modelling and transactions come early, because that is where correctness lives; asynchronous work, integration and failure handling come before architecture, because you cannot choose a topology you have never operated; delivery and observability come before scale; AI features come last, treated as one more unreliable network dependency."

concepts:
  - slug: backend-introduction
    name: "The Life of a Request"
    domain: backend
    est_hours: 5
    difficulty: beginner
    prerequisites: []
    summary: |-
      Trace one HTTP request from a browser's address bar to a database row and back, so that every later topic has somewhere concrete to attach itself.
    content_md: |-
      Almost every backend problem you will ever debug is a step in one journey that repeats billions of times a day. Learning the journey first — before frameworks, before languages — means that later topics stop being trivia and become "the part of the trip that went wrong."

      ### The trip

      A client types a URL. Before any of your code runs, the client resolves the hostname through DNS, which usually means a cached answer from a resolver rather than a fresh lookup. It opens a TCP connection to the resulting IP and port — one round trip for the handshake — then negotiates TLS on top of it, which historically cost two more round trips and costs one with TLS 1.3. Only then does the first byte of your HTTP request go out. On a connection to another continent, you have already spent a few hundred milliseconds before your handler exists.

      The request arrives at something listening on port 443. In almost every real deployment that is *not* your application: it is a reverse proxy or load balancer, which terminates TLS, picks a healthy backend, and forwards the request onward, often over a pooled, already-warm connection. Your application process accepts it, parses the request line and headers, matches the path against a routing table, deserialises the body, and calls a handler.

      The handler usually does the only genuinely slow thing in the whole trip: it talks to something else. A database query, a cache lookup, a call to another service. That I/O is where the milliseconds are, which is why the rest of this track spends so much time on data and on calls that cross a network. The handler builds a response, serialises it, sets a status code and headers, and the whole path unwinds — through the proxy, back over the same TCP connection if the client asked to keep it alive.

      ### Where the time actually goes

      Beginners assume their code is slow. It rarely is. In a typical request the CPU time spent in your language runtime is a fraction of a millisecond, while the wall-clock time is dominated by network round trips and by waiting on the database. This has an immediate practical consequence: making a handler do *fewer* round trips almost always beats making its code faster. One query returning a hundred rows will crush a hundred queries returning one row each, no matter how tight the loop around them is.

      ### The mistakes people actually make

      The first is assuming the request path is only their code, and so never learning what the proxy in front of them does — until a 60-second upstream default kills a long request and the logs show nothing, because the application never got to log a completion. The second is confusing concurrency with speed: adding worker processes does not make a single request faster, it only lets more of them wait at the same time. The third, and the most expensive, is not being able to say where a slow request spent its time, which is exactly the gap that tracing and structured logging exist to close later in this track.

      **What you should be able to do next:** given a slow endpoint, name the five or six places the time could be going, and say which measurement would distinguish them.
