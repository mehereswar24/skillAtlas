  - slug: backend-integration-patterns
    name: "Calling Other Services Without Inheriting Their Outage"
    domain: backend
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - backend-message-brokers
    summary: |-
      Timeouts, retries, circuit breakers, bulkheads and idempotency keys — the small set of patterns that stop one dependency's bad day from becoming yours.
    content_md: |-
      The moment your service calls another over a network, you have inherited its availability, its latency and its failure modes. Multiplied across five dependencies, "99.9% each" is not 99.9%. These patterns are how you break that coupling.

      ### Timeouts, and the budget above them

      Every network call needs an explicit timeout. Defaults are frequently infinite, and an infinite timeout is the mechanism by which a slow dependency exhausts your thread pool or connection pool and takes down endpoints that never touch it. Set the timeout from the dependency's observed high percentile — a little above its p99 — not from a round number someone liked.

      Better still, propagate a **deadline**. The inbound request has a budget; each downstream call gets what remains, minus a margin. Without it, a chain of three services each allowing thirty seconds can spend ninety on a request whose caller gave up after five, doing work nobody will read.

      ### Retries, and why they are dangerous

      Retries fix transient failures and amplify overload. Three rules make them safe. Only retry what is safe to retry — an idempotent operation, or one guarded by an idempotency key. Always use exponential backoff **with jitter**. And bound the total: retry budgets (allow retries to be at most a small percentage of overall traffic) are better than per-call attempt limits, because during a broad failure per-call limits still multiply your load by three at the worst possible moment. Never retry at every layer of a chain simultaneously; four layers each retrying three times is eighty-one calls.

      ### Circuit breakers and bulkheads

      A **circuit breaker** watches the failure rate of calls to one dependency. Past a threshold it opens and fails immediately without attempting the call, which both protects the struggling dependency and, crucially, returns your own latency to normal instead of making every request wait for a timeout. After a cooling period it half-opens, allows a trial request, and closes on success. The design decision people skip is what an open circuit *returns*: cached data, a degraded response, an empty list, or a clear error. Decide per dependency.

      A **bulkhead** limits how much of your capacity any one dependency can consume — a separate connection pool or concurrency limiter per downstream. Without it, the slowest dependency eventually owns all your workers.

      ### Idempotency keys

      For a `POST` that must not happen twice, let the caller supply a unique key, store it with the result, and on a repeat return the stored result rather than re-executing. This is how payment APIs make retries safe, and it is the correct answer whenever a client might not learn whether its request succeeded.

      ### Webhooks: being called, and calling

      When you receive a webhook: **verify the signature** (an HMAC over the raw body, compared in constant time, with a timestamp window against replay); respond quickly with a `2xx` and do the work asynchronously, because senders time out; and expect duplicates, because senders retry. When you send them: sign, retry with backoff, keep a delivery log the recipient can inspect, and provide a replay mechanism.

      ### Distributed transactions

      There is no cross-service `COMMIT`. When a business operation spans services, use a **saga**: a sequence of local transactions, each with a compensating action if a later step fails. Compensation is not rollback — refunding a charge is a new fact, not the erasure of an old one — so the domain must be designed to tolerate the intermediate states.

      ### The mistakes people actually make

      Testing only the happy path, so failure handling is first executed in production. Retrying a non-idempotent `POST`. Setting all timeouts to thirty seconds. Falling back to a stale cache without telling anyone, so a dependency is broken for a week before anyone notices. And logging the failure but returning a `200`, which hides the outage from every monitor you have.
