  - slug: backend-ai-assisted-coding
    name: "Working With a Coding Assistant Without Losing the Plot"
    domain: backend
    est_hours: 4
    difficulty: beginner
    prerequisites:
      - backend-repo-hosting-services
    summary: |-
      Where generated code helps, where it reliably fails, and the review habits that stop it from silently lowering the quality of a codebase.
    content_md: |-
      Assistants are now part of most backend workflows, and the interesting question is not whether to use one but what changes about your responsibilities when you do.

      ### Where it genuinely helps

      Mechanical transformation — converting a data shape, writing the twentieth serialiser, adding the same instrumentation to forty handlers. Boilerplate against a well-documented library. First drafts of tests, especially the tedious edge cases you would have skipped. Explaining unfamiliar code, which is often the fastest way into a legacy system. Writing the regular expression, the SQL you half-remember, or the shell incantation. And rubber-ducking a design by having to articulate it.

      ### Where it reliably fails

      **Hallucinated APIs.** A confidently generated call to a method that does not exist, or that existed in version 2 and was removed in version 3. This is the single most common failure and the reason "does it compile and does a test pass" is the minimum bar.

      **Plausible-but-wrong concurrency and security code.** Generated authentication, authorisation, cryptography and locking look right and are frequently subtly wrong — a comparison that is not constant-time, a check-then-act race, an authorisation check on the wrong object. These are exactly the areas where a reviewer's default should be scepticism, because the failure is silent.

      **Context it cannot have.** It does not know your migration is mid-rollout, that this table is sharded, that this dependency is being removed next sprint, or why the obvious approach was rejected two years ago. It optimises for locally plausible code, which is how a codebase accumulates five slightly different ways to do the same thing.

      **Outdated patterns.** Training data skews toward what was common a while ago, so suggestions may use a deprecated API, an older library idiom, or a security practice that is no longer recommended.

      ### The habits that keep quality up

      Read every line you accept, and hold it to exactly the standard you would hold a colleague's pull request to — because in review terms, that is what it is, and you are the author. Prefer to specify the *interface and the tests* yourself and let the assistant fill in the body: tests you wrote are a check the generated code cannot game. Work in small increments you can verify, rather than accepting three hundred lines at once. Be deliberate about what you paste into a tool — proprietary code, customer data and secrets in a prompt are an exfiltration path, and organisational policy on this is not optional. And be aware that generated code can reproduce licensed material; for anything substantial, that is a legal question, not a style one.

      The productivity risk that is easy to miss: accepting a suggestion is faster than writing code, but *debugging code you did not write and do not understand* is much slower than debugging your own. Time saved at the keyboard can be repaid with interest at 3 a.m.

      ### The mistakes people actually make

      Merging code the author cannot explain. Letting the assistant write both the implementation and the test, so both share the same misunderstanding. Using it to skip learning the fundamentals it is standing on, which caps you at the level where you can no longer tell a good suggestion from a bad one. And pasting production data into a prompt.
