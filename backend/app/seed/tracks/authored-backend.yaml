  - slug: backend-version-control-systems
    name: "Git as a Directed Graph"
    domain: backend
    est_hours: 8
    difficulty: beginner
    prerequisites:
      - backend-introduction
    summary: |-
      Commits, trees and refs as the data structure they really are, so that merges, rebases and recoveries stop being incantations copied from a search result.
    content_md: |-
      Git is taught badly almost everywhere, as a list of commands to memorise. It becomes far easier once you accept the underlying claim: a Git repository is a content-addressed object store, and history is a directed acyclic graph of commits.

      ### The object model

      Four object types, each named by the hash of its own contents. A **blob** is a file's bytes. A **tree** is a directory listing: names pointing at blobs and other trees. A **commit** points at one tree — a complete snapshot of the working tree, not a diff — plus zero or more parent commits, an author, and a message. A **tag** is a named pointer with its own metadata. Because objects are named by their hash, identical content is stored once, and any change anywhere changes every hash above it.

      A **branch** is not a container of commits. It is a small file containing one commit hash, which moves forward when you commit. This single fact explains most of Git's behaviour: creating a branch is free, deleting a branch deletes no commits, and "losing work" almost always means losing a *pointer* while the commits sit untouched in the object store.

      ### Merging, and what a merge base is

      When you merge two branches, Git finds their **merge base** — the most recent commit reachable from both — and performs a three-way merge: for each file it compares base-to-yours and base-to-theirs. If only one side changed a region, that side wins with no conflict. If both changed the same region differently, you get a conflict, and Git is honest enough to refuse to guess. Understanding that conflicts come from *both sides diverging from a common ancestor* is what turns conflict resolution from panic into a decision.

      Rebasing replays your commits onto a new base, producing new commits with new hashes and a linear history. Merging preserves what actually happened and records the join. Neither is universally correct: rebase local work you have not shared, and prefer merges for anything others have already pulled, because rewriting shared history forces everyone else to recover from it.

      ### Recovery

      `git reflog` records every position `HEAD` has held locally, including ones no branch points at any more. A "destroyed" branch after a bad reset is almost always one `git reset --hard <reflog-entry>` away. `git bisect` binary-searches history for the commit that introduced a bug, and with a scripted test it is fully automatic — an hour of bisecting beats a day of reading diffs.

      ### The mistakes people actually make

      Committing generated artefacts, virtual environments and secrets, then discovering that deleting a file in a later commit does not remove it from history — a leaked key must be rotated, not merely deleted. Using `git pull` without understanding that it is a fetch plus a merge, and so producing a tangle of merge commits nobody asked for. Force-pushing a shared branch. And treating commit messages as noise: the message is the only place the *reason* for a change can live, since the diff already shows the what.
    resources:
      - kind: book
        title: "Pro Git (Chacon & Straub, free online)"
        url: "https://git-scm.com/book/en/v2"
      - kind: doc
        title: "Git Internals — Git Objects"
        url: "https://git-scm.com/book/en/v2/Git-Internals-Git-Objects"
