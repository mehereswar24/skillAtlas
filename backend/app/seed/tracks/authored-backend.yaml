  - slug: backend-learn-the-basics
    name: "Configuration, Secrets and Environments"
    domain: backend
    est_hours: 5
    difficulty: beginner
    prerequisites:
      - backend-introduction
    summary: |-
      How the same build runs in development, staging and production without a code change — and how credentials stay out of your repository, your logs and your error reports.
    content_md: |-
      Configuration is the least glamorous topic in this track and the source of a startling share of production incidents. The rule that prevents most of them is simple: **the artefact you test is the artefact you deploy, and everything that differs between environments is injected from outside it.**

      ### Config is not code

      Anything that varies per environment — database URLs, feature toggles, log levels, upstream hostnames, credentials — is configuration. Anything that does not vary is code and belongs in the repository. The moment you write `if environment == "production"` inside a handler, you have created a code path your tests never execute, and you will find out whether it works by deploying it.

      The conventional mechanism is environment variables, popularised by the Twelve-Factor App. They are language-agnostic, supported by every container and orchestration system, and impossible to accidentally commit. Their weaknesses are worth knowing: everything is a string, so parsing and validating types is on you; there is no structure; and they are visible to the whole process tree and often to crash dumps and child processes. Most teams therefore layer a config object over them — defined once, validated at start-up, read from a single module — rather than sprinkling environment lookups through the codebase.

      **Validate at boot, not at first use.** A service that starts happily and then fails at 3 a.m. because `MAX_RETRIES` was the string `"three"` is far worse than one that refuses to start. Parse the entire configuration into a typed structure during start-up and exit non-zero on anything missing or malformed. That turns a latent config error into a failed deploy, which your rollout strategy already knows how to handle.

      ### Secrets

      Secrets are configuration that must never be readable. Practical rules, in descending order of importance. Never commit them — and if one is committed, rotate it, because history is permanent and public repositories are scraped within minutes of a push. Prefer a secret manager that supports rotation and audit over a static file on a server. Give every environment and every service its own credentials, scoped to what they actually need, so a leak has a bounded blast radius and a revocation story. Keep an example file with keys and dummy values in the repository so a new developer knows what is required.

      The subtle failure is **leaking secrets through observability**. Exception reporters serialise local variables; loggers print request headers; a debug page renders the whole environment. Redact at the point of serialisation, and prefer an allowlist of loggable fields over a denylist of secret names — the denylist will always be one key out of date.

      ### The mistakes people actually make

      Baking configuration into a container image, so promoting the tested image from staging to production is impossible and you rebuild instead. Reading environment variables at module import time in a way that makes tests impossible to configure. Sharing one database credential across every service, so rotating it means a coordinated outage. And keeping a local environment file that has silently drifted from what production actually sets, which is how "works on my machine" survives into the container era.
    resources:
      - kind: article
        title: "The Twelve-Factor App: Config"
        url: "https://12factor.net/config"
      - kind: doc
