  - slug: backend-api-styles
    name: "REST, GraphQL, gRPC and Async: Choosing a Style"
    domain: backend
    est_hours: 7
    difficulty: intermediate
    prerequisites:
      - backend-learn-about-apis
    summary: |-
      Four transports with genuinely different cost models, and how to pick by consumer and traffic shape instead of by fashion.
    content_md: |-
      There is no best API style, only styles whose costs match or mismatch your consumers. Four dominate, and a mature system usually runs more than one.

      ### REST over JSON

      Resources identified by URLs, manipulated with HTTP methods, represented as JSON. Its advantages are unglamorous and enormous: every language, tool, proxy, CDN and browser understands it; it is debuggable with `curl`; HTTP caching works out of the box; and any engineer can read the traffic. Its weakness is fixed representations — a client that needs three related things makes three requests, and a mobile client that needs two fields still downloads forty.

      ### GraphQL

      One endpoint, a typed schema, and a query language that lets the client ask for exactly the fields it wants across related objects in one round trip. This genuinely solves over-fetching and under-fetching, and it is at its best with many heterogeneous clients evolving faster than the backend. The costs are real and often understated. HTTP caching largely stops working, because everything is a `POST` to one URL — you replace it with persisted queries and application-level caching. Rate limiting by request count becomes meaningless; you need query cost analysis, and a depth limit, or a hostile client can request a deeply nested cycle and exhaust your database. And naive resolvers produce N+1 queries by construction, which is why the dataloader batching pattern is not optional.

      ### gRPC

      Protocol Buffers over HTTP/2, with generated clients and servers from a `.proto` file. Compact binary payloads, real streaming in both directions, strict typed contracts, and excellent performance — the natural choice for high-volume service-to-service traffic inside your own network. The costs: it is not directly callable from a browser without a proxy layer; the payloads are not human-readable, so debugging needs tooling; and the schema's field numbers create their own compatibility discipline (never reuse a field number, never change a type).

      ### Asynchronous and event-driven

      Not a request/response style at all: the caller publishes an event or enqueues a command and does not wait. This is the right shape when work takes longer than a client should wait, when the producer should not know its consumers, or when you need to absorb bursts. It is covered properly later in this track; mention it here because "should this be an API call at all?" is a question worth asking before choosing between the other three.

      ### Choosing

      Public API for third parties: REST, because the ecosystem cost dominates everything else. Browser or mobile client with rich, varied data needs and a dedicated frontend team: GraphQL, usually via a gateway in front of internal services. Internal service-to-service on a hot path: gRPC. Work that outlives a request, or fan-out to many consumers: events. Webhooks are the fourth shape people forget — how *you* call *them*, and they come with their own delivery-guarantee problems.

      ### The mistakes people actually make

      Adopting GraphQL for a single first-party client and inheriting all its costs for none of its benefit. Calling something REST when it is really RPC with `POST /doThing` — which is fine, but then the HTTP semantics you assumed you were getting are not there. Exposing gRPC to browsers and discovering you need grpc-web plus a proxy. And running three styles over the same domain logic without a shared contract, so they drift and disagree.
