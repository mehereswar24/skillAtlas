  - slug: backend-schema-migrations
    name: "Schema Migrations Without Downtime"
    domain: backend
    est_hours: 7
    difficulty: advanced
    prerequisites:
      - backend-more-about-databases
    summary: |-
      Changing a live schema while old and new application code run side by side — the expand/contract discipline, and the DDL statements that quietly take a table-wide lock.
    content_md: |-
      Every schema change on a running system has a window during which two versions of your application are talking to one database: the old pods have not been drained, or the rollout is half done, or you need to be able to roll back. A migration that is only correct after every instance has restarted is a migration that causes an outage.

      ### Expand and contract

      The pattern that makes this tractable has three phases, deployed separately.

      **Expand.** Make an additive change that both old and new code tolerate. Add the new nullable column; create the new table; add the new index concurrently. Old code ignores it, new code can use it.

      **Migrate.** Deploy code that writes to both the old and new shape and reads from whichever is authoritative. Backfill existing rows in batches, not one giant `UPDATE` — a single statement touching ten million rows holds locks, generates enormous write-ahead log volume, and cannot be interrupted safely. Batch with a bounded loop, a small sleep, and a resumable cursor.

      **Contract.** Only once every reader and writer is on the new shape, and only once you are confident you will not roll back, drop the old column or constraint.

      Renaming a column in one step is the classic violation: for the duration of the rollout, half your instances reference a name that no longer exists. Rename by expand/contract instead — add, dual-write, backfill, switch reads, drop.

      ### The locks nobody expects

      DDL takes locks, and the level varies enormously by statement and by database version. In PostgreSQL, adding a nullable column with no default is effectively instant; adding a `NOT NULL` column with a non-volatile default is also fast on modern versions, but adding a `CHECK` constraint validates the whole table under an `ACCESS EXCLUSIVE` lock unless you add it `NOT VALID` and validate separately. `CREATE INDEX` locks out writes for the whole build; `CREATE INDEX CONCURRENTLY` does not, at the cost of two table passes and the possibility of leaving an invalid index behind if it fails.

      The genuinely dangerous interaction: an `ACCESS EXCLUSIVE` lock request **queues behind** any existing transaction on the table, and every subsequent query queues behind the lock request. One long-running `SELECT` plus one `ALTER TABLE` equals a total outage on that table. The mitigation is to set a short `lock_timeout` before DDL and retry, so the migration fails fast instead of forming a queue.

      ### Migrations as code

      Migrations belong in version control, run in a deterministic order, and are recorded in a table so each runs once. Prefer forward-only fixes to `down` migrations: rolling a schema backwards on live data usually loses information, and in practice the recovery from a bad migration is another migration, not a reversal. Run migrations as a separate step in the deploy pipeline rather than at application start-up, where a dozen instances would race to run them at once.

      ### The mistakes people actually make

      Deploying the migration and the code that needs it in the same release. Backfilling in one statement. Adding a foreign key to a huge table during peak hours. And testing migrations only against an empty development database, where every one of them is instant.
