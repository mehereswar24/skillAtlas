  - slug: backend-pick-a-backend-language
    name: "Choosing a Runtime, and Living With Its Trade-offs"
    domain: backend
    est_hours: 6
    difficulty: beginner
    prerequisites:
      - backend-server-side
    summary: |-
      Why the language choice is really a choice of concurrency model, memory behaviour, typing discipline and ecosystem — and why it matters less than people argue.
    content_md: |-
      Language debates consume enormous energy and decide very little. Every mainstream backend language can serve tens of thousands of requests per second on a modern machine, and essentially every performance problem in a real product is a database query, a network round trip or an algorithmic mistake — not the language. What the choice *does* determine is the shape of the problems you will have.

      ### The four axes that matter

      **Concurrency model.** Covered in the previous step, and it is the biggest real difference. Go and modern Java give you cheap lightweight threads with blocking-style code. Node.js and Python give you an event loop where a blocking call is a bug. Ruby and CPython have a global interpreter lock, meaning one process executes interpreted bytecode on one core, so you scale by running many processes — which multiplies memory and connection-pool usage in ways people forget to budget for.

      **Memory and start-up.** A garbage-collected runtime trades predictable latency for developer speed; GC pauses show up in your tail latency, not your average. The JVM and .NET have excellent sustained throughput and slower cold starts, which matters a great deal if you deploy to a scale-to-zero platform and not at all if you run long-lived containers. Go and Rust produce a single binary that starts instantly. Rust additionally removes an entire class of memory bugs at compile time, at the cost of a genuinely steep ownership model.

      **Typing.** Static types (Go, Java, C#, Rust, TypeScript, and Python with type hints checked by a tool) catch a category of refactoring mistake before runtime. Their real payoff arrives at the point where the codebase outgrows what one person keeps in their head, which is why so many large JavaScript and Python codebases eventually adopt TypeScript or a Python type checker.

      **Ecosystem for your problem.** Data science and ML tooling lives in Python. High-throughput infrastructure and CLI tooling gravitates to Go. Enterprise integrations, batch processing and mature ORMs are a Java and .NET strength. Full-stack teams with one language often pick TypeScript for the reduced context-switching. Pick where the libraries you need are already good.

      ### How to actually decide

      In order: what does the team already know well enough to debug at 3 a.m.; what does the problem domain's ecosystem favour; what is the concurrency shape of the workload (many idle connections, or CPU-bound work); and only then, preference. A team fluent in a "worse" language will out-ship a team learning a "better" one.

      ### The mistakes people actually make

      Choosing on benchmark numbers that measure a hello-world loop no real service resembles. Introducing a second backend language for one service and permanently doubling the build, deploy, monitoring and on-call surface. And, most commonly, blaming the language for a latency problem that a missing index would have fixed.
