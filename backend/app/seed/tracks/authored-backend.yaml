  - slug: backend-frontend-basics
    name: "The Client Side of Your Contract"
    domain: backend
    est_hours: 6
    difficulty: beginner
    prerequisites:
      - backend-learn-about-apis
    summary: |-
      What the browser does with your response — CORS, cookies, CSRF, client-side state and caching — so that the API you design is one a frontend can actually consume.
    content_md: |-
      A backend engineer does not need to write CSS. They do need to know what happens after their JSON leaves the building, because a surprising share of "backend bugs" are really contract mismatches with the browser's own rules.

      ### The same-origin policy and CORS

      Browsers isolate origins — scheme, host and port together. Script on `https://app.example.com` may send a request to `https://api.example.com`, but it may not *read* the response unless the server opts in with CORS headers. For anything beyond a short list of "simple" requests — a custom header, a JSON content type, a method other than `GET`/`POST`/`HEAD` — the browser first sends an `OPTIONS` **preflight** and only proceeds if the response permits the method, headers and origin. This is why your endpoint works in `curl` and fails in the browser: `curl` is not enforcing a policy that exists to protect users.

      Two rules save hours. `Access-Control-Allow-Origin: *` cannot be combined with credentials; if the frontend sends cookies, you must echo the specific origin and set `Access-Control-Allow-Credentials: true`. And reflecting whatever `Origin` the request carried, unvalidated, is not "fixing CORS" — it is disabling the protection.

      ### Cookies, tokens and CSRF

      Cookies are attached by the browser automatically to matching requests, which is convenient and is exactly the property CSRF exploits: a malicious page can cause the user's browser to issue an authenticated request to your API. Defences, in combination: `SameSite=Lax` or `Strict` so cookies are not sent on cross-site requests; `HttpOnly` so script cannot read the session cookie, which limits what an XSS bug can steal; `Secure` so it never travels over plain HTTP; and, for state-changing endpoints, an anti-CSRF token or a strict origin check. Tokens held in memory or in a header are not sent automatically and so are not CSRF-prone — but tokens in `localStorage` are readable by any script that gets injected, which trades one attack for another.

      ### State on the client

      A frontend is a cache of your data with a user interacting with it, and it typically holds server state in a store: one source of truth, immutable updates, and subscribers that re-render when the slice they read changes. Knowing this shapes your API. Return the updated entity from a mutation, so the client does not need a follow-up `GET`. Give every entity a stable identifier so the client can normalise and deduplicate it. Keep response shapes consistent — a field that is sometimes an object and sometimes an id forces branching in every consumer. And return list results in a predictable envelope with pagination information, because the client is building an infinite scroll on top of it.

      ### Rendering models change what the API needs

      Server-rendered pages, single-page applications and the hybrid server-component approaches place different demands on you: an SPA needs many small endpoints and cares about round trips; server rendering happens on a machine you control, in a data centre next to your API, so latency matters less but reliability matters more, because a failing API means a failing page rather than a spinner.

      ### The mistakes people actually make

      Fixing preflight failures by allowing all origins with credentials. Putting a session token in `localStorage` without thinking about XSS. Returning `204 No Content` from an update and forcing a refetch. Returning timestamps in local time or in inconsistent formats. And changing a field from a string to an object "because it is only an internal client" — there is no such thing once the app is installed on someone's phone.
