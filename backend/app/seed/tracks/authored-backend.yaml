  - slug: backend-testing
    name: "Testing a Service You Cannot Fully Control"
    domain: backend
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - backend-applications
    summary: |-
      Building a suite that is fast enough to run on every change and honest enough to be believed — fakes versus mocks, real databases in tests, and how flakiness destroys the whole thing.
    content_md: |-
      A test suite is not there to raise a coverage number. It is there so that a change can be made confidently by someone who did not write the original code. Every decision below follows from that.

      ### The layers, and what each is for

      **Unit tests** exercise one piece of logic with no I/O. They run in milliseconds, so you can have thousands, and they should target the domain layer — the rules — which is precisely why keeping I/O at the edges pays off here. A unit test that needs six mocks is telling you the unit has too many collaborators.

      **Integration tests** exercise your code against the real things it talks to: an actual database, an actual cache. These catch what unit tests structurally cannot — a wrong SQL query, a migration that does not apply, a transaction boundary in the wrong place, a serialiser that drops a field. Tools like Testcontainers make running a real PostgreSQL per test session routine, and it is worth it: a mocked database proves only that your mock matches your assumptions.

      **End-to-end tests** drive the whole system as a user or client would. They find integration mistakes nothing else can, and they are slow, brittle and expensive, so keep a handful covering the paths that must never break, not a hundred covering everything.

      The classic pyramid says many unit, fewer integration, few end-to-end. The "testing trophy" argues for a fatter integration layer, and for most backend services that is the better shape, because the interesting bugs are at boundaries. Either way the constraint is the same: the suite must run fast enough that people run it.

      ### Test doubles, chosen deliberately

      A **fake** is a working implementation with shortcuts — an in-memory repository, a local file store. A **stub** returns canned answers. A **mock** additionally asserts it was called in a particular way. Prefer fakes and stubs; mocks that assert on interactions couple the test to the implementation, so a harmless refactor breaks fifty tests and the suite becomes a tax rather than a safety net.

      For third-party HTTP, do not mock your own client wrapper — that tests nothing. Intercept at the HTTP layer with recorded or hand-written responses, and include the failure cases you actually need to handle: timeouts, `500`s, malformed bodies, `429`s. Then use **contract tests** to check that your recorded expectations still match the real provider, which is the gap consumer-driven contract testing exists to close.

      ### Determinism is the whole game

      A flaky test is worse than no test, because it trains the team to re-run and ignore. The usual causes are few and fixable. **Time**: inject a clock rather than calling the system clock, or tests fail at midnight and on leap days. **Randomness**: seed it. **Ordering**: never let tests depend on execution order or share mutable state; roll back or truncate between tests. **Concurrency and sleeps**: `sleep(0.5)` is a race waiting to lose on a loaded CI machine — wait for a condition instead. **External networks**: a test that hits the real internet fails when someone else's site is down.

      ### What to actually assert

      Test behaviour at the boundary, not internals. Cover the edges deliberately: empty collections, one element, maximum size, unicode, nulls, negative numbers, and concurrent callers. Property-based testing generates these for you and is startlingly effective on parsers, serialisers and anything with an invariant. And write the regression test *before* the fix for every production bug — that is the only test you can be certain would have caught something real.

      Coverage is a weak signal. It tells you which lines ran, not whether any assertion would fail if the behaviour changed. High coverage with no assertions is common and worthless; mutation testing measures the real thing.

      ### The mistakes people actually make

      Mocking the database and shipping a broken query. Sharing one database that accumulates state across the suite. Testing getters. Writing tests that restate the implementation line for line, so they can never fail for a good reason. And letting the suite take forty minutes, at which point people stop running it locally and CI becomes the only feedback.
