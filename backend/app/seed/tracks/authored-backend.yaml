  - slug: backend-building-ai-powered-features
    name: "Retrieval, Tools and Evaluating a Non-Deterministic Feature"
    domain: backend
    est_hours: 9
    difficulty: advanced
    prerequisites:
      - backend-ai-providers
      - backend-search-engines
    summary: |-
      Grounding a model in your own data, letting it call your code safely, and building the evaluation harness without which you cannot tell whether a change made things better.
    content_md: |-
      Once the plumbing works, the engineering problem becomes: how do you make the feature reliably useful, and how do you know when you have made it worse?

      ### Retrieval-augmented generation, mechanically

      Models do not know your data and will confidently invent it. Retrieval fixes this by finding relevant text at request time and putting it in the prompt with an instruction to answer only from it. The pipeline has four stages, and each is a place where quality is won or lost.

      **Chunking.** Documents are split into passages. Chunks that are too large dilute relevance and waste tokens; too small and they lose the context that makes them meaningful. Split on structure — headings, sections, paragraphs — rather than a fixed character count, and keep a little overlap so a sentence spanning a boundary is not orphaned. Carry metadata (source, title, section, permissions, updated date) on every chunk; you will need it for filtering and for citations.

      **Embedding and indexing.** Each chunk becomes a vector; a vector index (pgvector, or a dedicated store) finds nearest neighbours by cosine similarity. Note that the whole index is tied to one embedding model — changing models means re-embedding everything, so treat the model version as part of the index's identity.

      **Retrieval.** Pure vector search is good at paraphrase and bad at exact terms, identifiers, names and numbers, where classic BM25 wins. **Hybrid search** — run both, fuse the rankings — is meaningfully better than either, which is why the full-text search concept earlier in this track is a genuine prerequisite. Reranking the top candidates with a cross-encoder improves precision further. Apply the user's access permissions **as a filter during retrieval**, never afterwards: a chunk the user may not see must not enter the prompt at all.

      **Generation.** Instruct the model to answer only from the supplied context, to say when it cannot, and to cite the chunks used — citations are the only affordance that lets a user verify an answer, and they change the product from "trust me" to "check me."

      ### Tool calling, and the security boundary

      Giving a model the ability to call your functions is what turns it from a text generator into an agent. The correct mental model is that **the model is an untrusted client**. Its tool calls come, transitively, from user input; therefore every call must pass the same validation and the same authorisation you would apply to a public API request, executed under the *user's* permissions and never the service's. This is what makes prompt injection a manageable risk rather than a catastrophic one: text retrieved from a document or a web page can and will contain instructions, and no amount of prompt wording reliably prevents the model from following them. The defence is architectural — least privilege, allowlisted actions, validated arguments, and a human confirmation step before anything destructive, irreversible or costly.

      ### Evaluation

      This is the discipline that separates a demo from a product. Build a dataset of representative inputs with expected properties, and run it on every change to prompts, models, retrieval parameters or chunking. Measure retrieval separately from generation — recall of the correct chunks in the top *k* is a clean, cheap, deterministic metric, and most quality problems turn out to live there rather than in the model. For generation, combine automatic checks (does it cite a real source, is the JSON valid, does it contain the required fact) with a model-graded rubric and a small amount of human review on a sample. Log real interactions with feedback so your evaluation set grows from actual failures.

      Ship behind a flag, to a small percentage, with latency, cost and quality dashboards, and be prepared to turn it off.

      ### The mistakes people actually make

      Chunking on character counts. Retrieving five chunks when the answer needs twelve, or fifty when the model then ignores the middle. Evaluating by trying three prompts by hand. Treating tool calls as trusted. Ignoring the "no relevant content found" path, so the model answers anyway. And putting no guardrail on cost, so a retry loop over a long context becomes an incident.
    resources:
      - kind: article
        title: "Lewis et al.: Retrieval-Augmented Generation (arXiv)"
        url: "https://arxiv.org/abs/2005.11401"
