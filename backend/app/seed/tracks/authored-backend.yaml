  - slug: backend-ci-cd
    name: "Continuous Integration and Deployments You Can Undo"
    domain: backend
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - backend-testing
      - backend-repo-hosting-services
    summary: |-
      A pipeline that gives fast, trustworthy feedback, and release strategies — canary, blue-green, feature flags — that make deploying boring.
    content_md: |-
      Continuous integration means everyone's work is merged and verified against the trunk many times a day. Continuous delivery means the trunk is always in a releasable state. Continuous deployment means it actually goes out automatically. The three are usually conflated and the distinction matters, because most teams should reach the second before attempting the third.

      ### The pipeline

      Order the stages by how quickly they can say "no": lint and format, type check, unit tests, build, integration tests, security scan, then deploy. Each is a gate, and failing fast saves everyone's time. The two properties that decide whether the pipeline is loved or bypassed are **speed** and **trust**. Under about ten minutes, people wait for it; beyond that, they context-switch and the feedback loop breaks. Caching dependencies and build layers, splitting tests across parallel runners, and only running expensive stages where they are relevant are the usual levers.

      Trust is destroyed by flakiness. A red build that turns green on re-run teaches everyone to hit re-run, and from then on the pipeline signals nothing. Quarantine flaky tests immediately and fix them as real bugs, because they usually are.

      **Build once, deploy many.** The artefact — a container image, a jar, a binary — is built one time and promoted through environments unchanged, configured from outside. If staging and production build separately, you have tested something you are not shipping.

      ### Getting it out safely

      **Rolling** replaces instances gradually; simple and the default in most orchestrators, but for a while both versions run, so your code and your database schema must tolerate that — which is why the expand/contract migration discipline is a prerequisite for safe deploys, not an optional nicety.

      **Blue-green** runs two full environments and switches traffic at the load balancer. Rollback is instantaneous, and you pay for double capacity during the switch.

      **Canary** sends a small percentage of traffic to the new version and watches error rate and latency before proceeding. This is the strongest technique available, because it catches problems that only real traffic reveals — but only if it is automated against real metrics, with an automatic abort. A canary a human is supposed to watch is a canary nobody watches.

      **Feature flags** decouple deploying code from releasing behaviour. Ship the code dark, turn it on for internal users, then a percentage, then everyone; turn it off in seconds if something breaks, without a deploy. The discipline that keeps this from becoming a swamp is a removal policy — every flag gets an owner and an expiry, or you will accumulate hundreds of interacting conditionals nobody dares delete.

      ### Migrations in a deploy

      Run them as an explicit pipeline step before the new code rolls out, never at application start-up where every replica races. Because the migration and the code deploy separately, every migration must be compatible with both the old and new code for the duration of the rollout.

      ### Measure the thing that matters

      The DORA metrics — deployment frequency, lead time for changes, change failure rate, and time to restore service — are the useful summary, and the counter-intuitive finding of that research is that deploying more often correlates with *higher* stability, because each release is smaller and easier to diagnose.

      ### The mistakes people actually make

      Storing deploy credentials as plain repository secrets available to pull requests from forks. Having no tested rollback, so the recovery plan is "fix forward" under pressure. Deploying on Friday afternoon with nobody around. Coupling a database migration and the code that requires it into one release. And running a pipeline that is green while the deploy is broken, because nothing verifies the deployed thing actually serves traffic.
