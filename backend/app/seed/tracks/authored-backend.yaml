  - slug: backend-advanced-backend
    name: "Observability: Logs, Metrics, Traces and What to Alert On"
    domain: backend
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - backend-container-orchestration
    summary: |-
      Instrumenting a service so that a question you did not anticipate can still be answered at 3 a.m. — and alerting on symptoms users feel rather than on causes you guessed.
    content_md: |-
      Monitoring answers questions you thought of in advance. Observability is the property of being able to answer ones you did not. The difference matters because production failures are, almost by definition, the ones nobody predicted.

      ### Three signals, three jobs

      **Logs** are discrete events with context. Make them **structured** — JSON with fields, not interpolated prose — so they can be filtered and aggregated rather than grepped. Every log line from a request should carry the same **correlation id**, propagated to downstream services, so one user's journey through five services is a single query. Log at the boundaries (request received, external call made, job completed) and at decisions, not at every line. And never log secrets, tokens, full request bodies or personal data; redact at the serialiser.

      **Metrics** are cheap numeric aggregates over time. Cheap enough to record for every request, which is exactly what logs are not. Two useful frameworks: **RED** for request-driven services (Rate, Errors, Duration) and **USE** for resources (Utilisation, Saturation, Errors). Record durations as **histograms**, not averages: an average latency of 200 ms is compatible with 5% of users waiting four seconds, and it is the 5% who churn. Watch **cardinality** — a label containing a user id, a request id or a raw URL path multiplies your time series until the metrics system falls over, which is the single most common self-inflicted observability outage.

      **Traces** connect the work of one request across services. Each operation is a span with a start, a duration, attributes and a parent; together they form a tree showing exactly where the time went and which call failed. Context propagates over the wire via the W3C `traceparent` header. Tracing is what converts "the checkout is slow" from a day of guessing into a five-minute answer. Sampling keeps the cost down — head-based sampling is simple; tail-based sampling, which decides after seeing the whole trace, lets you keep all the errors and slow requests, which are the ones you want.

      **OpenTelemetry** is the vendor-neutral standard covering all three, and instrumenting against it rather than a vendor SDK means changing backends later is a configuration change rather than a rewrite.

      ### Alerting

      The rule that reduces pager fatigue more than any other: **alert on symptoms, not causes.** Users do not care that CPU is at 90%; they care that requests fail or are slow. Define **service level objectives** — "99.9% of checkout requests succeed in under 500 ms over 30 days" — and alert on the **error budget burn rate**, which naturally distinguishes a sudden severe outage (page now) from a slow drift (a ticket). Every page should be urgent, actionable and about something a human can fix; anything else belongs on a dashboard or in a ticket. Alerts that fire regularly and get ignored are worse than no alerts, because they train the ignoring.

      ### Making it usable in an incident

      Instrumentation is not enough if nobody can navigate it. A useful setup lets you go from an alert to the affected service's dashboard, from there to exemplar traces of failing requests, and from a trace to the logs of that specific request. Wire those links up before you need them. Version and deploy markers on dashboards answer "did this start with a deploy?" instantly, which is the correct first question in most incidents.

      ### The mistakes people actually make

      Logging everything at `INFO` and paying more for logs than for compute. Averages instead of percentiles. Unbounded label cardinality. Alerting on every resource threshold and then muting the channel. Adding tracing to one service only, which produces a tree with one node. And having no way to correlate a customer's report with any of it, because no request id ever reaches the user-facing error message.
