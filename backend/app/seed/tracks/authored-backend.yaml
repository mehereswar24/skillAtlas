  - slug: backend-relational-databases
    name: "Relational Modelling and SQL That Uses Its Indexes"
    domain: backend
    est_hours: 14
    difficulty: intermediate
    prerequisites:
      - backend-introduction
    summary: |-
      Designing a schema that makes wrong states unrepresentable, and writing queries the planner can answer with an index instead of a full scan.
    content_md: |-
      The relational database is the most important piece of technology in this track. Frameworks come and go; a schema outlives them all, and a bad one taxes every feature built on top of it for years. This is also where most "backend performance" problems really live.

      ### Modelling: constraints are the product

      A table is a set of rows; a **primary key** is what makes a row identifiable; a **foreign key** is a promise, enforced by the database, that a reference points at something real. `NOT NULL`, `UNIQUE` and `CHECK` constraints are not bureaucracy — they are the only guarantees that survive a buggy deploy, a manual fix, a background job and a second service all writing to the same table. Application-level validation is a courtesy to the user; database constraints are the truth.

      Normalisation is the discipline of storing each fact exactly once. First normal form: no repeating groups or comma-separated lists in a column. Second and third: every non-key column depends on the whole key and nothing but the key. The practical payoff is that an update touches one row, so contradictory data becomes impossible rather than merely unlikely. Denormalise later, deliberately, with a measurement in hand — and know that when you do, you have taken on the job of keeping the copies in sync.

      ### Indexes and why your query is slow

      A B-tree index is a sorted structure that lets the database find matching rows without reading the whole table. Understanding four properties covers most cases. **Order matters** in a composite index: an index on `(tenant_id, created_at)` serves a filter on `tenant_id` and a filter on both, but not a filter on `created_at` alone. **Selectivity matters**: an index on a boolean column that is `true` for 90% of rows will be ignored, correctly, because a sequential scan is cheaper. **Functions defeat indexes**: `WHERE lower(email) = ?` cannot use a plain index on `email`; you need an expression index or a stored normalised column. And **leading wildcards defeat them too**: `LIKE '%smith%'` cannot use a B-tree, which is why full-text search exists as a separate topic later in this track.

      Every index also costs write throughput and disk, because each insert, update and delete must maintain it. Indexes are not free, and a table with fifteen of them is a table nobody profiled.

      ### Read the plan

      `EXPLAIN` (and `EXPLAIN ANALYZE`, which actually runs the query and reports real timings and row counts) is the single highest-leverage skill in this concept. You are looking for three things: a sequential scan on a large table where you expected an index scan; an estimated row count wildly different from the actual, which means the planner's statistics are stale or your predicate is not what you think; and a nested-loop join executing thousands of times.

      ### The N+1 problem

      The most common performance bug in every ORM-using codebase: you fetch a list of 100 orders, then loop over them accessing `order.customer`, and issue 100 more queries. Each is fast; together they are 101 round trips. The fix is to say up front that you need the related data — a join, or the ORM's eager-loading directive. Detect it by logging query counts per request in development and failing a test when the count exceeds a threshold, because it will silently reappear the moment someone adds a field to a serialiser.

      ### The mistakes people actually make

      Storing money in a float. Storing timestamps without a time zone, or in local time. Using `SELECT *` in application code so a new column silently changes payload sizes and breaks assumptions. Building pagination on `OFFSET` for deep pages, which forces the database to read and discard everything before the offset. And letting the ORM be the only mental model, so nobody on the team can read a query plan when it matters.
