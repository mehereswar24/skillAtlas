  - slug: backend-hashing-algorithms
    name: "Hashing: Passwords, Integrity and Identity"
    domain: backend
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - backend-learn-the-basics
    summary: |-
      Why a password hash must be slow while a checksum must be fast, what a salt does that a pepper does not, and where HMAC and content hashes belong.
    content_md: |-
      "Hashing" covers several jobs with genuinely opposite requirements, and using the algorithm for one job to do another is the single most common security mistake in backend code.

      ### Password storage: slow on purpose

      A password hash exists to make offline brute force expensive after your database leaks. SHA-256 is therefore exactly the wrong choice: it is fast, and commodity hardware computes billions per second. Use a **password hashing function** designed to be tunably slow and, ideally, memory-hard: **Argon2id** is the current first choice, **scrypt** and **bcrypt** remain acceptable, and PBKDF2 is the option when a compliance regime demands it. Tune the cost parameters to the slowest hardware you must support — a common target is on the order of a few hundred milliseconds per hash — and revisit them as hardware improves.

      A **salt** is a unique random value stored alongside each hash. It does not make any single password harder to crack; it makes attackers crack each one separately, defeating precomputed rainbow tables and hiding the fact that two users chose the same password. Modern password-hashing libraries generate and embed the salt for you, and you should let them — a hand-rolled salt scheme is a reliable source of bugs. A **pepper** is a secret value, identical for all users, mixed in and stored outside the database (in a secret manager or an HSM), so that a database-only leak yields hashes nobody can attack. It is a genuine defence-in-depth measure, and it complicates rotation, so decide deliberately.

      Two implementation details matter as much as the algorithm. Compare using a **constant-time** comparison, because a byte-by-byte early return leaks information through timing. And store the algorithm and parameters *with* the hash — every serious library's output format already does — so you can upgrade cost factors by rehashing on next successful login.

      ### Integrity: fast on purpose

      For checksums, deduplication, cache keys, content addressing and ETags, you want speed and collision resistance, not slowness. SHA-256 is the safe default; BLAKE3 and xxHash are much faster where you do not need cryptographic strength (cache keys, shard selection). MD5 and SHA-1 are broken for anything adversarial: practical collisions exist, so they must not be used for signatures or to prove a file has not been tampered with. They remain merely unfashionable for non-adversarial checksums.

      ### Authenticating a message: HMAC

      A plain hash of `secret + message` is not a secure authentication tag — length-extension attacks defeat the naive construction. **HMAC** is the correct construction, and it is what webhook signatures, signed URLs and signed cookies use. Verify HMACs in constant time too, and include a timestamp inside the signed payload with a short acceptance window, or an attacker can replay a valid old request forever.

      ### The hash that spreads load

      **Consistent hashing** solves a different problem: mapping keys to a changing set of nodes so that adding or removing one node relocates roughly `1/n` of the keys instead of nearly all of them. It underpins distributed caches, sharded stores and load balancers with session affinity. Virtual nodes are the standard refinement, because without them the distribution across a small ring is badly uneven.

      ### The mistakes people actually make

      Hashing passwords with SHA-256 and a salt and believing that is sufficient. Reusing one salt for every user. Encrypting passwords instead of hashing them, which means a key leak reveals every plaintext. Comparing signatures with `==`. And putting sensitive data in a URL that is then hashed into an ETag or a log line.
