  - slug: backend-nosql-databases
    name: "When a Relational Database Is the Wrong Tool"
    domain: backend
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - backend-relational-databases
    summary: |-
      Document, key-value, wide-column, time-series and graph stores: what each one gives up to get what it gives you, and the honest version of "eventual consistency."
    content_md: |-
      "NoSQL" names an absence, not a category, which is why the term is so unhelpful. The useful question is: what does this store make cheap, and what does it make impossible?

      ### The families

      **Key-value** (Redis, DynamoDB in its simplest form, etcd). Get and put by exact key, extremely fast, trivially partitionable because the key determines the shard. You give up querying by anything other than the key. Excellent for caches, sessions, rate-limit counters, feature flags and leaderboards.

      **Document** (MongoDB, Couchbase, and PostgreSQL's `jsonb`, which is why this is not really a database-choice question any more). Stores nested JSON-ish documents; a whole aggregate is read and written in one operation with no joins. Good when data is genuinely hierarchical, when the shape varies between records, or when the read pattern is "fetch this entire object." The cost is that relationships must be maintained by the application, and that a schema still exists — it has just moved from the database into every piece of code that reads the documents, where nothing enforces it.

      **Wide-column** (Cassandra, ScyllaDB, HBase, Bigtable). Rows partitioned by a partition key and sorted within it by a clustering key. Enormous write throughput and linear scale-out. The design discipline is inverted: you model tables per query, duplicating data across several tables, because there are no joins and no ad-hoc queries. Choosing a partition key that concentrates traffic creates a hot partition, and there is no fixing it later without rewriting the data.

      **Time-series** (TimescaleDB, InfluxDB, Prometheus). Append-heavy, time-ordered, aggregate-on-read, with retention and downsampling built in. Metrics and IoT telemetry fit this shape and fit a general-purpose relational schema badly.

      **Graph** (Neo4j, and increasingly SQL recursive CTEs). Worth it when traversals of arbitrary depth are the primary query — recommendation, fraud rings, permission inheritance — and unnecessary when your "graph" is two joins deep.

      ### Consistency, stated honestly

      CAP says that when the network partitions, a distributed store must choose between remaining available and remaining consistent. It says nothing about the far more common case where the network is fine, which PACELC adds: even without a partition there is a latency-versus-consistency trade. **Eventual consistency** means replicas converge if writes stop, and its practical consequence is the one that catches teams out: a user writes and then immediately reads, hits a lagging replica, and sees their own change missing. Many stores offer tunable consistency per operation (a quorum read, a strongly-consistent read, or read-your-writes routing) — but the strong option costs latency, so it is a decision, not a default.

      ### How to choose

      Start relational unless you have a specific reason not to. Modern PostgreSQL covers documents (`jsonb`), key-value, full-text search, time series and geospatial adequately, and one operational surface is dramatically cheaper than five. Add a specialised store when you can name the property you need that Postgres cannot give you at your scale — and expect to then own the dual-write consistency problem between them.

      ### The mistakes people actually make

      Choosing a document store to "avoid migrations," and discovering that a schema you do not declare is a schema you migrate at read time, forever, in application code. Treating a cache as a database. Running a distributed database as a single node and getting all of the modelling constraints with none of the scale benefits. And adopting eventual consistency without ever deciding what the user should see immediately after they press save.
