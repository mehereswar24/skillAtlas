  - slug: backend-click-to-visit-the-roadmap
    name: "Reading Other People's Systems"
    domain: backend
    est_hours: 4
    difficulty: intermediate
    prerequisites:
      - backend-building-for-scale
    summary: |-
      The habit that keeps a backend engineer improving after the syllabus runs out: reading specifications, source code and public postmortems, and stealing the reasoning rather than the conclusion.
    content_md: |-
      Everything in this track will be partly obsolete in five years. The skill that will not be is the ability to answer a question from a primary source instead of from a summary of a summary.

      ### Read the specification

      RFCs are more readable than their reputation suggests, and they answer questions no blog post will. When you need to know whether a `PUT` may return a body, what a proxy is permitted to do with an unknown header, or what exactly `Cache-Control: no-cache` means (it does not mean "do not cache"), the answer is in RFC 9110 or 9111 and it is unambiguous. The same applies to your database's manual, which is written by the people who wrote the code, and to the release notes of every dependency you upgrade. The habit worth building is: when you find yourself guessing about behaviour, spend four minutes finding the normative statement instead of ten minutes testing it empirically and drawing the wrong general conclusion.

      ### Read the source

      Your dependencies are open, and reading them is the fastest way past a confusing behaviour. Start at the entry point you call, follow it down one level at a time, and skim rather than trying to understand everything. Two specific habits pay off immediately: reading a library's tests, which are a specification of what it promises and often clearer than its documentation; and reading the issue tracker before adopting anything, because the open issues tell you what it is actually like to live with.

      ### Read postmortems

      Public incident write-ups from companies operating at scale are the closest thing our field has to case law. They are valuable because they describe failures that only appear at a scale you have not reached, and because the interesting content is never the root cause but the chain: which safeguard was missing, which alert did not fire, why the obvious fix made things worse, how long detection took and why. Read enough of them and you develop an instinct for the failure modes in this track — the retry storm, the cache stampede, the health check that evicted everything, the migration that locked a table, the config change deployed everywhere at once.

      ### Steal the reasoning, not the conclusion

      Engineering blogs from large companies describe solutions to problems of a scale most systems never reach. The mistake is to copy the architecture; the value is in the constraints they state and the alternatives they rejected. "We sharded because a single writer could not absorb our write volume" is a lesson. "Shard your database" is not. When you read a design, extract three things: what forced the decision, what it cost them, and what they would need to have been true to make the simpler option work.

      ### Build the smallest version yourself

      The final comprehension technique is to reimplement a tiny version of something you use: a router, a connection pool, a job queue, a cache with TTL, a rate limiter. A weekend of that teaches more about the real thing than a month of reading, and it converts a black box into something whose failure modes you can predict.

      ### The mistakes people actually make

      Treating the top search result as authoritative and never checking a version. Learning frameworks instead of the protocols and databases underneath them, so the knowledge expires with the framework. Copying an architecture from a company two orders of magnitude larger. And never writing anything down — the fastest way to find out whether you understand something is to have to explain it.
