track:
  slug: uiux-designer
  title: Learn UI/UX Design
  domain: uiux
  target_role: Product Designer
  difficulty: beginner
  description: >-
    Design products people can actually use: research that changes decisions,
    interaction and information architecture, visual craft and design systems,
    and prototyping and testing in Figma.

concepts:
  - slug: web-accessibility

  - slug: ux-research
    name: UX Research
    domain: uiux
    est_hours: 30
    difficulty: beginner
    prerequisites: []
    summary: >-
      Finding out what people actually need — interviews, usability testing and
      the biases that make research produce the answer you wanted.
    content_md: |
      Research exists to change decisions. If a study could not have changed
      what you were going to build, it was theatre.

      **Generative versus evaluative.** Generative research (interviews,
      contextual inquiry, diary studies) tells you what problem to solve.
      Evaluative research (usability testing, surveys, analytics) tells you
      whether your solution works. Teams routinely skip the first and are then
      surprised that a well-tested design solves nothing.

      **Interview technique.** Ask about specific past behaviour — "walk me
      through the last time you did this" — not hypothetical futures. People are
      poor predictors of their own behaviour and excellent reporters of it.
      Never ask "would you use this?"; the answer is always yes and it means
      nothing.

      **Usability testing.** Five participants find most severe issues. Give
      tasks, not instructions. Then be quiet: the urge to help is the single
      biggest source of contaminated results.

      **Watch for bias.** Leading questions, confirmation bias, and survivorship
      — the people you can reach are the ones who stayed.
    resources:
      - kind: doc
        title: "Nielsen Norman Group — UX research articles"
        url: https://www.nngroup.com/topic/user-research/
        provider: NN/g
        duration_min: 300
      - kind: book
        title: "Don't Make Me Think"
        url: https://www.oreilly.com/library/view/dont-make-me/9780321965516/
        provider: Steve Krug
        is_free: false
        duration_min: 300
      - kind: article
        title: "Why you only need to test with 5 users"
        url: https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/
        provider: NN/g
        duration_min: 15
    quiz:
      - prompt: Why is "would you use this feature?" a bad interview question?
        explanation: It asks people to predict their own future behaviour, which they do badly, and social pressure pushes the answer to yes.
        options:
          - text: "People predict their own behaviour poorly and tend to say yes to be agreeable"
            correct: true
          - text: "It takes too long to answer"
          - text: "It cannot be quantified"
          - text: "It is only valid in surveys"
      - prompt: During a usability test the participant is stuck. What should you do?
        explanation: Stay quiet and observe. Helping destroys the very data you are collecting.
        options:
          - text: "Wait, observe, and note where they got stuck"
            correct: true
          - text: "Show them where to click"
          - text: "End the session"
          - text: "Explain the design rationale"
      - prompt: Which type of research tells you *what* to build?
        explanation: Generative research uncovers needs and problems; evaluative research checks a proposed solution.
        options:
          - text: "Generative research such as interviews and contextual inquiry"
            correct: true
          - text: "Usability testing"
          - text: "A/B testing"
          - text: "Analytics dashboards"
    interview:
      - question: Stakeholders are convinced they know what users want. How do you introduce research?
        difficulty: medium
        answer_md: |
          Do not fight the belief; test it cheaply. Propose a small study framed
          around the decision they are about to make — five usability sessions,
          or ten interviews — and agree in advance what result would change the
          plan. Invite them to watch a session live; watching one real person
          struggle changes minds faster than any report. Then present findings as
          evidence tied to decisions and cost, not as an opinion competing with
          theirs.

  - slug: interaction-design
    name: Interaction & Information Architecture
    domain: uiux
    est_hours: 30
    difficulty: intermediate
    prerequisites:
      - ux-research
    summary: >-
      Structure, flows, affordances and feedback — the decisions that determine
      whether a product is learnable.
    content_md: |
      Interaction design is about the conversation between a person and a
      system: what they can do, how they know they can do it, and what happens
      when they do.

      **Information architecture** is the skeleton. How content is grouped,
      labelled and navigated decides whether people can find anything. Card
      sorting and tree testing are cheap and reveal that your mental model is not
      theirs.

      **Affordance and signifier.** An affordance is what an object allows; a
      signifier is the visible clue that it does. A flat rectangle affords
      clicking but signifies nothing — which is why an entire generation of
      interfaces became hard to use.

      **Feedback and state.** Every action needs an immediate response.
      Interfaces have more states than the happy path: empty, loading, partial,
      error, offline, too-much-data, permission-denied. Designing only the
      populated state is the most common gap between a portfolio piece and a real
      product.

      **Reduce load.** Recognition beats recall. Sensible defaults beat
      configuration. Progressive disclosure beats a wall of options. And an
      undo is almost always better than a confirmation dialogue.

      **Follow convention** unless you have a strong, tested reason. Novelty in
      navigation is a cost paid by every user forever.
    resources:
      - kind: book
        title: "The Design of Everyday Things"
        url: https://www.oreilly.com/library/view/the-design-of/9780465050659/
        provider: Don Norman
        is_free: false
        duration_min: 600
      - kind: doc
        title: "Nielsen's 10 usability heuristics"
        url: https://www.nngroup.com/articles/ten-usability-heuristics/
        provider: NN/g
        duration_min: 30
      - kind: doc
        title: "Laws of UX"
        url: https://lawsofux.com/
        provider: Jon Yablonski
        duration_min: 60
    quiz:
      - prompt: What is the difference between an affordance and a signifier?
        explanation: The affordance is the possible action; the signifier is the perceivable cue that communicates it.
        options:
          - text: "An affordance is what is possible; a signifier is the visible cue that it is possible"
            correct: true
          - text: "They are the same"
          - text: "A signifier is a colour and an affordance is a shape"
          - text: "Affordances only apply to physical objects"
      - prompt: Which interface state is most often forgotten in design work?
        explanation: The empty state — the first thing a brand-new user sees, and the one no populated mockup shows.
        options:
          - text: "The empty state"
            correct: true
          - text: "The success state"
          - text: "The hover state"
          - text: "The default state"
      - prompt: Generally preferable to a destructive-action confirmation dialogue:
        explanation: Undo lets the common case stay fast while still protecting against mistakes; confirmations get dismissed reflexively.
        options:
          - text: "Performing the action immediately with a clear undo"
            correct: true
          - text: "Two confirmation dialogues"
          - text: "Disabling the action"
          - text: "A typed confirmation for every action"
    interview:
      - question: How would you improve a checkout flow with a 60% abandonment rate?
        difficulty: hard
        answer_md: |
          Instrument first: find which step loses people, and whether it differs
          by device. The usual culprits are forced account creation, unexpected
          costs appearing late, a long single-page form, unclear error handling
          on payment, and no visible progress. Fixes in order of typical impact:
          guest checkout, show total cost including shipping up front, break the
          form into short labelled steps with progress, autofill and correct
          input types on mobile, inline validation with recoverable errors, and
          trust signals near payment. Then test the revised flow with five users
          and A/B the change rather than assuming.

  - slug: design-systems-and-figma
    name: Visual Craft & Design Systems
    domain: uiux
    est_hours: 35
    difficulty: intermediate
    prerequisites:
      - interaction-design
    summary: >-
      Typography, spacing, colour and hierarchy — then turning those decisions
      into a reusable system in Figma.
    content_md: |
      Visual design is not decoration; it is how hierarchy and meaning are
      communicated before anyone reads a word.

      **Typography carries most of the weight.** A limited type scale, generous
      line height (around 1.5 for body), and a measure of 45-75 characters do
      more for a design than any other single choice. Two typefaces is plenty.

      **Space is structure.** Use a consistent scale (4 or 8px steps) and
      remember proximity: related things sit close together, unrelated things do
      not. Most amateur layouts fail on inconsistent spacing rather than bad
      colour.

      **Colour needs a system.** One accent used consistently for action, a
      neutral ramp for everything else, and semantic colours for success, warning
      and danger. Check contrast against WCAG, and never encode meaning in colour
      alone.

      **Hierarchy** is created by size, weight, colour and space — in that order
      of subtlety. If everything is emphasised, nothing is.

      **The system.** In Figma: styles and variables for colour and type,
      components with variants and auto-layout, and named tokens that map cleanly
      onto what engineers will implement. A design system is a shared contract,
      not a sticker sheet — its value comes from being used and maintained.
    resources:
      - kind: course
        title: "Figma — learn design fundamentals"
        url: https://help.figma.com/hc/en-us/categories/360002042553-Getting-started
        provider: Figma
        duration_min: 300
      - kind: doc
        title: "Refactoring UI — practical visual tactics"
        url: https://www.refactoringui.com/
        provider: Wathan & Schoger
        is_free: false
        duration_min: 300
      - kind: doc
        title: "Material Design 3 — a complete system to study"
        url: https://m3.material.io/foundations
        provider: Google
        duration_min: 240
    quiz:
      - prompt: What is a comfortable line length for body text?
        explanation: Roughly 45-75 characters. Longer lines make it hard to find the start of the next line.
        options:
          - text: "About 45-75 characters"
            correct: true
          - text: "About 20 characters"
          - text: "About 120 characters"
          - text: "Line length does not affect readability"
      - prompt: Why must colour never be the only signal for an error?
        explanation: Colour-blind users and anyone in poor lighting or greyscale will miss it. Pair colour with an icon or text.
        options:
          - text: "Colour-blind users would perceive no error at all"
            correct: true
          - text: "Red renders differently on each browser"
          - text: "It slows rendering"
          - text: "Design systems forbid red"
      - prompt: What makes a design system valuable?
        explanation: Adoption and maintenance. An unused, unmaintained component library is a liability rather than an asset.
        options:
          - text: "That it is actually adopted and kept in step with the product"
            correct: true
          - text: "The number of components it contains"
          - text: "Having a custom typeface"
          - text: "Being published publicly"
    interview:
      - question: Engineering says a design is "not implementable". How do you respond?
        difficulty: medium
        answer_md: |
          Treat it as information rather than a verdict, and find out which part
          — usually it is one specific interaction, a performance concern, or
          something that fights the framework or component library. Ask what
          would be cheap, sit down together and design against the real
          constraints, and separate what the design must achieve from how it was
          drawn. Most disagreements dissolve when the intent is explicit. Working
          from a shared design system with tokens engineers already have removes
          most of these conversations before they happen.
