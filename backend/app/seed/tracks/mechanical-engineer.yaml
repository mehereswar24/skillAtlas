track:
  slug: mechanical-engineer
  title: Study Mechanical Engineering
  domain: mech
  target_role: Mechanical Design Engineer
  difficulty: intermediate
  description: >-
    Statics and strength of materials, thermodynamics and fluids, and the CAD
    and manufacturing knowledge that turns an analysis into a part somebody can
    actually make.

concepts:
  - slug: statics-and-strength
    name: Statics & Strength of Materials
    domain: mech
    est_hours: 50
    difficulty: intermediate
    prerequisites: []
    summary: >-
      Forces in equilibrium, internal stress, and whether a part will break —
      the foundation of every mechanical design decision.
    content_md: |
      Statics answers "what forces act here?" and strength of materials answers
      "will it survive them?".

      **Equilibrium.** For a body at rest, forces and moments both sum to zero.
      That single pair of conditions, applied to a correctly drawn free-body
      diagram, solves an enormous share of real problems. The free-body diagram
      is the whole skill: isolate the body, draw every external force including
      reactions and weight, and be honest about the supports.

      **Stress and strain.** Stress is force per unit area; strain is
      deformation per unit length. Within the elastic region they are
      proportional through Young's modulus. Beyond yield the material deforms
      permanently, and beyond ultimate strength it fails.

      **Load types.** Axial, shear, bending and torsion, each with its own stress
      distribution. Bending stress is highest at the surface furthest from the
      neutral axis, which is why an I-beam puts material where it matters and
      hollows out the middle.

      **Failure and safety.** Ductile materials are assessed against yield
      (von Mises); brittle ones against ultimate stress. **Fatigue** kills more
      parts than static overload — cyclic loading far below yield will eventually
      crack a component, usually starting at a stress concentration such as a
      sharp internal corner. A generous fillet is often the entire fix.
    resources:
      - kind: course
        title: "MIT OCW — Engineering Mechanics I"
        url: https://ocw.mit.edu/courses/1-050-engineering-mechanics-i-fall-2007/
        provider: MIT
        duration_min: 1800
      - kind: doc
        title: "Engineering Statics (open textbook)"
        url: https://engineeringstatics.org/
        provider: Baker & Haynes
        duration_min: 1200
      - kind: video
        title: "The Efficient Engineer — mechanics of materials"
        url: https://www.youtube.com/@TheEfficientEngineer
        provider: YouTube
        duration_min: 300
    quiz:
      - prompt: Where does bending stress reach its maximum in a beam?
        explanation: At the surface furthest from the neutral axis, which is why material is concentrated in the flanges of an I-beam.
        options:
          - text: "At the outermost fibre, furthest from the neutral axis"
            correct: true
          - text: "At the neutral axis"
          - text: "Uniformly across the section"
          - text: "At the supports only"
      - prompt: A part fails after millions of cycles at a load well below yield. What is this?
        explanation: Fatigue — progressive crack growth under cyclic loading, usually initiating at a stress concentration.
        options:
          - text: "Fatigue failure"
            correct: true
          - text: "Buckling"
          - text: "Creep"
          - text: "Yield failure"
      - prompt: What is the most common cheap fix for a stress concentration at an internal corner?
        explanation: A generous fillet radius spreads the stress instead of concentrating it at a sharp geometric transition.
        options:
          - text: "Add a fillet radius"
            correct: true
          - text: "Increase the surface finish"
          - text: "Use a longer bolt"
          - text: "Anodise the surface"
    interview:
      - question: A bracket keeps cracking in service. Walk me through your investigation.
        difficulty: hard
        answer_md: |
          Look at the fracture surface first — beach marks indicate fatigue, a
          rough granular surface indicates brittle overload, necking indicates
          ductile overload. That tells you whether the load is cyclic or a
          one-off. Then check where the crack initiated: almost always a stress
          concentration, a weld toe, a machining mark or a hole. Re-examine the
          real load case, since service loads are often higher or more dynamic
          than the design assumed (vibration, shock, thermal cycling). Fixes in
          order of cost: add a fillet, improve surface finish, change section,
          change material, add damping.

  - slug: thermo-and-fluids
    name: Thermodynamics & Fluid Mechanics
    domain: mech
    est_hours: 50
    difficulty: advanced
    prerequisites:
      - statics-and-strength
    summary: >-
      Energy, heat and flow — the laws that govern engines, pumps, heat
      exchangers and anything that gets warm.
    content_md: |
      Thermodynamics is bookkeeping for energy; fluid mechanics is bookkeeping
      for momentum in things that flow. Together they cover most of what a
      mechanical system does when it is running.

      **The laws.** The first law is conservation of energy across a system
      boundary. The second introduces entropy and, practically, the direction of
      processes: heat flows from hot to cold on its own, and no cycle converts
      heat entirely to work. Carnot efficiency sets the ceiling any real engine
      falls short of.

      **Cycles.** Rankine for steam power, Otto and Diesel for engines, the
      vapour-compression cycle for refrigeration and heat pumps. Recognising
      which cycle a machine implements tells you where its losses are.

      **Heat transfer** happens by conduction, convection and radiation, usually
      in series — and the slowest step dominates, which is why a heat sink's
      airflow matters more than its metal.

      **Fluids.** Continuity (what goes in comes out), Bernoulli (pressure and
      velocity trade off), and viscosity. The **Reynolds number** predicts
      whether flow is laminar or turbulent, and that single dimensionless group
      changes drag, mixing and heat transfer completely. Real pipe systems are
      dominated by friction and minor losses at bends and fittings, not by the
      idealised equation.
    resources:
      - kind: course
        title: "MIT OCW — Thermodynamics and Kinetics / Fluid Mechanics"
        url: https://ocw.mit.edu/courses/2-006-thermal-fluids-engineering-ii-spring-2008/
        provider: MIT
        duration_min: 1800
      - kind: video
        title: "The Efficient Engineer — thermodynamics and fluids"
        url: https://www.youtube.com/@TheEfficientEngineer
        provider: YouTube
        duration_min: 300
      - kind: doc
        title: "NASA Glenn — Beginner's Guide to Aeronautics"
        url: https://www.grc.nasa.gov/www/k-12/BGP/
        provider: NASA
        duration_min: 240
    quiz:
      - prompt: What does the Reynolds number predict?
        explanation: The ratio of inertial to viscous forces, and therefore whether flow is laminar or turbulent.
        options:
          - text: "Whether flow is laminar or turbulent"
            correct: true
          - text: "The absolute pressure"
          - text: "The specific heat"
          - text: "Thermal conductivity"
      - prompt: Carnot efficiency represents:
        explanation: The theoretical maximum for a heat engine between two temperatures; every real cycle falls below it.
        options:
          - text: "The upper bound on efficiency for a heat engine between two temperatures"
            correct: true
          - text: "The efficiency of a real diesel engine"
          - text: "The minimum energy to run a pump"
          - text: "A measure of entropy generation"
      - prompt: In a series heat transfer path, which step determines overall performance?
        explanation: The highest-resistance step is the bottleneck — often the air-side convection rather than the metal.
        options:
          - text: "The step with the greatest thermal resistance"
            correct: true
          - text: "The step with the highest temperature"
          - text: "Always conduction"
          - text: "Always radiation"
    interview:
      - question: A pump is not delivering its rated flow. What do you check?
        difficulty: medium
        answer_md: |
          Verify the actual operating point against the pump curve — the system
          curve may have moved, so the pump is doing exactly what it should at a
          higher head. Then check the suction side: insufficient net positive
          suction head causes cavitation, which shows up as noise, vibration and
          impeller erosion as well as lost flow. Look for a blocked strainer, a
          partially closed valve, air ingress, wrong rotation direction, worn
          clearances, and fluid viscosity or density different from the design
          assumption.

  - slug: cad-and-manufacturing
    name: CAD, Tolerances & Manufacturing
    domain: mech
    est_hours: 40
    difficulty: intermediate
    prerequisites:
      - statics-and-strength
    summary: >-
      Parametric modelling, GD&T and design for manufacture — turning an idea
      into something a shop can actually make at a sensible price.
    content_md: |
      A design that cannot be manufactured economically is not a design. Most of
      the cost of a part is decided in CAD, long before anyone quotes it.

      **Parametric modelling.** Sketch, constrain, extrude, revolve, pattern.
      Model with **design intent**: a well-constrained model updates sensibly
      when a dimension changes, while an under-constrained one collapses. Keep
      the feature tree readable — someone else will have to edit it.

      **Tolerances are money.** Every tenth of a millimetre tightened multiplies
      cost. Specify the loosest tolerance that works, and use GD&T to control
      what actually matters — position, flatness, concentricity — relative to
      properly chosen datums, rather than blanket-tightening every dimension.
      Tolerance stack-up across an assembly is where "each part is in spec but it
      does not fit" comes from.

      **Design for manufacture.** Each process has rules: draft angles and
      uniform wall thickness for injection moulding and casting; accessible tool
      paths, avoided sharp internal corners and standard tool radii for
      machining; overhang limits and orientation for additive; bend radii and
      relief cuts for sheet metal. Talk to the shop early — an hour with a
      machinist routinely halves the cost of a part.

      **Prefer standard parts.** A stock bearing, fastener or extrusion beats a
      custom one every time on cost, lead time and availability.
    resources:
      - kind: course
        title: "Onshape — free CAD learning centre"
        url: https://learn.onshape.com/
        provider: Onshape
        duration_min: 600
      - kind: doc
        title: "GD&T fundamentals"
        url: https://www.gdandtbasics.com/
        provider: GD&T Basics
        duration_min: 240
      - kind: doc
        title: "Design for manufacturing guides by process"
        url: https://www.protolabs.com/resources/design-tips/
        provider: Protolabs
        duration_min: 180
    quiz:
      - prompt: Why does tightening a tolerance increase cost?
        explanation: It demands better machines, more setup care, slower cutting and more inspection and scrap.
        options:
          - text: "It requires more precise processes, slower machining and more inspection"
            correct: true
          - text: "It uses more material"
          - text: "It requires a different material"
          - text: "It increases part weight"
      - prompt: Every part measures within spec but the assembly does not fit. What is the likely cause?
        explanation: Tolerance stack-up — individual tolerances accumulate across the assembly chain.
        options:
          - text: "Tolerance stack-up across the assembly"
            correct: true
          - text: "The wrong material"
          - text: "Thermal expansion only"
          - text: "An error in the CAD kernel"
      - prompt: Which feature is essential for an injection-moulded part?
        explanation: Draft angle, so the part releases from the mould; uniform wall thickness also prevents sink and warp.
        options:
          - text: "Draft angle on vertical faces"
            correct: true
          - text: "Sharp internal corners"
          - text: "Variable wall thickness"
          - text: "A polished bore"
    interview:
      - question: A machinist says your part is expensive to make. How do you respond?
        difficulty: medium
        answer_md: |
          Ask what specifically drives the cost — it is usually a small number of
          features: an unnecessarily tight tolerance, a deep pocket needing a
          long thin tool, an internal corner with a radius smaller than any
          standard cutter, a feature requiring an extra setup or a fifth axis, or
          a surface finish nobody needs. Most are cheap to relax once you know
          which they are. Bring the functional requirement rather than the
          drawing, so the two of you can find a geometry that meets it and cuts
          easily. Doing this before releasing the drawing is far cheaper than
          after.
