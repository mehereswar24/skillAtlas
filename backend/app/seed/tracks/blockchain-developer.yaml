track:
  slug: blockchain-developer
  title: Learn Blockchain Development
  domain: web3
  target_role: Smart Contract Developer
  difficulty: advanced
  description: >-
    How distributed ledgers actually work, writing and testing smart contracts
    in Solidity, and the security discipline that a public, immutable,
    money-carrying execution environment demands.

concepts:
  - slug: applied-cryptography

  - slug: blockchain-fundamentals
    name: Blockchain Fundamentals
    domain: web3
    est_hours: 25
    difficulty: intermediate
    prerequisites: []
    summary: >-
      Blocks, hashes, consensus and the trade-off that makes a blockchain worth
      its enormous cost — or not.
    content_md: |
      A blockchain is an append-only ledger replicated across machines that do
      not trust each other, kept consistent by consensus rather than by an
      administrator.

      **The chain.** Each block contains transactions and the hash of its
      predecessor, so altering an old block changes every hash after it. That is
      the whole tamper-evidence mechanism.

      **Consensus.** Proof of work spends electricity to make rewriting history
      expensive. Proof of stake bonds capital that can be destroyed for
      misbehaviour. Both answer the same question: who gets to append next, and
      why should everyone accept it?

      **Keys are identity.** An address is derived from a public key; control is
      the private key and nothing else. There is no password reset, no support
      line, and no reversal — an enormous usability and safety problem that most
      of the industry still has not solved.

      **The honest trade-off.** You get censorship resistance and verifiability
      without a trusted operator, and you pay with throughput, latency, cost and
      total transparency. If a trusted party is acceptable, a database is faster,
      cheaper and easier in every dimension. Knowing when *not* to use a
      blockchain is the mark of competence here.
    resources:
      - kind: doc
        title: "Ethereum — developer documentation: intro"
        url: https://ethereum.org/en/developers/docs/intro-to-ethereum/
        provider: Ethereum Foundation
        duration_min: 180
      - kind: article
        title: "Bitcoin whitepaper"
        url: https://bitcoin.org/bitcoin.pdf
        provider: Satoshi Nakamoto
        duration_min: 60
      - kind: doc
        title: "Ethereum — proof of stake explained"
        url: https://ethereum.org/en/developers/docs/consensus-mechanisms/pos/
        provider: Ethereum Foundation
        duration_min: 60
    quiz:
      - prompt: Why does altering an old block invalidate the chain?
        explanation: Each block commits to the hash of the previous one, so a change cascades through every subsequent hash.
        options:
          - text: "Each block contains its predecessor's hash, so every later block's hash changes"
            correct: true
          - text: "Nodes keep a signed copy of every block"
          - text: "The block timestamp is checked"
          - text: "Miners re-verify all signatures nightly"
      - prompt: A user loses their private key. What can be done?
        explanation: Nothing at the protocol level — the key is the account. This is why recovery has to be designed at the application or wallet layer.
        options:
          - text: "Nothing at the protocol level — the funds are unrecoverable"
            correct: true
          - text: "The network can restore it from a backup"
          - text: "Validators can reissue the address"
          - text: "A majority vote can reverse it"
      - prompt: When is a blockchain the wrong tool?
        explanation: Whenever a trusted operator is acceptable — a database is faster, cheaper and vastly simpler.
        options:
          - text: "Whenever a trusted party is acceptable to all participants"
            correct: true
          - text: "When there are many users"
          - text: "When data must be auditable"
          - text: "When transactions must be ordered"
    interview:
      - question: A client wants a blockchain for their internal supply chain records. What do you ask?
        difficulty: medium
        answer_md: |
          Who are the participants, and do they genuinely distrust one another?
          If a single company or consortium controls the data, an append-only
          database with signed audit logs gives the same tamper-evidence at a
          fraction of the cost and complexity. Then: what enters the chain, and
          who guarantees it is true — a blockchain secures the record, not
          reality, so a mislabelled pallet is mislabelled on-chain forever. Also
          probe throughput needs, privacy requirements (public chains are
          public), and who operates the nodes.

  - slug: solidity-smart-contracts
    name: Smart Contracts with Solidity
    domain: web3
    est_hours: 45
    difficulty: advanced
    prerequisites:
      - blockchain-fundamentals
    summary: >-
      Writing, testing and deploying contracts — state, gas, events, standards
      and upgradeability.
    content_md: |
      A smart contract is a program deployed to an address whose code and state
      are public and whose execution is paid for per operation.

      **The execution model.** Contracts only run when called by a transaction —
      there is no background loop and no timer. Every operation costs gas paid by
      the caller, so storage is expensive and computation is not free. Storage
      writes dominate cost; design your data layout accordingly.

      **Language essentials.** Types and visibility, `storage` versus `memory`
      (a very common source of subtle bugs), modifiers for access control,
      events as the log stream that off-chain systems index, and custom errors
      instead of long revert strings.

      **Standards exist for a reason.** ERC-20 for fungible tokens, ERC-721 and
      ERC-1155 for non-fungible. Use audited implementations such as
      OpenZeppelin rather than writing your own — a token is not the interesting
      part of your product.

      **Tooling.** Foundry or Hardhat for compiling, testing and deploying.
      Write tests in the same language as the contract, use fuzzing, and deploy
      to a testnet before mainnet.

      **Immutability.** Deployed code cannot be changed. Upgradeability is
      achieved with proxy patterns, which introduce their own risks — storage
      collisions, an admin key that is now the biggest attack surface in the
      system.
    resources:
      - kind: doc
        title: "Solidity documentation"
        url: https://docs.soliditylang.org/
        provider: Solidity
        duration_min: 480
      - kind: doc
        title: "Foundry Book"
        url: https://book.getfoundry.sh/
        provider: Foundry
        duration_min: 300
      - kind: doc
        title: "OpenZeppelin Contracts"
        url: https://docs.openzeppelin.com/contracts
        provider: OpenZeppelin
        duration_min: 180
    quiz:
      - prompt: Which operation dominates gas cost in most contracts?
        explanation: Writing to persistent storage is by far the most expensive common operation.
        options:
          - text: "Writing to storage"
            correct: true
          - text: "Emitting an event"
          - text: "Arithmetic"
          - text: "Reading a function argument"
      - prompt: How does off-chain software learn that something happened in a contract?
        explanation: Events are written to the transaction log and indexed by off-chain consumers; there is no push from the chain.
        options:
          - text: "By indexing the events the contract emits"
            correct: true
          - text: "The contract calls a webhook"
          - text: "Through a scheduled on-chain job"
          - text: "Nodes email the owner"
      - prompt: What is the main risk introduced by an upgradeable proxy?
        explanation: Someone holds the key that can replace the logic — that admin becomes the system's central point of trust and attack.
        options:
          - text: "The upgrade admin key becomes a single point of total compromise"
            correct: true
          - text: "Gas costs double"
          - text: "Events stop working"
          - text: "The contract address changes"
    interview:
      - question: Explain a reentrancy attack and how to prevent it.
        difficulty: hard
        answer_md: |
          When a contract sends value or calls an external address before
          updating its own state, the receiving contract can call back into the
          original function while the old state is still in place — draining a
          balance repeatedly in a single transaction. Prevent it with the
          checks-effects-interactions ordering: validate, then update state, then
          make the external call. Add a reentrancy guard for defence in depth,
          prefer pull-payments over push, and treat every external call as
          potentially hostile, including a token transfer where the token itself
          is attacker-controlled.

  - slug: smart-contract-security
    name: Smart Contract Security
    domain: web3
    est_hours: 30
    difficulty: advanced
    prerequisites:
      - solidity-smart-contracts
    summary: >-
      Auditing mindset, the recurring vulnerability classes, and the operational
      practices that separate a shipped contract from a headline.
    content_md: |
      Smart contract code is public, immutable and holds money. There is no
      environment where the cost of a bug is higher.

      **The recurring classes.** Reentrancy. Integer issues (much reduced since
      Solidity 0.8's checked arithmetic, but unchecked blocks remain). Access
      control — an initializer that anyone can call, or a missing `onlyOwner`.
      Oracle manipulation, where a price read from a thin pool can be moved
      within a single transaction. Front-running: your pending transaction is
      public before it is mined, so anyone can act on it first.

      **Assume every input is hostile**, including other contracts. A token
      transfer may execute attacker code; a call to an unknown address may not
      return.

      **Testing is not enough.** Combine unit tests with fuzzing and invariant
      testing — state the properties that must always hold (total supply equals
      the sum of balances) and let the tool search for a counterexample. Static
      analysers like Slither catch known patterns cheaply.

      **Operational reality.** A professional audit before mainnet, a bug bounty
      after, timelocks on privileged actions so users can react, multisig rather
      than a single owner key, and a rehearsed incident plan. Deploy value
      incrementally rather than opening with the full treasury.
    resources:
      - kind: doc
        title: "Smart Contract Weakness Classification (SWC) registry"
        url: https://swcregistry.io/
        provider: SWC
        duration_min: 180
      - kind: project
        title: "Ethernaut — security wargame"
        url: https://ethernaut.openzeppelin.com/
        provider: OpenZeppelin
        duration_min: 600
      - kind: doc
        title: "Slither — static analysis for Solidity"
        url: https://github.com/crytic/slither
        provider: Trail of Bits
        duration_min: 90
    quiz:
      - prompt: What is the checks-effects-interactions pattern for?
        explanation: Updating state before making external calls removes the window a reentrant call could exploit.
        options:
          - text: "Preventing reentrancy by updating state before calling out"
            correct: true
          - text: "Reducing gas usage"
          - text: "Making contracts upgradeable"
          - text: "Improving event indexing"
      - prompt: Why is reading a price from a thin liquidity pool dangerous?
        explanation: An attacker can move the price within one transaction — often with a flash loan — and exploit whatever depends on it.
        options:
          - text: "The price can be manipulated within a single transaction"
            correct: true
          - text: "Pools are always offline"
          - text: "It costs too much gas"
          - text: "Prices are only updated daily"
      - prompt: What does invariant testing add over unit tests?
        explanation: It states properties that must hold for all states and searches for a counterexample, finding sequences you would not think to write.
        options:
          - text: "It searches for any sequence of calls that breaks a stated property"
            correct: true
          - text: "It measures gas"
          - text: "It formats the code"
          - text: "It deploys to mainnet"
    interview:
      - question: You have one week and a contract going live with real funds. What do you prioritise?
        difficulty: hard
        answer_md: |
          Reduce blast radius before chasing perfection: cap the value at risk
          with deposit limits, put a timelock and a multisig on privileged
          functions, and add a pause. Then run static analysis and write
          invariant tests for the properties that matter — supply conservation,
          no unauthorised withdrawal, access control on every state-changing
          function. Review the external call surface and the oracle assumptions
          by hand, since those are where the expensive bugs live. Book the audit
          anyway and stage the rollout so the first week's exposure is small
          enough to survive being wrong.
