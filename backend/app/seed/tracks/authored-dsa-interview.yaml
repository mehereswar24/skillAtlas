  - slug: dsa-advanced-string-algorithms
    name: "Advanced String Algorithms"
    domain: computer-science
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - dsa-strings-basics
      - dsa-tries
    summary: |-
      Linear-time pattern matching (KMP, Z-function, Rabin-Karp) and palindrome-specific tricks — the topic that shows up at companies with a strong competitive-programming-influenced bar.
    content_md: |-
      Naive substring search compares the pattern against every starting position in the text, giving O(n·m) in the worst case (text length n, pattern length m). The algorithms in this topic all exploit information the naive approach throws away — specifically, what's already been matched — to guarantee linear O(n+m) time instead.

      ### KMP (Knuth-Morris-Pratt)

      KMP precomputes a "failure function" (also called the prefix function) over the pattern itself: for every prefix of the pattern, the length of the longest proper prefix that is also a suffix. When a mismatch occurs during matching, instead of restarting the comparison from scratch, KMP uses this precomputed table to skip directly to the next position that could still match, without ever re-examining a text character it has already looked at — that's what gives the O(n+m) bound.

      ### The Z-function

      The Z-function computes, for every position in a string, the length of the longest substring starting there that matches a prefix of the whole string. Concatenating pattern + separator + text and computing the Z-function over that combined string finds every occurrence of the pattern in the text in O(n+m), and the same building block solves a range of other prefix-related string problems beyond plain matching.

      ### Rabin-Karp and its collision pitfall

      Rabin-Karp uses a rolling hash — a hash of each window of the text that can be updated in O(1) as the window slides, rather than recomputed from scratch — to quickly filter out positions that can't match, then verifies real matches character-by-character. Its known weakness is hash collisions: two different substrings hashing to the same value produce a false positive that must be verified explicitly, and using a weak hash or a single modulus makes deliberate collisions (or, in a poorly designed system, accidental ones on adversarial input) far more likely. Production-quality rolling hash implementations use a large prime modulus and, ideally, more than one hash function to make collisions negligible.

      ### Palindrome-specific techniques

      Expand-around-center checks every possible center (there are 2n-1 of them, accounting for even-length palindromes) and expands outward while characters match, giving O(n^2) — good enough for most interview-scale inputs. Manacher's algorithm improves this to O(n) by reusing information from previously computed palindromes, similar in spirit to how KMP reuses partial-match information, though it's asked less often than the O(n^2) approach because the O(n^2) one is usually sufficient.

      ### When to reach for these vs a built-in

      Most languages' built-in substring search is already well-optimized (often a variant of these same algorithms internally), so reimplementing KMP from scratch is rarely the goal in itself — the goal is recognizing when a problem's stated constraints (e.g., text length in the millions with many repeated queries) explicitly require guaranteed linear-time matching rather than relying on average-case performance.

      ### Common mistakes

      Reimplementing brute-force substring search under time pressure when the stated constraints explicitly require linear time; using a rolling hash without a verification step, letting a collision silently produce a wrong match; and confusing the KMP failure function's off-by-one conventions (whether a table entry represents the prefix length *including* the current character or *before* it), which is the most common source of implementation bugs in this topic.

      **Where this shows up:** these algorithms are asked less frequently than earlier topics in this track, but they appear at companies with a strong algorithmic bar — often ones with roots in competitive programming or in latency-sensitive domains like search infrastructure or trading systems — and show up among LeetCode's hard-difficulty string problems as the differentiator in advanced onsite loops.
