  - slug: dsa-stacks-queues
    name: "Stacks & Queues"
    domain: computer-science
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - dsa-linked-lists
      - dsa-arrays
    summary: |-
      Stacks for matching/parsing and monotonic-stack problems, queues for BFS-style processing, and the deque trick for sliding-window maximums.
    content_md: |-
      Stacks (LIFO) and queues (FIFO) are simple to implement but underlie a disproportionate number of interview patterns because so many problems are really about "what's the most recent unmatched thing" (stack) or "what's next in arrival order" (queue).

      ### Stacks for matching and evaluation

      Balanced-parentheses checking, expression evaluation (infix-to-postfix, postfix evaluation), and undo/redo style problems all reduce to a stack: push on an opening/operator, pop and check on a closing/operand. This is usually the first stack pattern candidates learn and the most direct.

      ### The monotonic stack pattern

      A monotonic stack keeps its elements in increasing or decreasing order by popping off anything that violates the order before pushing the new element. This is the key to solving "next greater element," "daily temperatures," "largest rectangle in histogram," and "stock span" in O(n) instead of the naive O(n^2) — because each element is pushed and popped at most once, even though it looks like a nested loop. Not recognizing a problem as monotonic-stack-shaped is the single biggest reason candidates brute-force these into a timeout.

      ### Queues and the sliding-window-maximum deque

      Queues drive breadth-first processing (a forward pointer to graphs and trees later in this track). A specific and very testable pattern is using a deque (double-ended queue) to track the maximum in a sliding window in O(n) total: push new indices from the back after popping off any smaller elements (they can never be the max while the new, larger element is in the window), and pop stale indices from the front once they fall outside the window.

      ### Common mistakes

      Brute-forcing "next greater element" style problems in O(n^2) instead of recognizing the monotonic-stack shape; forgetting to evict stale indices from the front of a sliding-window deque, which silently returns wrong maximums; and implementing "queue using two stacks" (a classic design question) by amortizing the transfer incorrectly, causing O(n) per operation instead of amortized O(1).

      **Where this shows up:** monotonic-stack problems (next greater element, largest rectangle in histogram) are a recurring OA "medium" bucket, and "design a stack/queue with an extra operation" (min-stack, queue via stacks) is a common phone-screen warm-up used to test whether a candidate can reason about amortized cost.
