  - slug: dsa-arrays
    name: "Arrays"
    domain: computer-science
    est_hours: 12
    difficulty: beginner
    prerequisites:
      - dsa-sorting-algorithms
    summary: |-
      Prefix sums, Kadane's algorithm, in-place rearrangement, and 2D array traversal — the highest-frequency pattern family in the whole interview process.
    content_md: |-
      Arrays are contiguous, indexable, cache-friendly, and the substrate almost every other data structure in this track is eventually implemented on top of. They're also, by a wide margin, the most heavily tested topic in early-round OAs, because array problems can encode almost any pattern (search, greedy, DP, two-pointer) in a small, easy-to-state problem.

      ### Prefix sums

      A prefix-sum array turns "sum of a subrange" from an O(n) scan into an O(1) lookup after O(n) preprocessing. This single idea underlies a large family of subarray problems (subarray sum equals K, range sum queries, equilibrium index) and is usually the first thing to reach for whenever a problem repeatedly asks about sums or counts over ranges.

      ### Kadane's algorithm

      Kadane's algorithm finds the maximum-sum contiguous subarray in O(n) by tracking, at each position, the best sum ending exactly there, resetting to the current element whenever the running sum goes negative. The subtlety candidates trip on: if all numbers are negative, the "reset to zero" instinct is wrong — the algorithm needs to track the best sum seen so far (which will be the least-negative single element), not clamp at zero.

      ### In-place rearrangement

      A recurring "medium" pattern is rearranging an array without extra space: the Dutch National Flag algorithm (three-way partition around a pivot, used for "sort colors"), rotating an array via three reversals, or using the array's own indices as a hash set (marking visited values by negating or offsetting values in place) to find duplicates or missing numbers in O(1) extra space. These tricks recur across many "can you do it without extra space" follow-ups.

      ### 2D arrays

      Matrix problems (rotate image, spiral traversal, search a sorted 2D matrix) test whether a candidate can translate row/column indices correctly and handle boundaries without off-by-one errors — a good matrix-rotation solution done in-place via transpose-then-reverse is a common "elegant vs brute force" discriminator.

      ### Common mistakes

      Off-by-one errors in prefix-sum bounds (forgetting whether the prefix array is 0-indexed or padded with a leading zero); applying Kadane's reset-to-zero logic to an all-negative array; using O(n) extra space for a rearrangement problem that explicitly asks for O(1); and not double-checking matrix bounds when traversing diagonals or spirals.

      **Where this shows up:** array manipulation is the dominant topic in SDE-1/new-grad OAs — "maximum subarray," "product of array except self," "two sum," and "merge intervals" style questions recur across nearly every major tech company's screening stage, often as the first of two or three OA problems.
