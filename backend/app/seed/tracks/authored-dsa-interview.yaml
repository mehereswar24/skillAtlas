  - slug: dsa-binary-search-trees
    name: "Binary Search Trees"
    domain: computer-science
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - dsa-binary-trees
      - dsa-binary-search
    summary: |-
      The BST invariant, why inorder traversal gives sorted order, search/insert/delete in O(h), and how an unbalanced BST degenerates to a linked list.
    content_md: |-
      A binary search tree layers the binary-search idea onto a tree: every node's left subtree contains only smaller values and its right subtree only larger ones, recursively. That single invariant is what makes search, insert, and delete all O(h), where h is the tree's height — and it's also exactly what makes a *degenerate* BST (built by inserting already-sorted data) collapse to a linked list with O(n) operations, which is the topic's central cautionary tale.

      ### Why inorder gives sorted order

      Because every left subtree is smaller and every right subtree is larger, an inorder traversal (left, node, right) visits every value in ascending order automatically — no sorting step needed. This is the basis for "kth smallest element in a BST" (inorder traversal, stop at the kth visit) and for validating whether a tree is a valid BST by checking that an inorder traversal is strictly increasing.

      ### Validating a BST correctly

      The subtle bug in BST validation is checking only that each node is greater than its immediate left child and less than its immediate right child — that's necessary but not sufficient, because a node deep in the left subtree could still violate the *ancestor's* bound even while satisfying its immediate parent. The correct approach threads a valid `(min, max)` range down the recursion, tightening it at each step, so every node is checked against every relevant ancestor, not just its parent.

      ### Search, insert, delete

      Search and insert are straightforward recursive descents guided by the BST invariant. Delete is the operation candidates most often get wrong because it has three cases: deleting a leaf (just remove it), deleting a node with one child (splice the child up), and deleting a node with two children (find the inorder successor — the smallest value in the right subtree — copy its value into the node being deleted, then recursively delete that successor, which is guaranteed to have at most one child).

      ### Balance is not automatic

      A plain BST gives no guarantee that h stays O(log n) — inserting already-sorted data produces a tree that's really a linked list in disguise, with O(n) search/insert/delete. Self-balancing variants (AVL trees, red-black trees) add rotation logic on insert/delete specifically to keep h at O(log n) regardless of insertion order; knowing that a plain BST doesn't get this for free is exactly the kind of follow-up interviewers ask after a candidate proposes a BST-based solution.

      ### Common mistakes

      Validating a BST against only immediate children instead of a running min/max bound; mishandling the two-child deletion case (forgetting the successor-swap-then-delete pattern); and assuming BST operations are O(log n) without acknowledging that this depends on the tree being reasonably balanced.

      **Where this shows up:** "validate BST" and "kth smallest element in a BST" are recurring OA/onsite mediums, and "what happens to your BST if I insert already-sorted data" is a favorite onsite follow-up specifically to test whether a candidate knows about the degenerate case and when a self-balancing tree would be needed instead.
