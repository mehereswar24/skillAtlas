  - slug: dsa-graphs
    name: "Graphs"
    domain: computer-science
    est_hours: 20
    difficulty: advanced
    prerequisites:
      - dsa-binary-trees
      - dsa-stacks-queues
      - dsa-recursion-backtracking
    summary: |-
      Representations, BFS/DFS on structures with cycles, topological sort, shortest paths (Dijkstra, Bellman-Ford), and MST — consistently the highest-weighted topic in mid-to-senior onsite loops.
    content_md: |-
      A graph generalizes a tree by dropping the restrictions that make trees easy: no single root, nodes can have any number of connections, and — critically — cycles are allowed. Every algorithm from the tree topic gets revisited here with that one added complication, and most graph bugs trace back to forgetting it.

      ### Representation

      An adjacency list (a map or array of lists, one per node, listing its neighbors) is the default choice for sparse graphs, giving O(V+E) space and fast neighbor iteration. An adjacency matrix (a V×V grid of connections) gives O(1) edge-existence checks at O(V^2) space, which only pays off on dense graphs or when edge lookups dominate. Knowing which representation a given problem's constraints favor is itself a signal interviewers look for.

      ### BFS and DFS need a visited set

      Traversing a tree never revisits a node because there are no cycles; traversing a general graph without tracking visited nodes can loop forever. This is the single most common graph bug: porting tree-traversal code to a graph problem and forgetting to add (and check) a visited set. BFS explores level by level via a queue and is the right tool for shortest path in an *unweighted* graph; DFS explores as deep as possible via recursion or an explicit stack and is the right tool for connectivity, cycle detection, and topological ordering.

      ### Topological sort

      For a directed acyclic graph, a topological order lists nodes so every edge points from earlier to later in the list — this models "task scheduling with dependencies" directly. It can be computed via DFS (post-order, then reverse) or via Kahn's algorithm (repeatedly remove nodes with in-degree zero). Topological sort only exists if the graph is acyclic, so cycle detection and topological sort are closely linked: Kahn's algorithm naturally detects a cycle if it finishes without processing every node.

      ### Shortest paths and MST

      Dijkstra's algorithm finds shortest paths from a source in O((V+E) log V) using a priority queue, but only works correctly with non-negative edge weights — using it on a graph with negative edges silently produces a wrong answer rather than an error, which is a well-known interview trap. Bellman-Ford handles negative weights (and detects negative cycles) at the cost of O(VE). For unweighted graphs, plain BFS already gives shortest paths, and 0-1 BFS (a deque-based trick) handles the special case of only 0 or 1 edge weights in O(V+E). Minimum spanning tree algorithms (Prim's, growing a tree greedily; Kruskal's, adding cheapest edges via union-find) connect back to the greedy topic — both are provably-correct greedy algorithms, a rare case where greedy is the *right* answer rather than a trap.

      ### Common mistakes

      Forgetting a visited set on a general (possibly cyclic) graph, causing infinite loops; using Dijkstra on a graph with negative edge weights; and implementing union-find without path compression and union-by-rank/size, which still gives a correct answer but degrades toward O(n) per operation instead of the intended near-constant amortized time — invisible on small test cases, fatal on the large hidden ones.

      **Where this shows up:** graphs are consistently cited as the single highest-weighted topic in SDE-2/SDE-3 onsite loops at larger tech companies — "course schedule" (topological sort), "network delay time" (Dijkstra), and "number of islands" (BFS/DFS on an implicit grid graph) are recurring, and graph questions are frequently used as the deciding round in a multi-round onsite loop.
