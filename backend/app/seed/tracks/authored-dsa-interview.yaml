  - slug: dsa-tries
    name: "Tries"
    domain: computer-science
    est_hours: 6
    difficulty: advanced
    prerequisites:
      - dsa-strings-basics
      - dsa-recursion-backtracking
    summary: |-
      Prefix-tree structure and insert/search/startsWith, and the prefix-based problems (autocomplete, word search II) that combine a trie with backtracking.
    content_md: |-
      A trie (prefix tree) stores strings by sharing common prefixes along root-to-node paths: each node holds a map (or fixed-size array, for a bounded alphabet) of children keyed by the next character, plus a flag marking whether a complete word ends at that node. This structure makes prefix queries — "does any stored word start with this prefix" — O(m) in the length of the prefix, regardless of how many words are stored, which a hashset of whole words cannot do at all.

      ### Insert, search, and the end-of-word flag

      Insert walks the trie character by character, creating child nodes as needed, and marks the final node as end-of-word. Search for an exact word does the same walk and additionally checks the end-of-word flag at the final node. Search for a prefix (startsWith) does the same walk but skips the end-of-word check entirely. The bug candidates hit most often is conflating these two: returning true for `search("app")` just because the path exists, without checking that a word actually *ends* there — which wrongly reports "app" as present when only "apple" was ever inserted.

      ### Combining tries with backtracking

      A significant class of harder problems layers a trie on top of a grid or a set of candidate words to prune backtracking search early: "word search II" builds a trie of the target words and walks it alongside a DFS/backtracking search over the grid, abandoning a branch the instant no trie path matches, instead of independently searching for every target word from scratch. This combination — data structure for fast lookup, backtracking for exploration — is a recurring shape in harder interview problems generally, not just this one.

      ### Space-time tradeoff

      A trie's per-node overhead (an array or map of children) can be significant for large alphabets or sparse data; if a problem never needs prefix queries, a plain hashset of whole words is simpler and often faster in practice. Reaching for a trie when a hashset would do is a mild but noticeable over-engineering signal in an interview.

      ### Common mistakes

      Not distinguishing "a path exists" from "a word ends here," breaking exact-match search; using a trie for a problem that only needs whole-word membership rather than prefix queries; and forgetting to prune trie-guided backtracking early, which loses most of the performance benefit the trie was meant to provide.

      **Where this shows up:** tries appear in "design an autocomplete/spell-checker" style OA and onsite questions, and combined with backtracking in "word search II"-style problems that companies use specifically to test whether a candidate can combine two data structures rather than apply either in isolation.
