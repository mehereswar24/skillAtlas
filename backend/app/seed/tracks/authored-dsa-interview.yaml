  - slug: dsa-binary-trees
    name: "Binary Trees"
    domain: computer-science
    est_hours: 14
    difficulty: intermediate
    prerequisites:
      - dsa-recursion-backtracking
      - dsa-stacks-queues
    summary: |-
      Traversals (recursive and iterative), height/diameter/balance checks, LCA, and path-sum problems — the topic that tests recursive thinking on a visual structure.
    content_md: |-
      A binary tree is a recursive data structure by definition — each node's left and right children are themselves the roots of smaller binary trees — which is why nearly every binary-tree algorithm is naturally expressed as recursion first, and only converted to an explicit stack or queue when iteration is specifically required.

      ### The four traversal orders

      Preorder (node, left, right), inorder (left, node, right), and postorder (left, right, node) are all depth-first and differ only in when the current node is visited relative to its children; each has a natural recursive implementation and a less-natural iterative one using an explicit stack. Level-order traversal is breadth-first, using a queue to visit nodes level by level — it answers a fundamentally different question ("what does level k look like") than the depth-first orders, and conflating the two when a problem specifically wants level-by-level output is a common mistake.

      ### Computing properties bottom-up

      Height, diameter, and "is this tree balanced" all have a naive top-down solution that recomputes subtree heights repeatedly — turning what should be O(n) into O(n^2) in the worst case (a skewed tree). The fix is to compute and return the needed subtree information (height, and whether the subtree is balanced) in a single bottom-up postorder pass, so each subtree's properties are computed exactly once. This "return more than the obvious answer, and let the caller use it" trick generalizes across nearly every recursive tree problem.

      ### LCA and path problems

      Lowest common ancestor and path-sum-style problems (does any root-to-leaf path sum to a target, what's the maximum path sum through any node) both rely on the same idea: recurse into both children, then combine their results at the current node, deciding what to return upward versus what to record as a final answer. Separating "what do I return to my parent" from "what do I record as the answer" is the key insight that unlocks the harder variants of this family.

      ### Common mistakes

      Recomputing subtree height/depth from scratch at every node instead of threading it through the recursion, silently turning O(n) into O(n^2); confusing BFS level-order with DFS traversals when the problem specifically wants one or the other; and forgetting that a "path" in path-sum problems sometimes means root-to-leaf and sometimes means any node-to-node path — always confirm which the problem means.

      **Where this shows up:** binary tree traversal and recursion-on-trees problems (path sum, lowest common ancestor, diameter, level-order traversal) are a mainstay of onsite technical rounds because the visual structure makes it easy for an interviewer to watch a candidate's recursive reasoning in real time.
