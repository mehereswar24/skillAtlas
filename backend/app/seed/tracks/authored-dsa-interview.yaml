  - slug: dsa-heaps
    name: "Heaps & Priority Queues"
    domain: computer-science
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - dsa-arrays
      - dsa-sorting-algorithms
    summary: |-
      Binary heap mechanics, and the priority-queue applications (top-k, merge-k-sorted, running median) that beat a full sort.
    content_md: |-
      A binary heap is a complete binary tree stored in a flat array, maintaining the invariant that every parent is smaller (min-heap) or larger (max-heap) than its children. It supports insert and extract-min/max in O(log n), and finding the min/max in O(1) — which makes it the right tool whenever a problem repeatedly needs "the current smallest/largest" rather than a full sorted order.

      ### Why not just sort

      Sorting the whole input costs O(n log n) and gives you everything, but a lot of problems only need the top k elements, or need the current extreme value while the rest of the data keeps arriving. A heap gets top-k in O(n log k) by keeping a heap of size k and only paying log-k per insertion rather than log-n — a real asymptotic win when k is much smaller than n, and something interviewers explicitly probe for after a candidate proposes "sort everything."

      ### Recurring applications

      Kth largest/smallest element (a size-k heap), top-k frequent elements (bucket-count then heap, or heap over frequency), merging k sorted lists (a heap of size k holding the current head of each list), and the running-median problem via two heaps — a max-heap for the lower half and a min-heap for the upper half, rebalanced so their sizes differ by at most one, giving O(log n) insert and O(1) median lookup.

      ### Implementation details that trip people up

      Most standard libraries provide a min-heap by default (Python's `heapq`, Java's `PriorityQueue`); getting max-heap behavior means negating values on the way in and out (Python) or supplying a reverse comparator (Java). Forgetting this and getting min instead of max silently produces a wrong-but-plausible-looking answer rather than a crash.

      ### Common mistakes

      Sorting the entire input for a top-k problem when a size-k heap is asymptotically better; forgetting the max-heap-via-negation trick in languages whose built-in heap is min-only; and letting the two-heap median structure drift out of balance by not rebalancing after every insertion.

      **Where this shows up:** "kth largest element," "top k frequent elements," and "merge k sorted lists" are staple OA mediums, and the two-heap running-median design is a recognizable onsite favorite for testing whether a candidate can combine two data structures to maintain an invariant incrementally.
