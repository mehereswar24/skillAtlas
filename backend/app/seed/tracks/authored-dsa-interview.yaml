  - slug: dsa-recursion-backtracking
    name: "Recursion & Backtracking"
    domain: computer-science
    est_hours: 12
    difficulty: intermediate
    prerequisites:
      - dsa-arrays
      - dsa-strings-basics
    summary: |-
      Base-case discipline, the choose-explore-unchoose backtracking template, and the subsets/permutations/combinations family that shows up everywhere from N-Queens to Sudoku.
    content_md: |-
      Recursion expresses a solution in terms of smaller instances of itself; backtracking is recursion with a specific shape — try a choice, recurse into the consequences, and undo the choice before trying the next one. Nearly every "generate all X" or "is there a way to arrange Y" interview question is backtracking underneath.

      ### The template

      The reusable mental model is choose → explore → unchoose: pick a candidate, recurse with it included, then remove it from the running state before trying the next candidate. This "unchoose" step is what makes backtracking backtracking rather than plain recursion, and it's exactly the step candidates forget under pressure — leaving mutated shared state (a partially built list, a visited set) polluted for sibling branches.

      ### The core family

      Subsets, permutations, and combinations are the three canonical backtracking skeletons, and most harder backtracking problems (N-Queens, Sudoku solver, word search, combination sum) are one of these three with an added constraint-check before recursing. Learning to recognize "this is permutations with a validity filter" turns an intimidating problem into a template fill-in.

      ### Pruning

      Backtracking without pruning degenerates into brute-force enumeration — checking a full N-Queens board only after placing all N queens, instead of rejecting an invalid placement the moment it happens, is the difference between a solution that finishes in milliseconds and one that times out. Pruning early, as soon as a partial choice is provably invalid, is what makes backtracking practical rather than just correct.

      ### Recursion as the bridge to DP

      Once a recursive solution correctly enumerates all possibilities, checking whether subproblems repeat (the same `(index, remaining)` state recurring across branches) is the natural next step — and that's exactly memoization, and exactly how the dynamic-programming topic later in this track is introduced. Getting comfortable defining recursive state here pays off directly later.

      ### Common mistakes

      Forgetting to undo a mutation (backtrack) before trying the next branch, so state leaks between sibling calls; missing or incorrect base cases causing infinite recursion or stack overflow; and skipping pruning, leading to correct-but-exponentially-slow solutions that time out on OA hidden tests even though they pass the visible small examples.

      **Where this shows up:** backtracking problems (subsets, permutations, N-Queens, word search) are a heavy topic in onsite rounds at product companies specifically because they reveal whether a candidate can manage recursive state cleanly under a constraint, rather than just recalling a memorized pattern.
