  - slug: dsa-bit-manipulation
    name: "Bit Manipulation"
    domain: computer-science
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - dsa-complexity-analysis
    summary: |-
      AND/OR/XOR tricks for checking, setting, and clearing bits, plus the XOR-identity family that turns some O(n) problems into elegant O(1)-space solutions.
    content_md: |-
      Bit manipulation problems are a small, self-contained topic, but the tricks recur across an outsized number of "clever" interview questions because bitwise operations are constant-time and reveal whether a candidate understands binary representation, not just high-level algorithms.

      ### The core operations

      Checking bit `i`: `(x >> i) & 1`. Setting bit `i`: `x | (1 << i)`. Clearing bit `i`: `x & ~(1 << i)`. Toggling bit `i`: `x ^ (1 << i)`. Clearing the lowest set bit: `x & (x - 1)` — this single trick is the basis of Brian Kernighan's algorithm for counting set bits in O(popcount) instead of O(word size), and shows up again whenever a problem needs to iterate only over set bits.

      ### XOR identities

      XOR is its own inverse (`x ^ x = 0`) and identity-preserving (`x ^ 0 = x`), which is why XOR-ing every element of an array where exactly one value appears an odd number of times and the rest appear an even number of times isolates that one value in O(n) time and O(1) space — the classic "single number" family of problems. The same identity underlies constant-space swapping and certain missing-number problems (XOR the full expected range against the actual array).

      ### Bitmask as compact state

      A bitmask (an integer used as a small fixed-size set) is a common way to represent "which items have been used so far" in problems with a small number of elements (typically ≤ 20-ish), and becomes the state representation for bitmask dynamic programming — a forward pointer to the DP topic later in this track, where the state space is `2^n` subsets instead of `n` positions.

      ### Common mistakes

      Assuming bitwise tricks are language-agnostic without checking integer width and signedness — right-shifting a negative number behaves differently across languages (arithmetic vs logical shift), and this silently breaks bit-counting code ported between languages; and reaching for bit tricks when a straightforward boolean array would be just as fast and much more readable — bit manipulation should simplify, not obscure.

      **Where this shows up:** bit-trick questions ("single number," "counting bits," "power of two") are common quick OA warm-ups precisely because they're easy to auto-grade and reward knowing a specific identity rather than a long derivation; they occasionally appear as a lightweight onsite question to change pace between heavier topics.
