  - slug: dsa-dynamic-programming
    name: "Dynamic Programming"
    domain: computer-science
    est_hours: 22
    difficulty: advanced
    prerequisites:
      - dsa-recursion-backtracking
      - dsa-arrays
    summary: |-
      The recursion-to-memoization-to-tabulation pipeline, the classic problem families (knapsack, LCS, edit distance, partition), and how to define state correctly — the topic that tests structured decomposition more than any other.
    content_md: |-
      Dynamic programming solves problems that have overlapping subproblems (the same smaller problem recurs many times) and optimal substructure (an optimal solution is built from optimal solutions to subproblems) by computing each distinct subproblem exactly once and reusing the result. The topic has a reputation for being the hardest in interview prep, and that reputation is mostly earned by skipping the pipeline that makes it tractable.

      ### The pipeline

      Every DP solution should be built in this order, not jumped to directly: first, write a correct brute-force recursion, even if exponential — this establishes the state and the transition unambiguously. Second, add memoization (cache results keyed by the recursive parameters) to eliminate repeated work — this is usually a small, mechanical change on top of a correct recursion. Third, convert to bottom-up tabulation if an iterative version is wanted (often faster in practice, avoids recursion-depth limits). Fourth, optimize space if the transition only depends on a small, fixed number of previous states (rolling a 2D table down to two 1D arrays, or a handful of variables). Skipping straight to tabulation without first getting the recursion right is the most common reason candidates produce a DP solution that's subtly wrong and hard to debug, because there's no working brute force to compare against.

      ### Defining state correctly

      The hardest and most interview-relevant skill in DP is choosing what the state needs to capture. A state that's missing information silently produces wrong answers on some inputs while looking correct on others — for example, a "can I reach index i" state that forgets to also track "how much capacity/budget remains" will happily overcount or undercount depending on the problem. When a DP approach seems almost-right but fails specific cases, the fix is almost always adding a dimension to the state, not fixing the transition.

      ### The recurring families

      1D sequence DP (climbing stairs, house robber, longest increasing subsequence) where state is "best answer up to index i." 2D grid/string DP (longest common subsequence, edit distance, unique paths) where state is a pair of indices into two sequences or a grid position. Knapsack-style DP (0/1 knapsack, subset sum, partition equal subset sum) where state is "index and remaining capacity/target." Interval DP (matrix chain multiplication, burst balloons) where state is a range `[i, j]` and transitions try every split point. Recognizing which family a new problem belongs to is most of the battle — the actual code within a family is a small variation on a template.

      ### Common mistakes

      Attempting tabulation before verifying a correct recursive brute force, losing the ability to debug transitions against known-correct small cases; defining state that doesn't capture enough information to distinguish genuinely different subproblems; forgetting base cases for empty inputs or zero-capacity/zero-length edge cases, which are exactly what hidden OA tests probe; and applying a greedy shortcut (see the greedy topic) to a problem that actually needs the full DP because of an integrality or ordering constraint.

      **Where this shows up:** DP is the topic candidates fear most, and companies weight it heavily in final onsite rounds specifically because it filters for structured problem decomposition rather than recall of a memorized pattern — longest-common-subsequence, edit-distance, and knapsack variants recur across nearly every senior-track onsite loop, and "define your state before you code" is the standard opening question interviewers ask.
