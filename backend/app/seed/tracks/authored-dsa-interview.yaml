  - slug: dsa-binary-search
    name: "Binary Search"
    domain: computer-science
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - dsa-arrays
    summary: |-
      Not just "search a sorted array" — binary search on the answer over any monotonic predicate, first/last occurrence, rotated arrays, and 2D search spaces.
    content_md: |-
      Classic binary search halves a sorted search space each step, giving O(log n). The pattern generalizes far beyond sorted arrays: any time you can define a monotonic yes/no predicate over a range of candidate answers (true up to some point, then false, or vice versa), you can binary search that answer space directly, even if no array is sorted at all. Recognizing this generalization — "binary search on the answer" — is what separates candidates who only know the textbook version from those who can apply it.

      ### The core template and its bugs

      The most common implementation bug is an off-by-one in how the search space shrinks: using `while lo <= hi` with `mid = lo + (hi - lo) / 2` and updating `lo = mid + 1` / `hi = mid - 1` is one consistent, provably-terminating template; mixing it with `lo = mid` or `hi = mid` (used for first/last occurrence variants) without adjusting the loop condition is the single most common source of infinite loops in interviews. Always mid-point via `lo + (hi - lo) / 2` rather than `(lo + hi) / 2` to sidestep integer overflow in languages with fixed-width integers.

      ### First/last occurrence and lower/upper bound

      Many real problems need "the first index where X is true" or "the last index where X is still true" rather than an exact match — this is the lower_bound/upper_bound pattern, and it underlies things like counting occurrences of a value in a sorted array, or finding insertion position for a value.

      ### Binary search on the answer

      Problems like allocating books to minimize the maximum pages assigned, painters partitioning a board, or "minimum capacity to ship packages within D days" are not obviously search problems at first glance — but the *answer* (max load, number of days) is monotonic: if capacity C works, every capacity greater than C also works. Binary searching over the range of possible answers and checking feasibility at each midpoint turns an apparently combinatorial problem into O(n log(range)).

      ### Rotated and 2D variants

      A rotated sorted array (like `[4,5,6,7,0,1,2]`) can still be binary searched in O(log n) by determining, at each step, which half is properly sorted and whether the target lies in that half. A row-and-column-sorted 2D matrix can be searched in O(m+n) by starting at a corner and eliminating a row or column each step, or in O(log(mn)) by treating it as a flattened 1D sorted array.

      ### Common mistakes

      Inconsistent loop-boundary conventions causing infinite loops; forgetting to verify the monotonicity assumption before binary-searching an answer space (if the predicate isn't actually monotonic, binary search silently gives a wrong answer, not an error); and using linear search out of habit on a problem that explicitly gives a sorted input as a hint.

      **Where this shows up:** "binary search on the answer" problems (allocate books, aggressive cows, Koko eating bananas, minimum days to make bouquets) are a favorite in OA rounds specifically because they're easy to grade and hard to solve without recognizing the pattern; classic binary search on sorted/rotated arrays is a common phone-screen warm-up.
