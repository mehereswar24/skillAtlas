  - slug: dsa-greedy-algorithms
    name: "Greedy Algorithms"
    domain: computer-science
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - dsa-sorting-algorithms
      - dsa-arrays
    summary: |-
      Interval scheduling, activity selection, and the exchange-argument mindset needed to tell a genuinely greedy problem from one that only looks greedy.
    content_md: |-
      A greedy algorithm makes the locally best choice at each step and never revisits it, hoping (and, when correct, *proving*) that a sequence of locally optimal choices produces a globally optimal result. The hard part isn't writing greedy code — it's almost always trivial — it's knowing whether greedy is actually correct for this problem, which many candidates skip and get bitten by.

      ### The exchange argument

      The standard way to justify a greedy approach is an exchange argument: assume some optimal solution doesn't make the greedy choice at the first point of difference, then show you can swap in the greedy choice without making the solution worse. Interval scheduling (choosing the maximum number of non-overlapping intervals) is the textbook example: sorting by end time and always picking the next interval that starts after the last chosen one's end is provably optimal, and the exchange argument is short enough to reproduce in an interview if asked to justify it.

      ### Sorting key matters

      Interval and scheduling problems are extremely sensitive to which key you sort by. Sorting activity-selection by end time (not start time, not duration) is what makes the greedy proof go through; sorting by the wrong key produces a plausible-looking but wrong algorithm that fails on specific counter-examples rather than obviously breaking.

      ### When greedy quietly fails

      0/1 knapsack (each item taken whole or not at all) is the canonical example where a greedy-by-value-density approach fails and the fractional relaxation (which greedy *does* solve correctly) doesn't transfer — 0/1 knapsack needs dynamic programming instead. This is the trap: a problem that superficially resembles a greedy success story can require full DP because an integrality constraint breaks the exchange argument. Always sanity-check a proposed greedy rule against a small adversarial example before committing to it.

      ### Common mistakes

      Assuming greedy works without either proving it or testing it against a counter-example; sorting by the wrong attribute in interval problems (start vs end vs duration); and applying a fractional-knapsack-style greedy rule to a 0/1-constrained version of the same problem.

      **Where this shows up:** interval-merging and scheduling problems ("merge intervals," "non-overlapping intervals," "meeting rooms") are common OA questions precisely because they look simple but have a subtle correctness argument; interviewers use greedy questions to test whether a candidate can articulate *why* an approach is correct, not just produce code that happens to pass the visible examples.
