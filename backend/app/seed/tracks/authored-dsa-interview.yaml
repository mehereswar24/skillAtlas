  - slug: dsa-sliding-window-two-pointers
    name: "Sliding Window & Two Pointers"
    domain: computer-science
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - dsa-arrays
      - dsa-strings-basics
    summary: |-
      Fixed and variable window techniques, and two-pointer sweeps on sorted data — the pattern that turns O(n^2) brute-force scans into O(n).
    content_md: |-
      Sliding window and two pointers are close cousins: both maintain a moving range or a pair of positions across a single pass instead of re-scanning from scratch, turning an apparent O(n^2) into O(n). Recognizing when a problem is shaped this way — usually anything asking for a max/min/count over a *contiguous* subarray or substring under some constraint — is one of the highest-leverage pattern-recognition skills in interview prep.

      ### Fixed vs variable window

      A fixed-size window (e.g., "max sum of any k consecutive elements") just slides one position at a time, adding the new element and removing the one that fell out — O(n) total instead of recomputing every window's sum from scratch. A variable-size window (e.g., "smallest subarray with sum ≥ target," "longest substring without repeating characters") grows the right edge until a condition is satisfied or violated, then shrinks the left edge to restore the invariant, tracking the best answer as it goes. The core discipline is maintaining a clear invariant about what's true inside the window at every step.

      ### Two pointers on sorted data

      When data is sorted (or can be cheaply sorted), two pointers starting from opposite ends — moving inward based on a comparison — solve pair-sum and three-sum-style problems in O(n) or O(n^2) instead of the O(n^2) or O(n^3) a brute-force nested loop would need. "Container with most water" and "3Sum" are the canonical examples: sort first, fix one element, then two-pointer-sweep the rest.

      ### Telling the two apart, and when to sort first

      Sliding window is about *contiguous* ranges over the original order (order matters, so you never sort first); two pointers is often used *after* sorting, when order doesn't matter and you're exploiting monotonicity. Using two pointers on unsorted data without realizing sorting is a prerequisite step is a common early mistake.

      ### Common mistakes

      Losing track of the window invariant while shrinking (off-by-one on whether the left boundary is inclusive or exclusive); forgetting to update a running count/sum/frequency map symmetrically when both growing and shrinking the window; and not sorting first when the two-pointer technique specifically depends on monotonic order.

      **Where this shows up:** sliding window and two pointers are among the highest-yield patterns for OAs — "longest substring without repeating characters," "minimum window substring," and "3Sum" are extremely commonly asked, and recognizing the pattern in the first minute is usually what separates a 15-minute solve from a 45-minute one.
