  - slug: dsa-sorting-algorithms
    name: "Sorting Algorithms"
    domain: computer-science
    est_hours: 8
    difficulty: beginner
    prerequisites:
      - dsa-complexity-analysis
    summary: |-
      The comparison-based sorts (bubble/insertion/selection through merge/quick/heap) plus the linear-time counting/radix/bucket sorts, and why sorting is usually a first step rather than the whole answer.
    content_md: |-
      Sorting rarely is the interview question by itself, but it is the single most common first move inside a larger problem — you sort, and then a two-pointer sweep, a greedy scan, or a binary search becomes possible. Knowing the sorting landscape well enough to pick the right one, and to know its cost, is foundational rather than optional.

      ### The two families

      Comparison-based sorts (bubble, insertion, selection, merge, quick, heap) can't beat O(n log n) in the worst case — that's a proven lower bound for any algorithm that only compares elements. Merge sort guarantees O(n log n) in all cases at the cost of O(n) extra space; quicksort is O(n log n) average but O(n^2) worst case unless the pivot is chosen well (randomized or median-of-three pivots make the bad case vanishingly rare in practice); heap sort is O(n log n) worst case and in-place, at the cost of poor cache locality compared to the other two.

      Non-comparison sorts (counting sort, radix sort, bucket sort) can beat O(n log n) — down to O(n + k) — but only when you know something extra about the values, like a bounded integer range. This is the trade candidates often miss: if a problem says "values are between 0 and 100," that's a hint counting sort applies.

      ### Stability matters more than it looks

      A stable sort preserves the relative order of equal elements. This matters whenever you sort by one key but need ties broken by original order or by a second key applied afterward — merge and insertion sort are stable, quicksort and heap sort typically are not. Interviewers occasionally probe this directly ("is your sort stable, and does it matter here").

      ### Quickselect as a sorting-adjacent trick

      When a problem only asks for the kth smallest/largest element rather than a full order, quickselect (the partition step of quicksort, recursing into only one side) answers it in O(n) average time — much better than sorting everything in O(n log n) just to throw most of the answer away. This is a frequent "can you do better" follow-up once a candidate proposes "sort then index."

      ### Common mistakes

      Forgetting that a supposedly in-place sort still uses recursion stack space (quicksort's O(log n) call stack, or O(n) in the unbalanced worst case) when asked about space complexity; picking quicksort with a fixed first-element pivot on data that's already sorted or reverse-sorted, silently degrading to O(n^2); and reaching for a full sort when quickselect or a counting approach would be asymptotically better.

      **Where this shows up:** sorting-adjacent OA questions ("merge intervals," "sort colors," "kth largest element") are extremely common early-round filters, and being able to justify *why* a particular sort (or avoiding a sort entirely) is optimal is a recurring onsite talking point.
