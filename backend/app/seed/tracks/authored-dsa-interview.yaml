  - slug: dsa-linked-lists
    name: "Linked Lists"
    domain: computer-science
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - dsa-arrays
    summary: |-
      Singly/doubly/circular lists, the dummy-head trick, fast-slow pointers for cycle detection, and reversal — the topic that tests pointer discipline directly.
    content_md: |-
      A linked list trades an array's O(1) random access for O(1) insertion/deletion at a known position and no need for contiguous memory. Interviewers like linked-list problems because they isolate pointer manipulation from everything else — there's no clever algorithm to hide behind, just careful, correct rewiring.

      ### The dummy-head trick

      Many linked-list problems (remove nth from end, merge two sorted lists, remove duplicates) get meaningfully simpler if you prepend a dummy node before the real head. This eliminates the need to special-case "what if we need to delete the head itself" — every deletion becomes "the node before this one points past it," uniformly, including for the original head. Skipping this trick is what causes most of the extra `if` branches candidates add (and often get wrong) for head-edge-cases.

      ### Fast-slow pointers

      Floyd's cycle-detection algorithm (a slow pointer advancing one step, a fast pointer advancing two) detects a cycle in O(1) space: if there's a cycle, the fast pointer eventually laps the slow one. The same technique finds the middle of a list in one pass (when fast reaches the end, slow is at the middle), and a variant finds the exact node where a cycle begins. This one idea covers a surprising fraction of "clever" linked-list interview questions.

      ### Reversal

      Reversing a singly linked list — fully, or in groups of k — is one of the most-asked whiteboard questions specifically because it's small enough to fully code in a few minutes but easy to get subtly wrong. The iterative version requires holding three pointers (previous, current, next) and rewiring one link at a time without losing the reference to the rest of the list.

      ### Common mistakes

      Overwriting a `next` pointer before saving a reference to the node it pointed to, which orphans the remainder of the list; forgetting to handle a 0-node or 1-node list as a base case; and not using a dummy head, which leads to duplicated logic for the head case versus every other case.

      **Where this shows up:** linked-list reversal and cycle detection are extremely common in phone screens and OAs precisely because they test pointer discipline in isolation — "reverse a linked list," "detect a cycle," and "merge two sorted lists" appear across nearly every entry-level interview loop.
