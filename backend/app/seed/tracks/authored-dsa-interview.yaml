  - slug: dsa-strings-basics
    name: "Strings"
    domain: computer-science
    est_hours: 8
    difficulty: beginner
    prerequisites:
      - dsa-arrays
    summary: |-
      Treating strings as char arrays, frequency-counting patterns, and the cost pitfalls of concatenation and immutability across languages.
    content_md: |-
      A string is, mechanically, an array of characters — nearly every array technique (two pointers, sliding window, prefix structures) applies directly. What makes strings their own topic is the language-level quirks around immutability and the handful of counting/matching patterns that recur across a huge share of string questions.

      ### Frequency counting

      A large fraction of string problems reduce to "count occurrences of each character" — anagram detection, checking if one string is a permutation of another, finding the first non-repeating character. A fixed-size array indexed by character code (for ASCII) or a hashmap (for full Unicode) both give O(n) counting; the choice matters for how you talk about space complexity (O(1) for a bounded alphabet vs O(k) for k distinct characters).

      ### Immutability and the concatenation trap

      In Java, Python, and JavaScript, strings are immutable — every concatenation `s = s + c` allocates a new string. Doing this inside a loop turns an intended O(n) algorithm into O(n^2) because each concatenation copies everything built so far. The fix is a mutable buffer (`StringBuilder` in Java, a list joined at the end in Python, an array in JavaScript joined once). This is one of the most common silent performance bugs in string-heavy interview code, and interviewers who know the language will notice it immediately.

      ### Recurring patterns

      Palindrome checks (two pointers from both ends), anagram grouping (sort each string or use its character-count signature as a hashmap key), longest common prefix (vertical scanning across all strings, or binary search on prefix length), and basic parsing/tokenization. These patterns feed directly into two-pointer and sliding-window techniques covered later in this track.

      ### Common mistakes

      Building strings with repeated concatenation in a loop; assuming case-insensitivity or trimming isn't needed when the problem statement doesn't say so explicitly (always ask); and forgetting that "reverse a string in place" isn't literally possible in languages where strings are immutable — you reverse into a new mutable structure instead.

      **Where this shows up:** string manipulation is a staple OA warm-up ("valid anagram," "group anagrams," "longest common prefix") precisely because it's easy to state and easy to auto-grade, and phone screens frequently open with a string-parsing question to see how a candidate handles edge cases (empty string, single character, all-same-character) before moving to harder topics.
