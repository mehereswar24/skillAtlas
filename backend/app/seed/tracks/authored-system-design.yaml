  # NEW SLUG: roadmap.sh has no rate-limiting node at all, which is a real gap -
  # it is the single most common admission-control mechanism in production and
  # the thing that makes the load-shedding chapter actionable at the edge.
  - slug: system-design-rate-limiting
    name: "Rate Limiting and Admission Control at the Edge"
    domain: architecture
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - system-design-asynchronism
      - system-design-load-balancers
    summary: |-
      The four counting algorithms and what each gets wrong, choosing the key you limit on, distributed counters and their race, and how a limit should respond so clients behave.
    content_md: |-
      Rate limiting is backpressure applied before work enters the system: a bound on how much any one client can consume, enforced at the cheapest possible point. It serves three separate purposes that are worth keeping distinct, because they want different limits. **Protection** stops one caller exhausting shared capacity. **Fairness** stops one tenant degrading the others. **Commercial** enforces a plan's quota. A single limit trying to do all three is usually wrong for at least two of them.

      ### The four algorithms

      **Fixed window.** Count requests per calendar minute; reset at the boundary. Trivial and memory-cheap, and it permits a burst of up to twice the limit across a boundary — 100 requests at 10:00:59 and 100 more at 10:01:00. Fine for coarse quotas, wrong for protecting a fragile dependency.

      **Sliding window log.** Keep a timestamp per request and count those within the trailing window. Exact, and it stores every timestamp, which is expensive at scale.

      **Sliding window counter.** Interpolate between the previous and current fixed windows, weighted by how far into the current one you are. Approximate, cheap, and it removes the boundary burst. This is the pragmatic default for API quotas.

      **Token bucket.** A bucket of capacity B refills at R tokens per second; each request takes one; empty means reject. Two parameters that map onto two real product questions: R is the sustained rate you will support, B is how large a burst you will forgive. This is what most systems should use, because real traffic is bursty and a limiter that forbids all bursts is one that rejects legitimate users. Leaky bucket is the variant that smooths output to a constant rate instead of allowing bursts, which suits protecting a downstream that cannot burst at all.

      ### What you limit on

      The key determines whether the limit works. **Per user or API key** is fair and requires authentication, so it cannot protect the login endpoint itself. **Per IP** covers unauthenticated traffic and misfires on shared NAT and corporate proxies, and is trivially evaded by a distributed attacker. **Per endpoint** recognises that a search costs a hundred times a health check. **Global**, as an absolute admission cap, is the backstop that protects the system when every per-key limit is individually satisfied.

      Layer them. A typical shape: a global admission limit, a per-tenant limit, a per-user limit on expensive endpoints, and a stricter per-IP limit on auth routes. Also consider limiting by cost rather than count where request cost varies by orders of magnitude — a GraphQL query or a report export should consume more tokens than a key lookup.

      ### Distributed enforcement

      Instances each holding a local counter enforce N times the intended limit, where N is the instance count. Dividing the limit by N breaks the moment traffic is uneven or the fleet scales.

      A shared store — Redis is the usual choice — fixes the correctness at the cost of a round trip per request and a new dependency on the request path. Do the check-and-decrement atomically, in a script or with an atomic increment, because read-then-write is a race that leaks capacity under exactly the load you are trying to limit. Then decide the failure mode explicitly: if the limiter store is unreachable, do you fail open (accept everything, and risk the overload) or fail closed (reject everything, and cause an outage from a limiter)? Fail open is usually right for commercial quotas, fail closed for abuse protection.

      The scalable compromise is local token buckets periodically reconciled against a central allocation: each instance requests a batch of tokens, spends them locally, and asks for more. Approximate, no per-request round trip, and it degrades gracefully.

      ### Responding so that clients behave

      Return 429 Too Many Requests, not 500. Include Retry-After, and expose the limit, the remaining allowance and the reset time in headers so a well-written client can pace itself instead of discovering the limit by hitting it. The response must be cheap — if rejecting costs as much as serving, the limiter cannot save you under attack, which is why the check belongs at the gateway or the edge rather than deep in the application.

      Ship it in observe-only mode first, logging what *would* have been rejected. The first real enforcement of a limit you have never measured is how you find the internal batch job that has been running at 40 times everyone else.

      ### Common mistakes

      Per-instance counters presented as a global limit. Fixed windows in front of something fragile. No burst allowance, so normal users are rejected. Limiting by request count when request cost varies wildly. Returning 500 instead of 429, so clients retry immediately. An expensive rejection path. And no plan for the limiter's own failure.

      **What you can do after this:** choose an algorithm and a key for a given endpoint, state the sustained rate and burst you will allow, and say what happens when the limiter's store is down.
