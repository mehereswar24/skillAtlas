  - slug: system-design-storage-engines
    name: "Storage Engines: B-Trees, LSM-Trees and Write Amplification"
    domain: architecture
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - system-design-databases
    summary: |-
      What happens underneath an insert — the write-ahead log, the two dominant index structures, and why the engine choice determines your write throughput, read latency and disk usage far more than the database's brand does.
    content_md: |-
      Databases are usually chosen by their query language and operated as black boxes. But the storage engine underneath determines the performance characteristics you will actually live with, and the two dominant designs have opposite trade-offs. This chapter is why a write-heavy workload behaves so differently on two systems that both call themselves databases.

      ### Durability first: the write-ahead log

      Before modifying data structures on disk, a database appends the intended change to a sequential log and flushes it. Only then does it modify anything else. If the process dies mid-operation, recovery replays the log. This is why durability is affordable: sequential appends are dramatically faster than random writes, on spinning disks and — less dramatically but still substantially — on SSDs.

      The subtlety that catches people: a write is durable only when it has reached stable storage, and every layer between your code and the platter caches. An `fsync` that is disabled, batched, or lying (as some consumer drives do) means acknowledged writes can vanish on power loss. Group commit — batching several transactions' flushes together — is how databases get throughput without abandoning durability, and it is why transaction latency sometimes looks quantised.

      ### B-trees: optimised for reads and updates in place

      A B-tree keeps keys sorted in fixed-size pages with a shallow, high-fanout tree above them. A lookup is a handful of page reads — typically three or four levels for very large tables, with the upper levels cached — so read latency is low and, importantly, *predictable*.

      Updates are made in place: find the page, modify it, write it back. That costs a random write per modified page, and when a page fills it splits, which is more random I/O.

      Costs to know. **Write amplification**: changing 100 bytes rewrites a whole page (typically 4–16KB), plus the WAL entry, so the physical write is far larger than the logical one. **Fragmentation**: pages end up partially full, so the index occupies more space than the data warrants. And **random write patterns**, which is why B-tree databases historically needed careful disk provisioning.

      This design suits read-heavy and update-heavy workloads with strict latency requirements, and it is what PostgreSQL, MySQL's InnoDB and most traditional systems use.

      ### LSM-trees: optimised for writes

      A log-structured merge tree buffers writes in a sorted in-memory structure (the memtable). When full, it is flushed to disk as an immutable sorted file (an SSTable) — one large sequential write. Background compaction merges these files, discarding superseded values and deleted keys.

      Writes are therefore *very* fast: an in-memory insert plus an occasional sequential flush, with no random I/O on the write path at all.

      Reads pay for it. A key might be in the memtable or in any of several on-disk levels, so a read may consult many files. Bloom filters (compact probabilistic structures that can say "definitely not here") eliminate most unnecessary file reads, and per-file sparse indexes narrow the rest. But read latency is inherently more variable than a B-tree's, and the worst case is worse.

      Costs to know. **Compaction is a background tax** that consumes CPU and disk bandwidth continuously and causes periodic latency spikes — and if writes outrun compaction, files accumulate, reads slow down, and the system can enter a degradation from which it does not recover without shedding write load. **Space amplification** from superseded values awaiting compaction. And **read amplification** from consulting multiple levels.

      This design suits write-heavy and ingest-heavy workloads, and it is what RocksDB, LevelDB, Cassandra and most modern high-ingest systems use.

      ### The three amplifications

      A useful frame for reasoning about any engine: **write amplification** (bytes physically written per byte logically written), **read amplification** (I/Os per logical read), and **space amplification** (bytes stored per byte of live data). You cannot minimise all three; every engine picks a point. B-trees favour read amplification, LSM-trees favour write amplification, and compaction strategy is essentially a dial between space and write amplification.

      ### What this means for you

      A write-heavy workload on a B-tree engine will hit an I/O ceiling that no query tuning fixes. A latency-sensitive point-read workload on an LSM engine will have a worse tail than expected. Neither is a defect; both are the design working as intended. And when someone reports that a database "got slow after a month", the answer is very often compaction falling behind or index bloat — both engine-level phenomena invisible from the query layer.

      ### Common mistakes

      Ignoring the engine entirely and being surprised by the performance profile. Disabling fsync for speed without accepting the durability consequence in writing. Treating compaction spikes as anomalies rather than as the design. Sizing disks for data volume without headroom for space amplification and compaction scratch space. And benchmarking with a dataset small enough to fit in memory, which hides every characteristic discussed here.
