  - slug: system-design-caching
    name: "Caching: Placement, Policy and the Invalidation Problem"
    domain: architecture
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - system-design-latency-vs-throughput
      - system-design-databases
    summary: |-
      Where to put a cache, the four read/write strategies and what each does on failure, eviction and TTL policy, and why invalidation is genuinely one of the hard problems.
    content_md: |-
      Caching is the highest-leverage performance technique available, and the one that most reliably introduces correctness bugs. It works because access is skewed — a small fraction of data serves most requests — so a cache small enough to be cheap absorbs most of the load.

      ### Where a cache can live

      **In the client.** Browser cache, mobile app storage. Zero network cost, and no way to invalidate — whatever TTL you sent, you live with. Never cache anything here you might need to revoke quickly.

      **At the edge / CDN.** Covered in its own chapter. Best for static and semi-static content.

      **In the application process.** A local in-memory map. Nanosecond access, no network. Three costs: each instance has its own copy, so the hit rate falls as you scale out; each holds its own possibly-different value, producing inconsistency between instances; and memory competes with the application.

      **In a shared cache tier.** Redis or Memcached. One copy, consistent across instances, survives deploys, scales independently. Costs a network round trip (still fifty times cheaper than most database queries) and is a new dependency you must decide how to survive without.

      **Inside the database.** Buffer pools and query caches. Free, and invisible — but do not count on them: a buffer pool cache miss under memory pressure is exactly when your database gets slow.

      Real systems layer these, and layering means an invalidation must propagate through every layer or a stale value survives in one of them.

      ### The read strategies

      **Cache-aside (lazy loading).** The application checks the cache; on a miss it reads the database and populates. The default, and the one most people mean. Only requested data is cached; a cache failure degrades to a slower system rather than a broken one; the cost is that the first request for anything is slow, and that the read-miss-write sequence has a race that can leave a stale entry.

      **Read-through.** The cache itself loads on a miss. Cleaner application code, and the cache is now on the critical path — if it is down, everything is down.

      ### The write strategies, and what each does on failure

      **Write-through.** Write to cache and database together. The cache is never stale; every write pays both costs; and you cache data that may never be read.

      **Write-behind (write-back).** Write to cache, acknowledge, flush to the database asynchronously. Very fast writes and excellent for write-heavy bursts — and a cache node failure loses acknowledged writes. Only acceptable when the data can tolerate it.

      **Write-around.** Write to the database, bypassing the cache; the entry is loaded on next read. Avoids polluting the cache with write-only data, at the cost of a guaranteed miss after every write.

      ### Invalidation is the hard part

      Three broad approaches, in increasing order of correctness and cost.

      **TTL.** Entries expire after a fixed time. Simple, self-healing, and staleness bounded by the TTL. Almost always the right starting point, and the honest question is "how stale can this be", which the product can usually answer.

      **Explicit invalidation.** Delete the key when the underlying data changes. Fresher, and now every write path must know every cache key derived from that data. Miss one and you have a permanently stale entry — a bug that survives for as long as the value is never otherwise written.

      **Versioned keys.** Include a version or content hash in the key, so a change produces a new key and the old one simply ages out. This avoids invalidation entirely and is under-used; it is the technique behind hashed asset filenames.

      A specific race worth knowing: on update, deleting the cache entry and then writing the database allows a concurrent reader to repopulate the cache with the old value in between, leaving it stale indefinitely. Writing the database *first* and then deleting the cache entry is safer, and delaying a second delete slightly ("delayed double delete") closes most of the remaining window. There is no lock-free scheme that closes it entirely, which is why bounded TTLs remain valuable even alongside explicit invalidation — they cap how long any bug can persist.

      ### Eviction and sizing

      LRU is the sensible default; LFU suits workloads with a stable popular set; TTL-only suits data that is genuinely time-bounded. What matters more is size: the cache should hold the working set. Below that, hit rate collapses non-linearly, and a cache with a 40% hit rate may cost more than it saves once you count the added latency of the miss path and the memory bill.

      Measure hit rate, miss latency, eviction rate and memory pressure. A rising eviction rate is your early warning that the working set has outgrown the cache — usually well before anyone notices the latency.

      ### The question that decides your design

      What happens when the cache is empty or unavailable? If the answer is "the database melts", the cache is a **hard dependency** and your availability is capped by it, whatever the diagram says. Systems that survive cache loss either have a database that can carry the load, or shed traffic deliberately rather than passing it all through. Decide this before you need to know, because a cold cache after a cache-tier restart is a very common way to discover it.

      ### Common mistakes

      Caching without measuring hit rate. Unbounded TTLs plus explicit invalidation that misses a path. Caching personalised data under a shared key — the most dangerous cache bug there is, since it serves one user's data to another. Caching authorisation decisions for longer than the revocation requirement. Local caches assumed to be consistent across instances. And no plan for a cold cache.
