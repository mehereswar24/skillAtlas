  # REPURPOSED TERMINOLOGY: roadmap.sh names this node "master-slave". The
  # mechanism is unchanged, but the industry (PostgreSQL, MySQL, Redis, Kafka
  # and the Kubernetes project among others) has moved to primary/replica and
  # leader/follower, and teaching the current vocabulary matters. The slug is
  # kept so nothing referencing it is orphaned.
  - slug: system-design-master-slave
    name: "Leader–Follower Replication and the Lag You Will Feel"
    domain: architecture
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - system-design-performance-vs-scalability
    summary: |-
      One writable leader, many read replicas — the standard answer to read scaling, and the replication lag that turns "I just saved it and it's gone" into your most common bug report.
    content_md: |-
      The first thing that breaks when a read-heavy system grows is the database's read capacity. The standard fix is replication: one node accepts writes and streams its changes to followers that serve reads.

      ### How it works

      The leader records every write to a log — PostgreSQL's write-ahead log, MySQL's binlog — and followers apply that log in order. Because they apply the same operations in the same sequence, they converge on the same state. Followers can serve reads, take backups without loading the leader, and stand ready for promotion.

      The choice that determines the system's character is **when the leader considers a write done**:

      **Asynchronous.** The leader commits and acknowledges immediately, streaming to followers whenever. Writes are fast, the leader is unaffected by slow or absent followers — and if the leader dies before a write reaches any follower, that write is *lost*. Acknowledged, and gone. This is the default nearly everywhere, and its data-loss window is the number you should know for your system.

      **Synchronous.** The leader waits for a follower to confirm before acknowledging. No loss on failover, but write latency now includes a round trip to the follower, and if that follower stalls, writes stall with it. Fully synchronous replication to all followers means any single follower failure blocks all writes, which is why nobody does it.

      **Semi-synchronous / quorum.** Wait for one follower (or a majority) and let the rest be asynchronous. This is the sensible middle and what most production deployments use: durability against single-node loss, bounded latency cost, and no dependence on any one follower.

      ### Replication lag is the real subject

      Followers are behind. Usually by milliseconds; during a bulk import, a long-running transaction, a schema change, or a network hiccup, by seconds or minutes. Every read from a follower may return stale data, and this produces a family of user-visible bugs that are hard to reproduce because they depend on timing.

      **Read-your-own-writes.** A user posts a comment, the write goes to the leader, the page reloads, the read hits a follower that has not caught up, and their comment is missing. They post it again. The fixes: route reads to the leader for a short window after that user's write; route by session; or have the client pass the log position it wrote at and require the replica to have reached it.

      **Monotonic reads.** A user refreshes twice, hits two replicas with different lag, and sees data go *backwards*. Sticky routing — a given user always reads from the same replica — prevents this.

      **Consistent prefix.** With sharded or parallel replication, a reader can see an effect before its cause: an answer appearing before the question it responds to. Preserving causal ordering, or partitioning so causally related writes share a partition, is the remedy.

      The critical design point: these are not database bugs, they are the *contract*. You must decide, per read path, whether it tolerates staleness. Most reads do — a follower count that is two seconds old harms nobody. A few emphatically do not: the balance check before a withdrawal, the permission check before an action, the read-back after a write in the same user flow. Route those to the leader deliberately, and know that doing so consumes the leader capacity replication was meant to save.

      ### Failover and its hazards

      When the leader dies, a follower is promoted. Three things routinely go wrong. **Lost writes**: with asynchronous replication, whatever had not reached the new leader is gone, and if the old leader returns and its extra writes are discarded, that discard must be handled explicitly. **Split brain**: the old leader is alive but partitioned, still accepting writes, and now two nodes believe they are the leader — this needs fencing, covered shortly. **Cascading overload**: the new leader starts with a cold cache and is immediately hit with full production traffic, and falls over.

      ### What replication does not solve

      It does not scale writes: every write still goes through one node. It does not reduce storage: every node holds everything. And it is not a backup, because it replicates your mistakes faithfully and instantly.

      ### Common mistakes

      Sending all reads to replicas without classifying which tolerate staleness. Not monitoring replication lag, and not alerting on it. Assuming failover is automatic and correct without ever testing it. Believing a replica is a backup. Adding replicas to fix a write bottleneck. And running a long analytical query on a replica that is also serving user reads, blocking log replay and pushing lag into the minutes.
    resources:
      - kind: doc
        title: "PostgreSQL: high availability, load balancing and replication"
        url: "https://www.postgresql.org/docs/current/high-availability.html"
      - kind: doc
        title: "PostgreSQL: hot standby and replication lag"
        url: "https://www.postgresql.org/docs/current/hot-standby.html"
      - kind: doc
        title: "MySQL: replication documentation"
