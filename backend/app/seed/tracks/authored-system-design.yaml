  - slug: system-design-idempotent-operations
    name: "Idempotency: Making Retries Safe Enough to Rely On"
    domain: architecture
    est_hours: 6
    difficulty: advanced
    prerequisites:
      - system-design-messaging
      - system-design-background-jobs
    summary: |-
      Why the unknown outcome forces idempotency on you, idempotency keys and where to store them, natural versus synthetic keys, and the concurrency cases people get wrong.
    content_md: |-
      Every previous chapter has deferred to this one. Retries are mandatory, at-least-once delivery is what you actually get, and a timeout leaves you unable to tell whether the work happened. The only way out is to make repeating an operation harmless. Idempotency is not a nicety in distributed systems; it is the property that makes the rest of the design admissible.

      An operation is idempotent if performing it more than once has the same effect as performing it once. Setting a balance to 100 is idempotent. Adding 100 to a balance is not. Most useful operations are of the second kind, so you build idempotency rather than find it.

      ### Idempotency keys

      The standard mechanism. The caller generates a unique key per logical operation — a UUID, generated once and *reused across retries of that same attempt*, which is the part people get wrong — and sends it with the request, conventionally as an Idempotency-Key header. The server records the key with the result of the first execution. On a repeat, it returns the stored result without re-executing.

      Four details decide whether this works.

      **Store the key and the result in the same transaction as the effect.** If you charge the card and then record the key in a separate commit, a crash between them produces the double charge you built this to prevent.

      **Handle the concurrent case, not just the sequential one.** Two retries can arrive at the same instant, so a check-then-act read is a race. Insert the key first with a unique constraint and let the database reject the loser; the loser then waits for or reads the winner's result. Returning "in progress" with a 409 and letting the client poll is an acceptable and honest alternative.

      **Return the original response.** A repeat should return the first result, not a fresh one and not an error. A client that retries and receives a 500 has learned nothing and will retry again.

      **Expire keys, and pick the window deliberately.** Keys stored forever become a large table; keys expired after an hour let a delayed retry through. Twenty-four hours is a common compromise; whatever you choose, it must exceed the longest possible retry window of any client, including a queue consumer draining a day-old backlog.

      A subtlety worth stating: the key must be scoped to the request payload. If a client reuses a key with different content, that is a client bug and the safe response is to reject it with a conflict rather than silently return the old result.

      ### Natural keys, which are better when they exist

      Sometimes the domain already provides uniqueness: an order number, a payment reference, a user-and-date pair for a daily summary. A unique constraint on it gives you idempotency with no extra machinery and no expiry problem. Prefer this. Synthetic keys are for when the domain genuinely has no natural identity.

      Two more techniques in the same family. **Conditional writes** — compare-and-set on a version number, or an UPDATE guarded by the version it expects — make a repeated write a no-op rather than a second increment; this is optimistic concurrency control and it also solves lost updates. And **state-machine guards**: an update that sets status to shipped only where status is currently paid affects zero rows the second time, which is exactly the behaviour you want, provided the code checks the affected-row count instead of assuming success.

      ### What HTTP already tells you

      GET, PUT and DELETE are defined as idempotent; POST is not. This is a real design lever: a PUT to a client-chosen URI is naturally safe to retry, which is why creating a resource at a caller-generated id is often better than POSTing to a collection. DELETE is idempotent in the sense that repeats leave the same state, so returning 404 on the second delete is defensible but 204 is friendlier to retrying clients.

      ### Where it usually goes wrong

      A new key generated per retry attempt, which defeats the entire mechanism. Keys stored in a cache that can evict them under memory pressure — this is durable state and belongs in the database. Idempotency implemented at the API edge while the message consumer behind it has none. Non-deterministic work inside the operation, so the stored result does not match what a re-execution would produce. Side effects outside the transaction, most commonly sending an email or calling a third party mid-operation. And "we will just check whether it already exists first", which is a race, not a solution.

      **What you can do after this:** take a non-idempotent write, add a key and a uniqueness constraint that survive two concurrent retries, and say exactly which transaction the key is recorded in.
