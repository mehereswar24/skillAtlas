  - slug: system-design-databases
    name: "Choosing a Datastore from Access Patterns"
    domain: architecture
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - system-design-consistency-patterns
    summary: |-
      Deriving the storage decision from queries, cardinality and consistency needs rather than from category labels — and why "start with PostgreSQL" is the right default far more often than architecture diagrams suggest.
    content_md: |-
      Database selection is where designs most often go wrong, because it is usually made by category ("we need NoSQL for scale") rather than by access pattern. The decision procedure is straightforward and almost nobody follows it.

      ### Ask these before naming any product

      **What are the queries?** Write them down. Not entities, queries. "Get a user by id." "List a user's last 50 orders, newest first." "Find all orders in a date range with status pending." "Aggregate revenue by region by month." The shape of that list determines everything.

      **What is the read/write ratio, and the volume?** From your estimation chapter. 500 writes per second is a different world from 500,000.

      **How much data, and how much of it is hot?** If the working set fits in memory on one machine, most distributed-storage arguments evaporate.

      **What consistency does each operation need?** Per the previous chapters, per operation.

      **What is the access distribution?** Uniform, or is 1% of keys taking 90% of traffic? Skew determines whether partitioning will help or simply relocate your problem.

      **How will the queries change?** Relational schemas accommodate unforeseen queries. Key-value and wide-column designs are optimised for the queries you knew about at design time, and answering a new one may require rewriting the data.

      ### The families, by what they are good at

      **Relational.** Flexible querying, joins, transactions, constraints, mature tooling, and decades of operational knowledge. Modern PostgreSQL also does JSON documents with indexing, full-text search, geospatial queries, arrays and range types competently. Its limit is horizontal write scaling, which requires sharding or an extension.

      **Key-value.** Get and put by key, extremely fast, trivially partitionable. No queries by anything but the key. Sessions, caches, feature flags, counters.

      **Wide-column.** Partition key plus clustering key, enormous scale, excellent for time-series and per-entity append-heavy data. Queries must follow the key structure; ad-hoc querying is not on offer.

      **Document.** Records as nested documents, flexible schema, good when data is naturally hierarchical and usually retrieved whole. Weak when you need to relate documents to each other, which is when you rediscover joins in application code.

      **Search.** Inverted indexes for text relevance, faceting, fuzzy matching. Should be a derived index fed from a system of record, never the system of record itself.

      **Graph.** Relationship traversal of arbitrary depth. Genuinely better than recursive SQL when traversal depth is unbounded and the graph is the point.

      **Time-series and columnar/analytical.** Compressed, ordered by time or column, built for aggregate scans over huge ranges. Do not run analytics on your transactional database beyond a certain size, and do not run transactions on your warehouse.

      ### The default, argued honestly

      For most systems, start with one well-run relational database. It handles more load than people assume — tens of thousands of transactions per second on decent hardware — and it gives you transactions, constraints and ad-hoc queries, which is exactly what you need while the product is still changing. The overwhelmingly common failure is choosing a specialised store early for a scale that never arrives, and paying for it in every feature that then needs a query the data model cannot serve.

      Adopt something else when you have a measured reason: a proven write throughput ceiling, a query shape the relational model serves badly, or a genuine scale requirement. And note that "we need multiple databases" is usually true eventually — a relational system of record, a cache, a search index, an analytical store — which raises the real cost: keeping them consistent with each other, a problem the events and migration chapters address.

      ### Common mistakes

      Choosing by category rather than by query list. Assuming relational cannot scale, having never measured. Assuming a document store removes the need for a schema — it moves the schema into your application, where it is enforced by nobody. Using search as a system of record. Running analytics against the transactional replica until replication lag becomes an incident. Selecting a partition key before writing down the queries, which is the wide-column mistake that cannot be undone without a full migration. And introducing a second store without deciding how it stays in sync with the first.
