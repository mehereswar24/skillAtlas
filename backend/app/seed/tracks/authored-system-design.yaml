  - slug: system-design-performance-vs-scalability
    name: "Where One Box Stops: Vertical, Horizontal and the Shared Bottleneck"
    domain: architecture
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - system-design-latency-vs-throughput
    summary: |-
      The difference between making something faster and making it handle more, why adding machines eventually makes a system slower, and how to find the serialised resource that caps your scaling.
    content_md: |-
      Performance is how fast the system is for one user. Scalability is what happens to that when you add load and add resources. They are different problems and the fixes are different: a faster algorithm improves performance, and a system with a shared serialised bottleneck does not become scalable no matter how fast each part is.

      ### The honest case for scaling up first

      Vertical scaling — a bigger machine — is deeply unfashionable and frequently the correct answer. A single server today can have hundreds of cores and terabytes of memory, and modern hardware handles workloads that would have required a cluster fifteen years ago. Scaling up requires *no code changes*, no partitioning, no distributed transactions, no consistency compromise, no rebalancing, and no new failure modes. Its limits are that hardware has a ceiling, price rises faster than capability at the top end, and one machine is one failure domain.

      Horizontal scaling — more machines — is unbounded and gives you redundancy, and it costs you everything the previous paragraph listed. The right sequencing for almost every real system is: scale up until it is uncomfortable, scale out when you must, and know which of your components are stateless (easy) and which hold state (hard). Scaling out the stateless tier is nearly free; the database is where the real work is, which is why so much of this track is about data.

      ### Why adding machines can make things slower

      Naive intuition says N machines give N times the throughput. Two effects say otherwise.

      **Contention.** Some fraction of the work is serialised — a lock, a single leader, a shared counter, a coordination step. Amdahl's argument applies: if 5% of the work is serialised, you cannot exceed 20× speedup no matter how many machines you add. Finding that serialised fraction is the actual scalability work.

      **Coherency.** Nodes must agree with each other, and the cost of agreement grows with the number of participants — often quadratically, since every node may need to communicate with every other. Beyond some point, the coordination overhead exceeds the added capacity and *total throughput falls as you add machines*. The Universal Scalability Law captures both effects and produces a curve that rises, flattens, and then declines. Anyone who has watched throughput drop after adding nodes to a cluster has seen the right-hand side of that curve.

      The practical lesson: designs that avoid coordination scale, and designs that require agreement do not. This is why partitioning (where each shard is independent) scales well, why leaderless replication exists, and why "just add a distributed lock" is so often the change that caps a system's growth permanently.

      ### Finding the bottleneck

      At any moment exactly one resource limits you, and optimising anything else changes nothing. Load test until throughput plateaus, then determine what is saturated: CPU, memory bandwidth, disk, network, a connection pool, a lock, a single-threaded component, or a downstream dependency. Fix that one thing, and the bottleneck moves somewhere else — which is expected. Scalability work is an iterative game of chasing the bottleneck, and it ends when the next bottleneck is far enough away.

      Watch particularly for bottlenecks that are invisible in a resource graph: a global sequence generator, a shared cache node that every request touches, an autoincrement primary key that makes every insert hit the same index page, a single-threaded event loop, or one connection pool shared by everything. These show as latency with no obvious resource saturation, and they are the ones people miss.

      ### Common mistakes

      Scaling out a stateless tier that was never the bottleneck while the database quietly saturates. Believing scaling is linear. Adding nodes to a coordinating cluster past its optimum. Assuming a "stateless" service is stateless when it holds a local cache whose hit rate collapses as you add instances. Load testing with unrealistically uniform data, so hot keys and skew never appear. And never load testing at all, which means the bottleneck is discovered by customers.
