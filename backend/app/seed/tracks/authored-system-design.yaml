  - slug: system-design-rdbms
    name: "Relational Engines: Indexes, Query Plans, MVCC and Isolation"
    domain: architecture
    est_hours: 10
    difficulty: advanced
    prerequisites:
      - system-design-storage-engines
    summary: |-
      Getting a relational database to behave — index design and selectivity, reading an execution plan, how MVCC keeps readers and writers apart, and precisely which anomalies each isolation level still permits.
    content_md: |-
      Most systems' performance problems are database problems, and most database problems are a missing index, a plan the optimiser got wrong, or an isolation level nobody chose deliberately. This chapter is the highest-return material in the track for everyday work.

      ### Indexes and selectivity

      An index is a sorted structure mapping column values to row locations. It converts a full scan into a lookup, at the cost of extra storage and extra work on every write.

      **Selectivity** decides whether it helps. An index on a column with millions of distinct values is excellent. An index on a boolean is nearly useless, because matching half the table means the database must do a random read per match and then reassemble — often slower than reading the table sequentially. This is why the optimiser sometimes ignores your index and is *right* to.

      **Composite indexes are ordered, and the order is everything.** An index on `(tenant_id, created_at)` serves a filter on `tenant_id`, and a filter on `tenant_id` with a range or sort on `created_at`. It does *not* serve a filter on `created_at` alone. The leftmost-prefix rule is the single most common index misunderstanding.

      **Covering indexes** include every column a query needs, so the database answers from the index without touching the table at all. On a hot query this is frequently a several-fold improvement and costs only index size.

      Indexes are not free: each one is updated on every insert, update and delete, so an over-indexed table has slow writes. Audit for unused indexes; most databases can report index usage.

      ### Read the plan

      `EXPLAIN` shows what the optimiser intends; `EXPLAIN ANALYZE` shows what actually happened, with real timings and row counts. Comparing *estimated* rows against *actual* rows is the fastest diagnostic available: a large divergence means statistics are stale or the data is skewed, and the resulting plan is built on a false premise.

      Learn to recognise a sequential scan on a large table where you expected an index scan; a nested-loop join whose inner side is executed a hundred thousand times; and a sort that spilled to disk because the working memory was too small. Those three account for a large share of slow queries.

      ### MVCC: how readers and writers avoid each other

      Multi-version concurrency control keeps multiple versions of a row. A reader sees a consistent snapshot as of its transaction's start and never blocks a writer; a writer creates a new version and never blocks a reader. This is why relational databases handle mixed read/write workloads so well.

      The consequences are operational and important. Old versions must be cleaned up — PostgreSQL's autovacuum, InnoDB's purge — and if cleanup falls behind, tables and indexes **bloat**, and everything slows down. The classic cause is a long-running transaction: PostgreSQL cannot remove any version newer than the oldest open snapshot, so one forgotten idle-in-transaction session can block cleanup across the entire database for hours. Monitoring the oldest transaction age is a genuinely important alert that most teams do not have.

      ### Isolation levels and exactly what they allow

      This is where correctness bugs come from, because the default is often weaker than people assume.

      **Read committed** (the common default) sees only committed data, but each statement takes a fresh snapshot — so two reads in one transaction can return different values (non-repeatable read), and a set of rows can change between reads (phantoms).

      **Repeatable read / snapshot isolation** gives the whole transaction one snapshot. Repeatable reads, no phantoms in most implementations — but it permits **write skew**, which is the one worth understanding. Two transactions each read a condition, each verify it holds, and each write based on it; individually correct, jointly wrong. The canonical example: two on-call doctors each check "at least one other doctor is on duty", both see it is true, and both sign out. Snapshot isolation does not prevent this, and it is a real class of production bug.

      **Serializable** guarantees the result equals *some* serial ordering, eliminating write skew. The cost is either locking or an optimistic scheme that aborts conflicting transactions — meaning your application must be prepared to retry on a serialisation failure, which is a code requirement, not a configuration one.

      Practical guidance: know your default. If you have an invariant across rows that concurrent transactions could each independently validate, either use serializable and retry, or take an explicit lock (`SELECT … FOR UPDATE`), or enforce it with a database constraint. Do not assume a read-then-write is atomic; it is not.

      ### Connections are a scarce resource

      Each connection costs memory and, in PostgreSQL, a process. A few hundred is a lot. Application connection pools multiplied by application instances routinely exceed that, at which point new connections fail and the whole system stalls. Use a pooler in transaction mode, size pools deliberately — and remember Little's Law: the pool size you need is arrival rate times query duration, so a slow query silently multiplies your connection demand.

      ### Common mistakes

      Indexing every column. Composite indexes in the wrong order. Never reading a plan. Long-running or idle-in-transaction sessions blocking vacuum. Assuming read committed prevents anomalies it does not. Using serializable without retry logic. `SELECT *` on wide tables, defeating covering indexes. Running a migration that takes a table-rewriting lock during peak traffic. And N+1 query patterns from an ORM, which the antipatterns chapter takes up.
