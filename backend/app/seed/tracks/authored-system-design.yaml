  # REPURPOSED SLUG: roadmap.sh's "application layer" node is a one-line note
  # that the web tier should be separated from the app tier. The slug is kept
  # and now teaches service decomposition properly, because "where do I cut
  # this system" is the question that determines everything downstream.
  - slug: system-design-application-layer
    name: "Service Boundaries: Where to Cut a System, and Where Not To"
    domain: architecture
    est_hours: 7
    difficulty: intermediate
    prerequisites:
      - system-design-performance-vs-scalability
      - system-design-data-management
    summary: |-
      Why the monolith-versus-microservices argument is the wrong frame, what a boundary actually has to own, and the distributed monolith you get when you cut in the wrong place.
    content_md: |-
      "Should this be microservices?" is a question about organisational structure disguised as a question about architecture. The useful version is narrower: where can this system be cut so that the two halves can change, fail and scale independently? If no such cut exists, splitting the process only converts function calls into network calls, and network calls fail.

      ### What a boundary has to own

      A service boundary is worth drawing when the two sides differ in at least one of four ways.

      **They change for different reasons.** If a checkout change and a search change are always deployed together, the boundary between them is fictional. Cohesion of *change* is the strongest single signal.

      **They scale differently.** Image processing needs CPU and can queue; the login endpoint needs low latency and cannot. Splitting lets you buy the right hardware for each, and lets one absorb a spike without dragging the other down.

      **They have different availability requirements.** Payments must be up when recommendations are down. Sharing a process means sharing a fate.

      **They are owned by different teams.** This is Conway's law used deliberately rather than suffered: a boundary that does not match a team boundary becomes a coordination cost paid on every release.

      Notice what is not on the list: "it is a different noun." Splitting by entity — a User service, an Order service, a Product service — is the most common decomposition and the one that most reliably produces a distributed monolith, because almost every real operation touches several nouns at once.

      ### The data rule that makes it real

      A service owns its data or it is not a service. If two services read and write the same tables, they are one service with two deployment artefacts: a schema change requires coordinated deploys, and either can corrupt the other's invariants. Shared databases are the single most common reason a microservice migration delivers all of the operational cost and none of the independence.

      The consequence is uncomfortable and unavoidable: once data is split, cross-service reads become API calls or replicated copies, and cross-service writes become distributed transactions — which in practice means sagas with compensating actions, not two-phase commit. You have traded a database transaction for eventual consistency plus application-level rollback. That trade is sometimes right. It is never free, and it is the actual cost of the split.

      ### The distributed monolith

      This is the failure mode to recognise by name. Symptoms: services must be deployed in a particular order; a change to one requires a change to three; a single user request fans out through six synchronous hops; every service reads one shared database; and local development requires running the whole estate. You now have network partitions, serialisation overhead, partial failure and distributed debugging, in exchange for none of the independence those costs are supposed to buy.

      The synchronous fan-out deserves emphasis because it is quietly catastrophic for availability. Chain six services at 99.9% each and, if every call is required, the composite is 99.9% to the sixth power, about 99.4% — roughly four hours of downtime a month, from components that each looked fine. Availability composes multiplicatively along a dependency chain, so every additional required hop makes the system worse.

      ### The order that usually works

      Start with a modular monolith: one deployable, but with enforced internal module boundaries and no cross-module table access. It gives you transactions, one deploy, one place to debug, and — crucially — cheap boundary changes while you are still wrong about where the boundaries go. Extract a service when a specific module has earned it by hitting one of the four criteria above, and extract along the seam the modular structure already proved.

      Extract with the strangler pattern: route a slice of traffic to the new service behind a facade, keep the old path working, migrate the data, then remove the old path. Big-bang rewrites of a running system fail for reasons that have nothing to do with architecture.

      ### Common mistakes

      Choosing service granularity before understanding the domain. Splitting by noun rather than by rate of change. Sharing a database "temporarily". Building six services with one team. Synchronous chains where a queue would do. And treating "we use microservices" as an outcome rather than as a cost incurred for a specific, nameable benefit.

      **What you can do after this:** take a system you know, name the seam where it could be cut, and state which of the four criteria justifies the cut and what data ownership problem the cut creates.
