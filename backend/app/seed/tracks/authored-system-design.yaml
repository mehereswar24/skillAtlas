        title: "Jepsen: analyses of real replication and consistency behaviour"
        url: "https://jepsen.io/analyses"

  # REPURPOSED TERMINOLOGY: roadmap.sh names this "master-master". Kept as a
  # slug; taught as multi-leader *and* leaderless replication, because the
  # conflict-resolution problem is the same one and separating them obscures it.
  - slug: system-design-master-master
    name: "Multi-Leader and Leaderless Replication: The Conflict Problem"
    domain: architecture
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - system-design-master-slave
    summary: |-
      Accepting writes in more than one place buys availability and local latency and hands you conflicts — plus quorums, last-write-wins and why it silently loses data, vector clocks and CRDTs.
    content_md: |-
      Single-leader replication has one obvious limit: all writes go to one node, so write throughput is capped and users far from that node pay the latency. Allowing writes in multiple places removes both limits and creates a genuinely hard problem in exchange.

      ### Multi-leader

      Several nodes accept writes and replicate to each other. This is attractive for multi-region deployments (write locally, replicate globally), for offline-capable clients (a phone that accepts edits while disconnected is effectively a leader), and for collaborative editing.

      The problem is concurrent writes to the same record in different places. Both are accepted locally, both are valid, and now the system must decide what the value is. Unlike single-leader, there is no authority to serialise them.

      ### Leaderless and quorums

      The Dynamo-style alternative removes leaders entirely: clients write to several nodes and read from several nodes. With N replicas, W nodes acknowledging a write and R nodes consulted on a read, choosing **R + W > N** guarantees any read set overlaps any write set, so a read sees at least one copy of the latest write.

      The knobs are meaningful. W=N, R=1 gives fast reads and slow, fragile writes. W=1, R=N is the reverse. W and R at a majority is the balanced default. Setting R + W ≤ N gives faster operations and no guarantee of freshness, which is a legitimate choice for some workloads if made knowingly.

      Missing writes are repaired by **read repair** (when a read reveals a stale replica, update it), **hinted handoff** (a temporarily unreachable node's writes are held elsewhere and delivered when it returns), and **anti-entropy** background comparison, usually with Merkle trees to find differences efficiently. Note that quorum overlap is weaker than it sounds — concurrent writes, sloppy quorums, and failures mid-operation all admit cases where the guarantee does not hold, which is why Jepsen's analyses of these systems are worth reading.

      ### Resolving conflicts, from worst to best

      **Last-write-wins.** Attach a timestamp, keep the highest. Simple, and it *silently discards data* — the losing write vanishes with no error. Worse, it depends on clocks agreeing across machines, and clock skew means the "last" write may not be the latest one. LWW is acceptable only where losing a concurrent update is genuinely fine (a cache, a presence indicator, a last-seen timestamp). Using it for a shopping cart or an account balance is a data-loss bug waiting for a busy day.

      **Version vectors.** Each replica tracks a counter per node, so the system can *distinguish* a write that is causally newer from one that is genuinely concurrent. That is the important capability: LWW cannot tell "this update supersedes that one" from "these two happened independently", and version vectors can. Concurrent writes are then surfaced as siblings for someone to resolve.

      **Application-level merge.** Keep both versions and let business logic decide — Dynamo's shopping cart famously took the union of added items, on the theory that resurrecting a removed item annoys a customer far less than losing one they added.

      **CRDTs.** Conflict-free replicated data types are structured so that concurrent updates merge deterministically by construction: grow-only counters, sets with tombstones, sequences for collaborative text. Where your data fits one of these shapes, conflicts stop being a problem to resolve and become a property of the type. This is the most satisfying answer and the least generally applicable, since not every domain fits.

      ### When to accept this complexity

      Multi-leader and leaderless designs cost real complexity, and the honest recommendation is to avoid them unless you have a specific driver: writes that must succeed during a partition, users on multiple continents who cannot pay a cross-ocean write latency, offline-capable clients, or write throughput exceeding one node. Absent those, a single leader with followers is simpler and safer, and most systems never outgrow it.

      ### Common mistakes

      Enabling multi-region writes without deciding a conflict policy, so the database's default (usually LWW) silently eats data. Trusting wall-clock timestamps for ordering across machines. Assuming R + W > N gives linearizability — it does not; it gives a weaker overlap property. Ignoring that increments and decrements are especially dangerous under LWW, since two concurrent +1s become +1. And building this before establishing that a single leader is insufficient.
    resources:
      - kind: article
        title: "Dynamo: Amazon's Highly Available Key-value Store (SOSP 2007)"
        url: "https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf"
      - kind: book
        title: "Designing Data-Intensive Applications — multi-leader and leaderless replication"
        url: "https://dataintensive.net/"
      - kind: doc
        title: "CRDT.tech — conflict-free replicated data types"
        url: "https://crdt.tech/"
      - kind: article
        title: "Lamport: Time, Clocks, and the Ordering of Events in a Distributed System"
        url: "https://lamport.azurewebsites.net/pubs/time-clocks.pdf"
      - kind: article
        title: "Jepsen: consistency analyses of real distributed databases"
        url: "https://jepsen.io/analyses"
