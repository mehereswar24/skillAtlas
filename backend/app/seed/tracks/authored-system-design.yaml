      - kind: book
        title: "Understanding Distributed Systems — Roberto Vitillo"
        url: "https://understandingdistributed.systems/"

  # REPURPOSED SLUG: roadmap.sh uses `system-design-strategies` for a short note
  # on "scale up vs scale out" — which this track covers properly under
  # performance-vs-scalability. The slug is kept and now carries
  # back-of-the-envelope estimation, which the original syllabus omits entirely
  # and which is the single most useful skill in the subject.
  - slug: system-design-strategies
    name: "Back-of-the-Envelope Estimation"
    domain: architecture
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - system-design-introduction
    summary: |-
      Turning "10 million users" into requests per second, gigabytes per day and a machine count — plus the latency and throughput numbers worth memorising, and the ratio that decides most architectures.
    content_md: |-
      Estimation is the skill that makes every later chapter concrete. Without it, "we need to scale" is a feeling. With it, you can show in ninety seconds that a proposed design needs four servers or four hundred, and that changes the conversation entirely.

      ### The numbers worth knowing by heart

      Orders of magnitude, not precision. Reading 1MB sequentially from memory is tens of microseconds; from an SSD, a few hundred microseconds; from a spinning disk, several milliseconds. An SSD random read is on the order of 100 microseconds. A round trip within a datacentre is around half a millisecond; across a continent, tens of milliseconds; across the world, 100–200ms, floored by the speed of light in fibre — which is why no amount of engineering makes a synchronous cross-continental round trip fast, and why that fact drives multi-region design.

      For capacity: a modern server handles thousands of simple requests per second; a well-indexed relational database does thousands to low tens of thousands of simple queries per second per node; a single Redis node does on the order of 100,000 operations per second. Treat these as starting points to be sanity-checked, not as facts.

      Useful conversions: 1 million requests/day is about 12 per second. 100 million/day is about 1,200 per second. A year is roughly 30 million seconds. 2^10 is a thousand, 2^20 a million, 2^30 a billion — so a 32-bit integer identifier caps at about 2 billion, which is a real design constraint that real systems have hit.

      ### The method

      Start from users, not from requests. Daily active users, times actions per user per day, gives daily requests. Divide by 86,400 for the average rate. Then multiply by a peak factor — real traffic is not uniform, and 2–5× average at peak is a reasonable assumption for a consumer product with one dominant time zone, more if there is a scheduled event.

      Then compute the **read/write ratio**, which is often the most decision-relevant number in the whole problem. 100:1 reads to writes says caching and read replicas will carry you a very long way. 1:1 says they will not, and the write path is your real problem.

      For storage: bytes per record, times records per day, times retention, times a replication factor, plus indexes (frequently as large as the data). Then ask the question that reframes many designs: does the *hot* subset fit in memory on one machine? A working set of 40GB fits comfortably in RAM today, and a design that recognises this avoids an enormous amount of complexity.

      For bandwidth: requests per second times average payload. This is where video, images and unpaginated JSON responses reveal themselves as the actual constraint.

      ### A worked example

      A URL shortener with 100 million new links per month and a 10:1 read ratio. Writes: 100M / 30 / 86,400 ≈ 40 per second, peak perhaps 200. Reads: 400 per second, peak 2,000. Storage: assume 500 bytes per record including the original URL and metadata, so 100M × 500B = 50GB per month, 600GB per year, a few terabytes over five years with replication.

      What that tells you immediately: 40 writes per second is nothing — one database handles it. 2,000 peak reads per second is well within a cache plus a couple of replicas. Several terabytes exceeds comfortable single-node memory but not single-node disk. So the honest answer is that this system does not need sharding for years, and a design that shards on day one is over-engineered. That conclusion is worth more than any diagram, and you cannot reach it without the arithmetic.

      ### Common mistakes

      Using average load and forgetting the peak. Forgetting the replication factor and the index overhead in storage estimates. Estimating in bits when you meant bytes, an eightfold error that invalidates everything after it. Quoting suspiciously precise numbers — 847,392 requests per second signals false confidence; "roughly a million" is the honest and more useful statement. Ignoring metadata and indexes, which can double storage. And, most commonly, doing the arithmetic and then not using it — the estimate exists to *decide* something, so say what it decided.
    resources:
      - kind: article
        title: "Interactive latency numbers every programmer should know"
        url: "https://colin-scott.github.io/personal_website/research/interactive_latency.html"
      - kind: article
