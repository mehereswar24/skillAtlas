  - slug: system-design-load-balancers
    name: "Load Balancing: Algorithms, Health and Why Round-Robin Is Usually Wrong"
    domain: architecture
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - system-design-domain-name-system
      - system-design-latency-vs-throughput
    summary: |-
      Distributing requests across backends — L4 versus L7, why least-outstanding-requests beats round-robin, the gRPC/HTTP-2 imbalance problem, and load balancing as an availability mechanism.
    content_md: |-
      A load balancer distributes work and, more consequentially, decides which backends are considered alive. Its algorithm determines your tail latency, and its health checking determines whether a partial failure stays partial.

      ### Layer 4 versus layer 7

      **L4** forwards TCP connections without inspecting them: fast, cheap, protocol-agnostic, and it balances *connections* rather than requests. **L7** parses HTTP, balances per request, and can route by path or header, retry idempotent requests, terminate TLS, rewrite headers and inject tracing context.

      The distinction becomes critical with multiplexed protocols. An HTTP/2 or gRPC client opens one long-lived connection and sends thousands of requests over it. An L4 balancer assigns that connection to one backend and everything on it goes there — so a handful of clients can pin nearly all your load onto a couple of backends while the rest sit idle. The fixes are an L7 balancer that understands streams, a client-side balancer that opens connections to many backends, or forcing periodic connection recycling with a maximum connection age.

      ### The algorithms

      **Round-robin** assumes every request costs the same and every backend is equally able. Neither holds: instances differ in host quality, cache warmth and garbage-collection state. Round-robin keeps feeding a struggling instance at full rate, so your slowest backend sets your tail latency.

      **Least outstanding requests** sends the next request to the backend with fewest in flight. This is self-correcting — a slow backend accumulates in-flight requests and automatically receives less — and it is the better default for almost all HTTP traffic. **Power of two choices** approximates it cheaply: pick two backends at random and send to the less loaded of the two, which gets nearly all the benefit without global state and is what many distributed balancers use.

      **Consistent hashing** routes by key, giving cache locality and session affinity where a backend holds per-key state.

      **Weighted** variants shift proportions gradually and are the mechanism canary deployments are built on.

      **Session affinity** should be a considered decision, not a default. It undermines even distribution and makes every deploy and scale-in disruptive to the pinned users.

      ### Load balancing as an availability mechanism

      Beyond distribution, a good balancer improves availability directly:

      **Health checks** remove failed backends — with the crucial caveat from the failover chapter that checks testing shared dependencies remove *everything* at once. Keep them local and cheap, and fail open when all backends are failing.

      **Outlier detection** ejects a backend whose error rate or latency diverges from its peers, temporarily and with automatic re-admission. This catches grey failure that health checks miss, and it is one of the highest-value features to turn on.

      **Retries** on idempotent requests hide transient failures — and must have a **budget** (a cap on retries as a fraction of total requests) or they amplify an overload into a collapse.

      **Connection draining** lets a removed backend finish in-flight work before shutdown, which is what eliminates the small burst of errors most teams accept as normal on every deploy.

      **Zone-aware routing** prefers same-zone backends to save cross-zone latency and transfer cost, while failing over across zones when local capacity is unhealthy.

      ### The balancer is also a failure domain

      It sees all your traffic. It has its own connection limits, its own CPU, its own configuration reloads. Make it redundant (multiple nodes behind anycast or DNS), monitor it separately from the backends, and know its limits — a balancer at its connection ceiling produces symptoms that look exactly like backend failure and will send you debugging in the wrong direction.

      ### Common mistakes

      L4 balancing for gRPC. Round-robin with heterogeneous backends. Health checks that test dependencies. Health check intervals so long that dead backends receive traffic for a minute. Retries with no budget. No draining. Sticky sessions by default. And no outlier detection, leaving grey failures to be found by users.
