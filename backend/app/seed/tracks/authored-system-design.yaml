  - slug: system-design-domain-name-system
    name: "DNS as Infrastructure: TTLs, Caching and Why DNS Failover Disappoints"
    domain: architecture
    est_hours: 5
    difficulty: intermediate
    prerequisites:
      - system-design-introduction
    summary: |-
      Resolution and its layers of caching, the record types that matter for architecture, DNS-based traffic routing, and the reasons a TTL you set is not a TTL anyone honours.
    content_md: |-
      DNS is the first thing in every request path and the last thing anyone monitors. It is also a genuinely distributed system with caching semantics you do not control, which makes it a poor mechanism for the thing people most often use it for: fast failover.

      ### How a lookup resolves

      A client asks a recursive resolver (its ISP's, its corporate network's, or a public one). If the answer is not cached, the resolver walks the hierarchy: root servers, then the top-level domain's servers, then your authoritative nameservers. The answer is cached at every step for the TTL.

      That caching is the point and the problem. It makes DNS scale to the entire internet, and it means a change you make takes effect at wildly different times for different users.

      ### Records worth knowing for design

      **A / AAAA** map a name to an IPv4 / IPv6 address. **CNAME** aliases one name to another and cannot coexist with other records at the same name, which is why it cannot be used at a zone apex — the practical constraint that leads to provider-specific ALIAS or ANAME records. **MX** for mail. **TXT** for verification and the SPF/DKIM/DMARC records. **SRV** for service discovery with port and priority. **CAA** restricts which certificate authorities may issue for your domain, a cheap and under-used control. **NS** delegates a subdomain, which is how you hand a zone to a different provider or team.

      ### Traffic management with DNS

      Authoritative providers can answer differently per query: **weighted** (a percentage to each address, used for gradual migration), **latency- or geo-based** (route to the nearest region), and **failover** (health-check the target and return an alternative when it fails).

      All of it is limited by the same thing: you control the answer, not the caching.

      ### Why DNS failover disappoints

      You set a 60-second TTL and assume traffic moves in a minute. In practice:

      - Some recursive resolvers enforce a minimum TTL and ignore short ones.
      - Browsers cache DNS independently of the OS.
      - **Many application runtimes cache DNS resolutions for the lifetime of the process** — historically the JVM's default was to cache successful lookups forever. A long-running service that resolved a hostname at startup will keep using that address indefinitely, no matter what your zone says.
      - Connection pools hold established TCP connections that do not re-resolve at all, so an idle pooled connection to the old address survives every DNS change.

      The observed result is a long tail: most traffic moves quickly, and a meaningful fraction continues hitting the old address for hours. That is acceptable for a planned migration and unacceptable as your primary failover mechanism. For fast failover, use something in the data path — anycast, a load balancer that repoints its backends, or a proxy — and use DNS for slow, planned movement.

      ### Operating DNS

      Use multiple nameservers, ideally across providers; DNS provider outages have caused some of the largest internet-wide incidents on record, and a single provider is a single point of failure for everything you own. Lower TTLs *before* a planned change (a day ahead, so caches expire at the old TTL) and raise them after. Monitor resolution from outside your network, from several regions. Watch for expiring domains — domain expiry is an embarrassing and entirely preventable outage. And treat zone files as code in version control, because a manual edit to a production zone is a change with global blast radius and no review.

      ### Common mistakes

      Relying on DNS for fast failover. Setting a low TTL at the moment of the change rather than in advance. Assuming clients honour TTLs. Ignoring runtime-level DNS caching. A single DNS provider. No CAA record. Forgetting that a certificate and a DNS change often need to be coordinated. And no monitoring of resolution itself, so a zone problem is reported by customers rather than by your alerting.
