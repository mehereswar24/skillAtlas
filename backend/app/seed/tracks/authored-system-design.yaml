  # REPURPOSED SLUG: roadmap.sh's "data management" node is a loose grouping.
  # Kept as a slug and given the specific, hard problem it gestures at:
  # partitioning data across machines, and rebalancing it while live.
  - slug: system-design-data-management
    name: "Sharding, Rebalancing and Hot Keys"
    domain: architecture
    est_hours: 9
    difficulty: advanced
    prerequisites:
      - system-design-rdbms
      - system-design-nosql
    summary: |-
      Splitting data across machines when replication is no longer enough — range versus hash partitioning, consistent hashing, resharding without downtime, and the skew that defeats all of it.
    content_md: |-
      Replication scales reads. When writes or data volume exceed one machine, you must partition: each shard owns a subset of the data and its own writes. This is the point at which a system becomes genuinely distributed, and a great deal of previously easy work becomes hard.

      ### Range versus hash

      **Range partitioning** assigns contiguous key ranges to shards. Range scans are efficient because adjacent keys are co-located, and rebalancing is easy — split a range in two. The problem is skew: if keys are timestamps or sequential identifiers, all new writes land on the last shard, giving you a permanent write hot spot.

      **Hash partitioning** hashes the key and assigns by hash value. Distribution is excellent and hot spots are unlikely. But range queries are destroyed, because adjacent keys are scattered across every shard, so "all orders in March" becomes a scatter-gather over the whole cluster.

      Many systems use both: hash the partition key to place data, then range-order by a clustering key within the partition. That gives even distribution across shards and efficient ranges within one, which is why the wide-column key model looks the way it does.

      ### Consistent hashing, and what it fixes

      Naive `hash(key) mod N` is a trap: changing N remaps almost every key, so adding one node means moving nearly all the data. For a cache, that means a near-total miss rate at exactly the moment you added capacity because you were struggling.

      Consistent hashing places nodes and keys on a ring; a key belongs to the next node clockwise. Adding or removing a node moves only the keys between it and its neighbour — roughly 1/N of the data rather than all of it. Because a small number of nodes gives uneven arcs, implementations use **virtual nodes**: each physical node occupies many ring positions, which smooths distribution and spreads a departing node's load across all survivors rather than dumping it on one neighbour.

      The alternative widely used in databases is a **fixed number of partitions** — create far more partitions than nodes at the outset, and assign whole partitions to nodes. Rebalancing moves partitions, never individual keys, and the mapping is explicit rather than computed. It is simpler to reason about and to operate; its constraint is that the partition count is chosen up front and is awkward to change.

      ### Rebalancing while live

      Resharding a running system without downtime is the hardest operation in this chapter, and the shape is always the same: start replicating the moving partition to its new home while the old home still serves; catch up; verify; then atomically flip the routing; keep the old copy briefly in case you must roll back; then delete it.

      Throttle it. Rebalancing competes with production traffic for disk and network, and an unthrottled rebalance during peak load is a self-inflicted incident. Prefer explicitly triggered rebalancing over fully automatic — automatic rebalancing triggered by a node that is merely *slow* will start moving data during an overload, which is precisely the wrong moment.

      ### What you lose

      **Cross-shard joins and transactions.** Both become application problems, or require two-phase commit with its own availability cost. Design so the common operations touch one shard.

      **Global constraints.** Uniqueness across shards requires coordination.

      **Global secondary indexes.** Either the index is local per shard (so querying it means scatter-gather) or global (so writes must update a remote index, which is now a distributed write).

      **Scatter-gather latency.** A query touching all shards is as slow as the slowest shard, which is the fan-out tail-latency problem from earlier.

      ### Hot keys defeat everything above

      A single celebrity key — a viral post, a popular product, one enormous tenant — receives a share of traffic that no partitioning scheme fixes, because all of that traffic is legitimately for one key. The answers are not partitioning answers: cache the key aggressively in front of the store, replicate that key to several nodes and read from any, split it into subkeys aggregated at read time (a counter as N counters summed), or apply per-key rate limits. Detect them by tracking per-key request rates; if you cannot see hot keys, you will diagnose them as random cluster slowness.

      ### Common mistakes

      Sharding before it is necessary, incurring all the costs for capacity you do not need. Sequential or timestamp shard keys. `mod N` for cache placement. Rebalancing without throttling. Choosing a shard key that does not match the dominant query, so most queries scatter. No plan for cross-shard queries. And no hot-key detection, so the single most likely cause of uneven load is invisible.
