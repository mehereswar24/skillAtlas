  - slug: system-design-data-migrations
    name: "Changing Data Under a Live System"
    domain: architecture
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - system-design-data-management
    summary: |-
      Online schema change, expand-contract, dual writes, backfills and shadow reads — how to move a live system's data without downtime, and how to verify the new path before you trust it.
    content_md: |-
      Every design in this track eventually needs to change: a new column, a different partition key, a move to a different store entirely. Doing that to a system that cannot stop is a distinct engineering skill, and it is the one most conspicuously absent from system design curricula despite being a large part of senior work.

      ### The constraint that shapes everything

      During any migration, two versions of your code and two shapes of your data coexist. Every step must therefore work with both, and — critically — must remain **reversible**, because discovering the new path is wrong is common and discovering you cannot go back is catastrophic.

      ### Expand-contract, in separate deployments

      The general pattern, applied to a column rename:

      1. **Expand.** Add the new column, nullable, no default that rewrites the table. Deploy code that writes *both* old and new, and still reads old. Nothing depends on the new column yet.
      2. **Backfill.** Populate the new column for existing rows in throttled batches, monitoring replication lag and load. Never a single unbounded `UPDATE` on a large table — it takes long locks, generates enormous WAL volume, and blows out replication lag.
      3. **Verify.** Read from the new column, compare against the old, and log or count discrepancies without acting on them. This is the step people skip and the step that catches the bug.
      4. **Switch reads.** Deploy code reading the new column, still writing both. Now rollback is a single deploy away.
      5. **Contract.** Stop writing the old column. Later, in a separate deployment, drop it.

      Each step is a deployment. Combining them removes the rollback path, which is the entire point.

      ### Schema changes that lock

      Know what your database does for each operation. Adding a nullable column is usually instant metadata. Adding a column with a volatile default may rewrite the table. Adding an index locks writes unless created concurrently — and concurrent index builds can fail and leave an invalid index that must be cleaned up. Changing a column type usually rewrites. Adding a foreign key or check constraint takes a validating scan, which is why you add it `NOT VALID` and validate separately.

      For large tables, the online-schema-change tools take a different approach entirely: build a shadow table with the new schema, copy rows in batches while capturing ongoing changes via triggers or the replication log, then swap the tables atomically. This is how large systems alter huge tables without a maintenance window.

      ### Moving between stores

      Migrating a whole dataset to a different system follows the same shape at a larger scale:

      **Dual write.** Write to both old and new. Be aware this is not atomic — a failure between the two leaves them inconsistent, so you need reconciliation regardless. A more robust alternative is to write only to the old store and drive the new one from **change data capture**, tailing the replication log so the new store follows a single authoritative order and no application code has to be correct twice.

      **Backfill history.** Batched, throttled, resumable, and idempotent so a failed run can simply be restarted.

      **Shadow read.** Serve from the old store, simultaneously read from the new, compare, and report mismatches. Run this at production traffic for as long as it takes for the mismatch rate to reach zero and stay there. This is the step that converts hope into evidence, and it is worth days of patience.

      **Cut over gradually.** Move read traffic by percentage, monitoring. Then move writes. Keep the old store updated and functional for a rollback window measured in weeks, not hours.

      ### Backfills are jobs, and jobs need discipline

      A backfill over a billion rows will fail partway. Make it resumable from a checkpoint, idempotent so re-processing a batch is harmless, throttled with a knob you can turn down during an incident, and observable — progress, rate, error count, and estimated completion. A backfill that saturates the database at 2am and has no off switch is a recurring self-inflicted outage.

      ### Common mistakes

      Combining expand and contract in one deploy. Unbatched updates on large tables. Backfills with no throttle or kill switch. Dual writes with no reconciliation, assuming both succeed. Skipping shadow reads. Deleting the old data as soon as cutover completes, removing the rollback. Migrating during peak hours. And not testing the migration against a realistically sized dataset — a script that works on 10,000 rows tells you nothing about 10 billion.
