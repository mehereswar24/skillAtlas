  # REPURPOSED SLUG: roadmap.sh uses "types of caching" for a list of cache
  # locations, which this track covers in the previous chapter. The slug is kept
  # and now teaches cache failure modes — stampede, penetration, avalanche —
  # which is where caches actually cause outages and which the original omits.
  - slug: system-design-types-of-caching
    name: "Cache Failure Modes: Stampede, Penetration and Avalanche"
    domain: architecture
    est_hours: 6
    difficulty: advanced
    prerequisites:
      - system-design-caching
    summary: |-
      The three ways a cache turns into an outage generator, and the specific fixes — request coalescing, negative caching, jittered and probabilistic early expiry, and a plan for the cold start.
    content_md: |-
      A cache absorbing 99% of your read load is also a system where a 1% miss rate becoming a 100% miss rate multiplies database traffic a hundredfold, instantly. Every one of the failure modes below is a version of that sentence.

      ### Stampede (thundering herd)

      A popular key expires. A thousand concurrent requests miss simultaneously. All thousand query the database for the same value, all thousand compute the same result, all thousand write it back. The database, sized for ten queries per second on that key, receives a thousand at once and stalls — which makes the requests take longer, which means more requests pile up behind them.

      Fixes, in order of usefulness:

      **Request coalescing (singleflight).** Only the first request for a missing key executes the load; the others wait on the same in-flight operation and share the result. This is the correct fix and it is a small amount of code — an in-process map of in-flight keys to futures. For coordination across instances, a short-lived distributed lock per key achieves the same at the cost of a cache round trip.

      **Probabilistic early expiry.** Rather than expiring at exactly T, each request computes a small probability of refreshing early, rising as the entry approaches expiry. Refreshes spread out over time, and the value is typically renewed *before* it expires, so nobody ever sees a miss on a hot key.

      **Serve stale while revalidating.** On expiry, return the stale value immediately and refresh in the background. Latency stays flat, the database sees one query, and users get data that is a few seconds old — nearly always the right trade.

      ### Penetration

      Requests for keys that **do not exist** miss the cache by definition, every time, and go straight to the database. Ordinary as a trickle; as an attack — requesting random non-existent identifiers — it is a way to bypass your cache entirely and point full traffic at your database.

      Fixes: **cache the negative result** with a short TTL, so "this does not exist" is itself a cache hit. Guard with a **Bloom filter** of known-existing keys, which answers "definitely not present" in memory without touching the database. And validate key format before looking anything up, so obviously malformed identifiers are rejected at the edge.

      ### Avalanche

      Many keys expire at once, and the whole cache effectively empties in an instant. The usual cause is entirely self-inflicted: a batch job populated ten million entries with an identical TTL, so they all expire in the same second, exactly one TTL later. Also caused by a cache node failing or restarting, taking its entire share of keys with it.

      Fixes: **jitter every TTL** — a random ±10% is enough to spread expiry across a window instead of a spike, and it costs one line of code. Spread cache warming rather than loading everything at once. Run the cache tier with enough nodes that losing one loses only a fraction of the keyspace, and use consistent hashing so that fraction is genuinely 1/N rather than everything.

      ### The cold start, which is all three at once

      Deploying a new cache cluster, restarting the cache tier, or failing over to a region whose cache is empty produces 100% misses across every key simultaneously. This is the most common way caches cause outages, and it is entirely predictable.

      Plan for it: warm the cache before taking traffic, ramp traffic gradually rather than switching at once, and — the important one — know whether your database can survive the uncached load at all. If it cannot, you must shed load during warm-up rather than let it through, because passing full uncached traffic to a database that cannot serve it produces a system that never recovers on its own. That failure mode gets its own chapter shortly.

      ### Common mistakes

      Identical TTLs across a bulk load. No coalescing on hot keys. No negative caching, so a scan of non-existent identifiers reaches the database unimpeded. Assuming the database can absorb a full cache miss without ever testing it. Restarting the cache tier during peak traffic. Treating an eviction-rate increase as noise when it is the leading indicator. And responding to a stampede by increasing the TTL, which lengthens the interval between stampedes without preventing any of them.
