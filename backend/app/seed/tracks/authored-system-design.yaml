  - slug: system-design-content-delivery-networks
    name: "CDNs and the Edge: Cache Keys, Purge and Origin Shielding"
    domain: architecture
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - system-design-caching
    summary: |-
      Serving from close to the user — how HTTP cache headers actually control a CDN, why the cache key is where bugs live, and how to cache dynamic and personalised content safely.
    content_md: |-
      A CDN is a globally distributed cache in front of your origin. Its first benefit is latency, since content is served from a nearby point of presence rather than across an ocean. Its second, often larger, benefit is that it absorbs the overwhelming majority of your traffic — a well-configured CDN can cut origin requests by an order of magnitude, which changes your capacity requirements more than any other single change.

      ### The headers that control it

      The CDN obeys HTTP caching semantics, so the headers your origin sends *are* the configuration.

      `Cache-Control: max-age=N` sets how long any cache may reuse a response. `s-maxage=N` overrides it for shared caches only, which is how you tell the CDN to hold something for a day while browsers hold it for a minute — very useful, because you can purge the CDN and cannot purge browsers.

      `stale-while-revalidate=N` permits serving a stale response while refreshing in the background, keeping latency flat during revalidation. `stale-if-error=N` permits serving stale content when the origin is failing — a genuinely valuable availability feature, since your site keeps working through an origin outage.

      `ETag` and `Last-Modified` enable revalidation: the cache asks "has this changed?" and the origin answers 304 with no body, saving bandwidth if not a round trip.

      `Vary` lists request headers that affect the response, and each distinct value creates a separate cached entry. `Vary: Accept-Encoding` is normal. `Vary: User-Agent` is a catastrophe, because there are effectively unlimited user-agent strings and your hit rate goes to nearly zero.

      `private` means "do not store in a shared cache", and it is what stands between a personalised page and a CDN serving one user's data to another.

      ### The cache key is where bugs live

      The CDN identifies content by a key derived by default from host, path and query string. Two consequences follow immediately.

      **Query parameters fragment your cache.** Marketing and analytics parameters mean the same asset is cached hundreds of times under different keys, wrecking the hit rate. Configure the CDN to ignore parameters that do not affect the response, or to normalise them to a canonical order.

      **Anything affecting the response and not in the key is a correctness bug.** If your origin varies the response by a cookie, an authorisation header or a geo header, and the CDN does not include that in the key, users receive each other's responses. This is the worst bug in this chapter, it has happened publicly to large companies, and it is why `private` and `no-store` on authenticated responses must be the default that you relax deliberately, never the setting you remember to add.

      ### Purging, and why versioning is better

      Purge (or invalidate) removes content from the edge. It takes seconds to minutes to propagate globally, is often rate-limited, and is by-URL, by-tag or purge-everything — the last of which empties your entire cache and sends full traffic to your origin, so it should be treated as an incident action rather than a deployment step.

      The better approach for assets is not to purge at all: put a content hash in the filename (`app.9f3a2b.js`), cache it immutably for a year, and deploy a new filename. Nothing is ever stale because nothing is ever reused. Reserve purging for the HTML or API responses that genuinely must change under a stable URL.

      ### Beyond static files

      **Dynamic content** can be cached for even a few seconds and still deflect enormous load — a homepage feed cached for 10 seconds during a traffic spike serves a hundred thousand requests from one origin call.

      **Origin shielding** designates one point of presence as an intermediate cache so that a global miss results in one origin request rather than one from every location — which matters most during exactly the events where content is popular everywhere at once.

      **Edge compute** runs small functions at the point of presence for routing, authentication, A/B assignment, header rewriting and personalisation, letting you keep a page cacheable while varying small parts of it.

      ### Common mistakes

      Caching authenticated responses in a shared cache. `Vary: User-Agent`, or `Vary: Cookie` on a site that sets a unique cookie per visitor — both destroy the hit rate or cause cross-user leaks. Query parameters in the cache key that should not be. Purge-everything in a deploy pipeline. No `stale-if-error`, so an origin blip becomes a user-visible outage the CDN could have absorbed. Not measuring cache hit ratio by content type. And assuming a CDN protects against traffic spikes when the uncacheable API path behind it is entirely unshielded.
