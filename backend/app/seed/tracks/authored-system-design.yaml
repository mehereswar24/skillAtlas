  - slug: system-design-nosql
    name: "Non-Relational Models and the Partition Key You Cannot Change"
    domain: architecture
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - system-design-storage-engines
    summary: |-
      Key-value, wide-column, document and graph stores — how each distributes data, why the partition key is the single most consequential decision, and single-table design for access-pattern-first modelling.
    content_md: |-
      Non-relational stores trade query flexibility for scale and predictable performance. The trade is worth making when you know your access patterns and they do not change much. It is a poor trade when you do not, and the way that poor trade manifests is a partition key you cannot change without rewriting your data.

      ### The partition key decides everything

      In every distributed store, data is divided by a partition key (sometimes hash key). That key determines which node holds a record, and therefore:

      - **Whether reads are efficient.** Reading by partition key goes straight to one node. Reading by anything else means scanning every partition, which is catastrophic at scale.
      - **Whether load is even.** If one key value gets a disproportionate share of traffic, one node saturates while the rest idle — and no amount of adding nodes fixes it.
      - **What can be atomic.** Operations within one partition can usually be transactional. Across partitions, usually not, or only expensively.

      Getting this wrong is the defining failure. Choosing `country` as a partition key for a global service means one enormous partition. Choosing `date` for a time-series means every write today hits one partition — a write hot spot that scales to exactly one node's capacity.

      Mitigations, in order of preference: pick a naturally high-cardinality, evenly-distributed key (a user or tenant identifier is usually right); if you must use a low-cardinality key, add a **write-sharding suffix** (`date#0` through `date#N`) and fan out reads across the suffixes; and for genuine celebrity keys, cache in front or split that specific key's data.

      ### Wide-column and the query-first model

      Wide-column stores use a partition key plus one or more **clustering keys** that determine sort order within the partition. This makes range queries within a partition extremely efficient — "the last 100 events for this device, newest first" is a single sequential read — and makes any other query shape difficult.

      Consequently, you model by writing down your queries first and designing tables to serve them, accepting **denormalisation** and duplicating the same data into several tables shaped for different queries. Storage is cheap; a scan across a hundred nodes is not. The cost is that updating a duplicated fact means updating it everywhere, which your application must do correctly, without transactions to help.

      ### Single-table design

      In key-value stores that support a sort key, the same logic leads to putting multiple entity types in one table with composite keys (`USER#123` / `PROFILE`, `USER#123` / `ORDER#456`), so one query retrieves a user and their recent orders together — the join, precomputed at write time. Secondary indexes provide alternative access paths, at the cost of extra storage and, when the index is eventually consistent, extra staleness to reason about.

      It is powerful and it is rigid. Adding a genuinely new access pattern may require a new index or a data migration, so it suits stable, well-understood domains far better than exploratory ones.

      ### Document and graph, briefly

      **Document stores** shine when data is naturally hierarchical and read as a unit, and when the shape varies. The trap is relationships: joining documents in application code loses transactionality and multiplies round trips. Also, a schemaless database does not remove the schema; it moves it into every piece of code that reads the data, where old-format documents live forever unless you migrate them.

      **Graph databases** are worth it when traversals are deep and variable — "friends of friends who work at companies in this sector". If your traversals are one or two hops, a relational join is faster and simpler.

      ### Common mistakes

      Choosing a partition key before enumerating the queries. Low-cardinality or monotonically increasing partition keys, producing hot partitions. Assuming secondary indexes are as cheap or as consistent as primary access. Scans in production because a query did not fit the key design. Denormalising without a plan for keeping copies in sync. Assuming "schemaless" means "no migrations". And adopting a non-relational store for scale you have not measured, then discovering the query you now need is the one the model cannot serve.
    resources:
      - kind: doc
        title: "DynamoDB: best practices for partition key design"
        url: "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-design.html"
