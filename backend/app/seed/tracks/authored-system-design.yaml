        url: "https://sre.google/books/"

  # REPURPOSED SLUG: roadmap.sh has separate nodes for "99.9% (three 9s)" and
  # "99.99% (four 9s)" containing little more than a minutes-per-year table.
  # That is one idea, not two. This slug keeps the arithmetic and adds what the
  # table conceals — that outage duration is distributed, not uniform, and that
  # the assumption of independence is usually false.
  - slug: system-design-99-9-availability-three-9s
    name: "Availability Arithmetic, and Where the Table Misleads You"
    domain: architecture
    est_hours: 4
    difficulty: intermediate
    prerequisites:
      - system-design-availability
    summary: |-
      What each nine actually permits in minutes, why the number tells you almost nothing about user experience, and the two assumptions behind availability arithmetic that are usually false.
    content_md: |-
      The nines table is the first thing everyone learns and the least useful thing they know. It is worth having, and it is worth understanding precisely what it does not tell you.

      ### The table

      Per 365-day year, and per 30-day month:

      - **99%** (two nines): 3.65 days/year, about 7.2 hours/month.
      - **99.9%** (three nines): 8.77 hours/year, about 43 minutes/month.
      - **99.95%**: 4.38 hours/year, about 22 minutes/month.
      - **99.99%** (four nines): 52.6 minutes/year, about 4.3 minutes/month.
      - **99.999%** (five nines): 5.26 minutes/year, about 26 seconds/month.

      Read the five-nines row carefully. Twenty-six seconds a month is less than the time it takes a human to acknowledge a page, let alone diagnose anything. Five nines is therefore not an operational target that people achieve by responding quickly; it is only reachable with automatic failover that requires no human in the loop, and it usually requires that the failing component's absence be invisible by design. Any team that claims five nines and has humans in its recovery path is measuring something other than what users experience.

      ### What the table hides

      **Distribution matters more than the total.** Forty-three minutes a month can be one 43-minute outage in the middle of your peak trading hour, or 90 seconds of degradation thirty times spread across quiet periods. Identical availability; wildly different business impact. This is why mature teams track both the budget consumed *and* the frequency and duration distribution of incidents — and often care more about the latter.

      **Partial failure is invisible.** An outage affecting 3% of users for two hours consumes a small slice of a request-based budget while being a catastrophe for those users. Availability that is not sliced by customer, region and tenant averages away exactly the failures you most need to see. If one large customer is entirely down and everyone else is fine, a global SLI will barely move.

      **Which requests failed matters.** Losing 1% of health-check traffic and losing 1% of payment submissions are the same number and not the same event. Weight or separate your critical user journeys.

      ### The two assumptions that are usually wrong

      Availability arithmetic — which the next chapter develops properly — rests on two assumptions worth flagging early.

      The first is **independence**. Multiplying and combining probabilities assumes components fail independently. Real components share power, share a network, share a deployment pipeline, share a configuration system, share a DNS provider, and share a bug that was deployed to all of them at once. The most common cause of a simultaneous failure across supposedly independent replicas is not coincidence; it is a shared cause, and correlated failure is the norm rather than the exception in published postmortems.

      The second is that **failures are detected and recovered promptly**. The measured availability of a redundant system depends enormously on how long it takes to notice a failed component. Redundancy where a failed replica goes unnoticed for a week gives you far less than the arithmetic promises, because for most of that week you were running without redundancy and did not know it. This is why monitoring your redundancy — alerting that a standby is unhealthy even though users are unaffected — matters more than it feels like it should.

      ### Common mistakes

      Quoting a nines figure with no window, no scope and no measurement point, which makes it unfalsifiable. Assuming independence. Ignoring the distribution of outages. Reporting global availability for a multi-tenant system. Counting only full outages. And treating the target as an achievement to announce rather than a budget to spend.
