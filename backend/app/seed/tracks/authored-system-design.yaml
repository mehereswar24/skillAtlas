  - slug: system-design-security
    name: "Security as a Design Property: Trust Boundaries, Secrets and Tenancy"
    domain: architecture
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - system-design-application-layer
      - system-design-communication
    summary: |-
      Threat modelling a design, authentication against authorisation, where tokens and secrets live, multi-tenant isolation and the failure modes that are architectural rather than code-level.
    content_md: |-
      Security bugs come in two kinds. Code-level ones — an injection, a missing escape — are found by tools and fixed in a line. Architectural ones — a service that trusts a header, a tenant id taken from the request body — are found in production and fixed by a migration. This chapter is about the second kind, because they are the ones a design review can prevent.

      ### Threat modelling, briefly and usefully

      Draw the components, the data stores and every arrow between them, then draw the **trust boundaries**: the lines across which data arrives from somewhere less trusted. Every crossing is where validation and authorisation must happen. The useful question at each arrow is what an attacker gains by controlling one side, and STRIDE — spoofing, tampering, repudiation, information disclosure, denial of service, elevation of privilege — is a checklist for asking it systematically.

      One boundary is misdrawn more than all the others combined: the internal network. "It is behind the firewall so it is trusted" fails the moment any single service is compromised, and it is why lateral movement is so effective in real breaches. Zero-trust states the alternative plainly — authenticate and authorise every call, including service-to-service, on every hop.

      ### Authentication and authorisation are different problems

      **Authentication** establishes who is calling. Sessions with an opaque id are server-side state, revocable instantly, and need a lookup. JWTs are self-contained and verifiable without a lookup, which is the entire appeal, and the same property makes them *not revocable* before expiry. That trade is the decision: short expiry plus a refresh token gets most of the benefit with a bounded revocation window, and a denylist for the exceptional case. A long-lived JWT is a credential you cannot take back.

      Where a browser token lives matters. `localStorage` is readable by any script on the page, so one XSS is a total credential compromise. An HttpOnly, Secure, SameSite cookie is not readable by script, at the cost of needing CSRF protection. Prefer the cookie.

      **Authorisation** decides what that caller may do, and it must be enforced on the server for every request against the specific object. The most common serious flaw in web systems is an object reference the server does not check — "does user 42 own order 991?" — which is trivially exploited by changing a number in a URL. Client-side checks are user experience, never enforcement.

      Design authorisation to be centralised and hard to skip: a policy layer or middleware that a new endpoint must opt out of, rather than one it must remember to opt into. Default-deny is a structural choice, not a discipline.

      ### Secrets

      Secrets do not belong in source control, in environment variables baked into an image, in logs, or in error messages. They belong in a secrets manager, fetched at runtime, with rotation that does not require a deploy — because a rotation procedure that requires downtime will not be performed after a suspected compromise, which is exactly when it must be.

      Two design consequences. Support two valid credentials during rotation, or every rotation is an outage. And prefer short-lived, automatically-issued identities — workload identity, mutual TLS certificates — over long-lived static keys, since the best-protected secret is the one that expires in an hour.

      ### Multi-tenancy

      Every query in a multi-tenant system must be scoped by tenant, and the tenant must come from the authenticated session, never from a request parameter. A missing `WHERE tenant_id = ?` is a cross-tenant data leak, and it is one forgotten clause away at all times.

      Because relying on every developer to remember it is not a control, put the scoping somewhere it cannot be omitted: a repository layer that requires it, database row-level security, or — where the risk justifies the cost — separate schemas or databases per tenant. The stronger isolations also solve the noisy-neighbour problem covered in the rate limiting chapter, which is the other half of tenancy.

      ### Data protection and the rest of the picture

      Encrypt in transit everywhere including internal hops, and at rest as a compliance and disk-disposal baseline. Understand that at-rest encryption defends against stolen disks and not against a compromised application, which is why field-level encryption exists for the genuinely sensitive columns. Minimise: data you do not store cannot leak, and every field has a retention decision. Log security-relevant events — authentication, authorisation failures, privilege changes — to somewhere the application cannot rewrite, and never log the credentials themselves.

      ### Common mistakes

      Trusting the internal network. Authorisation checked in the UI. Object references not checked against the caller. Tenant id from the request. Long-lived JWTs with no revocation path. Tokens in `localStorage`. Secrets in environment variables and in logs. Rotation that requires a deploy. And treating security as a review gate at the end rather than as a property of the boundaries you drew at the start.

      **What you can do after this:** draw the trust boundaries on a design, state where authorisation is enforced so that a new endpoint cannot skip it, and describe rotating a credential with no downtime.
