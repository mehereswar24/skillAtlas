  - slug: system-design-latency-vs-throughput
    name: "Latency, Throughput, and Why Only the Tail Is Felt"
    domain: architecture
    est_hours: 7
    difficulty: intermediate
    prerequisites:
      - system-design-strategies
    summary: |-
      The queueing relationship between utilisation and latency, why p99 matters more than the mean, how tail latency compounds across fan-out, and the measurement error that hides your worst latency entirely.
    content_md: |-
      Latency is how long one operation takes. Throughput is how many complete per unit time. They are not opposites and they are not independent, and the relationship between them is the most underappreciated idea in performance engineering.

      ### Utilisation destroys latency before it destroys throughput

      A queueing system's waiting time rises non-linearly with utilisation. As a rough shape: at 50% utilisation, queueing roughly doubles service time; at 80% it is several times worse; at 90% it is dramatically worse; and as utilisation approaches 100% the queue — and the latency — grows without bound. The knee is sharp and it arrives sooner than intuition suggests.

      The practical consequence is that **you cannot run a latency-sensitive service near full utilisation**. A server at 95% CPU is not efficiently used, it is one small traffic increase away from a latency cliff. Target utilisation is a design decision derived from your latency requirement, and for interactive services it is usually somewhere between 50% and 70%.

      Little's Law makes this concrete and is worth internalising: the average number of requests in the system equals arrival rate times average time in the system. So if you serve 1,000 requests per second and each takes 200ms, you have 200 requests in flight on average — which tells you the concurrency your thread pools, connection pools and memory must accommodate. It also tells you that if latency triples during a bad moment, in-flight requests triple too, and whatever pool was sized for the good case is now exhausted. That is the mechanism behind an enormous fraction of cascading failures.

      ### Percentiles, and averages as a lie

      Mean latency conceals everything interesting. A service with a 100ms mean might give everyone 100ms, or give 90% of users 20ms and 10% of users 900ms. Only the second is a problem, and only percentiles reveal it. Quote p50 for the typical experience, p99 and p99.9 for the experience that generates complaints.

      The tail is not a rounding error. A user session that makes 100 requests will, on average, hit the p99 once — so your p99 is roughly the *typical* worst experience within a session, not a rare event. This is why the tail is what users describe when they say a product feels slow.

      ### Fan-out makes the tail dominate

      If a request fans out to 10 backends and waits for all of them, the response is as slow as the slowest. With a per-backend p99 of 500ms, the probability that at least one of ten is in its tail is about 1 − 0.99^10 ≈ 10%. So a p99 of 500ms in a backend becomes a p90 of 500ms at the top. Fan out to 100 and it is nearly certain on every request. This is the mathematics behind the "tail at scale" observation, and it is why large fan-out systems invest so heavily in tail-tolerant techniques: hedged requests (send a second copy of a request that has already exceeded its p95 and take whichever returns first), tied requests, and returning a partial result rather than waiting.

      ### Coordinated omission, the measurement error that hides your worst numbers

      This is the subtle one. Most load generators send a request, wait for the response, then send the next. When the system stalls for two seconds, the generator simply does not send requests during the stall — so the requests that would have experienced the worst latency were never issued, and never measured. The reported p99 can be an order of magnitude better than reality.

      The corrections are to generate load at a fixed rate independent of responses, and to measure latency from the moment a request *should* have been sent. The same problem appears in production instrumentation that starts its timer after a request has already sat in an accept queue — measure from the earliest point you can, ideally at the edge, or you will report a healthy service while users experience a broken one.

      ### Common mistakes

      Optimising the mean. Reporting an average of per-instance p99s, which is not a percentile of anything. Load testing with a closed-loop generator and believing the tail. Assuming more capacity fixes latency, when the cause is a lock, a serialised section or an unbounded queue. Sizing pools for average concurrency rather than for concurrency under a latency excursion. And treating a timeout as a latency control when it is really an admission-control decision, whose consequences the resilience chapters take up.
    resources:
      - kind: article
        title: "Dean and Barroso: The Tail at Scale (CACM)"
        url: "https://cacm.acm.org/research/the-tail-at-scale/"
      - kind: article
