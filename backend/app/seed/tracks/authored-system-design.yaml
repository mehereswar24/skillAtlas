  - slug: system-design-availability-patterns
    name: "Redundancy Patterns: Cells, Blast Radius and Shuffle Sharding"
    domain: architecture
    est_hours: 7
    difficulty: advanced
    prerequisites:
      - system-design-availability-in-parallel-vs-sequence
    summary: |-
      Redundancy is not one pattern — N+1 spares, isolated cells, and shuffle sharding all trade cost against blast radius differently, and shuffle sharding gets remarkable isolation almost for free.
    content_md: |-
      Once you accept that failures are correlated and that redundancy does not compound as cleanly as the arithmetic suggests, the design question changes. It stops being "how many copies" and becomes "when this fails, *who* is affected".

      ### N+1 and N+2 redundancy

      The baseline: run enough capacity to serve peak load with one (or two) units failed. The subtlety is that "enough capacity" must be evaluated *after* the failure, including the surviving units absorbing the failed one's share. Three zones at 70% utilisation become two zones at 105% — an outage. Sizing for zone loss means running each zone at no more than about 1/(N−1) of what it can handle, which for three zones is around 66%, and that spare capacity is the price of the redundancy.

      N+2 exists because failures happen during maintenance. If you are at N+1 and take a unit down to patch it, you are at N with no margin, and this is when the unlucky failure occurs.

      ### Bulkheads: stop failures from spreading

      Named after ship compartments: partition resources so that exhausting one pool cannot starve another. Separate connection pools and thread pools per downstream dependency mean a slow payment provider cannot consume every worker and take down search as well. Separate pools per tenant class mean a single heavy customer cannot exhaust shared capacity.

      This is a small change with an outsized effect, because the default — one shared pool for everything — converts any single slow dependency into a total outage. If you take one pattern from this chapter into your next design, take this one.

      ### Cell-based architecture

      A cell is a complete, independent copy of the stack — compute, cache, database, queues — serving a subset of customers. Cells share nothing on the data path. A cell failure affects only its customers, so a defect that would have been a 100% outage becomes a 5% outage. Deployments roll cell by cell, which makes progressive rollout structural rather than optional, and it caps the blast radius of a bad release as well as of a bad host.

      The costs are real: a routing layer that maps customers to cells (and is now a critical dependency that must be extremely simple and extremely available), the operational burden of many stacks, capacity fragmentation because each cell needs its own headroom, and the difficulty of anything that must span cells. Cells suit systems with many independent tenants and suit poorly systems where everyone shares one global dataset.

      ### Shuffle sharding, the disproportionately clever one

      Standard sharding assigns each customer to one shard; if that shard is broken or overwhelmed by a noisy neighbour, all of its customers are affected. Shuffle sharding assigns each customer a *random combination* of nodes from a larger pool.

      With 8 nodes and 2 assigned per customer, there are 28 possible combinations. One customer's problem takes out their 2 nodes; another customer is fully affected only if they were assigned *exactly the same pair* — roughly 1 in 28 — and every other customer overlaps in at most one node, so with client-side retry to their other node they continue working. With 100 nodes and 5 per customer, the number of combinations is in the tens of millions, and the probability of complete overlap becomes negligible.

      The remarkable property is that you get near-per-customer isolation without per-customer infrastructure, on the same hardware you already have. It requires that requests can be served by any assigned node (so the work is stateless or the state is replicated) and that clients retry against another assignment. Where those hold, it is one of the highest-leverage availability techniques known.

      ### Choosing

      Rough guidance: bulkheads always, because they are cheap and prevent the most common cascade. Zone redundancy with post-failure capacity headroom as the default. Shuffle sharding when you have many tenants sharing a stateless or replicated fleet and noisy-neighbour or poison-request failures are your risk. Cells when tenants are genuinely independent, the blast radius requirement is strict, and you can afford the operational multiplication.

      ### Common mistakes

      Redundancy sized for the happy path, so losing one unit overloads the rest. One shared thread pool for all dependencies. Cells that quietly share a database or a cache, which reintroduces the shared fate they existed to prevent. A cell router that is complex enough to fail, becoming the single point of failure for every cell. And never testing whether the failover actually works, which is the recurring theme of this entire section.
    resources:
      - kind: article
        title: "AWS Builders' Library: workload isolation using shuffle sharding"
        url: "https://aws.amazon.com/builders-library/workload-isolation-using-shuffle-sharding/"
      - kind: article
