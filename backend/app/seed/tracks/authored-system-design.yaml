  - slug: system-design-communication
    name: "Communication Between Services: Protocols, Contracts and Partial Failure"
    domain: architecture
    est_hours: 7
    difficulty: intermediate
    prerequisites:
      - system-design-application-layer
      - system-design-latency-vs-throughput
    summary: |-
      HTTP/REST, gRPC, GraphQL and long-lived connections compared by what they cost you, plus contract evolution and the partial-failure problem that no protocol solves for you.
    content_md: |-
      Once a system is cut into pieces, the pieces have to talk, and every call between them can now do something a function call cannot: succeed on one side and fail on the other. Protocol choice matters far less than most design discussions assume. What matters is the contract, and what you do when the response never arrives.

      ### The realistic options

      **HTTP/JSON (REST-ish).** Universally supported, debuggable with curl, cacheable by intermediaries because the semantics of GET are defined. Costs: verbose on the wire, no schema unless you add one, and a tendency toward chatty designs where one screen needs seven round trips.

      **gRPC (HTTP/2 plus protobuf).** Binary, schema-first, code-generated clients, multiplexed streams over one connection, and native streaming in both directions. Typically several times smaller and meaningfully faster than JSON over HTTP/1.1. Costs: not readable in a browser without a proxy, harder to debug by hand, and load balancing needs care because long-lived HTTP/2 connections defeat naive connection-level balancers — you need an L7 balancer or client-side balancing.

      **GraphQL.** One endpoint, the client specifies the shape it wants, which genuinely solves over- and under-fetching for varied clients. Costs: caching is much harder because everything is a POST to one URL; a single query can trigger an N+1 explosion in resolvers; and rate limiting by request count is meaningless when one request can be arbitrarily expensive, so you need query cost analysis and depth limits.

      **WebSockets and SSE.** For server push. SSE is one-directional, plain HTTP, and reconnects automatically — enough for most notification and progress use cases. WebSockets are bidirectional and stateful, which means your load balancer, deploy process and autoscaler must all handle long-lived connections and connection storms on restart.

      The honest default for internal service-to-service traffic is gRPC where you control both ends and latency matters, HTTP/JSON everywhere else, and a queue instead of any of them whenever the caller does not need the answer now.

      ### The contract is the real interface

      Whatever the protocol, the contract has to evolve without a coordinated deploy, because there is no moment when all callers upgrade at once.

      The rules are simple and rarely followed. Add fields, never remove or repurpose them. Never change the meaning of an existing field. Make new fields optional with a safe default. Tolerate unknown fields on read — protobuf does this by default, JSON parsers usually do, and strict schema validation on ingress quietly makes your API un-evolvable. When a breaking change is genuinely required, run both versions side by side and migrate callers, rather than versioning every endpoint by reflex.

      Consumer-driven contract testing is the practice that makes this hold: each consumer publishes the subset of the response it actually depends on, and the provider's CI fails if a change would break any of them. It catches the class of bug that integration tests in a staging environment usually miss.

      ### Partial failure, which is the whole problem

      A remote call has three outcomes, not two: success, failure, and *unknown*. A timeout tells you nothing about whether the work happened. This is the fact that distinguishes distributed programming from local programming, and no protocol removes it.

      Two consequences you must design for. First, every call needs a timeout — a connect timeout and a request timeout, both explicit, both shorter than your caller's timeout, or a slow dependency will hold your threads until you have none left. Defaults are usually "infinite" and that is how a slow dependency becomes your outage. Second, any retry must be safe to repeat, which is the subject of the idempotency chapter and the reason it exists.

      Fan-out compounds this. If a request calls five services in parallel, its latency is the *maximum* of five, so your p99 is set by the slowest dependency's p99, and its failure probability is one minus the product of five successes. Parallel fan-out is good for latency and bad for availability, and both effects get worse with width.

      ### Common mistakes

      No timeout, or a timeout longer than the caller's. Retrying non-idempotent writes. Chatty interfaces that need N calls per screen. Breaking changes shipped as "just adding validation". Choosing GraphQL for a single first-party client. And putting a synchronous call where the caller does not actually need the answer.

      **What you can do after this:** given two services, choose a protocol with a stated reason, write a contract change that is safe to deploy without coordination, and say what your caller does when the response never arrives.
