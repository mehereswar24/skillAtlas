        url: "https://zookeeper.apache.org/doc/current/index.html"

  # REPURPOSED SLUG: as with the CP node, roadmap.sh's "AP" entry is a
  # definition. Kept as a slug and given the mechanisms that make an AP system
  # work in production — quorums, hinted handoff, anti-entropy — which is where
  # the interesting engineering is.
  - slug: system-design-ap-availability-partition-tolerance
    name: "AP Systems in Practice: Quorums, Hinted Handoff and Anti-Entropy"
    domain: architecture
    est_hours: 7
    difficulty: advanced
    prerequisites:
      - system-design-availability-vs-consistency
    summary: |-
      How a system stays writable through a partition and repairs itself afterwards — the Dynamo lineage of techniques, and the specific ways "eventually consistent" surprises application developers.
    content_md: |-
      Choosing availability during a partition means accepting writes on both sides and reconciling later. That is a coherent and often correct engineering position, and it requires machinery: a way to accept writes when nodes are missing, a way to catch up, and a way to detect divergence.

      ### Accepting writes without everyone present

      With N replicas and a required W acknowledgements, a write succeeds as long as W nodes are reachable. Set W below N and you tolerate failures on the write path. Set R + W > N and reads overlap writes, giving you a freshness property — though, importantly, not linearizability, because concurrent operations and failure cases still admit anomalies.

      **Sloppy quorums** go further: if the nodes that *should* hold a key are unreachable, write to whatever N nodes are reachable instead. This maximises write availability and explicitly abandons the overlap guarantee, since the write may be sitting on nodes a subsequent read never consults. It is a deliberate durability-over-consistency choice, and knowing that your database does this by default is important.

      ### Getting the data where it belongs

      **Hinted handoff.** When a write lands on a substitute node, it is stored with a hint recording where it really belongs. When the intended node returns, the hint is delivered and the substitute discards its copy. This is what makes sloppy quorums eventually correct rather than permanently wrong — and it means a node returning from a long absence receives a burst of backlogged hints, which is a load spike worth anticipating.

      **Read repair.** A read consults several replicas; if they disagree, the stale ones are updated. Cheap, opportunistic, and it only repairs data that is actually read — which is precisely the problem, because rarely-read data can stay divergent indefinitely.

      **Anti-entropy.** A background process compares replicas and reconciles differences. Comparing whole datasets is prohibitive, so implementations use **Merkle trees**: a hash tree over key ranges, where comparing two roots is one hash, and mismatches are narrowed by descending only the differing branches. This finds a small divergence in a large dataset with logarithmic effort, and it is the mechanism that catches what read repair never touches.

      ### Where "eventually consistent" surprises people

      "Eventually" has no bound. In a healthy system convergence takes milliseconds; during a partition it takes as long as the partition, plus the repair. Applications must be written to tolerate the window, and the specific surprises are worth listing.

      *Read-after-write fails.* Write, immediately read, get the old value. Handle it with client-side echo of the value just written, session stickiness, or a quorum read for that specific path.

      *Deletes come back.* This is the sharp one. A delete on a partitioned system must be recorded as a **tombstone**, not as an absence — otherwise a replica that missed the delete sees its copy as newer than the absence and helpfully resurrects the record. Tombstones must then be retained longer than any possible partition and eventually garbage-collected, and accumulated tombstones are themselves a well-known performance problem in these systems.

      *Counters do not work naively.* Two concurrent increments under last-write-wins become one increment. Counters need a CRDT counter or a different design entirely.

      *Uniqueness cannot be enforced.* Two partitions can both accept the same new username, and no amount of checking-before-writing prevents it. Uniqueness genuinely requires coordination; if you need it, that specific operation must go through a consistent store.

      ### When AP is right

      When availability is worth more than freshness, and the data tolerates it: activity feeds, view counts, session state, product catalogues, sensor data, caches, and anything where showing a slightly stale value is better than showing an error. When the data must be correct — money, inventory decrements, uniqueness, permissions — coordinate.

      The best real designs are hybrids. Serve the high-volume, tolerant paths from an AP store, and route the small number of operations that require agreement through a consistent one.

      ### Common mistakes

      Assuming eventual consistency converges "quickly enough" without measuring it. Using LWW for anything you cannot afford to lose. Enforcing uniqueness in an AP store. Forgetting tombstone retention, then debugging resurrected deletes. Believing R + W > N means linearizable. And building an application that assumes read-after-write and testing it only on a single node, where it always appears to work.
