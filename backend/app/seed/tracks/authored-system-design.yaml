  - slug: system-design-availability-vs-consistency
    name: "CAP, PACELC, and What the Trade-off Actually Says"
    domain: architecture
    est_hours: 5
    difficulty: advanced
    prerequisites:
      - system-design-master-master
    summary: |-
      The most quoted and most misquoted theorem in the field — what it really constrains, why "pick two" is wrong, and why PACELC describes the trade-off you make every day rather than the one you make during a partition.
    content_md: |-
      Almost everyone can recite "consistency, availability, partition tolerance — pick two". Almost nobody can say what it means, and the slogan is actively misleading. It is worth getting right, because the underlying trade-off is real and it appears in every replicated system you will build.

      ### What the theorem actually says

      The precise statement: in the presence of a network **partition**, a distributed system cannot provide both **linearizability** (every read sees the most recent write, as if there were a single copy) and **total availability** (every request to a non-failing node receives a non-error response).

      The reasoning is a two-line argument. Partition separates nodes A and B. A client writes to A. Another client reads from B. B cannot know about the write. So B either returns stale data (sacrificing consistency) or returns an error / waits (sacrificing availability). There is no third option, and no cleverness escapes it.

      ### Why "pick two" is wrong

      Partition tolerance is not a choice. Networks partition — cables are cut, switches misconfigured, routes withdrawn, and a sufficiently overloaded node is indistinguishable from a partitioned one. You cannot choose not to have partitions; you can only choose what to do when one occurs. So "CA" is not a system category, it is a system that has not yet been partitioned.

      The real choice is binary and narrow: **during a partition**, do you prefer to return possibly-stale data (AP) or to refuse service on the minority side (CP)? That is all the theorem constrains.

      Two more misreadings worth clearing up. The "C" in CAP is specifically linearizability, not the "C" in ACID — those are different properties that share a letter, which has confused a generation. And the "A" is *total* availability, an extremely strong requirement; a system can be CP and still be highly available in the everyday sense, because partitions are rare and it is only unavailable on the minority side, only while the partition lasts.

      ### PACELC: the trade-off you make every day

      CAP describes behaviour during a rare event. Daniel Abadi's extension is more practically useful: **if there is a Partition, choose Availability or Consistency; Else — in normal operation — choose Latency or Consistency.**

      The "else" branch is where you actually live. Every day, with the network healthy, a replicated system chooses: wait for replicas to acknowledge (higher latency, stronger consistency), or acknowledge immediately (lower latency, weaker consistency). That decision affects every single request, whereas the partition decision affects a few minutes a year. PACELC is the better mental model precisely because it puts weight on the common case.

      So a system described as PC/EC pays consistency's cost always. PA/EL takes the fast, weak option in both branches. PC/EL — consistent during partitions, fast otherwise — is a common and sensible configuration.

      ### It is a per-operation choice, not a per-system label

      The most useful practical reframing: modern systems let you choose per operation. The same database can serve a stale read from a replica for a product description and a linearizable read from the leader for an account balance. Many offer explicit consistency levels per query.

      So do not label your system "AP" or "CP". Enumerate your operations and decide for each: what does the *product* do if this read is five seconds stale? For a follower count, nothing. For "is this seat still available", something expensive. For "does this user still have permission", something dangerous. That question — asked per operation — is the real content of this chapter, and it is far more useful than any classification.

      ### Common mistakes

      Treating "pick two" as literal and describing systems as CA. Confusing CAP's consistency with ACID's. Assuming AP means "no consistency" — AP systems still provide eventual consistency and often causal or session guarantees. Assuming CP means "unavailable" — a CP system is only unavailable to the minority, only during a partition. Choosing a database by its CAP label rather than by its actual documented and tested behaviour, which frequently differs from the marketing (this is what Jepsen exists to demonstrate). And picking strong consistency everywhere out of caution, paying its latency on every request for guarantees most of your endpoints do not need.
