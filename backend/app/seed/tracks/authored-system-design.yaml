  # REPURPOSED SLUG: roadmap.sh's "design and implementation" node is a link to
  # a pattern index. The slug is kept as this track's capstone: the method for
  # conducting a design discussion, and three designs worked end to end using
  # only mechanisms taught earlier in the track.
  - slug: system-design-design-implementation
    name: "Three Designs, Worked End to End"
    domain: architecture
    est_hours: 12
    difficulty: advanced
    prerequisites:
      - system-design-cloud-design-patterns
      - system-design-monitoring
      - system-design-security
      - system-design-rate-limiting
    summary: |-
      The method for running a design discussion, then a URL shortener, a news feed and a chat system worked through from estimates to bottlenecks — each ending in the trade-off you would have to defend.
    content_md: |-
      Everything in this track exists to be used in one situation: someone asks you to design a system, and you have forty minutes and a whiteboard. This chapter is the method, then three worked designs that use only mechanisms taught earlier.

      ### The method

      **Clarify before designing.** Functional scope — what does it do, and explicitly what does it not do. Scale — users, reads and writes per second, payload sizes, growth. Requirements that shape everything — latency target, consistency needs, availability target, retention. Ten minutes here saves the whole discussion, and a design produced without it is a guess.

      **Estimate.** Turn the numbers into QPS, storage per year and bandwidth, as in the estimation chapter. The estimate tells you which problem you are actually solving: a system at 100 QPS and one at 100,000 QPS are different designs, and most systems are the first while being designed as the second.

      **API first, then data.** A handful of operations with their inputs and outputs. Then the data model and, critically, the access patterns — because the access patterns choose the datastore, not the other way round.

      **Draw the simple version, then break it.** Single service, single database. Now apply load and ask what fails first. Fix that, and only that. This is the discipline the whole track has been built on: each mechanism appears because a specific failure demanded it.

      **Say the trade-off out loud.** Every choice costs something. Naming the cost is the difference between a design discussion and a recitation.

      ### Design one: a URL shortener

      Read-heavy, simple data, and a good test of whether you can resist over-engineering. Say 100M new links a day — a deliberately large number — and a 10:1 read ratio, so ~1,200 writes/s and ~12,000 reads/s. At ~500 bytes per record, that is roughly 18TB over a year: large, not exotic.

      Key decision: how the short key is generated. Hashing the URL and truncating produces collisions you must detect and resolve. A counter encoded in base62 gives guaranteed uniqueness and sequential, guessable keys. Pre-generating keys into a pool that each service instance draws blocks from removes the coordination from the request path entirely, and is the answer worth giving.

      The rest follows from access patterns: lookups are entirely by key, so a key-value store is the right shape; redirects are cacheable and the distribution is heavily skewed, so a cache in front absorbs nearly all reads; expiry is a TTL. Analytics is the one part that must not be synchronous — emit an event to a queue and aggregate offline, because counting a click in the redirect path adds a write to every read.

      Trade-off to defend: custom aliases require a uniqueness check the pool design otherwise avoids, and rate limiting on creation is what stops the service becoming a spam redirector.

      ### Design two: a news feed

      The fan-out question, and the design where the interesting answer is "both". Say 10M daily actives, 500M feed reads a day (~6,000/s), and 2M posts a day.

      **Fan-out on write (push).** When a user posts, write the post id into every follower's precomputed feed list. Reads are then a single fast range read. Cost: a post by someone with 10M followers is 10M writes, and inactive users' feeds are maintained for nothing.

      **Fan-out on read (pull).** Store posts once; at read time, fetch from everyone the user follows and merge. Writes are cheap; reads are expensive and get worse the more accounts a user follows.

      The workable design is hybrid: push for ordinary accounts, pull for the small set of very-high-follower accounts, merged at read time. This is the answer, and the reason to state it is that it demonstrates the general move — handle the tail of the distribution differently from the body, exactly as with hot keys in the sharding chapter.

      Everything else is mechanisms already covered: feeds cached in memory keyed by user, media served from a CDN, ranking computed asynchronously, and eventual consistency accepted because a post appearing a second late is not a defect.

      Trade-off to defend: the hybrid has two code paths and a threshold that must be tuned, and it is still the right choice over either pure strategy.

      ### Design three: chat with delivery guarantees

      The design where connection state and delivery semantics dominate. Say 50M daily actives, 10M concurrent connections, 100,000 messages a second.

      Persistent connections mean a gateway tier whose scaling unit is *connections*, not requests, and a registry mapping user to gateway instance so a message can be routed to the right one. When the recipient is offline the message is queued and delivered on reconnect, which makes ordering and deduplication load-bearing: message ids generated client-side make retries idempotent, and a per-conversation sequence number gives ordering without global coordination.

      Storage is by conversation with time-ordered ids, since the only real access pattern is "the last N messages in this conversation, then page backwards". Group chat is fan-out again, with the same push/pull reasoning at a smaller scale. Read receipts and typing indicators should be explicitly cheap or best-effort — they can be a hundred times the volume of messages, and treating them with the same durability as messages is a common and expensive error.

      Trade-off to defend: a gateway restart disconnects millions of clients simultaneously, so reconnect must have backoff with jitter and the gateway tier must be drained in waves — the connection storm from the resiliency chapter, in its most acute form.

      ### Common mistakes

      Designing before clarifying. Skipping the estimate, so the design is unanchored. Reciting components instead of deriving them from a failure. Distributing what fits on one machine. Presenting a choice with no cost. And running out of time on the data model — keep the first pass shallow and go deep only where the interviewer or the reviewer pushes.

      **What you can do after this:** run a forty-minute design from clarification through estimation to bottlenecks, and defend each choice by naming what it costs.
