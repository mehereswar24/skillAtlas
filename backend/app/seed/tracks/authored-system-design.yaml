  - slug: system-design-resiliency
    name: "Containing Failure: Deadlines, Circuit Breakers and Bulkheads"
    domain: architecture
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - system-design-communication
      - system-design-idempotent-operations
    summary: |-
      The caller-side toolkit for surviving a dependency that is slow or down: deadline propagation, circuit breakers and their half-open state, bulkheads, hedged requests and honest fallbacks.
    content_md: |-
      A dependency will be slow or down. That is not a hypothetical, it is a scheduled event, and the interesting question is what your service does during it. The answer is decided entirely by the caller, because a failing dependency cannot protect you. This chapter is the caller-side toolkit.

      Note the ordering of the threat. Down is the easy case: connections are refused immediately, you get an error, you handle it. **Slow is the dangerous case**, because a slow dependency consumes your resources while returning nothing. Every design here is aimed at slow first.

      ### Deadlines beat timeouts

      A timeout is per-call: "give up on this after two seconds." A deadline is per-request: "this whole user request is worthless after one second; here is how much of it remains." The difference matters as soon as one request makes several calls, because three sequential two-second timeouts allow six seconds of work on a request whose caller left after one.

      Propagate the remaining budget with the call — gRPC does this natively, and with HTTP you pass it in a header — and let each hop use it as its own timeout, minus a margin. Two rules follow. A callee's timeout must be shorter than its caller's, or the caller gives up while the callee keeps working and holding resources. And when the deadline has expired, do not start the work at all: checking the deadline before dispatch is the cheapest capacity you will ever recover during an incident.

      ### Circuit breakers

      Retrying a dependency that is comprehensively down wastes your threads and adds load to something already struggling. A circuit breaker watches the failure rate over a rolling window and, past a threshold, **opens**: subsequent calls fail immediately without touching the network. After a cooldown it goes **half-open** and lets a small number of trial requests through. Success closes it; failure opens it again with a longer cooldown.

      The half-open state is the part that matters and the part that naive implementations get wrong. Going straight from open to fully closed sends the entire held-back load at a dependency that has just come back, which knocks it over again — a recovery loop that can oscillate for hours. Let a trickle through, and ramp.

      Tune on failure *rate* over a window with a minimum request count, not on consecutive failures: a threshold of five consecutive failures never trips on a dependency failing 50% of the time, which is a real and damaging condition. Count timeouts as failures. Do not count 4xx as failures — a client sending bad requests is not a broken dependency, and letting it open the breaker turns one bad client into a full outage. Breakers should be per-dependency, and often per-endpoint, since one slow endpoint rarely means the whole service is gone.

      ### Bulkheads

      Named for a ship's compartments: a hole floods one compartment, not the hull. Concretely, give each dependency its own bounded resource pool — connections, threads, or a semaphore capping in-flight calls — so a dependency that hangs can exhaust only its own allowance.

      The failure this prevents is the classic one. A single shared thread pool of 200; one downstream call starts taking thirty seconds; within a minute all 200 threads are parked on it; every unrelated endpoint on the service now returns nothing. With a bulkhead capping that dependency at 20, the other 180 threads keep serving everything else. Bulkheads apply to tenants too: a per-tenant concurrency cap is what stops one customer's batch job consuming a shared cluster.

      Concurrency limits are the practical form of this, and adaptive limits (raising and lowering the cap based on observed latency, in the spirit of TCP congestion control) work better than a fixed number picked a year ago.

      ### Hedged requests

      For read-only, idempotent calls where tail latency dominates: send the request, and if no answer has arrived by the 95th-percentile latency, send a second one to a different replica and take whichever returns first. This trades a few percent extra load for a dramatically shorter tail, because it routes around the one slow replica rather than waiting for it. Only ever for idempotent operations, and always with a cap on the hedge rate so a system-wide slowdown does not double your traffic at the worst moment.

      ### Fallbacks that are honest

      When a dependency is unavailable, serve stale cached data with a clear "as of" marker; omit the section entirely rather than failing the page; queue the write for later if the domain allows it; or return a plain, well-shaped error. What you must not do is fabricate: a recommendations service that returns an empty list when it is down is fine, and a payments service that returns "approved" when the processor is unreachable is a catastrophe. Choose the fallback per dependency, with the failure mode written down.

      ### Common mistakes

      A timeout with no deadline propagation. Breakers that trip on consecutive failures, or on 4xx. Closing the breaker fully in one step. One shared thread pool for every dependency. Hedging non-idempotent writes. Fallbacks that silently return wrong data. And resilience code that has never been exercised — if you have not tested it with a deliberately broken dependency, you do not know whether it works.

      **What you can do after this:** take one dependency, give it a deadline, a breaker with a stated threshold, a bulkhead and a named fallback, and describe what a user sees while it is down.
