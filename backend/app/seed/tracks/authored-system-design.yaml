        title: "Apache Cassandra: tunable consistency levels"
        url: "https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html"

  - slug: system-design-active-passive
    name: "Active-Passive Failover, Fencing and Split Brain"
    domain: architecture
    est_hours: 6
    difficulty: advanced
    prerequisites:
      - system-design-master-slave
      - system-design-availability-patterns
    summary: |-
      A standby that takes over when the primary fails — how detection, promotion and traffic redirection actually work, and why the hardest part is being sure the old primary is really dead.
    content_md: |-
      Active-passive is the most common high-availability topology in the world: one node serves, one stands ready. It is simple to reason about, requires no conflict resolution, and its difficulty is concentrated entirely in one question — *is the primary actually dead?*

      ### The three parts of a failover

      **Detection.** Something must decide the primary has failed. Heartbeats, health checks, or a consensus-based cluster manager. The tuning is a genuine trade-off: aggressive detection fails over on a transient network blip (causing an outage rather than preventing one), while conservative detection means a longer real outage. Track how long detection actually takes, because it dominates your recovery time.

      **Promotion.** The standby becomes primary: finish applying replication logs, open for writes, warm caches. If replication was asynchronous, this is where unreplicated writes are lost. If the standby has a cold cache, this is where it is overwhelmed by full production traffic on an empty buffer pool.

      **Redirection.** Clients must find the new primary. Options: DNS change (slow — clients and resolvers cache far beyond your TTL, and many runtimes cache for the process lifetime); a virtual IP that moves (fast, needs the right network); a proxy that clients always connect to and which repoints (fast, and the proxy is now a dependency); or client-side service discovery (fast, needs every client to participate). Whichever you choose, existing connections must be broken so clients reconnect, or they will happily keep talking to a demoted node.

      ### Split brain, and why fencing is non-negotiable

      Here is the dangerous case. The primary is not dead; it is *unreachable*. It is still running, still holding open client connections, still accepting writes. The cluster promotes the standby. Now two nodes believe they are primary and both accept writes. Data diverges, and reconciling it afterwards ranges from painful to impossible.

      You cannot solve this by detection alone. A network partition is genuinely indistinguishable from a crash from the other side — this is a fundamental limit, not an implementation gap. The solutions all work by making the old primary *unable* to do damage:

      **Quorum.** Only a node that can see a majority of the cluster may act as primary. A partitioned minority cannot form a majority and so must stop. This is why cluster managers need an odd number of members, and why a two-node cluster cannot safely fail over on its own — each side sees exactly one node and neither can claim a majority, which is what witness or arbiter nodes exist to fix.

      **STONITH / fencing.** Forcibly disable the old primary before promoting: power it off through its management interface, revoke its storage access, or drop its network. Crude and effective — the machine cannot write if it has no power or no disk.

      **Fencing tokens.** Every promotion increments a monotonically increasing number, and downstream resources reject any request carrying a stale token. This is the most elegant form, because it works even when the old primary is alive and confused: its writes are refused by the storage layer itself.

      ### The uncomfortable truth about standbys

      A standby that is never used is a standby that does not work. Its configuration has drifted, its replication has been broken for six weeks, its disk is full, or it is running a version that cannot be promoted. The only way to know is to fail over regularly and deliberately — scheduled failover drills are the single highest-value practice in this chapter. Also monitor the standby's health with real alerts even though users are unaffected when it breaks, because otherwise you discover its condition at the worst possible moment.

      ### Common mistakes

      Failover without fencing. Two-node clusters that split-brain by design. Relying on DNS for redirection and being surprised by the caching. Cold standbys that collapse under production load — keep them warm, or ramp traffic. Automatic failover that flaps between nodes during network instability, causing repeated outages; add hysteresis and a cooldown. Failing over the database and forgetting the application's connection strings, its cached DNS, or its long-lived pooled connections. And never practising.
