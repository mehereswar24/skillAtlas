  - slug: system-design-asynchronism
    name: "Queues, Backpressure and the Buffer That Hides a Broken System"
    domain: architecture
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - system-design-communication
      - system-design-latency-vs-throughput
    summary: |-
      What a queue actually buys you, why an unbounded queue converts a throughput problem into a latency problem, and how backpressure and load shedding keep a saturated system usable.
    content_md: |-
      A queue between a producer and a consumer buys three specific things: the producer can return before the work is done, a burst can be absorbed without provisioning for the peak, and the two sides can fail independently. It buys exactly one thing it is usually credited with by mistake — it does not make the system faster. It makes the *response* faster and the *work* later.

      ### The arithmetic that decides everything

      Little's law: L = lambda times W. The average number of items in the system equals arrival rate times average time in the system. Rearranged, the wait in a queue is proportional to its depth divided by the service rate. A queue with 10,000 items and a consumer processing 100 per second has a 100-second wait, no matter how it feels to the producer.

      The second fact matters more. As utilisation approaches 100%, queueing delay does not rise linearly — it rises hyperbolically, roughly as 1/(1 — utilisation). At 50% utilisation, waiting time is about the same as service time; at 90%, about nine times; at 99%, about ninety-nine times. This is why systems seem fine and then fall over within a few percent of extra load, and why "we still have headroom, CPU is at 85%" is not the reassurance it sounds like. Variability makes it worse: bursty arrivals and variable service times both increase queueing at any given utilisation.

      The consequence: if arrival rate exceeds service rate on average, the queue does not "catch up later". It grows without bound. A queue absorbs *bursts*, never a sustained deficit.

      ### Unbounded queues are a bug

      An unbounded queue does not prevent overload; it hides it, converts it into unbounded latency, and eventually converts it into an out-of-memory kill that loses everything buffered. Meanwhile the work still in the queue may already be worthless — a user who left, a request whose caller timed out forty seconds ago and retried twice.

      Two rules follow. Bound every queue. And attach a deadline to every item, so a consumer can drop work whose answer nobody is waiting for any more. Processing an expired item is pure waste that makes recovery slower, and during a backlog it is the difference between draining and never draining.

      ### Backpressure

      Backpressure is what a bounded queue does when full: it refuses, and the refusal propagates to the producer, which slows down or refuses in turn. It is a feature. A system with backpressure degrades predictably; a system without it degrades by falling over.

      Mechanisms, in rough order of preference: bounded queues that reject on full; credit-based flow control, where a consumer grants the producer permission for N in flight (this is what HTTP/2 flow control and TCP's receive window do); blocking the producer, which works within one process and is dangerous across a network because it converts your consumer's slowness into your producer's outage; and finally rate limiting at the edge, which is backpressure applied before the work enters the system at all.

      When you cannot push back — the producer is the public internet — the remaining option is **load shedding**: reject a fraction of requests immediately, cheaply, and with a clear signal (HTTP 429 or 503 with Retry-After). Shedding 20% of traffic fast keeps 80% healthy. Accepting 100% and timing out serves 0% and burns capacity doing it. Shed by priority where you can: health checks and paying customers before batch and bots.

      ### Sizing and the two ways it fails

      Consumer parallelism should be sized to service time and target latency, not to queue depth. Two failure modes are worth naming. **Under-provisioned consumers** produce a backlog that grows during the peak; the question is whether the trough is deep enough and long enough to drain it — sum the deficit, do not eyeball the graph. **Over-provisioned consumers** hit whatever the queue is protecting: scale consumers tenfold and you may simply move the collapse to your database, which is why autoscaling on queue depth without a concurrency limit downstream is a well-known way to turn a small incident into a large one.

      Monitor queue *age* (how old the oldest item is), not just depth. Depth answers "how much work"; age answers "how late are we", which is what the user experiences and what your SLO is written against.

      ### Common mistakes

      Unbounded queues. No deadline on queued work. Treating a queue as extra capacity rather than as a buffer. Autoscaling consumers into a shared database. Alerting on depth but not age. And using async where the caller genuinely needs the answer, which just moves the wait somewhere the user cannot see it.

      **What you can do after this:** size a queue and its consumer pool from arrival rate and service time, and state what your system does at the moment the queue is full.
