  # REPURPOSED SLUG: roadmap.sh's "cloud design patterns" node is a link to a
  # catalogue. The slug is kept and now teaches the patterns that this track's
  # earlier chapters have already earned, each with the condition under which
  # it is the wrong choice — which is the part a catalogue never supplies.
  - slug: system-design-cloud-design-patterns
    name: "The Pattern Catalogue, and the Condition That Makes Each One Wrong"
    domain: architecture
    est_hours: 7
    difficulty: advanced
    prerequisites:
      - system-design-messaging
      - system-design-reliability-patterns
      - system-design-data-management
    summary: |-
      CQRS, event sourcing, materialised views, gateways and sidecars, claim-check, leader election and anti-corruption layers — what each solves, what it costs, and when reaching for it is the mistake.
    content_md: |-
      By now every mechanism in this track has been introduced at the moment a design needed it. This chapter names the recurring compositions of those mechanisms, because they have names you will meet in reviews and in documentation — and pairs each with the condition under which it is the wrong answer. A pattern applied without its precondition is worse than no pattern, since it adds cost and its benefit never arrives.

      ### Separating reads from writes

      **CQRS** splits the write model from the read model: commands go to one representation optimised for validation and invariants, queries to one or more optimised for how they are read. It is worth doing when reads and writes have genuinely divergent shapes or wildly different volumes — the canonical case being a normalised write store and a denormalised or search-indexed read store.

      Wrong when the two models would be the same shape. Then it is two representations of one thing, plus a synchronisation path, plus eventual consistency that the UI must now handle — because the user who submits a change and immediately reloads may not see it. That last point is the real cost, and it is a product decision as much as a technical one.

      **Materialised views** are the modest version and usually the right first step: precompute the expensive query, refresh it on write or on a schedule, accept bounded staleness. Wrong when the underlying data changes faster than the view can be refreshed, or when the query is not actually expensive.

      **Event sourcing** stores the sequence of changes as the source of truth and derives current state by replay. You get a complete audit trail, time travel, and the ability to build a new read model from history. It is the highest-cost pattern here: queries against current state need a projection, schema evolution means old events must be readable forever, and correcting a bad event requires a compensating one because history is immutable. Right for domains where the history *is* the point — ledgers, compliance. Wrong as a default architecture, and it does not require CQRS despite always being mentioned alongside it.

      ### At the edge

      **Gateway aggregation** collapses several backend calls into one client call, which matters most on mobile networks where round trips are expensive. Wrong when it becomes a place for business logic — an aggregation gateway that grows rules is a shared component every team must change, and a new deployment bottleneck.

      **Gateway offloading** moves cross-cutting concerns — TLS termination, authentication, rate limiting, compression — out of every service into one place. This is nearly always right; the failure mode is that the gateway becomes a single point of failure, so it needs the redundancy of anything on the critical path.

      **Backend for frontend** gives each client type its own tailored gateway, which stops a single API being contorted to serve a watch and a desktop simultaneously. Wrong when there is one client, or when the BFFs drift into duplicating the same logic three times.

      ### Around a service

      **Sidecar** runs a helper process alongside the application — proxy, log shipper, secrets agent — sharing its lifecycle. It gives you language-independent capability without a library in every runtime, and this is what a service mesh is made of. Costs are real: a process per instance, its memory and CPU, and one more thing on the request path. Wrong when a library would do and you have one language.

      **Ambassador** is the sidecar specialised to outbound calls — retries, breakers, mTLS handled outside your code. **Anti-corruption layer** is a translation boundary in front of a legacy or third-party system, so its model does not leak into yours. The anti-corruption layer is the one people skip and later wish they had, because the leak is invisible until it is everywhere.

      ### Work distribution

      **Competing consumers** — many workers on one queue — is the default for scaling background work and needs nothing more than idempotent consumers. **Leader election** designates a single instance for work that must not run twice, and is right for schedulers and coordinators; it is wrong whenever the work could simply be partitioned instead, because a leader is a bottleneck and a failover event. Use a proven implementation. Distributed locks are subtle, and a lock built on a cache without fencing tokens does not do what its author believes.

      **Claim-check** puts a large payload in object storage and sends a reference through the message system. Right as soon as payloads approach broker limits; wrong when it adds a fetch for messages that were small anyway.

      ### How to use a catalogue

      The catalogues — Azure's is the most complete and the Enterprise Integration Patterns collection is the classic for messaging — are reference material, not a menu. The order of operations is: name the problem you observe, find the pattern whose *problem statement* matches, then read its consequences section and decide whether you would accept them. A design that opens with "we will use CQRS and event sourcing" has chosen a solution before stating a problem, and that is the mistake this chapter exists to prevent.

      ### Common mistakes

      Adopting patterns for their reputation. CQRS where one model suffices. Event sourcing without a domain that needs history. A gateway that accumulates business logic. Locks without fencing. And, most often, several patterns at once in a system with no users, where the complexity is certain and the load is hypothetical.

      **What you can do after this:** given a stated problem, name the pattern that addresses it, its cost, and the condition that would make you reject it.
