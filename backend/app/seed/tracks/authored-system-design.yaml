  - slug: system-design-availability-in-parallel-vs-sequence
    name: "Composing Availability: Dependency Chains and Shared Fate"
    domain: architecture
    est_hours: 5
    difficulty: intermediate
    prerequisites:
      - system-design-99-9-availability-three-9s
    summary: |-
      Why availability multiplies down a serial dependency chain, how redundancy compounds it back up, and why the arithmetic overstates your resilience whenever components share a cause.
    content_md: |-
      This is the chapter that explains why a service built from reliable parts is often less reliable than any of them.

      ### Serial dependencies multiply

      If your request path must traverse components A, B and C, and each is independently available, overall availability is the product. Three components at 99.9% each give 0.999³ ≈ 99.7% — you have lost most of a nine simply by having three hops. Ten dependencies at 99.9% give about 99%, which is 3.65 days a year.

      Two conclusions follow, and they are among the most useful in the whole track.

      **You cannot be more available than the product of your hard dependencies.** Promising 99.99% while synchronously calling a dependency that offers 99.9% is not a stretch goal, it is arithmetic you have already lost. Either the dependency's availability improves, or it stops being a hard dependency.

      **Therefore reduce the number of hard dependencies on the critical path.** Every synchronous call you can make optional, cache, precompute, or move to an asynchronous path removes a multiplication. This is a far more powerful lever than making each dependency slightly better, and it is why "can we serve this from cache when the dependency is down" is one of the highest-value questions in a design review.

      Note the important distinction between a **hard** dependency (its failure fails your request) and a **soft** one (its failure degrades your response). Converting hard dependencies into soft ones is the single most effective availability technique available to most systems, and it costs nothing but a decision about what to show the user.

      ### Redundancy compounds the other way

      With N redundant components arranged so that any one suffices, the system fails only when all fail. Two components each at 99% give 1 − 0.01² = 99.99%. Three give 99.9999%. Each redundant copy adds roughly the same number of nines again.

      This is why redundancy is such a powerful tool on paper, and it is exactly where the independence assumption does its damage.

      ### Shared fate: why the arithmetic lies

      The formula 1 − (failure probability)^N is only valid if failures are independent. In practice:

      - Two instances in the same rack share power and a top-of-rack switch.
      - Two zones share a regional control plane, and often a shared managed service.
      - Two regions share your DNS provider, your identity provider, your TLS certificate authority, and your deployment pipeline.
      - **All** replicas share your code. A bug deployed everywhere fails everywhere, simultaneously, and no amount of replication helps. This is the most common correlated failure of all, and it is why progressive rollout is an availability mechanism rather than a convenience.
      - All replicas often share a configuration source. A bad configuration push is the second most common correlated failure in published postmortems.

      So when you claim N-way redundancy, the useful exercise is to list what those N copies share. That list is your real availability, and it usually contains something no diagram shows.

      There is also a nastier version: redundancy that *increases* failure probability. Systems where any one of N components can take down the whole (a shared lock, a poison message consumed by every replica, a load balancer that fails closed) have serial reliability characteristics while looking parallel on the diagram. The question is not "how many copies are there" but "how many must work".

      ### Designing with this

      Draw the request path. Mark each dependency hard or soft. Multiply the hard ones — that is your ceiling. Then work on the biggest term: remove it, cache it, make it soft, or replicate it in a way that genuinely does not share fate. And check what the recovery path depends on: a failover mechanism that requires the very control plane that is down is a common and painful discovery.

      ### Common mistakes

      Counting only the services you wrote and forgetting DNS, certificates, identity, config and the network. Assuming multi-AZ implies independence. Treating a cache as a soft dependency when the system cannot actually serve without it — that is a hard dependency wearing a disguise. Adding redundancy without alerting on the health of the redundant copies. And promising an availability target higher than the product of the things you depend on.
    resources:
      - kind: article
        title: "AWS Builders' Library: static stability using availability zones"
        url: "https://aws.amazon.com/builders-library/static-stability-using-availability-zones/"
