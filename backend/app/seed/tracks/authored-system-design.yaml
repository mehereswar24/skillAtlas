  # REPURPOSED SLUG: roadmap.sh's "performance antipatterns" node points at a
  # catalogue and stops. The slug is kept and now teaches the specific patterns
  # by their mechanism, because recognising these in a design review is worth
  # more than being able to name them.
  - slug: system-design-performance-antipatterns
    name: "Performance Antipatterns: The Six You Will Actually Meet"
    domain: architecture
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - system-design-monitoring
      - system-design-rdbms
    summary: |-
      Chatty I/O, N+1, busy database, extraneous fetching, synchronous I/O and no-caching — what each looks like on a trace, why it survives review, and the structural fix for each.
    content_md: |-
      Most systems that are slow are not slow for exotic reasons. They are slow for one of a handful of reasons that look completely reasonable in a code review and only become visible under load or on a trace. Recognising them by shape is one of the highest-return skills in design.

      ### Chatty I/O

      One logical operation makes many small remote calls. Ten calls of 5ms each are 50ms of pure latency, and none of it appears in a CPU profile. It survives review because each call is individually sensible and the loop is often hidden behind an abstraction that makes remote calls look local.

      On a trace it is unmistakable: a long row of short, similar spans. Fix by batching (one call for fifty ids), by giving the API an endpoint that returns what the caller actually needs, or by moving the operation to where the data is. Note that an ORM, a repository interface and a microservice boundary all make chatty I/O easier to write and harder to see.

      ### N+1

      The database-shaped case of the above, and common enough to deserve its own name. One query fetches N rows; then a query per row fetches something related. Twenty rows in development, five queries per page, nobody notices; two thousand rows in production, and the page issues two thousand queries.

      Fix by fetching in one query with a join, or by two queries — the list, then everything related in a single query keyed by the ids, assembled in memory. Most ORMs offer eager loading, and it is worth asserting query counts in tests, because N+1 is reintroduced constantly and never by anyone who intended to.

      ### Busy database

      Work is pushed into the database because it is convenient there: heavy business logic in stored procedures, string processing, or a reporting query run against the transactional store. The database is the hardest component to scale out and usually the most expensive, and it is shared, so this steals capacity from every other query.

      Fix by moving logic to the stateless application tier that scales horizontally, and by giving analytics its own replica or warehouse. The mirror-image antipattern — the *busy frontend*, pulling a million rows to filter them in application code — is equally real: the rule is do the set-shaped work where the data is, and the general computation where it can scale.

      ### Extraneous fetching

      Retrieving more than you need. `SELECT *` on a wide table, fetching a full object graph to read one field, or an API that returns a 200KB document because the client needed a name. It defeats covering indexes, inflates network and serialisation cost, and grows silently as columns are added.

      Fix by projecting only required columns, by paginating — always with a bound the caller cannot override to something absurd — and by letting clients specify the fields they want. Unbounded list endpoints are the version of this that eventually causes an incident.

      ### Synchronous and blocking I/O

      A thread waiting on I/O is a thread doing nothing while holding memory and a slot in a pool. With 200 threads and a dependency at 500ms, the ceiling is 400 requests per second regardless of CPU, and the failure looks like exhaustion rather than slowness: everything queues, then everything times out.

      Fix with asynchronous I/O so waiting costs a continuation rather than a thread, by doing independent work concurrently rather than in sequence, and by moving anything the caller does not need immediately onto a queue. Blocking inside an async runtime is the modern version of this bug and is worse, because the runtime's small thread pool is exhausted much faster.

      ### No caching

      Recomputing or refetching identical results repeatedly — hitting the database for reference data that changes monthly, or recomputing a permission set on every request. It is invisible until you look at cache-miss ratios or count queries per request, because each individual call is fast.

      Fix per the caching chapters. The point here is only that its absence is an antipattern in its own right, and the first place to look is any query whose result is identical for most users most of the time.

      ### Common mistakes

      Optimising what a profiler shows while the trace shows the time is in I/O. Assuming development data volumes. Adding an index instead of removing a query. Treating each of these as a code smell rather than as a structural property of the design — most of them are decided by the interface shape, which is why a design review is the cheapest place to catch them.

      **What you can do after this:** look at a trace or a query log and name which of the six is present, then state the structural fix rather than a micro-optimisation.
