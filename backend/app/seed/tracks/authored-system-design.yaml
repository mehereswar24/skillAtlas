# Hand-authored SkillAtlas content. Do NOT regenerate with
# scripts/import_roadmapsh.py — the importer skips any roadmap that has an
# `authored-<slug>.yaml` beside it, and this file is that exit.
#
# Independent curation and independent prose. This track is deliberately NOT a
# glossary of patterns. It is ordered as an argument: learn to estimate, watch
# a single-box design break, understand why it broke, and only then meet the
# pattern that fixes it. Failure modes and trade-offs lead; names follow.
#
# Written against primary sources — the public Google SRE book and workbook,
# the AWS Builders' Library, Jepsen's consistency analyses, the Raft and Dynamo
# papers, PostgreSQL/Kafka/Redis/DynamoDB documentation, the Azure Architecture
# Center pattern and antipattern catalogues, and published RFCs.
#
# Slug policy: every `system-design-*` slug that other seed data references is
# kept. Several are repurposed, because roadmap.sh splits into separate nodes
# things that are one idea (three-nines vs four-nines) and collapses into one
# node things that are several. Each repurposing is noted in a comment.

track:
  slug: system-design
  title: "System Design: Where Designs Break, and What Fixes Them"
  domain: architecture
  target_role: "Senior Backend / Distributed Systems Engineer"
  difficulty: advanced
  description: "A 43-step path through distributed system design, ordered by failure rather than by vocabulary. You start by learning to estimate load on the back of an envelope, then take a single-server design and break it — with traffic, with a slow disk, with a network partition, with a retry storm — and meet each mechanism at the moment you need it. Covers estimation, tail latency, availability arithmetic, replication and consensus, storage engines, sharding, caching and its failure modes, queues and delivery semantics, resilience and metastable failure, rate limiting, security, and three worked designs you could defend in an interview or a design review."

concepts:
  - slug: system-design-introduction
    name: "Designing Under Constraints: The Method"
    domain: architecture
    est_hours: 5
    difficulty: intermediate
    prerequisites: []
    summary: |-
      A repeatable procedure for approaching any design problem — requirements, constraints, the simplest thing that works, then finding the point where it breaks — and why starting from a pattern is the reliable way to design the wrong system.
    content_md: |-
      Most people learn system design as a catalogue: load balancers, caches, queues, shards. Then they are handed a problem and assemble the catalogue into a diagram that has never been checked against a number. The result looks like a system and is not a design, because a design is a set of *choices*, and a choice requires an alternative you rejected for a stated reason.

      This track inverts the usual order. You will learn to size a problem, build the simplest thing that could work, find where it breaks, and only then meet the mechanism that addresses that specific break. By the end you should be able to say not just "add a cache" but "reads are 200:1 over writes and the working set is 8GB, so a cache fits in memory and removes 99% of database load; the cost is staleness bounded by the TTL, and here is what happens when it expires all at once".

      ### The procedure

      **1. Clarify the functional requirements, and cut them.** What must the system do? Then narrow ruthlessly: "design a social network" is not a problem, "design the feed read and write path for 10 million daily users" is. Explicitly list what is out of scope. In a real design review and in an interview alike, a designer who narrows scope is demonstrating judgement, not dodging.

      **2. Get the non-functional requirements, because they are the design.** How many users, what read/write ratio, what latency target at the tail, what availability target, what consistency does the *product* actually require, how much data and for how long, and what does it cost when it is wrong. Notice that these are the ones that determine the architecture. Two systems with identical features and different latency targets are different systems.

      **3. Estimate.** Convert those into requests per second, bytes per second, storage per year, and a machine count. The next chapter is entirely about this. Estimation is what turns opinions into arguments — it is how you discover that the whole dataset fits on one server, or that it emphatically does not.

      **4. Define the API and the data model.** The interface constrains everything downstream. What are the entities, what are the access patterns, what is the primary key, and what queries must be fast? Access patterns before storage technology, always.

      **5. Draw the simplest design that satisfies the requirements.** Often one server and one database. Say so out loud rather than hiding it: a design that starts simple and is scaled deliberately is far more credible than one that begins with nine boxes.

      **6. Break it.** Ten times the traffic. The database at its connection limit. One availability zone gone. A dependency responding in eight seconds instead of failing. A retry loop. A single celebrity key receiving 40% of reads. For each, identify what breaks *first* — that is the bottleneck, and the bottleneck is the only thing worth fixing.

      **7. Fix the bottleneck you found, and state the new cost.** Every fix introduces something: a cache introduces staleness, a queue introduces eventual consistency and reordering, replication introduces lag, sharding introduces cross-shard queries and rebalancing. Naming the cost is what distinguishes design from shopping.

      **8. Say how you would operate it.** What you measure, what pages someone, how you deploy it, and what a partial failure looks like to a user.

      ### What separates a strong design from a weak one

      A weak design is a diagram of components. A strong design is a sequence of decisions, each with a rejected alternative and a stated cost. When someone asks "why not use X here", the good answer is never "X is bad" — it is "X trades A for B, and in this system A matters more, because of this number".

      ### Common mistakes

      Designing before estimating. Reaching for microservices, Kafka and Kubernetes before establishing that one server is insufficient. Optimising a component that is not the bottleneck. Ignoring the read/write ratio, which is usually the most decision-relevant number in the whole problem. Treating consistency as a technical preference rather than asking what the product tolerates. And presenting a design with no failure discussion, which is the single most common gap in both interviews and real design documents.
    resources:
      - kind: book
        title: "Designing Data-Intensive Applications — Martin Kleppmann"
        url: "https://dataintensive.net/"
      - kind: article
        title: "AWS Builders' Library: challenges with distributed systems"
        url: "https://aws.amazon.com/builders-library/challenges-with-distributed-systems/"
      - kind: doc
        title: "Google Cloud Architecture Framework: system design"
        url: "https://cloud.google.com/architecture/framework/system-design"
      - kind: article
        title: "Martin Fowler: patterns of distributed systems"
        url: "https://martinfowler.com/articles/patterns-of-distributed-systems/"
