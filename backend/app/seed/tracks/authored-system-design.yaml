  - slug: system-design-messaging
    name: "Brokers and Delivery Semantics: Why Exactly-Once Is a Sales Pitch"
    domain: architecture
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - system-design-asynchronism
      - system-design-consistency-patterns
    summary: |-
      Log-based versus queue-based brokers, at-most-once against at-least-once against the marketing of exactly-once, ordering guarantees and their cost, and the dual-write problem the outbox pattern solves.
    content_md: |-
      A broker is a database with an unusual access pattern, and choosing one is mostly choosing what you want its guarantees to be. Two families exist, and confusing them is the source of most design errors here.

      ### Queue-based versus log-based

      **Queue brokers** (RabbitMQ, SQS, ActiveMQ) treat a message as work to be done. A consumer takes a message, the broker makes it invisible to others, the consumer acknowledges, and the broker deletes it. Consumers compete for messages; adding consumers adds throughput directly; per-message acknowledgement means one poisonous message can be isolated without blocking the rest. Messages are gone once acknowledged, so a new consumer cannot replay history.

      **Log brokers** (Kafka, Pulsar, Kinesis) treat a message as a fact appended to a partitioned, durable, ordered log. Consumers track an offset and read forward; the broker deletes by retention policy, not by acknowledgement. Several independent consumer groups can read the same log, and a new consumer can replay from the beginning — which is what makes the log usable as a source of truth, for rebuilding a cache, backfilling a new service, or reprocessing after a bug. The cost: parallelism is bounded by partition count, and consumers within a group cannot easily process out of order, so one slow message blocks its partition.

      The rule of thumb: work to be dispatched, use a queue. Facts that several consumers care about, or that you may need to replay, use a log.

      ### The three delivery semantics

      **At-most-once.** Acknowledge before processing. Fast, and messages are lost on crash. Acceptable for metrics samples and little else.

      **At-least-once.** Acknowledge after processing. Nothing is lost, and a crash between processing and acknowledgement causes redelivery. This is what essentially every production system runs, and duplicates are therefore a normal operating condition rather than an anomaly.

      **Exactly-once.** Not achievable in general between a broker and an arbitrary external system, because the acknowledgement and the side effect are in different failure domains: whichever you do first, a crash between them breaks the guarantee. What products call exactly-once is at-least-once delivery plus deduplication *within a system that controls both ends* — Kafka's transactional producer and offset commit gives exactly-once semantics for Kafka-to-Kafka processing, and says nothing about the payment you charged in the middle.

      The practical conclusion is the same either way, and it is the reason the idempotency chapter follows this one: build consumers that produce the same result when a message arrives twice, and the delivery guarantee stops being your problem.

      ### Ordering, and its price

      Global ordering across a topic requires a single partition, which caps throughput at one consumer. Per-key ordering — all messages for one account, one order, one user in the same partition — is nearly always what the domain actually requires and scales fine. Choose the partition key deliberately: it determines both ordering and hot-partition risk, and a key with one very popular value (a celebrity account, a tenant with 40% of the traffic) reproduces the hot-key problem inside the broker.

      Also assume out-of-order arrival at the edges even so: retries, redelivery and multi-producer races all reorder. Where correctness depends on order, carry a version or timestamp in the message and let the consumer reject anything older than what it has already applied.

      ### The dual-write problem, and the outbox

      Here is the bug people ship: write to the database, then publish to the broker. Two writes, no transaction across them. Crash between and you have a committed row nobody was told about, or — if you publish first — an event about something that never happened. Under load this happens often enough to matter, and the resulting drift is very hard to debug because each system looks internally consistent.

      The fix is the **transactional outbox**: in the same database transaction as the business write, insert a row into an outbox table. A separate relay reads new outbox rows and publishes them, marking them sent. Now there is exactly one commit, and publication is at-least-once with retries — which your idempotent consumers already tolerate. Change data capture, reading the database's replication log directly, is the same idea with the relay supplied by the infrastructure.

      ### Poison messages and dead letter queues

      A message that always fails will be retried forever, and in a log broker it blocks its partition. Cap the attempts, then move it to a dead letter queue with the failure reason attached. A dead letter queue nobody looks at is a silent data-loss mechanism, so alert on it being non-empty and give it a documented replay path.

      ### Common mistakes

      Believing exactly-once and skipping deduplication. Dual writes without an outbox. Global ordering where per-key would do. A partition key that concentrates traffic. No dead letter queue, or one with no alert. And using retention as a backup when the retention window is seven days.

      **What you can do after this:** choose a broker family for a stated workload, name your delivery semantics, and describe how a duplicated message is made harmless.
