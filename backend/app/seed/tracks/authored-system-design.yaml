  - slug: system-design-availability
    name: "Defining Availability: SLI, SLO and the Error Budget"
    domain: architecture
    est_hours: 5
    difficulty: intermediate
    prerequisites:
      - system-design-introduction
    summary: |-
      Turning "is it up" into a measurable ratio, choosing a target from what users need rather than from how many nines sound impressive, and using the error budget as a design constraint.
    content_md: |-
      "Available" sounds binary and is not. A service returning 200s in 4 seconds when its target is 200ms is up by any ping check and down by any user's judgement. Before you can design for availability you have to define it as a number that reflects the user's experience.

      ### Availability as a ratio of good events

      The usable definition is: successful events divided by total events, over a window. "Successful" must be defined from the user's side and must usually include latency — a request that succeeded after 30 seconds did not succeed. So a realistic SLI reads: *the proportion of HTTP requests that returned a non-5xx status within 400ms, measured at the load balancer, over the trailing 28 days.*

      Every clause there is doing work. **Non-5xx** excludes client errors, which you do not control. **Within 400ms** makes slowness count as failure. **At the load balancer** places measurement as close to the user as you can get server-side — measured inside the service, you cannot see requests that never arrived, and those are exactly the ones that occur during the worst outages. **28 days** is a rolling window rather than a calendar month, so an incident does not get forgiven by a date change.

      Time-based availability ("minutes up divided by minutes in the period") is the older definition and is much weaker, because it forces a binary judgement on every minute and gives a 5%-error-rate hour the same weight as a total outage — or none at all, depending on how you round.

      ### Choosing a target

      Availability targets should come from what users need and what the rest of the stack can deliver, not from ambition. Two arguments constrain them from above.

      First, your users' own path is unreliable. Mobile networks drop a meaningful fraction of requests. If the user's connection is 99% reliable, the difference between your 99.9% and your 99.99% is invisible to them, and you spent a great deal to achieve it.

      Second, you cannot be more available than your dependencies, a point the composition chapter makes arithmetically.

      So pick the *lowest* target that keeps users happy and the business safe. This is genuinely counterintuitive: a lower reliability target is often the correct engineering decision, because reliability beyond the point of perception consumes budget and — importantly — velocity.

      ### The error budget, and why it is the useful part

      The complement of the target is a budget of permitted failure. 99.9% over 28 days is roughly 40 minutes of total unavailability, or an equivalent amount of partial failure. That budget is a resource you spend deliberately: on risky deploys, on migrations, on experiments.

      It converts the perpetual argument between shipping and stability into a measurement. Budget remaining means ship. Budget exhausted means reliability work takes precedence until the window rolls forward. It also gives you a principled answer to "should we do this risky migration on Tuesday" — you can afford it or you cannot, and the number says which.

      The corollary that surprises people: consistently *not* using your error budget is also a signal. It means you are being more careful than the target requires, and could be shipping faster.

      ### SLA is a different thing

      An SLO is your internal target. An SLA is a contract with a customer and a financial penalty. Set the SLA looser than the SLO, always, so that you breach your internal target and react well before you breach a contract. Also read carefully what an SLA measures — many published cloud SLAs are monthly, exclude scheduled maintenance, and require the customer to file a claim, which makes them a much weaker promise than the number suggests.

      ### Common mistakes

      Availability SLIs that ignore latency. Measuring only inside your own service. Setting a target because it sounds good rather than deriving it. Calendar-month windows. Averaging availability across endpoints so that a broken checkout is hidden by a healthy static asset path. Counting only complete outages and ignoring partial failure, which is how most real degradation actually presents. And publishing an SLO that no one enforces, which is a number rather than a policy.
    resources:
      - kind: article
        title: "Google SRE Book: service level objectives"
        url: "https://sre.google/sre-book/service-level-objectives/"
      - kind: article
        title: "Google SRE Workbook: implementing SLOs"
        url: "https://sre.google/workbook/implementing-slos/"
      - kind: article
        title: "Google SRE Workbook: error budget policy"
        url: "https://sre.google/workbook/error-budget-policy/"
      - kind: article
        title: "Google SRE Book: embracing risk"
        url: "https://sre.google/sre-book/embracing-risk/"
      - kind: doc
        title: "Azure Well-Architected: reliability targets and metrics"
        url: "https://learn.microsoft.com/en-us/azure/well-architected/reliability/metrics"
