  - slug: system-design-high-availability
    name: "Failover Mechanics: Health Checks, Quorum and the Failover That Made It Worse"
    domain: architecture
    est_hours: 6
    difficulty: advanced
    prerequisites:
      - system-design-active-passive
    summary: |-
      The machinery that automates recovery — and an honest look at how often that machinery is itself the cause of the outage, plus grey failure, the hardest case of all.
    content_md: |-
      Having covered topologies, this chapter is about the automation that drives them, and about a genuinely uncomfortable fact: recovery mechanisms cause a substantial share of major outages. Understanding why is what makes you good at this.

      ### Health checks decide everything, so they must be right

      A health check is a claim about whether a component should receive traffic, and the design space is subtler than it looks.

      A **shallow** check ("is the process listening?") misses a wedged process that accepts connections and never responds. A **deep** check that verifies every downstream dependency has the opposite failure: when a shared dependency degrades, every instance reports unhealthy simultaneously, the load balancer removes them all, and a partial degradation becomes a total outage. This specific mechanism has taken down large production systems repeatedly and is the most important thing to internalise here.

      The workable design: check what *this instance* can control — is its event loop responsive, are its local resources sane. Handle dependency problems through timeouts, degradation and load shedding, not by declaring yourself dead. Separate liveness (restart me) from readiness (route to me). And keep a fail-open behaviour: if every instance fails its check, send traffic anyway, because a possibly-degraded fleet beats a guaranteed outage.

      ### Quorum: why three, and why never two

      Automated failover needs an authority to decide who is in charge, and that authority must survive partition. Majority quorum is the answer: a group of 2f+1 nodes tolerates f failures, because only one side of any partition can hold a majority.

      This is why cluster managers want odd sizes. Three nodes tolerate one failure. Five tolerate two. Four nodes tolerate only one failure — the same as three — while costing more and having more ways to fail, which is why even-sized clusters are a common and pointless configuration. Two nodes cannot do automated failover safely at all, which is what witness or arbiter nodes solve: a tiny third voter that stores no data but breaks ties.

      ### Why the failover mechanism causes outages

      Several recurring patterns, worth memorising:

      **Flapping.** Detection is too aggressive, a transient blip triggers failover, the promotion itself is disruptive, and the disruption triggers another. Add hysteresis, require several consecutive failures, and impose a cooldown after any promotion.

      **Untested paths.** Failover code runs rarely, so it is the least tested code you own, and it runs for the first time under maximum stress. The mitigation is to exercise it deliberately and on a schedule.

      **Recovery that depends on what is broken.** A failover requiring the control plane, the config service or DNS — all of which may be affected by the same event. Recovery paths should depend on strictly fewer things than the normal path, never more.

      **Thundering herd on recovery.** Everything reconnects simultaneously, every cache is cold, every client retries at once, and the recovered system immediately falls over again. Stagger reconnections with jitter, ramp traffic gradually, and warm caches before taking full load.

      **Automation with no brakes.** A remediation loop that replaces "unhealthy" instances can cheerfully replace an entire fleet during a bad deploy. Rate-limit any automated destructive action and require human confirmation past a threshold.

      ### Grey failure: the hardest case

      Crashes are easy — they are unambiguous. The hard case is a component that is *degraded*: responding slowly, failing 5% of requests, returning stale or corrupt data, or healthy from the health checker's viewpoint and broken from the client's. Health checks pass, failover does not trigger, and the system limps on while users suffer.

      Handling grey failure needs client-observed signals rather than self-reported health: error rates and latency measured by callers, outlier detection that ejects an instance whose behaviour diverges from its peers, and load balancing (least-outstanding-requests) that naturally routes around slowness without any explicit health decision. Alerting on the *difference* between instances is often more sensitive than alerting on any absolute threshold.

      ### Common mistakes

      Deep health checks. Even-numbered quorums. Failover that has never been drilled. No cooldown. Recovery paths with more dependencies than the serving path. Unbounded automated remediation. And measuring health only from the server's own perspective, which is precisely the perspective that cannot see grey failure.
