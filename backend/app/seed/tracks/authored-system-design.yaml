  - slug: system-design-reliability-patterns
    name: "Metastable Failure: Why Systems Do Not Recover When the Cause Goes Away"
    domain: architecture
    est_hours: 7
    difficulty: advanced
    prerequisites:
      - system-design-resiliency
      - system-design-asynchronism
    summary: |-
      Cascading and metastable failure, the sustaining feedback loops that keep an outage alive after its trigger is gone, graceful degradation, and the recovery techniques that actually break the loop.
    content_md: |-
      The previous chapter protected one caller from one dependency. This one is about the system as a whole, and about the single most surprising thing in operations: a system that stays down after the thing that broke it has been fixed.

      ### The shape of a metastable failure

      A system in a **stable** state absorbs a shock and returns. A system in a **metastable** state has entered a mode where its own behaviour supplies the load that keeps it there. The trigger is gone; the outage continues.

      The canonical sequence. A brief network blip causes some requests to fail. Clients retry, so load rises to 1.4x. The extra load pushes latency past client timeouts, so more requests fail, so more retries. Now load is 3x, essentially all of it retries of work that will time out anyway. The network blip ended four minutes ago. Restarting the service does not help: it comes up into 3x load and immediately saturates. Only reducing the *incoming* load breaks it.

      The general form is a **sustaining feedback loop**: work amplification driven by failure. Retry storms are the most common. Others: a cache that empties during an incident, sending every request to a database that is now the bottleneck, keeping the cache too busy to refill; queue backlogs where every dequeued item is already past its deadline, so the consumer runs at full throughput producing nothing useful; connection storms after a restart, where reconnect attempts prevent the service from finishing startup; and garbage-collection death spirals, where memory pressure from queued work causes pauses that queue more work.

      Recognising the pattern has a practical payoff. If throughput is high but goodput — useful, delivered work — is near zero, you are in a loop, and adding capacity will not fix it because the load will grow to fill it.

      ### Breaking the loop

      Only three things work, and all of them mean serving less.

      **Shed load at the edge, aggressively.** Reject a large fraction of requests cheaply, and prefer rejecting by priority. This is counterintuitive under pressure and it is the reliable move: a system serving 40% of traffic well recovers, a system serving 100% badly does not.

      **Stop the retries.** Retry budgets and circuit breakers are the automated version. Manually, this can mean turning off a client's retry behaviour with a feature flag, which is a good argument for having that flag before you need it.

      **Drain, do not restart.** Restarting into full load re-enters the loop. Take instances out of rotation, let them recover, and reintroduce them gradually. For a cold cache, warm it before accepting traffic, or admit traffic in a ramp.

      Note that this is why goodput deserves a dashboard of its own. Requests-per-second looks *healthy* during a metastable failure.

      ### Graceful degradation, decided in advance

      A design has degradation levels whether or not anyone chose them. Choosing them is the work.

      Rank features by what the product cannot do without: for a shop, browse and checkout are essential; recommendations, reviews and personalisation are not. Then define the modes — full service; reduced (personalisation off, recommendations static, search results from cache); essential only (browse and buy, everything dynamic disabled); and read-only, where writes are refused but the site still serves. Make each mode a switch someone can flip in seconds, and rehearse flipping it. A degradation plan that requires a deploy is not available during the incident that needs it.

      Static stability is the same idea applied to dependencies: prefer a design that keeps working on its last known good configuration when its control plane is unreachable, rather than one that needs a live lookup on every request.

      ### Verifying it before it matters

      None of this can be assumed to work. Fault injection — killing an instance, adding 500ms to a dependency, blackholing a subnet, filling a disk — in a controlled window with a hypothesis written down first is the only way to know. Start in staging, then a small production slice with an abort criterion. Game days, where the team practises the runbook against an injected fault, find the second failure: the one where the mechanism works and nobody knows how to use it.

      ### Common mistakes

      Adding capacity to a metastable failure. Restarting into full load. Alerting on throughput rather than goodput. No load shedding, so overload becomes collapse. Degradation modes that exist only in a document. Fallback paths that are never exercised and are broken when first used. And treating the trigger as the root cause when the amplifier is what kept it going.

      **What you can do after this:** identify a sustaining loop in a system you know, and name the specific control — shed, break, drain — that would exit it.
