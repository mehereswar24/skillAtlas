  # REPURPOSED SLUG: roadmap.sh's "CP (consistency/partition tolerance)" node is
  # a two-line definition. Kept as a slug and given the substance it implies —
  # how a CP system is actually built, i.e. consensus — which the original
  # syllabus never covers at all.
  - slug: system-design-cp-consistency-partition-tolerance
    name: "Consensus: How CP Systems Are Actually Built"
    domain: architecture
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - system-design-availability-vs-consistency
    summary: |-
      Raft and Paxos, replicated logs, leader election and majority quorums — what consensus buys, what it costs in latency, and the small-metadata-store pattern that lets you use it without paying for it everywhere.
    content_md: |-
      Choosing consistency during a partition means the system must be able to agree, safely, on a single sequence of events despite failures. That agreement problem is consensus, and it is the foundation under every strongly consistent distributed system you will use.

      ### The problem, and why it is hard

      Get a group of nodes to agree on a value, such that: they agree on the *same* value, the value is one somebody proposed, and the decision is permanent. Over an asynchronous network where messages can be delayed, reordered, duplicated or lost, and where nodes can crash and restart, and where you cannot distinguish a crashed node from a slow one. That last point is the crux, and the FLP result formalises it: no deterministic algorithm can guarantee consensus in a fully asynchronous system with even one faulty node. Practical algorithms sidestep this with timeouts and randomisation, trading guaranteed termination for termination in practice.

      ### Raft, because it is the one you can hold in your head

      Raft was explicitly designed to be understandable, and it decomposes the problem into three pieces.

      **Leader election.** Nodes are follower, candidate, or leader. Followers expect regular heartbeats; when one times out, it becomes a candidate, increments the term number, and requests votes. A candidate winning a majority becomes leader. Randomised election timeouts make simultaneous candidacies unlikely, which is the trick that makes the whole thing converge.

      **Log replication.** All client writes go to the leader, which appends to its log and replicates to followers. Once a **majority** have written the entry, it is *committed* and can be applied. Majority is what makes this safe: any two majorities intersect, so a newly elected leader necessarily has every committed entry.

      **Safety.** A node may only vote for a candidate whose log is at least as up to date as its own, which guarantees committed entries are never lost across leader changes.

      Paxos solves the same problem and predates Raft; Multi-Paxos is what people actually deploy, and it is broadly equivalent in capability. Raft is worth learning first because you can actually follow it.

      ### What it costs

      **Latency.** Every write requires a round trip to a majority. Within a datacentre, single-digit milliseconds. Across regions, tens to hundreds — and no implementation avoids this, because the round trip is physics. This is the price of the consistency, paid on every write.

      **Throughput.** All writes flow through one leader. A consensus group does not scale writes; to scale, you run many groups over partitioned data, which is exactly what distributed databases do.

      **Availability.** Tolerates only a minority failing. Three nodes tolerate one, five tolerate two. Lose a majority and the system is *correctly* unavailable rather than incorrectly wrong — which is the whole point of choosing CP.

      **Complexity.** Implementing consensus correctly is famously difficult and the subtle bugs are subtle indeed. Use an existing, well-tested implementation.

      ### The pattern that makes this practical

      Do not run your entire workload through consensus. Instead, use a small consensus-backed store for the small, critical, rarely-changing state that *must* be consistent — cluster membership, which node is the leader, configuration, distributed locks, service discovery, feature flags — and keep the bulk of your data in a system with cheaper guarantees.

      This is how nearly all large systems are organised, and etcd (backing Kubernetes) and ZooKeeper (backing much of the Hadoop and Kafka ecosystem) are the canonical implementations. The metadata is tiny, so throughput and latency are not a problem, and the strong guarantees are exactly what leader election and configuration need.

      One extension worth knowing: **leases**. A lock with an expiry avoids permanent blockage when a holder dies. But a lease alone is unsafe — the holder may pause (garbage collection, a hypervisor stall) past its expiry, wake up believing it still holds the lock, and act. This is why fencing tokens matter: the lease grants a monotonically increasing number, and the protected resource rejects anything with a stale one. A distributed lock without fencing is not a lock.

      ### Common mistakes

      Building consensus yourself. Even-sized clusters, which cost more and tolerate no more failures. Running a consensus store across regions and being surprised by write latency. Putting high-volume application data into etcd or ZooKeeper, which are designed for small critical state and will fall over. Using distributed locks without fencing tokens. And assuming a majority-quorum system is available during a partition — it is not, on the minority side, by design.
    resources:
      - kind: article
        title: "In Search of an Understandable Consensus Algorithm (the Raft paper)"
        url: "https://raft.github.io/raft.pdf"
      - kind: doc
        title: "The Raft consensus algorithm — visualisations and resources"
