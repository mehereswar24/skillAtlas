  - slug: system-design-background-jobs
    name: "Background Jobs, Schedulers and the Retry Storm"
    domain: architecture
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - system-design-asynchronism
      - system-design-availability-patterns
    summary: |-
      Event-driven against scheduled work, why cron on one box is a single point of failure, backoff with jitter, and the thundering herd that synchronised retries and midnight schedules create.
    content_md: |-
      Background work splits into two kinds with different failure modes. **Event-driven** jobs run because something happened: send the receipt, generate the thumbnail, reindex the changed document. **Scheduled** jobs run because the clock said so: nightly reconciliation, hourly rollups, weekly reports. Event-driven work inherits the queue and delivery-semantics problems of the previous chapters. Scheduled work has its own, and they are less well known.

      ### Scheduling that survives a machine dying

      cron on a single server is the default and it is a single point of failure with no visibility: if that box is down at 02:00, the job did not run and nothing says so. If you deploy the same crontab to three boxes for redundancy, the job now runs three times. Both failure modes are common and both are silent.

      What you need is a scheduler with three properties: leader election or distributed locking so exactly one instance fires a given occurrence, durable state so a restart does not skip or replay, and — most importantly — **an alert on the job that did not run**. Missing-execution alerting is the one people skip, and a nightly job that has been silently failing for three weeks is discovered by an accountant, not by a monitor. Emit a heartbeat on completion and alert on its absence.

      Three further rules. Assume overlap: if a run takes longer than the interval, either skip or queue the next occurrence, but decide which, because concurrent runs of a reconciliation job corrupt the thing they reconcile. Assume replay: a job may run twice, so it must be idempotent, exactly like a message consumer. And be explicit about time zones and daylight saving — schedule in UTC, because an hour that occurs twice a year and an hour that does not exist are both real bugs in local-time schedules.

      ### The midnight thundering herd

      Everything scheduled "daily" gets written as midnight, so at 00:00 every job in the estate starts at once, together with every other tenant on shared infrastructure. The database that carries the daytime load comfortably now serves a hundred full-table scans simultaneously.

      Spread the load deliberately: derive the minute from a hash of the job name or tenant id, or add a random offset within the acceptable window. The same fix applies to anything that starts synchronised — token refreshes, cache warms, TTLs that all expire together.

      ### Retries, and how they become an outage

      Retrying a failed job is obviously right and is the mechanism by which a small problem becomes a large one. When a dependency slows, every caller retries; retries add load; the added load makes it slower; more calls fail; more retries. The system's load is now driven by its own failure, and it will not recover when the original cause is removed. This is the retry storm, and it is the most common way a five-minute blip becomes a two-hour outage.

      Four defences, all necessary.

      **Exponential backoff with jitter.** Doubling alone keeps clients synchronised — they all fail together, all wait two seconds, all retry together. Randomising the wait spreads them out, and full jitter (sleep a random duration between zero and the current cap) is measurably better than a small random addition. Cap the maximum backoff.

      **A retry budget.** Cap retries as a fraction of total requests — for example, allow retries only while they are under 10% of traffic. This is strictly better than per-request attempt limits, because it bounds the *aggregate* amplification, which is what actually causes the storm.

      **No retries at multiple layers.** If the client retries three times, the gateway retries three times, and the service retries three times, one user action becomes twenty-seven requests. Retry at exactly one layer, and make the other layers pass the failure through.

      **Circuit breaking.** Stop calling a dependency that is failing, which is the subject of the resiliency chapter.

      Only retry what is retryable: a 503 or a timeout, yes; a 400 or a validation failure, never — that is a guaranteed-to-fail request consuming capacity.

      ### Common mistakes

      cron on one box, or the same cron on several. No alert for a job that never ran. Jobs that are not idempotent. Everything at midnight. Backoff without jitter. Retries stacked at three layers. And long-running jobs with no checkpoint, so a failure at 90% starts again at zero.

      **What you can do after this:** schedule a recurring job so that it runs exactly once, is safe if it runs twice, alerts if it runs never, and does not stampede the database at midnight.
