  # REPURPOSED SLUG: roadmap.sh's second availability node ("99.99% / four 9s")
  # duplicated the first. Kept as a distinct concept here by giving it the
  # question the table cannot answer: what does each additional nine cost, and
  # when is buying one the wrong decision?
  - slug: system-design-99-99-availability-four-9s
    name: "The Cost Curve of Extra Nines"
    domain: architecture
    est_hours: 4
    difficulty: advanced
    prerequisites:
      - system-design-availability-in-parallel-vs-sequence
    summary: |-
      Why each additional nine costs several times the last, what you must give up to get it (velocity, simplicity, consistency), and how to argue for a lower target.
    content_md: |-
      Having established what availability means and how it composes, the remaining question is economic: what does the next nine cost, and is it worth buying?

      ### The curve is steeply superlinear

      Getting from 99% to 99.9% is usually straightforward engineering: redundant instances, health checks, automated restarts, a load balancer, sensible timeouts. Most competent teams reach it with the material in the first half of this track.

      Getting from 99.9% to 99.99% is a different exercise. Fifty-two minutes a year means that a single bad deployment caught in ten minutes has consumed a fifth of the annual budget. You now need automated rollback, progressive delivery with automated analysis, multi-zone redundancy with tested failover, no single points of failure anywhere including the ones you have not looked at, and — the expensive part — you need your *dependencies* at that level too, or the multiplication in the previous chapter caps you regardless.

      Getting to 99.999% means humans cannot be in the recovery path at all. Everything must fail over automatically and correctly, including the cases where the fault is ambiguous, which is where automatic failover causes outages of its own. Very few systems genuinely need this, and the ones that do usually achieve it by making the component's failure irrelevant rather than by making the component reliable.

      ### What you pay in, other than money

      **Velocity.** Change is the dominant cause of outages in most systems. Tightening availability tightens the change process: more review, more staged rollout, more soak time, more freeze windows. That is a real cost paid in features not shipped, and it is invisible in the reliability budget.

      **Simplicity.** Every mechanism that buys a nine — multi-region replication, automatic failover, complex routing — adds components with their own failure modes. Past a point, the added complexity causes more outages than the added redundancy prevents. This is not hypothetical; it is a recurring theme in published postmortems, where the failover mechanism, the retry logic, or the automated remediation is the proximate cause.

      **Consistency, or latency, or both.** Multi-region availability forces the trade-off the CAP and replication chapters develop: either you accept cross-region write latency, or you accept that regions can diverge and you must reconcile.

      **Operational load.** More redundancy is more surface to monitor, patch, test and pay for, and it is carried by an on-call rotation that is itself a finite resource.

      ### How to argue for a lower target

      The strongest argument is user-centred: measure what users actually experience end to end, including their own network. If the client-observed reliability is dominated by mobile connectivity, additional server-side nines are undetectable, and the money is better spent on making the client resilient — retry, offline queueing, optimistic UI — than on the backend.

      The second argument is differential. Availability is not one number for the whole system. Checkout might warrant 99.99%; the recommendations sidebar warrants 99% and should degrade silently. Setting per-journey targets lets you spend where it counts and, crucially, lets you make the low-value dependency *soft*.

      The third is honest accounting: state what the next nine costs in engineering time and infrastructure, and what it prevents in expected annual downtime. Often the expected loss avoided is smaller than the cost, and that comparison is a legitimate reason to stop.

      ### Common mistakes

      Committing to a target without checking the dependency product. Adding a failover mechanism that has never been exercised, which lowers real availability while raising the theoretical figure. One target for every endpoint. Ignoring that most outages are caused by change, and then investing in redundancy rather than in delivery safety. And treating the availability number as a matter of prestige, which reliably produces both overspending and dishonest measurement.
