  - slug: system-design-consistency-patterns
    name: "Consistency Models and the Session Guarantees That Actually Help"
    domain: architecture
    est_hours: 7
    difficulty: advanced
    prerequisites:
      - system-design-cp-consistency-partition-tolerance
      - system-design-ap-availability-partition-tolerance
    summary: |-
      The hierarchy from linearizable to eventual, why causal consistency is the sweet spot, and the four session guarantees that fix most user-visible anomalies at very low cost.
    content_md: |-
      "Strong" and "eventual" are the two words most people know, and between them lies a well-defined hierarchy. Knowing the middle of it is what lets you buy exactly the guarantee your product needs instead of overpaying or under-delivering.

      ### The hierarchy, strongest first

      **Linearizability.** The system behaves as if there were a single copy and every operation took effect instantaneously at some point between its invocation and its response. Crucially it includes *real-time* ordering: an operation that completes before another begins is ordered before it, even across different clients with no communication. This is what makes it expensive — it requires coordination — and what makes it easy to reason about. Needed for locks, leader election, uniqueness constraints, and anything where two clients must not both believe they succeeded.

      **Sequential consistency.** All clients see operations in the same order, and each client's own operations appear in its program order — but that global order need not match real time. Weaker, and rarely the explicit target in practice.

      **Causal consistency.** Operations that are causally related (this write happened after that read) are seen in that order by everyone; genuinely concurrent operations may be seen in different orders by different observers. This is the interesting one. It prevents the anomalies people actually notice — a reply appearing before the message it replies to, a photo visible after its access control was tightened — and it can be provided *without* coordination, so it remains available during partitions. There is good theoretical work showing causal consistency is the strongest model achievable in an always-available system, which makes it the natural sweet spot.

      **Eventual consistency.** If writes stop, replicas eventually converge. It says nothing about ordering, nothing about how long, and nothing about what you see in the meantime. It is a liveness property with no safety content, which is why it is so often disappointing in practice.

      ### The four session guarantees

      Between causal and eventual sit cheap, targeted guarantees scoped to one client's session. They are worth knowing by name because they map directly onto bug reports.

      **Read your writes.** You always see your own updates. Fixes "I saved it and it's gone."

      **Monotonic reads.** You never see time move backwards. Fixes "I refreshed and my comment disappeared again."

      **Monotonic writes.** Your writes are applied in the order you issued them. Fixes "I set it to A then B, and it ended up A."

      **Writes follow reads.** A write you make after reading something is ordered after that thing. Fixes replies appearing before their parent.

      The reason these matter so much is economic: they address nearly all *user-visible* anomalies while costing very little, because they only constrain one session rather than requiring global agreement. Implementations are correspondingly cheap — sticky routing so a session always hits the same replica, or a client-carried version token that a replica must have reached before it answers.

      A useful reframing: users do not perceive global consistency. They perceive *their own* history being coherent. Buying session guarantees rather than linearizability is often the highest-value decision in a design, and it is the one most people never consider because they only know the two extremes.

      ### Transactions and isolation are a separate axis

      A common confusion: consistency models describe how replicas relate; isolation levels describe how concurrent transactions relate. Read committed, snapshot isolation, and serializable are the isolation ladder, and each permits specific anomalies — non-repeatable reads, phantoms, write skew. A database can be serializable on a single node and offer only eventual consistency across replicas. Know which axis you are discussing; the relational chapter takes isolation up properly.

      ### Choosing

      Ask what a user does with the data. Two users bidding on the last item need linearizability on that decrement. A user reading their own profile after editing it needs read-your-writes and nothing more. A user scrolling a feed needs monotonic reads and can tolerate seconds of staleness. Analytics can tolerate minutes.

      Then apply the guarantee per operation. A system with one consistency setting for everything is either slow or wrong, and usually both in different places.

      ### Common mistakes

      Believing there are only two options. Assuming your database provides what its documentation implies — Jepsen exists because implementations frequently do not, and the gap between claimed and actual behaviour is a recurring finding. Using linearizable reads everywhere out of caution and paying coordination latency on every request. Confusing serializable isolation with linearizability (strict serializability is both, and they are not the same thing). And never asking the product question, which is the only way to know which guarantee you need.
    resources:
      - kind: doc
        title: "Jepsen: consistency models (the definitive map)"
        url: "https://jepsen.io/consistency"
