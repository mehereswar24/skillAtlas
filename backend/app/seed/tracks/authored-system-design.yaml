  - slug: system-design-monitoring
    name: "Observability: The Four Signals, and Alerting on Symptoms"
    domain: architecture
    est_hours: 7
    difficulty: intermediate
    prerequisites:
      - system-design-availability
      - system-design-latency-vs-throughput
    summary: |-
      Metrics, logs and traces and what each is actually for, why averages and percentile averages lie, alerting on user-visible symptoms against causes, and making a design debuggable before it ships.
    content_md: |-
      A design you cannot observe is a design you cannot operate. This is not an afterthought bolted on before launch: whether a system is debuggable at 3am is decided by choices made while designing it — whether requests carry an id, whether the queue exposes age, whether every dependency call is measured.

      ### Three signals, three jobs

      **Metrics** are cheap numeric aggregates over time. They answer "is something wrong" and "is it getting worse", and their cost is roughly independent of traffic, which is what makes them the basis of alerting. They cannot answer "why", because aggregation has already discarded the individual case.

      **Logs** are discrete events with detail. They answer "what happened to this particular request", and their cost scales with traffic, which is how logging bills become larger than compute bills. Structured logs — key-value, machine-parseable — are queryable; free-text logs are grep and hope. Sample the high-volume happy path, keep the errors.

      **Traces** follow one request across every service it touches, with timing per hop. They answer "where did the time go" and "what did this request actually call", which is the question a metric dashboard cannot answer once you have more than three services. Head sampling keeps a fixed fraction; tail sampling decides after the fact, which lets you keep every slow or failed trace — much more useful, and more machinery.

      The connective tissue is a **correlation id** generated at the edge and propagated everywhere, into logs, spans and downstream calls. Adding it later is expensive; designing it in costs nothing.

      ### What to measure

      For every request-serving component, the RED signals: **R**ate, **E**rrors, **D**uration. For every resource, the USE signals: **U**tilisation, **S**aturation, **E**rrors. Google's four golden signals — latency, traffic, errors, saturation — are the same idea. Whichever vocabulary you use, the point is that these are the small set that generalise, so instrument them uniformly rather than inventing a bespoke dashboard per service.

      Measure at the boundaries: every inbound endpoint and every outbound dependency call. The second half is the one teams skip, and it is what turns "the service is slow" into "the service is slow because the auth call went from 5ms to 400ms".

      ### Averages lie, and so does averaging percentiles

      An average latency hides the tail entirely: a service at 50ms average may be serving 5% of users in two seconds. Alert and report on percentiles — p50 for the typical case, p99 and p99.9 for the experience that generates complaints.

      Then avoid the arithmetic error that is everywhere in dashboards: **percentiles do not average**. The mean of each instance's p99 is not the fleet's p99, and a 5-minute p99 averaged over an hour is not the hour's p99. Percentiles must be computed from the underlying distribution — histogram buckets aggregated across instances and time, then the quantile taken. Systems that store pre-computed percentiles per instance per minute cannot give you a correct fleet-wide number, and this quietly makes dashboards optimistic.

      Also measure what the user experiences rather than what the server emits. Server-side latency excludes queueing before your process, network time and client rendering — all of which the user feels.

      ### Alert on symptoms

      Every alert should correspond to a human doing something. The reliable formulation is: alert on user-visible symptoms, and use causes for diagnosis.

      "Error rate above 1% for five minutes" is a symptom — users are affected, act now. "CPU above 80%" is a cause: it may be entirely fine, it fires constantly, and it trains people to ignore the pager. Error-budget-based alerting is the mature version: page when the rate of budget consumption means the SLO will be missed, which automatically scales urgency to actual impact and eliminates most of the noise.

      Everything else belongs on a dashboard or in a ticket. An alert that is routinely ignored is worse than no alert, because it also erodes trust in the ones that matter.

      ### Common mistakes

      No correlation id. Alerting on causes, so the pager cries wolf. Averaged percentiles. Unstructured logs. Logging at full volume and discovering the bill. No instrumentation on outbound dependency calls. Dashboards nobody reads and alerts nobody trusts. And a runbook link missing from the alert that needs one.

      **What you can do after this:** define the RED metrics, one symptom-based alert and the trace propagation for a service, and explain why its p99 cannot be derived by averaging per-instance p99s.
