  - slug: system-design-active-active
    name: "Active-Active and Multi-Region: Serving Writes in Two Places"
    domain: architecture
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - system-design-master-master
      - system-design-active-passive
    summary: |-
      Every region serving live traffic — what it genuinely buys, the data problem it forces you to confront, and the partitioning strategies that make it tractable.
    content_md: |-
      Active-active means every replica serves production traffic. For stateless services this is trivial and obviously correct. For anything holding state, and especially across regions, it is one of the largest commitments in system design.

      ### What it buys

      **No failover delay for reads.** Traffic is already flowing everywhere, so losing a region removes capacity rather than requiring a promotion. That eliminates detection time, promotion time and the cold-standby problem all at once.

      **Local latency.** Users are served from a nearby region, saving the 100–200ms that a cross-continental round trip costs and cannot be optimised away.

      **Capacity utilisation.** You are not paying for idle standby hardware.

      **Tested continuously.** Unlike a standby, an active region is exercised every second, so you know it works. This is a bigger advantage than it first appears, given the previous chapter.

      ### What it costs: the write path

      Reads are easy. Writes force a decision, and there are only three honest answers.

      **Route all writes to one region.** Reads are local and fast, writes pay the cross-region round trip. This is "active-active for reads, active-passive for writes" and it is by far the most common real deployment — because it keeps a single authoritative order for writes and therefore keeps the whole consistency problem away. If write latency is acceptable for your product, stop here; you have most of the benefit for a fraction of the difficulty.

      **Partition writes by key.** Each record has a home region — usually the region of the user who owns it — and writes for that record always go there. Since two regions never write the same record, there are no conflicts. This works beautifully when your data partitions naturally by user or tenant, and it is the design most large consumer systems converge on. It fails for genuinely global shared state: a global inventory count, a username uniqueness check, a global leaderboard. Those need their own mechanism (a single authoritative region, or a consensus-backed store) regardless of how everything else is arranged.

      **Accept concurrent writes anywhere and resolve conflicts.** The full multi-leader problem from earlier: LWW, version vectors, CRDTs or application merge. Choose this only when you must, and only with an explicit conflict policy.

      There is a fourth option — a globally distributed database that provides strong consistency across regions using synchronised clocks and consensus. It is genuinely remarkable engineering, and it does not repeal physics: a cross-region strongly consistent write still costs a cross-region round trip. It moves the complexity into the database rather than removing it, which is often an excellent trade.

      ### The things people forget

      **Global state that resists partitioning.** Uniqueness constraints, sequence generators, quota counters, "is this coupon still valid". Design these deliberately.

      **Failover capacity.** If two regions each run at 60%, losing one leaves 120% on the survivor. Multi-region without spare capacity is multi-region that fails over into an overload.

      **Data residency.** Regulations may require certain users' data to stay in a jurisdiction, which constrains routing and replication independently of any technical argument.

      **Cost.** Cross-region data transfer is expensive and continuous, and full replication multiplies storage. This is frequently the line item that ends the discussion.

      **The routing layer.** Whatever directs users to a region — DNS-based geo routing, anycast, a global load balancer — is now a critical global dependency, and several large public outages have originated exactly there rather than in the regions themselves.

      ### The recommendation

      Multi-region active-active is the right answer for global consumer products with natural per-user partitioning and a genuine latency requirement, and for systems with a regulatory or contractual regional-failure requirement. It is the wrong answer for a team that has not yet mastered multi-zone, and adopting it for "resilience" without a tested failover often produces a system that is less reliable than a well-run single region — because the added machinery fails more often than the region does.

      ### Common mistakes

      Going active-active for resilience without ever testing regional failure. No conflict policy. Forgetting global uniqueness constraints. Sizing regions with no failover headroom. Assuming replication lag between regions is negligible when it is tens to hundreds of milliseconds and occasionally much worse. And treating the global routing layer as infrastructure rather than as the highest-risk component in the design.
