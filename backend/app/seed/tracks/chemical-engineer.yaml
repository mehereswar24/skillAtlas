track:
  slug: chemical-engineer
  title: Study Chemical Engineering
  domain: chemical
  target_role: Process Engineer
  difficulty: advanced
  description: >-
    Mass and energy balances, transport phenomena, reaction engineering and
    process design and safety — scaling chemistry from a flask to a plant.

concepts:
  - slug: mass-and-energy-balances
    name: Mass & Energy Balances
    domain: chemical
    est_hours: 40
    difficulty: intermediate
    prerequisites: []
    summary: >-
      The accounting discipline underneath every process: what goes in, what
      comes out, what accumulates.
    content_md: |
      Almost every chemical engineering problem starts as a balance. In = out +
      accumulation + generation, applied to a clearly defined control volume.

      **Draw the boundary first.** Most errors are not arithmetic; they are an
      ambiguous or shifting system boundary. Label every stream, choose a basis
      (100 kg/h of feed is often easiest), and be explicit about steady state
      versus transient.

      **Degrees of freedom.** Count unknowns against independent equations before
      solving. If the problem is underspecified, no amount of algebra will help
      and you need another measurement or assumption — recognising this early
      saves hours.

      **Recycle and purge.** Real plants recycle unreacted feed, which couples
      the balances and makes them iterative. A purge stream exists to stop
      inerts accumulating without limit; sizing it is a classic trade-off
      between yield and impurity build-up.

      **Energy balances** add enthalpy: sensible heat, latent heat of phase
      change, and heat of reaction. Reference states must be consistent or the
      numbers are meaningless.

      Balances are also the diagnostic tool of choice on a running plant: if
      what comes out does not match what went in, something is leaking,
      accumulating, or being measured wrongly.
    resources:
      - kind: course
        title: "MIT OCW — Chemical Engineering courses"
        url: https://ocw.mit.edu/search/?d=Chemical%20Engineering
        provider: MIT
        duration_min: 1800
      - kind: book
        title: "Elementary Principles of Chemical Processes"
        url: https://www.wiley.com/en-us/Elementary+Principles+of+Chemical+Processes%2C+4th+Edition-p-9781119498759
        provider: Felder & Rousseau
        is_free: false
        duration_min: 1800
      - kind: doc
        title: "LearnChemE — screencasts and interactive simulations"
        url: https://learncheme.com/
        provider: CU Boulder
        duration_min: 600
    quiz:
      - prompt: What is the purpose of a purge stream in a recycle loop?
        explanation: It removes inerts and impurities that would otherwise accumulate without bound in the recycle.
        options:
          - text: "To stop inerts accumulating indefinitely in the recycle"
            correct: true
          - text: "To increase the reaction temperature"
          - text: "To reduce pump duty"
          - text: "To add fresh catalyst"
      - prompt: Before solving a balance, what should you count?
        explanation: Degrees of freedom — unknowns versus independent equations — to check the problem is actually solvable.
        options:
          - text: "Degrees of freedom: unknowns against independent equations"
            correct: true
          - text: "The number of streams only"
          - text: "The reactor volume"
          - text: "The cost per kilogram"
      - prompt: A plant's output mass consistently falls short of its input. What does that indicate?
        explanation: Accumulation, an unmeasured loss or leak, or a faulty instrument — the balance is the diagnostic.
        options:
          - text: "Accumulation, a leak, or a measurement error somewhere"
            correct: true
          - text: "The reaction is endothermic"
          - text: "The catalyst is fresh"
          - text: "Normal operation"
    interview:
      - question: How would you use a mass balance to troubleshoot a plant?
        difficulty: medium
        answer_md: |
          Close the balance around progressively smaller control volumes to
          localise the discrepancy — start around the whole plant, then around
          each unit. A persistent gap points to an unmeasured stream, a leak, an
          accumulation such as fouling or holdup, or an instrument that has
          drifted. Reconcile the data first: check calibration and whether flows
          are measured on a consistent basis (mass versus volume, wet versus dry,
          standard versus actual conditions), because a units or basis mismatch
          is a more common cause than an actual leak.

  - slug: transport-and-reactions
    name: Transport Phenomena & Reaction Engineering
    domain: chemical
    est_hours: 50
    difficulty: advanced
    prerequisites:
      - mass-and-energy-balances
    summary: >-
      Momentum, heat and mass transfer, and the reactor design that decides
      conversion, selectivity and safety.
    content_md: |
      Transport phenomena and kinetics together determine what a reactor actually
      achieves as opposed to what thermodynamics permits.

      **Three transports, one form.** Momentum, heat and mass transfer all follow
      flux = coefficient × driving force, which is why the mathematics is shared
      and analogies between them are so useful. Resistances in series mean the
      slowest step controls — often a boundary layer rather than the bulk.

      **Kinetics versus equilibrium.** Thermodynamics says how far a reaction can
      go; kinetics says how fast. A reaction that is favourable and slow needs a
      catalyst, not more temperature — and raising temperature often costs
      selectivity by accelerating the side reaction more than the wanted one.

      **Reactor types.** A batch reactor is flexible and labour-intensive. A CSTR
      is well-mixed, so it operates at the *outlet* composition — which means low
      concentration and therefore low rate, but excellent temperature control. A
      plug-flow reactor sees a concentration gradient along its length and
      generally achieves higher conversion per volume.

      **Heat is the safety issue.** Exothermic reactions release heat that raises
      temperature that raises rate that releases more heat. If the cooling
      capacity cannot keep up, that positive feedback is a **thermal runaway** —
      the mechanism behind many of the industry's worst incidents.
    resources:
      - kind: doc
        title: "LearnChemE — kinetics and reactor design"
        url: https://learncheme.com/screencasts/kinetics-reactor-design/
        provider: CU Boulder
        duration_min: 480
      - kind: book
        title: "Elements of Chemical Reaction Engineering (companion site)"
        url: https://www.umich.edu/~elements/
        provider: H. Scott Fogler
        duration_min: 1200
      - kind: course
        title: "MIT OCW — Transport Processes"
        url: https://ocw.mit.edu/courses/10-302-transport-processes-fall-2004/
        provider: MIT
        duration_min: 1200
    quiz:
      - prompt: Why does a CSTR generally need more volume than a PFR for the same conversion?
        explanation: A CSTR operates everywhere at the low outlet concentration, so the reaction rate is low throughout; a PFR sees higher concentrations along its length.
        options:
          - text: "It operates throughout at the low outlet concentration, so the rate is low"
            correct: true
          - text: "It cannot be heated"
          - text: "It has more pressure drop"
          - text: "It requires a catalyst"
      - prompt: What is a thermal runaway?
        explanation: Self-accelerating exothermic reaction where heat generation outpaces heat removal, raising temperature and rate together.
        options:
          - text: "Heat generation outpacing cooling, so temperature and rate accelerate each other"
            correct: true
          - text: "A reactor cooling below its freezing point"
          - text: "Loss of pressure containment"
          - text: "Catalyst deactivation"
      - prompt: A reaction is thermodynamically favourable but far too slow. What is the appropriate response?
        explanation: A catalyst lowers the activation barrier; raising temperature often damages selectivity and safety margin.
        options:
          - text: "Use a catalyst"
            correct: true
          - text: "Raise the temperature as far as possible"
          - text: "Increase the reactor volume tenfold"
          - text: "Change to a batch reactor"
    interview:
      - question: How do you prevent thermal runaway in an exothermic process?
        difficulty: hard
        answer_md: |
          Design so that heat removal capacity always exceeds heat generation
          across the credible operating envelope, including the failure cases.
          Practically: limit the accumulation of unreacted material (semi-batch
          dosing rather than charging everything at once), maximise the
          heat-transfer area per unit volume, use a diluent or solvent as thermal
          ballast, and instrument temperature with independent high-temperature
          trips. Add pressure relief sized for the runaway case, an emergency
          quench or dump system, and interlocks that stop the feed on cooling
          failure. Then verify with calorimetry rather than assumption.

  - slug: process-design-and-safety
    name: Process Design & Safety
    domain: chemical
    est_hours: 40
    difficulty: advanced
    prerequisites:
      - transport-and-reactions
    summary: >-
      Flowsheets, separations, control and the hazard studies that make a plant
      safe to operate.
    content_md: |
      Process design turns a reaction into a plant: feed preparation, reaction,
      separation, recycle, and utilities.

      **Flowsheets.** A process flow diagram shows the concept and the material
      and energy balance; a P&ID adds every instrument, valve and line and is the
      document the plant is actually built and operated from.

      **Separation usually dominates cost.** Distillation is the workhorse and is
      energy-intensive; the choice between it and extraction, crystallisation,
      membranes or adsorption is driven by relative volatility, thermal
      sensitivity and scale.

      **Heat integration.** Using hot streams to heat cold ones — pinch analysis
      — routinely cuts utility consumption dramatically. It also couples the
      plant together, which makes start-up, shutdown and control harder. That is
      a real trade-off, not a free win.

      **Control.** Every process needs measurement, a controller and a final
      element. Understand where the process gains are non-linear and where
      deadtime lives, because those are what make loops oscillate.

      **Safety is a formal discipline.** HAZOP walks each line with guide words
      (no flow, more pressure, reverse) to find deviations and consequences.
      Layers of protection: inherent safety first — smaller inventory, less
      hazardous solvent, lower pressure — then control, alarms, interlocks,
      relief, and mitigation. Inherent safety is the only layer that cannot fail.
    resources:
      - kind: doc
        title: "AIChE — Center for Chemical Process Safety resources"
        url: https://www.aiche.org/ccps/resources
        provider: AIChE
        duration_min: 300
      - kind: doc
        title: "HAZOP methodology overview"
        url: https://www.hse.gov.uk/comah/sragtech/techmeashazop.htm
        provider: HSE
        duration_min: 90
      - kind: doc
        title: "LearnChemE — separations and process control"
        url: https://learncheme.com/screencasts/separations-mass-transfer/
        provider: CU Boulder
        duration_min: 480
    quiz:
      - prompt: Which document is the plant actually built and operated from?
        explanation: The P&ID — it carries every instrument, valve and line, unlike the conceptual PFD.
        options:
          - text: "The P&ID"
            correct: true
          - text: "The process flow diagram"
          - text: "The mass balance spreadsheet"
          - text: "The plot plan"
      - prompt: Which layer of protection cannot fail?
        explanation: Inherent safety — a hazard that is not present cannot be released. Every other layer is a device that can fail.
        options:
          - text: "Inherent safety — removing or reducing the hazard itself"
            correct: true
          - text: "The pressure relief valve"
          - text: "The interlock system"
          - text: "The alarm"
      - prompt: What does a HAZOP use guide words like "no flow" and "reverse" for?
        explanation: To systematically generate deviations from design intent so that consequences and safeguards can be examined line by line.
        options:
          - text: "To systematically generate deviations from design intent"
            correct: true
          - text: "To size the relief valves"
          - text: "To calculate the heat duty"
          - text: "To schedule maintenance"
    interview:
      - question: What does "inherently safer design" mean in practice?
        difficulty: medium
        answer_md: |
          Removing the hazard rather than controlling it. In practice:
          **minimise** inventory so a release is smaller — the Bhopal lesson was
          largely about how much intermediate was stored; **substitute** a less
          hazardous solvent or reagent; **moderate** by running at lower
          temperature, pressure or concentration, or diluting; and **simplify**
          so there are fewer opportunities for error and fewer things to fail.
          These decisions are cheap early in design and nearly impossible to
          retrofit, which is why the hazard review must happen at concept stage
          rather than at commissioning.
