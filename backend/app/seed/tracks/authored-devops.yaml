        url: "https://www.freedesktop.org/software/systemd/man/latest/journalctl.html"
      - kind: doc
        title: "strace(1) manual page"
        url: "https://man7.org/linux/man-pages/man1/strace.1.html"

  # REPURPOSED SLUG: roadmap.sh uses `devops-editors` for "pick Vim, Nano or
  # Emacs". Editor choice is not a DevOps competency. The slug is kept so that
  # nothing referencing it is orphaned, and now carries the skill that actually
  # matters in its place: getting onto a remote machine safely and working
  # there without becoming the incident.
  - slug: devops-editors
    name: "Remote Access and Session Hygiene: SSH, Bastions and tmux"
    domain: devops
    est_hours: 6
    difficulty: beginner
    prerequisites:
      - devops-terminal-knowledge
    summary: |-
      Key-based SSH, bastion hosts and the agent-forwarding trap, tmux for work that must outlive your connection, and why hand-editing a production box is itself an incident.
    content_md: |-
      Every engineer who operates systems ends up on a machine they did not build, under time pressure, with a shell prompt and no safety net. How you get there, and how you behave once you are there, is a real skill with real failure modes.

      ### Key-based SSH and nothing else

      Password authentication on an internet-reachable SSH port is attacked continuously and should simply be off (`PasswordAuthentication no`, `PermitRootLogin no`). Authentication is by keypair: your private key never leaves your machine, the public key goes in the server's `authorized_keys`. Prefer Ed25519 keys, protect them with a passphrase, and load them into `ssh-agent` so the passphrase is typed once per session rather than never used at all.

      The scaling problem with `authorized_keys` is revocation: removing a departing engineer's access means editing files on every host, and you will miss one. The mature answer is short-lived SSH certificates issued by a CA the hosts trust, so access expires by default instead of being cleaned up by hand.

      ### Bastions, jump hosts, and the agent-forwarding trap

      Production hosts normally have no public address; you reach them through a bastion. Use `ssh -J bastion target` (ProxyJump), which tunnels the connection and terminates encryption on the target itself. Do **not** reflexively use agent forwarding (`-A`): forwarding your agent to a host means anyone with root on that host can use your key, for as long as you are connected, to authenticate anywhere your key is trusted. ProxyJump gives you the same convenience without that exposure. Put your hosts, users, ports and jump configuration in `~/.ssh/config` so the safe form is also the short form.

      ### Sessions that survive the network

      A dropped VPN kills your SSH connection, which SIGHUPs everything it was running. Any migration, backfill, restore or long build should start inside `tmux` (or `screen`), so you can reattach — and, importantly, so a colleague can attach to the same session and see what you are doing during an incident. Learn four things and stop there: create and attach (`tmux new -s name`, `tmux a -t name`), detach (`Ctrl-b d`), split panes, and scrollback.

      ### Editing on a live box

      You will need a survivable editor. Knowing enough `vi` to open, search, edit, save and quit is genuinely non-optional, because it is the one editor present on every machine. But the real lesson is that *configuration edited by hand does not exist*. A hand-patched web server config survives until the next instance is created from the image, then vanishes, and now two servers behave differently for reasons nobody can reconstruct. Anything you change by hand under pressure must be written back into the repository that generates it — a rule the configuration-management and GitOps chapters later make mechanical rather than a matter of discipline.

      ### Common mistakes

      Sharing one generic login between people so the audit log cannot attribute anything. Blindly accepting an unknown host fingerprint — that prompt is the only thing standing between you and a machine-in-the-middle. Leaving `-A` in your muscle memory. Running a four-hour migration in a bare SSH session. And, worst, fixing production by hand and neither telling anyone nor writing it down.
    resources:
      - kind: doc
        title: "OpenSSH manual pages"
        url: "https://www.openssh.com/manual.html"
      - kind: doc
        title: "ssh_config(5) — client configuration, including ProxyJump"
        url: "https://man.openbsd.org/ssh_config.5"
      - kind: doc
        title: "sshd_config(5) — server configuration"
        url: "https://man.openbsd.org/sshd_config.5"
      - kind: doc
        title: "Mozilla InfoSec: OpenSSH security guidelines"
        url: "https://infosec.mozilla.org/guidelines/openssh"
      - kind: doc
        title: "tmux: getting started"
        url: "https://github.com/tmux/tmux/wiki/Getting-Started"
      - kind: doc
        title: "Vim documentation"
        url: "https://vimhelp.org/"

  - slug: devops-scripting
    name: "Shell Scripting That Will Not Betray You"
    domain: devops
    est_hours: 8
    difficulty: beginner
    prerequisites:
      - devops-terminal-knowledge
    summary: |-
      The safety preamble, quoting, traps, idempotence and exit-code discipline that turn a throwaway one-liner into an automation step you can run at 3am without reading it first.
    content_md: |-
      Shell scripts are the connective tissue of every infrastructure estate. They are also the most dangerous code most teams write, because they run with high privilege, are rarely reviewed, and fail silently by default. The gap between a hazardous script and a safe one is about six lines of discipline.

      ### The preamble that changes the default

      Bash's defaults come from a 1980s interactive shell, not from a deployment tool. `set -euo pipefail` fixes the three worst ones. `-e` aborts on an unhandled non-zero exit instead of merrily continuing. `-u` turns an unset variable into an error rather than an empty string — this is the line that stops `rm -rf "$PREFIX/data"` from becoming `rm -rf /data` when a typo means `PREFIX` was never assigned. `-o pipefail` makes a pipeline fail if any stage fails, not merely the last one, which is what stops `curl … | tar -x` from reporting success after `curl` returned a 404 page.

      Know the limits of `-e` too: it does not fire inside a command that is part of a conditional, or on the left of `&&`, and it interacts badly with functions whose return value you test. It is a strong default, not a guarantee.

      ### Quoting, arrays and `local`

      Quote every expansion: `"$var"`, `"$@"`, `"${arr[@]}"`. `$@` unquoted is subtly broken with arguments containing spaces; `"$@"` is correct. Use arrays for argument lists rather than building a string and hoping word splitting does the right thing. Declare function variables `local` — bash variables are global by default, and a function that clobbers `$i` in a caller's loop produces a bug that takes an afternoon to find.

      ### Cleanup with traps

      `trap 'rm -rf "$tmpdir"' EXIT` guarantees cleanup on normal exit, on error, and on Ctrl-C. Create temporary files with `mktemp -d` rather than a fixed `/tmp/mything` path, which is both a race and a trivially predictable symlink target. If your script takes a lock, release it in the trap as well; a stale lock from a script that died is a recurring source of "the cron job stopped running three weeks ago and nobody noticed".

      ### Idempotence is the property that matters

      An automation script will be re-run: because it half-failed, because someone was not sure it ran, because a pipeline retried it. Write it so that running it twice is the same as running it once — check before you create, use `mkdir -p`, use `install -m` instead of `cp` plus `chmod`, make database steps conditional on their own result rather than on a flag file. Idempotence is also what makes a script safe to put behind a retry, and retries are how almost everything in this track recovers.

      ### When to stop writing shell

      A shell script that needs data structures, real error handling, concurrency, JSON manipulation beyond `jq`, or unit tests has outgrown the language. Roughly: past a hundred lines or the first nested data structure, port it. The next chapter is about what to port it to.

      ### Common mistakes

      Omitting the preamble and shipping a script that continues after a failed step, leaving a half-configured host. Parsing `ls`. Using `[ ]` string comparison where numeric comparison was meant. Writing to a fixed temp path. Testing with `sh script.sh` when the shebang says bash (or the reverse — on many distributions `/bin/sh` is dash, and bashisms fail in ways that only appear on the production image). And not running `shellcheck`, which catches most of the above statically and costs nothing to add to CI.
    resources:
      - kind: doc
        title: "GNU Bash Reference Manual: the set builtin"
        url: "https://www.gnu.org/software/bash/manual/html_node/The-Set-Builtin.html"
      - kind: doc
        title: "ShellCheck — static analysis for shell scripts"
        url: "https://www.shellcheck.net/"
      - kind: article
        title: "Greg's Wiki: BashGuide"
        url: "https://mywiki.wooledge.org/BashGuide"
      - kind: doc
        title: "mktemp(1) manual page"
        url: "https://man7.org/linux/man-pages/man1/mktemp.1.html"
      - kind: doc
        title: "POSIX Shell Command Language (Open Group specification)"
        url: "https://pubs.opengroup.org/onlinepubs/9699919799/utilities/V3_chap02.html"
      - kind: doc
        title: "Google Shell Style Guide"
        url: "https://google.github.io/styleguide/shellguide.html"

  - slug: devops-learn-a-programming-language
    name: "When Bash Is Not Enough: A Real Language for Ops Tooling"
    domain: devops
    est_hours: 20
    difficulty: intermediate
    prerequisites:
      - devops-scripting
    summary: |-
      Choosing and using one general-purpose language (Go or Python) for the tools, controllers and API glue that shell cannot carry — plus the packaging and testing habits that make ops code maintainable.
    content_md: |-
      Platform work is software engineering. Every team eventually needs a tool that talks to three APIs, retries intelligently, emits metrics, and is run by people who will not read its source. That is not a shell script, and pretending otherwise produces the 800-line bash file every organisation has and nobody dares touch.

      ### Picking one, and why the two obvious candidates differ

      **Go** compiles to a single static binary with no runtime to install, which is exactly what you want for something that must run inside a minimal container image or be dropped onto a host. Its concurrency primitives suit tools that fan out across hundreds of machines, its standard library covers HTTP and TLS well, and most of the ecosystem you operate — Kubernetes, Terraform, Prometheus, Docker — is written in it, so reading their source becomes possible. The cost is verbosity and explicit error handling everywhere.

      **Python** wins on speed of writing, on data manipulation, and on the breadth of cloud SDKs and automation libraries. The cost is deployment: you now care about interpreter versions and virtual environments on every machine that runs your tool, which is a real operational burden unless you package it carefully.

      Pick one and get genuinely good at it. Two shallow languages are worth less than one you can debug under pressure.

      ### What ops code needs that application code often does not

      *Exit codes and machine-readable output.* Your tool will be called from a pipeline. Return non-zero on failure and offer a `--json` mode so the next stage does not have to scrape human text.

      *Timeouts on everything.* An HTTP client with no timeout will, sooner or later, hang forever holding a lock. Set a deadline on every outbound call; this is the single most common defect in internal tooling.

      *Retries with backoff and jitter, and idempotent operations behind them.* The reliability chapters later in this track explain why the jitter matters; the habit starts here.

      *Structured logging and a metric or two.* A tool that runs in CI or on a schedule needs to explain itself after the fact, because nobody is watching it live.

      *Configuration precedence.* Flags override environment, environment overrides file, file overrides default. State it, document it, and never read configuration from two places that silently disagree.

      ### Packaging and tests

      Ship a static binary, a container image, or a properly pinned package — never "clone the repo and run it". Pin dependencies with a lockfile so a build today and a build in six months produce the same artefact. Write tests for the parsing and decision logic even if you cannot test the API calls; the bugs that hurt in ops tooling are usually in the "which resources do I touch" logic, and that part is pure and testable.

      ### Common mistakes

      Writing a tool that only works on the author's laptop because of an unpinned dependency or an assumed local file. No timeouts. Swallowing errors and exiting zero, so a pipeline goes green on a step that did nothing. Reimplementing a cloud SDK's pagination badly and silently processing only the first page — a bug that stays invisible until you cross the page-size threshold in production. And building a bespoke tool where a well-maintained existing one would do, which is how platform teams end up maintaining more software than the product teams they serve.
