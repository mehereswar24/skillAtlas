  - slug: devops-containers
    name: "Containers: What They Actually Are, and How to Build a Good Image"
    domain: devops
    est_hours: 12
    difficulty: intermediate
    prerequisites:
      - devops-unix
      - devops-operating-system
    summary: |-
      Namespaces plus cgroups plus a layered filesystem — nothing more — and the build discipline (layer caching, small bases, non-root, correct PID 1) that separates a 40MB image from a 1.8GB one.
    content_md: |-
      A container is not a lightweight virtual machine. It is an ordinary Linux process, started with its own set of namespaces so it sees its own filesystem, network and process table, placed in a cgroup so its CPU and memory are capped, running against a root filesystem assembled from stacked read-only layers plus one writable layer on top. There is no hypervisor and no guest kernel — the container shares the host's kernel, which is simultaneously why it starts in milliseconds and why kernel-level isolation is weaker than a VM's.

      ### Images, layers and the cache

      An image is an ordered stack of filesystem layers plus a configuration blob, addressed by content digest. Each build instruction that changes the filesystem produces a layer. The builder caches layers and reuses them when the instruction and its inputs are unchanged — but a cache miss invalidates every layer after it. This single rule dictates good Dockerfile order: install the things that change rarely first (base image, system packages), then dependency manifests, then dependency installation, and only then copy your application source. Copying the whole source tree before installing dependencies means every one-line code change re-downloads the world.

      A related and constant surprise: deleting a file in a later layer does not shrink the image, because the earlier layer still contains it. A secret written and then removed in a subsequent instruction is still in the image and still extractable. Use build secrets (`--mount=type=secret`) or multi-stage builds, never a `COPY` followed by an `RM`.

      ### Multi-stage builds and small bases

      Build in a fat stage with compilers and toolchains, then copy only the produced artefact into a minimal runtime stage. A compiled binary can end up on `distroless` or `scratch`; an interpreted app can sit on a slim or Alpine base. The payoff is not vanity: smaller images pull faster (which shortens every scale-up and every node replacement), and they contain fewer packages, which means dramatically fewer CVEs for someone to triage every week.

      Alpine's musl libc is a genuine trade-off rather than a free win — DNS resolution behaviour and some native extensions differ, and certain runtimes perform measurably worse. Choose it deliberately.

      ### Runtime correctness

      Run as a non-root user (`USER`), and prefer a read-only root filesystem with explicit writable volumes. Pin base images by digest, not by a floating tag, so a rebuild is reproducible and a compromised upstream tag cannot silently change your build. Make the process handle SIGTERM as PID 1 — `exec` the real binary from any entrypoint script, or use `--init`. Log to stdout and stderr and let the platform collect them; writing log files inside a container is how you fill an ephemeral disk and lose the evidence when the container is replaced.

      ### The container/host boundary

      Containers see the host's CPU count unless the runtime reads cgroup limits, so a runtime that sizes its thread pool or garbage collector from `nproc` will over-provision itself inside a small container and thrash. Modern runtimes are mostly cgroup-aware, but verify rather than assume. Likewise, memory limits are enforced by the kernel killing you, not by an allocation returning an error.

      ### Common mistakes

      `COPY . .` at the top of the Dockerfile, destroying the cache. `latest` tags everywhere, so you cannot say what is running. Running as root because it was easier. Baking configuration or credentials into the image instead of injecting them at runtime, which means a config change requires a rebuild and a secret change requires a rebuild *and* a rotation. Ignoring `.dockerignore` and shipping the `.git` directory into the build context. And treating the container as a machine — installing an SSH daemon, running cron and a log rotator inside it — instead of as one process with one job.
