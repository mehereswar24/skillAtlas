  - slug: devops-supply-chain-security
    name: "Supply Chain: What You Ship That You Did Not Write"
    domain: devops
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - devops-artifact-management
      - devops-ci-cd-tools
    summary: |-
      Dependency pinning and provenance, SBOMs, artefact signing and verification, and treating the build system itself as the highest-value target in your estate.
    content_md: |-
      Your application is mostly other people's code, built by a system with credentials to production. Attackers worked this out some time ago, and the notable incidents of recent years have overwhelmingly come through the build rather than through the running service. This chapter is about the three questions you must be able to answer: what is in this artefact, where did it come from, and can I prove it was not tampered with.

      ### What is in it: SBOMs and scanning

      A software bill of materials lists every component and version in an artefact, in a machine-readable format (SPDX or CycloneDX). Generate it at build time, when the resolved dependency graph is actually known, and store it with the artefact. Its value is the day a critical vulnerability is announced in a widely used library and the question is "are we affected, and where" — with SBOMs stored per artefact this is a query that takes minutes; without them it is a week of archaeology across every repository.

      Scan images and dependencies continuously, not just at build time, because vulnerabilities are discovered after you ship. Then do the harder organisational work: triage. A scanner reporting four hundred findings on a base image produces exactly as much security as reporting none, because nobody reads it. Filter by reachability and severity, fix what matters, and record why the rest was accepted.

      ### Where it came from: pinning and provenance

      Pin everything: dependencies by version *and* integrity hash via a lockfile, base images by digest, CI actions and plugins by commit SHA. A floating tag is an invitation for an upstream account compromise to become your compromise, silently, on a rebuild you did not think of as a change.

      Provenance goes further: a signed attestation recording which source commit, which builder, and which inputs produced this artefact. The SLSA framework describes levels of increasing rigour here, and its central requirement is that provenance is generated by the build platform rather than asserted by the person who ran the build.

      Beware **dependency confusion**: if your build resolves an internal package name from a public registry, anyone can publish that name publicly and have it pulled into your build. Configure your package manager to scope internal names to your private registry explicitly.

      ### Can you prove it: signing and verification

      Sign artefacts at publish time and *verify signatures at deploy time*. Signing without verification is theatre — the value is entirely in the enforcement point that refuses to run an unsigned or unrecognised image. Keyless signing tied to workload identity (as Sigstore provides) removes the key-management problem that stopped most teams from doing this at all. Enforce it with an admission controller so an unverified image cannot start.

      ### The build system is the crown jewels

      Anyone who can modify a pipeline definition can exfiltrate every secret it touches and ship arbitrary code to production. Therefore: pipeline definitions are protected by code owners and review like any production change; runners are ephemeral and isolated per job; workflows triggered by pull requests from forks never receive secrets; token permissions default to read-only and are widened per job; and third-party actions are pinned and, ideally, vendored. Treat a change to CI configuration with more scrutiny than a change to application code, not less.

      ### Common mistakes

      Generating SBOMs and never querying them. Scanning at build time only. Signing but not verifying. Unpinned third-party CI actions. Permissive default token scopes. Letting a fork's pull request run privileged workflows. Ignoring transitive dependencies, where most of the risk actually lives. And treating the whole subject as a compliance checkbox, which produces artefacts nobody uses and a build system that is still wide open.
