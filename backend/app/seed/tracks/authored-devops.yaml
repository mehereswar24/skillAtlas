  - slug: devops-cloud-design-patterns
    name: "Designing for the Cloud: Static Stability, Cells and Graceful Degradation"
    domain: devops
    est_hours: 10
    difficulty: advanced
    prerequisites:
      - devops-observability
      - devops-deployment-strategies
      - devops-backup-and-recovery
    summary: |-
      The capstone: the architectural patterns that decide whether an incident is a blip or an outage — blast-radius containment, static stability, degradation over failure, and the anti-patterns that look like resilience.
    content_md: |-
      Everything in this track has been about running a system. This chapter is about shaping one so that the running is survivable. These are the decisions that determine whether the 3am page is "one shard of one region is degraded" or "everything is down".

      ### Contain the blast radius

      The first question of any resilient design is: when this fails, how much fails with it? Availability zones are the cheapest answer and should be the default. **Cell-based architecture** goes further: partition the whole stack — compute, data, queues — into independent cells, assign each customer to one cell, and ensure a cell failure affects only its own customers. Deployments then roll cell by cell, so a bad release is caught at a few percent of traffic rather than all of it. The cost is routing complexity and the operational burden of many small stacks instead of one large one.

      **Shuffle sharding** is the elegant refinement, and worth understanding even if you never build cells: instead of assigning each customer to one shard, assign each to a random *combination* of a few nodes from a larger pool. With eight nodes and two per customer there are twenty-eight combinations, so one abusive or failing customer degrades only the small fraction of others sharing both of their nodes — and with client-side retry to the other node, most of those still succeed. You get near-isolation without paying for per-customer infrastructure.

      ### Static stability

      A statically stable system continues operating correctly when its dependencies' *control planes* are unavailable. The data plane keeps serving with what it already has, rather than needing to create, look up or reconfigure anything.

      Concretely: pre-provision capacity for a zone failure rather than planning to launch instances during it — during a large event, everyone else is trying to launch too. Cache authorisation decisions and configuration so an identity or config service outage degrades rather than halts you. Keep serving a slightly stale value instead of failing when the source of truth is unreachable. The general principle is that the recovery path should use fewer dependencies than the normal path, never more.

      This is also why **constant-work** designs are so robust: a system that does the same amount of work regardless of conditions — pushing a full configuration snapshot every ten seconds whether or not anything changed — has no surge in load when things go wrong, and no rarely-exercised code path that only runs during failures.

      ### Degrade instead of failing

      Rank your features by what the user actually needs. When a dependency is unavailable, drop the optional parts and serve the core: show the product page without personalised recommendations, accept the order and reconcile the loyalty points later, serve stale search results with a notice. This requires deciding in advance, per feature, what "degraded" means — a decision nobody makes well during an incident.

      Be careful with **fallbacks**, though. A fallback path that is only exercised during failures is a path you have never tested, running for the first time under maximum stress, and it frequently makes things worse. Prefer a simpler design that degrades predictably over an elaborate one with a clever fallback you cannot verify.

      ### Patterns that look like resilience and are not

      Retries without a budget or jitter, which convert a slow dependency into a self-inflicted denial of service. Health checks that test dependencies and remove the entire fleet at once. Unbounded queues, which turn a brief overload into an hours-long backlog of requests whose clients gave up long ago — bound the queue and shed load instead. A cache with no protection against stampede, so its expiry becomes a synchronised thundering herd at the origin. And multi-region active-active adopted for resilience by a team that has never failed over, which adds consistency problems, cost and complexity in exchange for a capability nobody has tested.

      ### Putting it together

      A design you can defend states, for each dependency, what happens when it is slow, when it is down, and when it is *wrong*. It names the blast radius of each component, the degradation behaviour of each feature, and the recovery path — and it says which of those have actually been exercised. That last column is the one that separates a system that survives its first bad night from one that merely looked good on a diagram.

      ### Common mistakes

      Designing for total failure while ignoring the far more common partial and grey failures, where a dependency is slow rather than down. Adding redundancy that shares fate — two instances in the same rack, two regions behind one DNS provider, everything depending on one identity service. Never testing failover. Treating the deployment pipeline as out of scope, when an inability to deploy during an incident is itself an outage. And building all of this before you have the telemetry to know whether any of it works.
