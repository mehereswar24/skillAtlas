  - slug: devops-infrastructure-monitoring
    name: "Metrics: Instrumenting a System So It Can Explain Itself"
    domain: devops
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - devops-container-orchestration
    summary: |-
      The dimensional metric model, counters/gauges/histograms, RED and USE as instrumentation checklists, percentiles done correctly, and the cardinality mistake that takes down your monitoring system.
    content_md: |-
      Metrics are cheap, aggregatable numbers sampled over time. They answer "is it broken, how broken, and since when" for the whole fleet at once, which is why they are the backbone of alerting. They cannot answer "why is this specific request slow" — that is what traces and logs are for, in the next two chapters.

      ### The dimensional model

      A modern metric is a name plus a set of key/value labels, and each unique label combination is a separate time series stored independently. `http_requests_total{service="checkout", method="POST", status="500"}` lets you slice by any dimension after the fact, which is what makes exploratory debugging possible.

      The three types you need: a **counter** only increases and is queried as a rate (requests, errors, bytes); a **gauge** goes up and down and is read as an instantaneous value (queue depth, connections, memory); a **histogram** buckets observations so you can compute percentiles across many instances. Almost all confusion comes from choosing wrong — recording latency as a gauge, for instance, means you have the last value only, and can never say anything about the distribution.

      ### What to instrument: two checklists

      For anything serving requests, **RED**: Rate, Errors, Duration — per endpoint and per dependency. For anything that is a resource, **USE**: Utilisation, Saturation, Errors — for CPU, memory, disk, network, thread pools, and connection pools. Between them these cover the large majority of questions, and a service instrumented with both can be debugged by someone who has never seen it.

      Add the business metric too. Orders per minute is often the fastest indicator that something is wrong, and it is the one that catches failures your technical metrics call healthy — a 200 response containing an empty result set is invisible to RED and obvious in the order rate.

      ### Percentiles, and how averages lie

      An average latency of 200ms is consistent with everyone getting 200ms, or with 95% getting 50ms and 5% getting three seconds. Only the second is an incident, and only percentiles show it. Alert on p99 and p99.9, not the mean.

      Two technical points that trip people up. First, **percentiles do not average**: taking the mean of per-instance p99s is not the fleet p99. You must aggregate the underlying histogram buckets and compute the percentile from the sum, which is exactly what histogram-based systems are designed for. Second, histogram accuracy is bounded by bucket boundaries, so choose them to span your actual latency range — default buckets that top out at 10 seconds cannot distinguish a 30-second request from a 5-minute one.

      ### Cardinality is the failure mode

      Every distinct combination of label values is a stored time series. Put a user ID, a request ID, an email address or a full URL path into a label and you create millions of series, and your monitoring system falls over — often during the incident that caused the cardinality explosion, which is precisely when you need it. Keep labels to bounded, low-cardinality dimensions: service, endpoint template (`/users/{id}`, never `/users/12345`), method, status class, region, version. High-cardinality identifiers belong in traces and logs.

      ### Pull, push, and standards

      Prometheus popularised a pull model: targets expose a metrics endpoint and the server scrapes them, which gives you target-health for free and makes "is it up" a first-class signal. Push models suit short-lived jobs that will not exist when a scrape arrives. OpenTelemetry now provides a vendor-neutral API and wire protocol for metrics, traces and logs, and instrumenting against it rather than a vendor SDK is the choice that ages best.

      ### Common mistakes

      Unbounded label values. Averages in dashboards. Metrics only from infrastructure and none from the application, so you know the CPU is fine and nothing about whether users are served. Scrape intervals coarser than the events you care about. Dashboards nobody has looked at since the day they were built. And instrumenting after an incident rather than as part of the change — the questions you wish you could answer at 3am must be answerable before 3am.
    resources:
