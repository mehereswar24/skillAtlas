  - slug: devops-web-server
    name: "Web Servers and Reverse Proxies"
    domain: devops
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - devops-networking-protocols
    summary: |-
      What sits in front of your application — TLS termination, timeouts, buffering, header handling, compression and static content — using nginx, Caddy or Envoy, and the misconfigurations that cause silent 502s.
    content_md: |-
      Practically no application server faces the internet directly. Something sits in front: terminating TLS, enforcing timeouts, buffering slow clients, serving static files, adding headers, and giving you a place to change routing without redeploying the app. Understanding that layer is how you stop guessing at 502s.

      ### What the proxy is for

      *TLS termination* concentrates certificate management in one place, so renewal is one job rather than one per service. Caddy and most cloud load balancers automate ACME issuance; nginx typically pairs with an ACME client. Whatever you use, the renewal must be automated and monitored — set an alert on days-to-expiry, because the failure mode of a broken renewal is a total outage at a moment nobody chose.

      *Buffering* protects the application from slow clients. Without it, a client trickling a request body at one byte per second occupies an application worker for minutes. The proxy accepts the whole request quickly, then delivers it to the backend in one go. The same applies to responses.

      *Timeouts* are the proxy's most important setting and the one most often left at defaults that do not match reality. There are several and they are not interchangeable: connect timeout to the backend, time to read the response header, time between bytes of the response body, and how long an idle upstream keep-alive connection is held. A read timeout shorter than a legitimately slow endpoint produces intermittent 504s that look like backend flakiness; a very long one turns a backend hang into an exhausted proxy.

      ### Headers, and the trust boundary

      A proxy rewrites what the backend sees. `X-Forwarded-For` and `X-Forwarded-Proto` (or the standardised `Forwarded` header) carry the client's real address and scheme, and the application must be configured to trust them *only* from your proxy's addresses — an application that trusts a client-supplied `X-Forwarded-For` has an IP-based rate limiter and audit log that anyone can forge. Getting the `Host` header right matters too, since virtual-host routing and generated redirect URLs both depend on it, and the classic symptom of getting it wrong is a redirect loop or a login that bounces users to `localhost`.

      ### Static content and compression

      Serving static assets from the proxy avoids waking the application at all, and correct `Cache-Control` headers here are what make a CDN in front of it effective later. Enable compression, but not for already-compressed formats, and be aware that compressing responses that mix secrets with attacker-influenced content has a real (if narrow) attack history — which is why compression and TLS are configured together thoughtfully rather than switched on blindly.

      ### Choosing one

      nginx is the conservative default with enormous operational literature. Caddy trades some flexibility for automatic HTTPS and a far smaller config. Envoy is the right answer when you want dynamic configuration through an API, rich load-balancing policies and first-class observability — it is what most service meshes and modern gateways are built on, and it is the bridge to the orchestration chapters.

      ### Common mistakes

      Default timeouts everywhere, matched to nothing. Forgetting that adding a proxy adds a hop that also needs its own health checks and metrics. Not enabling upstream keep-alives, so every proxied request pays a fresh TCP handshake. Leaving verbose server version banners on. Reloading rather than validating first — always run the config test before reload. And, on Linux, forgetting that the proxy needs its own generous file-descriptor limit, since it holds two sockets per request.
    resources:
      - kind: doc
        title: "nginx documentation"
        url: "https://nginx.org/en/docs/"
