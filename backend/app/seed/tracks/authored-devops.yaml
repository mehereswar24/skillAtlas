  - slug: devops-logs-management
    name: "Logs: Structured Events, Sampling and the Bill"
    domain: devops
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - devops-infrastructure-monitoring
    summary: |-
      Structured logging with correlation IDs, the collection pipeline, retention tiers, sampling, and why log volume becomes one of your largest infrastructure costs if nobody owns it.
    content_md: |-
      Logs are the high-detail, high-cost signal: they tell you what happened to one specific request when metrics have already told you that something is wrong. Their weakness is volume, and volume is what makes them expensive and slow exactly when you need them most.

      ### Structured, or it does not count

      A log line should be an event object with fields, not a sentence. `{"ts":"…","level":"error","service":"checkout","trace_id":"…","user_id":"…","order_id":"…","msg":"payment declined","provider":"acme","latency_ms":812}` can be filtered, grouped and counted. `ERROR: payment failed for order 12345` requires a regular expression that will break the next time someone edits the message, and cannot be aggregated at all.

      The single most valuable field is a **correlation identifier** propagated across every service a request touches — ideally the trace ID, so logs and traces link. Without it, debugging a request across five services means guessing by timestamp, which does not work under load. Propagate it in the standard W3C `traceparent` header so it survives hops through proxies and third-party libraries.

      ### The pipeline

      Applications write to stdout and stderr. A collector on each node (Fluent Bit, Vector, the OpenTelemetry Collector) reads, parses, enriches with pod/host/version metadata, and forwards to a backend. Keep the application ignorant of the destination: an application that ships directly to a log service now has a network dependency, a credential, and a buffering problem on its critical path, and it will block on a slow log endpoint.

      The collector is where you drop noise, redact sensitive fields, and add metadata. Redaction deserves attention: personal data, tokens and card numbers land in logs constantly, usually through a well-meaning "log the whole request body" statement. Redact at the collector as a safety net, but also fix the source, because the collector is a backstop rather than a policy.

      ### Levels, sampling and cost

      Use levels with intent. ERROR means a human may need to act. WARN means something unexpected but handled. INFO is the audit trail of significant events. DEBUG is off in production, except when it is turned on deliberately and temporarily for one service. A service logging at INFO for every internal function call will generate more data than the requests themselves and will bury the one line that mattered.

      For high-volume paths, sample: keep every error, keep a small percentage of successful requests, and — this is the trick worth knowing — sample *by trace*, so you keep all the logs for a sampled request rather than a random scattering of lines from different requests, which are useless individually.

      Cost is a design constraint. Ingest and retention are usually charged by volume, and log spend routinely exceeds the compute it describes. Tier it: hot and searchable for a week or two, cheap object storage for the months you need for compliance, and delete on a schedule. Set retention deliberately rather than discovering it in a budget review, and put an alert on ingest volume so a debug flag left on in production is caught in hours rather than at the end of the month.

      ### Common mistakes

      Unstructured or inconsistently structured logs across services. No correlation ID. Logging secrets or personal data. Logging the same error at every layer as the exception propagates, multiplying volume and making the count meaningless. Writing to files inside containers, so the evidence dies with the pod. Unbounded retention. No alert on ingest volume. And treating logs as the primary alerting signal when metrics are far cheaper and faster for that job — alert on metrics, investigate in logs.
    resources:
      - kind: doc
        title: "OpenTelemetry: logs specification and correlation"
        url: "https://opentelemetry.io/docs/specs/otel/logs/"
      - kind: doc
        title: "W3C Trace Context recommendation"
        url: "https://www.w3.org/TR/trace-context/"
