  - slug: devops-deployment-strategies
    name: "Getting a Change to Production Without Anyone Noticing"
    domain: devops
    est_hours: 10
    difficulty: advanced
    prerequisites:
      - devops-ci-cd-tools
      - devops-container-orchestration
    summary: |-
      Rolling, blue/green and canary releases, feature flags, and the expand-contract discipline that lets a database schema change safely while two versions of the code are running at once.
    content_md: |-
      Deployment is the moment your change meets reality, and the goal is to make that moment boring: small, reversible, and observed. The strategies below all exist to shrink either the blast radius or the time to undo.

      ### The four shapes

      **Recreate** stops the old version and starts the new one. Simple, and it has downtime. Fine for internal tools; not for anything a user is holding.

      **Rolling** replaces instances a few at a time. It is the default in most orchestrators and it has no downtime, but it necessarily runs both versions simultaneously — which is the source of most deployment surprises and the reason the compatibility section below matters more than the strategy choice.

      **Blue/green** runs a complete second environment on the new version, then switches traffic across at once. Rollback is switching back, which is as fast as anything gets. The costs are double the infrastructure during the change and the problem of shared state: both colours usually talk to the same database, so the schema still has to work for both, and the switch is instantaneous for the web tier but not for in-flight background jobs.

      **Canary** sends a small fraction of traffic — 1%, then 5%, then 25% — to the new version and *decides based on measured behaviour* whether to continue. This is the only strategy on the list that gives you evidence rather than hope, and it is the one to aim for. It requires that your metrics can be sliced by version, which is a prerequisite worth building before you attempt it.

      ### Deploy is not release

      A **feature flag** separates shipping code from turning behaviour on. Code goes to production dark, is enabled for internal users, then a percentage, then everyone, and can be turned off in seconds without a deployment. This is what makes trunk-based development practical and what turns "roll back the deploy" into "flip the flag" for behavioural problems.

      The discipline: flags are inventory. A flag that has been at 100% for six months is dead code plus a branch in every test matrix. Give each flag an owner and a removal date and enforce it, or you will accumulate a configuration space nobody can reason about.

      ### The hard part: schema and contract changes

      Every strategy above runs two versions of your code at the same time. Therefore **every change must be compatible with the version before it**, in both directions, for the duration of the rollout. The pattern is expand-contract, in three separate deployments:

      1. **Expand.** Add the new column, nullable, with a default. Add the new API field. Deploy code that writes both old and new, and reads the old.
      2. **Migrate.** Backfill existing rows in batches. Switch reads to the new field. Verify.
      3. **Contract.** Stop writing the old field. Only then, in a later deployment, drop the column.

      Never combine steps. A single deployment that renames a column breaks the old version instantly, which means it also breaks your rollback — and discovering that your rollback path is gone, during an incident, at 3am, is the specific experience this chapter exists to prevent. Note also that some schema operations take locks that block writes on a large table; check what your database actually does before running the migration, and do it in a controlled window with a way to stop.

      ### Rollback must be tested

      A rollback plan you have never executed is a hypothesis. Practise it. Know its limits: code rolls back, data usually does not. Anything that has already written data in a new format constrains how far back you can go, which is one more argument for expand-contract.

      ### Common mistakes

      Deploying a schema change and a code change together. Canary analysis by eye at 3pm rather than by automated metric comparison. No traffic-splitting mechanism, so "canary" means one pod out of ten and an unreadable signal. Feature flags with no cleanup. Rolling updates with a `maxUnavailable` that removes more capacity than the remaining instances can absorb, so the deploy itself causes the overload. And deploying at 5pm on a Friday, not because of superstition, but because the people who understand the change will not be watching it.
