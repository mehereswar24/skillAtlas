  - slug: devops-ci-cd-tools
    name: "Pipelines: Fast, Trustworthy, and Hard to Subvert"
    domain: devops
    est_hours: 12
    difficulty: intermediate
    prerequisites:
      - devops-vcs-hosting
      - devops-artifact-management
    summary: |-
      Continuous integration and delivery as an engineering problem — pipeline stages, caching, flaky tests, ephemeral runners, least-privilege credentials, and the DORA metrics that tell you whether any of it is working.
    content_md: |-
      A pipeline is the machine that turns a commit into a deployable artefact and a verdict. Two properties determine whether it helps or hurts: how fast it gives an answer, and whether people believe the answer. A slow pipeline stops people integrating; an untrustworthy one teaches them to re-run until green, which is worse than having no tests at all.

      ### Stages, and what belongs in each

      Roughly: lint and static analysis (seconds), unit tests (a couple of minutes), build the artefact **once**, integration tests against real dependencies in containers, security and dependency scanning, publish the artefact, then deploy by promoting that same artefact through environments. Put the fastest, most likely-to-fail checks first so feedback arrives early. Everything from the artefact onwards operates on an immutable digest, never on a rebuild.

      ### Speed is a feature

      Target under ten minutes to a verdict on a pull request. Get there by caching dependencies (keyed on the lockfile hash, not on a branch name), splitting test suites across parallel runners, running only what a change can affect in large repositories, and reserving slow end-to-end suites for a post-merge or scheduled run rather than blocking every pull request. Measure your pipeline's own duration over time and treat a regression in it as a defect, because nobody ever notices the day it went from six minutes to twenty.

      ### Flaky tests are a production issue

      A test that fails 2% of the time in a suite of 500 tests means most runs go red for no reason. The organisational response — "just re-run it" — destroys the signal, and the real failure that follows gets re-run too. Track flakiness per test, quarantine the offenders automatically, and fix or delete them on a deadline. The common causes are shared mutable state between tests, real time and real sleeps, dependence on test execution order, and unpinned external calls.

      ### The pipeline is production infrastructure

      Your CI system can deploy to production, which makes it one of the most privileged systems you own and a genuine target. The controls that matter: **ephemeral runners** that are destroyed after each job, so one job cannot leave anything for the next; **short-lived credentials** obtained by federated identity (OIDC) rather than long-lived cloud keys stored as secrets; **pinned third-party actions or plugins** by commit SHA rather than by a mutable tag; secrets scoped to the specific environment and unavailable to pull-request builds from forks; and mandatory human approval on the production deployment step. Log everything, and make the deployment log say which artefact digest went where.

      ### Are you actually getting better?

      The four DORA measures are the ones with real evidence behind them: deployment frequency, lead time from commit to production, change failure rate, and time to restore service. They are useful precisely because you cannot game the set — shipping less often to protect the failure rate makes lead time worse. Instrument them from the pipeline and the incident tracker rather than estimating them.

      ### Common mistakes

      Rebuilding per environment. Tests that need a shared, mutable staging database, so two pipelines cannot run at once. Secrets exported into the environment of every step. Unpinned third-party actions with write access to your repository. No timeouts on jobs, so a hung step burns a runner for six hours. Manual steps between stages that are documented in someone's head. And a green pipeline that does not actually assert anything meaningful, which is the most comfortable and most dangerous state of all.
