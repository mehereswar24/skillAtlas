    summary: |-
      L4 versus L7, the algorithms and when round-robin is actively wrong, health checks that mean something, and how to remove an instance from rotation without dropping requests.
    content_md: |-
      A load balancer is the component that decides which of your instances handles a request. It is also, more importantly, the component that decides which of your instances is considered alive — and a health check that answers the wrong question is one of the most reliable ways to turn a partial degradation into a total outage.

      ### L4 versus L7

      A layer-4 balancer forwards TCP connections without looking inside them. It is fast, protocol-agnostic and cheap, but it balances *connections*, not requests — so with HTTP/2 or long-lived gRPC channels, one connection carries thousands of requests and load distribution becomes badly uneven. A layer-7 balancer parses HTTP, balances per request, and can route on path, header or method, retry idempotent requests, and inject tracing headers. The cost is CPU and an extra place where TLS terminates. For HTTP/2 and gRPC traffic, L7 (or a client-side balancer that is aware of streams) is essentially mandatory.

      ### Algorithms, and why round-robin misleads

      Round-robin assumes every request costs the same and every backend is equally capable. Neither is true: one instance may be garbage-collecting, on a noisy host, or freshly started with cold caches. Round-robin will keep sending it work at the same rate as everything else, so your slowest instance sets your tail latency.

      **Least outstanding requests** (sometimes "least connections") is the better default in almost all cases: it sends the next request to the backend with the fewest in flight, which automatically routes around a temporarily slow instance without any explicit health signal. Consistent hashing is the right choice when a backend holds per-key state or cache locality matters. Weighted variants let you shift traffic gradually, which is the mechanism canary deploys are built on. Session affinity ("sticky sessions") should be an admission of a design constraint, not a default — it undermines even distribution and makes deploys and scale-in disruptive.

      ### Health checks that mean something

      A check hitting `/health` and returning 200 unconditionally tells you the process is running, nothing more. A check that verifies every downstream dependency is worse: when the shared database has a hiccup, every instance simultaneously reports unhealthy, the balancer removes them all, and a partial degradation becomes a complete outage. This is the failure mode to internalise.

      The workable split is a *liveness* check that only asks "is this process wedged, should it be restarted" and a *readiness* check that asks "can this instance serve traffic right now" — with dependency checks handled by shedding or degrading rather than by declaring death. Make health checks cheap; they run constantly from every balancer node. And keep a fail-open safety valve: many balancers will, correctly, send traffic to all backends when *every* backend is failing its check, on the theory that a possibly-broken backend beats a guaranteed outage.

      ### Draining, and the requests you drop at deploy time

      Removing an instance is not instantaneous. The correct sequence is: mark it unready, keep serving in-flight requests, wait longer than the balancer's check interval times its unhealthy threshold *plus* any DNS or config propagation delay, and only then send SIGTERM. Skip that wait and the balancer will keep sending requests to a process that has already begun shutting down — the classic source of a small spike of 502s on every single deploy, which teams learn to ignore instead of fix.

      ### Common mistakes

      Health checks that test dependencies and take down the whole fleet at once. Health check intervals so long that a dead instance keeps receiving traffic for a minute. No connection draining. Assuming the load balancer itself is redundant when it is a single instance. Balancing gRPC at layer 4 and wondering why one pod is at 90% CPU and the rest are idle. And forgetting that the balancer has its own connection limits and its own metrics that must be monitored separately from the backends'.
    resources:
      - kind: article
        title: "AWS Builders' Library: implementing health checks"
        url: "https://aws.amazon.com/builders-library/implementing-health-checks/"
