  - slug: devops-service-mesh
    name: "Service Meshes and Sidecars — and Whether You Need One"
    domain: devops
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - devops-container-orchestration
    summary: |-
      Moving mTLS, retries, timeouts, traffic splitting and per-call telemetry out of application libraries and into a proxy — and an honest account of the operational cost that buys.
    content_md: |-
      Once you have more than a handful of services, the same problems recur in every one: encrypt service-to-service traffic, time out and retry sensibly, split traffic for a canary, and emit consistent per-call telemetry. You can solve those in a shared library in every language you use, or you can solve them once in the network. A service mesh is the second option.

      ### How it works

      A proxy (usually Envoy) is injected beside each workload, and traffic is transparently redirected through it. The proxies form the **data plane**; a **control plane** configures them from declarative policy. Because every call now traverses a proxy on each side, the mesh can do things no single application can: issue and rotate workload certificates automatically for mutual TLS, apply uniform timeout and retry policy, break circuits, mirror traffic to a new version, split traffic by weight or header, and produce a consistent set of metrics and spans for every hop regardless of language.

      Newer designs move much of this out of per-pod sidecars into a per-node component, trimming the resource overhead that made the sidecar model expensive at scale. The concepts are the same.

      ### What it genuinely gives you

      *Identity-based mTLS everywhere*, with rotation, without touching application code — this alone justifies a mesh in regulated environments and is very hard to retrofit by hand across many languages.

      *Uniform, correct resilience policy.* Timeouts and retries configured in one place, and — importantly — retry *budgets*, so the mesh will not amplify an overload the way naive per-client retries do.

      *Progressive delivery primitives.* Weighted traffic splitting is the mechanism a canary controller drives, and it is far more precise than replica-count-based approximations.

      *A service graph for free*, which is often the first time anyone can see what actually calls what.

      ### What it costs

      Every request pays two extra proxy hops of latency. Every pod pays extra CPU and memory. You have added a distributed system with its own control plane, its own upgrade cycle, its own certificates and its own failure modes — and mesh misconfiguration produces failures that are genuinely hard to attribute, because the application logs show a connection error with no explanation and the answer is in the proxy's configuration dump. Debugging now requires understanding Envoy, not just your service.

      ### The honest recommendation

      Do not start here. Get timeouts, retries and structured telemetry right in your services first — you need to understand those policies before you delegate them. Adopt a mesh when you have a specific driver: a compliance requirement for encryption in transit, a service count where per-language libraries have become unmaintainable, or a real need for traffic-shaping you cannot get from your ingress. Consider whether a lighter option covers you: many teams need only mTLS (available from the CNI layer) or only traffic splitting (available from a Gateway implementation), not the whole mesh.

      ### Common mistakes

      Adopting a mesh to solve a problem the team has not yet had. Enabling retries at both the mesh and the application layer, silently multiplying load on a struggling dependency. Turning on strict mTLS in one namespace and breaking every client outside the mesh. Forgetting that the sidecar has its own lifecycle — a sidecar that starts after the app misses early requests, and one that shuts down before the app breaks in-flight calls at every deploy. And under-provisioning the proxies, so the mesh becomes the bottleneck it was meant to observe.
