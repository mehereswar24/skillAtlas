  - slug: devops-secret-management
    name: "Secrets: The Lifecycle, Not the Vault"
    domain: devops
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - devops-ci-cd-tools
      - devops-cloud-providers
    summary: |-
      Where credentials come from, how they reach a workload without ever being written down, how rotation actually works, and what to do in the first hour after one leaks.
    content_md: |-
      Most teams treat secret management as "pick a vault". The vault is the easy part. The hard parts are how a secret gets into a running process without passing through a file someone can read, how it is replaced without downtime, and what happens the day one appears in a public repository.

      ### Eliminate the secret where you can

      The best-managed secret is the one that does not exist. Workload identity removes an entire class: a process running on a cloud instance, in a Kubernetes pod with a bound service account, or in a CI job with OIDC federation can obtain short-lived credentials from the platform based on *what it is* rather than on a shared string it holds. Adopting this for cloud API access and for CI-to-cloud authentication removes the majority of long-lived credentials in a typical estate. Do this before you optimise the vault.

      For databases and other systems that need a real credential, prefer **dynamic secrets**: the secret manager creates a credential on demand with a short lease and revokes it at expiry. Nothing long-lived exists to leak.

      ### Getting a secret into a process

      In rough order of preference: injected by the platform as an environment variable or a memory-backed file from a secret store at start-up; fetched by the application at start-up using its workload identity; mounted from a file with restrictive permissions. Avoid baking secrets into images (they persist in layers forever), avoid command-line arguments (visible in the process table to every user on the box), and be aware that environment variables leak more readily than people expect — into crash dumps, error trackers, child processes, and `/proc/<pid>/environ`.

      ### Rotation, and why it is a design problem

      Rotation is not "change the password". It is "change the password while forty processes are using it, without dropping a request". The design that makes this possible is supporting *two valid credentials at once*: issue the new one, let clients pick it up on their refresh cycle, verify nothing is still using the old one, then revoke. If your application reads its secret once at start-up and never again, rotation requires a restart of every consumer, which is why so many organisations have credentials that are five years old — rotation was theoretically possible and practically an outage. Build the refresh path early.

      Rotation frequency should follow risk, and it should be automated. A documented quarterly manual rotation is a documented quarterly outage risk that eventually stops being performed.

      ### Detection and response

      Run secret scanning on commits, on pull requests, and on history — and enable push protection so the credential never lands in the first place. When one does leak, the order is: **rotate first, then investigate**. Deleting the commit does not help, because the value existed in history, in clones, in CI logs and in forks. Assume it is compromised, revoke it, then read the audit log to see whether it was used. The organisations that handle this well have practised it; the ones that do not spend the first hour debating whether the repository was really public.

      ### Common mistakes

      Secrets in environment variables in a committed compose or manifest file. One shared credential used by every service, so rotating it means coordinating across teams and therefore never happens. Vault access policies so broad that any workload can read any secret, which reduces the vault to an expensive file share. No audit logging on secret reads. Kubernetes Secrets without encryption at rest, mistaken for encryption. Secrets printed in debug logs or included in error reports sent to a third-party tracker. And no rehearsed leak procedure, so the response depends on who happens to be online.
