  # REPURPOSED SLUG: roadmap.sh uses `devops-email-protocols` for a glossary of
  # SMTP/IMAP/POP3. Reading mailboxes is not a DevOps task, but *sending* mail
  # that arrives is — password resets and receipts are on-call territory. The
  # slug is kept and now teaches deliverability and the DNS authentication
  # records ops teams own.
  - slug: devops-email-protocols
    name: "Transactional Email and Deliverability: SPF, DKIM and DMARC"
    domain: devops
    est_hours: 5
    difficulty: intermediate
    prerequisites:
      - devops-networking-protocols
    summary: |-
      Why password-reset emails end up in spam, the three DNS records that fix it, and how to run an outbound mail path you can actually debug.
    content_md: |-
      Sooner or later a page arrives that says "customers cannot log in". The cause is that password-reset emails are being silently dropped by a major mailbox provider, and the reason is a DNS record nobody owns. Outbound mail is infrastructure, and it fails in ways application logs never reveal — because a message your provider reports as "sent" may still be discarded on receipt.

      ### SMTP in one paragraph

      Mail is delivered by SMTP: the sender looks up the recipient domain's MX records, connects, and hands over the message. There is no acknowledgement of delivery to a human inbox — only acceptance by a server. Rejection can be immediate (a 5xx bounce), deferred (a 4xx, retried for days), or entirely silent (accepted, then filed as spam or discarded). That last case is the dangerous one, because everything upstream reports success.

      ### The three records, and what each proves

      **SPF** (RFC 7208) is a TXT record listing which servers may send mail for your domain. It authenticates the envelope sender's domain against the connecting IP. Its weakness is that it breaks on forwarding, since the forwarding server is not in your list, and it has a hard limit of ten DNS lookups — adding one more `include:` for a new vendor silently invalidates the whole record, which is a genuinely common self-inflicted outage.

      **DKIM** (RFC 6376) attaches a cryptographic signature to the message, with the public key published in DNS. Because it signs the message rather than the connection, it survives forwarding. Each sending service gets its own selector and key, so adding a vendor does not endanger the existing setup.

      **DMARC** (RFC 7489) ties the two together. It publishes a policy — `none`, `quarantine` or `reject` — for what a receiver should do when a message claiming to be from your domain passes neither SPF nor DKIM *aligned with the visible From address*. Alignment is the subtle part: a message can pass raw SPF for your vendor's bounce domain and still fail DMARC because that domain is not your From domain. DMARC also requests aggregate reports, which is the only real visibility you get into who is sending as you.

      Roll it out in that order: publish SPF and DKIM, publish DMARC at `p=none` with a reporting address, read the reports for a few weeks until every legitimate sender is accounted for, then move to `quarantine` and finally `reject`. Jumping straight to `reject` will bin your own invoices, and the people affected will not be able to email you about it.

      ### Operating the send path

      Send transactional mail through a dedicated provider rather than your own relay — deliverability depends on IP and domain reputation that takes months to build. Separate transactional mail from marketing mail, ideally on different subdomains, so a bad campaign cannot poison password resets. Treat the provider's webhooks (delivered, bounced, complained) as a telemetry stream: alert on bounce and complaint rates, not just on send failures. Suppress hard bounces permanently; repeatedly mailing dead addresses is itself a reputation signal.

      ### Common mistakes

      Adding an eleventh SPF lookup and silently breaking authentication for every sender. Setting `p=reject` before reading reports. Signing with DKIM but letting the key rot at 1024 bits, or never rotating selectors. Sending from a `no-reply@` address with no monitored mailbox, which harms reputation and infuriates users. Assuming the provider's "sent" metric means "arrived". And having no alert whatsoever on the bounce rate, so the first signal is a support ticket.
    resources:
      - kind: doc
        title: "RFC 7208 — Sender Policy Framework (SPF)"
        url: "https://www.rfc-editor.org/rfc/rfc7208.html"
      - kind: doc
        title: "RFC 6376 — DomainKeys Identified Mail (DKIM)"
        url: "https://www.rfc-editor.org/rfc/rfc6376.html"
      - kind: doc
        title: "RFC 7489 — DMARC"
        url: "https://www.rfc-editor.org/rfc/rfc7489.html"
      - kind: doc
        title: "RFC 5321 — Simple Mail Transfer Protocol"
        url: "https://www.rfc-editor.org/rfc/rfc5321.html"
      - kind: doc
        title: "RFC 8058 — one-click unsubscribe, which bulk senders must honour"
        url: "https://www.rfc-editor.org/rfc/rfc8058.html"
      - kind: doc
        title: "M3AAWG sender best common practices"
        url: "https://www.m3aawg.org/published-documents"

  - slug: devops-cloud-providers
    name: "Cloud Building Blocks: Identity, Network, and the Shared Responsibility Line"
    domain: devops
    est_hours: 14
    difficulty: intermediate
    prerequisites:
      - devops-networking-protocols
    summary: |-
      The five primitives every provider sells (identity, network, compute, storage, managed data), how regions and availability zones constrain your design, and why IAM and quotas cause more outages than hardware.
    content_md: |-
      Cloud providers differ enormously in naming and hardly at all in structure. Learn the structure once and moving between AWS, GCP and Azure becomes a translation exercise rather than a re-education. The five things you are buying are identity, network, compute, storage, and managed data services — plus the bill, which is a design constraint of its own.

      ### Identity is the control plane, and the first thing to get right

      Every API call is authorised by a policy. The habits that matter: humans authenticate through a single sign-on identity provider with short-lived credentials, never long-lived access keys; workloads get an identity attached to the compute they run on (an instance profile, a service account, a workload identity) so no secret is ever stored; and permissions are scoped to the smallest set that works, granted to roles rather than to individuals.

      Separate environments into separate accounts, projects or subscriptions. This is the strongest blast-radius control available, and it is nearly free at the start and very expensive to retrofit. A misconfigured policy in a development account should not be able to touch production data, and the only reliable way to guarantee that is an account boundary.

      Two failure modes to internalise. First, the wildcard policy: `Action: "*"` on `Resource: "*"` attached to something long-lived is the root cause of a large share of published cloud breaches. Second, the confused deputy: a role that a third party can assume without an external ID or condition can be assumed by *anyone* who knows the role's name.

      ### Regions, zones, and what actually shares fate

      A region is a geographic area; an availability zone is an isolated set of datacentres within it, with independent power and cooling but low-latency links to its siblings. Spreading across zones protects against the most common infrastructure failures at very low latency cost, and it should be the default for anything that matters. Spreading across regions protects against a regional event but introduces tens of milliseconds of latency, data-residency questions, and the whole replication problem — do it when you have a stated requirement, not reflexively.

      The important subtlety is *shared fate*. Two zones are independent for power, but the region's control plane, your DNS provider, your identity provider and your deployment pipeline are usually not. Many outages that look like multi-zone failures are single-control-plane failures. This is why "static stability" — designing so that a running system keeps working when the control plane is unavailable, without needing to launch anything new — is the most valuable cloud design idea in this whole chapter.

      ### Compute and storage, chosen by shape

      Compute runs from raw virtual machines through managed container services to functions; the trade is control against operational surface. Storage divides into block (a disk for one instance), file (a shared POSIX mount), and object (HTTP, effectively unlimited, cheap, with per-object semantics and no filesystem). Choosing object storage where you wanted a filesystem, or a network filesystem where you wanted object storage, is a design error that surfaces months later as an unfixable performance problem.

      Managed databases, queues and caches are usually the correct choice: the provider's operational burden is genuinely lower than yours, and the differentiating work is rarely in running the database. The trade-offs are cost at scale, version lag, and the fact that you cannot fix what you cannot log into.

      ### Quotas are real limits

      Every account has service quotas — instances per region, API requests per second, addresses, concurrent function executions. They are not theoretical. The characteristic incident is an autoscaling event that stops halfway because the instance quota was reached, at which point you have a half-scaled fleet and a support ticket that takes hours. Inventory the quotas on your critical path, alert at 70–80% of each, and request increases before you need them.

      ### Common mistakes

      Long-lived access keys in CI. One account for everything. Assuming multi-AZ makes you immune to a regional control-plane event. Public object storage buckets, still the most common cloud data leak. No tagging discipline, so nothing can be attributed for cost or ownership. Building on a proprietary service without knowing what exit would cost — the answer may well be "acceptable", but it should be a decision rather than a discovery.
    resources:
      - kind: doc
        title: "AWS Well-Architected Framework"
        url: "https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"
      - kind: article
        title: "AWS Builders' Library: static stability using availability zones"
        url: "https://aws.amazon.com/builders-library/static-stability-using-availability-zones/"
      - kind: doc
        title: "AWS IAM: security best practices"
