  - slug: devops-container-orchestration
    name: "Kubernetes: The Reconciliation Loop"
    domain: devops
    est_hours: 24
    difficulty: advanced
    prerequisites:
      - devops-containers
      - devops-cloud-providers
    summary: |-
      One idea — controllers driving actual state towards declared state — and everything it generates: Deployments, Services, probes, requests and limits, scheduling, and the resource settings that cause most cluster incidents.
    content_md: |-
      Kubernetes looks like an enormous API surface. It is really one idea repeated: you declare desired state in an object, a controller watches that object, compares it with reality, and takes an action to close the gap — forever, in a loop. Every feature is a controller. If you learn to ask "which controller owns this, and what is it comparing?", the system becomes debuggable instead of mysterious.

      ### The objects that matter, and why there are so many

      A **Pod** is the unit of scheduling: one or more containers sharing a network namespace and storage, always co-located. You rarely create one directly. A **ReplicaSet** keeps N identical pods running. A **Deployment** manages ReplicaSets to give you rolling updates and rollback — this layering is exactly why a rollout works: the Deployment creates a new ReplicaSet and shifts replicas from old to new according to `maxSurge` and `maxUnavailable`.

      A **Service** provides a stable virtual address and DNS name in front of a changing set of pods, selected by label. A pod's IP is ephemeral and changes on every restart; the Service is what makes that survivable. **Ingress** or a **Gateway** handles external HTTP routing and TLS.

      **StatefulSets** give stable network identity and stable storage for things like databases; **DaemonSets** run one pod per node for agents; **Jobs** and **CronJobs** run work to completion. **ConfigMaps** and **Secrets** inject configuration — and note that Secrets are only base64-encoded at rest unless encryption at rest is explicitly enabled, which surprises people who assume the name implies protection.

      ### Requests and limits: the setting that causes the most incidents

      A CPU/memory **request** is what the scheduler reserves when placing the pod; a **limit** is the hard cap the kernel enforces. The gap between them is where trouble lives.

      Memory has no elasticity: exceed the limit and the kernel kills the container (that 137 exit code again). So the memory limit must be set from observed usage plus real headroom, and for most workloads request and limit should be equal.

      CPU behaves differently — exceeding a CPU limit does not kill anything, it **throttles**. The container is stopped for the remainder of each scheduling period. This produces latency spikes with no error, no restart and no obvious signal unless you are watching throttling metrics specifically, and it is one of the most common causes of "the p99 is terrible and nothing looks wrong". A widely held (and defensible) position is to set CPU requests carefully and often to leave CPU limits off entirely for latency-sensitive services, while always setting memory limits.

      Requests that are far below actual usage cause the opposite problem: the scheduler overpacks a node, and everything on it degrades together.

      ### Probes, and the ones that make things worse

      A **readiness** probe controls whether the pod receives traffic; a **liveness** probe restarts the container when it fails. Liveness probes are dangerous when misused: a probe with a short timeout against a service that is merely slow under load will restart every pod at exactly the moment the system is most stressed, converting a degradation into an outage. Keep liveness checks trivially cheap and generous, keep dependency checks out of them entirely, and use **startup** probes for slow-booting applications instead of loosening the liveness timing forever.

      ### Scheduling and availability

      The scheduler places pods by requests, node selectors, taints and tolerations, affinity rules and topology spread constraints. If you do nothing, all replicas can land on one node, and losing that node loses the service — so spreading across nodes and zones must be stated explicitly. **PodDisruptionBudgets** tell voluntary operations (node drains, cluster upgrades) the minimum availability to preserve; without one, a routine cluster upgrade can evict every replica at once. Autoscaling comes in three flavours that people conflate: horizontal pod autoscaling (more replicas), vertical (bigger requests), and cluster autoscaling (more nodes).

      ### Debugging

      `kubectl describe pod` first — its events explain most failures directly, including `ImagePullBackOff`, `CrashLoopBackOff` and, very commonly, `FailedScheduling` with the reason no node fits. `kubectl logs --previous` gets the logs of the container that just died, which is the only place the actual crash appears. `kubectl get events --sort-by=.lastTimestamp` for cluster-level context.

      ### Common mistakes

      No resource requests at all, so the scheduler is guessing. Memory limits set from a single afternoon's observation. Liveness probes that check downstream dependencies. `latest` image tags, which make rollback meaningless. No PodDisruptionBudget. Storing configuration in the image and rebuilding for every environment. Reaching for Kubernetes when three virtual machines and a load balancer would do — the operational cost is real, and it is a poor first platform for a small team.
