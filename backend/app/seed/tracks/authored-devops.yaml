# Hand-authored SkillAtlas content. Do NOT regenerate with
# scripts/import_roadmapsh.py — the importer skips any roadmap that has an
# `authored-<slug>.yaml` beside it, and this file is that exit.
#
# Independent curation and independent prose. The syllabus is deliberately
# outcome-shaped rather than a topic checklist: it walks one service from a
# laptop to production and then teaches what happens to it at 3am. Written
# against primary sources — the Linux man pages, the kernel cgroup-v2 admin
# guide, Docker/Kubernetes/Terraform/Prometheus documentation, the AWS
# Well-Architected and Builders' Library material, the public Google SRE book
# and workbook, and published RFCs.
#
# Slug policy: every `devops-*` slug that other seed data references is kept.
# Three slugs are repurposed because their original topic did not earn a place
# in this syllabus; each says so in a comment above it.

track:
  slug: devops
  title: "DevOps: From Laptop to Production, and What Wakes You at 3am"
  domain: devops
  target_role: "DevOps / Platform / Site Reliability Engineer"
  difficulty: intermediate
  description: "A 33-step path that follows one real service through its whole life: the machine it runs on, the shell you debug it from, the container you package it in, the network in front of it, the cloud account under it, the pipeline that promotes it, the orchestrator that keeps it alive, and the telemetry, on-call rotation, backups and budget that decide whether it survives its first bad night. Every stage teaches the mechanism first and then the failure that mechanism causes when you get it wrong."

concepts:
  - slug: devops-operating-system
    name: "How an Operating System Actually Runs Your Service"
    domain: devops
    est_hours: 10
    difficulty: beginner
    prerequisites: []
    summary: |-
      Processes, scheduling, virtual memory, the page cache, and the cgroup and namespace primitives that later turn into containers — the layer every production incident eventually bottoms out in.
    content_md: |-
      Nearly every hard production problem resolves into one of four resources: CPU time, memory, disk I/O, or network. An operating system's whole job is to multiplex those four across processes that each believe they own the machine. If you understand how it does that, most "the server is slow" mysteries stop being mysteries.

      ### Scheduling and what "load average" means

      The kernel scheduler hands runnable threads slices of CPU. A thread is *runnable* when it has work and is only waiting for a core; it is *blocked* when it is waiting on I/O, a lock, or a timer. Linux's load average counts both runnable and uninterruptible-sleep tasks, which is why a box with load 40 and 3% CPU is usually stuck on disk or on a hung network mount, not short of compute. This is the single most misread number in operations: load average is not CPU utilisation, and comparing it across machines with different core counts is meaningless unless you divide by core count.

      ### Virtual memory, RSS, and the number that lies

      Each process gets a virtual address space that the MMU maps to physical pages on demand. Because pages are shared (libraries, copy-on-write forks) and lazily allocated, the memory numbers you see are all partial truths. Virtual size (VSZ) counts address space a process has *reserved* and is often absurdly large and harmless. Resident set size (RSS) counts pages currently in physical memory, but double-counts shared pages across processes. PSS ("proportional set size", in `/proc/<pid>/smaps`) divides shared pages by the number of sharers and is the number you actually want when asking "how much of this box is that process using".

      Linux also overcommits by default: it will hand out more address space than it can back. When the promises come due and there is nowhere to reclaim from, the OOM killer picks a victim by score and kills it. A service that "randomly restarts with no logs and exit code 137" was almost certainly OOM-killed — check `dmesg` and the kernel log before you go looking for a bug in the application.

      ### The page cache is not a leak

      Free memory on a healthy Linux box is close to zero, because the kernel uses everything spare as page cache for file data. Monitoring that alerts on "free memory low" will page you constantly and teach you nothing. The number that matters is *available* memory (`MemAvailable` in `/proc/meminfo`), which estimates what could be reclaimed under pressure.

      ### cgroups and namespaces: the two ideas containers are made of

      Control groups (cgroup v2, documented in the kernel admin guide) account for and cap a process tree's CPU, memory, I/O and PIDs. Namespaces give a process tree its own view of a resource kind — its own PID numbering, mount table, network stack, hostname, user IDs. Neither is a container; a container is a process started with a fresh set of namespaces and a cgroup attached. Knowing this makes container behaviour predictable rather than magical, and it explains a classic surprise later in this track: a runtime or thread pool that sizes itself from the host's core count while running inside a container capped at half a core.

      ### The mistakes people actually make

      Treating load average as CPU. Alerting on free memory rather than available memory. Assuming a memory cap produces a graceful error — under a cgroup memory limit the process is killed, and cgroup-level OOM kills do not always appear where you expect in logs. And sizing thread pools, connection pools or heaps from `nproc` inside a container, which reports the host's CPUs unless the runtime is explicitly cgroup-aware.
    resources:
      - kind: doc
        title: "proc(5) — the /proc filesystem"
        url: "https://man7.org/linux/man-pages/man5/proc.5.html"
      - kind: doc
        title: "Linux kernel: Control Group v2 admin guide"
        url: "https://docs.kernel.org/admin-guide/cgroup-v2.html"
      - kind: doc
        title: "namespaces(7) — overview of Linux namespaces"
        url: "https://man7.org/linux/man-pages/man7/namespaces.7.html"
      - kind: article
        title: "Brendan Gregg: Linux Load Averages — Solving the Mystery"
        url: "https://www.brendangregg.com/blog/2017-08-08/linux-load-averages.html"
      - kind: book
        title: "Systems Performance, 2nd edition — Brendan Gregg"
        url: "https://www.brendangregg.com/systems-performance-2nd-edition-book.html"
      - kind: book
