        url: "https://github.com/github/gh-ost"

  - slug: devops-gitops
    name: "GitOps: The Repository as the Source of Truth"
    domain: devops
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - devops-deployment-strategies
      - devops-provisioning
    summary: |-
      Pull-based reconciliation with Argo CD or Flux — declarative desired state in Git, continuous drift correction, and the environment-promotion and secrets problems GitOps does not solve for free.
    content_md: |-
      GitOps is one claim: the desired state of a system lives in a version-controlled repository, and an agent running inside the target environment continuously reconciles reality against it. The change to your workflow is that nothing is deployed by *pushing*; things are deployed by committing, and the cluster pulls.

      ### Why pull beats push

      A push pipeline needs credentials for every environment it can deploy to, held outside those environments. That is a large, permanent, attractive target — compromise CI and you have production. With a pull model, the agent lives inside the cluster, holds the permissions it needs locally, and reaches out to read the repository. CI's job shrinks to building an artefact and opening a commit, so CI never needs production credentials at all. For most organisations this is the strongest argument.

      The second argument is drift. A push pipeline deploys and then stops caring; whatever anyone changes by hand afterwards persists silently. A reconciler compares continuously and either reports or reverts the difference, so "what is in Git" and "what is running" cannot quietly diverge. That is the property that makes the repository a genuine audit trail rather than a hopeful one.

      ### The shape in practice

      Keep two repositories, or at least two clear paths: application source, and the environment manifests. CI builds an image, pushes it, and opens a commit that updates the digest in the environment repository. That commit is the deployment, reviewable and revertible like any other. Promotion from staging to production is a commit that copies a digest between directories. Rollback is `git revert`.

      Use Kustomize overlays or Helm values to express "the same application, different environment", rather than copying manifests per environment — copies drift, and the whole point was to eliminate drift. Configure the reconciler to prune resources removed from Git, otherwise deleting a manifest leaves the object running forever, which is a subtle and lasting source of mystery workloads.

      ### The two problems it does not solve

      **Secrets.** You cannot commit plaintext credentials to a repository. The workable options are encrypted-in-Git (SOPS with a KMS key, or Sealed Secrets, so the ciphertext is committable and only the cluster can decrypt), or an operator that syncs from an external secret store into the cluster and keeps only a reference in Git. The second is generally better because it centralises rotation. What is not an option is "we will remember to do it manually".

      **Ordering and long-running changes.** Reconciliation is convergent, not sequential. A database migration that must complete before the new version starts, or a change that must be applied to three clusters in a specific order, needs an explicit mechanism — hooks, waves, or a dedicated progressive-delivery controller. Assuming the reconciler will figure out ordering is how you get a new version crash-looping against an old schema.

      ### Common mistakes

      Committing plaintext secrets, then rotating nothing after removing them (they remain in history). Auto-sync with pruning enabled on a cluster where humans still make manual changes, so the reconciler deletes something important at an unpredictable moment. One giant application object covering the whole cluster, so any failure blocks everything. No alerting on reconciliation failure — the agent can be silently unable to sync for days while everyone believes the repository is authoritative. And treating Git as authoritative for the manifests while the cluster and its node pools are still created by hand, which leaves the most important layer unmanaged.
