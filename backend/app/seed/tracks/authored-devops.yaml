  - slug: devops-provisioning
    name: "Infrastructure as Code: Terraform, State and Drift"
    domain: devops
    est_hours: 14
    difficulty: intermediate
    prerequisites:
      - devops-cloud-providers
    summary: |-
      Declarative provisioning with Terraform or OpenTofu — the state file and why it is the whole game, plan/apply discipline, modules, locking, and the operations that destroy things you did not intend to touch.
    content_md: |-
      Clicking through a console is fine for learning and unacceptable for anything you must reproduce. Infrastructure as code makes the environment a reviewable artefact: you can diff it, roll it back, stamp out an identical copy for testing, and answer "who changed this and why" from the commit log rather than from memory.

      ### The declarative model

      You describe the desired end state; the tool computes the difference against reality and produces a plan of creates, updates, replacements and destroys. The plan is the product. Read it every time. In particular, look for the difference between an in-place update and a *replacement* — some attribute changes force the provider to destroy and recreate a resource, and on a database, a volume, or anything holding an address, that is data loss or an outage dressed up as a routine change.

      ### State is the whole game

      Terraform keeps a state file mapping your configuration's resource addresses to the real resource identifiers. Everything follows from that. State must live in shared remote storage (an object store with versioning) rather than on a laptop, because two people applying from divergent local copies will each try to create what the other already made. State must be *locked* during an apply, so concurrent runs cannot interleave. State contains secrets in plaintext — database passwords, generated keys — so the backend must be encrypted and access-controlled as tightly as a credentials store, a fact teams routinely miss.

      State also drifts. Someone fixes something in the console at 3am, and now reality and state disagree; the next plan proposes to undo the fix. Detecting drift on a schedule and treating each instance as an incident to explain is what keeps the code authoritative rather than aspirational.

      When state is wrong, `import` brings an existing resource under management, `state mv` renames an address without touching infrastructure, and `state rm` forgets a resource without deleting it. These are sharp tools; take a copy of the state file before using them.

      ### Structure that survives growth

      Split state by blast radius and change frequency: networking, data stores and applications should not share one state file, because a single mistake then risks everything and every plan takes ten minutes. Use modules for genuine reuse, but resist over-abstracting early — a module with forty optional variables is harder to reason about than duplicated, obvious code. Pin provider and module versions; an unpinned provider upgrade can rewrite plans overnight. Keep environments as separate state with the same modules and different variable files, rather than as branches, which invites drift between environments that are supposed to be identical.

      ### Where it stops

      Terraform provisions resources; it is not a configuration manager for the inside of a machine, not an application deployer, and a poor choice for anything requiring a loop of observation and correction. The next two chapters cover those. Also treat any `local-exec` provisioner as a smell: it is imperative code hiding inside a declarative graph, it does not run on subsequent applies, and it cannot be planned.

      ### Common mistakes

      Local state. Unlocked state. Unencrypted state containing secrets. Applying without reading the plan — the destroy count in the plan summary is the single most important number in this chapter. Hand-editing resources that Terraform manages. One monolithic state for the entire estate. Interpolating a secret into the configuration so it lands in both state and the plan output. And running `apply` from laptops instead of from a pipeline with an audit trail and a required approval.
