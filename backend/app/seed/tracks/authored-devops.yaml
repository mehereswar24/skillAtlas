  - slug: devops-unix
    name: "The Unix Process Model: File Descriptors, Signals and How Services Die"
    domain: devops
    est_hours: 8
    difficulty: beginner
    prerequisites:
      - devops-operating-system
    summary: |-
      fork/exec, file descriptors, exit codes, and the signal handling that decides whether your deploy drains cleanly or drops in-flight requests.
    content_md: |-
      The Unix process model is small enough to hold in your head and it explains an enormous amount of production behaviour — how a service starts, how it gets its configuration, how it is asked to stop, and what happens when it refuses.

      ### fork, exec, and where environment variables come from

      A new process is made by `fork()` (duplicate the current process) followed by `exec()` (replace its image with a new program). The child inherits the parent's environment, open file descriptors, working directory and user. That inheritance is why an environment variable exported in your shell is visible to the program you launch but not to a process someone else started an hour ago, and why "it works in my terminal but not under systemd" is nearly always an environment or working-directory difference rather than a code difference.

      ### File descriptors are the universal handle

      Every open file, socket, pipe and terminal is a small integer in a per-process table. Descriptors 0, 1 and 2 are stdin, stdout and stderr by convention. Redirection and pipes are just the shell rearranging that table before `exec`. Two operational consequences follow. Descriptors are a limited resource (`ulimit -n`), and "too many open files" is a leaked-socket or leaked-file bug far more often than a genuine need for a higher limit. And a deleted file whose descriptor is still open keeps consuming disk — which is why `df` can report a full disk that `du` cannot account for, until you restart the process holding the handle.

      ### Signals, and the four seconds that ruin your deploy

      Signals are the OS's way of interrupting a process. The two that matter operationally are SIGTERM ("please stop") and SIGKILL ("stop, no negotiation, uncatchable"). Well-behaved services catch SIGTERM, stop accepting new work, finish in-flight requests, close connections and exit. Orchestrators lean on exactly this: Kubernetes sends SIGTERM, waits for `terminationGracePeriodSeconds`, then sends SIGKILL. If your process ignores SIGTERM — or, more commonly, never *receives* it — every deploy silently drops requests.

      Why it might never receive it: PID 1 in a container has special signal semantics and does not get default signal dispositions, so a shell wrapper running as PID 1 will happily swallow SIGTERM and never pass it on. This is the most common containerisation bug in this entire track. Use `exec` in entrypoint scripts so the real binary *becomes* PID 1, or run a tiny init that forwards signals and reaps zombies.

      ### Exit codes are an API

      Zero means success; anything else is a failure your supervisor, CI job or shell pipeline will act on. Termination by signal is reported as 128 + signal number, which is where the two codes you will see most come from: 143 (128 + 15, SIGTERM — a normal shutdown) and 137 (128 + 9, SIGKILL — usually an OOM kill or an expired grace period). Reading a restart loop correctly starts with reading that number.

      ### Common mistakes

      Wrapping a service in `sh -c` without `exec`. Failing to reap child processes and accumulating zombies. Assuming SIGKILL can be handled — it cannot, so anything that must happen at shutdown must happen on SIGTERM. And raising `ulimit -n` to hide a descriptor leak instead of finding it with `lsof` or `ls /proc/<pid>/fd`.
    resources:
      - kind: doc
        title: "signal(7) — overview of signals"
        url: "https://man7.org/linux/man-pages/man7/signal.7.html"
      - kind: doc
        title: "fork(2) — create a child process"
        url: "https://man7.org/linux/man-pages/man2/fork.2.html"
      - kind: doc
        title: "Kubernetes: Pod lifecycle and termination"
        url: "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"
      - kind: doc
        title: "Dockerfile reference: ENTRYPOINT, CMD and signal delivery"
        url: "https://docs.docker.com/reference/dockerfile/"
      - kind: doc
