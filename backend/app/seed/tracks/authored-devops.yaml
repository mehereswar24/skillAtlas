  - slug: devops-configuration-management
    name: "Configuring the Inside of a Machine, and Immutable Infrastructure"
    domain: devops
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - devops-provisioning
    summary: |-
      Ansible, cloud-init and image baking — convergent versus immutable approaches, why configuration drift is inevitable in the mutable model, and how to decide which you are running.
    content_md: |-
      Provisioning creates the machine. Something still has to decide what is on it. There are two coherent answers, and the failure mode is having neither, or drifting between both without noticing.

      ### The convergent model

      Ansible, Chef, Puppet and Salt describe a desired end state for a machine's packages, files, users and services, then repeatedly *converge* reality towards it. Ansible is the common choice now because it is agentless — it works over SSH and needs nothing pre-installed on the target — and because its YAML playbooks are readable by people who do not write Ruby.

      The property that makes any of this safe is idempotence: a task must be expressible as "ensure this is true", not "run this command". `ensure package X is present` can run a hundred times harmlessly; a shell task that appends a line to a file adds a hundred lines. When you must drop to a shell command, guard it with a `creates`/`removes` condition or a `changed_when` so re-running is a no-op.

      Convergence has an inherent limit: it can only fix what it knows about. A file someone added by hand, a package installed manually, a kernel parameter someone tuned — none of it is in the playbook, so none of it is corrected. Machines that live for months accumulate this divergence, and it is why two servers "configured identically" behave differently, and why a rebuild after a failure produces a host that mysteriously does not work.

      ### The immutable model

      The alternative is to never modify a running machine. Bake a complete image (with Packer, a Dockerfile, or a cloud image pipeline), version it, and deploy changes by replacing instances rather than updating them. Drift becomes structurally impossible: the image is the artefact and the artefact is what runs. Rollback is redeploying the previous image. Scale-up produces an instance identical to the ones already running, rather than one that runs a newer package version because it converged today.

      The cost is build time, image storage, and the need for genuinely stateless instances — anything with local state must be handled separately, which forces a healthy conversation about where state actually lives.

      Containers are the immutable model taken to its conclusion, which is why this track spends more time there. But the same discipline applies to virtual machines, and a bake-then-replace pipeline for VMs is often the right answer for workloads that do not suit containers.

      ### Boot-time configuration

      `cloud-init` runs on first boot and handles the small, instance-specific part: hostname, users, keys, fetching the machine's role from instance metadata, starting the agent that does the rest. Keep it small. A cloud-init script that installs and configures the whole application is a slow, unmonitored, unrepeatable deployment that runs exactly once and cannot be debugged after the fact.

      ### Common mistakes

      Non-idempotent shell tasks. Playbooks that only work from a clean image, so nobody dares run them against a live host. Secrets committed into playbooks or inventories in plaintext rather than in a vault. Running convergence manually and irregularly, so the code stops matching reality and everyone stops trusting it. Mixing models — baking an image and *also* converging it at boot, so what is running depends on when the instance launched. And long-lived pet servers with SSH access for everyone, which no tool can save you from.
