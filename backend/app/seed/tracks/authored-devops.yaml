        url: "https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html"
      - kind: book
        title: "The Linux Programming Interface — process and signal chapters"
        url: "https://man7.org/tlpi/"

  - slug: devops-terminal-knowledge
    name: "Living in a Shell: Pipelines, Job Control and Text as an Interface"
    domain: devops
    est_hours: 8
    difficulty: beginner
    prerequisites:
      - devops-unix
    summary: |-
      Composing small tools into answers — pipes, redirection, grep/sed/awk/jq, find, xargs — plus the job control and quoting rules that separate a useful one-liner from an outage.
    content_md: |-
      The Unix answer to "how do I inspect this system" is not one program, it is many small programs and a way of gluing them together. Fluency here is what separates an engineer who can answer a question during an incident from one who has to go build a dashboard first.

      ### The composition model

      A pipe connects one process's stdout to the next's stdin, and the processes run concurrently — data streams rather than buffering the whole result. That means you can grep a 40GB log without loading it into memory, and it also means a pipeline's exit status is by default only the *last* command's status, which is exactly how failures hide. (`set -o pipefail`, in the scripting chapter, fixes that.)

      ### The tools that pay for themselves

      `grep` for filtering by pattern, with `-c` to count, `-v` to invert and `-o` to extract just the match. `sed` for stream substitution. `awk` for anything involving columns and arithmetic — `awk '{s+=$3} END {print s/NR}'` is faster to write than the equivalent script and works on any box you can SSH into. `sort | uniq -c | sort -rn` is the canonical "top N by frequency" idiom and answers a startling proportion of log questions. `jq` does the same job for JSON and is worth real study now that structured logging is the norm. `find … -print0 | xargs -0` handles bulk operations on filenames safely, including the ones with spaces that break naive loops.

      ### Job control and long-running work

      `Ctrl-Z` suspends, `bg`/`fg` move a job between background and foreground, `jobs` lists them. The operational fact that matters is that a background job is still a child of your shell, so closing the SSH session sends SIGHUP and kills it. Anything that must outlive your connection belongs in `tmux`, `screen`, `nohup`, or better, a systemd unit.

      ### Quoting is where people get hurt

      Unquoted variable expansion in the shell undergoes word splitting and glob expansion. `rm $file` where `file` contains a space deletes two wrong things; `rm "$file"` deletes one right thing. The habit to build now is to quote every expansion unless you have a specific reason not to. The companion habit is to test destructive one-liners by replacing the destructive command with `echo` first — running the pipeline that *prints* what would be deleted costs three seconds and has saved more production data than any backup policy.

      ### Common mistakes

      Parsing `ls` output instead of using `find` or globs. Using `cat file | grep x` when `grep x file` does it. Assuming a pipeline succeeded because the last stage did. Writing a bash loop to do what one `awk` invocation does, then discovering it takes twenty minutes on a large file. And running an unquoted, untested `rm -rf "$DIR/"` where `DIR` was never set — which, with an unset variable and no `set -u`, expands to something catastrophic.
    resources:
      - kind: doc
        title: "GNU Bash Reference Manual"
        url: "https://www.gnu.org/software/bash/manual/bash.html"
      - kind: doc
        title: "GNU Awk User's Guide"
        url: "https://www.gnu.org/software/gawk/manual/gawk.html"
      - kind: doc
        title: "jq manual"
        url: "https://jqlang.github.io/jq/manual/"
      - kind: doc
        title: "find(1) manual page"
        url: "https://man7.org/linux/man-pages/man1/find.1.html"
      - kind: article
        title: "Greg's Wiki: BashPitfalls"
        url: "https://mywiki.wooledge.org/BashPitfalls"
      - kind: doc
        title: "GNU Coreutils manual"
        url: "https://www.gnu.org/software/coreutils/manual/coreutils.html"

  - slug: devops-linux
    name: "Debugging a Linux Box That Is Misbehaving"
    domain: devops
    est_hours: 12
    difficulty: intermediate
    prerequisites:
      - devops-terminal-knowledge
    summary: |-
      A repeatable method — the USE checklist — plus the tools that answer "why is this slow": top, vmstat, iostat, ss, strace, perf, dmesg and journalctl, and the four causes that explain most single-box incidents.
    content_md: |-
      The difference between a junior and a senior on an incident call is rarely knowledge of an exotic tool. It is having a *method*, so that ten minutes in you have eliminated three of the four possible resources instead of guessing at a fourth.

      ### The USE method

      Brendan Gregg's USE checklist is the fastest general-purpose approach: for every resource (CPU, memory, disk, network, and any relevant software resource such as a thread pool or connection pool), check **U**tilisation, **S**aturation and **E**rrors. Utilisation is the fraction of time the resource was busy; saturation is the amount of queued work it could not serve; errors are outright failures. Saturation is the one people skip and the one that usually explains user-visible latency — a disk at 100% utilisation with a queue depth of 1 is fine, and the same disk with a queue depth of 60 is an outage.

      ### The tool for each question

      "Is it CPU?" — `top` or `htop` for the per-process split, and crucially the breakdown between user, system, iowait and steal time. High `sy` points at syscall or kernel overhead; high `wa` means processes are blocked on I/O; non-zero `st` on a virtual machine means the hypervisor is giving your CPU to someone else, which no amount of application tuning will fix.

      "Is it memory?" — `free -m` (read *available*, not free), `/proc/meminfo`, and `dmesg -T | grep -i oom` for kills. Swap *activity* in `vmstat 1` (the `si`/`so` columns) is a much better distress signal than swap usage.

      "Is it disk?" — `iostat -xz 1` for per-device await and queue depth, `df -h` for space, `df -i` for inodes (a disk with free bytes and zero free inodes fails in a way that confuses everyone the first time), and `du -xh --max-depth=1` to find the offender.

      "Is it network?" — `ss -s` for a socket summary, `ss -tn state time-wait | wc -l` for TIME_WAIT accumulation, `ss -ltn` to confirm the service is even listening on the interface you think it is, and `tcpdump` or `mtr` when you need to prove where packets stop.

      "What is the process actually doing?" — `strace -f -p <pid>` to see syscalls (expensive, since it slows the target, so use it deliberately), `perf top` for CPU profiles, and `/proc/<pid>/stack` or a language-level thread dump for hangs.

      ### The four classics

      Most single-box incidents are one of: disk full (or inodes full), file descriptors exhausted, out of memory, or a dependency timing out and backing up a thread pool. Checking those four takes ninety seconds and resolves a large fraction of pages before you need anything cleverer.

      ### Common mistakes

      Reaching for a profiler before checking `df`. Reading five-minute averages when the incident lasted forty seconds — always sample at a resolution finer than the event. Trusting `top`'s instantaneous percentages for short-lived processes. Running `strace` against a busy production process without appreciating that you have just made it several times slower. And, most commonly, fixing the symptom (restarting the process, growing the disk) without capturing the evidence the postmortem will need — take the thread dump and copy the logs *before* you restart.
    resources:
      - kind: article
        title: "Brendan Gregg: The USE Method"
        url: "https://www.brendangregg.com/usemethod.html"
      - kind: article
        title: "Brendan Gregg: Linux Performance tools index"
        url: "https://www.brendangregg.com/linuxperf.html"
      - kind: doc
        title: "iostat(1) manual page"
        url: "https://man7.org/linux/man-pages/man1/iostat.1.html"
      - kind: doc
        title: "ss(8) — socket statistics"
        url: "https://man7.org/linux/man-pages/man8/ss.8.html"
      - kind: doc
