  - slug: devops-serverless
    name: "Serverless and Managed Runtimes: Where They Fit and Where They Do Not"
    domain: devops
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - devops-cloud-providers
    summary: |-
      Functions and managed container runtimes — the concurrency and cold-start model, the connection-pooling problem with relational databases, and an honest account of the workloads where serverless is the wrong tool.
    content_md: |-
      Serverless does not mean there is no server; it means you do not size, patch or scale one, and you pay per unit of work rather than per hour of capacity. That trade is excellent for some workloads and quietly terrible for others, and the difference is worth understanding before you commit an architecture to it.

      ### The execution model

      A function platform keeps a pool of execution environments. A request arrives; if a warm environment is free it runs immediately, and if not, the platform creates one — downloading your code, starting the runtime, and executing your initialisation before your handler runs. That creation is the **cold start**, and it is the defining characteristic of the model. It is a few hundred milliseconds for a small package on a fast runtime and several seconds for a large one on a heavy runtime.

      The concurrency model is the part people get wrong: most function platforms run **one request per environment at a time**. Ten concurrent requests means ten environments. This is different from a threaded server handling ten requests in one process, and it has two large consequences. Anything you cache in memory is cached per environment, so a hit rate you measured on one server is not what you will get. And each environment opens its own connections.

      ### The database connection problem

      A relational database supports a bounded number of connections — often a few hundred. A function scaling to a thousand concurrent executions will attempt a thousand connections and exhaust the database, taking down everything else that uses it. This is the most common serverless production failure. The answers are a connection proxy or pooler that sits between functions and the database, a data API that speaks HTTP rather than a database wire protocol, concurrency caps on the function, or a datastore that is itself HTTP-native and designed for this pattern.

      ### Where serverless genuinely wins

      Spiky or unpredictable traffic, where paying for idle capacity is pure waste. Event handling — reacting to an object upload, a queue message, a schedule. Glue between managed services. Low-volume internal endpoints where the operational savings dwarf the runtime cost. Anything where the work is naturally short, stateless and independent.

      ### Where it does not

      Steady high-volume traffic, where per-request pricing exceeds the cost of a right-sized always-on fleet, sometimes by a lot. Work with strict low tail latency where cold starts are unacceptable (provisioned concurrency helps, at which point you are paying for idle capacity and have reinvented servers with extra steps). Long-running jobs that exceed the platform's execution limit. Anything needing large local state, persistent connections, or specialised hardware. And workloads whose vendor lock-in is genuinely uncomfortable, since the event and permission model is not portable.

      Managed container runtimes sit between the two: you still ship a container, but the platform scales it to zero and back, allows several concurrent requests per instance, and drops most of the cluster operations. For many teams that is the more comfortable point on the curve.

      ### Common mistakes

      Doing setup work inside the handler rather than at module scope, so every invocation re-pays it. Doing heavy setup at module scope and inflating the cold start. Assuming the environment is destroyed after each request — it is reused, so leaked global state and temporary files persist. Fanning out an unbounded number of concurrent invocations against a downstream service with a much lower limit. No dead-letter queue on asynchronous invocations, so failures vanish silently. And building a synchronous chain of six functions calling each other, which multiplies cold starts, cost and failure probability all at once.
