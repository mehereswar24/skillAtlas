  - slug: devops-version-control-systems
    name: "Git as a Data Structure"
    domain: devops
    est_hours: 8
    difficulty: beginner
    prerequisites: []
    summary: |-
      Commits as an immutable DAG of snapshots, what branches and merges really are, and the recovery tools — reflog, bisect, revert — that make Git a safety net instead of a source of fear.
    content_md: |-
      Almost everyone learns Git as a list of commands to memorise, and almost everyone stays frightened of it as a result. Learn the data model instead — it is small — and the commands become obvious consequences.

      ### The model

      A commit is an immutable snapshot of the whole tree, plus metadata, plus pointers to its parents. Commits form a directed acyclic graph. A branch is nothing but a movable pointer to one commit; `HEAD` is a pointer to the branch you are on. Nothing in Git modifies a commit — operations that appear to (amend, rebase) create new commits and move pointers, leaving the originals reachable through the reflog until garbage collection.

      Once you hold that picture, the confusing operations resolve. Merging creates a new commit with two parents, preserving both histories exactly as they happened. Rebasing replays your commits onto a new base, producing new commit objects with new hashes and a linear history that is easier to read but no longer literally true. Neither is correct in the abstract: rebase local work you have not shared, merge (or use a merge queue) for anything others have already pulled. The rule that prevents pain is simply never to rewrite history that someone else's branch is based on.

      ### The three areas

      Working tree, index (staging area), and repository. `git add` moves changes from tree to index; `git commit` moves index to repository. `git status` is the map, and `git diff` versus `git diff --staged` shows the two different gaps. Staging is not bureaucratic overhead — it is what lets you commit one coherent change out of a messy working tree, which is the difference between a history you can bisect and one you cannot.

      ### The recovery tools nobody teaches early enough

      `git reflog` records every position `HEAD` has held, so a "lost" commit after a bad reset or rebase is nearly always still there and recoverable by hash. `git bisect` binary-searches history for the commit that introduced a bug, which turns a day of guessing into a dozen builds — and works even better with a script (`git bisect run`). `git revert` creates a new commit that undoes an old one, which is the only safe way to back out a change that has already been pushed. `git cherry-pick` moves one commit somewhere else, invaluable for hotfixes. `git blame -w -C` finds who last touched a line while ignoring whitespace and code movement.

      ### Commits as documentation

      Small, focused commits with messages that explain *why* rather than *what* are what make `bisect`, `blame` and revert useful. A message reading "fix stuff" is a note to your future self that you have chosen to make the next incident harder. The diff already says what changed; the message exists to say what you were trying to achieve and what you rejected.

      ### Common mistakes

      Committing secrets — remember that removing them in a later commit does not remove them from history, so the credential must be rotated, not merely deleted. Committing generated artefacts or dependency directories. Force-pushing a shared branch. Using `git reset --hard` as a general-purpose undo without understanding that it discards uncommitted work irrecoverably (unlike almost everything else in Git). And giant "end of week" commits that make every archaeology tool useless.
