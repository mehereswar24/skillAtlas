  - slug: devops-incident-response
    name: "On-Call, Incident Command and Blameless Postmortems"
    domain: devops
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - devops-observability
    summary: |-
      What to do in the first ten minutes, how to run an incident with more than three people in it, and how to write a postmortem that actually changes the system rather than assigning blame.
    content_md: |-
      Everything before this chapter reduces the chance of an outage. This chapter is about the outage you are having anyway. Incident response is a practised skill, and the difference between teams is almost never technical depth — it is whether they have a structure to fall back on when everyone is stressed and the theories are multiplying.

      ### The first ten minutes

      In order: **acknowledge** the page so the escalation stops and everyone knows a human is on it. **Assess** the customer impact — what is broken, for whom, how badly — because this decides everything that follows. **Communicate** early, in one channel, with a timestamped status; a message saying "investigating, no cause yet" is genuinely valuable, because silence causes everyone else to start their own investigation and DM you about it. Then **mitigate before you diagnose**.

      That last one is the hardest habit to build. Engineers want to understand the problem, and understanding is not the job during an outage — restoring service is. If a deploy went out twenty minutes ago, roll it back; you can find out why later, from a system that is serving users. The mitigations to reach for first are the reversible ones: roll back, flip the feature flag off, fail over, scale up, shed load, disable the expensive code path. Save the root cause for the postmortem.

      ### Roles, once it is bigger than one person

      Beyond a few responders, ad-hoc coordination fails: three people restart the same service, two conflicting changes go out, and nobody is talking to the customer.

      The **Incident Commander** owns the incident, not the fix. They keep the timeline, decide what to try next, assign tasks explicitly by name, and deliberately do *not* type commands — the moment the commander starts debugging, coordination stops. **Operations** makes the changes, and only operations makes changes. **Communications** handles the status page and internal updates. **Scribe** keeps the timeline, which will be the postmortem's backbone and which nobody can reconstruct afterwards from memory.

      One person can hold several roles in a small incident. The point is that the roles exist and someone is named for each. State the severity out loud, because it sets expectations about who to wake and how often to update.

      ### Postmortems that change something

      Write one for every significant incident, within a few days while memory is fresh. It needs a factual timeline with timestamps, the customer impact quantified, the contributing factors, what went well, what was luck, and action items with owners and dates.

      **Blameless** is a technical stance, not a courtesy. The engineer who ran the command was operating a system that permitted a catastrophic action with no confirmation, no dry run and no staged rollout — the system's design is the finding, and "be more careful" is not an action item. Blame reliably produces the outcome you least want: people stop reporting incidents and stop volunteering what really happened, and the organisation loses the data it needs to improve.

      Beware the phrase "root cause". Serious incidents in distributed systems almost always have several contributing factors that were individually survivable — a latent bug, a retry that amplified it, a health check that removed the wrong instances, an alert that fired late. Stopping at the first plausible cause leaves the other three in place.

      Finally, action items decay. A postmortem whose actions are never completed is a document that made everyone feel better and changed nothing. Track them like any other work, with an owner and a date, and review completion rates.

      ### Running a humane rotation

      A rotation needs enough people that nobody is on call constantly, a clear escalation path, a documented (and usable) runbook per alert, and compensation or time back for nights disturbed. Hand over context at rotation change. Measure page volume and treat a rising trend as a defect in the alerting, not as a fact of life.

      ### Common mistakes

      Debugging instead of mitigating. No single channel, so context is scattered across four threads and two calls. Everyone typing commands. No timeline, so the postmortem is guesswork. Postmortems that name a person. Action items with no owner. And no practice — run game days and failure injection exercises, because the first time you fail over a database should not be during an outage.
