  - slug: devops-networking-protocols
    name: "The Network Path a Request Actually Takes"
    domain: devops
    est_hours: 12
    difficulty: intermediate
    prerequisites:
      - devops-linux
    summary: |-
      DNS, TCP handshakes and state, TLS, HTTP/1.1 versus HTTP/2, and the operational limits — MTU, ephemeral ports, conntrack, keepalives — that produce the weirdest production failures you will ever debug.
    content_md: |-
      "The network is slow" is almost never a useful statement. Being able to say *which hop*, *which layer* and *which limit* is the skill, and it requires knowing what happens between a client typing a hostname and a byte arriving at your process.

      ### The path

      Resolve the name (DNS, cached at several levels with TTLs that are frequently ignored), open a TCP connection (three-way handshake, one round trip), negotiate TLS (one or two more round trips depending on version and resumption), send the HTTP request, wait, receive the response. On a 100ms round trip, a cold HTTPS request has spent 300ms on setup before the server has done any work. This is why connection reuse — HTTP keep-alive, connection pools, TLS session resumption — is usually the single largest latency win available to a client, and why a pool configured with a maximum lifetime shorter than the request rate quietly re-pays that cost forever.

      ### TCP states that show up in incidents

      TIME_WAIT is a normal, correct state held by whichever side closed first, for roughly two minutes, to absorb stray packets. Thousands of them are fine; hundreds of thousands on a client-side box means you are opening a fresh connection per request and will eventually exhaust ephemeral ports (the default range is about 28,000 per destination tuple). The fix is connection reuse, not tuning the timeout down and hoping.

      CLOSE_WAIT is different and is always a bug in *your* process: the peer closed, your application has not called `close()`. Growing CLOSE_WAIT counts mean a leaked socket and a descriptor exhaustion in your near future.

      ### The middle layers that bite

      *MTU and fragmentation.* Tunnels (VPN, overlay networks, some cloud networking) reduce the usable MTU. If path MTU discovery is broken by an over-zealous firewall dropping ICMP, small requests succeed and large ones hang forever — the classic "it works until the payload is over 1400 bytes" bug.

      *Connection tracking.* Stateful firewalls and NAT gateways keep a table entry per flow. Fill the table and new connections are dropped with no useful error. Idle timeouts in that table also silently blackhole long-lived connections, which is why database connection pools need a TCP keepalive shorter than the NAT idle timeout, or they will hand out a dead socket that hangs until the OS timeout expires.

      *HTTP versions.* HTTP/1.1 needs one connection per concurrent request. HTTP/2 multiplexes many streams over one connection, which removes head-of-line blocking at the HTTP layer but not at the TCP layer, and interacts unexpectedly with layer-4 load balancers — one client connection carrying all the traffic can pin a huge share of load onto one backend. HTTP/3 over QUIC moves transport into userspace to fix the remaining head-of-line blocking.

      ### Tools that answer the question

      `dig +trace` for resolution, `curl -v --resolve` to bypass DNS and test one specific backend, `curl -w` with a timing format to split DNS, connect, TLS and time-to-first-byte, `openssl s_client -connect` for certificate chains, `ss -tin` for per-socket congestion state, `mtr` for per-hop loss, and `tcpdump` when you need to prove it.

      ### Common mistakes

      Assuming DNS TTL is honoured — many runtimes cache resolutions for the life of the process, which is why a failover that changes a DNS record does not move all your traffic. Not setting client timeouts, so a slow dependency turns into an exhausted thread pool. Terminating TLS somewhere and forgetting the certificate expires — expiry is still one of the most common causes of major outages. Blaming the network for what is a full connection pool. And leaving IPv6 half-configured, so resolution returns an AAAA record to a host with no route and every connection waits out a timeout first.
