  - slug: devops-observability
    name: "SLOs, Error Budgets and Alerts Worth Waking For"
    domain: devops
    est_hours: 12
    difficulty: advanced
    prerequisites:
      - devops-infrastructure-monitoring
      - devops-logs-management
    summary: |-
      Distributed tracing, and the SLI/SLO/error-budget framework that turns "is it healthy" into a number you can alert on — including burn-rate alerting, which is the technique that ends alert fatigue.
    content_md: |-
      Monitoring tells you whether the things you predicted would break have broken. Observability is the property of being able to answer questions about your system that you did not anticipate. The practical difference is whether, faced with a novel failure, you can explore your telemetry and find the answer, or can only confirm that all your existing dashboards are green while customers complain.

      ### Traces: the third signal

      A trace follows one request across every service it touches. Each hop is a span with a start, a duration, a parent, and attributes. Assembled, they give you a waterfall showing precisely where the time went and where the error originated — the question metrics fundamentally cannot answer, because metrics have already aggregated away the individual request.

      What makes tracing work is **context propagation**: the trace ID must be passed through every hop, including through queues and background jobs, or your trace ends at the first boundary someone forgot. Use the W3C `traceparent` standard rather than a bespoke header. Because storing every trace is prohibitive, sample: head-based sampling decides at the start (cheap, but you may discard the interesting ones), while tail-based sampling buffers the trace and decides after seeing the outcome, which lets you keep all errors and all slow requests and 1% of the rest. Tail-based is what you want if you can afford the collector.

      The high-cardinality identifiers you were forbidden from putting in metrics — user ID, order ID, tenant — belong on spans, where they are exactly what lets you answer "which customers were affected".

      ### From signals to a promise: SLI, SLO, SLA

      An **SLI** is a measurement of service quality from the user's point of view, expressed as a ratio of good events to total events: successful requests over all requests, or requests served under 300ms over all requests. Measure it as close to the user as you can — at the load balancer or the client, not deep inside a service that has no idea whether the response ever arrived.

      An **SLO** is your internal target for that SLI over a window: 99.9% of requests succeed over 28 days. An **SLA** is a contractual promise with financial consequences, and should always be looser than your SLO so you notice trouble before a customer invoices you for it.

      The **error budget** follows arithmetically: 99.9% over 28 days permits about 40 minutes of failure. That budget is the most useful management artefact in operations, because it converts an argument into a measurement. Budget remaining means you can ship aggressively. Budget exhausted means reliability work takes priority over features until it recovers. It also, crucially, says that 100% is the wrong target — chasing perfect reliability costs enormously and delivers nothing users can perceive, because their network is less reliable than your service.

      ### Alert on symptoms, and on burn rate

      Alert on user-visible symptoms — the SLI — rather than on causes. High CPU is not an incident; users receiving errors is. Cause-based alerts multiply endlessly, fire during harmless conditions, and still miss the failure you did not imagine.

      Then make the alert respond to *severity of budget consumption*, not to a fixed threshold. A **burn-rate** alert asks how fast you are consuming the error budget: burning at 14× over the last hour will exhaust a 30-day budget in two days, so page immediately; burning at 2× over six hours is real but not urgent, so open a ticket. Combining a fast window and a slow window in one condition gives alerts that fire quickly on genuine outages and stay quiet during brief blips — which is the concrete technique that fixes alert fatigue.

      Every page must be actionable, urgent and about something a human can fix now. If it does not meet all three, it should be a ticket or a dashboard. An on-call rotation that receives fifteen pages a night stops reading them, and then misses the one that mattered — this is the mechanism by which noisy alerting *causes* outages rather than merely annoying people.

      ### Common mistakes

      SLOs invented in a meeting instead of derived from measured behaviour and what users actually need. Measuring the SLI on the server side only, so requests that never arrived are counted as fine. Alerting on every cause. Paging on things nobody can act on at 3am. Traces that stop at the first asynchronous boundary. And an error budget policy that everyone agreed to and nobody has ever enforced, which is the same as not having one.
    resources:
      - kind: article
        title: "Google SRE Book: service level objectives"
        url: "https://sre.google/sre-book/service-level-objectives/"
      - kind: article
