  - slug: devops-artifact-management
    name: "Artifacts and Registries: Build Once, Promote Everywhere"
    domain: devops
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - devops-containers
    summary: |-
      Immutable versioned artefacts, content digests versus mutable tags, registry layout and retention, and why rebuilding per environment quietly destroys your ability to reason about production.
    content_md: |-
      The central rule of release engineering is: **build the artefact once, then promote the same artefact through environments.** If staging and production are built from separate pipeline runs, they are different artefacts — different dependency resolutions, different base image contents, different build-time timestamps — and every test you ran in staging tested something that is not what you shipped.

      ### Tags lie, digests do not

      A tag is a mutable pointer. `myapp:1.4.2` can be overwritten, and `myapp:latest` certainly will be. A digest (`myapp@sha256:…`) names the exact bytes and cannot be repointed. Use tags for human convenience and digests for anything that must be reproducible: deployment manifests, base images in Dockerfiles, and any "what exactly is running in production" question. Many registries can enforce tag immutability; turn it on.

      Give every build a version that maps back to a commit. A tag containing the semantic version plus the short commit SHA is the pragmatic default, because it is readable by humans and still unambiguous during an incident.

      ### What belongs in a registry

      Container images, language packages, OS packages, Helm charts, Terraform modules and signed release binaries all want the same treatment: a versioned, immutable, access-controlled home with a retention policy. Most estates run a single artefact platform for all of them, plus pull-through caches of public registries — which is worth doing for three separate reasons: it survives an upstream outage, it removes public rate limits from your critical path, and it gives you one place to scan and one place to block a known-bad version.

      ### Retention and cost

      Registries grow without bound if nobody says otherwise, and storage for years of untagged intermediate layers becomes a genuine line item. Write a policy — keep all released versions, keep the last N builds per branch, expire untagged manifests after a short window — and make sure it cannot delete something a running deployment still references. That last constraint bites people: garbage-collecting an image that a Kubernetes node needs to re-pull during a scale-up is a self-inflicted outage.

      ### Provenance starts here

      An artefact should be traceable to the commit, the pipeline run and the inputs that produced it. Registries can store signatures and attestations alongside the image, which is the substrate the supply-chain chapter later builds on. Recording it at publish time costs nothing; reconstructing it after an incident is often impossible.

      ### Common mistakes

      Rebuilding per environment. Mutable tags in deployment manifests, so a rollback deploys the wrong bytes. No retention policy until the storage bill forces an emergency cleanup that deletes something load-bearing. Depending directly on a public registry from production pulls, then discovering rate limits during an incident-driven scale-up. And storing artefacts in a bucket with no index, no versioning discipline and no access control, which is a registry with all the features removed.
