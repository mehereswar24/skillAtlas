  - slug: devops-cost-and-capacity
    name: "Capacity, Autoscaling and What It All Costs"
    domain: devops
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - devops-container-orchestration
      - devops-observability
    summary: |-
      Sizing from measured demand, the three autoscaling dimensions and how they interact badly, and the FinOps practices that make cloud spend an engineering metric instead of a quarterly surprise.
    content_md: |-
      Cost is a non-functional requirement with the same standing as latency, and it is usually the one with no owner. In a cloud estate the architecture *is* the bill: every design decision about redundancy, retention, data transfer and instance type shows up as a number, and engineers are the only people who can change those numbers.

      ### Capacity from measurement

      Size from observed demand, not from intuition. You need the peak (with its shape — a daily spike is different from a monthly one), the growth trend, the headroom to absorb a burst while a scale-up happens, and the capacity to survive losing an availability zone. That last requirement is the one people forget: if you run across three zones at 80% utilisation, losing one leaves the survivors at 120%, and you have converted a zone failure into a total outage. Static stability means provisioning so the surviving capacity can carry the load without needing to launch anything, because control planes are often unavailable during exactly the events that require scaling.

      Load test to find where it breaks, and load test the *scaling* path rather than a steady state — the question is not "can it serve 10,000 requests per second" but "what happens between the traffic arriving and the new capacity being ready".

      ### The three autoscalers and their interactions

      Horizontal scaling adds replicas, vertical scaling makes each replica bigger, and cluster scaling adds nodes. They interact in ways that produce their own incidents. Horizontal scaling cannot help if there are no nodes to place pods on, so it waits on the cluster autoscaler, which waits on the cloud API, which takes minutes — during which you are overloaded. Scaling on CPU is a lagging signal for a queue-backed workload; scaling on queue depth or on requests-in-flight responds far sooner. And aggressive scale-in causes thrash: instances are removed, latency rises, they are added back, and you pay for the churn while destroying warm caches. Set conservative scale-down with a stabilisation window and aggressive scale-up; the asymmetry is deliberate.

      Also, autoscaling cannot fix a bottleneck it does not own. Adding fifty application replicas in front of a database at its connection limit makes things strictly worse.

      ### Making cost visible

      Tag everything by team, service and environment from day one — retrofitting attribution across an untagged estate is miserable. Then give each team a view of its own spend and a per-unit metric: cost per thousand requests, per active user, per tenant. Absolute spend rising is meaningless if traffic doubled; unit cost rising is a defect and can be treated like one.

      The usual large wins, roughly in order: right-sizing over-provisioned instances (requests set from a guess and never revisited); committed-use discounts or reservations for the steady baseline with on-demand for the peak; spot or preemptible capacity for anything interruptible, such as CI runners and batch jobs; storage lifecycle policies moving old data to colder tiers; **cross-zone and egress data transfer**, which is invisible in architecture diagrams and frequently one of the largest lines on the bill; and log and metric retention, which grows silently forever.

      Alert on cost anomalies. A misconfigured job or a runaway retry loop can multiply spend within hours, and the default detection mechanism — the monthly invoice — is far too slow.

      ### The trade-off to state plainly

      Every reliability decision in this track has a price: multi-region costs more than multi-zone, higher availability targets cost superlinearly, longer retention costs linearly forever. The engineering skill is presenting the choice with both numbers attached rather than choosing silently in either direction.

      ### Common mistakes

      No tags, so nothing can be attributed. Right-sizing once and never again. Scaling on the wrong signal. Ignoring data transfer. Non-production environments running at full size overnight and at weekends. Buying reservations for capacity whose shape is about to change. And treating cost as finance's problem, which guarantees it will be addressed by a spending freeze rather than by an engineering improvement.
    resources:
      - kind: doc
        title: "AWS Well-Architected: cost optimization pillar"
        url: "https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html"
      - kind: article
        title: "FinOps Foundation: what is FinOps"
