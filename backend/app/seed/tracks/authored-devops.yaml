  - slug: devops-backup-and-recovery
    name: "Backups, RTO/RPO and the Restore You Have Never Tested"
    domain: devops
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - devops-provisioning
      - devops-incident-response
    summary: |-
      Deriving recovery objectives from the business, the difference between snapshots and point-in-time recovery, immutable and off-account copies for ransomware, and why an untested backup is not a backup.
    content_md: |-
      Every other chapter here protects availability. This one protects the data, which is the only part you cannot rebuild from a repository. Data loss is the failure mode companies do not recover from, and the uncomfortable truth of the subject is that almost everyone has backups and far fewer have working restores.

      ### Two numbers, decided by the business

      **RPO** (recovery point objective) is how much data you can afford to lose, measured in time. **RTO** (recovery time objective) is how long you can afford to be down. They are not engineering preferences; they are business decisions with costs attached, and they should be written down per data store. An RPO of 24 hours means a nightly dump is fine. An RPO of five minutes means continuous archiving of the write-ahead log. An RPO near zero means synchronous replication and a much larger bill.

      Deriving them honestly is the valuable exercise. Ask what happens if the last hour of orders disappears, and who has to be told. The answer usually differs sharply between the payments database and the analytics warehouse, and treating them identically means either overspending on one or under-protecting the other.

      ### Snapshots are not point-in-time recovery

      A volume snapshot gives you the state at one instant, and restores put you back to that instant — your RPO is the time since the last snapshot, which may be many hours. Continuous archiving (a base backup plus a stream of write-ahead log segments, as PostgreSQL's PITR provides) lets you restore to *any* moment, which is what you need when the incident is "a bad migration corrupted a table at 14:32" and you want 14:31. Choose per data store based on the RPO you wrote down.

      Note also that a replica is not a backup. Replication faithfully copies your mistakes: `DELETE` without a `WHERE` clause reaches the replica in milliseconds. Replicas protect against hardware failure, backups protect against error and malice, and you need both.

      ### The 3-2-1 idea, updated for ransomware

      Three copies, two media or storage classes, one off-site remains a good starting rule. The modern addition is that at least one copy must be **immutable and outside the blast radius of your primary credentials**: object-lock or write-once storage, in a separate account or project, with separate credentials. This matters because the modern data-loss scenario is not a disk failure — it is an attacker (or a runaway script) with your production credentials deleting the data *and* the backups, which are usually reachable from exactly the same role. Encrypt backups, and store the keys somewhere that survives losing the environment.

      ### Test the restore, on a schedule

      This is the entire chapter in one line. Untested backups fail in mundane, predictable ways: the job has been erroring for three months and nobody read the output; the dump excludes a schema added last year; the restore takes eleven hours and your RTO is two; the encryption key lives only in the environment you just lost; the backup is consistent per table but not across tables, so the restored database violates its own foreign keys.

      Run an automated restore into a scratch environment regularly, verify it with real queries (row counts, a checksum, an application smoke test), and record how long it took — that measured duration is your real RTO, and it is nearly always longer than the assumed one. Rehearse the full procedure with a human at least annually, and write the runbook while you are calm.

      ### Common mistakes

      Backing up the database and forgetting object storage, secrets, DNS zones and the configuration needed to rebuild the environment. Backups in the same account, reachable by the same credentials. No monitoring on backup success — the job silently stopped, and you learn this during the restore. Retention that does not cover the time to *detect* a problem: corruption discovered after 30 days when you keep 14 days of backups is unrecoverable. Never measuring restore time. And no documented plan, so the restore is improvised by whoever is awake.
    resources:
