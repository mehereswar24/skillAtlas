  - slug: devops-vcs-hosting
    name: "Collaboration Mechanics: Reviews, Protected Branches and Ownership"
    domain: devops
    est_hours: 6
    difficulty: beginner
    prerequisites:
      - devops-version-control-systems
    summary: |-
      Turning a hosted repository into a control plane: branch protection, required checks, code owners, merge queues, and the branching model that actually fits how often you deploy.
    content_md: |-
      A hosting platform is not just a place to keep the repository. It is where your change-management controls live, and for most teams it is the only place they live — the repository is the audit trail an auditor will ask for and the gate a bad change has to get past.

      ### Branching models, chosen by deploy frequency

      *Trunk-based development* keeps one long-lived branch, with short-lived feature branches merged within a day or two and incomplete work hidden behind feature flags. It is what teams that deploy several times a day use, and the research programme behind the DORA reports repeatedly associates it with better delivery outcomes.

      *Release branches* make sense when you must support multiple versions in the field — self-hosted software, mobile apps with staged rollout, anything a customer pins to.

      *Long-lived develop/feature/release/hotfix structures* impose a large merge tax and mostly exist because a diagram was popular. Adopt one only if you can name the constraint that forces it.

      The trade-off to reason about: long-lived branches defer integration pain rather than removing it, and the cost of a merge grows superlinearly with how long the branch has diverged.

      ### The controls worth turning on

      Protect the default branch: no direct pushes, no force-pushes, no deletion. Require a pull request, at least one review from someone other than the author, and require status checks to pass — with "branches must be up to date before merging" if your test suite is sensitive to semantic conflicts (two changes that each pass alone and fail together). Require conversations to be resolved. If you deploy from tags, protect the tags too.

      A `CODEOWNERS` file routes reviews automatically to the team that owns each path and can be made a hard requirement for merging. This is how a platform team keeps a hand on shared Terraform or CI configuration without becoming a bottleneck on ordinary product changes.

      A **merge queue** solves the up-to-date problem without making everyone rebase constantly: it batches and tests candidate merges against the real head before landing them. If your CI takes long enough that queued changes conflict, this is the fix.

      ### Reviews that are worth the time

      Small pull requests get real review; a 2,000-line pull request gets "LGTM". Aim to submit changes a reviewer can hold in their head. As a reviewer, separate blocking objections from preferences and say which is which. Automate everything mechanical — formatting, linting, licence checks — so humans spend their attention on design, failure handling and blast radius rather than on comma placement.

      ### Common mistakes

      Requiring reviews but allowing administrators to bypass them, so the control is decorative. Letting CI be advisory rather than required. Leaving secrets scanning off. Granting broad write access to the whole organisation instead of per-team permissions. Giving CI service accounts more repository scope than they need — a compromised workflow token with write access to every repository is a very bad afternoon. And letting a release branch drift for months and then discovering that merging it back is a multi-week project.
