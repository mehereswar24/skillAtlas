  - slug: computer-science-security
    name: Security Fundamentals and Applied Cryptography
    domain: computer-science
    est_hours: 16
    difficulty: intermediate
    prerequisites:
      - computer-science-networking
      - computer-science-representation
    summary: |-
      Threat-model a system, pick the cryptographic primitive that actually provides the
      property you need, store passwords and compare secrets correctly, and recognise the
      common vulnerability classes before they reach production.
    content_md: |-
      Security is not a feature you add; it is a property of a design, and it fails at the
      seams, wherever a trusted component accepts input from an untrusted one. The useful
      skill is not memorising attack names but being able to say, for a given system, what
      you are protecting, from whom, and which mechanism provides that exact guarantee.

      Start with the properties: confidentiality, integrity, availability, plus authenticity
      (it really came from that party) and non-repudiation (they cannot deny sending it).
      Different mechanisms give different properties, and confusing them causes most amateur
      crypto bugs.

      ### Threat modelling before mechanism

      List your assets, the adversaries who want them and what they can do, the attack
      surface, and the trust boundaries data crosses. STRIDE is a serviceable checklist —
      Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation
      of privilege — walked over each boundary. Then apply the principles: least privilege,
      defence in depth (no single control is load-bearing), fail secure (an error denies
      rather than permits), complete mediation (every access is checked, not just the first),
      and Kerckhoffs's principle — the system stays secure when everything but the key is
      public. Secrecy of design is not a control.

      ### Hashes, MACs and what each guarantees

      A cryptographic hash maps any input to a fixed-size digest with preimage and collision
      resistance. MD5 and SHA-1 are broken for collisions and unusable where an adversary
      chooses input; SHA-256 and SHA-3 are current. A hash is not encryption and not
      authentication: anyone can compute it, so a bare digest proves nothing about who
      produced the message. A MAC does — HMAC mixes a shared key into a hash, so only a key
      holder can produce a valid tag, giving integrity and authenticity together.

      ### Encryption that works

      Symmetric encryption (AES, ChaCha20) uses one key both ways and is fast. The mode
      matters more than the cipher: ECB encrypts each block independently and leaks structure
      so plainly that a bitmap stays recognisable. CTR and GCM need a nonce, and reusing one
      with the same key is catastrophic — for CTR-style modes it exposes the XOR of two
      plaintexts, and for GCM it can reveal the authentication key. Use AEAD (AES-GCM or
      ChaCha20-Poly1305), which encrypts and authenticates in one step.

      Asymmetric cryptography (RSA, and curves such as X25519 and Ed25519) removes the need
      to share a key in advance but is far slower, so it agrees a symmetric session key and
      steps aside. Ephemeral key exchange gives forward secrecy: stealing the long-term key
      later does not decrypt recorded traffic. Signatures bind a message to a private key.
      All of it needs unpredictable randomness — use the OS CSPRNG (`getrandom`,
      `/dev/urandom`, `secrets`, `crypto.getRandomValues`), never `rand()`.

      ### Passwords, comparisons and access control

      Never store passwords in plaintext, never encrypt them (a decryptable store is a breach
      waiting to happen), and never use a bare fast hash, because a GPU tries enormous
      numbers of SHA-256 guesses per second. Use a memory-hard KDF — Argon2id, or scrypt or
      bcrypt — with a per-password random salt, which defeats rainbow tables and hides that
      two users chose the same password, and parameters tuned so one verification takes a
      noticeable fraction of a second. Compare secrets in constant time: a normal `==`
      returns as soon as bytes differ, so an attacker who can time responses recovers a token
      byte by byte. Use `hmac.compare_digest` or your platform's equivalent.

      Authentication is who you are; authorisation is what you may do, and broken access
      control — checked on one endpoint, not the next — is consistently the most common
      serious flaw. Add MFA, treat sessions and tokens as bearer credentials with expiry and
      revocation, and express permissions with RBAC or ABAC. Know the classes: injection from
      mixing data into code instead of parameterising, insecure deserialisation, SSRF, path
      traversal and memory-safety bugs, with the OWASP Top Ten as the map. Extend it to your
      supply chain, secret rotation, logging and a rehearsed incident response.

      ### The mistakes people actually make

      - Encrypting passwords instead of hashing them with a KDF, so one key leak exposes
        every account.
      - Reusing a nonce or IV, quietly destroying the confidentiality the cipher promised.
      - Validating a token with `==`, leaking it byte by byte to a patient attacker.
      - Writing a bespoke auth or crypto scheme; it will look fine and fall to a known attack.
      - Enforcing rules only in the client, when anyone can send any request they like.
      - Committing keys to the repository, where they stay in the history forever.

      **What you can do after this:** take a feature handling credentials or user data, name
      its trust boundaries and the property each needs, and choose the primitive — Argon2id,
      HMAC, AES-GCM, a signed short-lived token — that provides it.
