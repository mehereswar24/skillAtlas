        title: OWASP Top Ten
        url: https://owasp.org/www-project-top-ten/
      - kind: doc
        title: 'OWASP Cheat Sheet Series: Password Storage'
        url: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
