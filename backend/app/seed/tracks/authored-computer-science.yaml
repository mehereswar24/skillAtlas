  - slug: computer-science-endianess
    name: Byte Order and Binary Interchange
    domain: computer-science
    est_hours: 3
    difficulty: beginner
    prerequisites:
      - computer-science-representation
    summary: Understand how multi-byte values are ordered in memory, why byte order and struct padding make a raw memory dump an unportable file format, and how to define an explicit wire format instead.
    content_md: |-
      A 32-bit integer occupies four bytes, and the machine has to decide which byte goes at the lowest address. That decision is invisible for the entire life of a value inside one program, and becomes catastrophic the moment the bytes leave — into a file, a socket, shared memory, or a struct mapped over a hardware register. The failure mode is distinctive: the data is not missing or randomly corrupted, it is systematically scrambled, and `1` reads back as `16777216`.

      ### The two orders

      **Little-endian** stores the least significant byte first: `0x12345678` is laid out as `78 56 34 12`. x86-64 and, in their usual configuration, ARM64 and RISC-V are little-endian. **Big-endian** stores the most significant byte first — `12 34 56 78` — which matches how humans write numbers.

      Neither is better. Little-endian makes narrowing a value cheap, because the low byte is already at the base address; big-endian makes a hex dump readable and makes byte-wise comparison of equal-width integers behave like a string comparison. Danny Cohen's 1980 note "On Holy Wars and a Plea for Peace" named the dispute after Swift's Lilliputian egg factions precisely because the choice is arbitrary. You can detect the host order by writing a known value and reading its first byte, or in C++20 by inspecting `std::endian::native`.

      ### Where it becomes visible

      **Network byte order is big-endian** by convention, established in the early IP specifications. That is why the sockets API ships `htons`, `htonl`, `ntohs` and `ntohl` — host-to-network and network-to-host for short and long values. On a little-endian machine they swap bytes; on a big-endian machine they are no-ops. Calling them unconditionally is correct and portable; skipping them because it worked on your machine is a latent bug. The same applies to any file format, memory-mapped device register, or shared-memory region touched by more than one architecture.

      ### Padding: the other reason a struct is not a format

      Even with byte order settled, a C or C++ struct is not a wire format. Compilers insert **padding** so each field lands on its natural alignment — a 4-byte `int` at an address divisible by 4 — because misaligned access is slower or, on some architectures, faulting.

      ```c
      struct S { char a; int b; char c; };  // sizeof is typically 12, not 6
      ```

      Field order changes the size; compiler version, target ABI and packing pragmas change the layout. So `fwrite(&s, sizeof s, 1, f)` writes a format defined by your build, not by any specification.

      ### Serialisation is the fix

      The remedy is to define the bytes explicitly rather than inherit them from memory layout: a documented wire format with fixed-width fields in a declared byte order, written and read field by field, never relying on `sizeof` a struct. In practice you either write that by hand, packing each field with an explicit conversion, or use a schema-driven format such as Protocol Buffers, which defines its own encoding and generates the reading and writing code.

      Text formats such as JSON and CSV sidestep byte order completely, because a number becomes a sequence of characters. You pay in size and parse time, and you inherit character encoding as a different problem instead.

      Two distinctions are worth keeping separate. **Bit order within a byte** is a protocol and documentation convention, not the same thing as byte order within a value. And the UTF-16 **byte order mark** (`U+FEFF` at the start of a stream) is the everyday example of a format that had to solve this explicitly, because its code units are two bytes and the reader needs to know which order they arrived in.

      ### The mistakes people actually make

      **Writing a struct straight to disk.** It reads back fine on the machine that wrote it and produces nonsense on a different architecture, a different compiler, or after someone reorders two fields.

      **Assuming little-endian.** Your code is correct on x86 and on your ARM laptop, and wrong on a big-endian embedded target or against a protocol that specified network order.

      **Reading packet fields without converting.** A port number arrives as `0x5000` instead of `0x0050`, and you spend an afternoon suspecting the network stack.

      **Confusing bit order with byte order.** You try to fix a corrupted integer by reversing bits within each byte, which fixes nothing and makes the symptom stranger.

      **What you can do after this:** define a small binary record format with explicit field widths and a declared byte order, and write reader and writer functions that produce identical bytes on any architecture.
