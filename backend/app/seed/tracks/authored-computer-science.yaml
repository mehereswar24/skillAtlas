  - slug: computer-science-data-structures
    name: Core Data Structures and Their Memory Behaviour
    domain: computer-science
    est_hours: 20
    difficulty: beginner
    prerequisites:
      - computer-science-asymptotic-notation
      - computer-science-memory-management
    summary: |-
      Separate the abstract data type from its implementation, and choose between arrays, linked
      structures, hash tables, heaps and union-find on the basis of both asymptotic cost and how
      each one actually behaves in memory.
    content_md: |-
      A "queue" is a promise: put things in, take them out in the same order. It says nothing about
      speed. A ring buffer and a linked list both keep that promise, and one is several times
      faster on real hardware for reasons that have nothing to do with Big-O. Separating the
      *abstract data type* — the operations and their semantics — from the *implementation* — the
      memory layout that determines cost — is the whole of this subject.

      ### Contiguous memory: arrays and dynamic arrays

      An array is a base address plus a stride, so `a[i]` is a multiply and an add: `O(1)` for any
      i. It is also the only layout the hardware prefetcher can predict — a sequential scan pulls
      whole cache lines (64 bytes on x86-64) and the next line arrives before you ask for it.

      A dynamic array (`std::vector`, Python `list`, Java `ArrayList`) wraps a fixed array with a
      size and a capacity. Append writes at `size` and increments; at capacity you allocate a
      larger block, copy, and free. The growth *factor* — commonly 1.5 to 2 — is what makes append
      `O(1)` amortised. Insert or erase in the middle is `Theta(n)`, though that shift is a single
      fast `memmove`. In C++ the reallocation invalidates every pointer and iterator into the old
      buffer.

      ### Linked structures and their honest reputation

      A node holds a payload and one pointer (singly linked), two (doubly), or wraps around. Given
      a pointer to a node, splicing it in or out is `O(1)` with no shifting — that is the entire
      advantage. Against it: you cannot index, so reaching position k costs `Theta(k)`, and each
      node is a separate allocation, so traversal is pointer chasing with a likely cache miss per
      step. Linked lists are far less useful in practice than their prominence in courses suggests.
      They earn their place when you already hold a stable node handle (an LRU cache is a hash map
      from key to node plus a doubly linked list), or in intrusive kernel structures where the
      links live inside the objects.

      Stack and queue are ADTs, not implementations. A stack over a dynamic array pushes and pops
      at the end: amortised `O(1)` and cache-friendly. A queue over a plain array is wrong if you
      shift on dequeue; use a ring buffer with `head` and `tail` indices modulo capacity, plus a
      spare slot or a count so you can tell full from empty. A deque adds both ends — Python's
      `collections.deque` is a linked list of fixed-size blocks — giving `O(1)` at the front.

      ### Hash tables in depth

      Map a key to a slot with `hash(key) mod m`. A good hash is cheap and spreads similar keys far
      apart; equal keys must hash equally, so a hash may depend only on parts you never mutate.

      **Chaining** stores colliding entries in a per-bucket list: simple, tolerant of a load factor
      above 1, costs an indirection. **Open addressing** keeps everything in the table and probes.
      Linear probing (`i+1`) is the most cache-friendly but forms clusters; quadratic probing breaks
      clusters up; Robin Hood probing displaces entries so no key sits far from its ideal slot while
      another sits close. Deletion here needs tombstones or backward shifting.

      Load factor drives everything: past a threshold — typically 0.7 to 0.9 — you allocate a bigger
      table and rehash, an `O(n)` operation that makes insertion `O(1)` amortised rather than worst
      case. Iteration follows slot order, which follows the hash, so it is not sorted; CPython
      dictionaries preserve insertion order as a language guarantee, but that is a property of that
      implementation, not of hash tables. And if keys come from untrusted input and the hash is
      predictable, an attacker can craft keys that all land in one bucket, turning every lookup into
      `O(n)` — hash flooding, a real denial-of-service vector. The fix is a randomly seeded keyed
      hash such as SipHash. Sets are hash tables without values; multisets keep counts.

      ### Heaps, priority queues and union-find

      A binary heap is a complete binary tree flattened into an array: for index i, children sit at
      `2i+1` and `2i+2`, the parent at `(i-1)/2`. Push appends and sifts up while it beats its
      parent; pop swaps the root with the last element, shrinks, and sifts down. Both are `O(log n)`
      because the height is `floor(log2 n)`. Building a heap by sifting down from the last internal
      node is `O(n)`, not `O(n log n)` — most nodes are near the leaves and travel a short distance.
      A heap gives the extreme element in `O(1)` and no other order at all.

      Union-find keeps a forest of parent pointers. `find` walks to the root; *path compression*
      repoints every node on that walk at the root; *union by rank or size* hangs the smaller tree
      under the larger. With both, operations are amortised inverse-Ackermann — below 5 for any n
      you will meet. Choose from the operation mix: lookup by key wants a hash map; lookup by order
      or range wants a sorted array or balanced tree; "smallest remaining" wants a heap; merging
      groups wants union-find.

      ### The mistakes people actually make

      - Reaching for a linked list because insertion "is `O(1)`". It is `O(1)` *given the node*;
        finding the position is `Theta(n)`, and the shift you avoided was a fast `memmove`.
      - Using a mutable object as a dictionary key and then mutating it. Its hash changes, the entry
        stays in its old bucket, and lookups report it missing while it still occupies space.
      - Assuming dictionary iteration is sorted, so code relying on the order you happened to observe
        breaks after a resize.
      - Choosing a heap when you needed deletion by value or the k-th element. A heap supports
        neither; use an ordered set, or lazy deletion with an "already removed" marker.
      - Holding a pointer or iterator into a vector across an append.

      **What you can do after this:** given a workload described as an operation mix, pick a structure
      and defend it in terms of both asymptotic cost and memory layout, including why the alternative
      you rejected would be slower on real hardware.
