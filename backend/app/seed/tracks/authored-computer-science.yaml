  - slug: computer-science-representation
    name: Representing Numbers in Binary
    domain: computer-science
    est_hours: 8
    difficulty: beginner
    prerequisites:
      - computer-science-how-computers-work
    summary: Understand how integers are encoded in fixed-width binary, why two's complement is universal, and how overflow and implicit conversion produce real bugs, so that you can predict what a numeric expression does rather than trusting it.
    content_md: |-
      Everything in memory is bits. A 64-bit pattern is a number, a pointer, eight characters, a float or an instruction depending entirely on what the type says it is: the bits carry no intrinsic meaning, the type imposes one. Reinterpreting the same bits under a different type is exactly what a cast, a union and a serialisation bug all do.

      The second half of this concept is fixed width. Mathematical integers are unbounded; machine integers are not, and that boundary is where correct-looking arithmetic silently gives the wrong answer.

      ### Positional systems, bits, bytes and words

      Any base works the same way: each digit position carries a weight that is a power of the base. Hex earns its place because one hex digit is exactly four bits, so `0xC3` is `1100 0011` at a glance and a 32-bit value is eight tidy digits; practise converting between decimal, binary and hex until it is mechanical.

      A **bit** is one binary digit, a **byte** is eight bits in practice, and a **word** is the width the machine naturally works in — 64 bits on current CPUs. Types pick a width: 8, 16, 32 or 64 bits. An unsigned n-bit integer represents `0` to `2ⁿ − 1`, so a `uint32` tops out at 4,294,967,295.

      ### Signed integers, and why two's complement won

      Representing negatives needs a convention. **Sign-magnitude** reserves the top bit as a sign — simple to read, but it has two zeros (`+0` and `−0`) and needs different addition circuitry depending on signs. **Ones' complement** negates by flipping every bit; it also has two zeros and needs an end-around carry.

      **Two's complement** negates by flipping every bit and adding one. It wins because there is exactly one zero and, decisively, because addition and subtraction use the *same* adder circuit as unsigned arithmetic — the hardware need not know the operands are signed. Its range, `−2ⁿ⁻¹` to `2ⁿ⁻¹ − 1`, is asymmetric: `INT_MIN` has no positive counterpart, so negating it overflows. Widening a signed value uses **sign extension**, copying the top bit into the new high bits, so `0xFF` as an `int8` (−1) widens to `0xFFFFFFFF`; unsigned values zero-extend.

      ### Overflow, and the bug you will write

      Fixed width means arithmetic is really modulo `2ⁿ`. Unsigned overflow **wraps** and is well defined. Signed overflow is **undefined behaviour** in C and C++, which is not a formality: compilers optimise on the assumption that it never happens, so `if (x + 1 < x)` can be deleted as provably false. Rust panics on overflow in debug builds and wraps in release; Java and Go wrap; Python promotes to arbitrary precision.

      The classic case is binary search:

      ```c
      int mid = (low + high) / 2;        // overflows when low + high > INT_MAX
      int mid = low + (high - low) / 2;  // correct, no intermediate overflow
      ```

      This bug sat in widely used library code for years, because it only triggers on very large arrays. Implicit conversions are equally treacherous: mixed-width operands are promoted, and mixing signed with unsigned converts the signed operand to unsigned, so a comparison against a negative number becomes a comparison against a huge positive one.

      ### Fixed point, money and practical widths

      Not everything fractional needs floating point. **Fixed-point** arithmetic stores a scaled integer — money as an integer number of cents, say — so values are exact and rounding is under your control. Currency in a binary float is a defect, not a style preference.

      Widths are chosen deliberately too: 32-bit signed seconds since 1970 overflow in January 2038, which is why 64-bit time is standard; database IDs outgrow `int32` at about two billion rows; and hashing folds a large space into a fixed width, so collisions are guaranteed by pigeonhole.

      ### The mistakes people actually make

      **"It cannot overflow, the tests passed."** Tests use small values; production uses a three-billion-row table or a millisecond timestamp, and the wrap produces a negative index or a nonsensical duration.

      **Mixing signed and unsigned.** `if (i < vec.size())` with a signed `i` that could be negative compares against an enormous unsigned value and takes the wrong branch.

      **Storing currency in a float.** Cents drift, totals disagree with the sum of their parts, and reconciliation fails in ways no one can reproduce.

      **Assuming `char` is signed.** It is implementation-defined in C and C++; the same code returns different values on x86 and ARM.

      **What you can do after this:** look at a fixed-width arithmetic expression, name the exact input values that make it overflow or convert unexpectedly, and rewrite it to be safe.
