  - slug: computer-science-graphs
    name: Graphs and Graph Algorithms
    domain: computer-science
    est_hours: 20
    difficulty: intermediate
    prerequisites:
      - computer-science-tree
      - computer-science-data-structures
    summary: |-
      Model a problem as vertices and edges, pick a representation that fits its
      density, and apply traversal, shortest-path, spanning-tree and flow algorithms
      while knowing precisely which assumption each one depends on.
    content_md: |-
      Most graph problems are hard for a reason that has nothing to do with graphs:
      the modelling step was skipped. Before any algorithm, answer two questions —
      what is a vertex, and what does an edge mean? In a word ladder a vertex is a
      word and an edge a one-letter change; in a build system a vertex is a target and
      an edge "must be built before". Get that mapping right and the algorithm is
      usually one you already know.

      Trees were the special case: connected, acyclic, n−1 edges. Graphs drop those
      guarantees, which is why traversal needs a visited set and why cycles must be
      detected rather than assumed away.

      ### Representation follows density

      An **adjacency matrix** is a V×V table: O(1) to test "is there an edge u→v", but
      O(V²) memory, unusable at a million vertices. An **adjacency list** stores each
      vertex's neighbours: O(V+E) memory and O(deg u) to enumerate them, which is what
      nearly every algorithm actually does. Use a matrix only for dense or small graphs
      needing edge tests; an **edge list** suffices for Kruskal and Bellman–Ford.

      The fourth option is the one people forget. In an **implicit graph** you build
      nothing — neighbours are computed on demand from the current state. Grid
      movement, sliding-tile puzzles and state-space search are all like this, and
      materialising the adjacency list would exhaust memory.

      ### Traversal, and what each order gives you

      **BFS** uses a queue and visits vertices in non-decreasing distance from the
      source, which is why it yields shortest paths when every edge has the same
      weight. **DFS** uses recursion or an explicit stack, and its discovery and finish
      times classify edges as tree, back, forward or cross. A back edge means a cycle —
      but only in a directed graph; in an undirected graph you must ignore the edge you
      arrived on, or every edge looks like a cycle.

      ```python
      frontier = deque([start]); dist = {start: 0}
      while frontier:
          u = frontier.popleft()
          for v in neighbours(u):          # may be computed, not stored
              if v not in dist:
                  dist[v] = dist[u] + 1    # mark when pushed, never when popped
                  frontier.append(v)
      ```

      **Topological sort** — reverse DFS finish order, or Kahn's repeated removal of
      in-degree-zero vertices — linearises a DAG, which is how build ordering and
      package dependency resolution work. Kahn's version also detects a cycle: if
      fewer than V vertices come out, there is one. Beyond that: connected components
      by repeated traversal, **strongly connected components** via Kosaraju or Tarjan,
      and bridges and articulation points — the single edge or vertex whose removal
      disconnects a network.

      ### Shortest paths, and the assumption each one makes

      **Dijkstra** with a binary heap runs in O((V+E) log V) and is correct only for
      non-negative weights: it finalises a vertex the moment it is popped, on the
      argument that no later path can be shorter — which a negative edge destroys.
      **Bellman–Ford** relaxes every edge V−1 times in O(VE), tolerates negative
      weights, and reports a negative cycle if a V-th pass still improves something.
      **0-1 BFS** handles weights of only 0 and 1 in linear time with a deque, pushing
      zero-weight moves to the front. **Floyd–Warshall** solves all pairs in O(V³) with
      three nested loops. **A\*** adds a heuristic to Dijkstra's priority, staying
      optimal while the heuristic never overestimates.

      ### Spanning trees, flow and matching

      A **minimum spanning tree** connects everything at minimum total weight. Kruskal
      sorts edges and adds any joining two components, using union-find; Prim grows one
      tree, always taking the cheapest edge leaving it. Both rest on the **cut
      property**: for any cut, the lightest crossing edge is in some MST. **Maximum
      flow** pushes units along augmenting paths until none remain, and max-flow
      min-cut equates the answer with the cheapest set of edges separating source from
      sink; bipartite matching is max flow with unit capacities.

      ### The mistakes people actually make

      Running Dijkstra on negative weights and getting a confident wrong answer instead
      of a crash. Using BFS on a weighted graph because it "found a path". Recursive
      DFS on a million-vertex graph, which overflows the stack — rewrite it with an
      explicit stack. Rebuilding the adjacency list inside a loop, turning O(V+E) into
      O(V·E). And marking a vertex visited when it is popped rather than pushed, which
      lets the same vertex enter the queue many times and blow up exponentially.

      **What you can do after this:** take an informal problem, state its vertices and
      edges, choose BFS, Dijkstra, Bellman–Ford or a topological sort, and justify the
      choice by naming the property of the edge weights.
