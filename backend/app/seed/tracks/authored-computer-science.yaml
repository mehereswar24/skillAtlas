  - slug: computer-science-complexity-classes
    name: 'Complexity Classes: P, NP and Beyond'
    domain: computer-science
    est_hours: 10
    difficulty: advanced
    prerequisites:
      - computer-science-theory-of-computation
      - computer-science-asymptotic-notation
    summary: 'Classify problems rather than algorithms: define P and NP precisely, use the certificate view of NP, place L, PSPACE, EXPTIME, BPP and BQP around them, and say what a P vs NP proof would actually settle.'
    content_md: |-
      Complexity theory is about **problems**, not programs. Asymptotic analysis tells you what one algorithm costs; complexity theory asks what the cheapest possible algorithm costs, including ones nobody has invented. That shift is the thing learners most often miss, and it is why "this algorithm is NP" is a category error rather than a slip of the tongue.

      The object of study is the **decision problem**: a yes/no question, formalised as the set of input strings whose answer is yes. Optimisation problems are studied through their decision versions — instead of "what is the smallest vertex cover", ask "is there one of size at most `k`". Nothing important is lost, because binary searching on `k` turns a decision oracle into an optimisation algorithm for a logarithmic factor, and the yes/no form makes the theory uniform.

      ### P, and why the model barely matters

      **P** is the class of decision problems a deterministic Turing machine decides in time polynomial in the input length: sorting, shortest paths, linear programming, primality, matching. A single-tape machine, a multi-tape machine and a random-access machine simulate each other with only polynomial overhead, so the choice of model changes exponents but not membership in P — that robustness is why the theory draws its line at polynomial rather than somewhere sharper.

      The case for polynomial as the tractability boundary is practical: polynomials are closed under composition, so a polynomial subroutine called polynomially often stays polynomial, whereas exponentials do not survive modest input growth. The honest caveat is that n^100 is polynomial and useless while 1.0001^n is exponential and fine at real sizes. P is a structural line, not a promise about your laptop.

      ### NP, certificates and co-NP

      **NP** has an original definition — decidable in polynomial time by a *non-deterministic* machine that branches and accepts if any branch accepts — and an equivalent one that is easier to use. A problem is in NP if every yes-instance has a **certificate**, a short witness a deterministic machine can *verify* in polynomial time. For "is there a vertex cover of size k" the certificate is the vertex set; checking it covers every edge is trivial. NP stands for non-deterministic polynomial, not "not polynomial", and P is contained in NP.

      **co-NP** holds problems whose *no*-instances have short certificates. The asymmetry is real: a satisfiable formula is proved satisfiable by exhibiting an assignment, but proving unsatisfiability needs something like a resolution refutation, and no polynomially short certificate is known in general. Whether NP equals co-NP is open, and separating them would imply P is not NP.

      ### P vs NP, space, and provable hardness

      **P vs NP** asks whether finding is as easy as verifying. It is a Clay Mathematics Institute Millennium Prize Problem. If P equalled NP with a practical algorithm, most public-key cryptography would collapse and much of mathematics — finding proofs rather than checking them — would be automatable. Most researchers expect P is not NP, since thousands of NP-complete problems have resisted polynomial algorithms for over fifty years, though barrier results (relativisation, natural proofs, algebrisation) show why current techniques are unlikely to settle it.

      **L** is logarithmic space, **NL** its non-deterministic form, and **PSPACE** polynomial space, which contains NP because one polynomial tape can be reused to enumerate every certificate. **Savitch's theorem** shows non-determinism buys little space — a non-deterministic machine using `s(n)` space is simulated deterministically in `s(n)^2` — so NPSPACE equals PSPACE, with no such collapse known for time. **EXPTIME** strictly contains P, and this we can prove: the **time hierarchy theorem** shows more time strictly increases what is decidable, by diagonalisation. Some problems provably need more than polynomial time; we just cannot yet show an NP problem is among them.

      ### Randomised and quantum classes

      **BPP** lets a coin-flipping machine err with probability at most 1/3 on every input; repeat and take a majority to drive error down exponentially. **RP** errs on one side only; **ZPP** is always correct in polynomial expected time. Primality sat in these classes for decades via Miller-Rabin before AKS placed it in P in 2002 — a class boundary that actually moved.

      **BQP** is what a quantum computer decides efficiently with bounded error. It contains factoring via Shor's algorithm, which is not known to be NP-complete. There is no evidence quantum computers solve NP-complete problems efficiently; Grover's algorithm gives only a quadratic speedup on unstructured search.

      ### The mistakes people actually make

      Saying "my algorithm is NP". Classes contain problems; algorithms have running times. Reading NP-hard as unsolvable — it is a worst-case classification, and SAT solvers dispatch huge instances daily. Confusing worst case with typical case: random 3-SAT is easy except near a narrow clause-density threshold, and simplex is exponential in the worst case and excellent in practice. And believing quantum computers brute-force NP, which no current evidence supports.

      **What you can do after this:** place a problem in P, NP, co-NP or PSPACE and defend the placement by exhibiting an algorithm or a polynomially checkable certificate.
