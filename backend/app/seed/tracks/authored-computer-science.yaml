  - slug: computer-science-common-algorithms
    name: 'Algorithm Design Techniques: Choosing an Approach'
    domain: computer-science
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - computer-science-dynamic-programming
      - computer-science-greedy-algorithms
      - computer-science-graphs
    summary: 'Turn an unfamiliar problem statement into a justified choice of technique: classify the problem, read the constraints for a target complexity, and test for the structural signals that greedy, DP, divide and conquer, backtracking and graph reductions each require.'
    content_md: |-
      Every algorithm family you have studied came with its problems already attached: dynamic programming on knapsack, greedy on interval scheduling, BFS on unweighted shortest paths. Real problems arrive without the label, written as a paragraph about delivery vans or exam timetables. The hard skill is not implementing Dijkstra — it is recognising that Dijkstra is what the paragraph is asking for. That recognition is not innate intuition; it is a procedure you can run deliberately until it compresses into something that feels like one.

      ### Characterise the problem first

      Name the kind of answer wanted. **Decision**: does a solution exist? **Search**: find one object with a property. **Optimisation**: find the best object under a cost function. **Counting**: how many qualify? **Construction**: build an object with a stated structure.

      The category changes the toolkit. Counting problems often become DP even where the matching search problem is greedy, because no choice is locally optimal when every branch contributes. Optimisation problems frequently convert into a decision problem plus a binary search over the answer. Construction problems want an invariant more than a data structure.

      ### Read the constraints for a target complexity

      The input bounds are a hint left on purpose. Roughly: `n <= 20` admits `2^n` subset enumeration or bitmask DP; `n <= 100` admits O(n^3), so Floyd-Warshall or an interval DP; `n <= 5000` admits O(n^2); 10^5 to 10^6 wants O(n log n), so sorting, a heap or a single traversal; near 10^9 the answer is arithmetic, or a search over the value space rather than the input. Then work backwards: if you need O(n log n) and hold an O(n^2) DP, the question is no longer which technique but which structure removes a factor of `n`.

      ### Test for the structural signal, not the keyword

      - **Greedy** needs a locally optimal choice that provably survives into a global optimum. The test is an exchange argument: take any optimal solution and swap your greedy choice in without making it worse. Without that argument you have a guess that passes the samples.
      - **Divide and conquer** needs independent subproblems whose results combine cheaply.
      - **Dynamic programming** needs optimal substructure *and* overlapping subproblems. Write the recursive brute force; if the same argument tuple recurs, memoise it.
      - **Backtracking** needs a tree-shaped search space plus a cheap test that prunes whole subtrees before you descend.
      - **A graph in disguise** is far more common than it looks. Dependencies, precedence, scheduling, reachability, matching, state machines and "minimum cost to transform X into Y" are nearly always graph problems. Define the node as a complete state and the edge as one legal move with its cost, and the algorithm is off the shelf.

      ### The transformation toolkit

      Most speedups come from moves applied before the main algorithm: **sorting** to expose monotonicity; **prefix sums** for range queries and **difference arrays** for range updates; **two pointers** when a monotone predicate means a pointer never moves backwards; **hashing** for O(1) membership; **a heap** for a running k-best; and **reduction**, restating your problem as one already solved. Binary search on the answer turns a hard optimisation into a repeated easy decision:

      ```python
      lo, hi = 0, 10**9
      while lo < hi:
          mid = (lo + hi) // 2
          if feasible(mid): hi = mid
          else: lo = mid + 1
      # lo is the smallest feasible answer
      ```

      When exact and fast is impossible, **randomised** algorithms are either Monte Carlo (fast, bounded error probability, as in Miller-Rabin) or Las Vegas (always correct, bounded *expected* time, as in randomised quicksort), and **approximation** trades optimality for a proven ratio such as 2 for vertex cover. Either way, write the brute force first — it is the oracle you diff against on small random inputs.

      ### The mistakes people actually make

      Pattern-matching on surface keywords is the big one. "Maximum" does not mean greedy: maximum-sum subarray reads greedy and is a one-line DP. "Shortest" does not always mean Dijkstra; with unit weights BFS is faster and with negative weights Dijkstra is wrong.

      Optimising before you are correct is the second — a clever idea you cannot debug, with nothing to compare against. The third is missing the graph: if the task is reaching a target configuration by legal moves and you are writing nested loops over configurations, you are hand-rolling a breadth-first search badly. The fourth is over-engineering, since when `n <= 2000` and O(n^2) fits, the cleverer solution costs an hour and buys nothing.

      **What you can do after this:** read an unfamiliar problem statement, state its category and its target complexity from the constraints, and justify in two sentences why greedy, DP, divide and conquer, backtracking or a graph reduction fits — before writing any code.
