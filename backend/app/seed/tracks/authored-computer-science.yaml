  - slug: computer-science-tries
    name: Tries and Prefix Structures
    domain: computer-science
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - computer-science-tree
      - computer-science-character-encodings
    summary: |-
      Use a structure keyed by the sequence itself rather than by comparison or hash.
      You will build tries and radix trees, reason about their memory cost per node,
      and recognise the prefix problems where nothing else is competitive.
    content_md: |-
      Hash tables and balanced trees treat a key as an atom: they hash it whole
      or compare it whole. A **trie** does neither. It keys on the *sequence*, one
      symbol at a time, so the path you walk from the root spells the key. Lookup
      therefore costs O(length of the key) and is completely independent of how many
      keys are stored — a million-word dictionary and a ten-word one answer a
      five-character query in the same five steps.

      That independence is not the main attraction. The real payoff is that every key
      sharing a prefix lives in one subtree, so "every word starting with `int`" is
      one descent plus a traversal. A hash table destroys prefix structure by design.
      If your problem contains the word *prefix*, the trie is usually the answer.

      ### The invariant and the node

      A node does not store its own character. The *edge* into it carries the symbol,
      and the node stores a map from next symbol to child, plus a flag or a value.

      ```python
      class Node:
          def __init__(self):
              self.children = {}     # symbol -> Node
              self.is_word = False   # a passed-through prefix is NOT a stored key
      ```

      That `is_word` flag matters more than it looks. Insert `"cart"` and the nodes for
      `c`, `ca`, `car` all exist, but only the last is a key. Storing a value instead
      of a boolean turns the trie into a map.

      ### Representing children is the whole design

      A fixed array of size R per node gives O(1) child access and terrible memory: an
      ASCII trie already burns 128 pointers per node, and this is where the
      character-encoding material bites. Unicode has over a million code points, so an
      "array per alphabet" node is impossible the moment you leave ASCII. The usual
      fixes are to index bytes of the UTF-8 encoding (R = 256, and prefix order still
      matches code-point order because UTF-8 preserves it), a hash map or small sorted
      array per node, or a bitmap of present children plus a packed child array.

      A **compressed trie** — radix tree, or Patricia tree — collapses every chain of
      single-child nodes into one edge labelled with a whole substring. Real
      dictionaries are full of such chains, so this removes most of the nodes and is
      the form to reach for in practice. A **ternary search trie** stores three
      pointers per node — lower, equal, higher — as a middle ground.

      ### Operations

      Insert and search walk the key symbol by symbol, creating nodes on the way for
      insert. Prefix enumeration descends to the prefix node then does a DFS, emitting
      keys in lexicographic order for free. **Longest-prefix match** — walk as deep as
      possible, remembering the deepest key node passed — is what IP routers do per
      packet. Delete is fiddly: clear the flag, then remove a node only if it has no
      children and is not itself a key.

      ### Where a trie earns its keep

      Autocomplete and typeahead. Spell-check, where you run edit distance against the
      trie and prune whole subtrees whose best possible distance already exceeds the
      threshold. IP routing tables. Word games such as Boggle, where you abort a path
      the moment the accumulated string is no longer a prefix of any word.

      **Aho–Corasick** extends a trie of all patterns with *failure links* — each node
      points to the longest proper suffix of its string that is also a node — turning
      the trie into an automaton that finds every occurrence of every pattern in one
      linear pass. **Suffix tries** insert all suffixes of a text and are quadratic in
      size, so real systems use suffix trees or, more often, **suffix arrays with an
      LCP array**, which answer the same queries in a fraction of the memory.

      ### The mistakes people actually make

      Allocating an alphabet-sized array per node and then feeding the trie Unicode
      text, so memory explodes for a structure holding a few thousand words. Reaching
      for a trie when the workload is exact lookups only — a hash table wins on both
      time and memory, and the trie's advantage never gets used. Forgetting the
      end-of-word flag, so `"car"` is reported as stored merely because `"cart"` was
      inserted. And deleting by unlinking nodes without checking that no other key runs
      through them, which quietly removes unrelated words.

      **What you can do after this:** implement a compressed trie with prefix search
      and longest-prefix match, and state the per-node memory cost of your child
      representation before you ship it.
    resources:
      - kind: doc
        title: 'Sedgewick & Wayne: Tries (Algorithms, 4th ed.)'
