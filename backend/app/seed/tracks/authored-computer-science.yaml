  - slug: computer-science-dynamic-programming
    name: Dynamic Programming
    domain: computer-science
    est_hours: 20
    difficulty: intermediate
    prerequisites:
      - computer-science-recursion
      - computer-science-greedy-algorithms
    summary: |-
      Turn exponential recursion into polynomial computation by naming the state and
      reusing subproblems. You will define states, write recurrences, choose top-down
      or bottom-up evaluation, optimise space, and reconstruct the solution itself.
    content_md: |-
      Dynamic programming is recursion plus memory. Stating it that way avoids the
      usual failure mode, which is treating DP as a ritual about filling
      two-dimensional tables. If you can write a correct recursive solution and the
      recursion revisits the same subproblems, you already have a DP; all that remains
      is to stop recomputing them.

      It follows greedy deliberately. Greedy commits to a local choice and never looks
      back; DP is what you need when a locally-worse choice can enable a
      globally-better one, so both branches must be explored — once each, not once per
      path that reaches them.

      ### The two preconditions

      **Overlapping subproblems**: the recursion tree contains the same call many
      times. Naive Fibonacci calls `fib(n-2)` twice, then four times, and so on to 2^n
      calls over only n distinct arguments. **Optimal substructure**: an optimal
      solution is built from optimal solutions to subproblems. Without the first, a
      cache never hits and you have gained nothing; without the second, combining
      optimal parts does not give an optimal whole and the recurrence is simply wrong.

      ### The procedure, in order

      1. **Define the state.** Name the parameters that fully determine a subproblem
         and say in one sentence what the function returns. This step is roughly 80%
         of the work and where nearly every failure originates.
      2. **Write the recurrence** — how a state's answer is composed from smaller
         states.
      3. **Identify base cases**, including the empty and impossible ones.
      4. **Choose an evaluation order** in which every state's dependencies are ready.
      5. Only then, if you want, convert to a table.

      ```python
      @lru_cache(maxsize=None)
      def best(i, cap):                    # state: item index, remaining capacity
          if i == len(w): return 0
          skip = best(i + 1, cap)
          take = v[i] + best(i + 1, cap - w[i]) if w[i] <= cap else 0
          return max(skip, take)
      ```

      ### Top-down or bottom-up

      **Top-down memoisation** keeps the recursion and adds a cache. It is closer to
      the recurrence, easier to get right, and evaluates only reachable states — a real
      saving when the state space is sparse. It costs recursion depth. **Bottom-up
      tabulation** iterates states in dependency order, has no stack risk and a smaller
      constant factor, and enables the space tricks — but you must work out the order
      yourself, and it computes every state whether needed or not.

      **Space optimisation** falls out of the recurrence: if a state only reads the
      previous row, keep two rows, or one row updated in the right direction. Knapsack
      over a fixed capacity becomes a single array iterated downwards.

      **Reconstruction** is separate from evaluation. The table gives you the optimal
      *value*; to get the optimal *choices* either store a parent pointer per state or
      walk backwards from the answer, at each step re-deriving which predecessor could
      have produced it.

      ### The families, with the state made explicit

      **1-D**: Fibonacci and climbing stairs (state: index), house robber (index, plus
      whether the previous was taken), longest increasing subsequence — O(n²) with
      state "LIS ending at i", or O(n log n) with the patience-sorting variant that
      binary-searches a tails array. **Knapsack**: 0/1, unbounded and subset sum, state
      (index, remaining capacity); O(nW) is *pseudo-polynomial*, because W is
      exponential in the bits used to write it. **Grid and string**: path counting,
      edit distance and LCS, state (i, j) over two prefixes. **Interval DP**: matrix
      chain and burst balloons, state (l, r), evaluated by increasing length.
      **Bitmask DP** over subsets, for travelling salesman and assignment. **DP on
      trees**, where children are the subproblems. **Digit DP**, state (position,
      tight flag).

      Complexity is mechanical once the state is fixed: **number of states × cost per
      transition**. Bitmask TSP is 2^n · n states with n transitions each, so
      O(2^n · n²).

      ### The mistakes people actually make

      A state that does not capture everything the recurrence depends on — the code
      runs, the cache hits, and the answers are subtly wrong for inputs where the
      missing parameter mattered. Memoising on a mutable key such as a list, which
      either throws or, worse, caches under a key that later changes. Building the
      cache key inconsistently in two places, so nothing is ever reused and the runtime
      stays exponential. Calling an O(nW) knapsack "polynomial". And opening a
      two-dimensional array before writing the recurrence, which means guessing the
      dimensions of a relationship you have not defined yet.

      **What you can do after this:** state a DP's subproblem in one precise sentence,
      derive its complexity as states × transitions, and convert between the memoised
      and tabulated forms.
