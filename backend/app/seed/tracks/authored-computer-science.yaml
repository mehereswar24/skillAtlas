  - slug: computer-science-searching
    name: Searching and the Discipline of Invariants
    domain: computer-science
    est_hours: 8
    difficulty: beginner
    prerequisites:
      - computer-science-sorting
    summary: |-
      Write binary search correctly the first time by stating its loop invariant, generalise it to
      lower and upper bound, and learn to binary search a monotone predicate over the answer range
      rather than over an array.
    content_md: |-
      Binary search is five lines, and it is famously the algorithm most programmers get wrong on the
      first attempt. Not because the idea is hard — halve the range, repeat — but because the
      correctness lives entirely in the boundaries, and boundaries are what informal reasoning skips.

      The cure is a loop invariant: one sentence true before the loop, preserved by every iteration,
      and strong enough at exit to give the answer. Linear search still has its place — a scan over
      sixteen contiguous elements beats a branchy binary search on cache behaviour alone, and sorting
      first costs `Theta(n log n)` to save `Theta(n)` per query, so it only pays across many queries.

      ### Binary search as an invariant

      The precondition is not really "sorted". It is that the predicate you are testing is *monotone*
      along the range: false, false, ..., false, true, true. Sortedness is the special case where the
      predicate is `a[i] >= x`. Use half-open bounds and hold this invariant: the answer lies in
      `[lo, hi)` — everything before `lo` fails the predicate, everything from `hi` on satisfies it.

      ```python
      lo, hi = 0, len(a)              # invariant: answer lies in [lo, hi)
      while lo < hi:
          mid = lo + (hi - lo) // 2   # overflow-safe in fixed-width languages
          if a[mid] < x:
              lo = mid + 1            # a[mid] fails, so the answer is after it
          else:
              hi = mid                # a[mid] may be the answer, so keep it
      return lo
      ```

      Termination: `hi - lo` strictly decreases every iteration, because `mid < hi` always holds and
      either `lo` moves past `mid` or `hi` drops to `mid`. Check that explicitly — it is the property
      an infinite loop violates. The four decisions here — inclusive or exclusive `hi`, `<` or `<=` in
      the condition, and whether each branch uses `mid`, `mid + 1` or `mid - 1` — are not stylistic;
      most combinations are off-by-one or non-terminating. In C, C++, Java or Rust with 32-bit indices,
      `(lo + hi) / 2` overflows past about 2^30 elements: a real bug in the JDK's `Arrays.binarySearch`,
      fixed in 2006.

      ### Lower bound and upper bound

      The loop above computes `lower_bound`: the first index whose element is at least x, which is also
      the insertion point that preserves order. Change `<` to `<=` and you get `upper_bound`, the first
      index strictly greater than x. Together they bracket every copy of x, so its count is
      `upper - lower`, and x is present exactly when `lower < len(a) and a[lower] == x`. These answer
      the questions you actually have — how many fall below a threshold, what is the next larger value,
      which records share a key. Python's `bisect_left`/`bisect_right` and C++'s `std::lower_bound`,
      `std::upper_bound` and `std::equal_range` are exactly these.

      ### Binary search on the answer

      The generalisation that turns binary search from a lookup into a solving technique. If you can
      write a predicate `feasible(v)` that is monotone in v — once true, true for every larger v — you
      can binary search the *value range* instead of an array, converting "find the smallest v that
      works" from an optimisation problem into a search problem.

      The recipe: bound the answer in `[lo, hi]`; write `feasible(v)` as a straightforward simulation or
      greedy check; argue monotonicity, usually "more capacity, time or budget cannot hurt"; run the
      same loop. Cost is `O(log(range) * cost of feasible)`. It fits a family: the minimum ship capacity
      that moves all packages within D days (feasibility is a greedy fill of days, counting them); the
      minimum time for k workers to finish; allocating pages among students to minimise the largest
      load; the smallest possible largest subarray sum when splitting into k parts. Over real numbers,
      iterate a fixed number of times or until the interval falls below a tolerance, never until
      equality.

      ### Variants, and searching versus hashing

      *Ternary search*: on a strictly unimodal function, evaluate at two interior points and discard the
      outer third that cannot contain the extremum — wrong on monotone or plateaued functions.
      *Exponential (galloping) search*: when the range is unbounded or the target is near the start,
      probe indices 1, 2, 4, 8, ... until you overshoot, then binary search that bracket, `O(log i)` for
      a target at index i. *Interpolation search*: guess the position by interpolating over key values,
      `O(log log n)` expected on uniformly distributed numeric keys but `Theta(n)` when skewed.

      A hash lookup is `O(1)` expected — one hash plus a likely cache miss. A binary search is `O(log n)`
      branches over memory that, for a few hundred elements, is entirely in cache, so a sorted array often
      wins at small sizes. Hash tables lose whenever you need order: predecessor and successor, ranges,
      minimum and maximum, sorted iteration. The discipline transfers too: searching a BST is binary search
      with pointers instead of indices, searching a rotated sorted array decides at each step which half is
      sorted and whether the target lies inside it, and searching a row- and column-sorted matrix is a
      staircase walk from a corner.

      ### The mistakes people actually make

      - `(lo + hi) / 2` overflowing a fixed-width integer on a large array.
      - A loop where neither bound moves on some branch — typically `lo = mid` with a midpoint that rounds
        down — so it spins forever. Always confirm the interval shrinks.
      - Binary searching data not sorted by the key being compared, or a predicate that is not monotone.
        You get a plausible wrong answer and no error.
      - Returning on the first match when duplicates exist, landing arbitrarily inside the run instead of
        at its start or end. Use lower or upper bound.
      - Assuming a hash lookup is always faster, giving up ordering for no gain.

      **What you can do after this:** write a binary search that is correct on the first attempt by stating
      its invariant, and recognise an optimisation problem that can be solved by binary searching a
      monotone predicate over the answer.
