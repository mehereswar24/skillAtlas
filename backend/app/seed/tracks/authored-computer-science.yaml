  - slug: computer-science-basic-math-skills
    name: Discrete Mathematics for Computing
    domain: computer-science
    est_hours: 16
    difficulty: beginner
    prerequisites: []
    summary: Build the logic, proof, counting and probability toolkit that asymptotic analysis, correctness arguments, hashing and randomised algorithms all rest on, so that you can prove a loop correct rather than testing it and hoping.
    content_md: |-
      Discrete mathematics sits at the front of this track rather than the end, because everything downstream assumes it. Big-O is a statement about limits. "This loop is correct" is an induction proof. "The hash table is O(1) on average" is a probability calculation. "This cipher is hard to break" is number theory. Skip the maths and you can still write code, but you cannot *justify* any of it.

      The amount you need is bounded. This is not a mathematics degree; it is a specific toolkit, and sixteen focused hours gets you most of the way.

      ### Logic: implication is not symmetric

      Start with propositional logic — `and`, `or`, `not`, implication, biconditional — and truth tables. Then predicate logic: `∀` (for all), `∃` (there exists), and how quantifiers interact. "For every input there exists a bound" and "there exists a bound for every input" are different claims, and the second is stronger.

      The habit that pays most is separating an implication from its converse and its contrapositive. *If P then Q* is equivalent to *if not Q then not P* and is **not** equivalent to *if Q then P*. Confusing them is the commonest reasoning error in proofs and in code review: "sorted arrays support binary search" does not mean "if binary search worked, the array was sorted".

      ### Sets, relations and functions

      Sets, subsets, union, intersection, difference, power sets, Cartesian products and cardinality. Then relations and their properties — reflexive, symmetric, transitive — which combine into **equivalence relations**, whose equivalence classes formalise "these two are the same for our purposes", and **partial orders**, the basis of topological sort and dependency graphs. Functions as a special kind of relation: injective (no collisions), surjective (covers the codomain), bijective (hence invertible). Hash functions are deliberately non-injective, which is why collisions exist.

      ### Proof, and induction above all

      Learn direct proof, contrapositive and contradiction, then spend most of your time on **induction**: prove a base case, assume the statement for `n`, prove it for `n + 1`. **Strong induction** assumes it for all values up to `n`, which is what you need when a recursion splits a problem in half rather than shrinking it by one.

      Induction is not an abstract exercise. It is the tool for proving a loop correct via a loop invariant — state a property true before the loop, show each iteration preserves it, and show that the invariant plus the termination condition gives the result you wanted. Every recursive algorithm's correctness proof is an induction on input size.

      ### Counting and discrete probability

      The product and sum rules, permutations and combinations, the binomial coefficient, the **pigeonhole principle** (n+1 items in n boxes force a collision, which is why a fixed-width hash must collide) and inclusion–exclusion.

      Then probability: sample spaces, conditional probability, independence, Bayes' theorem, random variables, expectation, and above all **linearity of expectation**, which holds even for dependent variables and turns hard counting arguments into one-line calculations. That is the machinery behind expected O(1) hash lookup, randomised quicksort, skip lists and Bloom filter false-positive rates.

      ### Number theory, logs and recurrences

      Modular arithmetic and congruences; gcd and Euclid's algorithm, your first non-obvious algorithm; primes, and why factoring being hard while multiplication is easy underpins RSA. Logarithms: `log(ab) = log a + log b`, change of base, and why the base is irrelevant inside Big-O, since changing it multiplies by a constant. Recurrence relations, so you can turn `T(n) = 2T(n/2) + n` into `Θ(n log n)`. Finally graph vocabulary — vertices, edges, degree, path, cycle, connectivity, trees, bipartiteness.

      ### The mistakes people actually make

      **Proving the converse.** You set out to show "if the array is sorted, the algorithm returns the right index" and instead show "if it returned the right index, the array was sorted". Valid, and useless.

      **Assuming independence.** You multiply probabilities for correlated events — two servers failing, two keys colliding under a bad hash — and get a reassuring number that badly understates the risk.

      **A circular inductive step.** You "prove" `P(n+1)` in a way that quietly uses `P(n+1)`, or you forget the base case. Both produce proofs of false statements.

      **Treating tests as proof.** Passing cases confirm the absence of the bugs you thought of; an invariant argument covers the ones you did not.

      **What you can do after this:** write a loop invariant for a binary search and use induction to prove the loop terminates and returns the correct index, without appealing to test cases.
