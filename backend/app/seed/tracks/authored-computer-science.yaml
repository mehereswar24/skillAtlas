  - slug: computer-science-processes-and-threads
    name: Processes, Threads and Concurrency
    domain: computer-science
    est_hours: 18
    difficulty: intermediate
    prerequisites:
      - computer-science-memory-management
      - computer-science-how-computers-work
    summary: |-
      Explain how an operating system manufactures the illusion that every program owns the
      machine, use processes, threads, locks and async I/O deliberately, and diagnose
      whether a stalled program is deadlocked, racing or thrashing.
    content_md: |-
      Everything so far assumed your program owns the machine: one address space, one
      instruction stream, memory nobody else touches. That illusion is manufactured by the
      kernel, which also decides how fast your program runs and what happens when two
      threads touch the same variable at once.

      It belongs here rather than at the end of a roadmap because networking, databases and
      system design all rest on it.

      ### The kernel boundary and processes

      The kernel runs in a privileged CPU mode with access to page tables and device
      registers; your code runs in user mode and cannot. The only way across is a *system
      call*: a trap that switches mode, runs a kernel entry point and returns. It costs real
      time, which is why buffered I/O exists.

      A process is an address space plus the kernel's bookkeeping — the process control
      block, holding the pid, saved registers, memory map, open files and state (running,
      ready, blocked). `fork` duplicates the caller, `exec` replaces its image. Address-space
      isolation is enforced by hardware and is your security boundary.

      ### Threads and scheduling

      A thread is a second instruction stream sharing the address space, with its own stack
      and registers. Creation is cheap because page tables are reused, and that sharing is
      why threads corrupt each other. Kernel threads are scheduled by the OS; green threads
      and coroutines are multiplexed onto them by a runtime, cheaper still, but one blocking
      call can stall many.

      The scheduler preempts on a timer, saves registers and restores another thread's; the
      switch is cheap, but losing the warm cache and TLB is not. CFS-style schedulers hand
      out proportional CPU time weighted by priority. CPU-bound work wants about one runnable
      thread per core; I/O-bound work sits blocked, so thousands of tasks are fine.

      ### Virtual memory

      Every address your code uses is virtual. The MMU walks a multi-level page table to
      translate it, caching translations in the TLB. A reference to a non-resident page
      raises a *page fault* and the kernel fetches it — demand paging. When the working set
      exceeds RAM, pages swap to disk and the machine thrashes: throughput collapses while
      the CPU idles. `fork` is cheap because it copies no memory — both processes share pages
      read-only and the first write faults and copies that page, which is copy-on-write.
      `mmap` uses the same machinery to make a file behave like an array.

      ### Races, locks and memory models

      Concurrency is structuring work as independent tasks; parallelism is running them at
      once — genuinely different ideas.

      `x++` is a load, an add and a store; interleave two threads and an increment vanishes.
      A *critical section* must not interleave. A mutex enforces that by sleeping, a spinlock
      by burning CPU, a semaphore counts permits, a condition variable waits for a predicate,
      a read-write lock admits many readers or one writer, a barrier holds everyone until the
      slowest arrives.

      Deadlock needs all four Coffman conditions — mutual exclusion, hold-and-wait, no
      preemption, circular wait — so the cure is taking locks in one global order. Livelock
      is busy non-progress, starvation is never being scheduled, priority inversion is a
      low-priority lock holder blocking a high-priority thread.

      Beneath locks sit atomics and compare-and-swap, which lock-free structures build on.
      Compilers and CPUs reorder, and cores see each other's writes only through cache
      coherence, so a *memory model* states what is guaranteed; you claim it with atomics
      using an explicit ordering (acquire/release, or sequentially consistent) or with
      barriers. Java's `volatile` gives visibility and ordering; C's does not.

      The alternative to shared memory is messages: pipes, sockets, signals and shared memory
      between processes; actors; CSP-style channels; or an event loop that never blocks,
      asking the kernel which descriptors are ready (`epoll`, `kqueue`, `io_uring`).

      ### The mistakes people actually make

      - Believing a read-modify-write is atomic. `counter += 1` from many threads loses
        updates, and single-threaded tests never show it.
      - Adding threads to an I/O-bound workload and gaining nothing: the bottleneck was never
        the CPU.
      - Holding a lock across a blocking call, which turns a concurrent server serial.
      - Double-checked locking without an atomic flag, so another thread sees a non-null
        pointer to a half-constructed object.
      - Testing concurrency on one machine and calling it correct; another core count exposes
        the race in production.

      **What you can do after this:** take a program that hangs or corrupts data under load
      and say which failure it is — a lock-ordering deadlock, a data race, or a pool starved
      by blocking I/O — and fix it with the right primitive.
