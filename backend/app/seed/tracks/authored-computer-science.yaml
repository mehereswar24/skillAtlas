  - slug: computer-science-tree
    name: Trees, Traversals and Binary Search Trees
    domain: computer-science
    est_hours: 12
    difficulty: intermediate
    prerequisites:
      - computer-science-recursion
    summary: |-
      Work with trees precisely: the height-to-node-count relationship that makes O(log n) possible,
      the four traversals and what each is for, reconstruction from traversals, and binary search
      trees including delete and the way they degenerate.
    content_md: |-
      A tree is a connected acyclic graph — the definition you will meet again in graph theory. Choosing
      one vertex as the root and orienting every edge away from it gives you parents, children, and the
      recursive shape you already know: a tree is a node plus a list of trees. Most tree algorithms are
      three lines — handle the node, recurse left, recurse right — and most tree bugs are a missing base
      case or a broken invariant.

      ### Vocabulary and the height bound

      The *root* has no parent; *leaves* have no children. The *depth* of a node is the number of edges
      from the root; its *height* is the longest downward path to a leaf, and the tree's height is the
      root's. *Ancestors* lie on the path to the root, and the *subtree* of v is v plus all its
      descendants. A tree with n nodes has exactly n-1 edges.

      A binary tree gives each node at most two children, distinguished as left and right. It is *full*
      when every node has zero or two children, *complete* when every level is filled except possibly the
      last, which fills left to right, and *perfect* when all leaves share a depth, giving
      `n = 2^(h+1) - 1`. That identity is the point: a binary tree of height h holds at most
      `2^(h+1) - 1` nodes, so `h >= ceil(log2(n+1)) - 1`. Height is at least logarithmic, and *exactly*
      logarithmic only when the tree is balanced. Every "O(log n)" claim about a tree is really a claim
      about its height, and it is false the moment the tree degenerates.

      ### Representations

      Node objects with `left` and `right` pointers are general: one allocation per node, with the pointer
      chasing that comes with it. Array embedding suits complete trees — node i has children at `2i+1` and
      `2i+2` and parent at `(i-1)/2` — with no pointers and perfect locality, which is exactly how a binary
      heap is stored. A sparse tree stored that way wastes space exponentially. For n-ary trees, store a
      child list per node, or first-child/next-sibling pointers to keep nodes a fixed size.

      ### The four traversals, and what each is for

      The depth-first traversals differ only in when the node is visited relative to its subtrees.

      - **Preorder** (node, left, right): visit before descending. Use it to copy or serialise a tree, and
        whenever a value must be computed at a node and passed *down* to its children.
      - **Inorder** (left, node, right): on a binary search tree this emits the keys in sorted order, which
        is its reason for existing.
      - **Postorder** (left, right, node): children first. Use it to free or delete nodes, to compute a
        value *upward* from children (heights, subtree sums), and to evaluate an expression tree.
      - **Level-order** (breadth-first): a queue, not a stack. Enqueue the root, then repeatedly dequeue a
        node and enqueue its children. Use it for shortest-hop distance and for printing by depth — capture
        the queue's size before each level to keep levels separate. It is the direct precursor to graph BFS.

      Iterative forms replace the call stack with an explicit one: preorder pushes right before left;
      inorder pushes the left spine, pops, then moves right. Every traversal is `Theta(n)`; the recursive
      form additionally costs `O(h)` stack.

      ### Reconstruction, and why one traversal is not enough

      Inorder alone does not determine a tree — many shapes produce the same sequence. Preorder alone does
      not either, unless you record the null children. Preorder plus inorder does: the first preorder
      element is the root, its position in the inorder sequence splits the rest into left and right subtree
      elements, and you recurse. Postorder plus inorder works the same from the end. Preorder plus postorder
      does *not* determine a general binary tree, though it does for full ones. Each traversal is a
      projection; you need two independent ones to recover the structure.

      ### Binary search trees

      The invariant: for every node, every key in its left subtree is smaller and every key in its right
      subtree is larger. Note "every key in the subtree", not "the immediate children".

      Search compares and descends, `O(h)`. Insert searches until it falls off the tree and attaches there.
      Delete has three cases: a leaf is removed outright; a node with one child is replaced by that child; a
      node with two children is replaced by its inorder successor — the leftmost node of its right subtree —
      by copying that successor's key up and deleting the successor, which by construction has at most one
      child. Predecessor and successor follow the same logic. A range query over `[lo, hi]` is an inorder
      walk that prunes — do not descend left when the node's key is below lo, nor right when above hi.

      Then the failure. Insert 1, 2, 3, 4, 5 in order and every node becomes a right child: a linked list
      with an extra pointer per node, height n, every operation `Theta(n)`. Sorted input is common in
      practice, not pathological, which is precisely why self-balancing trees exist. The same shape recurs
      elsewhere: expression trees evaluated in postorder, tries where the path spells the key, heaps as
      array-embedded complete trees, n-ary trees for file systems and the DOM, and B-trees whose fan-out is
      chosen so one node fills one page of storage.

      ### The mistakes people actually make

      - Assuming a BST is balanced. The complexity table says `O(log n)`; an unbalanced BST gives `O(n)` and
        issues no warning.
      - A delete that loses a subtree: replacing a two-child node with one of its children instead of its
        successor silently discards the other side, and since the tree still traverses cleanly, the bug
        surfaces as missing data much later.
      - Recursing over a degenerate tree of a million nodes and overflowing the stack.
      - Confusing height with depth, and disagreeing with yourself about whether a single node has height 0
        or 1. Pick a convention and state it — an off-by-one here quietly breaks balance checks.
      - Validating a BST by checking only `left.key < node.key < right.key`. That accepts trees that are not
        BSTs; carry an inherited `(min, max)` range down the recursion instead.

      **What you can do after this:** implement and trace all four traversals in both recursive and iterative
      form, reconstruct a tree from two traversals, and explain precisely why an unbalanced BST loses its
      logarithmic guarantee.
    resources:
      - kind: doc
        title: 'Algorithms, 4th Edition: Binary Search Trees'
        url: https://algs4.cs.princeton.edu/32bst/
      - kind: doc
        title: 'Algorithms, 4th Edition: Balanced Search Trees'
        url: https://algs4.cs.princeton.edu/33balanced/
