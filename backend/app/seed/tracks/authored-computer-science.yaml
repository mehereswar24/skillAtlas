  - slug: computer-science-caches
    name: 'Caching: From Cache Lines to CDNs'
    domain: computer-science
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - computer-science-how-computers-work
      - computer-science-data-structures
    summary: |-
      Recognise caching as one mechanism repeated at every layer, write memory layouts the
      CPU cache likes, and choose eviction, TTL and invalidation strategies while reasoning
      about hit ratio, staleness and stampedes.
    content_md: |-
      A CPU retires several instructions per nanosecond; a DRAM fetch costs on the order of a
      hundred, and a round trip across an ocean costs a hundred million. Fast storage is
      small and expensive; large storage is far away. Every system answers the gap the same
      way: keep a copy of what you will probably want next somewhere closer.

      The same idea is the L1 cache, the OS page cache, an in-process map, Redis in front of
      a database and a CDN in front of your origin. It works only because programs show
      *locality*: temporal (the same address again soon) and spatial (a nearby one).

      ### How a hardware cache works

      Memory is divided into cache lines, typically 64 bytes. An address splits into an
      offset within the line, an index selecting a *set*, and a tag compared against the
      lines in that set. Direct-mapped caches give each line one home; fully associative
      caches allow any slot but are costly to search; real caches are set-associative with a
      few ways per set. Writes are write-through or write-back (marked dirty, flushed on
      eviction). Misses are compulsory, capacity or conflict — the last meaning the set was
      full though the cache was not. Prefetchers follow strided access. Across cores, a
      coherence protocol such as MESI marks each line Modified, Exclusive, Shared or Invalid,
      so a core takes exclusive ownership before writing.

      ### What that means for code you write

      Traverse a 2-D array in storage order and every line you fetch is fully used; traverse
      it the other way and you may use eight bytes of each 64.

      ```c
      for (i...) for (j...) s += a[i][j]; /* row-major: sequential, fast */
      for (j...) for (i...) s += a[i][j]; /* strided: one useful word per line */
      ```

      Prefer struct-of-arrays to array-of-structs when a loop reads one field. Watch for
      *false sharing*: two threads writing different variables on one line bounce ownership
      between cores and can lose to a single thread. It is also why an array beats a linked
      list at identical asymptotics — pointer chasing has no spatial locality.

      ### Application caches: keys, hit ratio, eviction

      Higher up you choose what to cache. The key must capture every input the value depends
      on, including the user when the value is user-specific. Hit ratio decides whether the
      cache earned its complexity: at 50% you bought half the saving and all of the
      correctness risk, because a cache trades staleness for latency.

      Bounded size forces eviction. LRU is the default, with the classic O(1) implementation:
      a hash map to nodes of a doubly linked list, move-to-front on access, evict the tail.
      LFU keeps hot items but adapts badly to shifting workloads; FIFO and random are cheap
      and competitive; ARC and W-TinyLFU adapt by blending recency with frequency.

      ### Invalidation and the named failure modes

      TTLs bound staleness without your knowing when data changed. Write-through updates
      cache and store together, write-behind buffers writes and risks loss, write-around
      writes only the store, and explicit invalidation deletes on change and is easiest to
      get subtly wrong.

      *Cache stampede*: a hot key expires and a thousand concurrent misses hit the origin —
      fix it with request coalescing so one caller recomputes while the rest wait, jittered
      TTLs, or serving stale while refreshing. *Cache penetration*: lookups for keys that do
      not exist and so never populate; a Bloom filter, a bit array with k hashes and no false
      negatives, answers "definitely absent" in a few bits per key. *Cold start*: a fresh
      instance has an empty cache and cannot take full load.

      Redis and Memcached move the cache out of process; consistent hashing spreads keys so
      adding a node relocates roughly 1/n. At the edge, CDNs obey `Cache-Control`, revalidate
      with `ETag` and hide refresh latency with `stale-while-revalidate`.

      ### The mistakes people actually make

      - Shipping a cache without measuring hit ratio, so nobody can say whether it helps.
      - An unbounded in-process cache that grows until the process is OOM-killed.
      - Identical TTLs everywhere, so the whole cache expires together and stampedes.
      - Caching a personalised response under a shared key, serving one user's data to
        another.
      - Treating invalidation as a later problem, then debugging "stale for exactly one hour"
        for a week.

      **What you can do after this:** look at a slow path and say whether the win is a better
      memory layout, an application cache with a stated key, TTL and eviction policy, or an
      edge cache — and state the hit ratio that would justify it.
