    est_hours: 18
    difficulty: intermediate
    prerequisites:
      - computer-science-balanced-search-trees
      - computer-science-caches
    summary: |-
      Design a normalised schema, choose indexes by reading real query plans, pick an
      isolation level knowing exactly which anomalies it permits, and explain how MVCC and
      the write-ahead log deliver durable transactions.
    content_md: |-
      A database is not a mysterious box you send strings to. It is the material of the
      previous concepts assembled into one system: B+ trees over disk pages, a buffer pool
      that is a cache, locks and versions for concurrency, and a log for crash recovery, with
      a declarative language on top. Seen that way, "why is this query slow?" and "why did
      this update disappear?" become answerable rather than mystical.

      ### The relational model and normalisation

      A relation is a set of tuples over named, typed attributes. A candidate key is a
      minimal set of attributes identifying a tuple; you promote one to primary key, and a
      foreign key references another relation's key so the engine can refuse dangling rows.
      Constraints are invariants enforced even when your application has a bug. Underneath
      SQL sits relational algebra — selection, projection, join, aggregation — which is why
      the planner may legally rewrite your query into a different shape.

      Normalisation uses functional dependencies to make each fact live in one place. 1NF:
      atomic values. 2NF: no non-key attribute depends on part of a composite key. 3NF: no
      non-key attribute depends on another non-key attribute. BCNF tightens 3NF so every
      determinant is a candidate key. Redundancy is what lets a row disagree with itself.
      Denormalise deliberately when reads dominate, but own the cost of keeping copies in
      step. Past basic SQL, learn join semantics precisely (including what `NULL` does),
      `GROUP BY` with `HAVING`, when a subquery and a join differ, window functions, and CTEs.

      ### Storage and indexing

      Data lives in fixed-size pages, and the *buffer pool* caches hot pages — the eviction
      and hit-ratio reasoning you already have. Row-oriented storage keeps a tuple together
      and suits transactional work; column-oriented storage keeps one attribute contiguous,
      compresses far better and suits analytics scanning two columns of forty.

      The workhorse index is a B+ tree: values in the leaves, leaves linked for range scans,
      and a fan-out of hundreds per page so a billion rows sit three or four levels deep. A
      clustered index stores rows in index order, so there is only one; secondary indexes
      store a key and may need a second lookup. A composite index on `(a, b, c)` serves `a`,
      then `a, b`, then all three — the leftmost-prefix rule — not `b` alone. A covering index
      holds every column the query needs, so the table is never touched. Hash indexes give
      equality and no ranges. Every index is another structure to update on write.

      ### Query planning

      You declare what you want; the planner decides how. It uses statistics to estimate how
      many rows each predicate keeps, then costs access methods (sequential, index, index-only
      scan) and join algorithms (nested loop, hash, merge). `EXPLAIN` shows the plan;
      `EXPLAIN ANALYZE` runs it and shows actual rows beside estimates. A large gap between
      the two is the usual cause of a bad plan, and normally means stale statistics, an unseen
      correlation, or a predicate the planner cannot use — such as a function wrapped around
      an indexed column.

      ### Transactions, and what other models trade away

      ACID: atomicity, consistency, isolation, durability. Isolation is a dial and each
      setting permits named anomalies. Read uncommitted allows dirty reads; read committed
      allows non-repeatable reads, where the same row read twice differs; repeatable read can
      allow phantoms, rows appearing in a repeated range query; serializable forbids all of
      it. Snapshot isolation gives a consistent view yet permits *write skew*, where two
      transactions each check a condition, each write a different row, and jointly break an
      invariant neither violated alone — so it is not serialisable.

      Two-phase locking takes locks in a growing phase and releases after commit. MVCC instead
      keeps multiple row versions so readers never block writers, as PostgreSQL and InnoDB do.
      Lock waits form cycles, so engines detect deadlock and abort a victim; your code must
      retry. Durability comes from the write-ahead log: the change is flushed to the log
      before the data page, so recovery replays committed work and rolls back the rest.

      Other models each drop something: key-value drops query flexibility, document drops
      schema enforcement, wide-column restricts queries to gain write throughput, graph makes
      traversals first-class, time-series exploits append-only ordering, search engines build
      inverted indexes. Asynchronous replication is fast but lags, so read-your-writes must be
      designed for. Pool connections; they are expensive.

      ### The mistakes people actually make

      - The ORM N+1: one query for a list, then one per row. It looks fine on ten rows.
      - Indexing every column, then wondering why writes and bulk loads crawl.
      - `SELECT *` over a wide table, defeating covering indexes and moving unused bytes.
      - Reading at read committed and assuming two reads in one transaction agree.
      - Storing money as a float and watching totals drift; use decimal or integer minor units.
      - Adding an index on a hunch instead of reading `EXPLAIN ANALYZE` first.

      **What you can do after this:** take a slow endpoint, read its `EXPLAIN ANALYZE` output,
      say whether the fix is a composite or covering index, a rewritten predicate, refreshed
      statistics or a schema change — and name the isolation level the write path needs.
