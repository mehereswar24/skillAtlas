  - slug: computer-science-networking
    name: Computer Networking
    domain: computer-science
    est_hours: 16
    difficulty: intermediate
    prerequisites:
      - computer-science-processes-and-threads
    summary: |-
      Trace what actually happens between a hostname and returned bytes, explain the
      mechanisms behind IP, TCP, DNS, HTTP and TLS, and diagnose real network faults using
      the round trip as your unit of cost.
    content_md: |-
      Nobody designs a network end to end. Layering makes one possible: each layer offers a
      narrow service upward and treats the one below as a black box, so Ethernet can be
      swapped for Wi-Fi without HTTP noticing. Encapsulation is how that shows on the wire —
      your payload gains a TCP header, then an IP header, then a frame header going down, and
      sheds them going up. The OSI seven layers are vocabulary; the four-layer TCP/IP model
      is what runs.

      ### Getting a packet to the right machine

      On the link layer a frame carries MAC addresses one hop; a switch learns which MAC is
      on which port, and ARP finds the MAC for a local IP.

      The network layer adds global addressing. An IPv4 address is 32 bits with a CIDR
      prefix: `10.0.5.0/24` fixes the first 24 bits as the network, leaving 254 usable hosts,
      and `/26` splits that into four subnets of 62. IPv6 uses 128 bits and ends the
      scarcity. Routers forward by longest prefix match; between organisations BGP advertises
      which prefixes each network can reach, policy-driven and famously fragile. NAT maps
      private addresses onto one public address, breaking the end-to-end model, which is why
      inbound connections need port forwarding or hole punching. ICMP carries errors: `ping`
      uses echo request and reply, and `traceroute` raises the TTL packet by packet so each
      router in turn answers "time exceeded".

      ### TCP: reliability on an unreliable network

      UDP adds ports and a checksum to IP and hands you datagrams that may be lost,
      duplicated or reordered. TCP builds an ordered byte stream on the same substrate.

      A connection opens with the three-way handshake (SYN, SYN-ACK, ACK), costing a round
      trip before any data. Bytes are sequenced and the receiver cumulatively acknowledges
      what it has in order; unacknowledged data is resent after a retransmission timeout
      derived from measured RTT, or sooner by fast retransmit on duplicate ACKs. Flow control
      is the receiver's advertised window. Congestion control protects the network: slow
      start grows the window exponentially, congestion avoidance linearly, loss shrinks it.
      CUBIC is the common default; BBR models bottleneck bandwidth and RTT rather than
      treating loss as the only signal. Because delivery is ordered, one lost segment blocks
      everything behind it — head-of-line blocking. Nagle's algorithm coalesces small writes
      and can add latency. The closing side waits in TIME_WAIT so stray segments cannot
      corrupt a new connection.

      ### Names, requests and encryption

      DNS turns a name into an address. A stub resolver asks a recursive resolver, which
      walks iteratively from root to TLD to authoritative server, caching each answer for its
      TTL — which is why a change is not visible everywhere at once. `A` and `AAAA` hold
      addresses, `CNAME` aliases, `MX` mail; DNSSEC signs records so forgery is detectable.

      HTTP/1.1 added keep-alive; pipelining failed because responses had to return in order.
      HTTP/2 multiplexes streams over one connection and compresses headers with HPACK, but a
      TCP loss stalls every stream. HTTP/3 runs over QUIC on UDP, which implements streams
      itself, so a lost packet stalls only its own stream, and folds the TLS handshake into
      setup. WebSockets give bidirectional frames; gRPC layers RPC over HTTP/2.

      TLS gives confidentiality, integrity and server authenticity: the handshake agrees a
      cipher suite, the server presents a certificate chaining to a trusted root, and both
      sides derive session keys. It does not hide who you talk to — destination IP and often
      SNI are visible, and sizes and timing leak more than expected. Sockets are the API,
      blocking or non-blocking.

      ### Latency is the budget

      Bandwidth is width; latency is trip time, bounded by the speed of light. The
      bandwidth-delay product is the data in flight needed to keep a link busy. Perceived
      speed is round trips — DNS, TCP, TLS — before one byte of content. Diagnose with `dig`,
      `curl -v`, `ss` and Wireshark.

      ### The mistakes people actually make

      - Assuming TCP preserves message boundaries. It is a byte stream: two `send` calls can
        arrive as one `recv`, so framing is your job.
      - Counting bytes instead of round trips, then wondering why a small page feels slow.
      - Blaming bandwidth for a latency problem; a fatter link does not shorten the trip.
      - Expecting a DNS change to apply at once, forgetting the TTL you set.
      - Treating a firewall drop (hangs until timeout) and a refusal (immediate RST) as one
        fault when they have different causes.

      **What you can do after this:** take "the site is slow from Singapore" and establish
      from `dig`, `curl -v` and a packet capture whether the cost is DNS, handshakes,
      congestion or the origin.
    resources:
      - kind: book
        title: Beej's Guide to Network Programming (sockets)
        url: https://beej.us/guide/bgnet/
