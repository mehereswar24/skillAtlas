  - slug: computer-science-compilers-and-interpreters
    name: Compilers, Interpreters and Language Runtimes
    domain: computer-science
    est_hours: 16
    difficulty: advanced
    prerequisites:
      - computer-science-theory-of-computation
      - computer-science-memory-management
    summary: Trace source code through lexing, parsing, semantic analysis, SSA-based optimisation and code generation, then through the runtime — bytecode dispatch, JIT tiering, deoptimisation and linking — and reason about why your code runs at the speed it does.
    content_md: |-
      The compiler is the tool you use most and understand least. It is also where the rest of this track cashes out: finite automata become the lexer, context-free grammars become the parser, trees and hash tables become the AST and symbol table, graph colouring becomes register allocation, and memory management becomes the collector's contract with generated code. Understanding the pipeline changes how you read error messages, how you benchmark, and how you reason about what the machine does with what you wrote.

      ### The front end: lexing and parsing

      **Lexing** turns characters into tokens — a regular-language problem, with token classes written as regular expressions, compiled to a DFA and matched by longest match against a keyword table. This is finite automata in production.

      **Parsing** turns tokens into a tree using a context-free grammar. **Recursive descent** writes one function per non-terminal, is LL and top-down, and is what most production compilers use because it gives full control over error messages. For expressions it pairs with **Pratt parsing** (precedence climbing), which handles precedence and associativity through a table of binding powers instead of one grammar rule per level. **LR** parsing is bottom-up and table-driven, generated by tools like Bison; a **shift/reduce conflict** means the generator reached a state where the tokens seen so far permit both extending the current handle and reducing it — an ambiguity in your grammar, not a bug in the tool. For error recovery the parser synchronises after a failure, usually by discarding tokens to the next statement boundary, so one run reports many errors.

      ### From tree to intermediate representation

      The **AST** is what the program means, with syntax noise removed. **Semantic analysis** walks it: build **symbol tables** per scope, resolve names to declarations, then **type check**, running unification where types are inferred rather than written.

      The compiler then lowers to an IR, typically **three-address code** in **SSA form** (static single assignment), where every variable is assigned once and control-flow merges introduce phi nodes:

      ```
      x = 1          ; x1 = 1
      x = x + 2      ; x2 = x1 + 2
      if c: x = 9    ; x3 = 9
      print(x)       ; x4 = phi(x2, x3); print(x4)
      ```

      SSA is the enabling trick of modern optimisation: with exactly one definition per name, use-def chains are immediate and analyses that would need a dataflow fixpoint become a graph walk. LLVM IR and the JVM's and V8's internal IRs are all SSA-based.

      ### Optimisation and code generation

      Passes run over the IR: **constant folding** and propagation, **dead-code elimination**, **common subexpression elimination**, **inlining** (which matters mostly because it exposes further optimisation across the call boundary), **loop-invariant code motion** and vectorisation. **Register allocation** is the classic: build an interference graph whose nodes are live ranges and whose edges mean two values are live at once, colour it with as many colours as you have registers, and spill to the stack when you cannot. **Code generation** then emits machine code or bytecode, handling instruction selection, scheduling and the calling convention.

      ### Runtimes: bytecode, JIT and deoptimisation

      A **bytecode VM** fetches an opcode and dispatches, usually through computed-goto or threaded code rather than a switch, to keep branch prediction working. A **JIT** compiles hot code at run time in **tiers**: an interpreter or baseline compiler starts immediately and collects profile data, and a slower optimising compiler takes over methods that stay hot. The optimiser **speculates** on that profile — this call site has only seen one receiver type, so inline it; this variable has only held small integers, so skip the boxing. Every speculation is guarded, and a failed guard triggers **deoptimisation**: rebuild interpreter frames from the optimised frame and continue interpreting. That is the machinery in V8 and HotSpot, and why a hot loop speeds up after warm-up and why changing an object's shape mid-run suddenly slows things down.

      **AOT compilation** trades peak throughput for immediate startup. Either way the runtime cooperates with the **garbage collector**: generated code records stack maps at **safepoints** so the collector knows which registers and slots hold live references, and threads pause only there. The **ABI** fixes calling conventions and struct layout so separately compiled objects interoperate; **static linking** resolves symbols at build time while **dynamic linking** defers to load time through PLT/GOT indirection. **Undefined behaviour** is an optimisation licence — the standard says nothing about signed overflow or a null dereference, so the optimiser assumes it cannot happen and deletes the null check you wrote *after* the dereference. **WebAssembly** is a portable, sandboxed compilation target playing the role bytecode plays for the JVM, but across languages.

      ### The mistakes people actually make

      Trusting the line number in an error: the parser reports where it *noticed* the problem, so a missing brace three functions earlier surfaces at the next construct that cannot be reconciled. Expecting the compiler to remove work with observable side effects — volatile accesses, atomics, I/O and opaque calls all block optimisation. Benchmarking JIT code without a warm-up, then reporting interpreter timings as the language's speed. Assuming interpreted means slow, when a tiering JIT approaches native throughput on hot numeric code. And writing a parser with regular expressions, which fails on the first realistically nested input.

      **What you can do after this:** read a compiler's IR or bytecode dump, explain why a specific optimisation did or did not fire, and design a lexer plus recursive-descent parser for a small language.
