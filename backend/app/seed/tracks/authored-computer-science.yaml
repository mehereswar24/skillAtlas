        title: MIT 6.006 Introduction to Algorithms (Spring 2020)
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
  - slug: computer-science-balanced-search-trees
    name: Balanced Trees, B-Trees and Skip Lists
    domain: computer-science
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - computer-science-tree
    summary: |-
      Fix the one real failure of binary search trees: degeneration. You will explain
      rotations, AVL and red-black invariants, randomised balancing, skip lists, and
      why B-trees pick node sizes from the memory hierarchy rather than from theory.
    content_md: |-
      A binary search tree gives you O(log n) search only if it is actually shaped
      like a tree. Insert `1, 2, 3, ... n` in ascending order and every key becomes a
      right child of the last: a linked list wearing tree notation, with O(n) lookups.
      Sorted input is not exotic — it is what a database dump or an auto-increment ID
      column hands you. So that O(log n) is a hope about the input, not a guarantee
      about the structure.

      This concept follows binary search trees because it answers exactly that
      failure. A self-balancing tree spends bounded extra work on every write to keep
      the height near log n, so the bound holds for every input.

      ### Rotations: changing shape without changing order

      Every balanced binary tree is built on one primitive. A rotation re-hangs a
      parent and a child so one side gets shorter and the other taller, while the
      in-order traversal is unchanged.

      ```
      rotate_right(y):        # y is the current subtree root
          x = y.left
          y.left  = x.right   # x's right subtree sits between x and y in order
          x.right = y
          return x            # x is the new subtree root
      ```

      That preservation of the in-order sequence is what makes rotations legal: only
      the height changes. Everything below is a policy for deciding *when* to rotate.

      ### AVL and red-black: two points on one trade-off

      An **AVL tree** requires the heights of a node's two subtrees to differ by at
      most one. An insertion can violate this in four configurations — left-left,
      right-right, left-right, right-left — each repaired by one or two rotations. The
      invariant is strict, so height stays near 1.44 log n and lookups are fast, but
      writes rotate more often.

      A **red-black tree** colours nodes red or black and requires that no red node
      has a red child and that every root-to-leaf path crosses the same number of
      black nodes. Those rules bound the height by 2 log(n+1) — weaker, which buys
      fewer rotations per update. That trade is why red-black trees ended up in
      `std::map`, Java's `TreeMap` and the Linux kernel's `rbtree`.

      **Treaps** balance a third way: each node carries the key plus a random
      priority, and the tree is a BST by key and a heap by priority. The shape follows
      from the priorities, so expected height is O(log n) and the proof is short — far
      easier than getting red-black delete right.

      **Skip lists** abandon trees. Promote each node to the next level with
      probability ½, giving a stack of increasingly sparse linked lists. Search walks
      forward at a high level and drops down when the next node overshoots: expected
      O(log n) steps, no rotations, and a structure far easier to make concurrent.

      ### B-trees: a memory-hierarchy decision

      A **B-tree** node holds many keys and many children. That looks wasteful until
      you notice the cost model: disks and SSDs move a whole page, and a random read
      costs orders of magnitude more than a comparison. Size a node to fill a page,
      get a fan-out in the hundreds, and millions of keys sit three or four levels
      deep — a size chosen from the hardware, not the maths.

      A **B+ tree** keeps only separator keys internally, puts all records in the
      leaves and links the leaves in order, so a range scan is one descent plus a
      sequential walk. That is why B+ trees index PostgreSQL, InnoDB, SQLite and most
      filesystems.

      ### Augmentation

      Store each subtree's size in its root and you can answer "the k-th smallest key"
      and "how many keys are below x" in O(log n) — an *order-statistic tree*. Any
      augmentation must be recomputable from a node's children alone, and updated
      inside every rotation.

      ### The mistakes people actually make

      Implementing insert, declaring victory, then discovering delete is the hard
      half: red-black deletion has more cases than insertion and is where hand-written
      bugs live. Assuming a balanced tree beats a hash table for point lookups — it
      does not; pay for a tree only when you need order, ranges or predecessor
      queries. Using a binary tree where the fan-out was the point, then wondering why
      an on-disk index is slow. And augmenting without maintaining the field through
      rotations, so every rank query returns a plausible wrong answer.

      **What you can do after this:** given a workload, choose between a hash table, a
      red-black tree, a skip list and a B+ tree, and defend the choice by naming the
      access pattern and the cost of a page miss.
    resources:
      - kind: doc
        title: 'Sedgewick & Wayne: Balanced Search Trees (Algorithms, 4th ed.)'
        url: https://algs4.cs.princeton.edu/33balanced/
