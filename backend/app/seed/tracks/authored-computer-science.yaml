  - slug: computer-science-floating-point-math
    name: Floating-Point Arithmetic and Its Traps
    domain: computer-science
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - computer-science-representation
    summary: Read the IEEE 754 layout and predict its consequences — rounding, cancellation, NaN, non-associativity — so that you can compare floats correctly, choose an appropriate numeric type, and stop treating float results as random.
    content_md: |-
      `0.1 + 0.2 == 0.30000000000000004` is not a bug in your language. It is the exact, specified, reproducible behaviour of a well-designed mechanism operating on inputs it cannot represent. Floating point is not vaguely approximate arithmetic; it is precise arithmetic over a finite set of representable values, and every surprise follows from which values those are.

      Six hours here buys you out of a career of `==` on floats, totals that drift by a cent, and sorts that corrupt an array whenever a NaN gets in.

      ### The layout

      IEEE 754 stores a number as a sign bit, a biased exponent and a significand. `binary32` (`float`) uses 1 + 8 + 23 bits; `binary64` (`double`) uses 1 + 11 + 52. The value is roughly `(−1)^sign × 1.significand × 2^(exponent − bias)`. Note the leading `1.`: for normalised numbers it is **implicit** and not stored, buying an extra bit of precision for free. Near zero, where that would leave a gap, the format switches to **subnormal** numbers with an implicit leading `0.`, trading precision for gradual underflow. A `double` carries about 15–17 significant decimal digits, a `float` about 6–9.

      ### Uneven spacing, and why 0.1 is not 0.1

      Because the exponent scales the significand, representable values are dense near zero and sparse far from it. The gap between adjacent representable numbers is one **ULP** (unit in the last place), and it grows with magnitude: past 2⁵³ a `double` can no longer represent every consecutive integer.

      A fraction is exact only if its denominator is a power of two, so `0.5`, `0.25` and `0.75` are exact and `0.1` is not — in binary it repeats, exactly as `1/3` does in decimal. You store the nearest `double`, and the sum of two such approximations is not the `double` nearest `0.3`. Rounding is specified: the default is **round-to-nearest, ties-to-even**, which avoids the upward bias of always rounding halves up.

      ### Special values

      There are two zeros, `+0.0` and `-0.0`; they compare equal, but `1/+0.0` is `+inf` and `1/-0.0` is `-inf`. Overflow produces **infinity** rather than wrapping, and `0.0/0.0`, `inf - inf` and `sqrt(-1)` produce **NaN**, which propagates through everything downstream. NaN's defining property is that it is **unordered**: `NaN != NaN` is true, and `<`, `>` and `==` are all false against it. That breaks anything assuming a total order — a comparison sort can produce a corrupted permutation, and a NaN used as a hash key can never be found again.

      ### Cancellation, absorption and non-associativity

      **Catastrophic cancellation**: subtracting two nearly equal numbers destroys the leading digits they shared and promotes previously negligible rounding error into the leading digits of the result; the naive quadratic formula when `b² ≫ 4ac` is the textbook case. **Absorption**: adding a tiny value to a huge one, where the tiny value falls below one ULP of the large one and vanishes, so `1e16 + 1.0 == 1e16`.

      Together these make floating-point addition **non-associative**: `(a + b) + c` can differ from `a + (b + c)`. Summation order changes the answer, which is why a parallel reduction varies with how the work was split, and why compensated (Kahan) summation exists.

      ### Comparing correctly, and the alternatives

      Never use `==`. Compare with a tolerance chosen by scale: an absolute epsilon is right only near zero, while in general you need a **relative** test — `abs(a - b) <= eps * max(abs(a), abs(b))` — or a ULP comparison. A hard-coded `1e-9` is meaningless around `1e12`, where one ULP is already larger than that.

      When exactness matters, leave floats behind: integer cents or a decimal type (`decimal.Decimal`, `BigDecimal`) for money, rationals for exact fractions, arbitrary precision when needed. Results are also not always bit-reproducible across builds, because fused multiply-add rounds once instead of twice, compilers differ in when they contract or reassociate expressions, and parallel reductions differ in order.

      ### The mistakes people actually make

      **`==` on floats.** The test passes on your inputs and fails on a customer's, and nobody can reproduce it.

      **A long uncompensated running sum.** Error accumulates with the number of terms, so a million-element average drifts from the true mean.

      **Currency in a `double`.** Line items sum to a total that is a cent off, and the discrepancy depends on order, so it is unreproducible.

      **Sorting data containing NaN.** The comparator violates strict weak ordering, and depending on the implementation you get a wrong order or out-of-bounds behaviour. Handle NaN before sorting.

      **What you can do after this:** write a float comparison that is correct at both `1e-8` and `1e12`, and explain why a parallel sum of the same array can return two different answers.
