  - slug: computer-science-sorting
    name: Sorting
    domain: computer-science
    est_hours: 10
    difficulty: beginner
    prerequisites:
      - computer-science-recursion
      - computer-science-common-runtimes
    summary: |-
      Work through sorting as the standard case study in algorithm design: the quadratic sorts,
      merge, quick and heap sort, the decision-tree proof that no comparison sort beats n log n,
      and the non-comparison sorts that legitimately do.
    content_md: |-
      Sorting is the standard case study because every major technique shows up in it — incremental
      construction, divide and conquer, heap-based selection, randomisation, and a genuine provable
      lower bound. You will rarely write a sort in production. You will constantly reason about one.

      ### The quadratic sorts, and why insertion sort survives

      Selection sort repeatedly finds the minimum of the unsorted suffix and swaps it into place:
      always `Theta(n^2)` comparisons but only `Theta(n)` swaps, its one virtue when writes are
      expensive. Bubble sort repeatedly swaps adjacent out-of-order pairs and is mainly of historical
      interest.

      Insertion sort earns its keep. It holds the invariant that `a[0..i)` is sorted and inserts
      `a[i]` by shifting larger elements right, so the number of shifts is exactly the number of
      inversions in the input. It is therefore `Theta(n)` on nearly-sorted input, and it is stable,
      in-place, adaptive, and a tight shift loop over contiguous memory — which is why real library
      sorts cut over to it below a threshold of a few dozen elements.

      ### The O(n log n) trio

      **Merge sort.** Split in half, sort each half, merge two sorted runs in `Theta(n)`. The
      recurrence `2T(n/2) + Theta(n)` gives `Theta(n log n)` in *every* case — there is no bad input.
      It is stable when the merge prefers the left run on ties, and needs `Theta(n)` auxiliary space.
      It is the right choice for linked lists, for data streamed from disk, and wherever a guaranteed
      bound matters more than the constant.

      **Quicksort.** Pick a pivot, partition, recurse on both sides; there is no combine step.
      Lomuto's partition keeps one boundary index in a single scan — simple, more swaps, and it
      degrades badly when many keys are equal. Hoare's scans inward from both ends and swaps pairs:
      fewer swaps, and what production code uses. A pivot that always splits off one element gives
      `T(n) = T(n-1) + Theta(n) = Theta(n^2)`, and "take the first element" does exactly that on
      already-sorted input, which is common rather than rare. Randomising the pivot or taking the
      median of three makes that vanishingly unlikely; median-of-medians makes it impossible at the
      cost of a large constant. Quicksort is usually fastest in memory anyway: partitioning is two
      sequential scans and it is in-place. Recurse into the smaller side and loop on the larger to
      keep stack depth `O(log n)`.

      **Heapsort.** Heapify in `O(n)`, then repeatedly swap the root to the end and sift down.
      `Theta(n log n)` worst case, in-place, not stable. It loses to quicksort in practice because
      sift-down jumps through the array by powers of two and misses cache. Its value is a guaranteed
      bound with no extra memory, which is why introsort keeps it as a fallback.

      ### Why Omega(n log n) is a wall

      Model any comparison sort as a decision tree: each internal node is one comparison with two
      outcomes, and each leaf is a permutation the algorithm can produce. To be correct on every input
      of n distinct elements, all `n!` permutations must be reachable, so the tree has at least `n!`
      leaves. A binary tree with L leaves has height at least `log2 L`, and the worst-case number of
      comparisons is that height — so it is at least `log2(n!)`, which by Stirling's approximation is
      `Theta(n log n)`. That bounds *every* comparison-based algorithm, existing or future. It is why
      any claim to beat n log n either is wrong or is quietly using extra information about the keys.

      ### Sorting without comparisons

      You get past the bound by assuming something about the keys. *Counting sort* needs integer keys
      in a small range: count occurrences, prefix-sum into starting positions, place each element.
      `Theta(n + k)` time and space, stable if you place while scanning backwards, useless when k far
      exceeds n. *Radix sort* sorts by digit: LSD radix runs a stable counting sort per digit from
      least to most significant, and the stability of each pass is what makes it correct —
      `Theta(d(n + b))` for d digits in base b. MSD radix buckets on the top digit and recurses, which
      suits strings of unequal length. *Bucket sort* assumes roughly uniform keys, scatters into n
      buckets and insertion-sorts each: linear expected time, `Theta(n^2)` if everything lands in one.

      ### Stability, and what real libraries do

      Stable means equal keys keep their input order, which is what lets you sort by several keys: sort
      by the least significant key first and the earlier order survives ties later.

      In 2026: CPython's `list.sort` and Java's `Arrays.sort` for objects use **Timsort**, which detects
      existing sorted runs, extends short ones with insertion sort, and merges runs under balancing
      invariants — linear on sorted input, `Theta(n log n)` worst case, stable. C++ `std::sort` is
      typically **introsort** (quicksort, falling back to heapsort when recursion goes too deep and to
      insertion sort on small ranges) and is *not* stable; `std::stable_sort` is. Rust's `sort_unstable`
      uses **pdqsort**. Java sorts primitive arrays with **dual-pivot quicksort**, which is why sorting
      `int[]` is unstable while sorting `Integer[]` is stable. When data exceeds memory, **external
      sorting** sorts RAM-sized chunks into runs, then k-way merges them with a heap so access stays
      sequential. For only the k-th smallest element, **quickselect** partitions but recurses into one
      side: linear expected time, as in `std::nth_element`.

      ### The mistakes people actually make

      - Writing a comparator that is not a strict weak ordering — `return a <= b`, or a
        self-contradicting tie-break. `std::sort` may read out of bounds and crash; Java throws
        "Comparison method violates its general contract!". That is undefined behaviour, not merely a
        wrong answer.
      - Sorting to answer a question a heap or a single pass answers. "Top 10 of a million" is
        `Theta(n log k)` with a size-10 heap.
      - Assuming the library sort is stable when it is not.
      - Sorting inside a loop — re-sorting after every insertion — where one sort at the end would do.
      - Sorting floating-point data containing NaN, which compares false against everything and breaks
        the ordering the algorithm assumes.

      **What you can do after this:** choose and justify a sort for a given input — size, key type,
      pre-sortedness, memory budget, stability requirement — and reproduce the decision-tree argument
      for why no comparison sort can do better than n log n.
