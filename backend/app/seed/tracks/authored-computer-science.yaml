  - slug: computer-science-greedy-algorithms
    name: Greedy Algorithms and Proving Them Correct
    domain: computer-science
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - computer-science-sorting
    summary: |-
      Write greedy algorithms and, more importantly, prove them. You will apply the
      exchange argument and "greedy stays ahead", produce counterexamples for greedy
      criteria that fail, and recognise when a problem needs something stronger.
    content_md: |-
      A greedy algorithm is almost embarrassingly easy to write: sort by something,
      walk the list, take whatever looks best right now, never reconsider. Ten lines.
      The difficulty is elsewhere — knowing whether those ten lines are correct. Two
      greedy criteria for the same problem can look equally sensible, and one of them
      can be wrong on inputs you will never think to test.

      So treat this concept as being about proof rather than code. A greedy algorithm
      without an argument is a guess that passed the sample cases.

      ### The two properties that must hold

      **Optimal substructure**: an optimal solution to the whole problem contains
      optimal solutions to its subproblems. This is shared with dynamic programming.

      **The greedy-choice property**: there exists an optimal solution that contains
      the locally-best choice. This is the one greedy needs and DP does not. It is what
      licenses you to commit irrevocably and shrink the problem, instead of exploring
      both branches.

      ### Two proof techniques you can actually apply

      The **exchange argument** is the workhorse. Take any optimal solution O. If it
      differs from the greedy solution G, look at the first place they diverge, and
      show you can swap O's choice for G's without making O worse or infeasible. Repeat
      and O becomes G, so G is optimal too.

      **Greedy stays ahead** suits problems measured by a running quantity. Prove by
      induction that after k steps, greedy's partial solution is at least as good on
      the relevant measure as any other solution's first k steps — for activity
      selection, that greedy's k-th chosen activity finishes no later than anyone
      else's.

      ### The classics, and where the obvious criterion fails

      **Activity selection**: choose the compatible activities that fit in one room.
      Sorting by *earliest finishing time* is optimal — it leaves the most room for
      what follows, and the exchange argument is two lines. Sorting by earliest start
      fails on one long activity that begins first and swallows the day. Sorting by
      shortest duration fails on a short activity that straddles the gap between two
      long ones, blocking both.

      **Fractional knapsack**: sort by value per unit weight, take greedily, cut the
      last item to fit. Optimal. **0/1 knapsack** removes the ability to cut, and the
      density heuristic breaks immediately — that problem belongs to dynamic
      programming.

      **Huffman coding** repeatedly merges the two least frequent symbols, and the
      exchange argument shows the two rarest symbols can always be made deepest
      siblings. **Interval partitioning** — the fewest rooms for all activities — is
      solved by sweeping start times and reusing any free room; the answer equals the
      maximum overlap depth, which is a lower bound, so greedy stays ahead. Scheduling
      to minimise maximum lateness sorts by deadline.

      **Coin change** is the cautionary tale. Greedy works for the coin systems in
      normal use, and fails for others:

      ```
      coins = [1, 3, 4],  target = 6
      greedy:  4 + 1 + 1  ->  3 coins
      optimal: 3 + 3      ->  2 coins
      ```

      ### Matroids, and greedy as a deliberate approximation

      There is a general condition. If a problem's feasible sets form a **matroid** —
      closed under subsets, plus an exchange axiom saying a smaller independent set
      can always be extended from a larger one — then repeatedly taking the heaviest
      feasible element is optimal. Kruskal's MST is the canonical instance: a graph's
      forests form the graphic matroid, which is why "sort edges, add if it makes no
      cycle" needs no problem-specific proof.

      Where no such structure exists, greedy is still useful *as a stated
      approximation*. Greedy set cover is within a factor of ln n of optimal, and
      greedy list scheduling on m machines is within a factor of 2 − 1/m. The point is
      that the ratio is proved, not hoped for.

      ### The mistakes people actually make

      Believing greedy works because the examples passed — the failing input is almost
      always one you did not imagine. Picking the wrong greedy criterion, which is the
      actual bug in most wrong greedy code, not the loop. Not noticing that a
      locally-worse choice can enable a globally-better one, the signal that the
      problem needs DP. And sorting by the wrong key, or the right key in the wrong
      direction, which is plausible on most inputs and wrong on the rest.

      **What you can do after this:** sketch an exchange argument for a greedy rule you
      propose, or construct a concrete counterexample showing it fails, before writing
      any of the implementation.
