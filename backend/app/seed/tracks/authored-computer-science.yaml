  - slug: computer-science-common-runtimes
    name: 'Complexity in Practice: What Actually Finishes in Time'
    domain: computer-science
    est_hours: 4
    difficulty: beginner
    prerequisites:
      - computer-science-asymptotic-notation
    summary: |-
      Turn asymptotics into an engineering reflex: know what each complexity class does to the
      clock when n doubles, read a problem's constraints backwards to infer the intended
      solution, and budget memory as well as time.
    content_md: |-
      The previous concept gave you the notation. This one gives you the reflex: look at the size
      of the input and know, before writing a line, which approaches are still on the table and
      which are already dead.

      That reflex is worth more than it sounds. Most time spent optimising goes into code that was
      never the bottleneck, and most time spent debugging a timeout goes into discovering that the
      approach was doomed by the first sentence of the requirements.

      ### The ladder, and what doubling n does

      - `O(1)` — array index, hash lookup. Doubling n changes nothing.
      - `O(log n)` — binary search, heap push. Doubling n adds one step.
      - `O(sqrt n)` — trial division to sqrt(n). Doubling n costs about 1.41x.
      - `O(n)` — one scan. Doubling n doubles the work.
      - `O(n log n)` — comparison sort, sort-then-sweep. Slightly more than double.
      - `O(n^2)` — all pairs, naive substring search. Doubling n quadruples.
      - `O(n^3)` — Floyd-Warshall, textbook matrix multiply. Doubling n costs 8x.
      - `O(2^n)` — enumerate subsets. Adding *one* element doubles the work.
      - `O(n!)` — enumerate permutations. Adding one element multiplies by n.

      Note the discontinuity before the last two. Polynomial growth is a scaling problem;
      exponential growth is a wall you do not climb by buying a bigger machine.

      ### Reading constraints backwards

      When a problem states its input bounds it has told you the intended complexity. Rough
      ceilings, taking 10^8 simple operations as a budget: `n <= 10` allows `O(n!)` (10! is about
      3.6 million); `n <= 20`-`25` allows `O(2^n)` subset enumeration and bitmask DP (2^25 is about
      3.4 x 10^7); `n <= 500` allows `O(n^3)`; `n <= 5000` allows `O(n^2)`; `n` up to `10^6` means
      `O(n log n)`, in practice "sort it or use a heap"; beyond `10^7` you need `O(n)` with a small
      constant. Run this backwards on real briefs too: "we have 40 million rows" rules out anything
      quadratic before you have picked a language.

      ### Throughput, and why it is only an order of magnitude

      A modern core executes on the order of 10^8 to 10^9 simple operations per second in a
      compiled language; CPython is commonly one to two orders of magnitude slower per operation,
      which is why pushing work into a C-implemented library call changes the picture so much.
      Treat these as orders of magnitude, never benchmarks — they swing with the operation and the
      memory access pattern. An L1 cache hit costs on the order of a nanosecond; a miss to main
      memory costs on the order of a hundred.

      ### When the asymptotically worse algorithm wins

      Sorting a contiguous array of a million integers is `O(n log n)` and entirely sequential;
      walking a linked list of a million nodes is `O(n)` and one cache miss per node. The slower
      one routinely wins.

      Hash tables are `O(1)` *expected*, not guaranteed: the worst case is `O(n)` per operation
      when keys collide, each lookup costs a hash plus a likely cache miss, and a resize is an
      `O(n)` pause. Under a few hundred elements a binary search in a sorted array often wins.

      And an operation count is not wall-clock time when I/O is involved. A "linear" loop issuing
      one database query per item at 2 ms each takes over three minutes at n = 10^5 — the N+1
      query problem. When one operation in the loop is a thousand times costlier than the rest,
      that is the operation your model must count.

      ### Memory is the second constraint

      Memory often decides the approach before time does. A million 64-bit integers is 8 MB
      packed; the same values in a Python list of boxed integers is tens of MB, because each slot
      is a pointer to an object. An n-by-n table at n = 10^5 is 10^10 cells and cannot exist. That
      pressure is what turns a full dynamic-programming table into a rolling two-row array.

      ### The mistakes people actually make

      - Choosing an `O(n^2)` approach when the brief printed `n <= 2 x 10^5`. The constraint was
        the answer and you skipped it.
      - Saying "it is linear, so it is fast" when each iteration crosses a network.
      - Sizing only for time and then being killed by the memory limit, or by swapping.
      - Benchmarking at n = 100 and extrapolating. At small n everything fits in cache and
        constants dominate, so the curve you measured is not the curve you will get.
      - Ignoring I/O: reading 10^6 lines with unbuffered per-line reads can dominate an otherwise
        linear program.

      **What you can do after this:** read a problem's input bounds and say within seconds which
      complexity classes remain viable, then defend your choice with both an operation-count
      estimate and a memory estimate.
