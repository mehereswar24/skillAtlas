  - slug: computer-science-asymptotic-notation
    name: Asymptotic Analysis and Recurrences
    domain: computer-science
    est_hours: 8
    difficulty: beginner
    prerequisites:
      - computer-science-basic-math-skills
    summary: |-
      State and defend a running-time bound: give the formal definitions of O, Omega and
      Theta, distinguish worst case from upper bound, run an amortised argument, and solve
      the recurrence a recursive algorithm produces.
    content_md: |-
      Two implementations of the same function can be indistinguishable at n = 100 and differ by
      a thousandfold at n = 10^6. Asymptotic notation lets you state that difference before
      writing either one, on hardware you have not bought: it describes the *shape* of a growth
      function, stripped of everything machine-specific.

      Most people learn the vibe of Big-O and stop. The vibe passes a quiz; it does not let you
      argue with a colleague.

      ### The definitions, with the constants

      `f(n) = O(g(n))` means there exist `c > 0` and `n0` with `0 <= f(n) <= c*g(n)` for all
      `n >= n0`: an upper bound, eventually, up to a constant. `Omega` flips the inequality.
      `Theta` is both at once, with `c1 <= c2` sandwiching f — a tight bound. Little-o
      strengthens the quantifier: for *every* `c > 0` there is an `n0` beyond which
      `f(n) < c*g(n)`, equivalently `f/g -> 0`. Little-omega mirrors it.

      That existential c is why `3n^2 + 5n + 7` is `O(n^2)` and also, truthfully, `O(n^5)`: an
      upper bound need not be tight. People who say "merge sort is O(n log n)" mean Theta. Say
      Theta when you mean tight.

      ### What you count, and which case

      Fix a cost model before a bound: which operation you count, and what n measures. "O(n)" is
      meaningless until n is named — array length, vertex count and number of *bits* in an
      integer are not interchangeable.

      Best, worst and average case choose which *inputs* of size n you look at: worst is a
      maximum, average an expectation over a stated distribution. That axis is orthogonal to
      O/Omega/Theta, which describe how you bound a function. "Quicksort's worst case is
      Theta(n^2)" and "its average case is Theta(n log n)" are both tight bounds on different
      quantities; conflating "worst case" with "upper bound" is the commonest confusion here.

      ### Amortised analysis

      Some operations are cheap almost always and expensive rarely. Amortised analysis spreads
      that cost over the sequence; it is a worst-case guarantee over any sequence, with no
      probability involved. For a dynamic array that doubles when full:

      - *Aggregate*: over n appends the copies total under 2n element moves, so each append is
        O(1) amortised.
      - *Accounting*: charge 3 credits per append — one to write the element, two banked for the
        next resize — and show the balance never goes negative.
      - *Potential*: with `Phi = 2*(size - capacity/2)`, amortised cost is actual cost plus the
        change in Phi, so the resize is paid for by Phi collapsing.

      A constant growth increment rather than a factor breaks all three.

      ### Recurrences and the Master theorem

      A loop costs the sum of its body, so nested loops whose inner bound follows the outer give
      `sum of i for i < n = Theta(n^2)`. Recursion instead yields `T(n) = a*T(n/b) + f(n)`.

      Solve it three ways. *Substitution*: guess, then prove by induction carrying the real
      constant. *Recursion tree*: level i has `a^i` nodes each costing `f(n/b^i)`; sum the levels.
      *Master theorem*: compare `f(n)` against `n^(log_b a)`. Polynomially smaller f, the leaves
      win: `Theta(n^(log_b a))`. `f = Theta(n^(log_b a) * log^k n)`, every level contributes: you
      gain one log. Polynomially larger f *plus* the regularity condition `a*f(n/b) <= c*f(n)` for
      some `c < 1`, the root dominates: `Theta(f(n))`.

      Its limits matter: it needs that exact form with constant a and b, so it says nothing about
      `T(n) = T(n-1) + n`, about `T(n) = 2T(n/2) + n/log n` (a gap between the first two cases), or
      about uneven splits like `T(n) = T(n/3) + T(2n/3) + n`, where a recursion tree gives
      `Theta(n log n)`. Space follows the same discipline: depth d means d live frames.

      ### Where asymptotics lose to reality

      Theta discards constant factors, and a 50x constant is invisible to it. Insertion sort beats
      merge sort below a few dozen elements; a contiguous scan beats a "faster" pointer-chasing
      structure because the prefetcher works on one and not the other. A legitimate crossover
      argument names the n where the curves cross.

      ### The mistakes people actually make

      - Answering "this is O(n^2)" when the question was the average case. Quicksort is O(n^2) and
        also the fastest sort in your standard library.
      - Treating a library call as one step: `if x in some_list` inside a loop is Theta(n) per
        iteration and quietly makes the loop quadratic.
      - Claiming O(1) space for a recursive function; the call stack is space you allocated.
      - Applying the Master theorem outside its form, or case three without checking regularity.
      - Forgetting the leaves: `T(n) = 2T(n/2) + O(1)` is `Theta(n)`, not `Theta(log n)`.

      **What you can do after this:** take an unfamiliar function, name what n is, write down its
      loop sum or recurrence, solve it to a Theta bound, and say whether that bound is worst case
      or average and how much stack it consumes.
