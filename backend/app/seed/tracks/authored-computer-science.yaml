  - slug: computer-science-character-encodings
    name: 'Text: Unicode, UTF-8 and Why Strings Are Hard'
    domain: computer-science
    est_hours: 6
    difficulty: beginner
    prerequisites:
      - computer-science-representation
    summary: Separate the abstract character set from its encodings, and learn where bytes, code points and grapheme clusters diverge, so that you can slice, compare and normalise text without corrupting it or producing false mismatches.
    content_md: |-
      A sequence of bytes is not text. It becomes text only when you know the encoding, and if you guess wrong you get mojibake — `café` rendered as `cafÃ©` — which is not corruption of the bytes but misinterpretation of them. Every text bug you will meet comes from one of two errors: treating bytes as text without knowing the encoding, or treating an encoded unit as if it were a character.

      Text handling looks trivial until it is not. `len(s)` has three defensible answers, reversing a string can move an accent onto the wrong letter, and two strings that render identically can compare unequal.

      ### From ASCII to code pages to Unicode

      ASCII assigned 128 characters to the values 0–127, which covered American English. The remaining bit was then claimed independently by dozens of incompatible **code pages** — Latin-1, Windows-1252, KOI8-R, Shift-JIS — so byte `0xE9` meant `é` in one and something else in another, with no way to tell from the bytes which was intended and no way to mix scripts in one document.

      **Unicode** fixes half of that by defining a single character set: every character gets a **code point**, written `U+0041` for `A` or `U+1F600` for a grinning face, across 17 planes from `U+0000` to `U+10FFFF`. The crucial idea is the **separation** of the character set from the encodings that serialise it. Unicode says what characters exist; UTF-8, UTF-16 and UTF-32 say how to turn code points into bytes.

      ### The encodings

      **UTF-8** uses one to four bytes per code point. Code points below 128 encode as a single byte identical to ASCII, so every ASCII file is already valid UTF-8. Multi-byte sequences have a lead byte announcing the length and continuation bytes that all begin `10`, which makes it **self-synchronising**: from any position you can find the start of a character by scanning back a few bytes. Its unit is a byte, so it has no byte-order question. Those properties are why it won the web; RFC 3629 is the specification.

      **UTF-16** uses two bytes for BMP characters and a **surrogate pair** of two 16-bit units above `U+FFFF`. Java, C#, JavaScript and the Windows APIs use it internally, which is why `"😀".length` is `2` in JavaScript — the property counts UTF-16 code units, not characters. **UTF-32** uses a fixed four bytes, making indexing trivial and wasting space, so it is rare on the wire.

      ### Three lengths, and why they differ

      For one string you can ask three questions: how many **bytes** (encoding-dependent), how many **code points** (encoding-independent), and how many **grapheme clusters** — the things a reader would call characters.

      These diverge constantly. `é` can be one code point (`U+00E9`) or two (`e` plus combining acute `U+0301`); a family emoji is several emoji joined by zero-width joiners; a skin-toned emoji is a base plus a modifier. Each is one grapheme cluster and several code points. Cursor movement, truncation and character counters must work on grapheme clusters, which Unicode Annex #29 defines.

      ### Normalisation, collation and declaring the encoding

      Because `é` has two spellings, comparison needs **normalisation** (Annex #15). NFC composes into the shortest form; NFD decomposes into base plus combining marks. NFKC and NFKD additionally apply *compatibility* mappings — `ﬁ` to `fi`, superscript `²` to `2` — which lose information, so use them for search keys and identifiers, not for storing user content. Normalise before comparing, hashing or indexing input.

      Case folding is not ASCII `toLowerCase`: German `ß`, Turkish dotted and dotless `i` and Greek final sigma have locale-dependent rules. **Collation** is likewise locale-specific, so the correct alphabetical order of one list differs between Swedish and German. Because different code points render identically, **homoglyphs** enable spoofing — a Cyrillic `а` in a domain or username — which UTS #39 addresses. Finally, always **declare** the encoding: the HTTP `Content-Type` charset, `<meta charset="utf-8">`, and explicit encoding arguments when opening files.

      ### The mistakes people actually make

      **Slicing by byte index.** Truncating UTF-8 at 100 bytes cuts a multi-byte character in half and yields an invalid sequence that renders as a replacement character or throws on decode.

      **Reversing a string naively.** Reversing code points moves combining marks onto the preceding letter, so `José` comes back with the accent on the wrong character.

      **Assuming `length` counts characters.** Your 280-character limit rejects a valid message or accepts one twice as long, depending on the script.

      **Comparing unnormalised input.** Two visually identical usernames compare unequal, or a search never matches text entered on a different platform.

      **Guessing the encoding.** Heuristic detection is right most of the time, and the rest becomes permanent database corruption.

      **What you can do after this:** truncate a user-supplied string to a display length without splitting a grapheme cluster, and normalise two inputs so that visually identical strings compare equal.
