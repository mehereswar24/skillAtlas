  - slug: computer-science-common-uml-diagrams
    name: Modelling and Communicating a Design
    domain: computer-science
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - computer-science-design-patterns
    summary: Choose the right diagram for the right audience and zoom level, keep diagrams in version control as code, and record the reasoning behind a design in an architecture decision record.
    content_md: |-
      A design that only exists in one person's head is not a design, it is a risk. But most attempts to fix that produce artefacts nobody reads: a wall-sized diagram mixing servers, classes and user journeys, or a slide deck that stopped matching reality two sprints ago.

      The useful framing is that a diagram is a communication artefact with an **audience**, a **zoom level** and a **shelf life**. Almost every unreadable diagram has failed on one of those three — usually the second, by mixing abstraction levels in one picture.

      ### The UML worth knowing

      Full UML — fourteen diagram types and a specification measured in hundreds of pages — is largely dead as a practice. A small subset is genuinely useful, and it is worth knowing the notation because it is the shared vocabulary.

      **Sequence diagrams** are the most valuable of the set. Lifelines down the page, time flowing downward, messages as arrows, with solid arrowheads for synchronous calls and open ones for asynchronous. Nothing else explains a protocol, an authentication handshake or a request flow across four services as compactly. Draw the *failure* paths too — the timeout, the retry, the compensating action — because that is where the design is actually decided.

      **Class diagrams** show structure: boxes for types, lines for relationships, with the distinction between association (knows about), aggregation (has, but the part outlives the whole) and composition (owns, and the part dies with it), plus multiplicity markers like `1..*`. Useful for a domain model or a pattern explanation; wasteful as a redrawing of code.

      **State machine diagrams** are underused. States, transitions, events and guards. The value is in the act of drawing: listing every state and asking what each event does in it reliably reveals a combination the code silently ignores. Order lifecycles, connection handling and UI flows all benefit.

      **Activity diagrams** cover workflows with branches and parallelism, and **use case diagrams** are occasionally handy for scoping who does what. Beyond those, reach for something else.

      ### The C4 model

      C4 is the modern answer to the abstraction-mixing problem, and it works by making the zoom level explicit. Four levels, each a separate diagram with a defined audience:

      1. **Context** — your system as one box, with the users and external systems around it. For anyone, including non-technical stakeholders.
      2. **Container** — the deployable/runnable units: the web app, the API, the database, the worker, the mobile client, and the protocols between them. This is the single most useful architecture diagram most teams never draw.
      3. **Component** — the major structural pieces inside one container.
      4. **Code** — class-level detail, generated on demand if at all.

      Because each level has a fixed meaning, nobody has to guess whether a box is a process, a class or a server. Supplement with entity-relationship diagrams for data and deployment/network diagrams for infrastructure.

      ### Diagrams as code

      A diagram drawn in a graphics tool and pasted into a wiki rots, because updating it is a chore nobody owns. Diagrams written as text — Mermaid, PlantUML, Structurizr DSL — live next to the code, are diffed and reviewed in a pull request, and render in most repository hosts and documentation sites. The syntax is deliberately terse, so the marginal cost of keeping one current is small enough that people actually do it.

      ### Architecture decision records

      The diagram shows *what*; an ADR records *why*. The standard shape is four sections: **context** (the forces at play and the constraints as they were at the time), **decision** (what was chosen, in the active voice), **status** (proposed, accepted, superseded by a later record), and **consequences** (what becomes easier, what becomes harder, what you now have to live with).

      The section with the most long-term value is the one people skip: the alternatives considered and why they were rejected. Two years later the question is never "what did we do" — that is visible in the code — it is "did they think about X, and what did they know that we do not?" ADRs are immutable: you supersede one with a new record rather than editing history.

      ### The mistakes people actually make

      One diagram covering infrastructure, classes and user journeys at once, which is unreadable at every zoom level. Unlabelled arrows: an arrow between two boxes could mean data flow, a dependency, a call, or a deployment relationship, and readers will each assume a different one. Beautiful diagrams in a slide deck rather than the repository, which guarantees they will contradict the code within weeks. Writing an ADR after the fact as a formality, once the reasoning has already been forgotten — the value is in writing it while the alternatives are still live. And drawing a diagram that simply restates the code, which is pure maintenance cost with no explanatory gain.

      **What you can do after this:** pick the right artefact for a design question — a sequence diagram for a protocol, a C4 container diagram for an architecture review, an ADR for a choice with consequences — and produce it as versioned text that survives the next refactor.
