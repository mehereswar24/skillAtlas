  - slug: computer-science-how-computers-work
    name: How a Computer Actually Executes Code
    domain: computer-science
    est_hours: 12
    difficulty: beginner
    prerequisites:
      - computer-science-pick-a-language
    summary: Trace the path from transistors and logic gates up through the CPU's fetch-decode-execute cycle, pipelines, caches and system calls, so that every later abstraction has a physical mechanism you can point to.
    content_md: |-
      Almost every confusing performance result becomes ordinary once you know what the hardware is doing. Why is a linked list slower than an array of the same asymptotic complexity? Why does one line of source sometimes take a nanosecond and sometimes a microsecond? None of that is answerable from source code alone, so this concept builds the machine from the bottom up until there is no magic left anywhere in the stack.

      ### From switches to a CPU

      A transistor is a voltage-controlled switch. Wire a few together and you get **logic gates** — NAND, NOR, AND, OR, NOT, XOR — where a voltage level stands for 0 or 1. Compose gates without feedback and you get **combinational logic**, whose output depends only on its current input: a full adder for two bits and a carry, chained into 64-bit addition; a **multiplexer**, which selects one of several inputs; a **decoder**, which turns an n-bit code into one of 2ⁿ select lines.

      Add feedback and a clock and you get **sequential logic**, which remembers: a latch, then a flip-flop, then a register. Combine an arithmetic-logic unit (adders and logic units with a multiplexer choosing the operation) with a register file and a control unit that decides what to do each cycle, and you have a general-purpose CPU.

      ### Fetch, decode, execute

      The **von Neumann** insight is that instructions can live in the same memory as data, so a program is just numbers — which is what makes compilers, interpreters and operating systems possible.

      Execution is then a loop: **fetch** the instruction at the address in the program counter, **decode** it into a control pattern, **execute** it in the ALU or memory unit, write back, and advance the PC (or set it elsewhere, which is a branch). The **instruction set architecture** is the contract describing what instructions exist: fixed-width load-store RISC (ARM64, RISC-V) versus variable-length CISC (x86-64). Registers are a handful of named locations inside the CPU, far faster than memory; addressing modes describe how an instruction names its operand.

      One source line becomes several instructions: `a[i] = a[i] + 1` is typically an address computation, a load, an add and a store.

      ### Why real CPUs are not that simple

      A modern core overlaps work. **Pipelining** splits fetch/decode/execute into stages so several instructions are in flight at once, which introduces **hazards** — an instruction needing a result that is not ready. **Branch prediction** guesses which way a conditional goes so the pipeline keeps filling; a misprediction discards the speculated work and costs on the order of a dozen or more cycles, which is why an unpredictable branch in a hot loop is expensive. **Superscalar** cores issue several instructions per cycle and **out-of-order execution** reorders them subject to data dependencies; **SIMD** applies one operation to a whole vector; multiple cores run genuinely in parallel and must then agree about memory.

      ### Memory, I/O and privilege

      Memory is a hierarchy, each level larger and slower than the one above: registers, L1, L2, L3, DRAM, SSD. A register access is sub-nanosecond, an L1 hit a few cycles, a DRAM access hundreds of cycles, an SSD access microseconds.

      Devices connect over buses. Rather than have the CPU poll, a device raises an **interrupt** and the CPU saves state and jumps to a handler; bulk transfers use **DMA**, so the device writes to memory without the CPU copying each byte.

      Finally, the CPU has privilege levels. Your code runs in **user mode** and cannot touch devices or another process's memory. A **system call** is a controlled trap into **kernel mode** — the only way to read a file, open a socket or get memory from the OS — and it costs far more than a function call.

      ### The mistakes people actually make

      **Believing one line is one instruction.** You reason about cost per source line, then cannot explain why a "simple" statement dominates a profile. It may be a virtual dispatch, a bounds check and a cache miss.

      **Assuming memory access is uniform.** You treat a linked-list walk and an array scan as equivalent because both are O(n); the array is far faster purely from locality and prefetching.

      **Expecting a branchy loop to run like a branch-free one.** Random data defeats the predictor, and identical instruction counts give very different times.

      **Judging a CPU by clock speed.** Instructions per cycle, cache size, memory bandwidth and core count usually matter more.

      **What you can do after this:** explain, in terms of pipeline and cache behaviour, why one loop that touches memory sequentially outruns an algorithmically identical loop that touches it randomly.
