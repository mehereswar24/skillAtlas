  - slug: computer-science-bitwise-operators
    name: Bit Manipulation
    domain: computer-science
    est_hours: 6
    difficulty: beginner
    prerequisites:
      - computer-science-representation
    summary: Work directly with the bits of an integer using masks, shifts and the standard identities, understanding the invariant behind each trick, so that you can implement flag sets, bitmask state and subset enumeration correctly.
    content_md: |-
      Bit manipulation has a reputation as a bag of party tricks. It is better understood as a small algebra with a few identities, each following from how two's complement works. Once you can derive `x & (x - 1)` rather than recall it, the area stops being memorisation.

      It earns its place for concrete reasons: permission flags and hardware registers are bit fields, a set over a small universe is far faster as a machine word than as a hash set, subset-enumeration dynamic programming is only practical with bitmasks, and hash functions are built from shifts and XORs.

      ### The operators and their algebra

      `&`, `|`, `^` and `~` operate on each bit position independently. AND with 1 preserves a bit and with 0 clears it, so AND is the *masking* operator; OR with 1 sets a bit, so OR is the *setting* operator. XOR is addition modulo 2 — addition without carry.

      Three XOR properties do most of the work: `x ^ 0 == x`, `x ^ x == 0`, and commutativity with associativity. Together they explain the find-the-single-number trick — XOR every element of an array where each value appears twice except one, the pairs annihilate in any order, and the survivor is the answer. The same properties underlie parity checks and stream ciphers.

      ### Shifts

      `x << k` shifts bits toward the high end, filling with zeros, and is multiplication by `2ᵏ` when nothing shifts off the top. Right shift comes in two kinds: **logical** fills with zeros, **arithmetic** replicates the sign bit so negative numbers stay negative. In C and C++ a signed right shift is arithmetic on all mainstream implementations; in Java `>>` is arithmetic and `>>>` logical; unsigned types always shift logically.

      Shifting is *not* division for negative numbers: arithmetic right shift rounds toward negative infinity, while integer division in C, C++, Java, Go and Rust truncates toward zero. `-7 >> 1` is `-4`; `-7 / 2` is `-3`.

      ### Masks and the identities worth deriving

      Four operations cover most real uses, where `m = 1u << k`:

      ```c
      bool test  = (x & m) != 0;   // is bit k set
      x |=  m;                     // set bit k
      x &= ~m;                     // clear bit k
      x ^=  m;                     // toggle bit k
      unsigned f = (x >> lo) & ((1u << width) - 1);  // extract a field
      ```

      Subtracting 1 flips the lowest set bit to 0 and turns every zero below it into a 1, so **`x & (x - 1)` clears the lowest set bit** — the basis of Kernighan's population-count loop, which runs once per set bit — and **`x & (x - 1) == 0` tests for a power of two**, given a non-zero check. In two's complement `-x` is `~x + 1`, which leaves everything below the lowest set bit unchanged and inverts everything above, so **`x & -x` isolates that bit**. Population count and leading/trailing-zero counts map to single instructions, so use the built-ins (`std::popcount`, `Integer.bitCount`, `int.bit_count()`, `count_ones()`).

      ### Bitsets, bitmask DP and flags

      An integer is a set over a universe of up to 64 elements: union is `|`, intersection is `&`, difference is `a & ~b`, membership is a test, cardinality is a popcount. That makes travelling-salesman-style DP over subsets feasible, indexed by a mask of visited nodes. Iterating submasks has a neat idiom: `for (int s = m; s; s = (s - 1) & m)` visits every subset of `m` exactly once. Flags work the same way — file permissions, feature toggles, event masks — which is why APIs take an `int flags` of power-of-two constants. Keep one distinction straight: bit *order* within a byte is a naming convention, unrelated to byte order, which concerns multi-byte values in memory.

      ### The mistakes people actually make

      **Shifting by the width or more.** `x << 32` on a 32-bit type is undefined behaviour in C and C++, and in practice often shifts by `32 % 32 == 0`, returning `x` unchanged. Your masking code silently does nothing.

      **Precedence.** `&`, `|` and `^` bind *looser* than `==`, so `if (x & 1 == 0)` parses as `x & (1 == 0)` — that is `x & 0`, always false. Parenthesise.

      **Signed bitmasks.** With a signed type, `1 << 31` overflows and right shifts sign-extend, filling your mask with ones. Use unsigned types for masks.

      **Cleverness that buys nothing.** Replacing `x / 2` with `x >> 1` gains no speed — the compiler already does it, and does it correctly for negatives, which your version may not.

      **What you can do after this:** implement a subset-enumeration DP over a bitmask, and explain in one sentence each why `x & -x` isolates the lowest set bit and why `x & (x - 1)` clears it.
