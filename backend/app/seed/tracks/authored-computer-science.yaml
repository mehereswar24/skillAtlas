  - slug: computer-science-system-design
    name: System Design
    domain: computer-science
    est_hours: 20
    difficulty: advanced
    prerequisites:
      - computer-science-distributed-systems
      - computer-science-caches
      - computer-science-databases
    summary: 'A repeatable method for designing a system at scale: clarify requirements, estimate, define the contract and data model, then scale in response to a named bottleneck and state the trade-offs you accepted.'
    content_md: |-
      System design is usually taught as a gallery of architectures, which is why so many designs end up as a load balancer, three services, a cache and a queue regardless of the problem. It is better understood as a method. The architecture is the *output*; what you are actually being assessed on — in an interview and on the job — is whether you asked the questions that make one architecture better than another here.

      ### The method, in order

      **Clarify requirements.** Functional (what must it do) and non-functional (how many users, what latency, what availability, what consistency, what durability, what it may cost). Vague requirements are the request, not the answer: push back and write down the numbers you were given.

      **Estimate the scale.** Back-of-the-envelope figures decide almost every later choice: daily active users, requests per second at peak (peak is typically several times the average), read-to-write ratio, average payload size, storage growth per year, and bandwidth. A system with a 1000:1 read/write ratio has a completely different design from one at 1:1, and you cannot know which caching or replication strategy is right until you know that number.

      **Define the API before the boxes.** A handful of endpoints or messages with their parameters forces you to be concrete about what the system does. It also surfaces pagination, idempotency and authorisation early.

      **Design the data model and choose storage from the access pattern.** Which queries must be fast? Which must be transactional? Do you need range scans, secondary indexes, full-text search, or time-ordered appends? Choose the engine from that, not from familiarity.

      **Draw the high-level design.** Client, edge, services, data stores, asynchronous paths.

      **Scale in response to a bottleneck you can name.** This is the discipline that separates a design from a shopping list. Add a cache because the read path hits the same rows repeatedly at a measured ratio. Shard because a single primary cannot hold the write volume or the dataset. Add a queue because a slow downstream must not block the request path. If you cannot name the bottleneck, you are guessing.

      **State the trade-offs and failure modes.** What breaks when the cache is cold, the queue backs up, a region goes down, or a shard becomes hot.

      ### What the building blocks are actually for

      Load balancers: L4 routes connections, L7 can route on path/header and terminate TLS; both need health checks and a policy (round robin, least connections, consistent hashing for cache affinity). Stateless services matter because state in the process prevents you from adding a machine; push state to a store and horizontal scaling becomes arithmetic. CDNs move bytes closer and absorb the static load entirely. Message queues and log-structured streams decouple producer from consumer and level bursty load, at the cost of eventual consistency and delivery semantics you must think about (at-least-once is the practical default, so consumers must be idempotent). Object storage for blobs, never the database. Rate limiting (token bucket for burst tolerance, leaky bucket for smoothing) protects everything behind it.

      ### Data and architecture decisions

      Sharding strategy is the decision hardest to reverse: pick a key that spreads load and keeps the queries you care about within a single shard, and know that resharding is a migration project. Read replicas add read capacity but introduce replication lag, so a user who writes then immediately reads may not see their own change unless you route that read to the primary.

      On services: start with a monolith. Microservices solve an *organisational* problem — independent deployment for independently staffed teams — and charge for it in network calls, distributed transactions, and debugging that now requires tracing. Extract a service when a team boundary or a genuinely different scaling profile demands it. CQRS and event sourcing earn their place when reads and writes have divergent shapes or when the audit log is the product, and are overhead otherwise.

      ### Operability is part of the design

      Availability targets have costs: three nines is about 8.8 hours of downtime a year, four nines is about 53 minutes, and each nine multiplies the redundancy and the process discipline required. Design for graceful degradation — serve stale data, disable the recommendation panel, queue the write — rather than a binary up/down. Define SLIs and SLOs, instrument with metrics, structured logs and distributed traces, and choose a deployment strategy (blue-green, canary) that lets you detect a bad release before all users get it.

      ### A worked shape

      For a news feed, the whole design turns on one decision. *Fan-out on write* materialises each follower's feed when a post is created: reads are cheap, but a celebrity with ten million followers triggers ten million writes. *Fan-out on read* assembles the feed at request time: writes are cheap, reads are expensive. The real answer is hybrid — fan out on write for ordinary accounts, merge high-fan-out accounts in at read time — and you can only justify that once you have said the read/write ratio out loud.

      ### The mistakes people actually make

      Drawing boxes before establishing the read/write ratio and the peak QPS. Adding a cache, a queue and sharding pre-emptively so there is nothing left to say when asked how you would scale. Ignoring the failure story entirely — a design with no answer for "what happens when this store is unavailable" is incomplete. Designing for a billion users when the product has a thousand, which is real cost paid for imaginary scale. And choosing the datastore first, then bending the access pattern to fit it.

      **What you can do after this:** take a one-line product requirement, produce the estimates and API that constrain the design, and defend each component by naming the specific bottleneck it removes and the failure mode it introduces.
