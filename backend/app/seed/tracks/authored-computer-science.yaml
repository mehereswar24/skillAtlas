  - slug: computer-science-theory-of-computation
    name: Automata, Languages and Computability
    domain: computer-science
    est_hours: 14
    difficulty: advanced
    prerequisites:
      - computer-science-basic-math-skills
    summary: Work through the machine models behind regular expressions, parsers and computability itself, and be able to prove what a given model cannot do — including why no static analyser can be sound, complete and terminating at once.
    content_md: |-
      Two things you rely on daily rest directly on this material. Your regex engine and your language's lexer are finite automata; your compiler's parser is a pushdown automaton. And every static analyser you have used has false positives for a reason that is provable rather than accidental.

      The organising idea is the **Chomsky hierarchy**: a ladder of language classes where each rung has a machine model recognising exactly that class and a grammar generating exactly it. Regular languages sit at the bottom with finite automata; context-free languages above them with pushdown automata; recursively enumerable languages at the top with Turing machines. Each step up buys expressive power and costs decidability.

      ### Finite automata and regular languages

      A **DFA** is a finite set of states, an alphabet, a transition function taking exactly one state per symbol, a start state and accepting states. It has no memory beyond its current state. An **NFA** may have several transitions on a symbol, or epsilon transitions on none.

      NFAs look more powerful and are not. The **subset construction** proves it: build a DFA whose states are *sets* of NFA states, so one DFA state tracks every NFA state simultaneously reachable. It is exponential in the worst case but always terminates, which is why NFAs are the convenient specification and DFAs the efficient implementation. DFAs also minimise to a unique smallest form, so two regular languages can be compared mechanically. Kleene's theorem closes the circle: regular expressions, NFAs, DFAs and regular grammars describe exactly the regular languages, which are closed under union, concatenation, star, intersection and complement.

      The **pumping lemma** proves a language is *not* regular. If a DFA with `p` states accepts a string of length at least `p`, it must repeat a state, so the loop between those visits can be pumped any number of times and stay in the language. Balanced parentheses fails this: pump the openers in `(^p )^p` and the counts stop matching. A machine with finitely many states cannot count without bound.

      ### Pushdown automata and context-free grammars

      Add one unbounded stack and you get a **pushdown automaton**, which recognises exactly the context-free languages; the stack is what matches nesting. A **context-free grammar** generates the same class through productions on non-terminals. A derivation has a **parse tree**, and a grammar is **ambiguous** when some string has two distinct trees — dangling-else is the classic case, resolved in practice by precedence declarations.

      There is a pumping lemma for context-free languages too, and it shows `a^n b^n c^n` is not context-free. This is why programming-language *syntax* is context-free but *type correctness* is not: checking that every identifier was declared needs unbounded memory of arbitrary names, which a stack discipline cannot give you. That job goes to a separate semantic pass.

      ### Turing machines and the Church-Turing thesis

      A **Turing machine** adds an unbounded read/write tape with a movable head; a configuration is the tape contents, head position and state. The **Church-Turing thesis** claims anything effectively computable is computable this way. It is not a theorem but a claim about an informal notion, and every model since — lambda calculus, register machines, your laptop — has proved equivalent. A **universal Turing machine** takes a machine description plus input and simulates it: the stored-program idea. A language is **decidable** if some machine always halts with the right answer and **recognisable** if it halts on members but may run forever on non-members. That gap is where the trouble lives.

      ### Undecidability, and why your linter is wrong sometimes

      **Diagonalisation** constructs a language differing from every machine's language somewhere, so some languages are not recognisable at all. The **halting problem** is the concrete case: assume `H(M, x)` decides whether `M` halts on `x`, build `D(M)` that calls `H(M, M)` and loops forever exactly when `H` says halt, then run `D(D)`. Either answer contradicts itself.

      From there, **reduction** is the workhorse — show a decider for your problem would decide halting. **Rice's theorem** generalises it: every non-trivial semantic property of a program's behaviour is undecidable. That is the formal reason no analyser is simultaneously sound, complete and terminating. Real tools pick two, so type checkers reject some correct programs and linters miss some real bugs.

      ### The mistakes people actually make

      Assuming "regex" means regular. Backreferences and recursive subpatterns push the feature set past regular languages, and backtracking engines then blow up exponentially — `^(a+)+$` against many `a` followed by `b` is the standard catastrophic case. Automata-based engines like RE2 avoid it by refusing those features.

      Parsing nested structures with a regular expression. HTML, JSON and source code nest without bound; anything that appears to work is limited to a fixed depth.

      Reading "undecidable" as "hard". It means no algorithm exists at any running time — a different axis from NP-hard. And expecting a type checker to catch every runtime error: Rice's theorem says it cannot.

      **What you can do after this:** given a language, decide whether it is regular, context-free or neither, and back the answer with a construction or the appropriate pumping-lemma argument.
