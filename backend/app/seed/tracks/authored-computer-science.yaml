# scripts/import_roadmapsh.py — the importer skips any roadmap that has an
# `authored-<slug>.yaml` file, which is what makes this file the
# computer-science track.
#
# Written independently from primary sources and publicly documented university
# syllabi (MIT OCW, CMU, Princeton algs4, OSTEP, CS:APP, nand2tetris, RFCs,
# IEEE 754, the Unicode standard). The progression is our own: the machine and
# data representation come first rather than last, discrete mathematics is a
# prerequisite rather than an afterthought, balanced trees sit next to trees,
# and the systems pillar (OS, caching, networking, security, databases,
# distributed systems) is taught as a pillar rather than appended.
#
# Concept slugs are load-bearing: projects, company focus areas and role skills
# reference them by name. Slugs may be repurposed, never dropped.

track:
  slug: computer-science
  title: Computer Science Foundations
  domain: computer-science
  target_role: Software Engineer (Computer Science Fundamentals)
  difficulty: intermediate
  description: 'A 37-step computer science core built bottom-up in four pillars: the machine and how data is represented, the mathematics and algorithmic toolkit, the theory of what is computable and at what cost, and the systems layer — operating systems, caching, networking, security, databases and distributed systems — that everything real is built on, closing with design and the practice of communicating an architecture.'
concepts:
  - slug: computer-science-pick-a-language
    name: Choosing a Language to Learn CS In
    domain: computer-science
    est_hours: 4
    difficulty: beginner
    prerequisites: []
    summary: Decide which language or pair of languages to study computer science through, understanding what each one exposes and what it hides, so that you can commit to a choice and reach fluency instead of restarting every few weeks.
    content_md: |-
      This is a decision, not a tutorial. You are not picking a syntax to memorise; you are picking a lens, and the lens decides which parts of a computer you can see at all. A language that manages memory for you will teach you a great deal about algorithms and almost nothing about memory layout, because the mechanism you would be studying has been deliberately hidden.

      So the choice is worth thinking about once, carefully, and then not revisiting for a year. Most people who fail to learn computer science do not fail on the material; they fail by re-choosing.

      ### What a language exposes and what it hides

      Five axes matter more than syntax. **Memory management**: manual (C, C++), automatic (Python, Java, JavaScript, Go), or compile-time ownership (Rust) — only the first and third let you observe allocation and lifetime directly. **Typing discipline**: static types are checked before the program runs and force you to state the shape of data; dynamic types defer that to runtime. **Execution model**: compiled ahead of time (C, Rust, Go), interpreted over a bytecode VM (CPython), or JIT-compiled (JVM, V8) — this decides whether you can reason about the instructions your source becomes. **Value versus reference semantics**: whether assignment copies the data or aliases it, the commonest source of "why did my copy change?". **How much the runtime hides**: a garbage collector, a scheduler, bounds checks and dynamic dispatch are machinery you cannot study in a language that never shows it.

      ### Why the classic pairing is two languages

      The standard advice, and it is good advice, is one systems language plus one high-level language.

      The systems language — C traditionally, because it is small and maps closely onto the machine; Rust, Go or C++ also work — carries the concepts that are *about* the machine: pointers, stack frames, memory layout, byte order, undefined behaviour, and what a struct really is. Python correctly refuses to let you near any of them.

      The high-level language, usually Python, carries the concepts that are *about* ideas: algorithms, data structures, complexity, and anything where dictionaries, slices and arbitrary-precision integers let you write the idea in ten lines rather than eighty. Writing a red-black tree in C is a lesson in `malloc`, not in balancing.

      ### What transfers, and why fluency beats coverage

      Almost everything in a CS curriculum transfers. Big-O, hash tables, recursion, graph algorithms, concurrency hazards and the memory hierarchy are properties of computation, and relearning them in a second language takes days. What does *not* transfer is idiom — Python's comprehensions, Rust's borrow checker, Go's goroutines, C++'s move semantics — so treat time spent on idiom as separate from time spent on CS.

      Interviews almost always accept any mainstream language; what they do not accept is hesitancy. Being fluent in one, able to write a hash map, a comparator and a BFS without looking anything up, beats being vague in four.

      ### The mistakes people actually make

      **Switching every few weeks.** You believe the next language will make the material click, so you restart with new tooling and never build the muscle memory that makes hard topics tractable. Fluency arrives roughly where most people quit.

      **Treating a popularity ranking as a syllabus.** Which language grew fastest last year says nothing about which one exposes pointer arithmetic. Popularity is a hiring signal, not a pedagogical one.

      **Learning a framework and calling it computer science.** React hooks and Django's ORM are valuable and are not CS. If you cannot say what the framework does underneath, you have learned an API.

      **Choosing C++ as a first language.** You spend the first month on CMake, headers, linker errors and template diagnostics — real skills, but not the ones you came for. Learn C or Python first.

      **What you can do after this:** state, in two sentences, which language you will write systems-level exercises in and which you will write algorithm exercises in, and justify each by naming a specific mechanism it exposes or hides.
