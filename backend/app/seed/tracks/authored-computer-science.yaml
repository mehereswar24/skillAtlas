  - slug: computer-science-design-patterns
    name: Object-Oriented Design, SOLID and Design Patterns
    domain: computer-science
    est_hours: 12
    difficulty: intermediate
    prerequisites:
      - computer-science-pick-a-language
    summary: 'Design code so that the parts most likely to change are isolated: cohesion and coupling, the SOLID principles, the classic pattern catalogue, and a clear sense of when a pattern is the wrong answer.'
    content_md: |-
      Every design principle in this concept serves one goal: make the change you will be asked for next cheap. Code is read and modified far more than it is written, so the measure of a design is not how clever it is but how localised the damage is when a requirement moves.

      Two properties capture most of it. **Cohesion** is how strongly the contents of one module belong together; high cohesion means a change has one obvious home. **Coupling** is how much one module depends on the internals of another; low coupling means that change does not ripple. Almost every principle below is a specific tactic for raising cohesion or lowering coupling.

      ### The object-oriented substrate

      Encapsulation hides representation so it can change; abstraction exposes intent rather than mechanism; polymorphism lets a caller work with a family of implementations. Inheritance is the one to be careful with.

      The Liskov substitution principle says a subtype must be usable anywhere its supertype is, without the caller knowing. The classic violation: `Square extends Rectangle`. Setting the width of a rectangle should not change its height, but for a square it must, so any caller that sets width and height independently breaks. The subtype satisfies the *interface* and violates the *contract*.

      That is one reason to prefer **composition over inheritance**. Inheritance couples you to a base class's implementation, so a change there breaks subclasses at a distance (the fragile base class problem), and deep hierarchies force every behaviour into a single axis of variation. Composition — holding a collaborator and delegating — lets behaviours vary independently and be swapped at runtime.

      ### SOLID, with the symptom each addresses

      - **Single responsibility**: a class should have one reason to change. Symptom: a class that gets edited by three different teams for three unrelated reasons.
      - **Open/closed**: extend behaviour without editing existing code. Symptom: a growing `switch` on a type tag that must be edited for every new case.
      - **Liskov substitution**: as above. Symptom: `if (x instanceof Special)` inside code that claims to be generic.
      - **Interface segregation**: many small interfaces beat one large one. Symptom: implementations full of methods that throw `NotSupported`.
      - **Dependency inversion**: depend on abstractions, not concretions. Symptom: a business rule that cannot be tested without a live database.

      Applied literally and universally, SOLID produces a codebase of single-method classes and interfaces with one implementation. Apply them as diagnoses for pain you actually have.

      ### The pattern catalogue as vocabulary

      Patterns are named solutions to recurring problems; their main value is communication. Grouped by what varies:

      **Creational** — what gets constructed. *Factory method* and *abstract factory* defer the choice of concrete class; *builder* handles many optional parameters without a telescoping constructor; *prototype* clones. *Singleton* deserves a warning: it is global mutable state with a nice name, it hides dependencies, and it makes tests order-dependent. Prefer one instance injected by the composition root.

      **Structural** — how objects are wired. *Adapter* makes an incompatible interface fit; *decorator* adds behaviour without subclassing (logging, caching, retry wrappers); *facade* gives a simple entry point to a complex subsystem; *proxy* controls access; *composite* lets a tree be treated like a leaf; *bridge* separates abstraction from implementation; *flyweight* shares immutable state to save memory.

      **Behavioural** — how objects collaborate. *Strategy* swaps an algorithm; *observer* notifies dependents (the model behind every event system); *command* reifies an action so it can be queued, logged or undone; *template method* fixes a skeleton and varies steps; *state* replaces a status flag and its `switch` with polymorphism; *iterator*, *visitor*, *chain of responsibility*, *mediator* and *memento* fill out the rest.

      **Dependency injection** deserves special mention: passing collaborators in rather than constructing them internally is what makes the difference between code you can unit test and code you cannot.

      ### Patterns are language-shaped

      In a language with first-class functions, *strategy* and *command* are just functions passed as arguments, and *observer* is a callback list. With immutable values you do not need defensive copying. Seeing this stops you from importing ceremony that a language feature already provides — which is exactly what makes translated-from-Java code look strange in Python or JavaScript.

      ### The mistakes people actually make

      The dominant one is applying a pattern because it has a name rather than because a problem exists — an `AbstractRequestHandlerFactoryProvider` in a codebase with one handler. Related: creating an interface for every class "for testability" when it will only ever have one implementation, which adds indirection and hides nothing. Others: using inheritance to reuse code rather than to express substitutability; a singleton that couples every test to execution order; and abstracting on the first occurrence — the useful discipline is to duplicate twice and abstract on the third, when you can actually see which axis varies. Refactor *toward* a pattern once the duplication is real, rather than designing for one up front.

      **What you can do after this:** look at a class that is painful to change, name the coupling or cohesion problem causing it, and pick the specific restructuring — extract a strategy, invert a dependency, replace a status flag with state objects — that removes it.
