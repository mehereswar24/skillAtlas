  - slug: computer-science-np-complete
    name: NP-Completeness and What to Do About It
    domain: computer-science
    est_hours: 10
    difficulty: advanced
    prerequisites:
      - computer-science-complexity-classes
    summary: Prove a problem NP-hard with a polynomial-time reduction in the correct direction, spot the classic hard shapes inside real requirements, and choose between SAT and ILP solvers, approximation, parameterised algorithms and heuristics.
    content_md: |-
      NP-completeness is usually taught as a wall: your problem is NP-complete, therefore stop. That is the wrong lesson. The useful skills are recognising a hard problem early — before you spend a fortnight hunting for an efficient algorithm that cannot exist — and knowing which of five well-developed engineering responses fits.

      ### Reductions, and the direction everyone gets backwards

      A **polynomial-time (Karp) reduction** from A to B is a polynomial-time function mapping instances of A to instances of B so that yes-instances map to yes-instances. Write it `A <= B`. It says B is at least as hard as A: an efficient algorithm for B solves A by transforming the input and calling it.

      So to prove *your* problem X is NP-hard, you reduce a **known** hard problem **to** X — you take 3-SAT and encode an arbitrary 3-SAT instance as an instance of X. Doing it the other way, reducing X to 3-SAT, proves only that X is in NP, the easy and uninteresting half. Almost everyone gets this backwards at first; when in doubt ask "if I had a fast solver for X, what would that let me solve?"

      **NP-hard** means everything in NP reduces to it. **NP-complete** means NP-hard *and* in NP. The halting problem is NP-hard but not NP-complete, since it is not in NP — it is not even decidable.

      ### Cook-Levin and a worked reduction

      The **Cook-Levin theorem** (1971) established SAT as NP-complete by encoding the computation of any polynomial-time non-deterministic verifier as a Boolean formula: variables for tape contents at each step, clauses forcing consistency and legal transitions. Karp then derived 21 more by reduction, and the family now runs to thousands: 3-SAT, clique, independent set, vertex cover, Hamiltonian path, graph colouring, subset sum, knapsack, set cover, TSP, bin packing.

      **3-SAT to Independent Set** makes the mechanism concrete. Given a formula with `m` clauses, build a graph with one vertex per literal occurrence, three per clause. Join each clause's three vertices into a triangle, and add an edge between any two vertices holding contradictory literals such as `x` and `not x`. Ask for an independent set of size `m`. The triangles force exactly one vertex per clause into the set — the literal you satisfy — and the contradiction edges stop you picking `x` in one clause and `not x` in another. The graph has an independent set of size `m` exactly when the formula is satisfiable, and the construction is plainly polynomial. That is a complete hardness proof.

      ### Recognising hard shapes in a requirement

      Hardness rarely arrives labelled. Watch for **scheduling** with constraints, **routing** with a visit-everything rule, **timetabling** and room assignment, **packing** into bins, **assignment** where costs interact rather than staying independent, and **partitioning** or layout. The tell is a requirement combining "every" with "minimum" while forbidding independent decisions — once one choice constrains another, greedy and DP tend to break and you are near a covering or colouring problem.

      ### What to actually do about it

      - **Throw an exact solver at it.** Modern **SAT** solvers (CDCL: conflict-driven clause learning, restarts, watched literals), **SMT** solvers like Z3, **ILP/MIP** solvers and **constraint programming** routinely close industrial instances with millions of variables. Encoding and calling one usually beats a bespoke heuristic. DIMACS CNF input is trivial:

        ```
        p cnf 3 2
        1 -2 0
        2 3 0
        ```

        **Branch and bound** underpins these: search the tree, bound each node, prune when the bound cannot beat the incumbent.
      - **Approximate with a guarantee.** Greedy set cover is a `ln n`-approximation; vertex cover and metric TSP have 2-approximations. Inapproximability results say where you cannot do better — general TSP admits no constant-factor approximation unless P equals NP.
      - **Exploit a small parameter.** Vertex cover is **fixed-parameter tractable**, roughly `2^k` times polynomial for cover size `k`. If your hard dimension is small, exponential in *that* is fine.
      - **Use heuristics and metaheuristics** — greedy construction, local search, simulated annealing, tabu search, genetic algorithms. No guarantee, often excellent, and you can measure the gap against a bound.
      - **Restrict or relax.** Many NP-hard graph problems are polynomial on trees, interval graphs or bounded treewidth, and "within 2 percent" is often the real requirement.

      ### The mistakes people actually make

      Reducing in the wrong direction, then presenting a proof that proves nothing. Declaring a problem NP-hard because it "looks like TSP" — without an explicit reduction that is a hunch, and sometimes the special structure of your version is exactly what makes it polynomial. Writing a bespoke heuristic when an off-the-shelf SAT or ILP solver would have closed the real instances in seconds; decades of engineering went into those solvers and a weekend of yours will not match them. And assuming NP-hardness makes every instance hard, when real instances carry sparsity, locality and symmetry that solvers exploit ruthlessly.

      **What you can do after this:** given a business requirement, spot the NP-hard core, prove it by reduction from a canonical problem, and pick a solver, approximation or parameterised approach with a stated trade-off.
