  - slug: computer-science-string-search-manipulations
    name: String Matching Algorithms
    domain: computer-science
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - computer-science-character-encodings
      - computer-science-tries
    summary: |-
      Treat text as an algorithmic domain with its own structure. You will explain KMP,
      Z, Rabin-Karp, Boyer-Moore and Aho-Corasick by what each one reuses, and spot
      catastrophic regex backtracking before it becomes an outage.
    content_md: |-
      The naive substring search tries the pattern at every position and compares
      forwards: O(nm) worst case, and its defect is easy to name. On a mismatch at
      position 7 of the pattern, it has just learned that the previous six text
      characters matched — then throws that away, shifts by one and re-reads them.
      Every good string algorithm is a different answer to "what should we keep?"

      Search, log scanning, intrusion detection and DNA analysis all rest on these
      algorithms, and one of them — regular-expression matching — is a security concern
      rather than a slow one.

      ### KMP and Z: reuse what the pattern knows about itself

      **KMP** precomputes a *prefix function* over the pattern: `pi[i]` is the length
      of the longest proper prefix of `p[0..i]` that is also a suffix of it.

      ```
      p  = a  b  a  b  a  c  a
      pi = 0  0  1  2  3  0  1
      ```

      On a mismatch after k matched characters you already know the last `pi[k-1]`
      text characters match a prefix of the pattern, so you slide to that alignment and
      resume — never moving the text pointer backwards. That gives O(n + m), and `pi`
      is itself computed in O(m) by the same trick applied to the pattern.

      The **Z-algorithm** computes, for each position, the longest substring starting
      there that is also a prefix of the whole string. Run it on
      `pattern + separator + text`; every position where Z equals the pattern length is
      a match — equivalent in power, and often easier to derive.

      ### Rabin-Karp: compare hashes, then verify

      Hash the pattern once, then roll a hash over each window of the text: a rolling
      hash drops the outgoing character and adds the incoming one in O(1), usually as a
      polynomial hash modulo a large prime. Equal hashes mean *probably* equal strings,
      so you must still compare characters — skip that and your matcher reports matches
      that are not there. It wins where hashing amortises: many patterns of one length
      against one hash set, two-dimensional matching, plagiarism detection.

      ### Boyer-Moore: skip instead of scan

      **Boyer-Moore** compares *right to left*. On a mismatch the bad-character rule
      shifts the pattern so the offending text character aligns with its last
      occurrence in the pattern; if that character is absent entirely, the pattern
      jumps a whole length, never examining most of the text. The good-suffix rule adds
      a second, sometimes larger shift. On natural-language text the average behaviour
      is sublinear, which is why it sits under many `grep`-like tools and library
      searchers.

      ### Many patterns, and indexed text

      **Aho-Corasick** builds a trie of all patterns and adds failure links to the
      longest proper suffix that is also a trie node — KMP's prefix function
      generalised to a set. One linear pass finds every occurrence of every pattern,
      which is how virus scanners and keyword filters work.

      When the *text* is fixed and queries keep arriving, index the text: a **suffix
      array** plus an **LCP array** gives substring search by binary search, longest
      repeated substring and longest common substring, in far less memory than a suffix
      tree. Edit distance is the DP face of the same domain.

      ### Regular expressions, and ReDoS

      There are two families of engine. A **Thompson NFA** simulation tracks all
      possible states at once, in time proportional to text length times pattern size.
      Most mainstream engines instead **backtrack**, to support backreferences and
      lookaround — and backtracking can go exponential: nested quantifiers such as
      `(a+)+$` against a long run of `a` followed by a non-matching character force the
      engine to try every split of the run. That is **catastrophic backtracking**, and
      on user-supplied patterns or input it is a denial-of-service vulnerability —
      ReDoS. Defences: avoid nested and overlapping quantifiers, anchor patterns,
      impose a timeout or length limit, and where available use a linear-time engine
      such as RE2.

      Strings are immutable in Java, Python, C# and JavaScript, so `s += x` in a loop
      copies the whole string each time, making the loop quadratic; use a builder, a
      list plus a join, or a rope. And a byte index is not a character index outside
      ASCII.

      ### The mistakes people actually make

      Assuming the library `indexOf` is always fine, then meeting an adversarial input
      that triggers its quadratic worst case. Writing a rolling hash and skipping
      verification, so collisions become false matches. Putting a regex with nested
      quantifiers on a user-supplied field and turning a form into an outage. And
      slicing UTF-8 or UTF-16 by byte or code-unit offsets, splitting characters in
      half.

      **What you can do after this:** pick between KMP, Rabin-Karp, Boyer-Moore and
      Aho-Corasick for a given matching job, and identify a regex that can backtrack
      catastrophically on hostile input.
