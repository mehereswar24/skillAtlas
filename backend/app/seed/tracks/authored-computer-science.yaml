  - slug: computer-science-recursion
    name: Recursion, the Call Stack and Divide and Conquer
    domain: computer-science
    est_hours: 8
    difficulty: beginner
    prerequisites:
      - computer-science-data-structures
    summary: |-
      Trace recursion as machine state rather than magic: what a stack frame holds, how to write a
      recursion that provably terminates, how divide and conquer produces a recurrence, and when
      to memoise or convert to an explicit stack.
    content_md: |-
      Recursion feels like magic only until you can point at the machine state that makes it work. A
      recursive call is not mysterious: it is a stack frame pushed, a jump taken, and eventually a
      value written back into the suspended caller. Once you can draw the stack, recursion becomes
      the most direct way to write algorithms over anything defined in terms of smaller copies of
      itself — sorted halves, trees, nested documents, subproblems.

      ### The call stack, mechanically

      Each call pushes a frame holding its arguments, its locals, the return address and saved
      registers. A recursive call suspends the current frame exactly where it is, with its locals
      untouched, pushes a new frame, and resumes when the callee returns.

      So the locals at each depth are independent — "the recursive call overwrote my variable" is
      never the explanation — and depth costs memory. Thread stacks are typically around 1 MB on
      Windows and 8 MB by default on Linux; exhausting one is a stack overflow, in C or C++ an
      immediate crash. CPython caps recursion first with `sys.setrecursionlimit` (default 1000) and
      raises `RecursionError` before the real stack dies.

      ### Writing one that terminates

      Three obligations, in order. Write the base cases first — the inputs that return without
      recursing. Make every recursive call strictly smaller on some non-negative integer measure, so
      the measure cannot descend forever. Then assume the recursive call is correct for smaller
      inputs and check only that your combine step is right.

      That third obligation is strong induction, not an analogy for it: the base case is the base
      step and "assume correct for everything smaller" is the inductive hypothesis, so a correctness
      proof for a recursive function *is* an induction proof. Before trusting it, trace a size-3
      input by hand and draw the recursion tree — the shape of that tree is your complexity.

      ### Divide and conquer

      Split the input, recurse, combine. This is the dominant pattern and the one that generates the
      recurrences you learned to solve. Binary search takes one subproblem of half the size with an
      `O(1)` combine: `T(n) = T(n/2) + O(1) = Theta(log n)`. Merge sort takes two halves with a
      `Theta(n)` merge: `T(n) = 2T(n/2) + Theta(n) = Theta(n log n)`. Closest pair of points
      presorts, splits by a vertical line, recurses on both halves, then checks only points within
      the best distance found so far of the line — again `2T(n/2) + Theta(n)`. The recurrence falls
      out of the code: count the calls, note the fraction each gets, measure the work outside them.

      ### Tail recursion, and converting to iteration

      A call is in *tail position* if its result is returned directly with nothing left to do
      afterwards. The caller's frame is then dead and can be reused, so tail-call optimisation turns
      the recursion into a loop with constant stack. Scheme requires it; many functional language
      implementations provide it; the JVM does not; CPython deliberately does not; C and C++
      compilers usually do it at `-O2` without guaranteeing it.

      Where it is unavailable, convert mechanically: replace the frame with an explicit stack holding
      exactly the state you would have saved, and loop while the stack is non-empty. Mutual recursion
      (an `is_even`/`is_odd` pair, or a recursive-descent parser whose `expr`, `term` and `factor`
      call each other) behaves identically; the call tree just alternates.

      ### Memoisation, the bridge to dynamic programming

      Naive Fibonacci recomputes `fib(3)` an exponential number of times; its call tree has on the
      order of `1.618^n` nodes. Caching results by argument collapses that tree, because each
      distinct subproblem is computed once and reused. The cost becomes the number of distinct
      subproblems times the work per subproblem — `Theta(n)` here.

      ```python
      from functools import cache

      @cache
      def fib(n):
          return n if n < 2 else fib(n - 1) + fib(n - 2)
      ```

      That is top-down dynamic programming; the bottom-up table evaluates the same recurrence in
      dependency order. The trigger is *overlapping subproblems* — the same argument under more than
      one branch. Merge sort has none, so caching it buys nothing. Where the data itself is
      recursive, depth is bounded by height rather than size.

      ### The mistakes people actually make

      - A base case some inputs skip past: testing `n == 0` while stepping `n -= 2` never terminates
        for odd n. Test the boundary, not the typical case.
      - A recursive call that does not shrink the problem — passing the same collection, or slicing
        off nothing on an edge case — giving infinite recursion.
      - Not recognising overlapping subproblems, and shipping exponential Fibonacci-shaped code.
      - Recursing once per element over a list of a million nodes. The algorithm is correct and the
        process dies; use a loop.
      - Passing a large structure by value at every level. `helper(arr[1:])` copies, turning a
        `Theta(n)` recursion into `Theta(n^2)` in time and space — pass indices instead.
      - Claiming `O(1)` auxiliary space while d frames sit on the stack.

      **What you can do after this:** take a recursive function, draw its call tree, write the
      recurrence it implies, decide whether it needs memoisation or an explicit stack, and predict
      whether it will overflow on your largest realistic input.
