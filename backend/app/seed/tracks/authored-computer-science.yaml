  - slug: computer-science-distributed-systems
    name: 'Distributed Systems: Failure, Replication and Consensus'
    domain: computer-science
    est_hours: 16
    difficulty: advanced
    prerequisites:
      - computer-science-networking
      - computer-science-databases
    summary: 'Reason about systems whose parts fail independently: partial failure, logical time, consistency models, replication and sharding, and the consensus algorithms that make a group of machines agree.'
    content_md: |-
      A single machine has a convenient property: when it fails, all of it fails, and your code stops. The defining feature of a distributed system is that this stops being true. One node crashes while the others keep running, one network link drops packets while the rest deliver them, and a request you sent may have been executed, may have been executed twice, or may never have arrived — and from where you are standing, all three look identical.

      Almost every counter-intuitive result in this field is a consequence of that one fact. If you understand partial failure and the absence of a shared clock, the rest of the subject is engineering.

      ### Partial failure and why idempotency is not optional

      When a request times out, you have learned nothing about whether the work happened. The server may have crashed before processing, after processing but before replying, or the reply may have been lost in transit. A timeout is an *unknown*, not a failure.

      The only safe response is to make the operation safe to repeat. Either it is naturally idempotent (setting a value, deleting by id) or you make it so with a client-supplied idempotency key that the server records alongside the effect, so a retry with the same key returns the original result instead of charging the card twice. Retries without this are how duplicate orders get created.

      Failure models are worth naming because the algorithm you need depends on which you assume: *crash-stop* (a node halts and stays halted), *crash-recovery* (it comes back, possibly with stale state), *omission* (messages are lost), and *Byzantine* (a node behaves arbitrarily or maliciously, which is the model blockchains need and most internal systems do not).

      ### There is no global clock

      Machine clocks drift, and NTP corrects them by stepping or slewing, so wall-clock time can move backwards. Ordering two events on different machines by comparing timestamps is therefore unsound, and "last write wins" implemented with wall-clock time silently discards data.

      Logical clocks fix the ordering problem without needing synchronised time. A Lamport timestamp is a counter incremented on every local event and carried on every message, which guarantees that if event A caused event B then A's timestamp is smaller — but not the converse. Vector clocks carry one counter per node and can therefore distinguish *causally ordered* from *genuinely concurrent* updates, which is what you need to detect a conflict rather than paper over it. Hybrid logical clocks combine the two so the values still resemble real time.

      ### Consistency models

      "Consistent" is not a boolean. The useful models, from strongest down:

      - **Linearizability**: every operation appears to take effect at a single instant between its invocation and its response, so the system behaves like one machine. Expensive; requires coordination.
      - **Sequential consistency**: all nodes see the same order, but it need not match real time.
      - **Causal consistency**: operations that are causally related are seen in order everywhere; concurrent ones may differ. Often the sweet spot.
      - **Eventual consistency**: replicas converge if writes stop. That is a much weaker promise than most people hear.

      Session guarantees — read-your-writes, monotonic reads, monotonic writes — are the pragmatic middle ground that makes an eventually consistent store feel sane to one user.

      CAP is routinely misquoted. It says nothing about normal operation: *when a network partition occurs*, you must choose between remaining available and remaining linearizable. PACELC is the more useful statement, because it adds the part that matters daily — Else, when there is no partition, you trade Latency against Consistency.

      ### Replication, partitioning and consensus

      Replication gives you availability and read capacity. Leader-follower is the common case; synchronous replication costs latency and gives durability, asynchronous replication is fast and can lose the tail of the log on failover. Multi-leader and leaderless (quorum, `R + W > N`) designs accept concurrent conflicting writes, so they need a resolution strategy — last-write-wins loses data, while CRDTs are designed so that concurrent updates merge deterministically without losing any.

      Partitioning splits data by hash (even spread, no range scans) or by range (range scans work, hot spots likely). Consistent hashing with virtual nodes limits how much data must move when a node joins or leaves.

      Consensus is the problem of getting a group to agree on one value despite failures. The FLP result proves no deterministic algorithm can guarantee agreement in an asynchronous system with even one crash failure — which is why real algorithms use timeouts and are *practically* live rather than provably so. Raft is the version to learn: leader election by randomised timeout, log replication with a majority quorum, and a small set of safety invariants. In practice you do not implement it; you use etcd or ZooKeeper for leadership, configuration and locks, and keep it off the data path.

      Distributed transactions are the sharpest trade-off. Two-phase commit is atomic but blocks if the coordinator dies mid-round. Sagas replace atomicity with a sequence of local transactions plus compensating actions, and the transactional outbox pattern gets you atomic "change state and publish an event" using only a local transaction.

      ### The mistakes people actually make

      The most expensive one is treating a timeout as a failure and retrying a non-idempotent operation — this is where duplicate payments come from. Close behind is a retry storm: every client retrying immediately on error multiplies load exactly when the system is weakest, which is why exponential backoff *with jitter*, per-request timeout budgets and circuit breakers exist. Others: ordering events across machines by wall-clock timestamp; choosing last-write-wins and being surprised when concurrent edits vanish; assuming a healthy load balancer health check means the dependency behind it is healthy; and writing your own consensus protocol, which is a research project disguised as a sprint task.

      **What you can do after this:** look at a failing distributed call and say precisely what is unknown about its outcome, then choose the specific mechanism — idempotency key, backoff with jitter, quorum read, saga compensation — that makes the uncertainty safe.
