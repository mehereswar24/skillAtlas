  - slug: computer-science-back-tracking
    name: Backtracking, Pruning and Branch and Bound
    domain: computer-science
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - computer-science-recursion
    summary: |-
      Search a space exhaustively without paying for all of it. You will write the
      choose-explore-unchoose template correctly, add feasibility and bound-based
      pruning, and use branch and bound to cut branches that cannot beat the best found.
    content_md: |-
      Some problems have no clever formula: you have to try things. Backtracking is the
      disciplined way to try everything — build a solution one decision at a time, and
      the moment it cannot lead anywhere, abandon it and undo the last decision. It is
      depth-first search on a tree that is never materialised, where each node is a
      partial solution and each edge one more committed choice.

      The important consequence is about cost. The state-space tree may hold
      astronomically many nodes, but you pay only for the nodes you actually visit. So
      the algorithm is not the interesting part; the pruning is. A backtracking
      solution with no pruning is brute force with extra steps.

      ### The template, and where the bugs are

      ```python
      def search(path, used):
          if len(path) == n:
              out.append(path[:])                # copy, never the live list
              return
          for i in range(n):
              if used[i] or not feasible(path, i):
                  continue
              path.append(a[i]); used[i] = True  # choose
              search(path, used)                 # explore
              path.pop();       used[i] = False  # un-choose
      ```

      Choose, explore, un-choose. The un-choose step exists because `path` and `used`
      are shared across every branch below this node. Miss one undo and the corruption
      surfaces in a *sibling* branch, far from the line that caused it.

      ### Pruning is the whole game

      **Feasibility pruning** rejects a partial solution that already violates a
      constraint — a queen already attacked, a Sudoku digit already in the row, a grid
      path that has left the board. Cheap and always worth it.

      **Bound-based pruning** is stronger: compute an optimistic estimate of the best
      achievable completion from here, and if even that cannot beat what you already
      have, cut the branch.

      **Constraint propagation** goes further by deducing consequences before
      branching. In Sudoku, filling a cell removes that digit from its row, column and
      box; an empty cell left with zero candidates fails immediately, and one with
      exactly one candidate is filled without branching.

      ### Worked examples, with the pruning named

      **Subsets and permutations** are the base cases. For inputs with duplicates the
      rule is: sort first, then at each level skip a candidate equal to the previous
      sibling you tried — generating each distinct arrangement once instead of
      deduplicating afterwards. **N-queens** becomes fast when you replace the O(n)
      "is this square attacked" scan with three boolean arrays indexed by column, by
      `row + col` and by `row - col + n`, making the test O(1). **Sudoku** benefits
      from most-constrained-variable ordering: branch on the empty cell with the fewest
      candidates, shrinking the branching factor at the top of the tree where it costs
      most. **Graph colouring**, **word search on a grid** — where marking a cell
      in-use and unmarking it on the way out is the classic undo — and **combination
      sum**, where sorting lets you break out once a candidate exceeds the target.

      ### Branch and bound

      For optimisation rather than enumeration, keep the best complete solution found
      so far — the *incumbent*. At each node compute a bound on the best value any
      completion of this branch could reach; if the bound is no better than the
      incumbent, prune. For knapsack the bound is the fractional-knapsack value of
      the remaining items, which is greedily computable and always optimistic. For
      travelling salesman a common bound sums, over the unvisited vertices, the
      cheapest incident edges. A better incumbent found early prunes far more, which is
      why running a quick heuristic first pays for itself.

      Related tools: **iterative deepening** runs depth-limited searches with a growing
      limit, giving DFS's memory with BFS's shallowest-solution-first order. When the
      space is genuinely hopeless, drop exhaustiveness — randomised restarts, simulated
      annealing or local search return a good answer with no optimality proof.

      Backtracking is DFS over an implicit tree; DP is what you use instead when
      subtrees repeat and can be reused rather than re-explored.

      ### The mistakes people actually make

      Forgetting to undo a mutation, so a later sibling branch searches a state
      poisoned by an earlier one — and the symptom appears nowhere near the cause.
      Deep-copying the entire state at every node "to be safe", which turns an
      acceptable search into an unacceptable one because the copy cost multiplies by
      the number of nodes. Writing no pruning at all and calling the result
      backtracking. And appending the live working list to the results instead of a
      copy, so every stored answer mutates into the same final value.

      **What you can do after this:** take a brute-force search, add feasibility and
      bound-based pruning, and explain which specific branches each rule removes.
