  - slug: computer-science-memory-management
    name: 'Memory: Stack, Heap, Pointers and Garbage Collection'
    domain: computer-science
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - computer-science-how-computers-work
      - computer-science-pick-a-language
    summary: Map the process address space and the lifetime rules that govern it — stack frames, heap allocation, ownership and garbage collection — so that you can diagnose leaks, aliasing bugs and stack overflows in managed and unmanaged languages alike.
    content_md: |-
      Most bugs that feel mysterious are memory-model bugs. "I copied the list and modifying the copy changed the original." "It works for small inputs and crashes for large ones." "The service leaks even though the language has a garbage collector." None of these are explicable from the source line where the symptom appears, and all of them are obvious once you know where the data lives and who is allowed to destroy it.

      This is not only about C. Ownership and aliasing exist in every language; the difference is whether the language checks them for you.

      ### The address space and the stack

      A running process sees a flat virtual address space: the **code** segment holding instructions, **static data**, the **heap** growing upward, and the **stack** growing down from the high end, with unmapped space between them — touching it is a segmentation fault. Virtual addresses are translated to physical pages by the MMU, which is why two processes can both use address `0x400000`.

      Each call pushes a **stack frame** holding the return address, saved registers, arguments that did not fit in registers, and locals. The calling convention specifies which registers carry arguments and who saves what. Allocation is a single pointer subtraction, which is why a local array is essentially free and why locals vanish the instant the function returns. The stack is bounded, typically to a few megabytes, so recursion depth proportional to input size — a DFS over a million nodes, a recursive descent over a deeply nested document — exhausts it and gives a **stack overflow**. The fix is an explicit stack on the heap, or an iterative formulation.

      ### The heap and its failure modes

      The heap serves objects whose lifetime is not tied to a scope. An allocator maintains free lists, size classes and bookkeeping metadata, requesting pages from the OS in bulk and handing out pieces. That makes an allocation far more expensive than a stack bump, and it can degrade through **fragmentation**, where enough total free memory exists but no single contiguous block is large enough.

      Manual management has a known catalogue of failures: null dereference; a **dangling pointer** into memory already freed; **use-after-free**, a common exploitation primitive; **double free**, which corrupts allocator metadata; **buffer overflow**, which writes past an allocation and can overwrite a return address; and **leaks**, where nothing frees a block that is no longer reachable.

      ### Values, references and copying

      A variable either holds a value or holds a reference to one, and that single distinction explains a large share of everyday confusion:

      ```python
      a = [[1, 2], [3, 4]]
      b = list(a)      # shallow copy: b holds the SAME inner lists
      b[0].append(9)   # a[0] is now [1, 2, 9]
      ```

      A **shallow copy** duplicates the outer container and shares the referenced children; a **deep copy** duplicates the whole graph. Python, Java and JavaScript pass object references by value, so mutation through any alias is visible through all of them. C++ makes the choice explicit with value types, references, and copy and move constructors.

      ### Ownership models and garbage collection

      Languages differ in who frees. **Manual** (C): you call `free`, exactly once, at the right time. **Scope-bound / RAII** (C++): a destructor runs at end of scope, so `std::unique_ptr` and `std::vector` free deterministically. **Compile-time ownership** (Rust): each value has one owner and borrows are checked statically, rejecting use-after-free at compile time with no runtime cost. **Reference counting** (Swift, CPython, `shared_ptr`): free when the count hits zero, deterministic but blind to **cycles** unless you add weak references or a cycle detector.

      **Tracing garbage collection** (JVM, Go, .NET, JavaScript) instead finds everything **reachable** from a root set — globals, stacks, registers — and reclaims the rest. Mark-and-sweep marks the reachable and frees the unmarked. **Generational** collectors exploit the weak generational hypothesis, that most objects die young, by collecting a small nursery often and older regions rarely. **Compaction** moves survivors together to defeat fragmentation, which means updating every reference. GC costs CPU and, unless the collector is concurrent, introduces pauses that surface as tail latency.

      Profiling matters in both worlds: Valgrind's Memcheck and AddressSanitizer for invalid accesses and leaks in C, and heap dumps showing retained size and the path to a GC root in managed languages.

      ### The mistakes people actually make

      **Believing a GC prevents leaks.** It prevents *unreachable* garbage from accumulating. An unbounded cache or a listener never unregistered stays reachable, so memory grows until the process dies.

      **A cache with no eviction.** It looks and behaves exactly like a leak, and the collector is doing what it was told.

      **Returning a pointer to a stack local.** The frame is gone; the pointer sometimes still "works" because the memory has not been reused yet, so the bug appears months later under different timing.

      **Deep recursion on real input.** It passes every test with small fixtures and overflows the stack on the first realistic document.

      **Copying a large structure by value in a hot loop.** An accidental copy in a function signature turns an O(n) loop into O(n²) of memcpy.

      **What you can do after this:** given a service whose memory grows steadily under load, decide whether it is a genuine leak, an unbounded cache or GC pressure, and name the tool you would use to prove it.
