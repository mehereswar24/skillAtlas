track:
  slug: frontend-developer
  title: Become a Frontend Developer
  domain: frontend
  target_role: Frontend Developer
  difficulty: beginner
  description: >-
    Build interfaces people can actually use. Semantic HTML and modern CSS,
    JavaScript and the browser platform, React and state, TypeScript, build
    tooling, performance, accessibility and testing.

concepts:
  - slug: internet-and-http
  - slug: git-version-control

  - slug: html-css-foundations
    name: Semantic HTML & Modern CSS
    domain: frontend
    est_hours: 40
    difficulty: beginner
    prerequisites: []
    summary: >-
      The document, the box model, and the two layout systems (flexbox and
      grid) that ended twenty years of hacks.
    content_md: |
      Everything on the web is a document first. Get the document right and
      accessibility, SEO and styling all become easier; get it wrong and you
      spend the rest of your career patching around it.

      **Semantics.** `<button>` is not a styled `<div>` — it is focusable,
      keyboard-operable and announced correctly by screen readers, for free.
      Headings describe structure, not size. Landmarks (`<main>`, `<nav>`,
      `<header>`) let assistive technology skip straight to content. Choosing
      the right element is the cheapest accessibility work you will ever do.

      **The box model.** Every element is content, padding, border and margin.
      `box-sizing: border-box` makes width mean what you expect. Margins
      collapse between siblings, which explains most mysterious gaps.

      **Layout.** Flexbox lays out along one axis and is the right tool for
      toolbars, cards and centring. Grid lays out in two axes and is the right
      tool for page structure. Between them, float-based and absolute-position
      layout hacks are obsolete.

      **The cascade.** Specificity, inheritance and the order of rules decide
      which declaration wins. Custom properties (`--brand: …`) give you real
      variables that cascade and can be changed at runtime — this is how theming
      and dark mode work without duplicating a stylesheet.

      **Responsive design** means fluid units, `max-width`, and media or
      container queries — designing for a range rather than three fixed sizes.
    resources:
      - kind: doc
        title: "MDN — HTML elements reference"
        url: https://developer.mozilla.org/en-US/docs/Web/HTML/Element
        provider: MDN
        duration_min: 120
      - kind: course
        title: "web.dev — Learn CSS"
        url: https://web.dev/learn/css
        provider: Google
        duration_min: 480
      - kind: course
        title: "Flexbox Froggy & Grid Garden — layout by playing"
        url: https://flexboxfroggy.com/
        provider: Codepip
        duration_min: 90
      - kind: article
        title: "A Complete Guide to CSS Grid"
        url: https://css-tricks.com/snippets/css/complete-guide-grid/
        provider: CSS-Tricks
        duration_min: 45
    quiz:
      - prompt: Why should a clickable control be a `<button>` rather than a styled `<div>`?
        explanation: The native element is focusable, keyboard-activatable and announced as a button. Recreating that on a div takes tabindex, key handlers and ARIA — and is usually done incompletely.
        options:
          - text: "It is focusable and keyboard-operable and announced correctly, with no extra work"
            correct: true
          - text: "It renders faster"
          - text: "Divs cannot have click handlers"
          - text: "It is required by CSS"
      - prompt: You need a two-dimensional page layout with named rows and columns. Which tool?
        explanation: Grid is two-dimensional; flexbox distributes along a single axis.
        options:
          - text: "CSS Grid"
            correct: true
          - text: "Flexbox"
          - text: "Floats"
          - text: "Absolute positioning"
      - prompt: "What does `box-sizing: border-box` change?"
        explanation: Width then includes padding and border, so a 200px box stays 200px wide when you add padding.
        options:
          - text: "`width` includes padding and border instead of only the content"
            correct: true
          - text: "It removes all margins"
          - text: "It makes elements inline"
          - text: "It disables the cascade"
    interview:
      - question: What is the difference between `em`, `rem`, `%` and `vw`?
        difficulty: easy
        answer_md: |
          `em` is relative to the current element's font size and compounds when
          nested. `rem` is relative to the root font size, so it stays
          predictable and respects the user's browser text-size setting. `%` is
          relative to the parent's corresponding property. `vw`/`vh` are
          relative to the viewport. Prefer `rem` for type and spacing because it
          honours user preferences; use `%` and viewport units for layout.

  - slug: javascript-essentials
    name: JavaScript Essentials
    domain: frontend
    est_hours: 55
    difficulty: beginner
    prerequisites: []
    summary: >-
      Types, scope, closures, `this`, prototypes, and the asynchronous model
      that makes the browser feel instant.
    content_md: |
      JavaScript rewards a precise mental model and punishes a vague one. The
      confusing parts are almost all consequences of three design decisions.

      **Values and coercion.** Primitives are copied; objects are shared by
      reference — the source of "why did changing this array change that one?".
      `==` coerces and `===` does not; use `===` unless you specifically want
      `== null` to catch both null and undefined.

      **Scope and closures.** `let`/`const` are block-scoped, `var` is
      function-scoped and hoisted. A closure is a function that remembers the
      variables where it was defined, which is how callbacks, module privacy and
      React hooks all work — and why a stale variable captured in a callback is
      such a common bug.

      **`this`** is decided by how a function is *called*, not where it is
      written. Arrow functions have no `this` of their own and inherit it
      lexically, which is why they are the safe default in callbacks.

      **The event loop.** JavaScript runs one thing at a time. Long synchronous
      work freezes the page. Callbacks, promises and `async`/`await` are all
      ways of scheduling work to continue later; microtasks (promises) run
      before the next render, macrotasks (timers) after.

      **Modules and iteration.** `import`/`export`, destructuring, spread,
      optional chaining and array methods (`map`, `filter`, `reduce`) are the
      everyday vocabulary reviewers expect to see.
    resources:
      - kind: doc
        title: "MDN — JavaScript Guide"
        url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide
        provider: MDN
        duration_min: 600
      - kind: book
        title: "Eloquent JavaScript (free online)"
        url: https://eloquentjavascript.net/
        provider: Marijn Haverbeke
        duration_min: 900
      - kind: doc
        title: "javascript.info — the modern JavaScript tutorial"
        url: https://javascript.info/
        provider: Ilya Kantor
        duration_min: 900
      - kind: video
        title: "What the heck is the event loop anyway?"
        url: https://www.youtube.com/watch?v=8aGhZQkoFbQ
        provider: JSConf
        duration_min: 30
    quiz:
      - prompt: What does a closure capture?
        explanation: It captures the variables of the scope it was created in, and keeps them alive as long as the function exists.
        options:
          - text: "The variables in the scope where the function was defined"
            correct: true
          - text: "A copy of every global variable"
          - text: "The value of `this` at call time"
          - text: "Nothing; it is just a nested function"
      - prompt: Why do arrow functions behave differently for `this`?
        explanation: They have no binding of their own and inherit `this` lexically from the enclosing scope, which is what makes them safe inside callbacks.
        options:
          - text: "They inherit `this` from the surrounding scope instead of binding their own"
            correct: true
          - text: "They always bind `this` to the global object"
          - text: "They cannot use `this` at all"
          - text: "They bind `this` to the first argument"
      - prompt: A promise callback and a `setTimeout(fn, 0)` are both queued. Which runs first?
        explanation: Promise callbacks are microtasks and drain before the next macrotask, so the promise wins regardless of a zero delay.
        options:
          - text: "The promise callback — microtasks run before timers"
            correct: true
          - text: "The timer, because zero means immediately"
          - text: "Whichever was scheduled first"
          - text: "They run in parallel"
    interview:
      - question: Explain event delegation and why you would use it.
        difficulty: medium
        answer_md: |
          Instead of attaching a listener to every child, attach one to a common
          ancestor and inspect `event.target`. It works because events bubble.
          Benefits: one listener instead of hundreds, and it keeps working for
          elements added to the DOM later. Watch out for events that do not
          bubble (`focus`, `blur` — use `focusin`/`focusout`) and remember to
          check the target actually matches what you care about.

  - slug: react-fundamentals
    name: React Fundamentals
    domain: frontend
    est_hours: 55
    difficulty: intermediate
    prerequisites:
      - javascript-essentials
      - html-css-foundations
    summary: >-
      Components, props, state, effects and the rendering model — plus the
      rules that make hooks predictable.
    content_md: |
      React's core idea is that the UI is a function of state. You describe what
      the screen should look like for the current data; React works out the DOM
      operations.

      **Components and props.** A component is a function returning markup.
      Props flow down and are read-only. Composition — passing components as
      children — replaces most of what inheritance would do in other UI
      frameworks.

      **State and rendering.** `useState` returns a value and a setter; calling
      the setter schedules a re-render. State updates are batched and are *not*
      applied synchronously, which is why reading the variable immediately after
      setting it gives the old value. Use the updater form
      (`setCount(c => c + 1)`) whenever the next value depends on the previous.

      **Keys.** Lists need stable keys so React can tell which item is which
      across renders. Using the array index as a key is the classic bug: insert
      at the front and every row's state shifts to the wrong item.

      **Effects.** `useEffect` is for synchronising with something outside
      React — a subscription, a timer, a non-React widget. Most data fetching
      belongs to the framework or a data library, not a raw effect. The
      dependency array is a correctness feature, not a performance knob; a
      missing dependency means the effect closes over stale values.

      **Derived state is a smell.** If a value can be computed from props and
      state during render, compute it rather than storing a copy that can go
      out of sync.
    resources:
      - kind: doc
        title: "React — Learn React (official)"
        url: https://react.dev/learn
        provider: React
        duration_min: 600
      - kind: doc
        title: "You Might Not Need an Effect"
        url: https://react.dev/learn/you-might-not-need-an-effect
        provider: React
        duration_min: 45
      - kind: doc
        title: "Thinking in React"
        url: https://react.dev/learn/thinking-in-react
        provider: React
        duration_min: 30
      - kind: project
        title: "Build a filterable product table from a mockup"
        url: https://react.dev/learn/thinking-in-react
        provider: React
        duration_min: 240
    quiz:
      - prompt: Why is the array index a poor `key` for a reorderable list?
        explanation: Keys identify items across renders. If positions shift, index keys make React reuse the wrong element and its state moves to the wrong row.
        options:
          - text: "Positions shift on insert or reorder, so state gets attached to the wrong item"
            correct: true
          - text: "Numbers are not valid keys"
          - text: "It makes rendering slower"
          - text: "React forbids duplicate keys"
      - prompt: You call `setCount(count + 1)` twice in one handler. What happens?
        explanation: Both calls read the same stale `count` from that render's closure, so the value only increases by one. The updater form fixes it.
        options:
          - text: "Count increases by one — use `setCount(c => c + 1)` to increment twice"
            correct: true
          - text: "Count increases by two"
          - text: "React throws an error"
          - text: "The component re-renders twice with different values"
      - prompt: What is `useEffect` actually for?
        explanation: Synchronising with systems outside React. Anything derivable during render should be computed, not stored in state and synced.
        options:
          - text: "Synchronising with something outside React, such as a subscription or a timer"
            correct: true
          - text: "Running code faster"
          - text: "Replacing all state"
          - text: "Styling components"
    interview:
      - question: When would you reach for `useMemo` or `useCallback`?
        difficulty: medium
        answer_md: |
          When a computation is genuinely expensive and re-runs on every render,
          or when an identity-stable value is required — a dependency of another
          hook, or a prop to a memoised child. They are not free: each adds a
          dependency array to keep correct and memory to hold. Measure first;
          most components are fast enough without them, and premature
          memoisation makes stale-closure bugs more likely, not less.

  - slug: frontend-state-and-data
    name: State Management & Data Fetching
    domain: frontend
    est_hours: 35
    difficulty: intermediate
    prerequisites:
      - react-fundamentals
    summary: >-
      Local versus server state, caching, loading and error states, and why
      most "state management" problems are really caching problems.
    content_md: |
      The single most useful distinction in frontend architecture: **client
      state** (is the menu open? what is typed in this field?) and **server
      state** (data that lives in a database and is merely cached in the
      browser). They have different problems, and treating them the same is why
      so many apps end up with a sprawling global store.

      **Client state** is small and local. `useState` handles most of it;
      `useReducer` when several values change together; context when a value is
      genuinely needed by a whole subtree (theme, current user). Context is not
      a performance tool — every consumer re-renders when the value changes.

      **Server state** is asynchronous, shared, and can go stale without you
      touching it. It needs caching, deduplication of in-flight requests,
      revalidation, and retry. That is what libraries like TanStack Query exist
      for, and it is why putting fetched data into a global store by hand tends
      to grow into a bad cache.

      **Every request has four states**, and shipping only the happy path is the
      most common frontend failure: idle, loading, error and empty. An empty
      list and a failed request must not look identical.

      **Optimistic updates** make an interface feel instant: apply the change
      locally, send the request, and roll back if it fails. Only do this where
      failure is rare and reversible.

      **URL as state.** Filters, tabs and pagination belong in the query string
      so a view can be linked, shared and restored on reload.
    resources:
      - kind: doc
        title: "TanStack Query — overview and guides"
        url: https://tanstack.com/query/latest/docs/framework/react/overview
        provider: TanStack
        duration_min: 240
      - kind: article
        title: "Practical React Query"
        url: https://tkdodo.eu/blog/practical-react-query
        provider: Dominik Dorfmeister
        duration_min: 60
      - kind: doc
        title: "React — Managing State"
        url: https://react.dev/learn/managing-state
        provider: React
        duration_min: 180
    quiz:
      - prompt: What makes server state fundamentally different from client state?
        explanation: It is owned elsewhere and can change without you, so it needs caching and revalidation rather than simple assignment.
        options:
          - text: "It is owned by a server and can become stale on its own, so it needs caching and revalidation"
            correct: true
          - text: "It is always larger"
          - text: "It cannot be stored in React state"
          - text: "It never changes"
      - prompt: Which four states should every data-fetching UI handle?
        explanation: Shipping only the success path is the most common frontend gap; empty and error must look different.
        options:
          - text: "Loading, error, empty and success"
            correct: true
          - text: "Loading and success"
          - text: "Online and offline"
          - text: "Mounted and unmounted"
      - prompt: Why put filter and pagination state in the URL?
        explanation: It makes the view linkable, shareable, restorable on reload and navigable with the back button.
        options:
          - text: "So the view can be shared, bookmarked and restored after a reload"
            correct: true
          - text: "Because React state cannot hold filters"
          - text: "To reduce bundle size"
          - text: "To avoid using a server"
    interview:
      - question: A list shows stale data after an edit elsewhere in the app. How do you fix it?
        difficulty: medium
        answer_md: |
          Treat it as cache invalidation, not state syncing. After the mutation
          succeeds, invalidate the queries whose data it affects so they
          refetch, or write the updated entity into the cache directly. Discuss
          optimistic updates with rollback for perceived speed, and why keeping
          two independent copies of server data in different stores guarantees
          this bug recurs.

  - slug: typescript-for-apps
    name: TypeScript for Applications
    domain: frontend
    est_hours: 30
    difficulty: intermediate
    prerequisites:
      - javascript-essentials
    summary: >-
      Types that catch real bugs: unions, narrowing, generics, and where the
      type system stops protecting you.
    content_md: |
      TypeScript's value is not annotations; it is making illegal states
      impossible to represent.

      **Structural typing.** Compatibility is by shape, not by name. Two types
      with the same fields are interchangeable, which is why TypeScript feels
      lighter than nominal type systems.

      **Unions and narrowing** are the workhorse. `type Result = { ok: true;
      data: T } | { ok: false; error: string }` means you cannot read `data`
      without first checking `ok` — the compiler enforces the check you would
      otherwise forget. Discriminated unions plus exhaustive `switch` statements
      turn "did I handle every case?" into a compile error.

      **Strict mode matters.** `strictNullChecks` is where most of the value
      lives: it separates `string` from `string | null` and forces you to deal
      with absence at the boundary rather than at 3am.

      **Generics** let a function describe a relationship between input and
      output types rather than fixing them.

      **The escape hatches are lies you tell the compiler.** `any` disables
      checking, and `as` asserts something the compiler cannot verify — most
      often when parsing JSON, where the real fix is runtime validation (Zod or
      similar) at the edge. Type definitions describe your assumptions about
      external data; they do not enforce them.
    resources:
      - kind: doc
        title: "TypeScript Handbook"
        url: https://www.typescriptlang.org/docs/handbook/intro.html
        provider: Microsoft
        duration_min: 420
      - kind: doc
        title: "Total TypeScript — free tutorials"
        url: https://www.totaltypescript.com/tutorials
        provider: Matt Pocock
        duration_min: 300
      - kind: doc
        title: "Zod — runtime schema validation"
        url: https://zod.dev/
        provider: Zod
        duration_min: 60
    quiz:
      - prompt: Why does `as` not make code safe?
        explanation: A type assertion only silences the compiler; it performs no runtime check, so wrong data still flows through.
        options:
          - text: "It asserts a type without checking anything at runtime"
            correct: true
          - text: "It converts the value at runtime"
          - text: "It only works in strict mode"
          - text: "It is the same as a generic"
      - prompt: What does a discriminated union buy you?
        explanation: A shared literal field lets the compiler narrow the type and flag any unhandled case.
        options:
          - text: "The compiler narrows on the shared tag and can prove every case is handled"
            correct: true
          - text: "Smaller compiled output"
          - text: "Automatic runtime validation"
          - text: "Faster execution"
      - prompt: Which compiler option delivers the most real-world safety?
        explanation: strictNullChecks separates nullable from non-nullable types and eliminates a whole class of runtime errors.
        options:
          - text: "strictNullChecks"
            correct: true
          - text: "removeComments"
          - text: "allowJs"
          - text: "sourceMap"
    interview:
      - question: How do you type data coming back from an API?
        difficulty: medium
        answer_md: |
          Define the expected shape, then *validate* at the boundary with a
          runtime schema library and derive the TypeScript type from the schema
          so the two cannot drift. Casting the JSON with `as` is the common
          shortcut and it means a backend change becomes a runtime crash deep in
          the UI instead of a clear parse error at the edge. Generating types
          from the OpenAPI schema is the strongest version of this.

  - slug: web-performance
    name: Web Performance
    domain: frontend
    est_hours: 25
    difficulty: intermediate
    prerequisites:
      - react-fundamentals
    summary: >-
      Core Web Vitals, the critical rendering path, bundle size and images —
      the four things that actually decide whether a page feels fast.
    content_md: |
      Perceived speed is a feature, and it is measurable.

      **Core Web Vitals** are the industry's shared vocabulary. **LCP** (largest
      contentful paint) measures when the main content appears — usually
      dominated by an image or a slow server response. **INP** (interaction to
      next paint) measures responsiveness — dominated by long JavaScript tasks
      blocking the main thread. **CLS** (cumulative layout shift) measures
      things jumping around, almost always because an image, ad or font had no
      reserved space.

      **The critical rendering path.** HTML is parsed, and a synchronous script
      or a stylesheet blocks it. Getting the first paint fast means shipping
      less blocking work: defer non-critical scripts, inline what the first
      screen needs, and let everything else arrive later.

      **JavaScript is the expensive part.** A megabyte of images costs bandwidth;
      a megabyte of JavaScript costs bandwidth *and* parse *and* execute, on
      whatever phone the user actually owns. Code-split by route, load rarely-used
      features on demand, and check what is really in the bundle before adding
      another dependency.

      **Images.** Modern formats, correct dimensions, `srcset` for density and
      width, lazy-load below the fold, and always set width and height so the
      layout does not shift.

      **Measure on real devices and real networks.** A fast laptop on fibre
      tells you almost nothing about the median user.
    resources:
      - kind: doc
        title: "web.dev — Core Web Vitals"
        url: https://web.dev/articles/vitals
        provider: Google
        duration_min: 60
      - kind: doc
        title: "web.dev — Learn Performance"
        url: https://web.dev/learn/performance
        provider: Google
        duration_min: 300
      - kind: doc
        title: "Chrome DevTools — Performance panel"
        url: https://developer.chrome.com/docs/devtools/performance
        provider: Google
        duration_min: 90
    quiz:
      - prompt: Images and ads pushing the page around as it loads is measured by which metric?
        explanation: Cumulative Layout Shift. The fix is reserving space with explicit dimensions or aspect ratios.
        options:
          - text: "CLS"
            correct: true
          - text: "LCP"
          - text: "INP"
          - text: "TTFB"
      - prompt: Why is a megabyte of JavaScript worse than a megabyte of images?
        explanation: Images are decoded off the main thread; JavaScript must be parsed, compiled and executed, blocking interaction on slow devices.
        options:
          - text: "JavaScript must also be parsed and executed on the main thread"
            correct: true
          - text: "JavaScript downloads more slowly"
          - text: "Images are cached and scripts are not"
          - text: "There is no difference"
      - prompt: What is the most reliable way to know if your site is fast?
        explanation: Field data from real users on real devices; lab tests on a fast machine flatter you.
        options:
          - text: "Measure real users on real devices and networks"
            correct: true
          - text: "Run Lighthouse once on your laptop"
          - text: "Check the bundle size only"
          - text: "Ask the design team"
    interview:
      - question: A page scores well in Lighthouse but users say it is slow. Why might that be?
        difficulty: hard
        answer_md: |
          Lab data is a simulation on one machine with one network profile. Real
          users have slower CPUs, worse networks, cold caches, browser
          extensions, and different geography from your CDN edge. They may also
          be hitting a path Lighthouse never runs — an authenticated dashboard
          with far more data than the marketing page. Look at field data (RUM),
          segment by device class and region, and measure the interaction people
          are actually complaining about, not just first load.

  - slug: web-accessibility
    name: Accessibility
    domain: frontend
    est_hours: 25
    difficulty: intermediate
    prerequisites:
      - html-css-foundations
    summary: >-
      Keyboard operation, semantics, contrast and focus — building interfaces
      that work for everyone, and the legal floor beneath them.
    content_md: |
      Accessibility is not a feature you add at the end. Most of it is a
      consequence of decisions made in the first hour of a component's life.

      **POUR.** Content must be **P**erceivable (text alternatives, contrast),
      **O**perable (keyboard, no timing traps), **U**nderstandable (clear
      language, predictable behaviour) and **R**obust (works with assistive
      technology). WCAG 2.2 AA is the level most organisations are held to,
      legally as well as ethically.

      **Keyboard first.** Everything clickable must be reachable with Tab and
      activatable with Enter or Space. Focus must be visible — removing the
      focus ring without replacing it is one of the most damaging one-line
      changes in frontend. Focus order should follow reading order, and modals
      must trap focus while open and return it when closed.

      **Semantics over ARIA.** The first rule of ARIA is not to use ARIA: a
      native element is better than a div with a role. When you do need ARIA,
      remember that `aria-label` replaces the accessible name and that a role
      makes a promise about behaviour you must then implement.

      **Colour and contrast.** 4.5:1 for body text, 3:1 for large text and
      meaningful UI boundaries. Colour must never be the only signal — an error
      shown purely in red is invisible to a colour-blind user.

      **Test it.** Tab through the page. Run axe. Turn on a screen reader for
      ten minutes. Automated tools catch perhaps a third of issues; the rest
      need a human.
    resources:
      - kind: doc
        title: "WAI — Web Accessibility Tutorials"
        url: https://www.w3.org/WAI/tutorials/
        provider: W3C
        duration_min: 300
      - kind: doc
        title: "The A11Y Project checklist"
        url: https://www.a11yproject.com/checklist/
        provider: A11Y Project
        duration_min: 60
      - kind: doc
        title: "ARIA Authoring Practices Guide — patterns"
        url: https://www.w3.org/WAI/ARIA/apg/patterns/
        provider: W3C
        duration_min: 180
    quiz:
      - prompt: What is the first rule of ARIA?
        explanation: Native semantics come with behaviour and are far harder to get wrong than a role plus hand-written keyboard handling.
        options:
          - text: "Do not use ARIA if a native element will do the job"
            correct: true
          - text: "Add a role to every element"
          - text: "Always use aria-label"
          - text: "ARIA replaces semantic HTML"
      - prompt: "What is wrong with `outline: none` on focusable elements?"
        explanation: It removes the only indicator keyboard users have of where they are, unless an equally visible replacement is provided.
        options:
          - text: "Keyboard users lose all indication of where focus is"
            correct: true
          - text: "It breaks the mouse cursor"
          - text: "It is invalid CSS"
          - text: "It only affects Safari"
      - prompt: "The minimum contrast ratio for normal body text at WCAG AA is:"
        explanation: 4.5:1 for normal text; large text may drop to 3:1.
        options:
          - text: "4.5:1"
            correct: true
          - text: "2:1"
          - text: "7:1"
          - text: "10:1"
    interview:
      - question: How would you make a custom dropdown accessible?
        difficulty: hard
        answer_md: |
          Start by asking whether a native `<select>` will do — it is accessible
          for free on every platform. If a custom control is genuinely required,
          follow the APG combobox pattern: a labelled trigger with
          `aria-expanded` and `aria-controls`, a listbox with `option` roles,
          `aria-activedescendant` or roving tabindex for the highlighted item,
          full arrow/Home/End/Escape/type-ahead keyboard support, focus returned
          to the trigger on close, and the selection announced. Then test it
          with a real screen reader, because the spec compliance and the lived
          experience are not the same thing.

  - slug: frontend-testing
    name: Testing Frontends
    domain: frontend
    est_hours: 25
    difficulty: intermediate
    prerequisites:
      - react-fundamentals
    summary: >-
      Testing behaviour rather than implementation, with Testing Library and
      Playwright.
    content_md: |
      A frontend test suite is worth having only if it fails when the user
      experience breaks and passes when it does not. That rules out most tests
      that assert on internals.

      **Test what the user does.** Testing Library's central idea: query the DOM
      the way a person finds things — by role, by label, by visible text. A test
      written that way survives a refactor of your component's internals and
      fails when the button genuinely disappears. Reaching for a test id is a
      last resort and usually a hint that the markup is not accessible.

      **The layers.** Unit tests for pure logic — formatting, reducers,
      validation. Component tests for a component with its real DOM and events.
      End-to-end tests, in a real browser, for the two or three journeys the
      business cannot afford to break: sign up, check out, publish.

      **Mock at the network boundary**, not by stubbing your own modules. Tools
      like MSW intercept HTTP so your component runs its real fetching code
      against a controlled response — you test the code you ship.

      **Flaky tests are worse than missing tests.** They are almost always a
      race: asserting before the UI settled. Wait for the thing you expect
      (`findBy…`) rather than sleeping for an arbitrary number of milliseconds.

      **Accessibility and visual checks belong here too** — an automated axe run
      in the component test catches regressions no snapshot will.
    resources:
      - kind: doc
        title: "Testing Library — guiding principles and queries"
        url: https://testing-library.com/docs/queries/about/
        provider: Testing Library
        duration_min: 120
      - kind: doc
        title: "Playwright — writing tests"
        url: https://playwright.dev/docs/writing-tests
        provider: Playwright
        duration_min: 180
      - kind: doc
        title: "Mock Service Worker"
        url: https://mswjs.io/docs/
        provider: MSW
        duration_min: 90
    quiz:
      - prompt: "Why prefer `getByRole('button', { name: 'Save' })` over a test id?"
        explanation: It asserts what a user (and assistive technology) can actually perceive, so it survives refactors and catches accessibility regressions.
        options:
          - text: "It matches how a user and a screen reader find the control"
            correct: true
          - text: "It runs faster"
          - text: "Test ids are not supported"
          - text: "It avoids rendering the component"
      - prompt: A test passes locally and fails in CI intermittently. Most likely cause?
        explanation: "A race: the assertion runs before the UI has settled. Use async queries that wait for the expected state."
        options:
          - text: "An unawaited async update — assert with a query that waits"
            correct: true
          - text: "CI has less memory"
          - text: "The test file is too long"
          - text: "Snapshots are out of date"
      - prompt: Where should you mock in a component test?
        explanation: At the network boundary, so the component's real data-fetching code is exercised.
        options:
          - text: "At the network layer, leaving your own modules real"
            correct: true
          - text: "Every imported module"
          - text: "The component under test"
          - text: "Nothing should ever be mocked"
    interview:
      - question: How much end-to-end testing is the right amount?
        difficulty: medium
        answer_md: |
          Enough to cover the journeys that lose money or trust if they break —
          typically a handful: sign up, sign in, the core create/edit flow, and
          checkout. E2E tests are slow, flaky and expensive to maintain, so
          everything else should be pushed down to component and unit level
          where failures are fast and specific. A good heuristic: if an E2E test
          would be the only thing catching a bug class, keep it; if a component
          test would catch it sooner and more precisely, move it down.
