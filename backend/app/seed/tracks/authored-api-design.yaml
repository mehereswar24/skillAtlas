        url: "https://www.rfc-editor.org/rfc/rfc4918.html#section-11.1"

  - slug: api-design-idempotency-and-consistency
    name: "Idempotency, Retries and Optimistic Concurrency"
    domain: architecture
    est_hours: 7
    difficulty: advanced
    prerequisites:
      - api-design-handling-data-requests
    summary: |-
      The step that makes an API survive a bad client: idempotency keys for creates, conditional requests for updates, and a defined answer to "the client never found out whether it worked."
    content_md: |-
      Somewhere in the world, right now, a client of yours sent a request, the connection dropped before the response arrived, and it has no idea whether the charge went through. Everything in this concept exists for that moment. Roadmap-style syllabi rarely give it a chapter; in production it is the difference between an API that can be trusted with money and one that cannot.

      ### The problem, precisely

      A timeout is ambiguous. The request may never have arrived, may have arrived and failed, or may have succeeded with the response lost on the way back. The client cannot distinguish these, and the only two behaviours available to it are "retry" and "give up" — both of which are wrong some of the time unless *you* make retrying safe.

      Assume your clients retry. They do, whether or not you told them to: HTTP libraries retry, service meshes retry, mobile networks re-send, and users press the button again.

      ### Idempotency keys for creation

      For non-idempotent operations — `POST /payments`, `POST /orders` — the standard mechanism is a client-generated key, sent in a header (`Idempotency-Key`, a UUID) and scoped to the API key or account.

      The server-side algorithm matters, because the obvious implementation has a race. On receiving a request, atomically insert the key into a store with a "in progress" state; a unique constraint makes this the concurrency control. If the insert succeeds, you are the first: execute the operation and record the response status and body against the key, **in the same transaction as the operation itself** wherever possible, so you cannot end up having done the work without having recorded it. If the insert fails because the key exists, either the stored response is there — return it verbatim, with a header indicating it was a replay — or the first attempt is still in flight, in which case return `409` and let the client retry shortly. Concurrent duplicates must never both execute.

      Two details people miss. **Fingerprint the request**: store a hash of the body alongside the key, and if the same key arrives with a *different* body, that is a client bug — return `422`, do not silently return the old result. And **expire keys** after a documented window, typically 24 hours, so the store does not grow forever; document the window, because after it a retry will genuinely execute again.

      ### Optimistic concurrency for updates

      The other lost-update scenario: two clients read a resource, both modify it, and the second write silently discards the first's change. HTTP already solves this. Return an `ETag` with the representation; require `If-Match` on updates; compare, and return **`412 Precondition Failed`** when the tag does not match, so the client knows to re-read and re-apply rather than believing it succeeded. A version number in the body works too, but the header is standard and works with intermediaries. `If-None-Match: *` on a `PUT` is the corresponding "create only if it does not exist".

      This is far better than pessimistic locking over HTTP, which would require a stateful lock held across requests by a client that may never come back.

      ### Making operations naturally idempotent

      Best of all is designing so the question does not arise. `PUT` with a client-chosen id is idempotent by construction — let the client generate the UUID, and a retried create is simply the same write again. Setting an absolute value (`balance = 100`) is idempotent; applying a delta (`balance += 10`) is not. State transitions guarded by the current state ("cancel if status is pending, otherwise return the existing cancellation") are idempotent. Where an operation genuinely cannot be, say so in the documentation and provide the key mechanism.

      ### Long-running operations

      Related, and often muddled with this: when work takes longer than a request should, return `202 Accepted` with a `Location` pointing at an operation resource the client polls, and make *creating* that operation idempotent. Then a lost response costs a poll, not a duplicate job.

      ### The mistakes people actually make

      Deduplicating by hashing the request body, so two legitimately identical requests (a customer buying the same coffee twice) are collapsed into one. Storing the idempotency key after the operation instead of atomically with it. Returning a fresh `201` on the replay, so the client believes two resources exist. Scoping keys globally, so one tenant can collide with another. Documenting `ETag` support and then generating a new tag on every read because the payload includes a timestamp. And offering no mechanism at all, then telling integrators "just do not retry."
