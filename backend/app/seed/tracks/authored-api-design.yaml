  - slug: api-design-versioning-and-evolution
    name: "Versioning and Backward Compatibility"
    domain: architecture
    est_hours: 7
    difficulty: advanced
    prerequisites:
      - api-design-building-json-restful-apis
    summary: |-
      Changing an API that people depend on: what actually breaks a client, the versioning schemes and their real costs, and why the goal is to need a new version as rarely as possible.
    content_md: |-
      Versioning is usually taught as a choice between URL and header placement. That is the least important part. The real skill is knowing precisely which changes break clients, so that most of your evolution never needs a version at all.

      ### What breaks a client

      **Safe (additive):** a new endpoint; a new optional request field with a sensible default; a new field in a response; a new optional query parameter; a new value in an enum a client is documented to ignore when unrecognised; relaxing a validation rule; adding a new error *sub*type under an existing status.

      **Breaking:** removing or renaming any field; changing a field's type, including the seemingly harmless integer-to-string; making an optional request field required; tightening validation; changing a status code; changing a default; changing the meaning of an existing field while keeping its name — the most insidious of all, because nothing in any diff or schema check catches it; changing sort order or pagination behaviour that clients depend on; and removing an enum value clients may send.

      Two live at the boundary and depend on what you promised. **Adding a response field** breaks clients that validate strictly against a closed schema — which generated clients often do — so state your policy explicitly: "clients must tolerate unknown fields." **Adding an enum value** breaks exhaustive switches, so state that too. A documented forward-compatibility contract converts these from breaking changes into safe ones, and writing it down on day one is worth more than any versioning scheme.

      ### The schemes

      **URL path** (`/v1/resources`) is the most common because it is unmissable — visible in logs, in a browser, in a support ticket. Purists dislike it because the same entity now has two URLs. In practice its operational clarity wins, and it makes routing and gradual migration trivial.

      **Header or media type** (`Accept: application/vnd.example.v2+json`) keeps URLs stable and is theoretically cleaner. It is also invisible: harder to test with a browser, easier to get wrong, and it makes caching depend on `Vary` being correct. Choose it if your organisation has the discipline for it.

      **Date-based versioning**, where the client pins a release date and the server applies a chain of transformations to translate between the version it implements and the version the client pinned, is how several large APIs manage this well. It is more work up front and scales far better than maintaining parallel implementations, because there is only ever one implementation plus a stack of small, individually-tested compatibility shims.

      Whichever you choose: version the **API**, not each endpoint. Per-endpoint versions produce a combinatorial matrix nobody can document or test.

      ### Evolving without versioning

      The best version bump is the one you avoid. Add the new field alongside the old and populate both. Introduce a new endpoint rather than changing an existing one's semantics. Use feature flags or opt-in request parameters to expose new behaviour to consenting clients. Accept both the old and the new input shape. Every one of these is cheaper than a version, because a version is not a technical artefact — it is a commitment to run and support two things.

      ### When you must break

      Signal it. Return the `Deprecation` header and a `Sunset` header with the retirement date, and add a `Link` to the migration guide, so a client's own tooling can surface the warning. Then use your telemetry: you know which API keys called which deprecated endpoint and when, so contact those specific customers rather than sending a broadcast email nobody reads. Give a period proportional to your consumers' ability to move — for a public API with mobile clients on app stores, that is measured in many months, because old app versions live on devices you cannot update.

      ### The mistakes people actually make

      Shipping `/v2` for a change that could have been additive, then maintaining both forever. Never sunsetting anything, so v1, v2 and v3 all run and every fix must be made three times. Sunsetting with two weeks' notice. Bumping the version for internal refactors nobody sees. And having no idea who is still calling the old version, which makes retirement a leap of faith rather than a decision.
    resources:
