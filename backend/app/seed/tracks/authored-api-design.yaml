  - slug: api-design-api-documentation-tools
    name: "Documentation People Actually Use"
    domain: architecture
    est_hours: 6
    difficulty: beginner
    prerequisites:
      - api-design-design-first
    summary: |-
      Reference, guides and examples as three different jobs; generating what should be generated and writing what cannot be; and keeping all of it from drifting away from the implementation.
    content_md: |-
      Documentation is the product surface of an API. A developer's entire experience of your engineering is mediated through it, and the difference between good and bad documentation is measured in support tickets and abandoned integrations.

      ### Four kinds of content, doing four different jobs

      **A getting-started path** that takes a new developer from nothing to a successful authenticated call in a few minutes. This single page determines whether an evaluation continues. It should be copy-pasteable, use a test key they can obtain immediately, and show a real response. Everything else can be imperfect if this is good.

      **Reference** — every endpoint, parameter, field, type, constraint and error. This should be **generated** from your specification, because hand-maintained reference documentation is wrong within a month. Renderers like Redoc, Swagger UI, Scalar and the various docs platforms all take an OpenAPI document; the choice matters far less than the document's quality.

      **Guides and how-tos** for tasks that span endpoints: how to run a checkout, how to handle a webhook, how to paginate a large export, how to migrate from v1. These cannot be generated, because they encode intent, and they are what most developers actually read.

      **Explanations** of concepts and models — what an "account" is in your domain, how idempotency works here, what the rate-limit tiers mean. Skipping these forces every integrator to reverse-engineer your mental model from field names.

      Keeping these separate is itself a technique; the common failure is a reference page carrying a paragraph of tutorial and neither working.

      ### The things that make documentation trusted

      **Real examples, for every endpoint, including errors.** A request and a response with realistic values. Most developers read examples first and prose only when the example fails. Generate the examples from your test fixtures where you can, so they cannot be wrong.

      **A complete error catalogue.** Every error code, what causes it, and what the client should do. This is the most-requested and least-written page in API documentation.

      **A changelog**, with dates, and a stated policy for what counts as a breaking change. It is what lets an integrator decide whether to read a release note or ignore it.

      **Something interactive.** A "try it" console backed by a sandbox, or at minimum a `curl` command per endpoint. Removing the gap between reading and running dramatically improves conversion.

      ### Keeping it honest

      Treat docs as code: in version control, reviewed with the change that motivates them, and built in CI. Two automated checks are worth more than any amount of discipline. **Validate the examples** — parse them against the schema, and ideally execute them against a test environment, so an example that has drifted fails a build. And **fail the pipeline when the spec changes without a corresponding changelog entry**.

      Finally, measure. Search queries that return nothing, the pages people leave from, and the questions in your support channel are all direct evidence of missing documentation. Every repeated support question is a page you have not written.

      ### The mistakes people actually make

      Publishing a bare Swagger UI and calling it documentation — it lists endpoints without ever explaining what the API is for. Examples with placeholder values that do not work. No error documentation. Documentation for the current version only, with no history for the people still on the old one. Documentation in a wiki nobody can review. And a getting-started guide that requires an approved account, a signed agreement and a sales call before the first request.
