  - slug: api-design-handling-data-requests
    name: "Requests That Scale: Filtering, Sorting, Pagination and Uploads"
    domain: architecture
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - api-design-building-json-restful-apis
    summary: |-
      Getting data in and out at volume: why offset pagination breaks on page 500 and on a live list, how to design filters you can index, and how to accept a two-gigabyte file.
    content_md: |-
      An endpoint that returns ten records in development and a million in production is not the same endpoint. These are the design decisions that determine whether it survives.

      ### Pagination: offset versus cursor

      **Offset pagination** (`?page=3&per_page=50`, or `?limit&offset`) is the obvious design and has two failure modes that are not obvious. First, it is slow at depth: the database must produce and discard every row before the offset, so page 1,000 costs a thousand times page 1. Second, and worse, it is **unstable**: if a record is inserted or deleted while a client pages, records shift between pages, so the client silently skips or duplicates items. Anyone paging a live feed hits this immediately.

      **Cursor (keyset) pagination** fixes both. Sort by a stable, unique, indexed ordering — typically `(created_at, id)`, with the id breaking ties — and instead of an offset, ask for rows after the last one seen: `WHERE (created_at, id) < (?, ?) ORDER BY created_at DESC, id DESC LIMIT 50`. This uses the index directly, so page 1,000 costs the same as page 1, and inserts elsewhere in the list cannot shift the window. Expose the cursor as an **opaque string** — base64 of the encoded key — so you can change its internals later without breaking clients, and return it as a `next` link rather than expecting clients to construct one.

      The trade is that you cannot jump to an arbitrary page number, which is exactly why user-facing search UIs sometimes keep offset paging with a hard cap on depth, while APIs meant for synchronising data use cursors. Also: do not return a total count by default. `COUNT(*)` over a large filtered set is often more expensive than the page itself; make it an opt-in parameter or an estimate.

      ### Filtering and sorting you can actually serve

      Every filter you accept is a query pattern you must be able to index. An unconstrained filter language — arbitrary fields, arbitrary operators, arbitrary combinations — is a promise to serve unbounded table scans on demand. Define the filterable fields explicitly, define the allowed operators, and validate against that list. The same applies to sorting: an allowlist of sortable fields, each backed by an index, and always with a unique tiebreaker so the order is deterministic (without one, two "identical" rows can swap between pages and reintroduce the instability you just fixed).

      Design filters to be readable and unambiguous. `?status=active&created_after=2026-01-01` is easy to document and easy to index. Nested query-language-in-a-query-string schemes are easy to write and hard to secure, cache, log and support.

      ### Partial responses and expansion

      Two levers reduce payload size without new endpoints. **Sparse fieldsets** (`?fields=id,name,total`) let a client ask for less. **Expansion** (`?expand=customer,items`) lets it ask for more in one round trip instead of N+1 calls. Both need limits: cap the expansion depth and the number of expandable relations, or a single request becomes an arbitrary join.

      ### Bulk operations

      When clients need to create or update thousands of records, a per-record request is the wrong shape. Accept a batch, and then answer the hard question honestly: is the batch atomic, or per-item? Atomic is simpler to reason about and fails the whole batch for one bad row. Per-item needs a response that reports success and failure **per element**, with a stable index or client-supplied id so the caller knows which one failed — and the status code should reflect the mixed outcome (`207 Multi-Status`, or `200` with a documented per-item result structure). Cap the batch size explicitly.

      ### Large payloads and uploads

      Set an explicit maximum request size and return `413` rather than dying. For file uploads, streaming a multi-gigabyte body through your application is usually the wrong architecture: issue a **pre-signed URL** so the client uploads directly to object storage, then have the client tell you the resulting key. This removes the load, the timeout risk and the memory pressure from your service entirely. When you must accept multipart uploads, validate the declared content type against the actual bytes, cap the number of parts, and never trust the supplied filename as a path.

      Conversely, for large responses, stream them (chunked, or newline-delimited JSON) rather than building a hundred-megabyte string in memory, or make the export an asynchronous job that returns a download link.

      ### The mistakes people actually make

      Offset paging a feed that changes. Returning an unbounded list with no default limit, so one client discovers it and takes the database down. Allowing sorting on an unindexed column. Returning a total count nobody uses. Forgetting a tiebreaker in the sort. And accepting a filter parameter that is interpolated into SQL, which is the oldest vulnerability in the profession.
    resources:
      - kind: doc
        title: "Stripe API: Pagination"
        url: "https://docs.stripe.com/api/pagination"
      - kind: doc
        title: "GitHub REST API: Using pagination"
        url: "https://docs.github.com/en/rest/using-the-rest-api/using-pagination-in-the-rest-api"
      - kind: article
