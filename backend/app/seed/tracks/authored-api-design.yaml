# Hand-authored for SkillAtlas. Do NOT regenerate with scripts/import_roadmapsh.py.
#
# Written independently from our own knowledge of the subject and from primary
# sources: the HTTP RFCs (9110, 9111, 9457), the OAuth and JWT RFCs, MDN, the
# OpenAPI Specification, the OWASP API Security Top 10, and the published API
# guidelines of Google, Microsoft and Zalando. Nothing here derives from
# roadmap.sh's API design roadmap.
#
# The syllabus is outcome-shaped: every step is something the API can now
# survive. HTTP semantics -> a written contract -> resources and requests that
# scale -> idempotency, so a retrying client cannot corrupt state -> errors and
# rate limits -> the full identity stack (authn, authz, OAuth, keys, attack
# surface) -> documentation and testing -> performance, versioning, lifecycle,
# operation -> streaming, and finally being a good consumer of someone else's
# API.
#
# Two topics roadmap.sh omits get first-class nodes here because they are what
# actually separates a demo API from one in production: idempotency/optimistic
# concurrency, and versioning/backward compatibility. The three overlapping
# auth nodes have been given genuinely distinct jobs rather than repeating
# each other.

track:
  slug: api-design
  title: "API Design: Contracts That Survive Their Clients"
  domain: architecture
  target_role: "API Designer / Platform Engineer"
  difficulty: intermediate
  description: "Twenty-one steps from HTTP's own rules to operating a public API, organised so that each one closes a specific failure: a client that retries, a client that pages through a shifting list, a client that sends garbage, a client that is not who it claims, a client that never upgrades. Idempotency and versioning get their own steps because they are where real APIs break, and the security half is taught as one continuous stack rather than as scattered tool names."

concepts:
  - slug: api-design-learn-the-basics
    name: "HTTP Semantics: The Rules You Are Designing Within"
    domain: architecture
    est_hours: 8
    difficulty: beginner
    prerequisites: []
    summary: |-
      Methods, status codes, headers, content negotiation and conditional requests — the properties every proxy, browser and client library already assumes your API has.
    content_md: |-
      Before any design question, there is a body of behaviour that clients, caches, proxies, CDNs and crawlers already rely on. Designing against it is expensive; designing with it is free correctness.

      ### Methods have properties, not just names

      Two properties do most of the work. A method is **safe** if it does not change state: `GET`, `HEAD` and `OPTIONS`. Anything on the internet may call a safe method at any time without asking — browser prefetch, link-preview bots, corporate security scanners, crawlers. This is why `GET /users/42/delete` is not a stylistic mistake but an outage waiting for a well-behaved crawler.

      A method is **idempotent** if making the same request twice has the same effect on server state as making it once: `PUT`, `DELETE`, and all safe methods. This is the property clients and proxies rely on to retry after a timeout. `POST` is neither safe nor idempotent, which is exactly why a step later in this track is dedicated to making it retryable anyway.

      `PUT` replaces a resource at a known URL; `POST` submits to a resource that decides what to do; `PATCH` applies a partial modification (and its body format needs specifying — JSON Merge Patch, RFC 7396, or JSON Patch, RFC 6902, or a documented convention of your own, but *something*, because "send the fields you want to change" is ambiguous the moment a client wants to set a field to null).

      ### Status codes are the client's control flow

      Every client library, retry policy and monitoring system branches on the status code before it looks at the body. `2xx` succeeded — `200` with a representation, `201` with a `Location` header for something created, `202` for accepted-but-not-done, `204` for succeeded-with-nothing-to-say. `3xx` redirects. `4xx` means the client must change something and retrying identically will not help: `400` malformed, `401` not authenticated, `403` authenticated but not permitted, `404` no such thing, `409` conflicts with current state, `410` gone permanently, `422` well-formed but semantically invalid, `429` too many requests. `5xx` means the fault is ours and a retry may work.

      Returning `200 OK` with `{"success": false}` throws away the entire mechanism: caches will store it, retry policies will not fire, and every dashboard shows a perfectly healthy service.

      ### Headers that carry real semantics

      **Content negotiation.** `Content-Type` states what you are sending, `Accept` what the client wants; getting this right is what makes `application/json`, `text/csv` and `application/problem+json` coexist at one URL. Include the charset and mean it.

      **Conditional requests.** The server returns an `ETag` (an opaque version identifier for the representation) or `Last-Modified`. A client may then send `If-None-Match` on a read — and receive `304 Not Modified` with no body, saving bandwidth — or `If-Match` on a write, which is how you get optimistic concurrency and prevent lost updates. These two headers are the highest-value, least-used feature in ordinary API design.

      **Caching.** `Cache-Control` directives (`max-age`, `no-store`, `private`, `public`, `must-revalidate`, `stale-while-revalidate`) tell every cache between you and the client what it may do. `no-cache` does not mean "do not cache"; it means "cache but revalidate before use". `private` versus `public` is the difference between a personalised response being safe and being served to the wrong user by a CDN.

      ### The mistakes people actually make

      Tunnelling everything through `POST` and inventing a private status vocabulary in the body. Using `PUT` for creation and then discovering it must be idempotent, which the implementation is not. Returning `404` where `403` is meant, or the reverse — hiding existence is a deliberate choice, so make it deliberately. Setting `Cache-Control: no-cache` when you meant `no-store`. And omitting `Vary` on a response that differs by `Accept`, `Accept-Language` or `Authorization`, so a shared cache serves one variant to everyone.
    resources:
      - kind: doc
        title: "RFC 9110 — HTTP Semantics"
        url: "https://www.rfc-editor.org/rfc/rfc9110.html"
      - kind: doc
        title: "RFC 9111 — HTTP Caching"
        url: "https://www.rfc-editor.org/rfc/rfc9111.html"
      - kind: doc
