  - slug: api-design-standards-and-compliance
    name: "Standards, Conventions and Regulatory Constraints"
    domain: architecture
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - api-design-api-security
    summary: |-
      Reusing the formats and specifications that already exist instead of inventing worse ones, and the legal constraints — data protection, retention, auditability — that shape an API's design rather than being bolted on.
    content_md: |-
      Two different kinds of "standard" matter to an API designer, and both save you from decisions you do not want to be making alone.

      ### Reuse the specifications

      Almost every recurring API problem has a published answer, and adopting it means clients already have libraries for it. Dates and times: **RFC 3339** with an explicit offset — never a locale-dependent format, never a bare "2026-03-07 14:00" of ambiguous zone. Durations and repeating intervals: ISO 8601. Currency: **ISO 4217** codes with amounts as minor-unit integers. Countries and languages: **ISO 3166** and **BCP 47**. Errors: **RFC 9457** problem details. Deprecation and retirement signalling: the `Deprecation` header (RFC 9745) and `Sunset` (RFC 8594). Well-known discovery paths: **RFC 8615**. Pagination and rate-limit headers: the IETF HTTP API drafts. Health checks have a draft too, and even where a specification is not final, following it costs nothing and gives future clients something familiar.

      Above the wire format sit **house style guides**. Google's API Improvement Proposals, Microsoft's and Zalando's published guidelines are all worth reading not to copy wholesale but because each documents a decision you will otherwise make ad hoc two hundred times. Writing your own short guideline — naming, casing, error shape, pagination, versioning, date handling — and enforcing it with a spec linter is what keeps an API designed by thirty people from feeling like thirty APIs.

      ### Compliance is a design input

      Regulation shapes the contract, and retrofitting it is expensive.

      **Data minimisation.** Under GDPR-style regimes, collecting and returning only what is necessary is a legal requirement as well as a security one. An endpoint that returns a whole user record because it was convenient is a compliance liability. This is the same discipline as avoiding excessive data exposure, arriving from a different direction.

      **The data subject's rights** must be implementable. Access, portability (an export in a machine-readable format), rectification and **erasure** all need to be possible — which has architectural consequences, because "delete this user" must reach caches, search indexes, event streams with long retention, analytics warehouses and backups. Designing a deletion path late is one of the hardest retrofits there is; deciding early that identifiers are separable from personal data, and that events carry references rather than embedded personal data, makes it tractable.

      **Consent and purpose limitation** may need to be visible in the API: which purposes this data may be used for, and a way to record and revoke agreement.

      **Data residency.** Some data may not leave a jurisdiction, which affects routing, replication and where your logs go — logs contain personal data more often than teams assume.

      **Sector rules.** PCI DSS if card data touches your systems, which is the strongest possible argument for never letting it: use a payment provider's tokenisation so your API handles a token and stays out of scope. HIPAA for health data, with its own audit and encryption requirements. SOC 2 and ISO 27001 are not laws but are contractual gates for selling to businesses, and they mostly ask for evidence of things you should be doing: access control, change management, logging, incident response.

      **Audit trails.** For anything regulated, "who accessed what, when, and on whose authority" must be reconstructable, which means an append-only audit log designed in, not derived from application logs later.

      ### Accessibility and internationalisation

      An API is consumed by developers, and the developer experience has its own standards: documentation that is readable without JavaScript, examples that work by copy and paste, and error messages in a language you can localise. If your product serves multiple locales, decide early whether the API returns localised strings (and honours `Accept-Language`) or returns codes and lets the client localise. The second is almost always right, and almost always decided too late.

      ### The mistakes people actually make

      Inventing a date format. Returning localised error text as the only error identifier. Treating compliance as the legal team's problem until an enterprise deal requires an answer in a week. Building deletion as a soft-delete flag and discovering it does not satisfy erasure. And logging personal data everywhere, so the audit surface is the entire logging pipeline.
