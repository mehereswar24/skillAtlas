  - slug: api-design-api-authentication-and-authorization
    name: "OAuth 2.0 and OpenID Connect in Practice"
    domain: architecture
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - api-design-authorization-methods
    summary: |-
      Delegated access done properly: the authorization code flow with PKCE, client credentials, refresh token rotation, and the flows the current best-practice guidance tells you to stop using.
    content_md: |-
      OAuth 2.0 is a **delegation** framework: it lets a user grant a third-party application limited access to their data on another service without handing over their password. OpenID Connect is a thin identity layer on top, which is what turns "this app may read your calendar" into "sign in with…". Confusing the two is the most common conceptual error in this area: OAuth authorises an application; OIDC tells you who the user is.

      ### The cast

      The **resource owner** is the user. The **client** is the application asking for access. The **authorization server** authenticates the user and issues tokens. The **resource server** is your API, which validates them. Clients are either **confidential** (a server that can keep a secret) or **public** (a browser app or a mobile app, which cannot — anything shipped to a device is not a secret).

      ### The flows that are current

      **Authorization code with PKCE.** The one flow you should reach for in almost every user-facing case. The client redirects the user to the authorization server with a `code_challenge` (the hash of a random `code_verifier` it just generated). The user authenticates and consents. The authorization server redirects back with a short-lived **code**. The client exchanges the code — presenting the original `code_verifier` — for tokens, over a back channel. PKCE (RFC 7636) exists because on a mobile or browser client an attacker who intercepts the redirect could otherwise redeem the code; without the verifier, the stolen code is useless. Originally a mobile mitigation, **PKCE is now recommended for all clients, confidential ones included**.

      **Client credentials.** No user involved: a service authenticates as itself and receives a token. The right flow for machine-to-machine access, and the one people reach for when they should be using an API key or vice versa — the distinction is that client credentials give you a short-lived token, standard introspection and centralised revocation, at the cost of an extra round trip.

      **Device authorization grant** (RFC 8628) for input-constrained devices: the TV shows a code, you type it on your phone.

      ### The flows that are not

      The **implicit** flow returned tokens directly in the URL fragment, where they landed in browser history and referrers; it is deprecated. The **resource owner password credentials** grant had the user type their password into the third-party app, defeating the entire purpose of OAuth; also deprecated. Both are removed in OAuth 2.1 and discouraged by RFC 9700, the OAuth 2.0 Security Best Current Practice. If a tutorial shows you either, it is out of date.

      ### Tokens in practice

      Access tokens should be short-lived. **Refresh tokens** trade longevity for revocability, and for public clients they must be **rotated**: each use issues a new refresh token and invalidates the old, so a stolen token is detectable — if the old one is presented again, the family is compromised and the authorization server revokes all of them.

      As a resource server, validate what arrives. If tokens are JWTs, fetch the authorization server's signing keys from its JWKS endpoint, cache them, honour key rotation, and check `iss`, `aud`, `exp` and the scopes. If they are opaque, call the **introspection** endpoint (RFC 7662) and cache the result briefly. Either way, the `aud` check is not optional — it is what prevents a token issued for one API being replayed against another.

      Redirect URI handling is where implementations get breached: register them exactly, match exactly (no wildcards, no prefix matching), and always use the `state` parameter — or the OIDC `nonce` — to bind the response to the request and defeat CSRF on the callback.

      ### The mistakes people actually make

      Implementing an authorization server yourself instead of using a reviewed one. Treating an OIDC **ID token** as an API access token — it is proof of authentication for the client, not a credential for your API. Long-lived access tokens with no revocation path. Loose redirect URI matching. Skipping `state`. And equating scopes with permissions, which the previous step covered and which OAuth's design makes tempting.
