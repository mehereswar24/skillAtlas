  - slug: api-design-api-keys-management
    name: "API Keys, Secrets and Machine Clients"
    domain: architecture
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - api-design-api-authentication-and-authorization
    summary: |-
      Issuing credentials to programs: storing keys so a database leak is survivable, scoping and rotating them without downtime, and signing requests when a bearer credential is not enough.
    content_md: |-
      An API key is the simplest credential there is — a long random string that identifies a caller — and its simplicity is exactly why it is used badly. Designing the key lifecycle well is a small amount of work that removes a large category of incident.

      ### Key or token?

      An API key is long-lived, opaque, and presented directly; a token is short-lived and obtained through a flow. Keys win on developer experience for server-to-server integrations — one value in an environment variable and you are done — and lose on revocation latency, because a leaked key works until someone notices. Offer keys for straightforward integrations and OAuth client credentials where you need centralised, auditable, short-lived access. Never accept a key from a browser: anything in client-side code is public.

      ### Generate and store them properly

      Generate from a cryptographically secure random source with enough entropy — 128 bits and up, encoded as URL-safe base64 or hex — never from a UUIDv1, a timestamp, or a counter.

      **Store only a hash.** A key is a credential, so your database should hold a digest, not the value. Unlike passwords, keys are high-entropy random values, so a slow memory-hard function is unnecessary — a fast SHA-256 of the key is appropriate, and it must be looked up in constant time relative to attacker-controlled input, which in practice means indexing on the hash rather than scanning and comparing. Show the plaintext exactly once, at creation.

      **Prefix and label them.** A key that looks like `sk_live_9f3a…` carries three useful facts: what kind of credential it is, which environment, and enough of a distinctive prefix that secret-scanning tools — the ones that watch public repositories and alert vendors — can recognise it. Publishing your prefix pattern to those scanning services is a genuinely high-return half-day of work. Store a last-four suffix so a user can identify a key in a list without you retaining the secret.

      ### Scope, rotate, observe

      Scope every key to the least it needs: specific permissions, specific environment, optionally specific source IP ranges, and its own rate limit and quota. A single all-powerful key is the credential that turns a minor leak into a full compromise.

      Rotation must be possible **without downtime**, which means supporting more than one active key per account: the customer creates a second key, deploys it, confirms traffic has moved — which requires you to record last-used timestamps — and then revokes the first. An API that allows only one key forces every rotation to be an outage, so nobody rotates. Support expiry dates, and warn before they arrive.

      Record last-used-at and last-used-from for every key. It is what makes "this key has not been used in nine months" and "this key is suddenly being used from a new country" answerable.

      ### When a bearer credential is not enough

      A bearer key proves possession and nothing more, so anyone who captures it can replay the request. Where that matters, **sign the request**: an HMAC over the method, path, timestamp and body, sent alongside a key identifier. The server recomputes it, compares in constant time, and rejects timestamps outside a small window to prevent replay. This is what webhook signatures do in the other direction, and it is why a webhook receiver must verify over the **raw body** — re-serialising the parsed JSON changes the bytes and the signature will never match.

      ### The mistakes people actually make

      Storing keys in plaintext. Emailing them. Accepting them in a query parameter, so they land in every access log and proxy along the way. One key per account with no rotation path. No expiry, no last-used data, no revocation UI. Using the same key in test and production. And treating a webhook signing secret casually — it is the only thing standing between your endpoint and forged events.
    resources:
      - kind: article
        title: "OWASP Cheat Sheet: Secrets Management"
        url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
      - kind: doc
        title: "RFC 2104 — HMAC: Keyed-Hashing for Message Authentication"
        url: "https://www.rfc-editor.org/rfc/rfc2104.html"
      - kind: doc
