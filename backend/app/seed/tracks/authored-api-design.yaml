  - slug: api-design-observability
    name: "Operating an API: Metrics, Traces, Logs and SLOs"
    domain: architecture
    est_hours: 7
    difficulty: advanced
    prerequisites:
      - api-design-api-performance
    summary: |-
      Instrumenting an API so that "is it working?" and "who is it broken for?" are both answerable in seconds, and alerting on the objectives your consumers actually care about.
    content_md: |-
      An API's consumers experience it as a black box. When something is wrong they will tell you very little — "it started failing" — so your instrumentation has to answer questions they cannot.

      ### Metrics, per route and per consumer

      The base layer is **RED** per endpoint: request rate, error rate, and duration as a **histogram** so you can compute percentiles. Label by route *template* (`/orders/{id}`, never the concrete path — that is unbounded cardinality and it will take your metrics system down), method, and status class.

      The dimension specific to APIs is **per-consumer**. Aggregate health hides the case that matters most: everything is fine except for one integration, which is failing every request. Label a small number of key metrics by API key, client id or tenant — with care, since that is a cardinality risk — or maintain a separate per-consumer rollup. It converts "we are at 99.95% overall" into "customer X has been at 0% for two hours", which is what your support team actually needs.

      Beyond RED, track the API-specific signals: rate-limit rejections by consumer (a spike means either an abusive client or a legitimate one that just launched something), authentication failures by consumer (a spike means a rotation went wrong or a credential-stuffing attempt), payload sizes, deprecated-endpoint usage by consumer, and cache hit ratio at the edge.

      ### Tracing across the boundary

      A single API call typically fans out to several internal services and databases. Distributed tracing turns "the endpoint is slow" into a waterfall showing exactly which span is responsible. Propagate context using the **W3C `traceparent`** header, and — the piece specific to APIs — accept and propagate a **correlation or request id** from the client, returning it in every response and in every error body. That single field lets a customer quote one identifier in a support ticket and lets you retrieve the complete story of their request. It is the highest return-on-effort item in this concept.

      Sampling keeps the volume affordable. Tail-based sampling is preferable where you can run it, because it keeps every error and every slow trace — precisely the ones you want — rather than a random percentage.

      ### Logs

      Structured, one event per request at the boundary, containing: timestamp, request id, trace id, consumer id, route template, method, status, duration, bytes, and the error code if any. Not the body — request and response bodies contain personal data, credentials and payment details, and logging them is both a privacy incident waiting to happen and a storage bill. Redact at the serialiser with an allowlist. Separate an **audit log** for security-relevant events (authentication outcomes, authorization denials, key lifecycle, permission changes) with different retention and stricter access, because its purpose is forensic rather than operational.

      ### SLOs, and what to page on

      Define objectives in the terms your contract is written in: availability ("99.9% of requests to the payments API return a non-`5xx` status") and latency ("99% complete within 300 ms"), measured over a rolling window, per endpoint group. Then alert on the **error budget burn rate** rather than on instantaneous thresholds: a fast burn pages immediately, a slow burn opens a ticket. This single change removes most alert noise, because it distinguishes a real outage from a brief blip that consumed a negligible slice of the budget.

      Alert on symptoms your consumers feel — error rate, latency, and per-consumer availability — not on CPU. And add two API-specific alerts that catch things nothing else will: a sudden change in traffic *shape* (a consumer's volume dropping to zero is as informative as a spike), and a rise in `4xx` after a deploy, which usually means you tightened validation and broke somebody.

      ### Tell consumers the truth

      A public **status page** and a documented incident communication process are part of the product. Consumers who can see an incident do not open tickets, and consumers who cannot lose trust far faster than the outage itself costs.

      ### The mistakes people actually make

      Labelling metrics with raw paths or user ids and collapsing the metrics backend. Only aggregate health, so a single broken integration is invisible. No request id in error responses, making support archaeology. Logging full bodies. Alerting on every `5xx`, so nobody reads the channel. And measuring inside the handler only, missing the queueing and network time the consumer actually experiences.
