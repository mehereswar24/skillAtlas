  - slug: api-design-api-lifecycle-management
    name: "Lifecycle: From Draft to Sunset"
    domain: architecture
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - api-design-versioning-and-evolution
      - api-design-api-documentation-tools
    summary: |-
      Running an API as a product with stability tiers, a design review that happens before code, a deprecation policy with dates, and a gateway that enforces the cross-cutting rules once.
    content_md: |-
      An API is a product with customers, a support cost and an end of life. Managing that explicitly is the difference between a platform and a growing pile of endpoints.

      ### Stages, and what each promises

      Name the stages and attach a promise to each, because the promise is the whole point. **Draft or design** — specification only, no implementation, freely changeable. **Alpha or experimental** — implemented, usable by named partners, may break with little notice, and clients must opt in knowing that. **Beta** — feature-complete, breaking changes announced with a stated notice period, suitable for non-critical production use. **Generally available (stable)** — the full compatibility guarantee and support commitment. **Deprecated** — still working, formally discouraged, with a published retirement date. **Sunset** — off.

      Publish which stage every endpoint is in, in the reference documentation and in the specification itself, so a developer can see the commitment level at the moment they decide to depend on something. The most common failure here is having no experimental tier at all, so everything shipped is implicitly permanent and teams become afraid to ship anything.

      ### Design review, before implementation

      Every new API surface should pass a review with someone who is not on the implementing team. Not a bureaucratic gate — a checklist review of the specification takes half an hour and prevents years of support burden. What to check: does this fit the existing conventions (naming, errors, pagination, dates)? Is it consistent with how similar things are already modelled? What happens when it is called twice? Is anything here an internal detail we would be embarrassed to support for five years? How would we deprecate it? And is a new endpoint actually needed, or is this an extension of an existing one?

      Maintaining a short organisational style guide makes this review mechanical rather than a matter of taste, and a spec linter automates most of it.

      ### Ownership and support

      Every API needs a named owning team, a documented support channel, and a stated response expectation. An API with no owner accretes inconsistencies, and its consumers find out during an incident. Alongside ownership, keep a **consumer inventory**: who calls this, with which keys, at what volume, on which version. Without it, every deprecation is a guess and every incident starts by asking who is affected.

      ### Deprecation with dates

      A deprecation policy has to be written before the first deprecation, because negotiating it under pressure produces something nobody honours. It should state: the minimum notice period per stability tier; how deprecation is signalled (headers, changelog, documentation banner, direct contact); and what happens at sunset — hard failure, or a gradual brownout. **Brownouts** — returning errors for a few minutes on scheduled days, increasing over time — are a genuinely effective technique for waking up integrators who ignore email, and they are far kinder than a single hard cutoff.

      Track usage of deprecated endpoints continuously and treat the count as the metric that must reach zero before retirement.

      ### The gateway, and what belongs in it

      An API gateway is where cross-cutting concerns are implemented once instead of in every service: authentication and token validation, rate limiting and quotas, request and response validation against the spec, routing and version dispatch, logging, and usage metering for billing. A **developer portal** sits alongside it for self-service key issuance, documentation and usage dashboards.

      Two cautions. Do not put business logic in the gateway — it becomes an undeployable, untestable centre of gravity. And do not let the gateway be a single point of failure with no local fallback: it is on the path of every request you serve.

      ### The mistakes people actually make

      No experimental tier, so every prototype becomes a permanent commitment. Deprecating in a changelog nobody subscribes to. No consumer inventory, so retirement never happens. Design review as a rubber stamp after the code is written. And a gateway that accumulates transformation rules until nobody can say what the API actually returns.
