  - slug: api-design-api-security
    name: "The API Attack Surface"
    domain: architecture
    est_hours: 9
    difficulty: advanced
    prerequisites:
      - api-design-authorization-methods
      - api-design-traffic-control-error-handling
    summary: |-
      The vulnerability classes that are specific to APIs rather than to web pages, and the design-level defences — input allowlists, output schemas, egress control — that remove whole categories at once.
    content_md: |-
      APIs fail differently from web applications. There is no browser to enforce anything, the endpoints are enumerable, the data is structured and machine-consumable, and the attacker has as much time as they want. The OWASP API Security Top 10 exists precisely because the classic web top ten misses most of it.

      ### The characteristic API vulnerabilities

      **Broken object and function level authorization** lead the list and were covered in the authorization step; they remain the highest-frequency, highest-impact class.

      **Excessive data exposure.** Returning the whole entity and expecting the client to display a subset. The client's UI is not a security boundary — the JSON is right there. Serialise through an explicit output schema listing the fields to return, so adding a `password_reset_token` column to a table cannot silently publish it.

      **Mass assignment.** The write-side mirror: binding a request body onto an entity so a caller can set fields you never intended, such as `role`, `is_verified` or `account_balance`. Bind to an explicit input model.

      **Unrestricted resource consumption.** No limits on page size, batch size, file size, expansion depth, query complexity or request rate, so a single caller can consume everything. This is why the rate-limiting step is a prerequisite here: limits are a security control, not merely an operational one.

      **Unsafe consumption of third-party data and SSRF.** Any endpoint that takes a URL and fetches it — a webhook registration, an avatar import, a document converter — can be pointed at `169.254.169.254`, at `localhost`, or at an internal service. **Server-Side Request Forgery** is devastating in cloud environments because the metadata service hands out credentials. Defend with an allowlist of schemes and hosts, DNS resolution checks that reject private and link-local ranges (re-checked after redirects, to defeat DNS rebinding), disabled redirects, and egress firewall rules. Never with a denylist of strings.

      **Injection**, still. Parameterised queries for SQL, and the same discipline for NoSQL operators, LDAP filters, XPath, shell commands and template engines. Never build a query by concatenation, including in "just an internal admin endpoint."

      **Business logic abuse.** Not a technical flaw at all: a coupon endpoint that can be called ten thousand times, a signup flow that can be automated, a price that can be sent by the client. Automated scanners cannot find these; only thinking adversarially about your own domain will.

      ### Design-level defences

      **Validate input against a schema at the edge** — types, formats, ranges, enums, maximum lengths, `additionalProperties: false` — and reject anything unexpected. Rejecting unknown fields is a small decision with a large payoff, because it neutralises mass assignment generically. The same schema you wrote in the design-first step does this work.

      **TLS everywhere**, including internally, with HSTS on public endpoints and modern protocol versions. Reject plaintext rather than redirecting an API request.

      **CORS is not a security control for your data** — it protects browser users from cross-origin reads, and it is trivially irrelevant to a non-browser client. Configure it narrowly anyway: an explicit origin allowlist, never a reflected `Origin` and never `*` together with credentials.

      **Do not leak through side channels.** Error messages that distinguish "no such user" from "wrong password", response timing that differs for existing and non-existing records, and sequential integer ids that reveal volume are all information disclosure.

      **Log security-relevant events** — authentication outcomes, authorization denials, key creation and revocation, permission changes — with enough detail to reconstruct an incident, and without secrets or personal data in the log line.

      ### Keep an inventory

      A large share of real breaches involve an endpoint nobody remembered: an old version left running, a staging host reachable from the internet, a debug route, an undocumented internal API. Generate the inventory from the specification, scan for hosts that serve endpoints not in it, and shut down what you cannot account for.

      ### The mistakes people actually make

      Relying on the client to enforce anything. Assuming an internal network is trusted. Turning on a permissive CORS policy to fix a browser error. Leaving GraphQL introspection and unlimited query depth enabled in production. Trusting `X-Forwarded-For` unvalidated and defeating your own rate limiter. And treating a penetration test as the security programme rather than a check on it.
    resources:
      - kind: doc
        title: "OWASP API Security Top 10 (2023)"
        url: "https://owasp.org/API-Security/editions/2023/en/0x11-t10/"
