  - slug: api-design-real-time-apis
    name: "Real-Time and Streaming APIs"
    domain: architecture
    est_hours: 7
    difficulty: advanced
    prerequisites:
      - api-design-different-api-styles
      - api-design-traffic-control-error-handling
    summary: |-
      Designing push interfaces — SSE, WebSockets, webhooks and streams — including the parts people skip: message schemas, resume after disconnect, auth on a long-lived connection, and backpressure.
    content_md: |-
      Real-time interfaces are usually designed as a transport choice and then discovered to be a contract problem. The transport is the easy half.

      ### Pick the weakest transport that works

      **Polling** with `ETag`/`If-None-Match` is stateless, cacheable, works everywhere, and is the right answer whenever a few seconds of latency is acceptable. It is unfashionable and frequently correct.

      **Server-Sent Events** is a one-way stream over an ordinary HTTP response. It reuses your existing authentication, proxies and infrastructure; browsers reconnect automatically and resend `Last-Event-ID` so you can resume; and it is the natural fit for notifications, progress updates, live feeds and streaming generated text. Over HTTP/1.1 it consumes one of the browser's six connections per host, which HTTP/2 fixes.

      **WebSockets** give a persistent bidirectional channel and are necessary when the client also sends at a high rate — chat, collaborative editing, multiplayer, live cursors. The cost is that you leave HTTP behind and inherit your own framing, reconnection, auth and observability story.

      **Webhooks** push to a URL the consumer registered. The right shape for partner integrations where the consumer has a server; the wrong shape for browsers.

      ### The contract, which is the part people skip

      A stream needs a specification exactly as much as a request/response API does, and **AsyncAPI** is the standard for writing one. Every message needs a `type` discriminator, a schema per type, and a version — because evolving a message shape has the same compatibility rules as evolving a response body, with the added difficulty that consumers may be offline during your rollout.

      Give every message a **monotonic sequence number or id** and an **idempotency-relevant identifier**. This is what makes the two hard problems solvable: a consumer that reconnects sends the last id it processed and you replay the gap from a buffer; and a consumer that receives a duplicate (which it will, because delivery is at-least-once) can discard it. Without ids, "real-time" quietly means "real-time except across disconnections", which is exactly when it matters.

      Decide and document the **delivery guarantee**, the **ordering guarantee** (per stream? per entity? none?), and the **retention window** for replay. Consumers will assume the strongest interpretation of each unless told otherwise.

      Prefer **thin events** — an identifier, a type and a timestamp — with the consumer fetching current state over your ordinary API, when consistency matters. Prefer **fat events** carrying the payload when consumers need history or must work without calling back. Both are defensible; mixing them per message type without saying so is not.

      ### Operating a long-lived connection

      **Authentication and revocation.** Browsers cannot set headers on a `WebSocket` or `EventSource` handshake, so the token arrives as a cookie or a query parameter — the latter lands in access logs, so if you must, use a short-lived single-use ticket rather than the real token. A connection that lives for hours outlives token expiry, so define what happens: periodic re-authentication over the channel, or a forced reconnect.

      **Backpressure.** A slow consumer whose messages you keep buffering grows your memory until something dies. Bound the per-connection buffer and choose a policy: drop, coalesce to the latest state, or disconnect. Say which in the documentation.

      **Reconnect storms.** A deploy disconnects every client at once; if they all reconnect immediately you have a self-inflicted load spike. Require, and implement in your own SDK, exponential backoff with jitter.

      **Liveness.** TCP will happily keep a dead connection open for a long time. Application-level heartbeats in both directions are the only reliable detection.

      ### Webhooks specifically

      As the sender you owe consumers: a signature over the raw body with a timestamp window, retries with exponential backoff over a documented schedule, at-least-once delivery stated plainly with a stable event id for deduplication, a delivery log they can inspect, a manual replay, and automatic disabling of an endpoint that has failed for a long time — with notification. Tell them to respond `2xx` immediately and process asynchronously, because your timeout is short.

      ### The mistakes people actually make

      Reaching for WebSockets when SSE would do. No sequence numbers, so a reconnect silently loses events. Broadcasting everything and filtering client-side, which leaks data. No documented ordering guarantee, so consumers invent one. Webhooks without signatures. And no way for a consumer to reconcile — every stream needs a plain HTTP endpoint that returns current state, because eventually a consumer will have missed something and needs to resynchronise.
