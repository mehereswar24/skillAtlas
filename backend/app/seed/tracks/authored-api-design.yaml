        url: "https://www.rfc-editor.org/rfc/rfc6902.html"

  - slug: api-design-design-first
    name: "Design-First: The Contract Before the Code"
    domain: architecture
    est_hours: 7
    difficulty: intermediate
    prerequisites:
      - api-design-learn-the-basics
    summary: |-
      Writing a machine-readable specification first, reviewing it before anything is built, and using it to generate clients, servers, mocks and tests so the contract cannot drift.
    content_md: |-
      The most expensive API mistakes are made in the first hour and discovered a year later, when changing them means breaking every consumer. Design-first exists because a specification is enormously cheaper to argue about than an implementation.

      ### What a specification buys you

      A machine-readable description — **OpenAPI** for HTTP APIs, a `.proto` for gRPC, an SDL for GraphQL, **AsyncAPI** for event-driven interfaces — turns the contract from prose into an artefact that tooling can act on. From one OpenAPI document you get reference documentation, client libraries in a dozen languages, server stubs, a mock server that returns valid example responses, request and response validation middleware, and — the underrated one — a **diff** between two versions that a pipeline can inspect and fail on when a change is breaking.

      Underneath OpenAPI sits **JSON Schema**, which is where the actual precision lives: types, formats, required fields, enums, minimum and maximum, patterns, and composition. A schema that says `"type": "string"` describes almost nothing; one that says a string with `format: date-time`, or an integer between 1 and 100 with a default, is a contract a client can be generated against and a server can validate with.

      ### The workflow

      Write the specification. Review it with the people who will consume it — that review is the entire point, and it is where you discover that the mobile team needs two fields you were not planning to return, or that "status" means different things to two teams. Publish a mock server from the spec so client work starts in parallel with server work. Then implement, with the spec validated in tests so an endpoint cannot silently diverge from what it promises.

      The alternative, **code-first**, generates the spec from annotations in the implementation. It is easier to keep in sync, because it is derived, and that is also its weakness: the document describes whatever the code does, including its accidents, so nobody ever reviews the design as a design. It works well for internal APIs with one consumer and poorly for anything public. A pragmatic middle path is to author the spec by hand for the public surface and generate it for internal endpoints.

      ### Making the contract enforceable

      A specification that lives beside the code but is not checked is a comment. Three mechanisms make it real: **validate responses against the schema in your test suite**, so a serialiser change that drops a field fails a test; **lint the spec in the pipeline** with a ruleset (Spectral and equivalents) so naming, error shapes and required documentation are consistent across dozens of endpoints written by dozens of people; and **diff the spec against the last released version** and fail the build on a breaking change unless a version bump accompanies it.

      ### Design review questions worth asking

      Is every operation's effect obvious from its method and path? What happens if this is called twice? What does a client do with each error? Which fields will realistically become optional, plural, or a different type later — and can we model that now? Is anything here an internal implementation detail we would be embarrassed to support for five years? And, most usefully: write the client code first, as pseudocode, and see whether the API is pleasant to call.

      ### The mistakes people actually make

      Treating the spec as a documentation chore written after shipping. Specifying only the happy path, so every error shape is improvised per endpoint. Generating clients from a spec nobody validates against the real responses. Modelling the database rows directly, which welds your schema to your storage. And skipping consumer review, which is the one step that catches design errors while they are still free.
    resources:
      - kind: doc
        title: "OpenAPI Specification"
        url: "https://spec.openapis.org/oas/latest.html"
      - kind: doc
        title: "OpenAPI Initiative: Learn OpenAPI"
        url: "https://learn.openapis.org/"
      - kind: doc
