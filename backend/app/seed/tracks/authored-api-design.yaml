  - slug: api-design-different-api-styles
    name: "Choosing a Style: REST, GraphQL, gRPC, Webhooks, Events"
    domain: architecture
    est_hours: 7
    difficulty: intermediate
    prerequisites:
      - api-design-learn-the-basics
    summary: |-
      Matching the interface style to who calls it and how, instead of to what is currently fashionable — and recognising when the answer is more than one.
    content_md: |-
      Style is not a taste question. Each option makes a different set of things cheap and a different set expensive, and the right choice falls out of who your consumers are and what their traffic looks like.

      ### REST over JSON

      Resources at URLs, HTTP methods, JSON representations. Its dominance for public APIs is not inertia: every language has a client, every proxy and CDN understands it, HTTP caching works without any effort, it is debuggable with `curl` and readable in a network tab, and the learning cost for a new consumer is near zero. What it is bad at is bespoke data shapes — a client needing three related objects makes three calls, and a client needing two fields still receives forty.

      ### GraphQL

      A typed schema, one endpoint, and client-specified queries across related objects in a single round trip. The right fit when many heterogeneous clients — web, iOS, Android, partners — evolve faster than the backend can add endpoints for them, and when over-fetching on mobile is a real cost. Its costs are systematic rather than incidental. HTTP caching largely stops applying, so you replace it with persisted queries and application caching. Rate limiting by request count is meaningless when one request can be arbitrarily expensive, so you need query **cost analysis** and a **depth limit** — without them, a nested query is a denial-of-service primitive. Errors arrive as `200` with an `errors` array, so your monitoring must be taught to look inside the body. And resolvers produce N+1 database queries by construction unless batched.

      ### gRPC

      Protocol Buffers over HTTP/2 with generated code from a `.proto`. Compact, fast, strictly typed, with real bidirectional streaming. The default for internal, high-volume service-to-service traffic. Costs: not directly reachable from a browser without a proxy; binary payloads need tooling to inspect; and the schema evolution rules are strict — never reuse a field number, never change a field's type — which is a discipline, not a difficulty.

      ### Webhooks

      The style people forget to design and then bolt on badly. Instead of the consumer polling you, you `POST` to a URL they registered. This is the correct answer for events a partner needs promptly and cannot poll for efficiently — payment settled, job finished, document signed. It inverts the reliability problem: *you* are now a client of *their* possibly-unreliable endpoint, which means signed payloads, retries with backoff, a delivery log, and a replay mechanism are all part of the design.

      ### Asynchronous and event streams

      Publishing to a broker or an event stream that consumers subscribe to. Right when the producer should not know its consumers, when consumers need history and replay, or when volume is too high for per-event HTTP calls. Contracts still exist here — the message schema — and AsyncAPI is to events what OpenAPI is to HTTP.

      ### Choosing, and combining

      Public and third-party: REST, because ecosystem cost dominates. Rich first-party clients with a dedicated frontend team: GraphQL, often at a gateway in front of REST or gRPC services. Internal hot paths: gRPC. Partner notifications: webhooks. High-volume, many-consumer data flows: events. Mature platforms run several, and the mistake is not having several — it is having several with independently drifting definitions of the same concepts.

      ### The mistakes people actually make

      Adopting GraphQL for one first-party client, paying all its costs for none of its benefits. Calling `POST /doAction` REST and then wondering why caching and retries do not work. Exposing gRPC to browsers. Offering webhooks with no signature, no retry and no way to replay. And letting each style define "customer" differently, so integrating them becomes a translation project.
    resources:
      - kind: doc
        title: "GraphQL: Learn"
        url: "https://graphql.org/learn/"
      - kind: doc
        title: "GraphQL: Best practices"
        url: "https://graphql.org/learn/best-practices/"
      - kind: doc
        title: "gRPC: Introduction"
