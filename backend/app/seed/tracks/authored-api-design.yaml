  - slug: api-design-api-performance
    name: "Latency, Payload Cost and Caching at the Edge"
    domain: architecture
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - api-design-handling-data-requests
    summary: |-
      Making an API fast through design rather than tuning: fewer round trips, smaller payloads, and HTTP caching that a client and a CDN can both participate in.
    content_md: |-
      An API's performance is determined mostly by decisions made at design time — how many calls a task requires, how big each response is, and whether anything can be cached — and only secondarily by how fast the handler runs.

      ### Round trips first

      A client on a mobile network pays 50–200 ms per round trip before your server does anything. An operation requiring six sequential calls is therefore slow no matter how fast each one is. Design so common tasks need one call: return the created object rather than requiring a follow-up read; support expansion of related resources; provide a batch endpoint or, if you have many client-specific shapes, consider GraphQL or a purpose-built aggregate endpoint for that client. The anti-pattern to hunt for is **N+1 across the API boundary** — a list endpoint whose items each require a detail call. It is the same bug as the database N+1, one layer up, and it is far more expensive.

      ### Payload size

      Measure your responses; the number is usually larger than anyone guessed. The levers, in order of return. **Do not return what nobody uses** — support sparse fieldsets, and periodically check which fields are actually read. **Compress**: `gzip` is universal and `br` (Brotli) is better for text; both routinely cut JSON by 70–80% and are typically enabled at the edge with a couple of lines. **Do not embed binaries** — a base64 image in JSON is a third larger than the file and defeats caching; return a URL. **Paginate by default** with a sane maximum, so no response is unbounded.

      ### HTTP caching, used properly

      This is the highest-leverage performance feature in HTTP and the most neglected. Two mechanisms, and they compose.

      **Freshness.** `Cache-Control: max-age=N` lets caches serve without asking. For shared caches, `public` versus `private` decides whether a CDN may store it — and getting this wrong on a personalised response is a data leak, not a performance bug. `stale-while-revalidate` lets a cache serve a slightly stale response instantly while refreshing in the background, which is often the single best latency change available for read-heavy endpoints.

      **Validation.** Return an `ETag`; when the client sends `If-None-Match`, reply `304 Not Modified` with no body. The request still costs a round trip but the payload cost disappears, which matters most on large responses and metered connections. Generate the tag from something meaningful — a version column or a hash of the canonical representation — not from a timestamp that changes on every read, which silently makes every validation a miss.

      Always set `Vary` correctly: a response that differs by `Accept`, `Accept-Encoding`, `Accept-Language` or `Authorization` must say so, or a shared cache will serve one variant to everyone.

      ### Connection-level wins

      HTTP/2 multiplexes many requests over one connection, removing the per-request handshake and the browser's connection limit; HTTP/3 additionally removes head-of-line blocking at the transport layer on lossy networks. Both are usually an edge configuration rather than an application change. **Encourage connection reuse** by clients — a client creating a new TLS connection per request pays a handshake every time, and this is a very common defect in server-side integrations. Terminating TLS geographically close to users, via a CDN or anycast edge, cuts handshake latency substantially even for uncacheable responses.

      ### Know your numbers

      Report **percentiles**, per endpoint, measured at the edge rather than inside the handler — the difference between the two is queueing and network time that your application metrics cannot see. Set explicit latency objectives per endpoint and treat a regression as a defect. And be honest about which endpoints matter: the login and the primary list view dominate the perceived speed of most products.

      ### The mistakes people actually make

      Optimising the handler while the client makes ten calls. Compression disabled because the CDN configuration was never checked. `Cache-Control: no-store` applied blanket-fashion out of caution, discarding the entire caching layer. An `ETag` derived from a `updated_at` that ticks on every read. Missing `Vary`, so compressed responses are served to clients that cannot decompress them. And measuring averages, which hide exactly the requests users complain about.
