  - slug: api-design-traffic-control-error-handling
    name: "Errors, Rate Limits and Backpressure"
    domain: architecture
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - api-design-idempotency-and-consistency
    summary: |-
      A single machine-readable error format, a rate-limiting scheme clients can cooperate with, and a defined behaviour when you are past capacity.
    content_md: |-
      Errors and limits are the parts of an API developers spend the most time with and designers spend the least time on. Getting them right is disproportionately visible.

      ### One error format, everywhere

      Every error response should have the same shape, so a client writes one handler instead of thirty. **RFC 9457, Problem Details for HTTP APIs** (which obsoletes RFC 7807) is the standard and worth adopting rather than inventing: `Content-Type: application/problem+json`, with `type` (a URI identifying the error class — the stable thing clients branch on), `title` (a short human summary), `status` (matching the HTTP status), `detail` (this occurrence), `instance`, and any extension members you need.

      The important design point is that **the machine-readable discriminator must be stable and distinct from the human message.** Clients that parse `detail` will break the day you improve the wording. Give every error class a code, document them all in one place, and never reuse one for a different meaning.

      For **validation errors**, one error object is not enough: return every failure at once, each naming the offending field with a pointer (a JSON Pointer, or a documented path form) and a machine code, so a form can highlight all six problems instead of revealing them one round trip at a time.

      Two rules on content. Say what the client should *do*: "the `currency` field must be a three-letter ISO 4217 code" beats "invalid input". And never leak internals — stack traces, SQL fragments, hostnames, library versions — but do include a **request id** that also appears in your logs, so a support conversation takes one lookup instead of a search through everything.

      ### Choosing the right status

      The distinction that matters most to a client is **retryable versus not**. `4xx` means do not retry this request as-is (except `408`, `425` and `429`). `5xx` means it may be worth retrying. Getting this wrong is expensive in both directions: returning `500` for a validation failure invites clients to hammer you with a request that will never succeed, and returning `400` for a transient internal fault makes a recoverable blip look like a permanent client error.

      ### Rate limiting

      Three algorithms cover almost everything. A **fixed window** counts requests per calendar minute; simple, and it permits a double burst across the boundary. A **sliding window** smooths that at slightly more cost. A **token bucket** refills tokens at a steady rate up to a capacity, which is usually the best fit for an API because it allows a legitimate burst while bounding the sustained rate — and it is what most gateways implement.

      What matters as much as the algorithm is **cooperating with the client**. Return `429 Too Many Requests` with `Retry-After`, and expose the client's budget continuously — the IETF `RateLimit` header fields (`RateLimit-Limit`, `RateLimit-Remaining`, `RateLimit-Reset`, or the newer combined `RateLimit` field) let a well-behaved client pace itself rather than probing for the wall. Document the limits, the window, and what the key is: per API key, per user, per IP, or per tenant. Per-IP alone is wrong behind NAT and in corporate networks. Consider weighting expensive endpoints more heavily than cheap ones, and offering a separate, higher burst allowance.

      Also decide the behaviour at your *own* limits, not just the client's: **quotas** (monthly volume) are a business construct and should fail differently from rate limits, usually with `403` and a clear billing-oriented error type.

      ### Backpressure and overload

      When the service itself is past capacity, the honest response is to shed load: `503 Service Unavailable` with `Retry-After`, returned quickly. This is counter-intuitive and correct — accepting everything and serving all of it slowly means every client times out and retries, which doubles the load you already could not handle. Fail fast, protect the requests you did accept, and prioritise: a payment confirmation matters more than an analytics ingest.

      Publish, and enforce, **timeouts and deadlines**. Tell clients how long an endpoint may take so their own timeout is informed rather than guessed.

      ### The mistakes people actually make

      A different error shape per endpoint. `200` with an error inside. Human-readable messages as the only discriminator. Rate-limit headers on success but not on the `429`. No `Retry-After`, so every rate-limited client busy-loops. Rate limiting on IP for an API used by server-side integrations. And leaking whether a resource exists through the *error* while carefully hiding it in the success path.
