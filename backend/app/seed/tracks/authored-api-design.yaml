  - slug: api-design-api-testing
    name: "Testing an API: Contract, Behaviour and Abuse"
    domain: architecture
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - api-design-traffic-control-error-handling
      - api-design-api-documentation-tools
    summary: |-
      Proving the implementation matches the contract, that the error and auth paths behave, and that a hostile or merely careless client cannot break it — plus contract tests so a change does not break consumers you cannot see.
    content_md: |-
      Testing an API has one requirement ordinary unit testing does not: the thing under test is a **promise to other people**, so the suite must verify the promise, not merely the code.

      ### Validate responses against the schema

      The highest-value, lowest-effort test in this whole concept: in your integration tests, assert every response validates against the OpenAPI schema for that operation. This catches a serialiser dropping a field, a type changing from integer to string, a null appearing where the schema says it cannot, and a new endpoint that was never specified. It costs one assertion helper and it makes the specification true rather than aspirational.

      Run it in both directions: also validate that your server **rejects** requests the schema forbids. An endpoint that quietly accepts an unknown field is an endpoint whose contract is wider than documented, and someone will come to depend on it.

      ### Test the paths nobody writes tests for

      Happy-path tests are the ones that get written; the failures live elsewhere. Cover, deliberately: **validation** (missing required field, wrong type, out-of-range, empty string, oversized string, unexpected field, malformed JSON, wrong content type); **authentication** (no token, expired token, malformed token, token for a different audience); **authorization** as a **matrix** — for each role and each endpoint, assert the allowed *and* the denied case, and specifically assert that user A cannot read user B's object, which is the automated test for the top OWASP API vulnerability; **idempotency** (send the same request twice with the same key, assert one effect and identical responses); **concurrency** (two conflicting updates, assert the second gets `412`); **pagination** (walk a full cursor sequence, insert a record mid-walk, assert nothing is skipped or repeated); and **rate limiting** (assert the `429`, the `Retry-After`, and the headers).

      ### Contract testing

      Your tests prove your API does what your spec says. They cannot prove your **consumers** still work — you do not run their code. Consumer-driven contract testing closes this: each consumer publishes the subset of your API it actually relies on, and your pipeline verifies every published contract before release. The valuable property is that it tells you which specific consumer a change breaks, so a "breaking" change to a field nobody uses can proceed and a subtle one to a field three teams depend on is caught. The same technique works in reverse when you are the consumer of a third party, with recorded interactions verified against their sandbox on a schedule.

      Cheaper alternatives that capture much of the value: **spec diffing** in CI, failing the build on a breaking schema change without a version bump; and snapshot-testing representative responses so unintended shape changes are visible in a diff during review.

      ### Fuzzing and abuse

      Schema-aware fuzzers generate requests from your OpenAPI document, including deliberately invalid ones, and report responses that violate the spec or return `500`. This finds a surprising number of unhandled-input crashes for very little setup. Complement it with the deliberately hostile cases: enormous payloads, deep nesting, unicode and null bytes in strings, negative and overflowing numbers, duplicate JSON keys, and a URL parameter pointing at `localhost`.

      ### Performance and CI

      Load tests belong in the pipeline as a scheduled job with thresholds, not as a manual event before launch. Assert on p95 and p99 for key endpoints against a realistic data volume — a suite passing against an empty database proves nothing about behaviour at a million rows.

      ### The mistakes people actually make

      Testing only `200`s. Testing authorization with one account. Asserting on the whole response body, so every additive change breaks fifty tests — assert on the fields the test is about. Mocking your own API in your own tests. Letting the test suite share mutable state so tests pass only in one order. And treating the spec as documentation rather than as an oracle the tests check against.
