  - slug: api-design-building-json-restful-apis
    name: "Resource Modelling and URL Design"
    domain: architecture
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - api-design-design-first
    summary: |-
      Turning a domain into resources, collections and relationships; designing URLs and JSON representations that stay coherent as the API grows to two hundred endpoints.
    content_md: |-
      This is where an API acquires the shape it will keep forever. The goal is a surface where a developer who has learned three endpoints can correctly guess the fourth.

      ### Resources, not procedures

      A resource is a *thing* your API is about — an order, a user, a subscription — identified by a URL, with representations you can read and write. Use plural nouns for collections and an identifier for a member: `/orders`, `/orders/{orderId}`. Nest only to express containment, and only one level: `/orders/{orderId}/items` is fine; `/customers/{c}/orders/{o}/items/{i}/discounts/{d}` is a URL nobody can construct and a coupling you will regret. If an item has its own identity, give it a top-level path too and let the nested path be a filtered view.

      Use lowercase, hyphenated path segments, and keep identifiers opaque — an integer primary key in a public URL leaks your row count and invites enumeration; a UUID or a prefixed opaque id (`ord_9f3a...`) is better on both counts and lets a support engineer tell at a glance what an id refers to.

      ### Actions that are not CRUD

      Some operations genuinely are not create/read/update/delete: publish, cancel, refund, retry, send. Two honest options. Model the action as a **sub-resource you create** — `POST /orders/{id}/cancellations` — which gives the action its own identity, its own timestamp and its own audit trail, and is the better choice when the act is itself a business fact. Or use a **documented verb endpoint**, `POST /orders/{id}:cancel` or `/orders/{id}/cancel`, which is clearer for simple state transitions. What does not work is contorting everything into `PATCH {"status": "cancelled"}`, because then one endpoint implements six different operations with six different validation rules and permission checks.

      ### The representation

      Consistency beats cleverness. Pick one field-naming convention and never deviate. Pick one date format — RFC 3339 with an explicit offset, always, and store and return UTC unless a local time is semantically required. Represent money as a minor-unit integer plus a currency code, never a float. Use `null` to mean "known to be absent" and omit fields that are not applicable, but decide which and document it, because clients branch on the difference.

      Return the full updated representation from `POST`, `PUT` and `PATCH` rather than `204`, so the client does not need a follow-up read. Wrap collections in a small envelope with room for pagination metadata rather than returning a bare array — a bare top-level array leaves you nowhere to add a cursor later, and historically was an XSS vector in browsers.

      Expose relationships as identifiers plus, optionally, a way to expand them (`?expand=customer`) rather than embedding everything by default. Embedding by default is how a response grows to 400 KB and nobody can remove a field.

      ### Hypermedia, realistically

      Fielding's REST includes hypermedia: responses carry links telling the client what it can do next, so URLs are discoverable rather than hard-coded. In practice most successful APIs are level 2 on the Richardson maturity model — resources and proper methods, no hypermedia — because clients are generated from a spec and hardly ever follow links. Where links genuinely pay off is pagination (`next` and `prev` cursors), state transitions available on a resource, and long-running operations pointing at their status URL. Use them there and do not agonise about the rest.

      ### The mistakes people actually make

      Exposing the database schema as the API, so every internal refactor breaks clients. Designing around the first screen of the first client. Mixing naming conventions across teams. Deep nesting. Returning different shapes for the same entity from different endpoints. And putting sensitive values in the path, where they land in access logs, browser history and referrer headers.
