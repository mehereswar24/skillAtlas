  - slug: api-design-authentication-methods
    name: "Proving Who the Caller Is"
    domain: architecture
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - api-design-learn-the-basics
    summary: |-
      Sessions, bearer tokens, JWTs and mutual TLS — what each actually proves, where the token lives, and the revocation problem that decides between them.
    content_md: |-
      Authentication answers one question: which principal is making this request? Everything about the mechanism follows from two sub-questions — where does the credential live between requests, and how do you stop honouring it?

      ### Sessions versus tokens

      **Server-side sessions.** The server stores session state and gives the client an opaque identifier, usually in a cookie. Revocation is trivial (delete the row), the identifier carries no information, and updating a user's permissions takes effect on the next request. The cost is a lookup per request and shared session storage across instances. For browser-based first-party applications this remains an excellent default, and it is under-recommended relative to how well it works.

      **Self-contained tokens.** The server issues a signed token containing claims; it validates the signature and trusts the contents without a lookup. This scales beautifully across services and has one fundamental drawback that no amount of engineering removes: **you cannot un-issue it**. A token valid for an hour is valid for an hour, even if the user was deleted five minutes ago, unless you add a revocation list — which reintroduces the lookup you were avoiding.

      The resolution most systems land on: short-lived access tokens (minutes) plus a long-lived refresh token that is stored server-side and can be revoked. You get statelessness on the hot path and revocation within the access token's lifetime.

      ### JWTs, carefully

      A JWT is a header, a payload of claims, and a signature, base64url-encoded and dot-separated. Two facts about it cause most of the trouble. It is **signed, not encrypted** — anyone holding it can read the claims, so nothing secret goes inside. And its security depends entirely on **validating it correctly**, which means: verify the signature with a key you chose, never one the token names; pin the accepted algorithms explicitly, because accepting `none` or letting an attacker switch an RS256 verification to HS256 with the public key as the secret are both real, repeatedly-exploited bugs; check `exp` and `nbf`; and check `iss` and **`aud`** — the audience claim is what stops a token minted for service A from being replayed against service B.

      Keep tokens small. They are sent on every request, and a JWT stuffed with fifty permission strings is a header size problem and a staleness problem at once.

      ### Where the credential lives, in a browser

      Two options, each with a distinct risk. A **cookie** with `HttpOnly`, `Secure` and `SameSite=Lax` or `Strict` is unreadable by injected script — which is a genuine protection against XSS token theft — but is sent automatically, so state-changing endpoints need CSRF protection. A token in **memory** and sent in an `Authorization` header is not automatically attached, so CSRF does not apply, but any successful XSS can read and exfiltrate it. Storing tokens in `localStorage` is the common choice and the weakest, because it survives page loads and is trivially readable by any script. There is no option with no downside; pick knowingly and mitigate the corresponding risk.

      ### Machine callers

      For service-to-service traffic, **mutual TLS** authenticates both ends with certificates at the transport layer, is very strong, and brings certificate lifecycle management with it — which is why service meshes exist to automate it. For simpler cases, API keys and OAuth client credentials cover most needs; both get their own steps in this track.

      ### Practical rules

      Always use `Authorization: Bearer <token>` rather than a custom header or a query parameter — a token in a URL ends up in access logs, browser history, referrer headers and error reports. Return `401` with a `WWW-Authenticate` header when authentication is missing or invalid, and `403` when it is valid but insufficient. Rate-limit and monitor authentication endpoints specifically; they are where credential stuffing happens. And never let an error message distinguish "no such user" from "wrong password".

      ### The mistakes people actually make

      Writing JWT validation by hand. Trusting the `alg` header. Skipping `aud`. Issuing access tokens valid for a year because refresh was inconvenient. Putting the token in a query string "just for the websocket". And building a bespoke authentication scheme when a well-reviewed library and a standard flow were available.
