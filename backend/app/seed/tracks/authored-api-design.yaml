  - slug: api-design-api-integration-patterns
    name: "Integrating With Someone Else's API"
    domain: architecture
    est_hours: 7
    difficulty: advanced
    prerequisites:
      - api-design-real-time-apis
      - api-design-api-keys-management
    summary: |-
      The other side of the contract: writing a client that survives the provider's bad day, receiving webhooks safely, and keeping a third party's model from leaking through your codebase.
    content_md: |-
      Everything in this track so far has been about the API you publish. Most engineers spend more time consuming APIs than designing them, and consuming one badly is how a partner's minor incident becomes your outage.

      ### Wrap it, do not spread it

      The first decision is structural: put every call to a third party behind **one adapter** in your codebase. Nothing outside it should import the vendor's SDK or know their field names. This **anti-corruption layer** does four things at once — it gives you a single place for timeouts, retries, logging and metrics; it lets you translate their model into yours, so their odd enum values and their notion of "customer" do not colonise your domain; it makes testing possible without a network; and it means replacing the provider, or adding a second, is a bounded change.

      Translate at the boundary. If their `status` has seven values and you care about three, map to your three at the edge. If you pass their raw response deeper into your code "for now", you have permanently coupled your domain to their release schedule.

      ### Assume they will be down

      Every pattern from the failure-handling literature applies to you as a consumer. **Explicit timeouts** on every call, derived from their published or observed latency, never left at the library default. **Retries with exponential backoff and jitter**, only for idempotent operations or ones protected by an idempotency key, with a bounded total. **Circuit breakers**, so when they are failing you stop waiting and fail fast — which protects your own latency as much as their recovery. **Bulkheads**: a separate connection pool and concurrency limit per provider, so a slow one cannot consume all your workers.

      Then decide, explicitly, what you do when the call fails: serve stale cached data, degrade the feature, queue the work for later, or fail the user's request. Each is right sometimes; the failure is not having decided, so the answer becomes whatever the exception handler happened to do.

      **Respect their limits.** Read their rate-limit documentation, honour `Retry-After`, and use the `RateLimit` headers if they publish them. Cache their responses aggressively where the data allows, both to be a good citizen and because their latency is now inside yours.

      ### Receiving webhooks

      Four rules, all learned the hard way. **Verify the signature over the raw body** before parsing, in constant time, with a timestamp freshness window — re-serialising the parsed JSON changes the bytes and the check will silently never match. **Return `2xx` immediately** and process asynchronously: senders time out in seconds, and a slow handler triggers retries that multiply your load. **Expect duplicates and out-of-order delivery**, so key on the provider's event id and make handling idempotent; do not assume event B arriving means event A already did. And **reconcile periodically** — poll their API for the state of recent objects and compare — because webhooks get lost, endpoints get disabled, and a silent gap is worse than a noisy failure.

      Log every delivery with its id and outcome, and build a replay path from the start.

      ### Testing an integration you do not control

      Record real interactions and replay them in tests, and run a scheduled job that verifies the recordings still match the provider's sandbox — otherwise your tests pass forever against a contract that changed months ago. Test the failure paths explicitly: timeout, `500`, `429`, malformed body, and a response with a field you did not expect. Use their sandbox for end-to-end coverage, and know its limits: sandboxes are usually more reliable and less rate-limited than production, so they will not surface the behaviours you most need to handle.

      ### Operating the dependency

      Track, per provider: success rate, latency percentiles, and cost. Subscribe to their status page and changelog, and put a human on it — deprecation notices arrive by email and get filtered. Keep credentials rotatable without a deploy. And know, for each provider, what your business does if they are unavailable for a day, because that answer determines how much resilience is worth building.

      ### The mistakes people actually make

      No timeout. Retrying a payment without an idempotency key. Parsing the webhook body before verifying its signature. Processing webhooks synchronously. Passing the vendor's objects through the whole codebase. Storing their identifiers as the only key for something you own. And discovering a deprecation the day it takes effect, because nobody read the email.
