  - slug: api-design-authorization-methods
    name: "Deciding What the Caller May Do"
    domain: architecture
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - api-design-authentication-methods
    summary: |-
      RBAC, ABAC and relationship-based models, why scopes are not permissions, and object-level authorization — the vulnerability class that tops the OWASP API list year after year.
    content_md: |-
      Authentication is largely a solved problem you can buy. Authorization is not, because it encodes your business rules, and it is where APIs are most often broken.

      ### The models

      **RBAC** assigns permissions to roles and roles to users. Simple, auditable, and it degrades in a predictable way: as requirements grow you get `admin`, `admin_readonly`, `regional_admin_emea`, and eventually a role per user, at which point roles have stopped meaning anything.

      **ABAC** evaluates a policy over attributes of the subject, the resource, the action and the environment — "a manager may approve an expense under 5,000 in their own department during business hours." Far more expressive, and correspondingly harder to reason about, test and explain to a user asking why they were denied.

      **ReBAC** decides based on relationships in a graph — "you may edit this document because you are an editor of a folder that contains it" — which is the natural model for collaborative products and for anything with inheritance and sharing. Google's Zanzibar paper is the reference design, and there are open implementations of it.

      Most systems end up hybrid: roles for coarse capability, attributes or relationships for the fine-grained decisions. That is fine. What is not fine is having the rules scattered across two hundred handlers.

      ### Scopes are not permissions

      An OAuth **scope** describes what a *client application* was authorised to do on the user's behalf — `invoices:read`. It does not describe what the user themselves may do. A token with `invoices:read` must still not read another tenant's invoices. Checking the scope and stopping there is one of the most common and most severe API bugs, because it looks like an authorization check and is only half of one. Always evaluate both: does this client have permission for this operation, *and* does this principal have permission for this specific object?

      ### Object-level authorization

      **Broken Object Level Authorization (BOLA)** — changing `/orders/1001` to `/orders/1002` and getting someone else's data — has been the number one entry on the OWASP API Security Top 10 across editions, because it is trivial to exploit and invisible in testing that only ever uses one account. Its sibling, **Broken Function Level Authorization (BFLA)**, is calling an admin endpoint as a normal user because the check lived in the UI.

      Two structural defences beat vigilance. First, **enforce at the data-access layer, not the handler**: make the query itself scoped — `WHERE tenant_id = :current_tenant` — so that forgetting the check yields no rows rather than someone else's rows. In multi-tenant systems this is the single highest-value pattern, and row-level security in the database is the strongest version of it. Second, make the safe thing the default: a framework where an endpoint without an explicit policy is denied catches the omission that a code reviewer will not.

      Related, and equally common: **mass assignment**, where binding a request body straight onto a model lets a caller set `role` or `is_admin`. Bind to an explicit input schema, never to the entity.

      ### Centralise the decision, distribute the enforcement

      Write the rules in one place — a policy module, or a dedicated engine such as OPA or a Zanzibar-style service — and call it from everywhere. This makes the rules reviewable, testable in isolation, and changeable without touching handlers. Test them as a **matrix**: for each role and each endpoint, assert both the allowed and the denied case. The denied cases are the ones nobody writes and the ones that matter.

      Decide deliberately whether a denial is `403` or `404`. `403` is honest; `404` hides existence, which matters when the identifier itself is sensitive. Either is defensible; being inconsistent is not, because the difference becomes an enumeration oracle.

      ### The mistakes people actually make

      Checking permission on the id in the path but not on the ids in the body. Trusting a tenant id supplied by the client instead of deriving it from the token. Filtering results in the client. Letting an internal service call skip authorization entirely because "it is on the private network". And auditing nothing, so after a breach nobody can say what was accessed.
