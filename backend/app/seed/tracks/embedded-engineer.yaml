track:
  slug: embedded-engineer
  title: Learn Embedded Systems
  domain: embedded
  target_role: Embedded Systems Engineer
  difficulty: advanced
  description: >-
    Software that runs on constrained hardware, close to the metal: C and
    microcontrollers, peripherals and interrupts, real-time constraints and
    connected devices.

concepts:
  - slug: linux-and-shell

  - slug: c-and-microcontrollers
    name: C & Microcontrollers
    domain: embedded
    est_hours: 45
    difficulty: intermediate
    prerequisites: []
    summary: >-
      Pointers, memory layout and the bare-metal execution model of a chip with
      kilobytes of RAM and no operating system.
    content_md: |
      Embedded work strips away every convenience. There is no garbage
      collector, often no operating system, and frequently less RAM than a single
      web page uses.

      **C, precisely.** Pointers, arrays and the fact that they are not the same
      thing. Manual memory management — and the strong preference in embedded for
      static allocation, because a heap that fragments over months of uptime is a
      field failure you cannot debug. `volatile` on anything a peripheral or
      interrupt can change behind the compiler's back, or your read gets
      optimised away.

      **The memory map.** Flash holds code and constants, RAM holds variables and
      the stack, and peripherals are memory-mapped registers you read and write
      like variables. Stack overflow is silent and corrupts whatever is adjacent.

      **Bit manipulation is daily work.** Setting, clearing and testing
      individual bits in a control register is how you configure hardware.

      **The toolchain.** Cross-compiler, linker script, and a flashing tool.
      Debugging happens over JTAG/SWD or, very often, by toggling a pin and
      watching it on a logic analyser.
    resources:
      - kind: book
        title: "Modern C (free PDF)"
        url: https://inria.hal.science/hal-02383654
        provider: Jens Gustedt
        duration_min: 900
      - kind: doc
        title: "ARM Cortex-M — programming resources"
        url: https://developer.arm.com/documentation
        provider: ARM
        duration_min: 300
      - kind: project
        title: "Blink to UART: a first bare-metal project"
        url: https://docs.rust-embedded.org/discovery/microbit/
        provider: Rust Embedded WG
        duration_min: 300
    quiz:
      - prompt: Why must a variable modified by an interrupt be declared `volatile`?
        explanation: Without it the compiler may cache the value in a register and never re-read memory, so the update is invisible.
        options:
          - text: "Otherwise the compiler may optimise away the re-read and miss the change"
            correct: true
          - text: "It makes access atomic"
          - text: "It places the variable in flash"
          - text: "It disables interrupts during access"
      - prompt: Why is dynamic allocation discouraged in long-running embedded systems?
        explanation: Heap fragmentation accumulates over uptime and eventually fails an allocation in the field, unpredictably.
        options:
          - text: "Fragmentation eventually causes an unpredictable failure in the field"
            correct: true
          - text: "malloc does not exist in C"
          - text: "It is slower than the stack in all cases"
          - text: "It requires an operating system"
      - prompt: How do you configure a hardware peripheral on a microcontroller?
        explanation: By writing bit patterns into memory-mapped control registers.
        options:
          - text: "By setting bits in memory-mapped control registers"
            correct: true
          - text: "Through a system call"
          - text: "By editing the linker script"
          - text: "With an environment variable"
    interview:
      - question: A device works on the bench and resets randomly in the field. How do you investigate?
        difficulty: hard
        answer_md: |
          Determine the reset cause first — most MCUs latch it in a register:
          watchdog, brownout, or hard fault each point somewhere different. A
          watchdog reset means a task overran; a brownout points at power supply
          or a current spike from a peripheral; a hard fault points at a null or
          misaligned pointer or stack overflow. Add a persistent log of the reset
          reason and a crash dump in non-volatile memory. Then check the physical
          layer: temperature, supply decoupling, EMI, and connector integrity —
          field-only failures are frequently environmental rather than logical.

  - slug: peripherals-and-interrupts
    name: Peripherals, Interrupts & RTOS
    domain: embedded
    est_hours: 40
    difficulty: advanced
    prerequisites:
      - c-and-microcontrollers
    summary: >-
      GPIO, timers and serial buses; interrupt handling; and scheduling when
      deadlines are real.
    content_md: |
      Embedded software mostly moves data between the world and a processor, on
      time.

      **Peripherals.** GPIO for digital in and out, ADC for analogue sensors, PWM
      for motors and dimming, timers for anything periodic. Serial buses:
      **UART** point-to-point and asynchronous, **I²C** two wires and addressed
      for many slow devices, **SPI** four wires and fast for one device at a
      time.

      **Interrupts** let the hardware tell you something happened instead of you
      polling. The rules are strict: handlers must be short, must not block, and
      must not call anything non-reentrant. Share data with the main loop through
      a `volatile` flag or a lock-free buffer, and remember that reading a
      multi-byte value the ISR writes needs care or you will get a torn read.

      **Real-time means deadlines.** *Hard* real-time misses are failures — an
      airbag, a motor commutation. *Soft* misses degrade quality. An RTOS such as
      FreeRTOS gives you tasks, priorities and preemption; with them come
      priority inversion, deadlock and the need for careful stack sizing per
      task.

      **Power.** Battery devices spend most of their life asleep, waking on an
      interrupt. Designing for that from the start is far easier than retrofitting
      it.
    resources:
      - kind: doc
        title: "FreeRTOS — developer documentation"
        url: https://www.freertos.org/Documentation/00-Overview
        provider: FreeRTOS
        duration_min: 300
      - kind: doc
        title: "Sparkfun — I2C and SPI tutorials"
        url: https://learn.sparkfun.com/tutorials/i2c
        provider: SparkFun
        duration_min: 90
      - kind: book
        title: "Making Embedded Systems"
        url: https://www.oreilly.com/library/view/making-embedded-systems/9781098151539/
        provider: Elecia White
        is_free: false
        duration_min: 900
    quiz:
      - prompt: Which bus uses only two wires and addresses multiple devices?
        explanation: I²C uses SDA and SCL with addressing; SPI needs four wires plus a chip select per device.
        options:
          - text: "I²C"
            correct: true
          - text: "SPI"
          - text: "UART"
          - text: "CAN"
      - prompt: What is the rule for interrupt service routines?
        explanation: Keep them short and non-blocking — set a flag or push to a buffer and let the main loop do the work.
        options:
          - text: "Keep them short and never block; defer work to the main loop"
            correct: true
          - text: "Do as much work as possible inside them"
          - text: "Always allocate memory inside them"
          - text: "Disable them during normal operation"
      - prompt: What distinguishes a hard real-time requirement?
        explanation: Missing the deadline is a system failure, not merely degraded quality.
        options:
          - text: "Missing the deadline is a failure, not a degradation"
            correct: true
          - text: "It runs faster"
          - text: "It requires an RTOS"
          - text: "It uses interrupts"
    interview:
      - question: Explain priority inversion and how to avoid it.
        difficulty: hard
        answer_md: |
          A low-priority task holds a mutex that a high-priority task needs. A
          medium-priority task then preempts the low one, so the high-priority
          task is indirectly blocked by work that should never outrank it — the
          failure that famously affected Mars Pathfinder. Mitigations: priority
          inheritance (the holder temporarily inherits the waiter's priority),
          priority ceiling protocols, or avoiding shared mutexes entirely by
          passing messages between tasks. Keeping critical sections extremely
          short is the practical baseline.

  - slug: iot-and-connectivity
    name: Connected Devices & IoT
    domain: embedded
    est_hours: 30
    difficulty: advanced
    prerequisites:
      - peripherals-and-interrupts
    summary: >-
      Getting data off the device reliably and securely, and updating firmware
      in the field without bricking it.
    content_md: |
      A connected device is a distributed system whose nodes are in other
      people's homes and cannot be rebooted by hand.

      **Protocols.** MQTT — publish/subscribe over TCP, small headers, designed
      for constrained clients — is the common default. CoAP suits very
      constrained UDP networks. Plain HTTPS is fine when power and bandwidth
      allow. Choose by power budget and message pattern, not familiarity.

      **The radio dominates the power budget.** Batch messages, sleep between
      them, and compress. A device that transmits every second will not last a
      year on a coin cell regardless of how efficient the rest of the firmware is.

      **Security is not optional.** TLS with real certificate validation, unique
      per-device credentials rather than one shared key baked into every unit,
      and secure boot so only signed firmware runs. A shared key extracted from
      one device compromises the entire fleet.

      **Over-the-air updates are the hardest part.** You need an A/B partition
      scheme so a failed update rolls back, signature verification before
      flashing, resumable downloads over unreliable links, and staged rollout.
      An update mechanism that can brick a device is worse than no update
      mechanism — and shipping without one means shipping unpatched forever.
    resources:
      - kind: doc
        title: "MQTT — protocol essentials"
        url: https://mqtt.org/getting-started/
        provider: MQTT.org
        duration_min: 60
      - kind: doc
        title: "ESP-IDF — over-the-air updates"
        url: https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-reference/system/ota.html
        provider: Espressif
        duration_min: 120
      - kind: doc
        title: "OWASP IoT Top 10"
        url: https://owasp.org/www-project-internet-of-things/
        provider: OWASP
        duration_min: 90
    quiz:
      - prompt: Why is a single shared credential across a device fleet dangerous?
        explanation: Extracting it from one physical device compromises every device that was ever shipped.
        options:
          - text: "Extracting it from one unit compromises the whole fleet"
            correct: true
          - text: "It uses more flash"
          - text: "MQTT does not support it"
          - text: "It slows the handshake"
      - prompt: What makes over-the-air firmware update safe against a failed flash?
        explanation: An A/B partition scheme lets the device boot the previous image if the new one fails to validate or start.
        options:
          - text: "A/B partitions with automatic rollback"
            correct: true
          - text: "Compressing the image"
          - text: "Updating only at night"
          - text: "Requiring a user to confirm"
      - prompt: What usually dominates a battery device's power budget?
        explanation: The radio. Transmission is far costlier than computation, so batching and sleeping is where the wins are.
        options:
          - text: "The radio"
            correct: true
          - text: "The main loop"
          - text: "Flash reads"
          - text: "The status LED"
    interview:
      - question: How would you design telemetry for a battery-powered sensor expected to last two years?
        difficulty: hard
        answer_md: |
          Start from the energy budget and work backwards: capacity divided by
          two years gives an average current, which dictates duty cycle. Sleep
          deep by default, wake on a timer or an interrupt, sample, buffer
          locally, and transmit in batches — every radio wake-up costs far more
          than the sampling. Use a compact binary payload rather than JSON.
          Handle failed transmissions with bounded local storage and backoff
          rather than retrying immediately, since a device in poor coverage
          retrying hard is a device that dies early. Instrument battery voltage
          as telemetry so you learn what the real fleet does.
