track:
  slug: cloud-engineer
  title: Become a Cloud Engineer
  domain: cloud
  target_role: Cloud Engineer
  difficulty: intermediate
  description: >-
    Run software on someone else's computers, reliably and affordably: the core
    service model, networking and identity, storage and databases, serverless,
    and keeping the bill under control.

concepts:
  - slug: linux-and-shell
  - slug: containers-docker
  - slug: infrastructure-as-code
  - slug: observability

  - slug: cloud-fundamentals
    name: Cloud Service Models
    domain: cloud
    est_hours: 25
    difficulty: beginner
    prerequisites: []
    summary: >-
      Regions, availability zones, the IaaS/PaaS/SaaS split, and the shared
      responsibility model that decides what is your problem.
    content_md: |
      The cloud is someone else's computers plus an API to rent them by the
      second. Everything else follows from that.

      **Geography.** A **region** is a geographic area; an **availability zone**
      is an isolated datacentre within it. Spreading across zones survives a
      datacentre failure and is usually cheap; spreading across regions survives
      a regional outage and is usually expensive because of data transfer and
      replication lag. Choose the region nearest your users, and check what data
      residency law requires.

      **The service models.** IaaS gives you machines and networks — maximum
      control, maximum operational burden. PaaS gives you a runtime you deploy
      code into. Serverless gives you functions billed per invocation. Managed
      services sit in the middle: you still design the system, but somebody else
      patches the database.

      **Shared responsibility** is the line that causes most cloud security
      incidents. The provider secures *the* cloud — hardware, hypervisor,
      physical access. You secure what you put *in* it — your data,
      configuration, identity, patches on your own images. A public storage
      bucket is never the provider's fault.

      **Elasticity is the point.** Paying for what you use only pays off if you
      actually scale down; a fleet sized for peak and never reduced is a more
      expensive datacentre.
    resources:
      - kind: doc
        title: "AWS Well-Architected Framework"
        url: https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html
        provider: AWS
        duration_min: 300
      - kind: doc
        title: "Google Cloud — Architecture Framework"
        url: https://cloud.google.com/architecture/framework
        provider: Google
        duration_min: 240
      - kind: doc
        title: "Azure — shared responsibility in the cloud"
        url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
        provider: Microsoft
        duration_min: 30
    quiz:
      - prompt: A storage bucket holding customer data is world-readable. Whose responsibility is that?
        explanation: Configuration of your own resources sits on your side of the shared responsibility line.
        options:
          - text: "Yours — configuration of your resources is the customer's responsibility"
            correct: true
          - text: "The cloud provider's"
          - text: "Nobody's; buckets are private by default in every case"
          - text: "The auditor's"
      - prompt: What does spreading across availability zones protect against?
        explanation: AZs are isolated datacentres within a region, so a single-facility failure does not take you down.
        options:
          - text: "The failure of a single datacentre within a region"
            correct: true
          - text: "A global provider outage"
          - text: "A bad deploy"
          - text: "A DDoS attack"
      - prompt: Why might a "serverless" design still cost more than a small VM?
        explanation: Per-invocation pricing is excellent for spiky, low-volume workloads and poor for sustained high throughput.
        options:
          - text: "Per-invocation pricing loses to a always-on instance at sustained high volume"
            correct: true
          - text: "Serverless has no free tier"
          - text: "Functions cannot scale"
          - text: "It requires Kubernetes"
    interview:
      - question: How would you choose a region for a new product?
        difficulty: easy
        answer_md: |
          Start with where the users are, because latency dominates perceived
          speed. Then check legal constraints — data residency rules may force a
          jurisdiction regardless. Then compare service availability, since not
          every service exists in every region, and price, which varies more than
          people expect. Finally consider your disaster-recovery story: which
          second region you would fail over to, and whether replication between
          them is affordable.

  - slug: cloud-networking-and-identity
    name: Cloud Networking & Identity
    domain: cloud
    est_hours: 30
    difficulty: intermediate
    prerequisites:
      - cloud-fundamentals
    summary: >-
      VPCs, subnets, security groups and IAM — the two systems that decide what
      can reach what, and who can do what.
    content_md: |
      Almost every serious cloud incident is a networking or identity
      misconfiguration, not an exploit.

      **The network.** A VPC is your private address space. Public subnets have
      a route to an internet gateway; private ones do not, and reach outbound
      through a NAT. The rule that matters: databases belong in private subnets,
      always, reachable only from your application tier. A managed database with
      a public endpoint and a permissive firewall is a breach waiting for
      someone to run a port scan.

      **Security groups** are stateful allow-lists attached to resources —
      return traffic is automatically permitted. Network ACLs are stateless and
      operate at the subnet level. Open a port to `0.0.0.0/0` only when you
      genuinely mean the entire internet.

      **Identity.** IAM has principals (who), actions (what), resources (on
      what) and conditions (when). **Grant least privilege**: start from nothing
      and add what is needed, rather than starting from admin and trimming — the
      trimming never happens.

      **Roles, not keys.** A workload should assume a role and receive
      short-lived credentials automatically. Long-lived access keys in
      environment variables are the thing that leaks: into git, into logs, into a
      screenshot in a support ticket.
    resources:
      - kind: doc
        title: "AWS — VPC user guide"
        url: https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html
        provider: AWS
        duration_min: 240
      - kind: doc
        title: "AWS — IAM security best practices"
        url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
        provider: AWS
        duration_min: 90
      - kind: doc
        title: "Google Cloud — VPC network overview"
        url: https://cloud.google.com/vpc/docs/vpc
        provider: Google
        duration_min: 120
    quiz:
      - prompt: Where should a production database live?
        explanation: A private subnet with no route from the internet, reachable only from the application tier.
        options:
          - text: "A private subnet, reachable only from the application tier"
            correct: true
          - text: "A public subnet behind a strong password"
          - text: "The same subnet as the load balancer"
          - text: "Anywhere, as long as it is encrypted"
      - prompt: What makes a security group "stateful"?
        explanation: Return traffic for an allowed connection is permitted automatically, so you do not write a matching outbound rule.
        options:
          - text: "Return traffic for an allowed connection is permitted automatically"
            correct: true
          - text: "It remembers previous deployments"
          - text: "It stores logs"
          - text: "It applies to the whole subnet"
      - prompt: Why prefer an assumed role over a long-lived access key?
        explanation: Roles issue short-lived, automatically rotated credentials; static keys persist and leak.
        options:
          - text: "Roles issue short-lived credentials that rotate automatically"
            correct: true
          - text: "Roles are cheaper"
          - text: "Keys do not work with managed services"
          - text: "Roles bypass IAM policies"
    interview:
      - question: How do you give a service access to exactly one storage bucket?
        difficulty: medium
        answer_md: |
          Create a role with a policy scoped to that bucket ARN and only the
          actions needed — often `GetObject` and `PutObject` on a key prefix, not
          `s3:*` on `*`. Attach the role to the workload identity (instance
          profile, service account, or workload identity federation) so no static
          keys exist. Add conditions if useful — source VPC endpoint, or
          encryption required. Then verify with a policy simulator and by
          confirming the service genuinely cannot touch anything else.

  - slug: cloud-cost-management
    name: Cloud Cost & Scaling
    domain: cloud
    est_hours: 20
    difficulty: intermediate
    prerequisites:
      - cloud-fundamentals
    summary: >-
      Autoscaling, right-sizing, storage tiers and the handful of line items
      that produce most surprise bills.
    content_md: |
      Cloud spend is an engineering output, not a finance problem, and the
      biggest wins are almost always structural rather than a discount.

      **Know where the money goes.** Tag everything by team, environment and
      service on day one; retrofitting tags across hundreds of resources is
      miserable. A cost breakdown you cannot attribute is a cost you cannot
      reduce.

      **The usual suspects.** Idle non-production environments running at
      nights and weekends. Over-provisioned instances chosen by guessing.
      Orphaned volumes and snapshots from deleted machines. **Data transfer**,
      especially cross-region and egress to the internet — frequently the line
      item nobody predicted. Logs retained forever at premium tier.

      **Right-size from data.** Look at actual CPU and memory over weeks, not at
      the number someone picked in a hurry. Then commit: reserved capacity or
      savings plans cut 30-60% off predictable baseline load, while spot capacity
      is dramatically cheaper for anything interruptible.

      **Autoscaling must scale down.** Scaling out under load and never
      returning is the most common half-implemented elasticity. Set sensible
      cooldowns so you do not thrash, and scale on the metric that actually
      correlates with load — often queue depth or request latency, not CPU.

      **Storage tiers.** Move data that is rarely read to cheaper classes with a
      lifecycle rule, and be aware of retrieval costs before archiving something
      you will need next week.
    resources:
      - kind: doc
        title: "AWS — Cost Optimization pillar"
        url: https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html
        provider: AWS
        duration_min: 180
      - kind: doc
        title: "FinOps Foundation — framework"
        url: https://www.finops.org/framework/
        provider: FinOps Foundation
        duration_min: 120
      - kind: doc
        title: "Google Cloud — cost optimisation guides"
        url: https://cloud.google.com/architecture/framework/cost-optimization
        provider: Google
        duration_min: 90
    quiz:
      - prompt: Which line item most often surprises teams on a cloud bill?
        explanation: Data transfer — particularly cross-region and internet egress — is easy to generate accidentally and rarely modelled in advance.
        options:
          - text: "Data transfer and egress"
            correct: true
          - text: "The cost of API calls to list resources"
          - text: "IAM roles"
          - text: "VPC creation"
      - prompt: What is the most common autoscaling mistake?
        explanation: Scaling out under load and never scaling back in, which turns elastic infrastructure into an expensive fixed fleet.
        options:
          - text: "Scaling out but never scaling back in"
            correct: true
          - text: "Setting a maximum instance count"
          - text: "Using more than one availability zone"
          - text: "Scaling on request latency"
      - prompt: Why tag resources from day one?
        explanation: Without attribution you cannot tell which team or service is responsible for spend, and retrofitting tags is painful.
        options:
          - text: "Spend cannot be attributed or reduced without it"
            correct: true
          - text: "Untagged resources cost more"
          - text: "Tags are required to create resources"
          - text: "It improves performance"
    interview:
      - question: The cloud bill doubled this month. How do you investigate?
        difficulty: medium
        answer_md: |
          Pull the cost breakdown by service and by tag, and diff against last
          month to find the delta rather than staring at the total. Correlate the
          jump with deploys, traffic and any new region or environment. Common
          causes: a runaway autoscaling group, a log or metric firehose at full
          retention, an accidental cross-region data path, a forgotten load test,
          or a leaked credential mining crypto. Fix the cause, then add a budget
          alert and an anomaly detector so the next one is caught in days, not at
          invoice time.
