track:
  slug: fitness-nutrition
  title: Master Fitness & Nutrition
  domain: fitness
  target_role: Informed Trainee
  difficulty: beginner
  description: >-
    Train and eat on evidence rather than fashion: the principles that drive
    adaptation, how to write and adjust a programme, and nutrition that
    survives contact with real life.

concepts:
  - slug: training-principles
    name: Training Principles
    domain: fitness
    est_hours: 15
    difficulty: beginner
    prerequisites: []
    summary: >-
      Progressive overload, specificity and recovery — the small number of
      principles that explain every effective programme.
    content_md: |
      Almost every disagreement about training dissolves once the principles are
      clear. The details are negotiable; these are not.

      **Progressive overload.** Adaptation requires a stimulus greater than what
      you are accustomed to. Progress by adding load, reps, sets, or improving
      technique and range — not necessarily by adding weight every session.
      Without progression, training maintains rather than builds.

      **Specificity.** You adapt to what you do. Training for strength (heavy,
      low reps, long rests), hypertrophy (moderate loads, more volume) and
      endurance (sustained work) produce different adaptations. A programme
      chasing all three simultaneously delivers less of each.

      **Recovery is when adaptation happens.** Training is the stimulus; growth
      occurs during rest, fed by sleep and food. Sleep is the single most
      underrated variable in the entire field, and chronic under-recovery looks
      exactly like insufficient training — stalled progress.

      **Volume drives hypertrophy**, within tolerance. Roughly ten to twenty hard
      sets per muscle per week is the commonly cited effective range; more is not
      automatically better once recovery is exceeded.

      **Intensity of effort.** Sets taken close to failure — one to three reps in
      reserve — drive most of the adaptation. Sets stopped far short mostly
      accumulate fatigue.

      **Individual variation is real**, but it operates within these principles,
      not instead of them.
    resources:
      - kind: doc
        title: "Stronger by Science — evidence-based training articles"
        url: https://www.strongerbyscience.com/complete-strength-training-guide/
        provider: Stronger by Science
        duration_min: 300
      - kind: doc
        title: "NSCA — position statements and resources"
        url: https://www.nsca.com/education/articles/
        provider: NSCA
        duration_min: 240
      - kind: doc
        title: "Physical activity guidelines"
        url: https://www.who.int/publications/i/item/9789240015128
        provider: WHO
        duration_min: 90
    quiz:
      - prompt: What is progressive overload?
        explanation: Gradually increasing the demand beyond what you are accustomed to, by any variable — load, reps, sets or quality.
        options:
          - text: "Gradually increasing the training demand beyond what you are used to"
            correct: true
          - text: "Adding weight to the bar every single session"
          - text: "Training to failure every set"
          - text: "Increasing training frequency only"
      - prompt: When does adaptation actually occur?
        explanation: During recovery. Training provides the stimulus; sleep and nutrition allow the response.
        options:
          - text: "During recovery, driven by sleep and nutrition"
            correct: true
          - text: "During the workout itself"
          - text: "Only on rest days from all activity"
          - text: "Immediately after the last set"
      - prompt: Progress has stalled and you already train hard six days a week. What should you examine first?
        explanation: Recovery. Under-recovery presents identically to under-training, and adding volume makes it worse.
        options:
          - text: "Sleep, nutrition and total recovery"
            correct: true
          - text: "Adding a seventh training day"
          - text: "Switching every exercise"
          - text: "Increasing every load by 10%"
    interview:
      - question: Someone wants to build muscle and run a marathon in the same six months. What do you say?
        difficulty: medium
        answer_md: |
          Specificity means the two adaptations compete: high-volume endurance
          work interferes with hypertrophy through fatigue and the energy
          deficit it creates. It is not impossible, but progress in each will be
          slower than pursuing one at a time. Ask which matters more and
          sequence them, or accept modest goals in both — maintain strength with
          two short heavy sessions weekly while the running block runs, then
          reverse. Set expectations explicitly at the start, because the usual
          failure is disappointment rather than injury.

  - slug: programme-design
    name: Programme Design & Technique
    domain: fitness
    est_hours: 25
    difficulty: intermediate
    prerequisites:
      - training-principles
    summary: >-
      Turning principles into a weekly plan you will actually follow, and
      lifting safely enough to keep doing it.
    content_md: |
      A programme is a set of decisions about frequency, exercise selection,
      volume, intensity and progression — plus the honest constraint of how much
      time you really have.

      **Structure.** Full-body two or three times weekly works extremely well for
      beginners and time-limited trainees. Upper/lower splits suit four days.
      More elaborate splits are not superior; they are simply a different way of
      distributing the same weekly volume.

      **Exercise selection.** Build around compound movements — squat, hinge,
      push, pull, carry — because they train the most muscle per unit of time,
      then add isolation work for weak points. Choose variations that fit your
      body and equipment rather than the version you were told is correct.

      **Progression model.** Beginners can add load nearly every session.
      Intermediates need a weekly or block structure with planned variation.
      Everyone needs a deload or lighter week when fatigue accumulates.

      **Technique.** Learn the movement pattern before loading it, control the
      eccentric, keep range consistent so progress is comparable, and stop a set
      when form degrades — the last ugly rep contributes little and carries most
      of the risk.

      **Adherence beats optimisation.** A mediocre programme performed for two
      years outperforms an optimal one abandoned in six weeks. Design for the
      schedule and equipment you actually have.

      **Track it.** You cannot progressively overload what you do not record.
    resources:
      - kind: doc
        title: "Stronger by Science — how to build a training programme"
        url: https://www.strongerbyscience.com/how-to-program/
        provider: Stronger by Science
        duration_min: 240
      - kind: doc
        title: "Exercise technique library"
        url: https://exrx.net/Lists/Directory
        provider: ExRx
        duration_min: 180
      - kind: doc
        title: "r/Fitness — the basic beginner routine and wiki"
        url: https://thefitness.wiki/routines/
        provider: The Fitness Wiki
        duration_min: 120
    quiz:
      - prompt: Which programme is best for a beginner with three hours a week?
        explanation: Full-body sessions two or three times weekly cover everything with high frequency per movement and fit the time available.
        options:
          - text: "Full-body training two or three times per week"
            correct: true
          - text: "A six-day body-part split"
          - text: "One long weekly session"
          - text: "Cardio only"
      - prompt: When should a set be stopped?
        explanation: When form degrades — the extra rep adds little stimulus and most of the injury risk.
        options:
          - text: "When technique breaks down"
            correct: true
          - text: "Only at absolute failure, every set"
          - text: "At a fixed number regardless of effort"
          - text: "When the timer ends"
      - prompt: What matters most for long-term results?
        explanation: Adherence. A reasonable plan followed for years beats an optimal one abandoned.
        options:
          - text: "Adherence — a plan you will actually keep doing"
            correct: true
          - text: "Choosing the theoretically optimal split"
          - text: "Training every day"
          - text: "Supplement selection"
    interview:
      - question: How would you design a programme for someone who can train twice a week?
        difficulty: medium
        answer_md: |
          Two full-body sessions, because frequency per movement pattern matters
          more than session count and twice-weekly stimulus per muscle is
          efficient. Build each session around three or four compound movements —
          a squat or hinge, a horizontal and a vertical push and pull — with two
          or three hard sets each, then one or two isolation exercises for
          priorities. Alternate emphasis between the sessions so nothing is
          neglected. Use a simple progression rule (add reps until the top of a
          range, then add load) and track it. Keep the session under an hour so
          it survives a busy week.

  - slug: nutrition-fundamentals
    name: Nutrition Fundamentals
    domain: fitness
    est_hours: 20
    difficulty: beginner
    prerequisites: []
    summary: >-
      Energy balance, protein, and the difference between what matters a lot and
      what the internet argues about.
    content_md: |
      Nutrition advice is noisy because the things that matter are boring and the
      things that are arguable are interesting.

      **Energy balance determines weight.** Consuming more energy than you expend
      adds mass; less removes it. Every diet that works does so by creating a
      deficit, whatever mechanism it advertises. Individual variation exists in
      expenditure and adherence, not in thermodynamics.

      **Protein is the macronutrient that matters most** for body composition:
      roughly 1.6-2.2 g per kg of bodyweight supports muscle retention and
      growth, and it is more satiating than carbohydrate or fat. Beyond that
      range, more adds little.

      **Carbohydrate and fat split is largely preference.** Both are needed; the
      ratio matters far less than total energy, protein and adherence. Pick what
      keeps you full and lets you train.

      **Food quality still counts** for health, satiety and micronutrients even
      when calories match. Fibre, fruit and vegetables, and mostly minimally
      processed food make a deficit far easier to sustain.

      **Rate of change.** Around 0.5-1% of bodyweight per week is a sustainable
      loss rate; faster costs muscle and adherence. Gaining faster than roughly
      0.25-0.5% weekly mostly adds fat.

      **Hydration and sleep** affect performance and appetite more than any
      supplement. Of supplements, only a few — creatine, caffeine, vitamin D if
      deficient, protein powder as convenience — have solid evidence.

      *Educational information, not medical or dietary advice.*
    resources:
      - kind: doc
        title: "Examine.com — independent supplement and nutrition evidence"
        url: https://examine.com/
        provider: Examine
        duration_min: 240
      - kind: doc
        title: "ISSN position stand on protein and exercise"
        url: https://jissn.biomedcentral.com/articles/10.1186/s12970-017-0177-8
        provider: ISSN
        duration_min: 90
      - kind: doc
        title: "Dietary guidelines and nutrition basics"
        url: https://www.nhs.uk/live-well/eat-well/
        provider: NHS
        duration_min: 120
    quiz:
      - prompt: What ultimately determines whether bodyweight rises or falls?
        explanation: Energy balance. Every effective diet creates a deficit, whatever framing it uses.
        options:
          - text: "Energy balance — intake versus expenditure"
            correct: true
          - text: "Meal timing"
          - text: "Avoiding carbohydrates specifically"
          - text: "The number of meals per day"
      - prompt: Which macronutrient target matters most for body composition?
        explanation: Protein, at roughly 1.6-2.2 g/kg, supports muscle retention and satiety.
        options:
          - text: "Protein at roughly 1.6-2.2 g per kg of bodyweight"
            correct: true
          - text: "Fat below 20% of calories"
          - text: "Carbohydrate above 50% of calories"
          - text: "Fibre above 50 g"
      - prompt: Why is very rapid weight loss counterproductive?
        explanation: It costs lean mass and adherence, and the regain rate is high.
        options:
          - text: "It costs muscle and is hard to sustain"
            correct: true
          - text: "It is impossible to achieve"
          - text: "It slows metabolism permanently"
          - text: "It only works with supplements"
    interview:
      - question: A client wants to know which diet is best. How do you answer?
        difficulty: easy
        answer_md: |
          The one they will actually follow. Controlled trials comparing diets at
          matched calories and protein find small differences between them —
          low-carb, low-fat, intermittent fasting and the rest mostly work by
          making a deficit easier for particular people. So the useful questions
          are: what do you enjoy, what fits your schedule and household, what
          have you sustained before, and what did you abandon and why. Then set
          protein, get enough fibre and micronutrients, and choose the structure
          that fits — and make clear that anything medical belongs with a
          registered dietitian or doctor.
