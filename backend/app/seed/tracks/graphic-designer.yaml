track:
  slug: graphic-designer
  title: Learn Graphic Design
  domain: graphic
  target_role: Graphic Designer
  difficulty: beginner
  description: >-
    Typography, layout, colour and brand systems — the craft of making things
    that communicate before they are read, and the production knowledge to get
    them printed or shipped correctly.

concepts:
  - slug: typography
    name: Typography
    domain: graphic
    est_hours: 30
    difficulty: beginner
    prerequisites: []
    summary: >-
      Type anatomy, pairing, hierarchy and spacing — the discipline that carries
      most of the meaning in any design.
    content_md: |
      Typography is most of graphic design. Get it right and mediocre layout
      still reads well; get it wrong and nothing rescues the piece.

      **Anatomy and classification.** x-height, cap height, ascenders,
      counters. Serif, sans-serif, slab, script and monospace — chosen for tone
      as much as legibility. A large x-height reads better at small sizes.

      **Hierarchy** is built with size, weight, case, colour and space. Establish
      three levels and stop; a page where five things compete for attention has
      none.

      **Spacing is where amateurs are caught.** Tracking (uniform letter
      spacing) should loosen for all-caps and small text and tighten for large
      display type. Kerning fixes specific problem pairs. Leading — the space
      between lines — is usually the single largest improvement available:
      roughly 1.4-1.6× the size for body text.

      **Measure.** 45-75 characters per line. Longer and the eye loses its place
      returning to the next line.

      **Pairing.** Two typefaces is plenty: one with personality for display, one
      neutral and highly legible for text. Contrast them clearly — two similar
      sans-serifs look like a mistake rather than a decision.
    resources:
      - kind: doc
        title: "Butterick's Practical Typography (free online)"
        url: https://practicaltypography.com/
        provider: Matthew Butterick
        duration_min: 480
      - kind: course
        title: "Type Classification and anatomy (Fonts.com learning)"
        url: https://www.fonts.com/content/learning/fontology
        provider: Monotype
        duration_min: 240
      - kind: project
        title: "Kern Type — a kerning game"
        url: https://type.method.ac/
        provider: Method of Action
        duration_min: 60
    quiz:
      - prompt: Which adjustment most reliably improves a wall of body text?
        explanation: Leading. Tight line spacing is the most common and most damaging default.
        options:
          - text: "Increasing the leading to about 1.4-1.6× the font size"
            correct: true
          - text: "Bolding the first line"
          - text: "Justifying the text"
          - text: "Switching to a serif"
      - prompt: When should you increase tracking?
        explanation: All-caps and small text benefit from looser letter spacing; large display type usually wants it tightened.
        options:
          - text: "For all-caps settings and very small text"
            correct: true
          - text: "For large display headlines"
          - text: "Never — tracking should stay at zero"
          - text: "Only for serif faces"
      - prompt: How many typefaces does a typical project need?
        explanation: Two — one for display, one for text — with clear contrast between them.
        options:
          - text: "Two, with clear contrast between them"
            correct: true
          - text: "One, always"
          - text: "At least five for variety"
          - text: "One per section"
    interview:
      - question: A client says the design "feels cheap". What do you look at first?
        difficulty: medium
        answer_md: |
          Usually typography and spacing rather than colour. Check for: default
          system faces used without intent, too many type sizes, tight leading,
          inconsistent margins, centred body text, stretched or artificially
          bolded type, and low-quality raster images. Then check alignment — most
          "cheap" layouts have no consistent grid, so nothing lines up. Fixing
          the type scale, the spacing system and the alignment usually resolves
          the feeling without changing a single colour.

  - slug: layout-and-composition
    name: Layout, Grids & Colour
    domain: graphic
    est_hours: 30
    difficulty: beginner
    prerequisites:
      - typography
    summary: >-
      Grids, alignment, visual weight and colour systems — how to arrange
      elements so the eye moves where you intend.
    content_md: |
      Layout is the management of attention. Every decision either directs the
      eye or competes for it.

      **Grids** give structure and, more importantly, permission to break them
      deliberately. A column grid with consistent gutters makes a multi-page
      document feel like one piece. Margins are not wasted space; generous
      whitespace is the clearest signal of confidence in a design.

      **Alignment and proximity.** Every element should align with something
      else. Related items sit close together and unrelated items do not — the
      single most effective way to make a dense page comprehensible without
      adding a line or a box.

      **Visual hierarchy** is created by size, contrast, colour, position and
      isolation. Scan the design with your eyes half closed: whatever survives is
      the hierarchy you actually built.

      **Colour.** Work in HSB rather than RGB values — it maps to how people
      perceive colour. Build a system: one dominant, one accent, a neutral range.
      The 60-30-10 split is a reliable starting proportion. Check contrast for
      legibility, and remember colour carries cultural meaning that varies by
      audience.

      **Print versus screen.** CMYK and RGB are different gamuts; a vivid screen
      colour may be unprintable. Proof before committing to a print run.
    resources:
      - kind: book
        title: "Grid Systems in Graphic Design"
        url: https://www.niggli.ch/en/products/grid-systems-in-graphic-design
        provider: Josef Müller-Brockmann
        is_free: false
        duration_min: 600
      - kind: doc
        title: "Interaction Design Foundation — gestalt principles"
        url: https://www.interaction-design.org/literature/topics/gestalt-principles
        provider: IxDF
        duration_min: 90
      - kind: doc
        title: "Adobe Color — build and test palettes"
        url: https://color.adobe.com/
        provider: Adobe
        duration_min: 60
    quiz:
      - prompt: What does the proximity principle say?
        explanation: Elements placed close together are perceived as related, so spacing alone can group content without borders.
        options:
          - text: "Elements placed near each other are perceived as belonging together"
            correct: true
          - text: "Larger elements are more important"
          - text: "Warm colours advance and cool colours recede"
          - text: "Aligned elements look more professional"
      - prompt: Why might a colour that looks vivid on screen disappoint in print?
        explanation: RGB has a wider gamut than CMYK; some screen colours simply cannot be reproduced with ink.
        options:
          - text: "The CMYK printing gamut is narrower than RGB"
            correct: true
          - text: "Printers use fewer dots per inch"
          - text: "Paper absorbs blue light"
          - text: "Print files must be greyscale"
      - prompt: What is the fastest way to check whether your hierarchy works?
        explanation: Squint at it. Only the genuinely dominant elements survive the blur.
        options:
          - text: "Squint at the design and see what still stands out"
            correct: true
          - text: "Count the number of fonts"
          - text: "Measure the margins"
          - text: "Convert it to CMYK"
    interview:
      - question: How do you approach a layout with far too much content and no room to cut?
        difficulty: medium
        answer_md: |
          First push back once, with evidence — content nobody reads is not
          served by being included. If it truly cannot be cut, impose structure:
          a strict grid, a tight type scale, and clear grouping so the page can
          be scanned rather than read. Introduce progressive disclosure where the
          medium allows (sections, tabs, a second page). Increase the density
          honestly rather than shrinking type below legibility, and buy back
          whitespace by removing decorative elements, rules and boxes that are
          doing work that proximity and alignment could do instead.

  - slug: brand-and-production
    name: Brand Systems & Production
    domain: graphic
    est_hours: 25
    difficulty: intermediate
    prerequisites:
      - layout-and-composition
    summary: >-
      Identity beyond a logo, asset formats and file preparation that survives
      contact with printers and developers.
    content_md: |
      A brand is a system, not a logo. The logo is the smallest part of it.

      **What an identity actually contains:** the mark and its safe area and
      minimum size, a type system, a colour palette with values for screen and
      print, photography and illustration direction, tone of voice, and examples
      of correct and incorrect use. Guidelines exist so that people who are not
      you can apply it consistently.

      **Vector versus raster.** Vector (SVG, PDF, AI) scales infinitely and is
      correct for logos and icons. Raster (PNG, JPEG, WebP) is correct for
      photographs. A logo delivered only as a 500px PNG is a logo that cannot be
      put on a billboard, or a favicon.

      **Preparing for print.** CMYK, 300dpi at final size, bleed of about 3mm,
      crop marks, fonts outlined or embedded, and overprint checked. Ask the
      printer for their spec sheet before designing rather than after.

      **Preparing for screen.** Export at multiple densities, optimise file size,
      supply SVG where possible, and supply the developer with tokens — hex
      values, spacing scale, type sizes — rather than a flattened image they have
      to measure.
    resources:
      - kind: doc
        title: "Figma — exporting and asset preparation"
        url: https://help.figma.com/hc/en-us/articles/360040028114-Export-from-Figma
        provider: Figma
        duration_min: 60
      - kind: article
        title: "Brand guideline examples and what they contain"
        url: https://www.designsystems.com/
        provider: Figma
        duration_min: 120
      - kind: doc
        title: "Adobe — prepare files for print (bleed, marks, colour)"
        url: https://helpx.adobe.com/indesign/using/printing-documents.html
        provider: Adobe
        duration_min: 90
    quiz:
      - prompt: Which format should a logo be delivered in?
        explanation: Vector, so it scales from favicon to billboard without degradation.
        options:
          - text: "A vector format such as SVG, EPS or PDF"
            correct: true
          - text: "A 500px PNG"
          - text: "A JPEG at maximum quality"
          - text: "A GIF"
      - prompt: What is bleed for in print preparation?
        explanation: Artwork extends past the trim line so a slight cutting inaccuracy does not leave a white edge.
        options:
          - text: "Artwork extending past the trim so cutting variance leaves no white edge"
            correct: true
          - text: "Extra margin for the text"
          - text: "The colour profile"
          - text: "A registration mark"
      - prompt: What should you give a developer alongside the design?
        explanation: Tokens — colour values, spacing scale, type sizes — plus exported assets, rather than an image they must measure.
        options:
          - text: "Design tokens and exported assets"
            correct: true
          - text: "A flattened JPEG of each screen"
          - text: "The source file only"
          - text: "A printed proof"
    interview:
      - question: A client wants "a logo" for a new business. What do you actually deliver?
        difficulty: easy
        answer_md: |
          A usable identity system, because a mark alone will not survive first
          contact with a website, an invoice and a sign. That means: primary,
          secondary and monochrome versions of the mark; clear space and minimum
          size rules; a type system with fallbacks; a colour palette with hex,
          CMYK and Pantone values; asset files in vector and raster at the
          densities they will need; and a short guideline document with correct
          and incorrect usage. Scope and price it that way from the start, or the
          "logo" becomes an unpaid identity project.
