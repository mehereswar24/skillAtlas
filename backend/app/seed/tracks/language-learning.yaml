track:
  slug: language-learning
  title: Learn a New Language
  domain: languages
  target_role: Confident Speaker
  difficulty: beginner
  description: >-
    Reach conversational fluency deliberately: how acquisition actually works,
    building vocabulary and listening through comprehensible input, and the
    speaking practice that most learners avoid for years.

concepts:
  - slug: language-foundations
    name: How Language Acquisition Works
    domain: languages
    est_hours: 15
    difficulty: beginner
    prerequisites: []
    summary: >-
      What the evidence says about learning a language — input, output, and why
      grammar drills alone never produce a speaker.
    content_md: |
      Adults can learn languages well. Most fail because of method and
      consistency, not aptitude.

      **Comprehensible input is the engine.** You acquire language by
      understanding messages slightly above your current level. Reading and
      listening to material you mostly understand does more than any amount of
      conjugation tables, because acquisition is largely implicit — you build
      intuition for what sounds right rather than a rulebook you consult.

      **Grammar has a role, but a supporting one.** A quick explanation of a
      pattern lets you notice it in input afterwards, which speeds acquisition.
      Studying grammar as the main activity produces people who can analyse
      sentences and cannot order coffee.

      **Output matters too.** Producing language forces you to notice what you
      cannot yet say, which directs attention on your next encounter with input.
      That gap-noticing is why speaking early accelerates everything.

      **Frequency is enormously unequal.** The most common 1,000 words cover the
      large majority of everyday speech; the next 1,000 add much less. Learn in
      frequency order and you reach usefulness far sooner.

      **Consistency beats intensity.** Thirty minutes daily beats a four-hour
      session once a week, because forgetting is continuous and review has to be
      too.
    resources:
      - kind: doc
        title: "CEFR levels — what each stage actually means"
        url: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions
        provider: Council of Europe
        duration_min: 45
      - kind: doc
        title: "Refold — a structured input-based method"
        url: https://refold.la/roadmap/
        provider: Refold
        duration_min: 120
      - kind: video
        title: "Stephen Krashen on comprehensible input"
        url: https://www.youtube.com/watch?v=NiTsduRreug
        provider: YouTube
        duration_min: 60
    quiz:
      - prompt: What does "comprehensible input" mean?
        explanation: Material you can mostly understand, slightly above your current level — that is where acquisition happens.
        options:
          - text: "Material slightly above your level that you can mostly understand"
            correct: true
          - text: "Material simple enough to understand completely"
          - text: "Grammar exercises with answer keys"
          - text: "Any content in the target language"
      - prompt: Why learn vocabulary in frequency order?
        explanation: The most common 1,000 words cover most everyday speech, so they deliver far more usable comprehension per word learned.
        options:
          - text: "The most frequent words deliver disproportionate comprehension"
            correct: true
          - text: "They are easier to pronounce"
          - text: "They are always shorter"
          - text: "Textbooks are organised that way"
      - prompt: 30 minutes daily or one 3.5-hour session weekly — which is better?
        explanation: Daily practice matches the forgetting curve; a weekly block loses most of its gains between sessions.
        options:
          - text: "30 minutes daily"
            correct: true
          - text: "The weekly session"
          - text: "They are equivalent"
          - text: "Depends only on the language"
    interview:
      - question: Someone has studied grammar for two years and cannot hold a conversation. What is missing?
        difficulty: easy
        answer_md: |
          Input and output. Explicit grammar knowledge is a different system from
          the automatic processing that conversation requires — you cannot
          consult a rule at speaking speed. They need large amounts of
          comprehensible listening and reading to build intuition, and regular
          speaking practice to make retrieval automatic and to reveal the gaps.
          The grammar study is not wasted; it just cannot be the whole programme.

  - slug: vocabulary-and-listening
    name: Vocabulary & Listening
    domain: languages
    est_hours: 40
    difficulty: beginner
    prerequisites:
      - language-foundations
    summary: >-
      Building a working vocabulary with spaced repetition, and training your
      ear on real speech rather than textbook audio.
    content_md: |
      Vocabulary and listening are where the hours go, and both respond well to
      method.

      **Spaced repetition, used properly.** Cards should be short, contain one
      item, and ideally come from something you actually encountered — sentence
      cards with a word in context beat isolated translations, because they
      carry usage and collocation. Twenty new cards a day is sustainable;
      hundreds is a deck you will abandon within a fortnight.

      **Learn words in context.** A word list gives you recognition; a sentence
      gives you the grammar, the register and the words it usually appears with.

      **Listening is a separate skill from reading** and is usually the weakest.
      Native speech is fast, elided and full of reductions that textbook audio
      removes. The path: start with slowed or graded audio, use transcripts and
      subtitles in the target language rather than your own, and gradually drop
      the support.

      **Passive listening has limited value** unless you are already
      understanding much of it. Active listening — following closely, replaying
      difficult passages, checking the transcript — is what moves the needle.

      **Tolerate ambiguity.** Stopping to look up every unknown word destroys
      the flow that makes input work. Guess from context, keep going, and mine a
      few of the most useful items afterwards.
    resources:
      - kind: doc
        title: "Anki — spaced repetition manual"
        url: https://docs.ankiweb.net/
        provider: Anki
        duration_min: 120
      - kind: doc
        title: "Language Reactor — subtitles and mining tools"
        url: https://www.languagereactor.com/
        provider: Language Reactor
        duration_min: 60
      - kind: doc
        title: "Tatoeba — example sentences by word"
        url: https://tatoeba.org/
        provider: Tatoeba
        duration_min: 60
    quiz:
      - prompt: Why are sentence cards usually better than isolated word cards?
        explanation: They teach usage, grammar and collocation alongside meaning, which is what you need to produce the word correctly.
        options:
          - text: "They carry grammar, register and collocation, not just meaning"
            correct: true
          - text: "They are quicker to review"
          - text: "They contain fewer words"
          - text: "They avoid the need for audio"
      - prompt: Which subtitles help most when training listening?
        explanation: Target-language subtitles link sound to written form; native-language subtitles let you ignore the audio entirely.
        options:
          - text: "Subtitles in the target language"
            correct: true
          - text: "Subtitles in your native language"
          - text: "No subtitles at any stage"
          - text: "Dual subtitles always"
      - prompt: What is the problem with looking up every unknown word?
        explanation: It breaks the flow of comprehension that makes input effective, and slows you to a fraction of useful volume.
        options:
          - text: "It destroys the flow that makes input work"
            correct: true
          - text: "Dictionaries are unreliable"
          - text: "It teaches the wrong pronunciation"
          - text: "It is fine and should be done always"
    interview:
      - question: How would you structure an hour of daily study?
        difficulty: medium
        answer_md: |
          Roughly: fifteen minutes of spaced-repetition review first, while
          attention is fresh and because skipping it compounds. Thirty minutes of
          comprehensible input — listening or reading something you mostly
          understand and enjoy, since enjoyment is what makes it survive month
          three. Ten minutes mining a handful of useful items from that input
          into new cards. Five minutes of output: speaking aloud, shadowing, or
          writing a few sentences. Adjust the balance towards speaking as you
          progress, and protect the review block above everything else.

  - slug: speaking-and-fluency
    name: Speaking & Fluency
    domain: languages
    est_hours: 40
    difficulty: intermediate
    prerequisites:
      - vocabulary-and-listening
    summary: >-
      Getting from understanding to speaking — pronunciation, practice partners
      and the anxiety that keeps most learners silent.
    content_md: |
      Most learners understand far more than they can say, because production
      is the part they avoid. It is uncomfortable, and it is the only route to
      fluency.

      **Fluency is retrieval speed, not vocabulary size.** You become fluent in
      what you practise saying. Someone who has spoken a hundred hours with a
      small vocabulary will out-communicate someone who has studied a thousand
      words and never opened their mouth.

      **Pronunciation early.** Habits set fast and are hard to undo. Learn the
      sounds that do not exist in your first language explicitly, and use
      shadowing — listening and speaking along simultaneously — to train rhythm
      and intonation, which matter more for being understood than individual
      phonemes.

      **Find real practice.** A tutor or exchange partner for an hour a week
      changes everything; language exchange apps are free. If you genuinely
      cannot, self-talk works better than nothing: narrate what you are doing,
      out loud.

      **Errors are the mechanism, not the failure.** Waiting until you are
      "ready" means waiting forever. Ask your partner to correct only the errors
      that impede understanding, so conversation does not become a lesson.

      **Circumlocution is a skill.** When you do not know a word, describe it.
      Native speakers do this constantly, and practising it removes most of the
      fear of getting stuck.
    resources:
      - kind: doc
        title: "italki — find a tutor or exchange partner"
        url: https://www.italki.com/
        provider: italki
        is_free: false
        duration_min: 60
      - kind: doc
        title: "IPA and pronunciation training resources"
        url: https://www.ipachart.com/
        provider: IPA Chart
        duration_min: 90
      - kind: video
        title: "Shadowing technique explained"
        url: https://www.youtube.com/watch?v=fUt3-2Y0RiA
        provider: YouTube
        duration_min: 30
    quiz:
      - prompt: What most directly determines conversational fluency?
        explanation: Retrieval speed built through practice speaking — not the size of your passive vocabulary.
        options:
          - text: "How much you have practised producing the language"
            correct: true
          - text: "Total vocabulary size"
          - text: "Grammar knowledge"
          - text: "Reading speed"
      - prompt: Which matters more for being understood?
        explanation: Rhythm and intonation carry more intelligibility than perfect individual sounds.
        options:
          - text: "Rhythm and intonation"
            correct: true
          - text: "Perfect individual phonemes"
          - text: "Speaking quickly"
          - text: "Using advanced vocabulary"
      - prompt: What is circumlocution and why practise it?
        explanation: Describing a word you do not know keeps the conversation moving and removes the fear of getting stuck.
        options:
          - text: "Describing a word you lack, so conversation continues"
            correct: true
          - text: "Speaking in circles to avoid grammar"
          - text: "Repeating what your partner said"
          - text: "Translating in your head first"
    interview:
      - question: Someone freezes whenever they try to speak. How would you help?
        difficulty: medium
        answer_md: |
          Lower the stakes and raise the frequency. Start with scripted or
          semi-scripted exchanges where the content is predictable, so the only
          new thing is speaking itself. Use self-talk and recorded monologues
          where there is no listener to judge. Move to a paid tutor rather than
          an exchange partner initially — a professional is patient and it
          removes the social debt. Agree that only comprehension-blocking errors
          get corrected. Then build volume: frequent short conversations beat
          rare long ones, and confidence follows evidence of being understood.
