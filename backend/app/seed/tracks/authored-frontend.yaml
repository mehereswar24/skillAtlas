        title: 'web.dev: Declarative Shadow DOM'
        url: https://web.dev/articles/declarative-shadow-dom
  - slug: frontend-pwas
    name: Progressive Web Apps, Service Workers and Offline
    domain: frontend
    est_hours: 12
    difficulty: advanced
    prerequisites:
      - frontend-web-apis
      - frontend-deployment
      - frontend-performance
    summary: |-
      Register a service worker, choose a caching strategy per resource type, ship an update flow
      users cannot get stuck behind, and build an installable app that keeps working offline
      without stranding anyone on last week's build.
    content_md: |-
      A service worker is a programmable proxy for your own origin. Once one is installed, the
      browser routes your page's network requests through a background script you wrote, and that
      script decides whether each request is answered from a cache, from the network, or from
      something you synthesised. Every capability of a progressive web app — offline pages,
      instant repeat loads, background sync, push — and every failure mode follows from that one
      fact.

      It also means the usual safety net is gone. A bad deploy normally lasts until the CDN cache
      expires. A bad service worker lives on the user's device and can keep serving a broken app
      long after you fixed the server.

      ### The lifecycle and the update trap

      You register the worker from the page, and the browser installs it: `install` fires (this is
      where you precache the app shell), then it enters a *waiting* state. A new worker does not
      take over while any tab controlled by the old one is open, because two versions of your code
      must not run against one cache. It activates only when every controlled tab closes — and
      refreshing a tab does not close it.

      That is the update trap: users can run last week's build for weeks. The fix is deliberate.
      Detect the waiting worker, show an "Update available" prompt, and only on the user's click
      post a message that calls `skipWaiting()`, then reload when `controllerchange` fires.
      `clients.claim()` in `activate` makes a first-ever worker control already-open pages.
      Scope matters too: a worker at `/app/sw.js` can only control URLs under `/app/`.

      ### Intercepting fetch: a strategy per resource type

      In the `fetch` event you call `event.respondWith()` with a `Response`. Three strategies
      cover almost everything, and the skill is matching them to resource types:

      - Cache-first for content-hashed static assets. The filename changes when the content
        changes, so a cached copy can never be stale.
      - Network-first, with a cached fallback, for API responses and anything users expect to be
        current.
      - Stale-while-revalidate for the middle ground — avatars, non-critical JSON — where instant
        is worth more than perfectly fresh.

      Cache Storage holds `Request`/`Response` pairs and is the right home for assets. Structured
      data that you query, sort or mutate offline belongs in IndexedDB. Neither is unlimited:
      version your caches, delete old ones in `activate`, and cap opaque or user-generated entries
      yourself, because nothing prunes them for you.

      Around that sit the app shell pattern (cache the UI skeleton, fetch content into it) and
      offline fallbacks: a cached page for navigations that fail, a placeholder for images.

      ### Background work, install and notifications

      Background Sync retries a failed write once connectivity returns, so a form submitted in a
      tunnel still lands. Periodic Sync refreshes content on a browser-chosen schedule; treat both
      as best-effort and not available everywhere. Push uses VAPID keys to authenticate your
      server to the push service, and needs notification permission — which you should request
      only after a user action that explains why, because prompting on first load is the single
      fastest way to have your site permanently blocked.

      Installability comes from the web app manifest: name, icons at the required sizes, a
      `display` mode, `start_url`, plus a service worker over HTTPS. Chromium fires
      `beforeinstallprompt`, which you can capture and re-trigger from your own button. iOS
      supports manifests and service workers but not that event, and Safari has its own install
      flow and stricter storage eviction, so test there separately.

      ### Mistakes people actually make

      - Caching `index.html` cache-first. Users are stranded on an old shell that references
        deleted asset URLs, and the app breaks with no way to recover from the page.
      - No update prompt, so a new deploy never activates for anyone who keeps a tab open.
      - Unbounded caches: every API response written to Cache Storage forever, until eviction
        removes something you needed.
      - Asking for notification permission on first load, and being blocked at the browser level.
      - Testing only in a normal tab. Use DevTools "Offline", "Update on reload" and "Bypass for
        network", and always test a second deploy, not just the first install.

      **What you can do after this:** ship a service worker with per-route strategies, a versioned
      cache cleanup and a user-triggered update prompt, and prove it by deploying twice and
      updating without a hard refresh.
