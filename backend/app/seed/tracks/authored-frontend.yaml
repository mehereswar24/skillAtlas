  - slug: frontend-desktop-apps
    name: Desktop Apps with Electron and Tauri
    domain: frontend
    est_hours: 10
    difficulty: advanced
    prerequisites:
      - frontend-learn-a-framework
      - frontend-web-security
    summary: |-
      Ship a desktop application built from web technology without turning it into a
      remote-code-execution vector: reason about Electron's process boundary, judge
      when Tauri's system-webview approach fits better, and sign, package and
      auto-update the result.
    content_md: |-
      A desktop build of a web app is not a browser with the chrome removed. Shipping one hands your rendering engine privileges the web sandbox exists to deny: the filesystem, child processes, the registry, the user's keychain. Every architectural decision in Electron and Tauri is about where you place the boundary between the untrusted document and those privileges.

      Get that boundary wrong and a cross-site scripting bug — the kind that would merely have stolen a cookie on the web — becomes arbitrary code execution on the user's machine. That is why this concept sits after web security rather than before it.

      ### Electron's three processes

      An Electron app runs one **main** process — a full Node.js runtime owning application lifecycle, windows, menus and all OS access — and one **renderer** process per `BrowserWindow`, a Chromium renderer running your HTML, CSS and JavaScript. Between them sits the **preload** script: it executes in the renderer's process but in a separate JavaScript world, with access to a subset of Node.

      The security posture is three `webPreferences` settings, which modern Electron defaults correctly:

      ```js
      new BrowserWindow({
        webPreferences: {
          contextIsolation: true,  // preload and page get separate JS worlds
          nodeIntegration: false,  // no require() inside the page
          sandbox: true,           // renderer runs in Chromium's OS sandbox
        },
      });
      ```

      `contextIsolation` stops the page reaching preload objects by walking prototypes. `contextBridge` is then the only sanctioned door, and it clones values across the boundary rather than passing live references:

      ```js
      // preload.js
      const { contextBridge, ipcRenderer } = require("electron");
      contextBridge.exposeInMainWorld("api", {
        readConfig: () => ipcRenderer.invoke("config:read"),
      });
      ```

      Notice what is *not* exposed: not `ipcRenderer` itself, and not a generic `invoke(channel, ...args)`. Expose intent-shaped functions; a generic bridge is `nodeIntegration: true` with extra steps, because any injected script can then call any channel.

      For IPC, use `ipcRenderer.invoke` with `ipcMain.handle` for request/response, `send`/`on` for fire-and-forget, and `webContents.send` for main-to-renderer push. Validate every argument in the main-process handler: after an XSS, the renderer is hostile input.

      ### Tauri: a different bet

      Tauri ships no browser. It drives the system webview — WebKitGTK on Linux, WebView2 on Windows, WKWebView on macOS — behind a Rust binary. Installers shrink dramatically and baseline memory follows, because the engine is already on the machine.

      Its privilege model is explicit: Tauri v2 defines *permissions* grouped into *capabilities*, declared in JSON and compiled into the app, so a window can be granted scoped filesystem read and nothing else. Your frontend reaches Rust `#[tauri::command]` functions through `invoke`.

      The cost is the one Electron spends money to avoid: you now test against three engines with different CSS support timelines, media handling and quirks — WebKitGTK on an older distribution usually hurts most. Choose Tauri when binary size, memory and a Rust backend matter; Electron when you need one guaranteed Chromium everywhere.

      ### Native integration, packaging and updates

      Menus, tray icons, native notifications, file dialogs, custom-protocol deep links and single-instance locking all live in the privileged process; the renderer requests them over IPC, and that IPC surface is your entire attack surface.

      macOS needs a Developer ID signature plus *notarisation*: you upload the build, Apple returns a ticket you staple to the app, and only then does Gatekeeper open it quietly. Windows wants an Authenticode signature; unsigned installers earn a SmartScreen warning that measurably kills installs. Auto-update needs signed release artefacts and a channel strategy: keep a beta channel and the ability to roll back.

      Budget resources honestly: each Electron window costs a Chromium renderer's memory, and cold start includes booting Node and Chromium.

      ### The mistakes people actually make

      - Setting `nodeIntegration: true` because a dependency "needs" `require` in the page. You have now made every third-party script and every stray `innerHTML` a path to `child_process`.
      - Loading remote content — a docs page, an OAuth flow, a third-party widget — in a window that carries your preload bridge. Give remote content its own window with no bridge.
      - Exposing `invoke(channel, payload)` through `contextBridge` and calling it a narrow API. It is the whole IPC surface.
      - Shipping unsigned builds, then blaming the install funnel.
      - Assuming Tauri renders identically everywhere. It renders like three different browsers, because it is three different browsers.

      **What you can do after this:** take an existing web app, ship it as a signed, auto-updating desktop build, and state for every privileged operation which process performs it and why an XSS in the renderer cannot reach it.
