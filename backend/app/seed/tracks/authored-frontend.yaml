  - slug: frontend-skills
    name: Reusable Instructions and Skills for Assistants
    domain: frontend
    est_hours: 3
    difficulty: advanced
    prerequisites:
      - frontend-agents
    summary: |-
      Move your team's conventions out of individual heads and repeated explanations
      into versioned instruction files and skills that an assistant loads when
      relevant, and judge what belongs in one versus what a lint rule should enforce
      instead.
    content_md: |-
      A model arrives knowing React and knowing nothing about your team: not that components live in `features/<domain>/ui`, not that every interactive element goes through your `Button` primitive, not that nobody imports from `lib/legacy`. So every session begins with the same explanation, typed differently by whoever is at the keyboard, and forgotten when the window closes.

      Skills, project instruction files and rule files exist to fix exactly that. They are packaged, versioned instructions — sometimes with reference documents or scripts attached — that live in the repository and get loaded when they are relevant. The important shift is where the knowledge lives: in the repo, reviewed and updated like code, rather than in one senior engineer's fingers.

      ### The mechanism: progressive disclosure

      Context is finite, so instructions cannot all be resident all the time. The pattern that works is two-stage. A short piece of metadata — a name and a one-line description of *when* this applies — stays cheap enough to keep available. Only when the current task matches does the body get loaded, and only then do any bundled reference files or scripts come into play.

      This is why the description matters more than people expect. It is a routing decision: it determines whether the assistant realises the skill exists at the moment it is needed. "Component conventions" is a poor description. "Use when creating or modifying a React component in this repo — covers file layout, naming, prop types and the accessibility checklist" is a routing instruction.

      The same principle explains why a monolithic 5,000-word instruction file underperforms several focused ones. Everything in the always-loaded file competes for attention with the actual task.

      ### What belongs in one, and what does not

      Good content is durable, team-specific, and not derivable from the code:

      - Naming and file-layout conventions, with one real example.
      - The component template: which primitives to compose, how props are typed, where styles go.
      - The accessibility checklist you apply before opening a pull request.
      - The review checklist and the definition of done.
      - The exact commands: how to run one test file, the linter, the type-check, a local build.
      - The release or deployment procedure, including rollback.

      Bad content is anything that duplicates the code and will therefore drift. Do not paste your component's prop list into an instruction file; point at the file. Do not restate a rule your linter already enforces. Do not write general React advice — the model has that, and yours will be worse.

      One test before writing anything: if this went stale, would anyone notice? If not, it will go stale silently and start producing confidently wrong output.

      ### Treat them as code

      Keep them in version control, in the repository they describe, so they are reviewed in pull requests and updated in the same commit as the refactor that invalidates them.

      And verify they work. Run the same task with the instruction file present and absent and compare output. A surprising number of instruction files change nothing measurable, either because the model already behaved that way or because the wording is too abstract to act on. Prefer concrete, checkable statements — "always import icons from `@ui/icons`, never from `lucide-react` directly" — over aspirations like "write clean, maintainable code".

      They compose with MCP rather than competing: **skills are instructions, MCP servers are capabilities.** A skill can tell the assistant *when and how* to use a tool a server provides.

      ### The mistakes people actually make

      - A 5,000-word instruction file that reads as a style manifesto, is mostly ignored, and quietly consumes context on every request.
      - Instructions that contradict the code after a refactor, which is worse than none, because the assistant follows them confidently.
      - Encoding one person's preference as a team rule without agreement, then discovering the whole codebase drifted towards it.
      - Writing a skill for something a lint rule enforces deterministically. If it is mechanically checkable, check it mechanically — an instruction is a suggestion, a lint rule is a gate.
      - A description so vague the assistant never loads the skill, so the team concludes skills do not work.

      **What you can do after this:** write a component-conventions skill for your repository, with a description precise enough that the assistant loads it at the right moment, and demonstrate with a before-and-after run that it actually changed the output.
