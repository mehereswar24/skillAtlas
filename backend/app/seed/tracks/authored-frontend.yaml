  - slug: frontend-advanced-frontend
    name: Frontend Architecture at Scale
    domain: frontend
    est_hours: 14
    difficulty: advanced
    prerequisites:
      - frontend-testing
      - frontend-performance
      - frontend-design-systems
      - frontend-state-management
    summary: |-
      Reason about a frontend codebase with dozens of contributors and years of
      history: enforced module boundaries, monorepo tooling, when micro-frontends are
      and are not justified, incremental migration, release decoupling, and
      observability that measures users.
    content_md: |-
      Everything earlier in this track scales to a codebase one person can hold in their head. This concept is about what changes with forty contributors, five years of history, and nobody who has read all of it. Techniques that fail at that size fail for one reason: they relied on everyone knowing something no longer knowable.

      The through-line: make the right thing structurally easy and the wrong thing mechanically impossible. Conventions decay under headcount; constraints CI enforces do not.

      ### Module boundaries and dependency direction

      Type-based folders (`components/`, `hooks/`, `utils/`) stop scaling almost immediately: one feature is smeared across five directories, and no directory tells you what the application does. Domain-based structure — everything for `checkout` under `features/checkout`, behind a deliberate public entry point — keeps related change local.

      Declaring boundaries is not enforcing them. Enforce with tooling: ESLint import restrictions by path, TypeScript project references, or an Nx-style tag and constraint system. State the *direction* too: features may depend on shared primitives, never the reverse, and two features talk through an explicit interface.

      Watch shared `utils`: it becomes where anything uncategorisable lands, and ends as a module every feature depends on and nobody may safely change. Split it by domain — a repeated helper is cheaper than a universal dependency.

      ### Monorepos and their real cost

      Workspaces (npm, pnpm, Yarn) put multiple packages in one repository with one install and cross-links, buying atomic cross-package changes. What they do not buy, as teams discover by month three, is CI time: naively, every change rebuilds and retests everything.

      The fix is a task graph with caching. Turborepo and Nx model tasks and their dependencies, hash inputs and reuse outputs, locally and shared across the team and CI, so a build someone else already ran becomes a download. With affected-project detection, a small change tests a small slice. Decide too whether internal packages are always-latest from source (everything in step, every consumer feels every change) or versioned (independent schedules, at the cost of skew and back-porting).

      ### Micro-frontends: what they actually solve

      Micro-frontends solve one problem well: letting independently staffed teams deploy without a shared release train. That is an organisational problem; if you do not have it, do not pay for the solution.

      The costs are permanent: duplicated framework runtimes, version skew between fragments, cross-application state and routing no framework handles, a much harder performance story because nobody owns the composed page's bundle or Core Web Vitals, and design-system drift. Most teams are better served by a modular monolith with enforced boundaries.

      ### Migration, release and observability

      You will inherit legacy. The strangler pattern is reliable: route one subtree of the app to the new implementation, run old and new side by side, migrate slice by slice, and delete the old path once nothing routes to it. Codemods do the mechanical portion. Big-bang rewrites fail because the old system keeps shipping while the new one chases a moving target.

      Decouple deploy from release with feature flags: ship code dark, enable per cohort, keep a kill switch that needs no deploy. Pair with trunk-based development and short-lived branches.

      Then measure users, not servers. Real-user monitoring of Core Web Vitals from the field, because lab numbers on your laptop are not your users' phones. Error tracking with uploaded source maps and release tags, so a stack trace names a function and a version. Session replay where privacy allows, masking user input by default. Alert on user-facing symptoms — error rate, LCP regression, checkout failure — not CPU. Enforce performance budgets in CI, record decisions in ADRs, and treat a new joiner's time to first commit as a real metric.

      ### The mistakes people actually make

      - Adopting micro-frontends with a single team: every cost, none of the benefit.
      - A monorepo with no task caching, so CI takes 40 minutes and people stop running it locally.
      - Feature flags that are never removed, until the combinations exceed what anyone can test.
      - Error tracking with no source maps or release tags, so every stack trace is minified noise.
      - A rewrite that ships in year two, missing two years of features, and never catches up.
      - Boundaries documented in a README instead of enforced by the linter; that lasts until the first deadline.

      **What you can do after this:** look at a large frontend codebase and say which boundaries are enforced versus merely documented, where CI time is wasted, and whether a proposed micro-frontend split solves a real organisational constraint.
