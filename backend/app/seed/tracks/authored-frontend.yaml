  - slug: frontend-sveltekit
    name: 'Meta-Frameworks: SvelteKit, Next.js, Nuxt and Astro'
    domain: frontend
    est_hours: 12
    difficulty: advanced
    prerequisites:
      - frontend-ssr
      - frontend-deployment
    summary: |-
      Compare how SvelteKit, Next.js, Nuxt, Astro and React Router answer routing, server data
      loading, mutations and deployment, then choose one for a project and defend the choice on
      lock-in, runtime constraints and how easy the escape hatch is.
    content_md: |-
      A UI library renders components. It has no opinion about where routes live, when data is
      fetched, which parts of the page are rendered on a server, or what your deployment target
      can execute. A meta-framework is the layer that answers all four, and it answers them with
      conventions rather than configuration.

      That is why the durable skill is not "knowing SvelteKit". It is recognising the same four
      problems under four sets of names, so that moving between them costs a week rather than a
      rewrite.

      ### File-system routing and nested layouts

      All of them map directories to URLs. Dynamic segments capture a parameter (`[slug]`,
      `[id]`), catch-all segments capture the rest of a path, and route groups let you organise
      files without adding URL segments. Layouts nest along the same tree: a layout file wraps
      every route beneath it, and — this is the part people miss — a layout is not remounted when
      you navigate between its children. State inside it survives, which is what you want for a
      sidebar's scroll position, and what will confuse you when a layout-level data function does
      not re-run on navigation.

      ### Server loaders and the waterfall they prevent

      Each framework gives routes a server-only data function: `load` in SvelteKit and Nuxt,
      async server components and route-level fetching in the Next.js App Router, loaders in
      React Router. It runs before the page renders, on the server, with direct access to your
      database or internal services. That matters twice. First, no secret reaches the client.
      Second, the layout and page loaders for one navigation run in parallel, whereas fetching
      inside components produces a waterfall: a child cannot start its request until its parent
      has rendered, so three levels of nesting means three sequential round trips. Loaders that
      genuinely depend on each other must be sequential; independent ones must not be. Streaming
      lets you return the fast part immediately and resolve slow data into a boundary later.

      ### Mutations, server-only modules and secrets

      Writes go through form actions: SvelteKit `actions`, Next.js Server Actions, Nuxt server
      routes. All of them are built on a real `<form method="POST">`, which is what makes
      progressive enhancement possible — the flow works before hydration, and the framework
      upgrades it to a `fetch` afterwards while keeping pending and error state.

      Secrets stay out of the bundle by convention, not by luck. Environment variables are split
      into a public prefix that is inlined into client code and a private set that is server-only,
      and server-only modules fail the build if a client component imports them. Learn where your
      framework draws that boundary before you put an API key anywhere near a component.

      ### Adapters, runtimes and how the five differ

      An adapter compiles the same app for a Node server, a serverless function, an edge runtime
      or a directory of static files. The target constrains the code: edge runtimes expose Web
      APIs only, so `fs`, native bindings and many Node libraries are unavailable, and serverless
      functions keep no durable memory between requests. Middleware runs before routing and is
      usually edge-bound.

      On the comparison: SvelteKit is the lightest convention layer, with clear escape hatches
      and a small runtime. The Next.js App Router is the heaviest — React Server Components, an
      aggressive caching model and real lock-in — in exchange for the deepest ecosystem. Nuxt
      sits between them for Vue, with strong auto-imports and a portable server layer. Astro is
      content-first: no JavaScript by default, islands where you need interactivity, weakest fit
      for a heavily stateful app. React Router, the successor to Remix, is the most
      standards-shaped: loaders, actions and plain `Request`/`Response`, little proprietary
      surface.

      ### Mistakes people actually make

      - Fetching inside a component when the route already has a loader, reintroducing the exact
        waterfall the loader existed to remove.
      - Importing a server module into a component that also runs on the client, and shipping a
        database URL to the browser.
      - Assuming an edge runtime is Node. It is not, and a dependency that touches `fs` will fail
        only once it is deployed.
      - Choosing a meta-framework for a site with no server needs, then paying for hydration, an
        adapter and a build pipeline to serve five static pages.

      **What you can do after this:** given a product brief, pick a meta-framework, name the
      deployment adapter, and state for each route where its data loads and which rendering
      strategy it uses.
