  - slug: frontend-ai-in-development
    name: Where AI Actually Helps in Frontend Work
    domain: frontend
    est_hours: 4
    difficulty: intermediate
    prerequisites:
      - frontend-testing
    summary: |-
      Form a calibrated view of what a language model can and cannot do for frontend
      work: where it genuinely saves time, where it fails structurally rather than
      temporarily, and what verification burden it transfers onto you before anything
      gets merged.
    content_md: |-
      This topic sits at the end of the track deliberately. Every judgement that matters here — is this component accessible, is this state model sane, does this test assert anything — depends on knowing the underlying material. A tool that produces plausible frontend code is only useful to someone who can tell plausible from correct, and that is what the earlier concepts built.

      The framing here is deliberately unexcited: a language model is a specific piece of machinery with a specific failure profile, and understanding the machinery tells you where it helps.

      ### What the machine is actually doing

      A large language model predicts the next token given the tokens before it. Training compresses an enormous corpus into weights capturing statistical structure: syntax, idiom, common API shapes, the usual way a problem gets solved. Further tuning shapes it to follow instructions, and some models emit reasoning tokens before answering, which helps on multi-step problems without changing the mechanism.

      Two consequences follow. First, there is no separate store of facts to check against — a true token sequence and a plausible one are produced the same way, so **hallucination is a structural property, not a defect a future release removes.** Second, it is strongest where patterns are dense and well represented in training data, and weakest where they are not.

      ### Where the strength actually is

      Reliably useful: boilerplate (a form component, a reducer, a config file), test scaffolding derived from an existing implementation, mechanical migrations and codemods, regular expressions, format conversion (JSON into TypeScript types, curl into `fetch`), and explaining code you have never seen.

      Reliably weak: your product's intent, which is written down nowhere; your codebase's undocumented invariants; APIs released after the training cutoff, where it confidently produces the previous shape; and anything requiring the result to be *observed* rather than predicted — unless the tool has real execution and file access, which is a later concept.

      ### Non-determinism, context, and the cutoff

      Sampling is probabilistic, so the same prompt can yield different output; temperature controls how much. A model call is not a pure function, which matters once you ship one in a product.

      The context window is the total tokens the model can attend to at once, prompt and output together. Current windows are large but they are not your repository, and detail buried mid-context is used less reliably than detail near the edges. This is why *which* files you supply dominates output quality.

      ### The verification burden, and where the time really goes

      Generation gets cheaper; review does not. The rule that survives production is blunt: **you must be able to explain any code you merge, in review, without the assistant.** If you cannot, it is not ready, however well it works.

      Tests are the practical mechanism, which is why this concept depends on testing. A generated implementation satisfying a test *you* wrote has been checked against something real; a generated test passing against generated code checks nothing.

      Two risks are easy to skip. Provenance: generated code can closely reproduce training material, so treat large verbatim blocks like a copy-paste from an unknown repository. Privacy: a hosted model receives your prompt, attached source included — read the retention and training terms for the tier you are on, since consumer and business tiers differ.

      Be honest about the denominator, too. In most frontend teams the sinks are clarifying an ambiguous design, cross-browser behaviour, waiting on review, flaky CI and coordination. Typing code is a smaller slice than it feels, and speeding it up does not compress the rest, so a team measuring generated lines will think it is winning while cycle time stays flat.

      ### The mistakes people actually make

      - Accepting a confident call to something that does not exist: a method not on the prototype, a prop the component never declared, a CSS property nobody implemented. Invented APIs look exactly like real ones.
      - Merging code you cannot explain, then being unable to defend it when it breaks at 2am.
      - Reading a green type-check as correctness. Types constrain shape, not behaviour; a perfectly typed call can still pass the arguments in the wrong order.
      - Pasting proprietary source into a consumer chat tier without checking retention terms.

      **What you can do after this:** look at a ticket on your board and say in advance whether a model will save you time, be roughly useless, or produce something plausible that costs more to verify than to write.
