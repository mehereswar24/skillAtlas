  - slug: frontend-package-managers
    name: Dependencies, Semver and Supply-Chain Risk
    domain: frontend
    est_hours: 6
    difficulty: beginner
    prerequisites:
      - frontend-javascript
      - frontend-version-control
    summary: |-
      You will be able to read a lockfile as the source of truth, choose semver ranges
      deliberately, explain why pnpm's layout prevents phantom dependencies, and assess a
      package's supply-chain risk before you add it.
    content_md: |-
      Every dependency you add is code you did not write, cannot fully review, and will ship
      to users or execute on your build machine with whatever privileges that machine has.
      That is not an argument against dependencies, it is an argument for adding them
      deliberately: installing a package is a decision with a cost.

      ### package.json and how resolution works

      `dependencies` ship with your application. `devDependencies` are build and test tools,
      omitted by `npm install --omit=dev`. `peerDependencies` says "I need React but the
      application must supply it", which is how a plugin avoids dragging in a second copy of
      a library that must be a singleton. `optionalDependencies` covers platform-specific
      binaries. `engines` records the Node versions you support. The `exports` field declares
      a package's public entry points and blocks deep imports into its internals; `main` and
      `module` are the older fallbacks.

      On install, the manager walks your declared ranges, picks the highest published version
      satisfying each, deduplicates where versions are compatible, and writes the resulting
      tree to a lockfile.

      ### Semver, and why the lockfile is the real source of truth

      `^1.2.3` allows anything below `2.0.0`; `~1.2.3` allows anything below `1.3.0`; a bare
      `1.2.3` is exact. A trap: below 1.0.0 the caret is much tighter, so `^0.2.3` allows only
      `0.2.x`. More importantly, semver is a promise made by a human, not a guarantee. A patch
      release that changes a default, tightens a type definition, or fixes a bug you had
      accidentally relied on will break your build, within the letter of semver.

      So the lockfile, not `package.json`, describes what you actually install: exact versions
      for the whole transitive tree, resolved URLs and integrity hashes. Commit it. `npm ci`
      (and `pnpm install --frozen-lockfile`) removes `node_modules` and installs exactly the
      lockfile, failing loudly if it disagrees with `package.json`. That is what CI must run.
      Plain `npm install` may resolve differently and rewrite the lockfile as a side effect.

      ### node_modules layout and phantom dependencies

      npm and Yarn hoist: shared transitive packages are flattened towards the top of
      `node_modules`, so `import 'lodash'` resolves in your code even though you never
      declared lodash. That is a phantom dependency, and it breaks on the day a version bump
      changes the hoisting. pnpm avoids it structurally: packages live once in a
      content-addressed store on disk, are hard-linked into a hidden `node_modules/.pnpm`
      directory, and only your declared dependencies are symlinked into `node_modules`. An
      undeclared import therefore fails immediately, and installs use far less disk. Yarn's
      Plug'n'Play goes further and removes `node_modules` altogether in favour of a resolution
      map. Workspaces let one lockfile cover many packages in a monorepo, linking them
      locally; add a task runner such as Turborepo or Nx only when build orchestration, not
      resolution, is your bottleneck.

      ### Supply-chain risk you should actually think about

      `preinstall`, `install` and `postinstall` scripts run arbitrary code on your machine and
      in CI with access to your environment variables, which is the most common compromise
      path; `--ignore-scripts` disables them, and pnpm requires you to allowlist which
      dependencies may build. Typosquatting publishes a package one character away from a
      popular name. Dependency confusion publishes a public package with the same name as your
      private internal one, hoping your resolver prefers it; scope internal packages and pin
      the registry for that scope. npm provenance and attestations tie a published tarball to
      the CI run and commit that produced it, verifiable with `npm audit signatures`.
      `npm audit` maps advisories onto version ranges; it is noisy, and a "high" in a
      build-only dependency is often unreachable at runtime, so triage rather than upgrading
      blindly. Before adding a package, look at the date of the last release, how many
      maintainers exist, the transitive dependency count, the install size, and the licence.

      ### The mistakes people actually make

      Not committing a lockfile, or committing two of them from different managers, so every
      machine installs a slightly different tree and "works on my laptop" becomes literal.
      Running `npm install` in CI instead of `npm ci`, which means CI is not testing what you
      locked. Adding a 300 KB library for a ten-line utility, then shipping it to every user.
      Assuming a caret range cannot break you. And deleting the lockfile to resolve a merge
      conflict rather than regenerating it from the merged `package.json`.

      **What you can do after this:** look at a new dependency and state its transitive count,
      install size, install-script behaviour and licence, then decide whether to add it, and
      make your CI install reproducible.
    resources:
      - kind: doc
        title: Semantic Versioning 2.0.0
        url: https://semver.org/
      - kind: doc
        title: 'npm Docs: About semantic versioning'
        url: https://docs.npmjs.com/about-semantic-versioning
      - kind: doc
        title: 'npm Docs: npm ci'
        url: https://docs.npmjs.com/cli/v11/commands/npm-ci
      - kind: doc
        title: 'npm Docs: Generating provenance statements'
        url: https://docs.npmjs.com/generating-provenance-statements
      - kind: doc
        title: 'pnpm: Motivation (why its node_modules differs)'
        url: https://pnpm.io/motivation
      - kind: doc
        title: 'pnpm: Workspaces'
        url: https://pnpm.io/workspaces
      - kind: doc
        title: 'Node.js: Modules, Packages and the exports field'
        url: https://nodejs.org/api/packages.html
      - kind: doc
        title: 'OpenSSF: Package Manager Best Practices'
        url: https://github.com/ossf/package-manager-best-practices
  - slug: frontend-module-bundlers
    name: Modules, Bundling and the Build Pipeline
    domain: frontend
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - frontend-javascript
      - frontend-package-managers
    summary: |-
      You will be able to explain what a bundler does to your source, diagnose why tree
      shaking failed, split code at route boundaries, and set up content hashing so static
      assets can be cached indefinitely.
    content_md: |-
      Browsers load ES modules natively, so why build anything? Because your source is
      TypeScript, JSX and CSS imports that no browser understands; because a real application
      resolves into thousands of module files, and discovering them one request at a time is
      a latency disaster even over HTTP/2; and because you want unused code removed and
      filenames that can be cached for a year. A build turns code arranged for humans into
      bytes arranged for the network.

      ### Module formats and why the difference matters

      ESM `import` and `export` are static: top level only, never conditional, resolved
      before any code runs. That is what lets a tool know the whole dependency graph without
      executing anything, which is the precondition for removing dead code. CommonJS `require()` is an ordinary runtime function call that can
      sit inside an `if`, and it returns a mutable object, so the graph is not statically
      knowable. Interop is where the pain lives: default-import semantics, `__esModule`
      markers, named exports a bundler must infer from a CJS file, and dual packages where an
      app ends up with both the ESM and CJS copy of one library, each holding its own state. The `exports` field with `import`, `require` and `default`
      conditions is how a package declares both builds.

      ### From source to a dependency graph

      The build starts at an entry, parses each module, records its imports, transforms it,
      and repeats. Transformation is now done by native-speed tools: esbuild (Go) and SWC or
      Oxc (Rust) strip TypeScript types and compile JSX. Stripping types is not type checking
      — the transformer just deletes annotations — so `tsc --noEmit` runs separately, which is
      why your dev server happily serves code that does not type check.

      Tree shaking marks the exports reachable from an entry and drops the rest. It fails
      whenever removal cannot be proven safe: a module whose top level has side effects
      (registering a polyfill, mutating a prototype, injecting CSS) must be kept, so packages
      declare `"sideEffects": false` (or globs for the files that do have them) to grant
      permission. CommonJS dependencies generally cannot be shaken at all.

      Code splitting works off dynamic `import()`: each becomes a chunk boundary, which
      routers use to give every route its own chunk. Modules shared by several chunks are
      factored out so they are not duplicated, and `<link rel="modulepreload">` removes a round
      trip when a chunk is known to be needed.

      ### Caching, source maps and build-time constants

      Content hashing names output after a hash of its own bytes, such as `app.9f2b1c.js`.
      Because a change produces a new URL, you can serve those files with
      `Cache-Control: max-age=31536000, immutable`, and only the small unhashed HTML needs
      revalidating. Source maps map built bytes back to your source; `sourcesContent` embeds
      your original code inside the map, which you want in an error tracker and not on a
      public URL, so upload maps to your monitoring service rather than deploying them. `import.meta.env.MODE` and `process.env.NODE_ENV` are
      replaced with string literals at build time so the minifier can delete the unreachable
      branch — which also means anything in a client-side env var is public.

      ### The dev and production split, and today's tools

      In development, the server sends your source as native ES modules, transforms each file
      on request, and pushes hot module replacement updates over a WebSocket so a changed
      module is swapped in without a reload or loss of state; startup no longer scales with
      the size of your app. In production you still bundle: Vite uses Rollup, with
      Rolldown, its Rust Rollup-compatible replacement, taking that role over. Elsewhere,
      webpack remains mature and widespread, Rspack is a Rust webpack-compatible drop-in,
      Turbopack powers Next.js, and esbuild and Rollup are used directly for libraries. Run a
      bundle visualiser and look at what is largest.

      ### The mistakes people actually make

      Importing a whole library for one function from a CommonJS build, so the whole thing
      ships. Creating a barrel `index.ts` that re-exports everything, so importing one symbol
      pulls the whole package into the graph, wrecking code splitting and slowing the dev
      server. Shipping source maps with sources inlined on a
      public URL without meaning to. Serving unhashed filenames with aggressive caching, so
      users get fresh HTML pointing at JavaScript the browser refuses to re-fetch. And
      treating build output as unknowable rather than measurable in a minute.

      **What you can do after this:** open a bundle report, name the three largest
      contributors, say for each whether it is tree-shakeable, and split a route out into its
      own hashed chunk.
    resources:
      - kind: doc
        title: 'Vite: Why Vite'
        url: https://vite.dev/guide/why
      - kind: doc
        title: 'Vite: Building for Production'
        url: https://vite.dev/guide/build
      - kind: doc
