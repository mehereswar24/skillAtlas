  - slug: frontend-graphql
    name: 'Client-Side API Contracts: REST, GraphQL and Typed Clients'
    domain: frontend
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - frontend-data-fetching
      - frontend-type-checkers
    summary: |-
      Choose and defend an API contract for a browser client. You will model REST
      resources with sane pagination and caching, read and write GraphQL with
      fragments and a normalised cache, and generate client types from the contract
      instead of hand-writing them.
    content_md: |-
      Every screen encodes a bet about the shape of some data, and the bet is
      settled at runtime: your component either finds `user.avatarUrl` or renders
      `undefined`. So the useful question is not whether you like GraphQL. It is how
      your client comes to know that shape, who checks it is still true after a
      deploy, and who pays when it is wrong.

      Two costs recur. Over-fetching: an endpoint returns forty fields and the card
      shows three, so you pay bytes and parse time for nothing. Under-fetching: the
      list returns ids, so you fire N follow-up requests and the waterfall lands on
      your LCP. REST, GraphQL and typed RPC settle those costs in three different
      places.

      ### REST, done properly

      Most criticism of REST is criticism of bad REST. Done well you model resources
      rather than verbs, and status codes carry meaning: `201` plus `Location` for a
      create, `409` for a conflicting write, `422` for a body that fails validation.
      Pagination is the first fork: offset (`?page=3&limit=20`) is
      trivial, but rows shift between pages under concurrent inserts and deep
      offsets get slow because the database still walks the skipped rows. Cursor
      pagination passes an opaque marker derived from the last row's sort key —
      stable and index-friendly, with no random access to page 47.

      Conditional requests let a server say "nothing changed" cheaply:

      ```http
      GET /articles/12   ->  200, ETag: "a1b2"
      GET /articles/12   with  If-None-Match: "a1b2"
                         ->  304 Not Modified, empty body
      ```

      `If-Match` on a `PUT` protects writes the same way: a stale editor gets `412`
      instead of clobbering someone. Describe the surface in OpenAPI and a generator
      emits your client and its types.

      ### GraphQL as a mechanism

      GraphQL is one endpoint, a schema written in SDL, and a query language in
      which the *client* names the fields it wants. The server implements a resolver
      per field and the engine walks your query calling them. Because the client
      picks fields, over-fetching becomes a client-side decision, and one round trip
      can traverse relationships REST spreads over four endpoints.

      Fragments are the part that matters architecturally. A component declares its
      data requirement as a fragment on a type, the page composes those fragments
      into one query, and the requirement travels with the component — fragment
      colocation. Delete the component, delete its fields.

      Naive resolvers cause N+1: one query for 50 posts, then 50 author lookups.
      DataLoader batches and deduplicates lookups within a single tick. On the
      client, Apollo, urql and Relay keep a *normalised* cache: the response tree is
      flattened into entries keyed by `__typename` plus id, so one mutation result
      updates every view of that entity. That needs stable, unique ids; a type
      without one needs explicit key configuration or entries merge.
      Persisted queries replace the query body with a hash, shrinking requests and
      letting the server run an allowlist.

      The honest costs: HTTP-layer caching is much harder when everything is one
      POST to one URL. Depth and complexity limits become a security control rather
      than tuning. And the schema is a coupling surface — every field is a promise,
      so you deprecate rather than delete.

      ### Typed RPC, and when each wins

      If TypeScript owns both ends in one repository, tRPC removes the contract
      language: the client imports the router's *type* and infers inputs and
      outputs, so there is nothing to generate and nothing to drift — and nothing
      for a Swift client. gRPC-Web is the opposite: a Protobuf IDL, generated stubs
      and a proxy, worth it where the backend already speaks gRPC.

      Roughly: a handful of endpoints wants REST plus OpenAPI; many clients with
      divergent needs over a deep graph want GraphQL; one TypeScript team owning
      both ends wants tRPC. Whatever you pick, generate the types from the contract
      in CI, so a removed field breaks the build rather than the browser.

      ### Mistakes people actually make

      Hand-writing `interface User` beside the fetch call: the server renames a
      field, TypeScript still compiles, and the UI renders blanks. Believing GraphQL
      removes the need to think about pagination or caching, so `posts` returns
      every row. Exposing an unbounded nested query in production —
      `friends { friends { friends } }` is a denial-of-service primitive. And
      adopting GraphQL for a three-endpoint app: a schema, resolvers, a normalised
      cache and codegen, to save two requests.

      **What you can do after this:** given a screen and a backend, pick REST,
      GraphQL or typed RPC, justify it in terms of over-fetch, round trips and
      coupling, and wire codegen so a server change fails your build.
    resources:
      - kind: doc
        title: 'GraphQL: Learn'
        url: https://graphql.org/learn/
      - kind: doc
        title: OpenAPI Specification (latest)
        url: https://spec.openapis.org/oas/latest.html
      - kind: doc
        title: 'RFC 9110: HTTP Semantics (conditional requests, status codes)'
        url: https://datatracker.ietf.org/doc/html/rfc9110
      - kind: doc
        title: 'MDN: HTTP conditional requests'
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Conditional_requests
