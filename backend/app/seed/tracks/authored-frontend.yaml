  - slug: frontend-ai-assisted-coding
    name: Working with AI Coding Assistants
    domain: frontend
    est_hours: 5
    difficulty: intermediate
    prerequisites:
      - frontend-ai-in-development
    summary: |-
      Operate a coding assistant as a working tool: pick the right interaction mode,
      control the context it sees, drive changes with tests as the contract, and
      review generated diffs with the same rigour you would apply to a colleague's
      pull request.
    content_md: |-
      Most of the difference between engineers who get value from a coding assistant and those who bounce off it has nothing to do with prompt wording. It comes from two habits: controlling what the assistant sees, and refusing to merge anything you have not read.

      Treat it as a fast, well-read colleague with no memory of your product, no way to ask your designer a question, and a tendency to answer confidently when unsure. Useful — but not given commit access without review.

      ### Three modes, three appropriate uses

      **Inline completion** predicts the next few lines as you type. It is fast and low-stakes, and it works best on mechanical continuations — filling out a switch, finishing an object literal, writing the fifth similar test case. Its failure mode is friction: a wrong suggestion you half-accept and then unpick, so learn to reject fast rather than edit a bad completion.

      **Chat or ask** is for explanation and exploration, where nothing is written to disk: "what does this reducer do", "why is this selector re-rendering". This is where models are strongest, because the output is prose you evaluate rather than code you run.

      **Edit or apply** produces multi-file changes. This is where value and risk both concentrate. Never accept one without reading the diff hunk by hunk.

      ### Context is the whole game

      Output quality tracks input relevance far more than phrasing. Practically: open or attach the files that actually matter, including the type definitions and the neighbouring component that establishes the local convention. Point the assistant at the real failing test rather than describing the failure in prose — paste the command output. Use the project-level instruction file your tool supports (`CLAUDE.md`, `.github/copilot-instructions.md`, Cursor rules) so conventions do not need restating every session; that idea gets its own concept later.

      Equally, prune: twenty irrelevant open files dilute attention and cost tokens. Attach the three that define the problem.

      ### Tests as the contract

      The highest-leverage pattern in assisted frontend work is to establish a machine-checkable definition of done before generating anything:

      1. Write or generate the test that expresses the behaviour you want, and read it carefully — this is the artefact you are trusting.
      2. Watch it fail for the right reason.
      3. Ask the assistant to make it pass, in the smallest reasonable diff.
      4. Run it yourself. Then read the implementation.

      One intent per request. A request for "a settings page with validation, persistence and optimistic updates" returns 500 lines you will not read properly. Three requests return three diffs you will.

      ### Reviewing generated diffs

      Read it as a pull request from someone you do not know well. Do the imports resolve to real exports? Is error handling present or silently dropped? Are the accessibility attributes real ones, correctly applied? Did it change a file you did not ask about? Did it add a dependency? Then run it, in a browser, with a keyboard.

      Assistants fail in recognisable ways on frontend work specifically: hallucinated component props that your library never declared; outdated idioms, because older patterns dominate the training corpus (class components, legacy router APIs, superseded data-fetching hooks); invented CSS properties and vendor prefixes long since unnecessary; and accessibility advice that is confidently wrong, such as an `aria-label` on an element with no accessible role, or ARIA duplicating semantics the native element already had.

      Watch cost and latency too: a large model on a large context is slower and pricier than a small one on a focused question, and for a rename or a formatting fix a deterministic tool beats both.

      ### The mistakes people actually make

      - Accepting a fifteen-file change because the summary sounded right, then spending a day bisecting it.
      - Letting the assistant "fix" a failing test by weakening the assertion or adding a `skip`. The build goes green and the bug ships.
      - Treating the model as documentation. It paraphrases what an API looked like; open the actual docs for anything version-sensitive.
      - Asking for a whole feature in one shot, receiving something that runs, and discovering it duplicated three existing utilities.
      - Leaving inline completion on while writing security-sensitive code and accepting a plausible-looking token comparison.

      **What you can do after this:** drive a multi-file change through an assistant using a failing test as the specification, and review the resulting diff well enough to catch a hallucinated prop before it reaches CI.
