  - slug: frontend-version-control
    name: 'Git: Version Control as a Commit Graph'
    domain: frontend
    est_hours: 10
    difficulty: beginner
    prerequisites: []
    summary: |-
      You will be able to read a repository's history as a graph of snapshots, choose
      between merge, rebase, reset and revert with confidence, and recover work you
      thought you had destroyed.
    content_md: |-
      Git looks arbitrary if you learn it as a list of commands, and most people stop
      there: they memorise four incantations and dread everything else. It is really a
      small content-addressed database with a graph on top, and every command is an edit to
      that graph, so learn the model and the commands stop needing memorisation.

      ### The object database

      Git stores four kinds of object, each named by a hash of its own content. A `blob` is
      file contents with no name. A `tree` maps names to blobs and to other trees, so a tree
      is a directory. A `commit` points at one tree — a complete snapshot of the project —
      plus zero or more parents, an author, a committer and a message. An annotated `tag`
      points at a commit with its own message.

      Git stores snapshots, not diffs; a diff is computed when you ask for one. Because a
      commit's hash covers its tree and its parents, it transitively covers all history
      behind it. That single fact explains rewriting: touch an old commit and every commit
      after it necessarily gets a new hash.

      ### Refs, HEAD and the three areas

      A branch is a file under `.git/refs/heads/` holding one commit hash. That is the whole
      implementation, and `git commit` writes a commit then moves the current branch to it.
      `HEAD` is normally a symbolic ref naming a branch; when it points straight at a commit
      you are detached, so new commits belong to no branch and appear to vanish when you
      check out something else.

      Three areas matter: the working tree on disk, the index (a proposed next tree), and the
      repository (objects and refs). `git add` copies working-tree content into the index,
      `git commit` turns the index into a tree and a commit, and `git status` reports the
      differences between the three.

      ### Operations as graph edits

      `merge` creates a commit with two parents; if your branch is already an ancestor of the
      target, Git slides the pointer forward instead — a fast-forward, with no merge commit.
      `rebase` replays your commits onto a new base as new commits with new hashes, leaving
      the originals unreachable. `cherry-pick` applies one commit's change elsewhere, also as
      a new commit. `reset` moves the branch pointer: `--soft` keeps index and working tree,
      `--mixed` resets the index too, `--hard` also overwrites the working tree and destroys
      uncommitted work. `revert` records a new commit undoing an old one, which is the safe
      choice on a branch anyone else has. `stash` parks your working tree and index as
      commits to one side, and `.gitignore` only affects files Git is not already tracking.

      ```sh
      git log --graph --oneline --all   # the actual shape of history
      git revert <sha>                  # undo <sha> safely on a shared branch
      ```

      ### Recovery and finding the breakage

      `git reflog` records every position HEAD and your branches have held locally, kept for
      months by default, so a commit lost to a bad reset or rebase is almost always
      recoverable with `git reset --hard <sha>`. The exception is work never committed at
      all, which `reset --hard` deletes for good.

      `git bisect` binary-searches a commit range: mark a known-bad and a known-good commit,
      judge each revision Git checks out, and you find the offending commit in roughly
      log2(n) steps. `git bisect run ./check.sh` automates it when the test is an exit code.

      ### Commit hygiene

      A good commit has one intent and leaves the tree buildable. Write the subject in the
      imperative; use the body to explain why, since the diff already states what.
      Conventional Commits (`feat:`, `fix:`) is worth adopting only if something downstream
      consumes it, such as automated changelogs and version bumps.

      ### The mistakes people actually make

      Rebasing or force-pushing a branch others have pulled: their history now disagrees with
      yours and their next merge duplicates every commit. Reaching for `reset --hard` when
      they meant `revert`, and losing uncommitted work the reflog cannot return. Committing
      `node_modules` or `.env`, then adding it to `.gitignore` and expecting that to help —
      it does not untrack the file (`git rm --cached` does), and the secret is still in every
      clone. Believing that deleting a file removes it from the repository: every old commit
      still contains the blob, so a leaked credential must be rotated, not deleted.

      **What you can do after this:** take a repository where someone force-pushed over your
      branch, recover your commits from the reflog, and rebuild the branch without
      duplicating history.
    resources:
