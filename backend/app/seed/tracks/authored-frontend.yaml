        title: 'lint-staged: run linters on staged files'
        url: https://github.com/lint-staged/lint-staged
  - slug: frontend-testing
    name: Testing the Front End
    domain: frontend
    est_hours: 14
    difficulty: intermediate
    prerequisites:
      - frontend-dom-events
      - frontend-package-managers
      - frontend-accessibility
    summary: |-
      You will be able to write component tests that survive refactors, mock the network at
      the HTTP layer, drive a real browser with Playwright, and diagnose a flaky test by its
      actual cause rather than retrying it.
    content_md: |-
      A test suite is worth its maintenance cost only if it fails when a user would notice
      something broken and passes when they would not. Most front-end suites fail that
      standard expensively: they break on refactors that changed nothing observable, and stay
      green through bugs a user hits immediately. One rule fixes most of it — assert on what a
      user can perceive and do, not on how the code is arranged.

      That has an early consequence. Testing Library's preferred query,
      `getByRole('button', { name: 'Save' })`, works only if your markup exposes a role and an
      accessible name — precisely what a screen reader needs. If it cannot find your control,
      an assistive technology user cannot either. Accessibility and testability are the same
      property seen from two angles.

      ### The shape of the suite

      The pyramid says many cheap unit tests, fewer integration tests, very few end-to-end
      tests; the trophy argues the integration band deserves the most weight, because
      confidence per millisecond of runtime peaks there in a UI. Either way, decide per test:
      what would this catch, and what does it cost when unrelated code changes.

      ### Unit and component tests

      Vitest is the common runner now, because it reuses your Vite transform pipeline and
      config, so tests resolve modules as the app does; Jest remains widely used, with close
      APIs. Component tests run in jsdom or happy-dom, or in a real browser via Vitest's
      browser mode.

      With Testing Library you render, then query the way a user would look: role first, then
      label text, then visible text. `getBy*` throws when the element is missing, `queryBy*` returns `null` and is how you assert
      absence, and `findBy*` retries, which is what you use for anything asynchronous. Never
      assert on component state, hook internals or CSS class names. Use `user-event` rather
      than `fireEvent`: it simulates the sequence a browser really produces — pointer events,
      focus, keydown, input, keyup — whereas `fireEvent` dispatches one synthetic event, and a
      component that only works under `fireEvent.change` is often broken for real keyboards.

      ### Test doubles and time

      Mock at the boundary you do not own, which is the network, not `fetch`. MSW intercepts
      at the request layer with handlers that read like a small server, so the same handlers
      serve tests and local development while your code keeps calling real
      `fetch`. Stubbing `fetch` couples the test to the call shape and proves nothing about the
      request you send. Fake timers advance a debounce deterministically; restore them
      afterwards, and configure `user-event` with the advance function or its internal waits
      will hang. Snapshot tests rot fast: once a diff is four hundred lines, nobody reads it.

      ### End-to-end and visual tests

      Playwright drives a real browser. Its locators are lazy and auto-wait for the element to
      be attached, visible, stable and enabled before acting, removing most reasons to sleep. Every test gets an isolated browser context with its own cookies and storage; log
      in once and reuse the saved `storageState`. When a run fails, the trace viewer
      replays it with a DOM snapshot, network log and console output per action, which is how
      you debug failures you cannot reproduce locally. Screenshot-based visual regression is
      useful only if you pin fonts, freeze animations and fix the clock.

      ### Flakiness, coverage and accessibility

      Flakiness has few causes: real time (sleeps, animations, transitions), state
      shared between tests (a database row, `localStorage`, a module-level cache), unmocked or
      slow network, and assertions racing the render. Find the cause; a retry count only hides
      it. Coverage tells you which lines never executed — a useful floor, a worthless target,
      since full line coverage with no assertions is trivially achievable. Run axe
      (via `jest-axe` or `@axe-core/playwright`) over key views in CI: it catches contrast,
      missing accessible names and invalid roles, a real but partial share of issues, so keep
      manual keyboard passes too.

      ### The mistakes people actually make

      Asserting on CSS classes or component internals, so every refactor breaks the suite and
      the team stops trusting it. Using `waitFor` with an arbitrary sleep instead of a
      condition: slow when it works, flaky when it does not. Having one enormous
      end-to-end suite and no unit tests, so failures take forty minutes and point nowhere. And mocking so much that the test only proves the mocks were configured
      correctly.

      **What you can do after this:** take a component test that breaks on every refactor,
      rewrite it against roles and visible text with MSW handling the network, and say what
      behaviour it protects.
