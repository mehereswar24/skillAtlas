  - slug: frontend-css-frameworks
    name: 'Styling at Scale: Utility CSS, Modules and CSS-in-JS'
    domain: frontend
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - frontend-css-layout
      - frontend-module-bundlers
    summary: |-
      Choose a styling strategy for a real codebase and defend it on scoping, deletability,
      runtime cost and build integration, combining utility classes, CSS Modules or zero-runtime
      CSS-in-JS with cascade layers, custom properties and modern selectors.
    content_md: |-
      CSS has no module system of its own. Every selector you write is global, matches anything
      in the document, and competes with every other rule by specificity and source order. On a
      small site that is fine. On a codebase with two hundred components and four years of
      history it produces the characteristic failure: a stylesheet nobody dares delete, because
      nobody can prove which rules are still doing work.

      So the question to ask of any styling approach is not "is it quick to write" but "can I
      delete a component and know its CSS went with it". Scoping and deletability are the axes;
      runtime cost and build integration are the constraints.

      ### The approaches, compared on scoping

      Plain CSS with a naming convention such as BEM (`card__title--compact`) scopes by
      discipline only. It costs nothing at build time and nothing at runtime, and it degrades the
      moment someone is in a hurry, because nothing enforces the convention.

      CSS Modules scope at build time. You import a stylesheet, the bundler rewrites each class
      to a hashed name and hands your module a mapping object. Collisions become impossible, the
      output ships as an ordinary stylesheet, and there is no runtime. Deletion is safe because
      the file is imported by exactly one component.

      Utility-first CSS (Tailwind) removes naming entirely. Styles are composed from constrained
      tokens applied in the markup, so a component's appearance is visible where it is used and
      disappears when the markup does. The compiler scans your source for class strings and emits
      only what it finds, which is why class names assembled by string concatenation at runtime
      silently produce no CSS. The cost is readability: long class strings, and repeated patterns
      that must be extracted into components rather than into CSS.

      ### CSS-in-JS: runtime versus zero-runtime

      Runtime CSS-in-JS (styled-components, Emotion) computes styles during render and injects
      them into the document. That buys genuinely dynamic styling from props, and it costs
      per-render work, an extra library in the bundle, and real friction with server components —
      a styled component needs client-side JavaScript by construction, so it drags the
      client boundary along with it.

      Zero-runtime libraries (vanilla-extract, Panda, Linaria) keep the authoring experience —
      type-checked styles written in TypeScript — but extract everything into a static stylesheet
      at build time. Variants become precomputed class names, and nothing is computed per render.

      ### What the platform now does for you

      Native features have shrunk the gap. Custom properties give you cascading, runtime-variable
      values that can be swapped per theme without a rebuild. `@layer` gives explicit cascade
      ordering, so a library's styles can sit in a lower layer than yours and be overridden
      without a specificity war:

      ```css
      @layer reset, library, components, utilities;
      @layer components { .card { padding: var(--space-4); } }
      ```

      Nesting removes most preprocessor use, `:has()` allows parent-conditional styling that
      previously required JavaScript, `@scope` limits a block of rules to a subtree, and
      `color-mix()` derives hover and disabled states from one token instead of five hand-picked
      hex values. Alongside this, inline the critical CSS needed for the first paint and let the
      rest load as a normal stylesheet.

      ### Mistakes people actually make

      - Running four approaches at once: a legacy global sheet, BEM, modules and a utility
        framework. Nobody can predict which wins, and the cascade becomes folklore.
      - Overriding a library by escalating specificity — `!important`, then a longer selector,
        then `#id .thing.thing` — instead of putting it in a lower cascade layer.
      - Keeping a `global.css` that has grown for years because no tooling can prove a rule is
        dead. Unused CSS is a deletability failure, not a file-size problem.
      - Hard-coding values in utility classes (`p-[13px]`, `text-[#3b82f6]`) so the tokens no
        longer control anything and dark mode has to be done by hand.

      **What you can do after this:** audit a codebase's styling, say which approach owns which
      layer of the cascade, and migrate a component off a runtime CSS-in-JS library without
      changing its rendered output.
