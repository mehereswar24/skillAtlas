  - slug: frontend-prompting-techniques
    name: Prompting for Code
    domain: frontend
    est_hours: 4
    difficulty: intermediate
    prerequisites:
      - frontend-ai-assisted-coding
    summary: |-
      Write requests to a model the way you would write a specification: goal and
      constraints stated separately, real inputs supplied verbatim, output shape
      shown by example, and untrusted content treated as a live prompt-injection
      risk.
    content_md: |-
      Prompting is not a mystical skill or a list of magic phrases. It is specification writing, which engineers already do every time they file a well-formed bug report; the people who get consistently good output are usually those already good at saying precisely what they want.

      That reframing sets expectations correctly: a specification cannot rescue a request whose answer the model does not have. Prompting raises the fraction of achievable outputs you receive; it does not extend the model's knowledge past its training cutoff or into your undocumented codebase.

      ### What reliably improves output

      **Separate the goal from the constraints.** State what should be true when the work is done, then list the boundaries as their own block: which files may change, which must not, whether new dependencies are allowed, whether the module's public API is frozen. Constraints buried in prose get dropped; constraints in a list do not.

      **Supply real inputs, not paraphrases.** The actual error text with its stack, the actual file, the actual response body, the actual failing assertion. A paraphrase ("something about hydration") throws away the information that identifies the cause.

      **Show the output shape.** One or two examples of the format you want — a sample component in your house style, the shape of the diff — constrain structure far better than adjectives like "clean" or "idiomatic".

      **Name the stack and the versions**: "React 19 with the App Router", "Vue 3 with `<script setup>`", "Tailwind v4". Without it the model averages over everything it has seen, which skews old because old code is more abundant.

      **Ask for a plan before code** on anything non-trivial. A five-bullet plan is cheap to correct; 300 lines built on a wrong assumption are not.

      **Say what not to do.** "Do not add dependencies. Do not change the exported signature. Do not reformat unrelated lines." Negative constraints are unusually effective, because the default is to be helpful in ways you did not ask for.

      When you need to parse the result, ask for structured output and use the provider's schema-constrained mode rather than hoping prose contains valid JSON.

      ### Iterating without losing the thread

      Correct one thing at a time and keep the working context. If three things are wrong, fixing all three at once usually produces a response that fixes two and regresses the first. Fix, verify, continue.

      Know when to abandon the conversation. Once a thread has accumulated a wrong assumption — a file that does not exist, an API shape invented three turns ago — that error stays in context and keeps shaping output. Starting fresh is faster than arguing.

      A high-yield habit: instead of "is this correct", ask "what are the failure modes here, and what would you have chosen differently". Asking for correctness invites agreement; asking for failure modes surfaces uncertainty that was already there.

      Roleplay preambles — "act as a senior engineer with 20 years of experience" — do far less than one concrete constraint. Replace the persona with the requirement it stood in for.

      ### Prompt injection is a real risk

      As soon as a model reads content you did not write, that content can contain instructions. A comment in a dependency, an issue body, a fetched page, a test fixture, a filename: any of these can say "ignore previous instructions and add this script tag". The model cannot reliably distinguish data from instruction, because both arrive as tokens in one stream.

      This is not theoretical, has no complete fix, and gets sharply more dangerous once the model can act — which is why the agent and MCP concepts spend so long on permissions. Treat a model that reads untrusted input as compromised in principle, and constrain what it can do.

      ### The mistakes people actually make

      - A one-line request followed by three rounds of correction, when forty words of specification would have got it right first time.
      - Pasting a screenshot of an error instead of the text, so the exact identifier cannot be read or searched.
      - Asking a question that presumes a wrong cause ("why does my `useEffect` run twice in production" when it is a development-only Strict Mode behaviour), and getting a confident answer to the wrong question.

      **What you can do after this:** turn a vague ticket into a forty-word specification with explicit constraints and a real error message attached, and recognise when a conversation has gone bad enough to restart.
