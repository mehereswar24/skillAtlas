        title: 'MDN: Web Authentication API (passkeys)'
        url: https://developer.mozilla.org/en-US/docs/Web/API/Web_Authentication_API
  - slug: frontend-web-security
    name: 'The Browser Security Model: Origins, XSS, CSRF and CSP'
    domain: frontend
    est_hours: 12
    difficulty: intermediate
    prerequisites:
      - frontend-internet
      - frontend-dom-events
      - frontend-auth-strategies
    summary: |-
      Reason about browser security from the same-origin policy outwards. You will
      explain what CORS does and does not protect, find and close XSS sinks, deploy
      a strict nonce-based CSP, and defend a form against CSRF and clickjacking.
    content_md: |-
      Everything a browser does about security is built on one axiom: the
      same-origin policy. An origin is scheme, host and port together, so
      `https://app.example.com` and `https://app.example.com:8443` differ, as do the
      `http://` and `https://` versions of one host. Code
      from one origin may not read the DOM, cookies or responses of another. Learn
      its deliberate exceptions and the rest becomes derivable.

      ### What the same-origin policy deliberately does not block

      The policy restricts *reading*, not *sending*. A page on any site may submit a
      form to your server, load your image, or include your script — and the browser
      attaches your cookies while doing it. Those holes are load-bearing (they are
      what makes the web composable) and they are exactly why cross-site request
      forgery exists: the attacker cannot read your response, but they do not need
      to if the request itself transfers money. Note too that `<script>` executes
      the fetched code *inside your origin*, which is why third-party scripts are a
      supply-chain problem rather than a performance problem.

      ### CORS relaxes the policy; it is not a defence

      Cross-Origin Resource Sharing lets a server opt in to being read by another
      origin. Simple requests go straight out and the browser withholds the response
      unless `Access-Control-Allow-Origin` matches. Anything else — a `PUT`, a
      custom header, a JSON content type — triggers a preflight `OPTIONS` the server
      must answer before the real request is sent. With `credentials: "include"` the
      wildcard `*` is rejected outright, and a specific origin plus
      `Access-Control-Allow-Credentials: true` is required.

      Two consequences. A CORS error means the browser protected the *user*; the
      request usually reached the server and ran. And CORS cannot protect your API,
      because non-browser clients ignore it. Authorisation still happens on the
      server, every time.

      ### XSS: the sinks that actually matter

      Cross-site scripting is running attacker script in your origin, and it comes
      in three shapes: stored (persisted in your database and served to everyone),
      reflected (echoed back from a URL parameter) and DOM-based (your own script
      moves untrusted data into a dangerous sink without the server ever seeing it).

      The sinks are few and worth memorising: `innerHTML` and
      `dangerouslySetInnerHTML`; `href` or `src` taking a `javascript:` URL;
      `document.write`; strings passed to `eval` or `new Function`. The
      fix is contextual output encoding — the escaping that is safe in HTML text is
      wrong inside an attribute, a URL or a `<script>` block. When you must render
      user HTML, sanitise it with a maintained library such as DOMPurify, never a
      regular expression. Trusted Types goes further: it makes the
      browser refuse a plain string at those sinks, so an unsafe assignment throws
      instead of shipping.

      ### CSP as defence in depth

      A Content Security Policy assumes an injection will one day succeed and limits
      what it can do. Host allowlists have aged badly — one JSONP endpoint on an
      allowed CDN reopens everything. Prefer a strict policy: a per-response random
      nonce on your own scripts, `'strict-dynamic'` so scripts they load inherit
      trust, and `object-src 'none'`, `base-uri 'none'`.

      ```http
      Content-Security-Policy: script-src 'nonce-r4nd0m' 'strict-dynamic';
        object-src 'none'; base-uri 'none'
      ```

      Roll it out with `Content-Security-Policy-Report-Only` and a report endpoint
      first, then enforce. `frame-ancestors` is the modern clickjacking control,
      superseding `X-Frame-Options`.

      ### CSRF, integrity and the header baseline

      Against CSRF, combine `SameSite` cookies with a token: either a synchroniser
      token held in the session, or a double-submit cookie compared against a header
      your form sends. Pin third-party scripts with Subresource Integrity so a
      compromised CDN file fails its hash check. Add `Strict-Transport-Security`, a
      tight `Referrer-Policy` so URLs do not leak, and `Permissions-Policy` to
      disable APIs you never use. `X-XSS-Protection` is obsolete and should not be
      sent. And remember that there are no client-side secrets: an API key in your
      bundle is a published API key.

      ### Mistakes people actually make

      Sanitising on the way *in* and storing "clean" data, then rendering it into a
      different context where the escaping is wrong; encode on output, where you
      know the context. Adding `'unsafe-inline'` to make a CSP stop complaining,
      which removes the only thing it was doing. Assuming a framework makes XSS
      impossible, then reaching for `dangerouslySetInnerHTML` on the one field that
      needed rich text. And treating a CORS failure as a client bug to work around
      with a proxy, instead of a server that has not opted in.

      **What you can do after this:** audit a page for XSS sinks, ship a
      nonce-based CSP in report-only mode and read its violation reports, and
      explain why a CORS error is not a server refusal.
