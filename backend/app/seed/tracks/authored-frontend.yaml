  - slug: frontend-auth-strategies
    name: 'Authentication in the Browser: Sessions, Tokens and OAuth'
    domain: frontend
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - frontend-internet
      - frontend-data-fetching
    summary: |-
      Decide where a credential lives in the browser and why. You will compare
      server sessions with JWTs, set cookie attributes deliberately, implement the
      authorisation code flow with PKCE, and stop treating client-side route guards
      as security.
    content_md: |-
      Authentication is where frontend decisions stop being ergonomic preferences
      and become security decisions. Where you put a credential determines what an
      attacker gets when something *else* goes wrong — one stored-XSS bug in a
      marketing widget, one leaky log, one shared subdomain.

      Separate three ideas first. Authentication asks who the caller is.
      Authorisation asks what that caller may do. Identity is the profile you show
      in the corner of the page. Different tokens answer them, enforced in different
      places, and conflating them is how you end up trusting a display name for
      access control.

      ### Sessions versus tokens

      A server session is an opaque random id in a cookie, with the state in a
      server store. It is trivially revocable — delete the row and the session is
      gone — at the cost of a lookup per request.

      A JWT is the opposite trade: a signed set of claims the server can verify
      without shared state, and the consequences are structural. The payload is
      base64url, not encrypted, so anyone holding it can read it; never put anything
      secret in there. And you cannot un-issue one. Until `exp` passes, that token
      is valid, so "log out everywhere" needs a denylist — which quietly
      reintroduces the state you avoided. The usual resolution is a short-lived
      access token plus a longer-lived refresh token that *is* tracked server-side.

      ### Cookies are the actual mechanism

      Attributes are not decoration; they are the security model.

      ```http
      Set-Cookie: __Host-sid=...; HttpOnly; Secure; SameSite=Lax; Path=/
      ```

      `HttpOnly` hides the value from `document.cookie`, so injected script cannot
      exfiltrate it. `Secure` restricts it to HTTPS. `SameSite=Lax` withholds the
      cookie on cross-site subrequests but still sends it on top-level navigations;
      `Strict` withholds it even then (so a link from an email lands you logged
      out); `None` sends it everywhere and requires `Secure`. `Domain` widens the
      cookie to subdomains, which is exactly how a compromised
      `blog.example.com` steals your app's session. The `__Host-` prefix forbids
      that: the browser only accepts it with `Secure`, `Path=/` and no `Domain`.

      This is why storing an access token in `localStorage` is a poor default: any
      script on your origin — yours, a dependency, a tag manager — can read it. An
      `HttpOnly` cookie plus CSRF protection is normally stronger, because XSS must
      then *use* the session in the page rather than take it away.

      ### OAuth and OpenID Connect

      OAuth 2.0 is a delegated *authorisation* protocol: it lets your app act on a
      resource with the user's consent. OpenID Connect is the identity layer on top,
      and its ID token says who signed in. Using a raw access token as proof of
      identity is a known error.

      For a browser, exactly one flow is correct: authorisation code with PKCE. You
      generate a random `code_verifier`, send its SHA-256 hash as
      `code_challenge`, and redeem the returned code with the verifier — so an
      intercepted code is useless to anyone else. The implicit flow, which returned
      tokens in the URL fragment, is dead; do not revive it. Send and verify `state`
      to bind the response to your request (this is the CSRF defence for the flow),
      and `nonce` to bind the ID token to it. Redirect URIs are exact-matched by the
      server. Refresh tokens in a browser should rotate:
      each use issues a new one, and reuse of an old one invalidates the family.

      Then think about time. Idle timeout and absolute timeout are different
      controls. Logout must invalidate server-side, not merely clear local state,
      and a `BroadcastChannel` or `storage` event keeps other tabs from acting as
      though they are still signed in. Passkeys and WebAuthn — a key pair bound to
      the origin, unphishable by construction — are where this is heading, with MFA
      as the interim.

      ### Mistakes people actually make

      Decoding a JWT in the browser and trusting `role: "admin"` to gate a call: the
      payload is attacker-editable input until a server verifies the signature.
      Putting a token in a URL, where it lands in history, `Referer` headers and
      server logs. Treating a `<ProtectedRoute>` component as the defence — it hides
      a screen, while the API still answers anyone who calls it directly; client
      guards are UX, the server re-authorises every request. And skipping `state`
      validation, which leaves you open to having someone else's account silently
      linked to your session.

      **What you can do after this:** implement a PKCE login end to end, say
      precisely what an attacker gains from an XSS bug under your storage choice,
      and write a `Set-Cookie` header you can defend attribute by attribute.
    resources:
      - kind: doc
        title: 'MDN: Using HTTP cookies'
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies
      - kind: doc
