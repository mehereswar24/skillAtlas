  - slug: frontend-state-management
    name: 'State Management: Server State, Client State and the URL'
    domain: frontend
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - frontend-learn-the-basics
      - frontend-learn-a-framework
    summary: Classify application state by ownership — server cache, client UI, form, URL, session — give each kind its correct home, and choose between local state, context and an external store on evidence rather than habit.
    content_md: |-
      Most state management advice starts with a library, which is why most state
      management is wrong. The useful first move is not choosing between Redux and
      Zustand; it is noticing that the word "state" covers five different things
      with five different correct homes, and that once you classify them the library
      question mostly answers itself.

      ### Classify first, because the classification is the answer

      **Server cache state** is data you do not own: rows fetched from an API. You
      hold a copy, it can go stale, and the truth lives elsewhere. It needs
      invalidation, revalidation and a staleness policy — not a reducer.

      **Client UI state** is ephemeral and locally owned: a dropdown's open flag, the
      selected tab, a hover index. It belongs in the component that renders it.

      **Form state** is draft data with its own lifecycle: touched, dirty, valid,
      submitting. Draft values are not application state until submitted.

      **URL state** is anything a user should be able to bookmark, share or reach
      with the back button: filters, sort order, page number, the currently open
      record. The URL is a real state store with free persistence and free history.
      If reloading loses it and the user is annoyed, it belonged in the URL.

      **Session and auth state** is cross-cutting, mostly read-only, changes rarely.

      ### The escalation ladder

      Start with local state in the component that needs it. When a sibling needs the
      same value, lift it to the nearest common parent. When lifting produces a chain
      of pass-through props, use context or provide/inject — but pass a stable value,
      because in React every consumer re-renders when the provider's value changes.
      Only when state is genuinely global, updates frequently, and has many
      independent readers should you reach for an external store. Each rung costs
      indirection; do not skip to the top by default.

      ### Store models compared

      **Redux Toolkit** keeps one immutable tree, updated by dispatched actions and
      reducers, with excellent devtools — time-travel and a replayable action log are
      genuinely valuable in complex domains. The cost is ceremony.

      **Zustand** is a small store you read through selectors, so a component
      re-renders only when its slice changes. Minimal API, no provider required.

      **Atoms** (Jotai, Recoil-style) invert the model: many tiny independent pieces
      of state that compose into derived atoms. Granularity is the point.

      **Pinia** is Vue's answer: typed stores with state, getters and actions.

      **XState** is for flows that are genuinely stateful — checkout, onboarding,
      a multi-step upload — where a statechart makes impossible transitions
      unrepresentable instead of relying on four booleans nobody can keep consistent.

      ### Selectors, normalisation and persistence

      Re-render granularity comes from selectors: subscribe to `state.user.name`, not
      to `state`. Return primitives or memoised slices, since a selector that builds
      a new object every call defeats the equality check and re-renders every time.

      **Normalise** entities: store each record once, keyed by id, and reference it
      by id elsewhere. Store the same user in `currentUser`, in a list and in a
      detail view and you have three copies that drift after the next update.

      Immutable updates give you cheap change detection through **structural
      sharing** — unchanged subtrees keep their identity, so a reference comparison
      is enough. Persistence to `localStorage` is easy and its failure mode is
      hydration mismatch: the server renders one thing, the client rehydrates
      another, and the framework complains or flashes. Read persisted state after
      mount, or make the mismatch impossible.

      ### The mistakes people actually make

      Putting fetched server data in Redux and hand-writing cache invalidation — you
      have rebuilt a query cache badly, and every new endpoint costs an action, a
      reducer and a stale-data bug. Global state for a value one component uses,
      which makes it impossible to unmount cleanly. Filters and pagination kept in
      memory, so a refresh or a shared link loses them and users learn not to trust
      the back button. One store so large that any update notifies every subscriber
      and the whole app re-renders on a keystroke.

      **What you can do after this:** take a feature spec, list its state, assign
      each item to server cache, component, form, URL or store, and justify each
      placement in one sentence.
    resources:
      - kind: doc
        title: 'React: Managing State'
        url: https://react.dev/learn/managing-state
