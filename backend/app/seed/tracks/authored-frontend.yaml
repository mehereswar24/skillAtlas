  - slug: frontend-async-javascript
    name: Asynchronous JavaScript and the Event Loop
    domain: frontend
    est_hours: 12
    difficulty: intermediate
    prerequisites:
      - frontend-javascript
    summary: |-
      Predict the exact order in which asynchronous work runs, write promise and
      async code that parallelises when it can, and cancel stale requests so a slow
      old response can never overwrite a fresh one.
    content_md: |-
      Most people learn `async`/`await` as a spelling rule: put `await` in front of things that take time. That works until something goes wrong — a frozen UI, a spinner that never stops, a search box flashing results from two keystrokes ago. The fix is an explicit model of the event loop.

      JavaScript in a page runs on one thread: it runs a task to completion, drains a queue of microtasks, may render, then picks up the next task. Every asynchronous behaviour you have seen falls out of that sentence.

      ### The loop: tasks, microtasks and rendering

      A *task* (or macrotask) is one unit the loop picks up: a `setTimeout` callback firing, a dispatched event, a parsed script. After each task the engine drains the *microtask queue* completely — and microtasks queued during that drain are also run, so an infinite microtask chain starves the page forever.

      `Promise.then` callbacks, `await` resumptions and `queueMicrotask` go on the microtask queue. `setTimeout(fn, 0)` queues a task, so it runs *after* all pending microtasks and after at least the clamped minimum delay. `requestAnimationFrame` callbacks run just before the browser paints, which is why animation work belongs there and nowhere else.

      ```js
      console.log("A");
      setTimeout(() => console.log("D"));
      Promise.resolve().then(() => console.log("C"));
      console.log("B");            // A B C D
      ```

      This also explains freezing. Rendering can only happen between tasks, so a synchronous loop running for 400 ms blocks input, animation and paint for 400 ms. `async` does not help; the fixes are to do less work, chunk it across tasks, or move it to a worker.

      ### Promises as state machines

      A promise is an object in one of three states: pending, then permanently either fulfilled with a value or rejected with a reason. `then`, `catch` and `finally` register callbacks and return a *new* promise, which is what makes chaining work. The flattening rule matters most: if a `then` callback returns a promise, the outer promise adopts it rather than fulfilling with a promise-of-a-promise, which is why `await` never unwraps twice.

      `async`/`await` is syntax over the same machine. An `async` function returns a promise; `await` suspends the function and schedules its continuation as a microtask when the awaited value settles. `try`/`catch` around `await` catches rejections because the rejection is re-thrown at the suspension point. A rejected promise nobody handles raises `unhandledrejection` — listen for it in production, or those failures stay invisible.

      ### Parallel versus sequential, and combinators

      `await` in a loop serialises. If the calls are independent, start them all first:

      ```js
      const results = await Promise.all(ids.map(id => load(id))); // concurrent
      ```

      `Promise.all` rejects as soon as any input rejects (the others keep running, uncancelled). `Promise.allSettled` always fulfils, with a status and value-or-reason for each — right when partial failure is acceptable. `Promise.race` settles with the first to settle either way; `Promise.any` fulfils with the first *success*, rejecting with an `AggregateError` only if all fail.

      ### Fetch, cancellation and stale responses

      `fetch` resolves as soon as response headers arrive, even for 404 or 500. It rejects only on network-level failure, so you must check `res.ok` yourself. Cancellation goes through `AbortController`: pass `controller.signal` into `fetch`, call `abort()` and the promise rejects with an `AbortError`. `AbortSignal.timeout(ms)` gives a deadline without your own timer.

      This is also the cure for out-of-order responses: keep the controller for the in-flight request and abort it when a new keystroke arrives. Without that, request 1 can land after request 2 and overwrite fresh results with stale ones.

      ### The mistakes people actually make

      - `for (const id of ids) await load(id)` when the loads are independent. Ten 200 ms calls take two seconds instead of a fifth of one.
      - Assuming a failed `fetch` throws. A 500 response fulfils normally, so the `catch` never runs and you render an error page's HTML as data.
      - Believing `setTimeout(fn, 0)` runs immediately, or before an already-queued `.then`. It never does.
      - Letting an old request win. Type "ab", then "abc"; if the "ab" response is slower it arrives last and repaints the wrong list.
      - Doing heavy computation inside an `async` function and expecting it not to block. `async` does not create a thread.

      **What you can do after this:** take a snippet mixing `setTimeout`, `Promise.then` and `await` and write down its output order before running it — and refactor a search box so stale responses are aborted, not rendered.
