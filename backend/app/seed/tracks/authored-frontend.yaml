  - slug: frontend-ssg
    name: Static Generation and Content Pipelines
    domain: frontend
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - frontend-ssr
    summary: |-
      Decide which routes can be rendered once at build time and served as plain files,
      build them from validated markdown or a CMS, and reach for incremental regeneration
      when a full rebuild becomes too slow to fix a typo.
    content_md: |-
      A page that shows the same thing to everyone does not need to be rendered on every
      request, and it does not need to be assembled on the visitor's device either. Render
      it once when you deploy, write the HTML to a file, and let a CDN serve it from an edge
      node a few milliseconds away. That is static generation, and for marketing pages,
      documentation, blogs and landing pages it is still the cheapest and fastest thing you
      can do: no server to keep warm, no database to fall over, no cold start, and a failure
      mode of "the CDN serves the last good copy".

      The interesting work is not producing files. It is knowing which routes qualify, and
      knowing what to do when the build itself becomes the bottleneck.

      ### What makes a route a static candidate

      The test is whose data the page depends on. If content changes on an editorial cadence
      — someone publishes a post, marketing edits a price table — build time is the right
      moment to render. If it changes per user or per request, it is not. A prerendered file
      cannot read a cookie, cannot see an `Authorization` header, and cannot vary its body by
      session, because it was written before any request existed. Personalised fragments have
      to arrive later: a client-side fetch after hydration, an edge function that rewrites the
      response, or a server-rendered route instead.

      Most real sites are hybrids. `/`, `/pricing`, `/blog/*` and `/docs/*` are prerendered;
      `/app/*` is server-rendered behind auth. Every current framework lets you choose per
      route rather than per project — Astro marks pages for on-demand rendering, SvelteKit has
      the `prerender` page option, Next.js decides per route segment.

      ### The build-time wall

      Build time scales with page count. Five hundred pages cost seconds. Two hundred thousand
      pages cost about an hour, because each one runs a render, often a data fetch, and an HTML
      write. When a build takes an hour, correcting a one-word typo means waiting an hour, which
      is how content teams come to hate the stack.

      The escape hatch is incremental static regeneration: a page is generated on first request
      and then cached as though it were static, with a revalidation window. On-demand
      revalidation goes further — a webhook from the CMS invalidates exactly the paths that
      changed when an editor hits publish, so a fix costs one render rather than a full build.
      At the CDN the same idea appears as `stale-while-revalidate`: serve the cached copy
      immediately and refresh it in the background, so no user ever waits for the regeneration.

      ### Content as a typed source

      Content comes from markdown or MDX with YAML frontmatter, from a headless CMS over its
      API, or from a database queried once at build. In all three cases it is untyped by
      default, and a missing `title` or a date written `2026-13-01` produces a broken page in
      silence. Content collections fix this by validating every entry against a schema:

      ```js
      const blog = defineCollection({
        schema: z.object({
          title: z.string(),
          publishedAt: z.coerce.date(),
          draft: z.boolean().default(false),
        }),
      });
      ```

      A typo now fails the build with a filename and a field name attached, which is where you
      want to find it.

      ### What else belongs in the build

      Build time is when you resize and re-encode images into modern formats with intrinsic
      `width` and `height` so nothing shifts, when you generate `sitemap.xml` and an RSS feed
      from the same collection you rendered from, and when you precompute a search index.
      Editors also need a preview mode: a route that renders draft content on demand behind a
      signed cookie, because the published build by definition does not contain it.

      ### Mistakes people actually make

      - Treating the build as atomic. If the only publish path is "rebuild everything", the site
        becomes unmaintainable past a few thousand pages. Decide the incremental story before the
        page count grows.
      - Prerendering auth-gated or personalised content. Either one user's data is baked into a
        file everyone receives, or the page flashes generic content and rewrites itself.
      - Expecting a prerendered route to read a cookie or a query parameter on the server.
      - Skipping frontmatter validation, then shipping a post with an empty `<title>`.
      - Forgetting the CDN caches mistakes too: shipping a wrong page also means purging it.

      **What you can do after this:** take a mixed site, label every route as prerendered,
      incrementally regenerated or server-rendered with a defensible reason, and wire a CMS
      publish webhook that revalidates only the affected paths.
