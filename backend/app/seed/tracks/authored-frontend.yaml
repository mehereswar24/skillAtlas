  - slug: frontend-accessibility
    name: Accessibility from the First Element
    domain: frontend
    est_hours: 12
    difficulty: beginner
    prerequisites:
      - frontend-html
    summary: |-
      Build interfaces that are operable by keyboard and legible to assistive
      technology as a consequence of correct markup, and verify that claim yourself
      with a keyboard pass, a screen reader and a scanner.
    content_md: |-
      Accessibility is placed here, before you have written a line of CSS, on purpose.
      Treated as a late audit it becomes a list of defects to retrofit, and retrofits
      are expensive because the structural decisions have already hardened. Treated as
      a property of your markup, most of it is already done by the previous concept.
      An accessible interface is simply a *correctly described* interface, and the
      same discipline that lets a screen reader announce a control is what makes that
      control testable and keyboard-operable.

      ### The accessibility tree

      Alongside the DOM, the browser builds an accessibility tree. Each node carries a
      **role** (button, link, heading, textbox), an **accessible name**, a
      **description**, and **states** (disabled, expanded, checked).
      Assistive technology reads that tree via platform APIs; it does not read your
      CSS or your class names.

      Native elements populate those fields for free. A `<button>` is `role=button`,
      focusable, activated by Enter and Space, and reports its disabled state. Inspect
      the tree in the Accessibility panel of DevTools — if a control shows an empty
      name, it is unusable by voice control, whatever it looks like.

      ### POUR and what conformance means

      WCAG organises requirements under four principles: content must be
      **Perceivable**, **Operable**, **Understandable** and **Robust**. WCAG 2.2 is
      the current recommendation. Success criteria are graded A, AA and AAA; AA is the
      level referenced by most laws and procurement policies, and conformance is per
      *page* and all-or-nothing.

      ### Keyboard operability and focus

      Everything you can do with a pointer must be doable from the keyboard. Tab moves
      between focusable elements in DOM order; Enter activates links and buttons;
      Space activates buttons and toggles; arrow keys move within composite widgets
      such as radio groups and tabs.

      `tabindex` has three sensible uses. `tabindex="0"` puts a custom control into
      the natural tab order. `tabindex="-1"` makes an element focusable only by
      script, used to move focus to a dialog or an error summary. Any
      positive value jumps the element ahead of the whole document — never use it.

      Focus must be *visible*. Do not write `outline: none` without an alternative;
      style `:focus-visible`, which rings keyboard users but not every mouse click.

      ### Contrast, names and ARIA

      Contrast ratio compares relative luminance: `(L1 + 0.05) / (L2 + 0.05)`, where
      `L1` is the lighter colour. WCAG 2.2 AA requires **4.5:1** for normal text and
      **3:1** for large text (roughly 24px, or 18.66px bold) and for the visual
      boundaries of UI components.

      The accessible name is computed by a defined algorithm with a priority order:
      `aria-labelledby` wins, then `aria-label`, then native sources such as a
      `<label>`, then the element's own text. This is why `aria-label` on a button
      that already says "Save" is dangerous — voice-control users say what they see,
      and the visible text no longer matches the name.

      The five rules of ARIA, in short: prefer a native element; do not change native
      semantics; every ARIA control must be keyboard-operable; do not put
      `role="presentation"` or `aria-hidden="true"` on a focusable element; and every
      interactive element needs an accessible name. The first rule matters most —
      ARIA changes only how an element is *described*, never how it *behaves*.

      Use `aria-live="polite"` on a container that will receive asynchronous messages
      so updates are announced, and respect `prefers-reduced-motion` for anything that
      moves.

      ### How to actually test

      Three passes. Unplug the mouse: reach every control, see where
      focus is at all times, and confirm nothing traps you. Run a scanner such as axe
      or Lighthouse. Then try a real screen reader — NVDA with Firefox on Windows,
      VoiceOver with Safari on macOS — on a form and a menu.

      ### The mistakes people actually make

      Adding `role="button"` to a `<div>` and considering it fixed. The role changes
      the announcement only: the element is still not focusable and still does nothing
      on Enter or Space, so you have made it *worse* by promising a button.

      Putting `aria-label="Submit form"` on a button labelled "Send". The name now
      overrides the visible text, so a voice-control user saying "click Send" fails.

      Deleting focus outlines because the designer disliked them, which makes the
      interface unusable for anyone navigating by keyboard.

      Trusting an automated scanner as a pass. Scanners reliably catch contrast,
      missing alt and missing names — a minority of criteria. Focus order and
      meaningful alt text need a human.

      **What you can do after this:** run a keyboard-only pass and a screen-reader
      pass over a component you built, and state which WCAG 2.2 AA criterion each
      defect you find violates.
