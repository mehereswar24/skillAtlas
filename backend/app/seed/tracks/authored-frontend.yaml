  - slug: frontend-performance
    name: 'Performance: Measure, Then Fix'
    domain: frontend
    est_hours: 16
    difficulty: advanced
    prerequisites:
      - frontend-devtools-debugging
      - frontend-css-layout
      - frontend-async-javascript
    summary: |-
      Diagnose slowness with evidence instead of intuition. You will read a
      performance trace, attribute LCP, INP and CLS to specific causes, cut
      JavaScript and image cost on the critical path, and defend the result with a
      budget in CI.
    content_md: |-
      Optimisation without a measurement is guessing, and guessing is expensive:
      you will spend a week memoising components while a 900 KB font subset and a
      third-party tag sit untouched on the critical path. The discipline is always
      the same. Reproduce on a representative device, record a trace, name the
      bottleneck, change one thing, measure again.

      It also matters *which* number you chase. A metric that no user experiences is
      not a goal, and a fast laptop on office fibre is not your median user.

      ### The rendering pipeline and the frame budget

      A browser turns a change into pixels in stages: JavaScript, style calculation,
      layout, paint, composite. Where your change enters decides its cost. Animating
      `left` or `width` forces layout for every frame, and layout is proportional to
      the tree it dirties. Animating `transform` or `opacity` skips layout and paint
      entirely and is handled by the compositor, often off the main thread.

      On a 60 Hz display you get about 16 ms per frame, and the browser needs some
      of that. Anything that occupies the main thread for more than 50 ms is a long
      task, and during it nothing else happens — no click handler, no scroll
      response, no paint. Nearly all "the UI feels janky" complaints are long tasks
      plus forced synchronous layout, where reading `offsetHeight` after a write
      makes the browser recompute layout mid-loop.

      ### The metrics that describe the user's experience

      Core Web Vitals exist to make that experience measurable. LCP is when the
      largest text block or image in the viewport renders; the diagnosis breaks into
      four parts — time to first byte, resource load delay, resource load duration,
      and element render delay — and the split tells you whether the problem is your
      server, your discovery order, the byte size, or blocking JavaScript. INP
      replaced FID and measures the full latency of interactions across the visit:
      input delay (usually the main thread being busy), processing time, and
      presentation delay. CLS measures unexpected layout movement, and it is nearly
      always images without width and height, banners injected above content, or a
      late font swap with mismatched metrics.

      Lab data (a Lighthouse run, a DevTools trace) is reproducible and lets you
      attribute causes; field data (your own RUM, or CrUX) is what users actually
      got, on their devices and networks. Optimising only in the lab is how a site
      scores 98 and still feels slow.

      ### The critical rendering path

      CSS is render-blocking by design — the browser will not paint unstyled content
      — so keep the first stylesheet small and load the rest asynchronously. A plain
      `<script>` in `<head>` blocks parsing; `defer` and `type="module"` run after
      parsing in order, `async` runs whenever it arrives. Use `preload` and
      `preconnect` sparingly and only for resources you can prove are discovered
      late; over-preloading just reorders contention. Self-host fonts, subset them,
      and use `font-display: swap` (or `optional`) so text is never invisible while
      a font downloads.

      ### JavaScript, images and lists

      JavaScript costs more than its transfer size: it must be parsed, compiled and
      executed, and on a mid-range phone that is where the seconds go. Split by
      route, lazy-load what is below the fold or behind an interaction, and audit
      dependencies — the cheapest optimisation is not shipping the code. Hydration
      is main-thread work too, and it competes directly with INP.

      For images, choose a modern format, serve responsive `srcset` sizes, mark the
      hero with `fetchpriority="high"`, and lazy-load only what is below the fold.
      For long lists, virtualise so the DOM holds what is visible, or let
      `content-visibility: auto` skip rendering work for off-screen sections. Behind
      all of it, cache aggressively with immutable hashed filenames on a CDN, and
      put a size budget in CI so a regression fails a pull request rather than
      surfacing in next quarter's field data. Watch for memory leaks too: detached
      DOM nodes retained by a listener or closure show up as a heap that only grows.

      ### Mistakes people actually make

      Adding `will-change` everywhere, which promotes layers, consumes GPU memory
      and can make things slower. Lazy-loading the LCP image, which delays the one
      resource that defines the metric. Testing only on a fast laptop, so nothing
      ever reproduces. And chasing a Lighthouse score while field INP stays bad,
      because the score does not include real interactions.

      **What you can do after this:** read a performance trace, point at the
      function causing a long task, and say whether your LCP problem is server time,
      discovery, transfer or render blocking.
