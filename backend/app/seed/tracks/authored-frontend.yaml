  - slug: frontend-react
    name: React in Depth
    domain: frontend
    est_hours: 24
    difficulty: intermediate
    prerequisites:
      - frontend-learn-the-basics
      - frontend-type-checkers
    summary: Understand React by its mechanisms — the render/commit split, state as a queue, positional hooks, effects as synchronisation, and the Server/Client Component boundary — so you can debug behaviour instead of pattern-matching tutorials.
    content_md: |-
      Most React problems are not syntax problems. They are model problems: someone
      believes state updates immediately, or that an effect is "code that runs after
      render", or that `useMemo` makes things faster. Learn the mechanism and those
      bugs stop being mysterious.

      ### Elements, components, and the render/commit split

      JSX compiles to function calls that return plain objects. `<Row id={3} />`
      becomes a call producing `{type: Row, props: {id: 3}}` — a description, not a
      thing on screen. A **component** is the function; an **element** is the
      description it returns; the **instance** is what React keeps internally at that
      position in the tree.

      Rendering is React calling your component functions to get elements; it must be
      pure. Committing is React applying the resulting DOM changes. Anything touching
      the outside world belongs after the commit, never during render.

      ### State is a queue, and updates are batched

      `setCount` does not assign a variable. It enqueues an update and schedules a
      re-render; `count` in the current function stays the value it was rendered
      with. Multiple updates in one event are batched into a single render.

      ```jsx
      setCount(count + 1);
      setCount(count + 1); // still +1 total: both read the same stale `count`
      setCount(c => c + 1);
      setCount(c => c + 1); // +2: updater functions see the queued value
      ```

      Use the updater form whenever the next value depends on the previous one. Treat
      state as immutable: replace objects and arrays rather than mutating them, or
      React compares the same reference and skips the render.

      ### Hooks are positional, which explains every rule

      React stores hook state in an ordered list per component instance and matches
      calls to slots by call order. That is the entire reason for the Rules of Hooks:
      call them at the top level, unconditionally, in the same order every render. An
      `if` around a `useState` shifts every later hook by one slot and hands your
      effect somebody else's state.

      `useState` covers independent values; reach for `useReducer` when several
      fields must change together in response to one event, because a reducer puts
      the transition logic in one testable function.

      ### Effects synchronise with external systems

      `useEffect` is not "run after render". It is: keep this external system in sync
      with this state, and here is how to undo it. Subscriptions, timers, non-React
      widgets, browser APIs. The cleanup you return must fully reverse the setup —
      which is why StrictMode deliberately mounts, unmounts and remounts in
      development. A "bug" that appears only under StrictMode is a missing cleanup.

      Most effects you write are unnecessary. Derive values during render instead of
      storing them from an effect; respond to user actions in the event handler,
      where you know what happened; reset a child's state with a new `key` rather
      than watching a prop and calling `setState`.

      `useRef` holds a mutable value across renders without triggering one — a DOM
      node, a timer id, a previous value. Context is dependency injection for the
      tree; note that every consumer re-renders when the provider's value changes, so
      do not put fast-changing state in a context that wraps the whole app.

      ### Memoisation, concurrency, and the server boundary

      `memo`, `useMemo` and `useCallback` preserve referential stability and skip
      work. The React Compiler changes this calculus: it inserts equivalent
      memoisation automatically, so hand-written memo calls are mostly redundant in
      compiled codebases. Measure before adding them either way.

      `useSyncExternalStore` connects an outside store to React safely. Suspense lets
      a component declare it is not ready and render a fallback; error boundaries
      catch render-time throws. `startTransition` and `useDeferredValue` mark updates
      interruptible, so typing stays responsive while an expensive list re-renders.

      **Server Components** run only on the server, never ship their code to the
      browser, and can await data directly. **Client Components** (`'use client'`)
      ship and hydrate. Between them is a serialisation boundary: props crossing it
      must be serialisable, so you can pass data and JSX children but not functions,
      class instances or event handlers.

      ### The mistakes people actually make

      Deriving state in an effect — render, effect, `setState`, render again — which
      the user sees as a visible flash. Silencing the exhaustive-deps lint rule
      instead of fixing the stale closure it found. Mutating `state.items.push(x)`
      and wondering why nothing updated. Index keys on a reorderable list. Sprinkling
      `useMemo` everywhere, adding cost to solve a problem nobody measured.

      **What you can do after this:** look at a component that flashes or renders
      twice and say precisely which of stale closure, unnecessary effect, unstable
      dependency or missing key is responsible.
    resources:
