  - slug: frontend-type-checkers
    name: TypeScript and Types at the Boundaries
    domain: frontend
    est_hours: 16
    difficulty: intermediate
    prerequisites:
      - frontend-javascript
    summary: |-
      Model real data with structural types, unions and generics, turn on the strict
      flags that actually catch bugs, and validate every piece of external data at the
      boundary — because types vanish the moment your code runs.
    content_md: |-
      TypeScript sits before any framework on purpose. Framework tutorials teach it as decoration — annotate the props, satisfy the red squiggle, move on — which produces codebases full of confident annotations describing data that is not shaped that way. Learn the type system on its own and framework typing is trivial.

      The most important fact is that TypeScript erases entirely: nothing in a type position exists at runtime — no cast, no validation, no check. A type is a claim the compiler verifies *about your own code*, and it verifies nothing about data arriving from outside.

      ### Structural typing and inference

      TypeScript compares types by shape, not by name. A value is assignable to `{ id: number }` if it has a numeric `id`, whatever interface or class it came from — the opposite of Java's nominal typing, and why two identical interfaces declared separately are interchangeable.

      Inference does most of the work. Annotate parameters and public boundaries; let return types, locals and generic arguments be inferred. Over-annotating throws information away: `const dir: string = "left"` is weaker than the inferred `"left"`.

      ### Unions, narrowing and the top/bottom types

      A union `A | B` says "one of these": you may only use members common to all branches until you *narrow*. Control-flow analysis narrows on `typeof`, `instanceof`, `in`, truthiness and equality. A discriminated union — a shared literal field on every member — is the workhorse:

      ```ts
      type Result =
        | { status: "ok"; data: User }
        | { status: "error"; message: string };

      if (r.status === "ok") r.data; else r.message;  // each branch narrowed
      ```

      `any` disables checking and spreads: anything touching an `any` becomes `any`, so one careless annotation disarms a whole module. `unknown` is the safe top type: hold anything, but narrow before use — exactly right for parsed JSON. `never` is the empty type; narrowing to `never` in a `default` branch turns a newly added union member into a compile error.

      ### Generics, readonly, and the config that matters

      Generics let a function relate its input and output types: `function first<T>(xs: readonly T[]): T | undefined`. Constrain with `extends` when you need a property (`<T extends { id: string }>`). The `readonly` array stops the function mutating the caller's data at no runtime cost. Utility types (`Partial`, `Pick`, `Omit`, `Record`, `ReturnType`) derive shapes from one authoritative source, and `.d.ts` files type JavaScript that has none — what `@types/*` packages ship.

      Turn on `strict`. Within it, `strictNullChecks` finds the real bugs by separating `T` from `T | null | undefined`. Add `noUncheckedIndexedAccess`: without it `arr[999]` is typed `T` and lies; with it, indexing yields `T | undefined` and you must handle the miss. Two smaller tools: `as const` freezes a literal into its narrowest type, so `{ dir: "left" }` is not widened to `string`; `satisfies` type-checks a value *without* widening it, keeping the precise inferred shape.

      ### The boundary is where types stop being true

      Because types erase, every value entering from outside is really `unknown`, whatever you annotated. `await res.json()` is `any`; `localStorage.getItem` returns a `string | null` that may parse to anything; URL params, form input and `postMessage` payloads are all unverified.

      Validate at the boundary once, then let inference carry the result inward. A schema library (Zod, Valibot, or anything implementing Standard Schema) gives a parser and a derived static type from one declaration, so type and runtime check cannot drift apart. Hand-written guards (`function isUser(v: unknown): v is User`) suit a handful of shapes — but a predicate's body is unchecked, so a wrong guard lies with the compiler's blessing.

      ### The mistakes people actually make

      - Silencing an error with `as`. `data as User` overrules the compiler; if the field is missing you get `undefined` and a crash three files away.
      - Writing `const user: User = await res.json()` and believing it. The server renamed `name` to `full_name` last sprint; TypeScript never checked and never will.
      - Letting one `any` in a shared helper propagate until half the call graph is unchecked while still looking typed.
      - Reaching for `enum` out of habit. A union of string literals is simpler, erases fully and narrows better.
      - Treating `strictNullChecks: false` as a reasonable migration state. It is the flag that removes most of the value.

      **What you can do after this:** turn an untyped `fetch` response into a validated, narrowed value — one schema, parsed at the boundary, with the static type derived from it rather than asserted over it.
