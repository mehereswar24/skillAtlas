  - slug: frontend-ssr
    name: 'Rendering Strategies: CSR, SSR, Streaming and Islands'
    domain: frontend
    est_hours: 12
    difficulty: advanced
    prerequisites:
      - frontend-learn-a-framework
      - frontend-performance
    summary: |-
      Pick a rendering strategy per route and justify it. You will explain what
      hydration costs, use streaming and Suspense boundaries, compare islands,
      resumability and server components, and debug hydration mismatches instead of
      suppressing them.
    content_md: |-
      Rendering strategy is not a fashion choice between acronyms. It is a trade
      between four quantities: how soon content appears, how soon the page responds
      to input, how much work your servers do per request, and how stale the data is
      allowed to be. No option below improves all four.

      Hold one distinction throughout: producing HTML and making it interactive are
      separate problems with separate costs. Most confusion here comes from treating
      them as one.

      ### Client-side rendering

      The server sends a near-empty shell and a script tag. The browser downloads,
      parses and executes the bundle, then the app fetches data and renders. Content
      waits on the full JavaScript round trip, which is why CSR gives poor LCP on
      slow devices even when the code is fine. In exchange it is the cheapest thing
      to host — static files on a CDN — and the simplest model. For an
      authenticated tool whose first paint is a loading state anyway, that is often
      the right answer.

      ### Server-side rendering and what hydration costs

      With SSR the server renders the component tree to HTML and the first response
      already contains content, which helps LCP and gives crawlers something without
      executing script. But the work moved, it did not vanish: your TTFB now
      includes your data layer, and every request costs CPU.

      Then hydration happens. The browser downloads the component tree it just
      received as HTML, executes it to rebuild the framework's internal state, and
      attaches event listeners. Until that finishes, the page looks ready and is
      not — the classic SSR failure mode of fast HTML and slow interactivity, and a
      direct contributor to bad INP. SSR does not improve responsiveness by itself,
      and can worsen it by showing an interactive-looking page before it
      truly is.

      ### The mitigations

      Streaming SSR sends HTML in chunks as it is produced. You wrap slow subtrees
      in Suspense boundaries, the server flushes the shell immediately with
      placeholders, and each boundary's HTML is flushed as its data resolves — out
      of order, with a small inline script slotting it into place. First content
      stops waiting on your slowest query.

      Progressive and selective hydration let the framework hydrate boundaries
      independently and prioritise the one the user just clicked, rather than
      requiring the whole tree first.

      Islands architecture (Astro is the clearest example) inverts the default: the
      page is static HTML, and only the components you explicitly mark as
      interactive ship JavaScript — most pages ship none. It suits content-heavy
      sites, not an application that is interactive everywhere.

      Resumability (Qwik) is a different answer entirely: instead of re-executing to
      rebuild state, it serialises the application state and listener locations into
      the HTML and resumes from there, downloading code only when an event actually
      fires.

      React Server Components move the boundary again. They run only on the server,
      never ship their code, and serialise their rendered output into a stream the
      client merges with its interactive components. Data access sits next to the
      component that needs it while the component model stays intact — but a server
      component cannot use state or effects, and the boundary between the two kinds
      is something you must design.

      ### Mismatches and choosing per route

      Hydration assumes the client's first render matches the server's HTML. It
      breaks with `Date.now()`, `Math.random()`, anything reading `window` or
      `localStorage`, and locale or time-zone formatting that differs between the
      two machines. Render such values after mount, or pass the server's value down
      explicitly.

      On SEO: major crawlers execute JavaScript in 2026, but rendering is queued and
      unreliable at scale, so HTML in the first response is still safer for content
      you need indexed — and irrelevant behind a login.

      The real answer is per route: a marketing page static or islands, a product
      listing streamed SSR, a dashboard behind authentication plain CSR. Modern
      frameworks let you choose per route, so do.

      ### Mistakes people actually make

      Server-rendering a logged-in dashboard, paying server CPU and TTFB for content
      no crawler sees and no user reaches without a session. Ignoring hydration
      mismatch warnings until the UI silently diverges from the HTML. Papering over
      server/client differences with a `useEffect` that re-renders everything after
      mount, which costs a layout shift and defeats the point. And assuming SSR
      improves INP, when the interactivity cost is unchanged.

      **What you can do after this:** choose a rendering strategy per route,
      explain in one sentence what hydration is doing to your main thread, and place
      Suspense boundaries so a slow query stops holding up first paint.
