  - slug: frontend-implementing-ai
    name: Building AI Features into a Front End
    domain: frontend
    est_hours: 12
    difficulty: advanced
    prerequisites:
      - frontend-data-fetching
      - frontend-async-javascript
      - frontend-ai-in-development
    summary: |-
      Ship a model-backed feature properly: proxy the API through your own server,
      stream and cancel responses, validate structured output, handle rate limits and
      cost, and present generated content accessibly and with honest confidence.
    content_md: |-
      The previous concepts treated the model as a tool you use. This one flips it: you are shipping the feature, and users will judge it. Few of the hard problems turn out to be about the model — they are streaming, cancellation, error states, cost, accessibility and trust, which are frontend problems in new clothes.

      Start with the non-negotiable. **Never call a model provider's API directly from the browser.** Any key in client code is public — bundle, DevTools, network tab. Every request goes through a route on your own server that holds the key, authenticates the user, rate-limits, enforces a per-user budget and logs. It also holds the system prompt, otherwise readable by anyone who opens the network panel.

      ### Streaming, and why it changes the UI

      Generation takes seconds to tens of seconds, so responses stream. Two common shapes: server-sent events, consumed with `EventSource` or plain fetch, and a chunked response body you read yourself.

      ```js
      const res = await fetch("/api/chat", { method: "POST", body, signal });
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        setText((t) => t + value);
      }
      ```

      Two details bite immediately. Chunks split arbitrarily, including mid-character in multi-byte UTF-8, which is why you decode with a streaming decoder. And incrementally rendered markdown is frequently invalid — an unclosed fence, half a link, an open bold marker — so use a tolerant renderer or hold back the trailing incomplete block.

      Cancellation is not optional: wire an `AbortController` to a stop button and to route change or unmount, or a user who navigates away leaves a request running that you are still paying for.

      ### Latency UX and error states

      Users feel **time to first token**, not total duration: a response that begins immediately and finishes in 20 seconds feels better than one appearing whole after 8. Render the assistant turn straight away as an empty streaming bubble; a spinner in front of a long stream throws away your best asset.

      The error taxonomy is unusual and you must design for all of it: rate limiting (429, with retry-after and backoff), context-length exceeded, content filters and refusals, upstream timeouts, and a stream that dies mid-response, leaving partial text on screen where you must offer retry or continue rather than blanking it.

      Structured output needs its own defence. If you ask for JSON to drive your UI, validate every response against a schema on the server, even with a provider's schema-constrained mode on, and keep a fallback: one repair retry, then graceful degradation. Never `JSON.parse` model output straight into a render.

      ### Cost, abuse and evaluation

      Cost scales with tokens in and out, so it is a product decision. Count tokens per request, enforce per-user daily quotas server-side, cache identical requests, debounce anything triggered by typing, and cap input length so a pasted document is rejected before it is billed. Unauthenticated endpoints get scraped within days.

      To improve the feature you need evidence. Log inputs and outputs with clear consent and a retention policy, build a small regression set, and run it whenever you change the prompt or the model — otherwise every tweak is blind.

      ### Trust and accessibility

      Label generated content as generated. Show sources when you have them, clickable so a user can check. Give a visible way to reject, edit or report an answer, and do not present output with more confidence than it deserves: no invented certainty, no fake progress narration.

      For screen readers, an `aria-live` region firing on every token is unusable: it interrupts constantly and reads fragments. Announce that a response has started, then the completed response, or update at coarse intervals. Keep the stop button keyboard-reachable and focus-visible.

      ### The mistakes people actually make

      - Putting the API key in the client bundle "temporarily" and finding out from the bill.
      - A spinner for a 30-second generation, when streaming was available all along.
      - `JSON.parse` on model output with no schema validation, so one malformed response white-screens the app.
      - No `AbortController`, so navigating away leaves a paid request running and a stale update lands on an unmounted component.
      - Announcing every streamed token to a screen reader, making the feature hostile to assistive-technology users.

      **What you can do after this:** build a streaming, cancellable model-backed feature behind your own authenticated proxy, with schema-validated structured output, honest error states, and a live region a screen-reader user can tolerate.
