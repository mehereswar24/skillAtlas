  - slug: frontend-web-apis
    name: The Browser Platform Beyond the DOM
    domain: frontend
    est_hours: 12
    difficulty: intermediate
    prerequisites:
      - frontend-dom-events
      - frontend-async-javascript
    summary: |-
      Reach for built-in platform APIs — observers, the storage tiers, History,
      workers, `Intl`, canvas and dialogs — instead of installing a library, and pick
      the right one by knowing what each costs and where it runs.
    content_md: |-
      A large fraction of the JavaScript shipped to users re-implements something the browser already does, usually worse and always with more bytes. Lazy loading, infinite scroll, client routing, date formatting, off-main-thread work and modal dialogs all have platform answers. The skill is knowing which tier an API sits in, what it costs and which thread it blocks.

      ### Observers: stop polling, start subscribing

      The observer APIs replace polling loops that ran on every scroll or resize. `IntersectionObserver` reports asynchronously when an element crosses a threshold of the root's viewport — the correct basis for lazy-loading images, analytics impressions, and infinite scroll (observe a sentinel after the last row; load more when it intersects). It also underpins virtual scrolling: render only rows near the viewport, observe sentinels at each end, recycle nodes as they leave, so a 100,000-row list keeps a few dozen DOM nodes.

      `ResizeObserver` reports element size changes without a resize listener; write to an element's size inside its own callback and you get the "ResizeObserver loop completed with undelivered notifications" error, which is the browser detecting a feedback loop, not a random bug. `MutationObserver` watches DOM changes in code you do not control, and `PerformanceObserver` streams entries such as long tasks and layout shifts — how field monitoring is collected.

      All four have `disconnect()`. Call it, or the observer keeps the observed nodes alive.

      ### Storage tiers, and choosing between them

      `localStorage` and `sessionStorage` are **synchronous** string key-value stores of roughly a few megabytes. Synchronous means every read and write blocks the main thread: fine for a theme preference, wrong inside a scroll handler. `sessionStorage` is scoped to the tab; `localStorage` persists and is readable by any script on the origin, which is why session tokens do not belong there. IndexedDB is the asynchronous, transactional, structured store for real data volumes; the raw event-based API is unpleasant, so wrap it. Cache Storage holds `Request`/`Response` pairs and backs service-worker offline assets.

      ### Navigation, URLs and workers

      `history.pushState` and `popstate` are the classic client-routing primitives; the newer Navigation API (`navigation.navigate`, the `navigate` event) models intercepting a navigation directly and fits routers far better, though browser support is still uneven — check before relying on it. Either way, build and parse URLs with `URL` and `URLSearchParams` rather than string surgery; they handle encoding correctly.

      Web Workers run script on a separate thread, so CPU-heavy work stops blocking rendering. Messages are copied by structured clone, which handles `Map`, `Set`, `Date`, typed arrays and cycles but not functions or DOM nodes; for large buffers, pass *transferables* so ownership moves instead of bytes.

      ### Permissions, formatting, and rendering surfaces

      `Notification` and geolocation sit behind the permission model: a prompt requires a user gesture and a denial is sticky, so ask only when the user has just asked for the feature. Clipboard access goes through `navigator.clipboard.writeText` / `readText`, with reads gated more tightly than writes.

      `Intl` is the highest-leverage API here. `Intl.DateTimeFormat`, `Intl.NumberFormat` (currency, compact notation), `Intl.RelativeTimeFormat`, `Intl.PluralRules`, `Intl.ListFormat` and `Intl.Collator` all ship with the engine and are locale-correct in ways hand-rolled code never is.

      For drawing, `Canvas` is an immediate-mode pixel buffer — fast for thousands of moving things, but nothing in it is inspectable or accessible. SVG is retained-mode: real nodes, styleable, scriptable, accessible, and slower once node counts grow. Choose by whether you need to interact with individual shapes. `<dialog>` with `showModal()` gives a real modal with focus trapping and top-layer stacking, and the Popover API (`popover` plus `popovertarget`) gives light-dismiss overlays with no JavaScript at all.

      ### The mistakes people actually make

      - Reading `localStorage` inside a scroll or animation handler. Every read is a synchronous disk-backed call, and frames drop.
      - Storing an access token in `localStorage`, so any injected script — an XSS, a compromised dependency — can read and exfiltrate it.
      - Creating observers per render and never calling `disconnect()`, so detached nodes stay reachable and memory grows.
      - Hand-writing `` `${d.getDate()}/${d.getMonth() + 1}` `` instead of `Intl.DateTimeFormat`, then discovering the off-by-one month, the wrong locale order and no non-Gregorian calendars.
      - Assuming a worker can touch the DOM. It cannot; it has no `document`.

      **What you can do after this:** build an infinite-scrolling list with `IntersectionObserver` and no library, justify in one sentence why its data lives in IndexedDB rather than `localStorage`, and format every date and number through `Intl`.
