  - slug: frontend-mobile-apps
    name: 'Shipping to Mobile: React Native, Expo and Capacitor'
    domain: frontend
    est_hours: 12
    difficulty: advanced
    prerequisites:
      - frontend-react
    summary: |-
      Choose between a responsive web app, a PWA, a WebView wrapper and React Native for a mobile
      target, then build with Expo while respecting native layout, navigation, permissions,
      background limits and app store release rules.
    content_md: |-
      "Make it work on mobile" hides four different projects. A responsive web app reaches
      everyone instantly and cannot be installed from a store. A PWA adds offline and an install
      prompt, with weaker platform integration on iOS. A WebView wrapper (Capacitor, Ionic) puts
      your existing web app inside a native shell with plugin access to camera, filesystem and
      push — a genuine store app whose UI is still a web page. React Native renders real native
      views driven by JavaScript, and Flutter does the same with its own renderer and Dart.

      Pick by what has to feel native. If the answer is "navigation transitions, gestures, lists
      and keyboard behaviour", a WebView will disappoint you; if the answer is "it needs to be in
      the store and use the camera", it will not.

      ### React Native's architecture

      Your JavaScript runs on its own thread; the UI is composed of real platform views. In the
      old architecture the two sides communicated over an asynchronous, batched, JSON-serialised
      bridge, which is why gesture-driven animation used to stutter — every frame's response had
      to cross a queue. The New Architecture replaces it: JSI lets JavaScript hold references to
      native objects and call them synchronously, TurboModules load native modules lazily, and
      Fabric renders with a shared C++ core, so layout and animation can be driven without a
      round trip per frame.

      Because components map to native views, styling is not CSS. You get a flexbox subset with
      different defaults (`flexDirection` defaults to `column`), no cascade, no media queries, no
      percentage-of-anything shortcuts and no grid. Layout knowledge transfers; CSS knowledge
      largely does not.

      ### What changes when the target is a phone

      Navigation is a native concern: stacks with real transitions, an Android hardware back
      button and an iOS edge-swipe that users expect to work everywhere. Safe-area insets keep
      content clear of notches, dynamic islands and home indicators, and ignoring them is the
      fastest way to look like a port. The keyboard covers your inputs unless you handle
      avoidance. Permissions are OS dialogs you get one good chance to trigger, so ask in context
      after explaining why. Background execution is tightly limited by both platforms — assume
      your code stops when the app is backgrounded, and use push or a scheduled task instead of a
      timer. Push goes through APNs and FCM, so you need real device tokens and certificates.

      Performance has its own rules: use a virtualised list (`FlatList`/`FlashList`) for anything
      long, cache and correctly size images, and watch startup time, because a slow first frame is
      the review people leave.

      ### Expo, releases and OTA rules

      Expo is the practical default. The managed workflow gives you a batteries-included SDK, EAS
      Build compiles iOS and Android in the cloud so you do not need a Mac to ship, EAS Update
      delivers JavaScript-only over-the-air updates, and config plugins let you modify native
      project settings declaratively. When you need native code an ejection is no longer required
      — `prebuild` generates the native projects from your config, and you can write or install a
      native module.

      Releases are gated by human review at Apple and Google. Budget days, not minutes, keep
      build numbers monotonic, and use staged rollout so a crash reaches 1% of users first.
      Over-the-air updates are allowed for JavaScript and assets that do not change the app's
      advertised purpose; using them to add features that bypass review breaks store policy and
      risks the account.

      ### Mistakes people actually make

      - Assuming web layout knowledge transfers unchanged, then losing a day to a `View` with no
        `flex: 1` collapsing to zero height.
      - Rendering a thousand rows inside a `ScrollView`. Everything mounts at once, memory spikes
        and scrolling stutters; virtualise instead.
      - Ignoring safe-area insets, so the header sits under the notch on exactly the devices your
        reviewers use.
      - Shipping an OTA update that changes what the app does, and getting it rejected or worse.
      - Testing only on a simulator, which has no real camera, no push delivery, forgiving
        performance and no thermal limits.

      **What you can do after this:** choose the right mobile strategy for a given product and
      justify it, and build, sign and stage-roll an Expo app with native navigation, safe areas
      and virtualised lists.
