        url: https://webpack.js.org/concepts/
  - slug: frontend-linters-formatters
    name: Linting, Formatting and Enforced Standards
    domain: frontend
    est_hours: 5
    difficulty: beginner
    prerequisites:
      - frontend-package-managers
    summary: |-
      You will be able to separate formatting from linting, configure ESLint flat config
      with rules that catch real defects rather than style, and enforce both through the
      editor, a fast pre-commit hook and CI.
    content_md: |-
      Two unrelated jobs get bundled together under "code style", and conflating them wastes
      an enormous amount of team attention. Formatting decides where the bytes go: line
      breaks, quotes, trailing commas. Linting decides whether the code means something
      dangerous. Only the second one finds bugs. Once you separate them, the formatting
      argument ends and the linting configuration gets interesting.

      ### Formatting is a byte problem, so automate it away

      A formatter parses your file to an abstract syntax tree and prints it again from
      scratch, discarding your original line breaks entirely. That is why the output is
      deterministic and why a formatter cannot be "wrong" in any interesting sense. Prettier
      is the default choice; Biome's formatter is Prettier-compatible and much faster because
      it is written in Rust. Choose one, set print width and quote style, commit the config,
      reformat the whole repository in a single commit, and add that commit's SHA to
      `.git-blame-ignore-revs` so `git blame` still shows real authors. Then stop discussing it.

      ### Linting is a semantics problem

      ESLint parses to an AST — with typescript-eslint supplying the TypeScript parser — and
      runs rules that walk it. The rules that earn their runtime are the ones that describe
      defects, not taste. `@typescript-eslint/no-floating-promises` catches an async call
      whose rejection nobody handles, which is how an error silently disappears.
      `no-misused-promises` catches passing an async function where a synchronous one is
      expected. `react-hooks/exhaustive-deps` catches the stale closure that makes an effect
      read last render's value. The `no-unsafe-*` family catches values that entered your code
      as `any` and are now being trusted. `jsx-a11y` rules catch a control with no accessible
      name or a click handler bolted onto a `div`.

      Since ESLint 9 the configuration is flat config: an `eslint.config.js` exporting an
      array of objects, each with `files` globs, `plugins`, `languageOptions` and `rules`.
      Later objects override earlier ones, so a per-directory relaxation is just another entry.

      ```js
      export default [
        { files: ["**/*.ts"], rules: { "@typescript-eslint/no-floating-promises": "error" } },
        { files: ["scripts/**"], rules: { "no-console": "off" } },
      ];
      ```

      ### Type-aware linting and what it costs

      A rule that needs to know whether a value is a Promise needs the type checker, so ESLint
      asks TypeScript to build a full program. This is dramatically slower than syntax-only
      linting on a large codebase. Keep type-aware rules scoped to source files rather than
      config and scripts, use the project service so files are typed on demand, and accept
      the cost in CI even if you narrow what runs on save.

      ### Enforcement is layered

      There are four places a standard can be enforced, and you want all of them. The editor
      formats and applies fixable lint rules on save, which is where the feedback is cheapest.
      A pre-commit hook via husky and lint-staged runs only on staged files; it must stay
      fast, because a hook that takes twenty seconds trains everyone to type `--no-verify`.
      CI is the gate that actually blocks a merge: `eslint . --max-warnings=0`,
      `prettier --check .`, and `tsc --noEmit`. Warnings are not a state anyone acts on, so a
      rule should be an error or should be deleted. An `eslint-disable` belongs on one line,
      names the specific rule, and carries a reason comment; a bare file-level disable becomes
      permanent and invisible. Add Stylelint for CSS (invalid properties, duplicate selectors,
      a shorthand silently overriding a longhand) and an `.editorconfig` for indentation and
      newline handling in editors that do not run your formatter. Biome covers formatting and
      linting in one Rust binary, at the price of a much smaller plugin ecosystem; Oxlint is
      an emerging very fast linter often run alongside ESLint for its syntax-only rules.

      ### The mistakes people actually make

      Letting lint warnings accumulate until there are four thousand, at which point the
      output is scenery and a genuine new warning is invisible. Implementing formatting
      decisions as lint rules, so the linter and the formatter rewrite each other's output
      forever; `eslint-config-prettier` exists purely to switch those rules off. Building a
      pre-commit hook so slow that the team routinely bypasses it. Running `--fix` in CI,
      which commits transformations nobody reviewed. And silencing `exhaustive-deps` rather
      than understanding what it is telling you, which is almost always a real stale-value
      bug waiting to surface.

      **What you can do after this:** set up a repository where formatting is settled by a
      formatter, ESLint errors on a chosen set of defect-finding rules, and CI fails on the
      first warning.
    resources:
      - kind: doc
        title: 'ESLint: Configuration Files (flat config)'
        url: https://eslint.org/docs/latest/use/configure/configuration-files
      - kind: doc
        title: 'ESLint: Rules reference'
        url: https://eslint.org/docs/latest/rules/
      - kind: doc
        title: 'typescript-eslint: Typed Linting'
        url: https://typescript-eslint.io/getting-started/typed-linting
