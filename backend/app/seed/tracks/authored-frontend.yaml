  - slug: frontend-javascript
    name: 'JavaScript: The Language Itself'
    domain: frontend
    est_hours: 20
    difficulty: beginner
    prerequisites:
      - frontend-html
    summary: |-
      Work confidently with JavaScript as a language in its own right: values and
      reference semantics, scope and closures, `this` binding, prototypes, iterators,
      modules and errors — knowledge that transfers unchanged to Node, workers and
      build tooling, not just the browser.
    content_md: |-
      JavaScript is almost always taught through the browser, which hides where the language stops and the platform starts. `document`, `fetch`, `setTimeout` and `localStorage` are not JavaScript; they are objects a host environment hands to a JavaScript program. Blur the two and you cannot reason about the same language running in Node, in a worker or on an edge runtime.

      So this concept stops at the language boundary: values, scope, functions, objects, modules and errors. The browser arrives next.

      ### Values: primitives, objects and what a variable holds

      There are seven primitive types — `string`, `number`, `boolean`, `bigint`, `symbol`, `undefined` and `null` — and everything else is an object. A variable slot holds either a primitive directly or a *reference* to an object, and assignment copies the slot — so `const b = a` gives two names for one object: mutate through either and both see it. `const` freezes the binding, never the object.

      `==` coerces before comparing, so `"" == 0` and `null == undefined` are true while `null == 0` is false. `===` compares type and value with no conversion, which is why it is the default; the one defensible `==` is `x == null`. Treat `undefined` as "nothing was ever put here" and `null` as "deliberately empty".

      ### Scope, the temporal dead zone, and closures

      `let` and `const` are block-scoped and live in a *temporal dead zone* from the top of the block until their declaration executes; reading them there throws a `ReferenceError`. `var` is function-scoped and initialised to `undefined` on entry, so its bugs are silent.

      A closure is a function plus the variable environment it was created in — and that environment is per-binding, not per-value:

      ```js
      for (var i = 0; i < 3; i++) setTimeout(() => console.log(i)); // 3 3 3
      for (let i = 0; i < 3; i++) setTimeout(() => console.log(i)); // 0 1 2
      ```

      `var i` is one binding shared by all three closures; `let i` creates a fresh binding each iteration.

      ### Functions, `this`, and prototypes

      Functions are values. `this` is decided by the *call*, not by where the function was written: a plain call gives `undefined` in strict mode, `obj.fn()` gives `obj`, `call`/`apply`/`bind` set it explicitly, `new` sets it to the fresh object. Arrow functions have no `this` of their own and close over the enclosing one — right for callbacks, wrong for object methods.

      Every object has a hidden `[[Prototype]]` link, and property lookup walks that chain. `class` is syntax over exactly this: methods land on `C.prototype`, `extends` links prototypes, `super` resolves upward. Each property is really a descriptor — `value`, `writable`, `enumerable`, `configurable`, or a getter/setter pair — which `Object.defineProperty` and the (shallow) `Object.freeze` manipulate.

      ### Destructuring, iteration, collections, modules and errors

      Destructuring, spread and rest cover most data plumbing, but spread copies one level only; use `structuredClone` for a deep copy. Anything with a `[Symbol.iterator]` method works in `for...of` and spread, and generators (`function*` plus `yield`) produce iterators lazily. `Map` takes any value as a key and keeps insertion order; `Set` gives cheap membership; `WeakMap`/`WeakSet` hold keys weakly, so you can attach metadata without leaking. Immutability here is convention, not guarantee: teams simply agree never to mutate.

      ES modules give one instance per resolved specifier, run in strict mode, hoist their `import` declarations so dependencies evaluate first, and expose *live bindings* — reassign an exported variable and importers see the new value. For errors, `throw new Error(...)` rather than strings, and use `cause` to keep the original attached.

      ### The mistakes people actually make

      - Mutating an object passed into a function, then being surprised the caller sees the change. It was never a copy.
      - Passing a method as a callback: `el.addEventListener("click", obj.handle)` loses `this`, so `obj.handle` sees the element. Use `.bind(obj)` or an arrow wrapper.
      - Assuming `sort()` sorts numbers. `[10, 9, 1].sort()` yields `[1, 10, 9]`, because the default comparator compares string forms. Pass `(a, b) => a - b`.
      - Array holes. `new Array(3)` and `[1, , 3]` contain holes, which `forEach` and `map` skip silently. `Array.from({ length: 3 })` gives real `undefined` elements.
      - Believing `typeof null === "object"` means `null` is an object. It is a preserved bug from 1995; use `x === null`.

      **What you can do after this:** read unfamiliar JavaScript and say, without running it, what each closure captured, what `this` is at every call site, and which line mutates the caller's data.
    resources:
