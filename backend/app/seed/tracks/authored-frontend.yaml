  - slug: frontend-devtools-debugging
    name: Debugging with Browser DevTools
    domain: frontend
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - frontend-dom-events
      - frontend-async-javascript
    summary: |-
      Diagnose a bug with the browser's own instruments instead of guesswork: read a
      network waterfall, set a conditional breakpoint, find a detached-node leak in a
      heap snapshot, and follow a repeatable reproduce-isolate-bisect method.
    content_md: |-
      Almost no frontend syllabus teaches debugging, so most developers copy whatever they saw a colleague do — usually scattering `console.log` and reloading. That scales badly. DevTools answers most questions in seconds, and answers some that logging cannot: which function held the main thread for 300 ms, which listener kept 4,000 removed nodes alive.

      The panel names below are Chrome's; Firefox and Safari have close equivalents.

      ### Elements and Console

      The Elements panel shows the live DOM, not your source. The Computed pane gives the value that actually won for each property and traces it to the winning rule; a struck-through rule lost — to specificity, to a later rule, or because the property is invalid. The `:hov` control forces `:hover`, `:focus` and `:active` so you can inspect states you cannot hold open with the mouse, and the grid and flexbox overlays draw track lines instead of leaving you to guess.

      In the Console, `$0` is the selected element, `$$("sel")` is shorthand for `querySelectorAll`, `console.table` renders arrays of objects readably, `console.time`/`timeEnd` measures a block, and `monitorEvents($0, "click")` logs every event of a type on an element — perfect for "is my handler even attached?". Use `console.warn` and `console.error` deliberately so the log-level filter cuts noise.

      ### Network

      Read the waterfall left to right: where a bar starts is when the request began, so a late bar is usually blocked on something earlier, not slow itself. The Timing breakdown separates queueing, DNS, TLS, "waiting for server response" (TTFB) and download — a slow TTFB is a backend problem no frontend work will fix. The Initiator column shows what triggered a request, which is how you find the chain that delayed a critical asset.

      Tick **Disable cache** to test first-load behaviour, and throttle to simulate slow connections. Request blocking proves a hypothesis by removing a resource: block the analytics script and see whether the jank goes.

      ### Sources, Performance and Memory

      Breakpoints beat logging because they let you inspect the whole scope, not the one value you thought to print. Click a gutter for a line breakpoint; right-click for a **conditional** breakpoint (`id === 42`) or a logpoint that prints without pausing. DOM breakpoints pause when a subtree or attribute changes — the way to find code mutating an element when you have no idea where it lives. Step over, into and out while reading the Scope and Call Stack panes.

      Source maps are not optional: a minified trace naming `t` in `a.min.js:1:48291` is worthless, while the same trace with source maps names your function and line. **Local overrides** let you edit a live production file and keep the edit across reloads, testing a fix before deploying.

      The Performance panel records a flame chart: width is time, nesting is the call stack. Find a long task (a flagged block over 50 ms), then the widest bar inside it, and you have the culprit. The Memory panel takes heap snapshots; compare two around an action, filter for "Detached", and you see nodes removed from the tree but still referenced — the signature of a leaked listener or a stale element array.

      ### The method

      Reproduce it reliably, on the smallest input you can. Isolate: does it happen in a private window, with extensions off, on another browser? Bisect: halve the surface each step — half the components, half the commits (`git bisect` does exactly this), half the data. Then state a falsifiable hypothesis — "the list re-renders because `items` gets a new array identity every render" — and design the observation that would disprove it. Debugging stops being luck there.

      ### The mistakes people actually make

      - Scrolling 10,000 `console.log` lines when a conditional breakpoint on `i === 9999` would have answered it in seconds.
      - Not shipping source maps, then trying to read a production trace of mangled one-letter identifiers.
      - Testing only on a fast laptop on office wifi, never enabling CPU or network throttling.
      - Blaming the framework for a slow page before opening the Network panel, where a 4 MB uncompressed hero image is plainly visible.
      - Fixing a symptom before reproducing it, so you cannot tell whether the fix worked or the bug is merely intermittent.

      **What you can do after this:** record a Performance profile of a janky interaction, read the flame chart, and name the function responsible for the long task — then confirm the fix with a before/after recording.
