  - slug: frontend-mcp
    name: Model Context Protocol and Tool Integration
    domain: frontend
    est_hours: 4
    difficulty: advanced
    prerequisites:
      - frontend-agents
    summary: |-
      Explain why a standard protocol for connecting models to tools exists,
      distinguish MCP's tools, resources and prompts, and evaluate a server for a
      frontend workflow — including the security consequences of giving a model
      real capabilities.
    content_md: |-
      Before a standard existed, every assistant that wanted to read your issue tracker needed a bespoke integration with that tracker, and every tracker that wanted to be readable needed one per assistant. With M hosts and N tools that is M×N integrations, none of them reusable. The Model Context Protocol collapses it to M+N: one client implementation per host, one server implementation per tool, and any compliant pair works together.

      That is the entire motivation, and worth holding onto: most confusion about MCP comes from treating it as an AI technology rather than plumbing. It is a JSON-RPC protocol with a well-specified handshake, and the interesting design questions are ones you know from any API — what to expose, at what granularity, with what privileges.

      ### The architecture and the three primitives

      A **host** application (an editor, an agent, a chat client) runs one **client** per **server** it connects to. Each server exposes some combination of three primitives, and the distinction between them is about *who initiates*:

      - **Tools** are **model-controlled**: the model decides to call one, and calls can have side effects — write a file, open a page, create an issue. This is the primitive that makes MCP powerful and dangerous.
      - **Resources** are **application-controlled**: addressable, read-only context (a file, a record, a query result) that the host can attach to the conversation. The host, not the model, decides what to include.
      - **Prompts** are **user-controlled**: parameterised templates a person deliberately invokes, typically surfaced as slash commands.

      Mixing these up produces bad servers. A read-only lookup should be a resource or a narrow read tool, not a general-purpose executor.

      Transports are deliberately boring: **stdio** for a local server the host spawns as a subprocess, and an HTTP-based streamable transport for remote servers, where authorisation and ordinary web security apply.

      ### What a good server looks like for frontend work

      Useful servers for a frontend team look like: a design-token or component-library server, so the model reads your actual token names and component props instead of inventing them; a browser-automation server that can open a page, click and screenshot, closing the loop on UI behaviour; an issue tracker; and a documentation index over the versions you actually run, which directly addresses the stale-training-data failure.

      The single most underrated part of writing a server is the **tool description**. The model chooses tools from their names, descriptions and input schemas — that text is the interface. A description saying "queries data" gets called for everything and then fails; one saying "Look up a design token by name; returns its value and the components using it; read-only" gets called correctly.

      Keep return payloads small and shaped. Everything a tool returns is pasted into the context window, so a tool that dumps 8,000 lines of JSON has destroyed the session even when it "worked". Paginate, summarise, and return identifiers the model can follow up on.

      ### Security is the main design constraint

      Three properties matter and they compound:

      A tool call is code execution with the host's privileges. There is no sandbox by default; the server runs as you, with your tokens.

      Server output is untrusted input. A tool that fetches a page, reads an issue or greps a dependency can return text containing instructions the model cannot distinguish from yours. Combining a server that reads untrusted content with one that has write access is the classic dangerous configuration.

      Credentials should be scoped to the task. Give an issue-tracker server a token that can read one project, not an organisation-wide admin key, and prefer read-only tools wherever the workflow allows.

      ### The mistakes people actually make

      - Exposing one broad `run_query` or `execute` tool. It is easy to build, impossible to constrain, and the model will use it in ways you did not imagine.
      - Vague tool descriptions, so the model picks the wrong tool and you blame the model.
      - Returning enormous payloads that consume the context window and degrade everything afterwards.
      - Connecting an unaudited third-party server to an agent that has write access to your repository, because the install command was one line.

      **What you can do after this:** read an MCP server's tool list and say which calls have side effects, what privileges they run with, and whether its descriptions and payload sizes will work inside a model's context window.
