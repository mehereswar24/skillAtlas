  - slug: frontend-learn-a-framework
    name: Choosing a Framework and Committing to It
    domain: frontend
    est_hours: 6
    difficulty: intermediate
    prerequisites:
      - frontend-learn-the-basics
    summary: Compare React, Vue, Svelte, Solid and Angular on the axes that actually differ — rendering strategy, payload, first-party answers, typing, ecosystem, hiring — and defend a choice for a specific project rather than in the abstract.
    content_md: |-
      Framework choice is treated as an identity question and it is really a
      procurement question. You are buying a rendering strategy, a set of default
      answers to routing, state and forms, a hiring pool and a maintenance
      commitment measured in years. The right way to decide is to write down what
      your project needs, score the candidates on those axes, and then stop
      revisiting it.

      The uncomfortable truth underneath is that the framework is almost never why a
      project fails. Projects fail on unclear data ownership, on no tests, on a
      thousand-line component nobody dares touch. Every framework on this list can
      build a good product, and every one of them can be used to build a mess.

      ### The axes that genuinely differ

      **Rendering strategy.** Virtual DOM (React), compiled updates (Svelte), or
      fine-grained signals (Solid, Angular, Vue). This drives update cost on large,
      frequently-changing views, and it drives how much you must think about
      memoisation.

      **Payload and runtime cost.** Svelte and Solid ship notably less framework code
      than React or Angular. On a marketing site over a slow connection that is a
      real difference; on an internal dashboard behind a login it is usually noise
      next to your own bundle.

      **Templating versus JSX.** Templates (Vue, Svelte, Angular) are statically
      analysable, which lets the compiler optimise and lets tooling reason about
      them. JSX is just JavaScript, so anything you can do with a value you can do
      with UI. This is largely taste, but it is taste with consequences for tooling.

      **First-party answers versus assembly.** Angular ships routing, forms, HTTP,
      dependency injection and a CLI with conventions. Vue ships router and Pinia as
      blessed companions. React ships a renderer and expects you to choose the rest,
      or to adopt a framework on top of it. Assembly is freedom when you have strong
      opinions and a tax when you do not.

      **TypeScript quality, ecosystem depth, hiring pool, maintenance signals.** All
      five type well in 2026; Angular and Solid were designed with types in mind,
      React's are excellent, Vue's `<script setup>` inference is good. Ecosystem
      depth and hiring pool remain React's decisive advantages.

      ### Where each is genuinely the better answer

      **Angular** for large enterprise teams: dependency injection, enforced
      structure, an opinionated CLI and a documented upgrade path mean a hundred
      developers produce code that looks like one codebase. That constraint is a
      feature at that size and overhead at five people.

      **Svelte and Solid** when payload and update cost dominate — embedded widgets,
      content sites, anything shipped to weak devices. Both are pleasant; both have
      smaller ecosystems, so budget for writing your own integrations.

      **Vue** when you want batteries mostly included, excellent documentation, and
      SFCs that keep template, logic and scoped styles together. Strong choice for
      small-to-medium teams.

      **React** when ecosystem, hiring and the availability of a solved answer to
      every niche problem matter more than elegance. It is the safe institutional
      choice, and "safe institutional choice" is a legitimate engineering criterion.

      ### The cost of switching

      Rewrites are paid in months and in regressions to behaviour nobody documented.
      Before switching, write down the specific problem the current framework causes
      and check that the new one solves it — "the code is messy" is not a framework
      problem. A strangler approach, mounting new components inside the old app at
      a boundary, beats a big-bang rewrite almost every time.

      ### The mistakes people actually make

      Choosing from benchmark charts that render ten thousand table rows, when your
      app renders forty rows and spends its time waiting on the network — you
      optimised the axis that was never your bottleneck. Reaching for a framework at
      all on a five-page brochure site that HTML and a little CSS would serve faster,
      cheaper and more reliably. Believing framework skills do not transfer, and so
      refusing a role or a codebase because it is "the other one" — reconciliation,
      derived state and data flow are the same everywhere, and the API surface is a
      week.

      **What you can do after this:** write a one-page framework recommendation for a
      specific project that names the deciding axes, the runner-up, and the condition
      under which you would revisit the decision.
    resources:
      - kind: doc
        title: 'React: official documentation'
        url: https://react.dev/
      - kind: doc
        title: 'Vue: Introduction'
        url: https://vuejs.org/guide/introduction.html
