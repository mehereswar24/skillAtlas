  - slug: frontend-dom-events
    name: The DOM and the Event Model
    domain: frontend
    est_hours: 10
    difficulty: beginner
    prerequisites:
      - frontend-javascript
      - frontend-css
    summary: |-
      Manipulate the document as a live tree without paying hidden layout costs, and
      use event capture, bubbling and delegation deliberately — so one listener can
      serve a thousand rows and cleanup never leaks.
    content_md: |-
      The DOM is not your HTML file. It is a live object tree the browser built from that file and keeps mutating as scripts and user input run. Every property you read from it is a question put to the rendering engine, and some of those questions are expensive enough to stall a frame.

      The event system is the other half — not a callback bag bolted on afterwards but a designed propagation mechanism with three phases, which is what lets you handle a click on a row that did not exist at load time.

      ### The tree: nodes, elements, and how you change it

      Everything in the tree is a `Node`; only some nodes are `Element`s. Text and comments are nodes too, which is why `firstChild` often surprises you with a whitespace text node while `firstElementChild` does not. Query with `querySelector`/`querySelectorAll` (a static `NodeList`) or `getElementsByClassName` (a *live* `HTMLCollection` that changes under you while you iterate).

      To build content, `createElement` then `append`, or set `textContent`. `textContent` writes a text node, so `<b>` arrives as literal characters. `innerHTML` parses its string as markup, which makes any user-controlled value in it an XSS vector. If you must inject markup, sanitise it first; otherwise stay on `textContent`.

      Attributes and properties are two different stores that only sometimes sync. `input.value` is the current value; `input.getAttribute("value")` is the initial one from markup. `checked` behaves the same way. `class` is the attribute, `className` and the far better `classList` (`add`, `remove`, `toggle`, `contains`) are the properties. `data-*` attributes surface as `el.dataset.someName`.

      ### Layout cost: why reads and writes must not interleave

      The browser batches style and layout work. Reading a *layout-dependent* property — `offsetHeight`, `offsetTop`, `getBoundingClientRect()`, `scrollTop`, `getComputedStyle()` — forces it to flush any pending style changes and compute layout right now. That is a forced synchronous layout. Do it once and it is cheap; do it inside a loop that also writes styles and you get layout thrashing, one full layout per iteration:

      ```js
      // Bad: read, write, read, write...
      for (const el of items) el.style.height = el.offsetHeight * 2 + "px";
      // Good: read all, then write all
      const hs = items.map(el => el.offsetHeight);
      items.forEach((el, i) => (el.style.height = hs[i] * 2 + "px"));
      ```

      When inserting many nodes, build them into a `DocumentFragment` and append the fragment once, so the tree is touched a single time.

      ### Events: three phases, and delegation

      A dispatched event travels from the root down to the target (capture), fires at the target, then travels back up (bubble). `addEventListener(type, fn)` listens in the bubble phase; pass `{ capture: true }` for the way down. `stopPropagation()` halts that journey; `preventDefault()` cancels the browser's default action (following a link, submitting a form) and does *not* stop propagation. They are independent knobs.

      Because events bubble, you can put one listener on a container and inspect `event.target.closest("tr")` to find which row was hit. That is event delegation, and it beats a thousand per-row listeners on memory, setup time and — crucially — correctness, because rows added later are handled automatically.

      For your own signals, `new CustomEvent("thing", { detail, bubbles: true })` plus `el.dispatchEvent(...)` gives you the same propagation for free. Scroll, wheel and touch listeners should pass `{ passive: true }` so the compositor need not wait to see whether you will call `preventDefault`. And for cleanup, pass a signal: `addEventListener(type, fn, { signal: controller.signal })` removes every listener bound to that `AbortController` in one `abort()` call.

      `click` is a high-level activation event that also fires for keyboard activation, so it is the accessible choice; pointer events (`pointerdown`, `pointermove`) unify mouse, touch and pen and are what you want for dragging, with raw touch events as the lower-level fallback.

      ### The mistakes people actually make

      - Adding listeners inside a loop that re-runs on every render, never removing them. Handlers accumulate, the closed-over nodes cannot be collected, and the page slowly leaks.
      - Reading `offsetHeight` inside a loop that also writes `style`, then blaming the framework for jank.
      - Passing a username straight into `innerHTML`. A name containing `<img onerror=...>` now runs script with your origin's cookies.
      - Believing `preventDefault()` stops the event reaching parent handlers. It does not — only `stopPropagation()` does.
      - Iterating a live `HTMLCollection` while removing its elements, and skipping half of them.

      **What you can do after this:** replace per-row handlers on a large table with a single delegated listener that also survives re-renders, and explain which line of a slow interaction forced a synchronous layout.
