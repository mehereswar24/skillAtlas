  - slug: frontend-css-layout
    name: 'Layout: Flexbox, Grid and Positioning'
    domain: frontend
    est_hours: 10
    difficulty: beginner
    prerequisites:
      - frontend-css
    summary: |-
      Choose the right layout algorithm deliberately - normal flow, flexbox, grid or
      positioning - and explain how each sizes its boxes, so that overflow, shrinking
      and sticky failures become predictable rather than mysterious.
    content_md: |-
      A browser does not have one layout engine; it has several, and an element's
      `display` value selects which one applies to its children. Most layout pain
      comes from using the wrong algorithm and then fighting its sizing rules with
      fixed widths.

      The useful question is: am I distributing items along **one** axis, where their
      content should decide their size, or am I placing items into a **two
      dimensional** structure that exists whether or not there is content for it?
      The first is flexbox, the second is grid.

      ### Normal flow is the default worth keeping

      Block boxes stack vertically and fill the inline size of their containing block.
      Inline boxes flow along a line, wrap, and ignore vertical margins and explicit
      dimensions. Normal flow is already responsive, so reach for flexbox or grid when
      flow genuinely cannot express the arrangement, not by reflex.

      ### Flexbox: one axis, content-driven

      `display: flex` establishes a flex container. `flex-direction` sets the **main
      axis**; the perpendicular one is the **cross axis**. `justify-content` aligns
      along main and `align-items` along cross.

      Sizing runs in a defined sequence. Each item gets a hypothetical main size from
      `flex-basis`, which beats `width` on the main axis; the default `auto` means
      "use `width`". The container then compares the total to available space: free
      space is handed out by `flex-grow` in proportion, a deficit is removed by
      `flex-shrink` weighted by each item's basis. The shorthand `flex: 1` means
      `1 1 0%`, making items equal regardless of content; `flex: auto` is `1 1 auto`,
      which keeps content proportions.

      The trap: a flex item's `min-width` computes to `auto`, so it will not shrink
      below its minimum content size. A long unbroken string or a nested `<pre>`
      therefore blows the layout out. Fix it with `min-width: 0` on the item:

      ```css
      .row { display: flex; gap: 1rem; }
      .row > .truncates { flex: 1; min-width: 0; }
      ```

      ### Grid: two axes, structure-driven

      `display: grid` lets you declare tracks before content exists.
      `grid-template-columns` and `-rows` define **explicit** tracks; anything placed
      beyond them creates **implicit** tracks sized by `grid-auto-rows`/`-columns`.
      The `fr` unit distributes leftover space after fixed tracks are allocated, and
      `minmax(200px, 1fr)` sets a floor and a ceiling. `repeat(auto-fill, ...)`
      creates as many tracks as fit, leaving empty ones; `repeat(auto-fit, ...)`
      collapses the empty ones so the remaining items stretch. That single word is the
      difference between a trailing gap and a filled row:

      ```css
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
        gap: 1rem;
      }
      ```

      `grid-template-areas` names regions in ASCII art, making a page skeleton
      readable and re-orderable in a media query. `subgrid` lets a nested grid adopt
      its parent's tracks, so headings and footers in sibling cards line up even
      though each card is its own element.

      ### Positioning and containing blocks

      `position: relative` offsets a box from where flow put it while keeping its
      space reserved, and makes it a containing block for absolute descendants.
      `absolute` removes the box from flow and positions it against the nearest
      positioned ancestor. `fixed` positions against the viewport. `sticky` behaves as
      relative until a scroll threshold, then sticks within its *parent's* box.

      The rule that surprises people: `transform`, `filter`, `backdrop-filter`,
      `perspective`, `contain: paint` and `will-change` on any of those make an
      element a containing block for `position: fixed` *and* `absolute` descendants.
      A fixed modal inside an animated wrapper stops tracking the viewport and starts
      tracking the wrapper.

      Finally, prefer logical properties — `margin-inline`, `padding-block`,
      `inset-inline-start`, `inline-size`. They follow writing mode and direction, so
      the same stylesheet works in Arabic or Japanese without a mirrored override
      sheet.

      ### The mistakes people actually make

      Building a page skeleton out of nested flex containers. You end up recreating
      rows and columns by hand, and alignment across rows is impossible because each
      row is a separate formatting context. That is grid's job.

      Conversely, using grid for a row of buttons whose widths should follow their
      labels. Grid tracks are structural, so you fight to make them content-sized.

      Setting `flex: 1` and being surprised the item overflows. The default
      `min-width: auto` is holding it at its content minimum; add `min-width: 0`.

      `position: sticky` doing nothing at all. Almost always an ancestor has
      `overflow: hidden`, `auto` or `scroll`, making it the scroll container so the
      element sticks inside a box that never scrolls.

      **What you can do after this:** look at a design and say, per region, which
      layout algorithm you would use and why, then diagnose an overflowing or
      non-sticking element by naming the sizing rule or ancestor responsible.
    resources:
