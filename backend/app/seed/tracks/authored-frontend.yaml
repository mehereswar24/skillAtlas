        url: https://web.dev/learn/performance
  - slug: frontend-html
    name: HTML as Meaning, Not Layout
    domain: frontend
    est_hours: 10
    difficulty: beginner
    prerequisites:
      - frontend-internet
    summary: |-
      Write markup that states what content is rather than how it looks, and predict
      the DOM and accessibility tree the browser will build from it — including how
      the parser recovers from mistakes you did not intend to make.
    content_md: |-
      HTML is not a layout language and it is not a pixel template. It is a language
      for stating what things *are*, and its real output is two trees: the DOM, which
      CSS and scripts operate on, and the accessibility tree, which screen readers and
      voice control consume. Both derive from your markup, so vague markup produces a
      vague tree that everything downstream inherits.

      The reward for getting this right is that the browser does a great deal of work
      for free — focus order, keyboard activation, form submission, autofill, native
      validation — that you would otherwise have to build yourself.

      ### The parser never fails

      HTML parsing is fully specified precisely so that every browser recovers from
      broken markup *identically*. There is no syntax error that stops the page: a
      tokenizer produces tags and text, and tree construction inserts them according
      to insertion-mode rules you did not write, which can silently restructure your
      document. `<p>` has an implied end tag, so a `<div>` start tag closes any open
      paragraph:

      ```html
      <p>Intro <div>Body</div></p>
      ```

      becomes a paragraph, a sibling div, and a stray empty paragraph — not the
      nesting you typed. Your selectors and `querySelector` calls run against the tree
      the parser built, so read the Elements panel, not your source file, when nesting
      behaves strangely.

      ### Structure, landmarks and the outline

      Set `<html lang="en">` — it drives screen-reader pronunciation and hyphenation.
      In `<head>`, declare `<meta charset="utf-8">` first, then the viewport meta and
      a `<title>` that is unique per page, because it is both the tab label and the
      first thing a screen reader announces.

      In the body, use landmark elements: `<header>`, `<nav>`, `<main>` (exactly one),
      `<aside>`, `<footer>`. Assistive technology exposes these as a jump menu.
      Headings `<h1>`–`<h6>` are the outline; browsers never implemented an automatic
      outline algorithm, so the *level numbers* are what gets exposed. Do not skip
      levels, and do not choose a level for its default size.

      ### Content elements that carry information

      Lists are announced with their item count, which is real information — use
      `<ul>`, `<ol>` and `<dl>` for anything list-shaped.
      Data tables need `<caption>`, `<thead>`/`<tbody>` and `<th scope="col">` or
      `scope="row">` so a screen reader can announce the header for each cell.
      `<div>` and `<span>` say nothing, which is right when there is nothing to say.

      ### Forms are a system, not a widget

      Choose the right `type` — `email`, `tel`, `url`, `number`, `date`, `search`,
      `file` — and the browser supplies the right keyboard, picker and validation.
      Add `autocomplete` tokens so password managers work. Constraints such as
      `required`, `pattern` and `maxlength` give you validation and the `:invalid`
      state with no JavaScript. Group radios in a `<fieldset>` with a `<legend>`.

      Every control needs a programmatic label: `<label for="id">` matching the
      control's `id`, or a `<label>` wrapping it. A `<button>` inside a form defaults
      to `type="submit"`, so annotate action buttons with `type="button"`.

      ### Links, buttons and images

      An `<a href>` navigates: it responds to Enter and appears in the tab order. A
      `<button>` performs an action in place:
      it responds to Enter *and* Space and participates in forms. Picking the wrong
      one breaks user expectations in ways CSS cannot repair.

      `alt` describes an image's *purpose in this context*, not its appearance. A
      decorative image takes `alt=""` so it is dropped from the accessibility tree; an
      image inside a link needs alt text naming the destination. Set `width` and
      `height` so the browser reserves space, and use `<picture>` with `<source>` when
      you need different crops or formats.

      ### The mistakes people actually make

      Div soup: wrapping everything in `<div>` and adding classes for meaning. The
      accessibility tree ends up with no landmarks and no headings, so keyboard and
      screen-reader users have nothing to navigate by.

      Choosing `<h3>` because it looks the right size. Sizing is CSS; the number is
      structure. You end up with an outline that jumps levels or has three `<h1>`s.

      `<div onclick>` instead of `<button>`. It is not focusable, does not fire on
      Enter or Space, and is invisible to assistive technology as a control.

      Using `placeholder` as the label. It disappears on typing, is usually
      low-contrast, and is not reliably an accessible name.

      Laying out pages with `<table>`. Screen readers announce it as a data table, so
      the content is read as a grid that means nothing.

      **What you can do after this:** mark up an unstyled page so a keyboard user can
      reach every control in a sensible order and a screen reader can list its
      landmarks and headings as a usable outline.
    resources:
