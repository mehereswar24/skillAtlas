  - slug: frontend-data-fetching
    name: Data Fetching, Caching and Async UI State
    domain: frontend
    est_hours: 10
    difficulty: intermediate
    prerequisites:
      - frontend-async-javascript
      - frontend-state-management
    summary: Model every async view properly — loading, error, empty, stale, refetching — and use a query cache to get deduplication, cancellation, retries, invalidation and optimistic updates instead of hand-rolling them.
    content_md: |-
      Fetching data looks like the easiest thing in frontend and produces the most
      bugs, because the naive version — an effect that calls `fetch` and sets
      state — quietly omits about eight behaviours that production requires. Getting
      this right is mostly about admitting how many states an async view really has,
      then not implementing the machinery yourself.

      ### More states than you think

      The textbook set is idle, loading, error, success. Real UIs also need **empty**
      (succeeded, zero rows — not a spinner, and not an error), **stale**
      (showing cached data known to be old), **refetching** (background update while
      valid data is on screen), and **partial** (page one loaded, page two arriving).
      Collapse these into a boolean `isLoading` and you get the familiar
      symptoms: a full-page spinner replacing content the user was reading, an empty
      list indistinguishable from a failed one.

      ### Why hand-rolled fetching is a bug farm

      Consider `useEffect(() => { fetch(url).then(setData) }, [url])`. It has no
      cancellation, so navigating away sets state on a gone component. It has a
      **race condition**: change `url` twice quickly and the slower first response
      can land last, showing the wrong record — responses have no ordering guarantee.
      Two components asking for the same data fire two requests. Nothing is cached,
      so returning to a page refetches from scratch. There is no retry, and a
      transient network blip becomes a permanent error screen. And fetching inside a
      child that only renders after its parent's fetch resolves creates a
      **waterfall**: sequential round trips where parallel ones would do.

      ### The query-cache model

      Query libraries — TanStack Query, SWR, RTK Query, Vue Query — replace all of
      that with one idea: data is identified by a **query key**, and the cache is
      keyed by it.

      ```js
      useQuery({ queryKey: ['invoice', id], queryFn: () => getInvoice(id) })
      ```

      Two components with the same key share one request and one cache entry;
      deduplication is automatic. **Stale time** says how long the cached value is
      considered fresh (no refetch); **garbage-collection time** says how long an
      unused entry is kept before eviction. They are different clocks and confusing
      them is the most common configuration error.

      On top of that you get background revalidation (show cache instantly, refetch
      silently, swap in the update), retry with exponential backoff, paginated and
      infinite queries, and **mutations** that invalidate keys so affected queries
      refetch. **Optimistic updates** write the expected result into the cache
      immediately and roll back on failure — which requires you to snapshot the
      previous value first. **Prefetching** on hover or on route load removes
      waterfalls by starting the request before the component that needs it renders.

      ### Cancellation and error taxonomy

      `AbortController` is the platform mechanism: pass `controller.signal` to
      `fetch` and call `controller.abort()` on unmount or on a superseding request.
      An aborted fetch rejects with an `AbortError`, which you must not display as a
      failure.

      Errors are not one thing. A network failure is retryable and deserves "check
      your connection". A `401` means re-authenticate. A `403` means the retry will
      never help. A `404` is often a legitimate empty state, not a crash. A `422`
      carries field-level validation errors that belong next to the inputs. A `5xx`
      is retryable and is not the user's fault. One generic "Something went wrong"
      for all of these throws away information the server took care to send.

      ### Loading UX

      A spinner that appears for 80 ms is worse than no spinner: the flash reads as a
      glitch. Delay the indicator by roughly 200–300 ms so fast responses never show
      one, and once shown, keep it briefly to avoid a second flash. Prefer skeletons
      that occupy the final layout, because a spinner that collapses to content of a
      different height causes layout shift and hurts Cumulative Layout Shift.

      ### The mistakes people actually make

      Building the query key inline as `['user', { id }]` with a fresh object each
      render, so the key never matches and the query refetches forever. Treating a
      404 as an exception and showing a crash screen where "no results yet" was
      correct. Awaiting requests in sequence at the top of a page when they are
      independent — three 200 ms calls become 600 ms of blank screen. Optimistic
      updates with no rollback path, leaving the UI claiming a save that failed.

      **What you can do after this:** look at a list screen and enumerate every async
      state it can be in, then say which are handled, which flash, and which are
      silently wrong.
    resources:
      - kind: doc
        title: 'TanStack Query: Overview'
        url: https://tanstack.com/query/latest/docs/framework/react/overview
      - kind: doc
