  - slug: frontend-vcs-hosting
    name: Collaborating on GitHub and GitLab
    domain: frontend
    est_hours: 6
    difficulty: beginner
    prerequisites:
      - frontend-version-control
    summary: |-
      You will be able to open a change a reviewer can actually review, choose a merge
      strategy deliberately, and configure branch protection, required checks and
      automated dependency updates on GitHub or GitLab.
    content_md: |-
      Git is the data structure. GitHub and GitLab are the coordination layer on top, and
      that layer decides most of a team's velocity: how large a change is when it arrives,
      who looks at it, what runs automatically first, and what history looks like
      afterwards. None of that is Git; all of it is convention plus configuration.

      ### Remotes and the two collaboration shapes

      A remote is a named URL, conventionally `origin`. Remote-tracking refs like
      `origin/main` are your last-known copy of the server's branches; they update when you
      fetch, not when someone else pushes.

      There are two access shapes. In fork-and-pull-request, a contributor has no write
      access, pushes branches to their own copy of the repository, and opens a PR across
      repositories; this is the open-source default. In shared-branch, everyone pushes to one
      repository. Orthogonal to access is branching strategy: trunk-based development keeps
      branches alive for hours or days and merges into `main` continuously, hiding unfinished
      work behind feature flags, while long-lived release branches (`release/2.4`, with fixes
      cherry-picked back) cost you constant divergence and only pay for themselves when you
      must support several shipped versions at once.

      ### The pull request as a unit of review

      A pull or merge request is a proposed set of commits, a diff, a conversation and a set
      of automated checks. Its reviewability is dominated by size. A diff a reviewer can hold
      in their head gets real comments; a 2000-line one gets "LGTM". Keep one PR to one
      intent, and write a description saying what changed, why, and how you verified it.

      Review etiquette runs both ways. As a reviewer, label each comment as blocking or
      preference so the author knows what must change; ask questions rather than issue
      orders; and review quickly, because a PR sitting in the queue is work rotting. As an
      author, reply to every thread, and push follow-up commits during review rather than
      force-pushing, so the reviewer can see the incremental diff instead of re-reading
      everything.

      ### Merge strategies and the history they leave

      A merge commit preserves the branch topology with two parents, so you can see that a
      set of commits belonged together. Squash-merge collapses the branch into one commit on
      `main`: history is linear and readable, but the individual commits are gone and
      `git bisect` can only narrow a failure to the whole feature. Rebase-merge replays each
      commit onto `main` for a linear history in which the commits never existed in that
      exact form and were never tested in that order. Any of the three is fine. Mixing them
      in one repository is not, because `git log` becomes unreadable.

      ### Automation around the PR

      A protected branch stops direct pushes and lets you require a PR, a number of
      approvals, green status checks, and that the branch is up to date with the base.
      Continuous integration on every PR should install from the lockfile and run lint, type
      check, unit tests and a production build: anything you would be upset to discover
      broken on `main` belongs there. Preview environments deploy the PR branch to a
      throwaway URL so designers and product people can click the change rather than read
      it. A `CODEOWNERS` file maps path globs to teams so the right reviewers are requested
      automatically, and a small, meaningful label set keeps the backlog searchable.

      On release, semantic-release or Changesets derive the next semantic version from commit
      messages or from intent files committed alongside the change, generate a changelog, tag
      and publish. Dependabot and Renovate open dependency-update PRs on a schedule; the value
      only materialises if your test suite is trustworthy enough that most of them can merge
      automatically.

      ### The mistakes people actually make

      Opening a 2000-line PR and being surprised that the review found nothing. Force-pushing
      mid-review, which detaches the reviewer's comments from the lines they referred to and
      quietly discards the conversation. Treating a red CI as normal: once the suite is
      routinely failing nobody reads it, so a flaky test is a broken test and must be fixed
      or deleted. Committing a secret and "removing" it in a later
      commit, when it is still in every clone and every CI cache; rotate the credential.
      And spending review comments on formatting that a formatter should already own.

      **What you can do after this:** set up a repository so that `main` cannot be pushed to
      directly, every PR must pass lint, types and tests, the right team is auto-requested
      via `CODEOWNERS`, and dependency updates arrive as PRs.
    resources:
      - kind: doc
        title: 'GitHub Docs: About pull requests'
        url: https://docs.github.com/en/pull-requests
