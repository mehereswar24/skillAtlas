# Hand-authored for SkillAtlas. Do NOT regenerate with
# scripts/import_roadmapsh.py — the importer skips any roadmap that has an
# `authored-<slug>.yaml` file, which is what makes this file the frontend track.
#
# Written independently from primary sources (MDN, WHATWG, W3C/WAI, web.dev and
# official project documentation). The syllabus is our own curation, not a
# restructured copy of anyone else's: accessibility is taught immediately after
# HTML rather than as a final audit, TypeScript comes before frameworks, the
# event loop, DevTools debugging, state management, data fetching and forms are
# first-class concepts, and the AI-workflow material sits at the end of the
# track rather than in the middle of the beginner path.
#
# Concept slugs are load-bearing: projects, company focus areas, role skills and
# seed/quizzes/frontend.yaml all reference them by name. Slugs may be
# repurposed, never dropped.

track:
  slug: frontend
  title: Frontend Engineering
  domain: frontend
  target_role: Frontend Engineer
  difficulty: intermediate
  description: A 47-step path from a first HTML document to a production frontend architecture, sequenced by outcome rather than by topic. You build an accessible, responsive page on the real internet before you touch JavaScript; you learn the language, the event loop, the browser platform, DevTools and TypeScript before any framework; you learn the collaboration and build tooling as one block; then component thinking, a framework, state, data and security; then performance, rendering strategies and design systems; and finally shipping beyond the browser tab and working alongside AI tools.
concepts:
  - slug: frontend-internet
    name: How the Web Delivers a Page
    domain: frontend
    est_hours: 8
    difficulty: beginner
    prerequisites: []
    summary: |-
      Trace a single page load from typing a URL to rendered bytes, and explain each
      step as a mechanism: name resolution, connection setup, the HTTP exchange, and
      why the number of round trips matters more than raw bandwidth.
    content_md: |-
      Every interface you write sits at the far end of a delivery chain. A name has to
      be resolved to an address, a connection has to be built and secured, and bytes
      have to cross a physical distance. When a page "feels slow", the cause is far
      more often the shape of that chain than the code you wrote. Learning the chain
      also tells you which problems are yours: a stale asset, a mysterious `304`, or a
      page fast for you and slow for a user two continents away.

      ### Resolving the name

      A URL is `scheme://host:port/path?query#fragment`. The fragment is never sent to
      the server; it is a client-side instruction, which is why jumping to `#pricing`
      costs no request.

      Names must become IP addresses. Your operating system asks a *recursive
      resolver* — your router, your ISP, or a public one. If it has no cached answer
      it walks the hierarchy: root servers, then the servers for `.com`, then the
      *authoritative* nameservers for the domain. An `A` record returns an IPv4
      address, `AAAA` an IPv6 address, and `CNAME` an alias to another name that must
      itself be resolved.

      Every answer carries a TTL in seconds. That TTL is why a DNS change is not
      instant: resolvers may keep serving the cached answer until it expires. Lower
      the TTL *before* you move a domain, not after.

      ### Two handshakes before any HTML

      TCP opens with SYN, SYN-ACK, ACK — one full round trip before either side sends
      data. Then TLS negotiates keys, costing one more round trip in TLS 1.3 (and zero
      on resumption), where older versions needed two.

      Be precise about what the certificate proves: a certificate authority attests
      that whoever holds the matching private key controls that hostname. That is all.
      It does not mean the operator is honest or the JavaScript is safe.

      ### The exchange is text

      HTTP/1.1 on the wire is readable, and later versions carry the same semantics in
      binary frames:

      ```
      GET /app.js HTTP/1.1
      Host: example.com
      Accept-Encoding: br, gzip
      If-None-Match: "a1b2c3"
      ```

      The status line is a contract, not a mood. `200` carries a body, `204` succeeds
      with none, `301`/`308` move a resource permanently (browsers cache these), `304`
      says your cached copy is still valid, `401` means not authenticated, `403`
      authenticated and still refused, `429` slow down, `503` temporarily unavailable.

      Four response headers do most of the work in frontend life. `Content-Type`
      decides how bytes are interpreted — serve JavaScript as `text/html` and nothing
      executes. `Cache-Control` sets freshness with directives like `max-age`,
      `no-cache` and `immutable`. `ETag` is a version token the browser echoes back in
      `If-None-Match`, letting the server reply `304` with no body at all.
      `Content-Encoding` reports compression such as `gzip`, `br` or `zstd`.

      ### Why HTTP/2 and HTTP/3 exist

      An HTTP/1.1 connection carries one request at a time, so browsers open several
      connections per origin and queue the rest. HTTP/2 fixed that at the application
      layer: requests became multiplexed binary streams on one connection with
      compressed headers. But those streams still ride a single TCP connection, and
      TCP delivers strictly in order, so one lost packet stalls every stream behind
      it — transport-level head-of-line blocking. HTTP/3 moves onto QUIC, which runs
      over UDP and implements streams itself, so loss on one stream does not block the
      others; QUIC also merges the transport and TLS handshakes, making a fresh secure
      connection cost one round trip.

      ### Latency versus bandwidth

      Bandwidth is how wide the pipe is; latency is how long it is. Loading is a
      *sequence of dependent* round trips: resolve, connect, fetch HTML, then fetch
      what the HTML references. Doubling bandwidth barely moves a page made of many
      small dependent requests. Removing a round trip always helps.

      ### The mistakes people actually make

      Reading HTTPS as "this site is safe". It means the transport is encrypted and
      the hostname was validated. A phishing site can hold a perfectly valid
      certificate.

      Confusing DNS caching with HTTP caching. Repointing a domain and still seeing
      old content may be a resolver inside its TTL, or a browser or CDN serving a
      still-fresh response.

      Treating a `200` in DevTools as proof the server ran. A response served from
      memory or disk cache also reports `200`; check the Size column for
      `(disk cache)`.

      **What you can do after this:** open a network waterfall, point at any row and
      say whether the delay is name resolution, connection setup, server think time,
      transfer or a cache hit — and name the round trip you would remove first.
    resources:
      - kind: doc
        title: 'MDN: HTTP'
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP
      - kind: doc
