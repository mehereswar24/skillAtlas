  - slug: frontend-agents
    name: Agentic Coding Tools
    domain: frontend
    est_hours: 5
    difficulty: advanced
    prerequisites:
      - frontend-ai-assisted-coding
    summary: |-
      Understand an agent as a tool-calling loop rather than a product category, and
      use one safely on a frontend codebase: verifiable goals, a clean working tree,
      bounded permissions, and review of the resulting diff rather than the
      transcript.
    content_md: |-
      Strip away the marketing and an agent is a loop. The model is given a set of tools — read a file, write a file, run a shell command, search the codebase. It emits a tool call instead of prose. A harness executes that call and feeds the result back into the context. The model sees the result and emits the next call. This repeats until it decides the task is done, hits a budget, or a person stops it.

      Everything interesting about agents follows from that loop, in both directions. It can run your test suite and react to a genuine failure, which is qualitatively different from a chat window that cannot observe anything. It can also run `rm -rf`, and its next action is chosen by a probabilistic model reading text that may include content it did not write.

      ### What the loop buys you

      Feedback. A chat assistant guesses whether its code works; an agent can find out. Given a failing test it reads the test, reads the implementation, makes a change, runs the test, sees the new error, and tries again. That closed loop is why agents handle mechanical-but-fiddly work — a dependency upgrade with breaking changes, a codemod across 60 components — better than chat ever did.

      **The quality of the signal you give it determines the quality of the result.** A failing test, a type error, a lint rule, an interface to satisfy: these are checkable, so the loop converges. "Make the dashboard feel snappier" is not, so the loop wanders and stops when it runs out of ideas.

      ### What the loop costs you

      Three things follow just as directly.

      **Execution is real.** A tool call is code running with your privileges — your credentials, your network, your repository. This is why harnesses have permission prompts, command allowlists, read-only modes and sandboxes.

      **The loop may not terminate.** Without iteration limits, token budgets and stop conditions, an agent can grind for an hour making a change worse. Give it a budget and watch the first few runs.

      **Context degrades.** Every file read and command output consumes the window; long sessions bury early instructions and behaviour drifts. Prefer short, scoped sessions over one marathon.

      Prompt injection compounds all three: a `README` in a dependency, an issue body or a fetched page can contain instructions, and the model reading them has a shell. Constrain capability rather than trust intent.

      ### Operating one on a frontend repo

      Four habits do most of the work:

      - **Start from a clean git working tree.** Then whatever the agent changed is exactly `git diff`, and you can throw it all away with one command. This single habit prevents most agent disasters.
      - **Give a verifiable goal.** A failing test, a reproduction, a type error, a lint violation, a typed interface to implement.
      - **Keep the scope small.** One module, one bug, one upgrade. Then commit, and start the next one fresh.
      - **Review the diff, not the transcript.** The transcript is a narrative of what the model believed it was doing. The diff is what happened. Read the diff.

      Agents do well on dependency upgrades and codemods, writing tests against existing behaviour, mechanical refactors, and reproduce-then-fix bug work where a test captures the bug. They do badly on subjective UI and visual design, anything requiring product judgement, and any task with no automated signal, where they will confidently declare success.

      ### The mistakes people actually make

      - Running an agent on a dirty working tree, then being unable to separate its changes from your own half-finished work.
      - Auto-approving every command because the prompts are annoying, and discovering later that "clean up the branches" was interpreted generously.
      - Handing over a goal with no success criterion, so nothing can distinguish done from stuck.
      - Letting it make the build green by deleting or skipping the failing test. Always check the diff for removed assertions, added `skip`, and loosened matchers.
      - Reading the summary at the end and merging. The summary is generated text describing generated text.
      - Pointing an agent with write access at a repository full of untrusted third-party content.

      **What you can do after this:** hand an agent a failing test in a frontend repo on a clean branch, bound what it is allowed to run, and evaluate the result from the diff — including spotting an assertion it quietly weakened.
