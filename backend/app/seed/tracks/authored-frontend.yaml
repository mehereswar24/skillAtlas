        url: https://www.radix-ui.com/primitives/docs/overview/introduction
      - kind: doc
        title: 'React Aria: behaviour and accessibility hooks'
        url: https://react-spectrum.adobe.com/react-aria/
      - kind: doc
        title: Storybook Documentation
        url: https://storybook.js.org/docs
      - kind: book
        title: Design Systems, by Alla Kholmatova (Smashing Magazine)
        url: https://www.smashingmagazine.com/design-systems-book/
  - slug: frontend-web-components
    name: Web Components and the Platform's Component Model
    domain: frontend
    est_hours: 8
    difficulty: advanced
    prerequisites:
      - frontend-dom-events
      - frontend-css
    summary: |-
      Build a custom element with shadow DOM, slots and form participation, style it from the
      outside through parts and custom properties, and judge honestly when the platform's
      component model beats a framework component and when it does not.
    content_md: |-
      Frameworks each invented a component model, and none of them can be consumed by the others.
      The browser has its own, built from three standards — custom elements, shadow DOM and
      templates — and its output is an ordinary DOM element. That element works in React, Vue,
      Angular, a Rails view and a plain HTML file, and it will still work in ten years, because
      it depends on the platform rather than on a version of a library.

      That portability is the whole argument. What follows is how it works, and where it is
      genuinely awkward.

      ### Custom elements: lifecycle, attributes and properties

      You define a class extending `HTMLElement` and register a tag name containing a hyphen.
      The browser then calls lifecycle callbacks for you: `connectedCallback` when the element is
      inserted into a document, `disconnectedCallback` when it is removed (clean up listeners and
      observers here), and `attributeChangedCallback` for any attribute listed in the static
      `observedAttributes` array.

      ```js
      class UserCard extends HTMLElement {
        static observedAttributes = ["name"];
        attributeChangedCallback(attr, oldValue, newValue) { this.render(); }
        connectedCallback() { this.render(); }
      }
      customElements.define("user-card", UserCard);
      ```

      The distinction that causes most interop pain: attributes are strings in markup,
      properties are JavaScript values on the instance. `<user-card user="...">` can only ever
      carry a string. Rich data must be set as a property (`el.user = {...}`), and a framework
      template has to know to do that — which is why most frameworks now have a syntax for
      property binding on custom elements. Keep the two in sync deliberately, and never assume
      one implies the other.

      ### Shadow DOM: encapsulation and its deliberate seams

      `attachShadow({ mode: "open" })` gives the element a separate DOM tree with real style
      encapsulation: your rules cannot leak out, and page styles cannot reach in. Closed mode
      additionally hides the tree from `element.shadowRoot`, which mostly inconveniences you.

      Because that boundary is total, the standards provide chosen openings. `<slot>` and named
      slots let light-DOM children from the consumer be projected into your internal structure —
      and those children are still styled by the page, not by you, except through `::slotted()`.
      `::part()` exposes named internals for external styling. CSS custom properties inherit
      straight through the boundary, which makes them the theming API. Declarative Shadow DOM,
      written as `<template shadowrootmode="open">` inside the HTML, allows a shadow root to be
      delivered by the server, which is what makes server rendering of web components possible.

      ### Forms, ARIA and events crossing the boundary

      A custom element is invisible to a form until you opt in with `static formAssociated = true`
      and `this.attachInternals()`. `ElementInternals` lets you call `setFormValue()` so the
      element submits, participate in validity, and set default ARIA role and state from inside
      the component rather than requiring the consumer to add attributes.

      Events from inside a shadow root are retargeted: outside the boundary, `event.target`
      becomes the host element, so internals stay hidden. A custom event only escapes at all if
      you dispatch it with `bubbles: true` and `composed: true`.

      ### Where they win and where they do not

      They win where portability is the requirement: a design system consumed by several
      frameworks at once, a long-lived embeddable widget on customer sites, micro-frontend
      boundaries where teams ship independently, and anything that must outlive a framework
      choice. They are awkward where the framework is doing real work for you: server rendering
      is still fiddly, passing complex data means property binding, accessibility relationships
      such as `aria-labelledby` do not cross shadow boundaries by ID, and there is no built-in
      reactivity or templating at all — which is precisely the gap Lit fills in a few kilobytes.

      ### Mistakes people actually make

      - Passing an object through an attribute and rendering `[object Object]`, because the
        attribute stringified it.
      - Expecting a global stylesheet or a utility class to style shadow content. It cannot;
        expose `::part` or custom properties instead.
      - Assuming accessibility is free inside a shadow root, then finding a label in the light DOM
        cannot be referenced by an input inside the shadow tree.
      - Reaching for shadow DOM for ordinary internal app components, where CSS Modules or scoped
        styles would have done the job without the interop cost.

      **What you can do after this:** ship a form-associated custom element with slots, a `::part`
      styling seam and a custom-property theming API, and use it unchanged from both React and a
      plain HTML page.
    resources:
      - kind: doc
        title: 'MDN: Web Components'
        url: https://developer.mozilla.org/en-US/docs/Web/API/Web_components
      - kind: doc
        title: 'MDN: Using custom elements'
        url: https://developer.mozilla.org/en-US/docs/Web/API/Web_components/Using_custom_elements
      - kind: doc
        title: 'MDN: Using shadow DOM'
        url: https://developer.mozilla.org/en-US/docs/Web/API/Web_components/Using_shadow_DOM
      - kind: doc
        title: 'MDN: ElementInternals'
        url: https://developer.mozilla.org/en-US/docs/Web/API/ElementInternals
      - kind: doc
        title: 'MDN: ::part() pseudo-element'
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/::part
      - kind: doc
        title: 'HTML Standard: Custom elements'
        url: https://html.spec.whatwg.org/multipage/custom-elements.html
      - kind: doc
        title: Lit Documentation
        url: https://lit.dev/docs/
