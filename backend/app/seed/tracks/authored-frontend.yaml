  - slug: frontend-design-systems
    name: 'Design Systems: Tokens, Components and Contracts'
    domain: frontend
    est_hours: 12
    difficulty: advanced
    prerequisites:
      - frontend-css-frameworks
      - frontend-accessibility
      - frontend-learn-the-basics
    summary: |-
      Build a component library as an API: layered design tokens that make theming possible,
      variant-based component props with escape hatches, headless primitives that supply
      accessibility, and a documentation, versioning and adoption story teams will follow.
    content_md: |-
      Design systems rarely fail because the buttons look wrong. They fail because they are APIs,
      and they fail for the reasons APIs fail: the wrong abstraction, no escape hatch, a breaking
      change with no migration path, and consumers who fork rather than file an issue. Treat the
      system as a visual artefact and you can get every pixel right and still watch three product
      teams copy the source into their own repositories.

      ### Tokens need a semantic layer

      A token is a named design decision. The mistake is having only one layer of them.
      Primitives name raw values — `blue-600`, `space-4`, `font-size-3`. Semantic tokens name
      roles — `color-surface`, `color-text-muted`, `color-border-danger` — and point at
      primitives. Component tokens, where they earn their place, narrow further:
      `button-primary-bg`.

      The semantic layer is what makes theming possible, because a theme is a remapping of roles
      to primitives rather than a rewrite of every component. With it, dark mode is one block of
      reassignments. Without it, dark mode is a find-and-replace across every component that ever
      wrote `blue-600` directly, and it will be wrong somewhere.

      Tokens then have to reach platforms that are not the web. One source of truth in the DTCG
      JSON format, transformed by a tool such as Style Dictionary, emits CSS custom properties,
      TypeScript constants and native resources from the same file, so design and every platform
      stay in step.

      ### Component APIs: variants, not booleans

      Prefer a small set of enumerated props to a pile of flags. `<Button variant="primary"
      size="sm">` has a countable set of valid states. A button with `primary`, `secondary`,
      `danger`, `large`, `small`, `ghost`, `loading` and `icon` as booleans has an exponential
      number of combinations, most of them meaningless and none of them tested.

      Then give consumers a way out, because you will not anticipate every need. Accept and merge
      `className` and `style`, forward the ref to the real DOM node, spread remaining props onto
      it so `aria-*`, `data-*` and event handlers work, and support a polymorphic `as`/`asChild`
      so a button can render as a link without being cloned. Compound components with slots —
      `<Dialog.Trigger>`, `<Dialog.Content>` — let consumers control layout without you adding a
      prop for every possible arrangement.

      ### Outsource the hard accessibility to primitives

      Focus management, roving tabindex, typeahead in a listbox, escape and outside-click
      handling, focus trapping, scroll locking, ARIA relationships, live-region announcements: a
      production combobox is well over a thousand lines of behaviour, and getting it wrong is
      invisible until an audit. Headless, unstyled primitives (Radix, React Aria, Ark, Base UI)
      ship exactly that behaviour with no visual opinion, leaving your system to supply styling.
      Adopting one is the single highest-leverage accessibility decision a team can make, and it
      keeps paying as browsers and assistive technology change.

      ### Documentation, versioning and adoption

      Treat the docs as the product: every component with live, editable examples (Storybook), a
      props table generated from the types, and explicit do/don't guidance including when not to
      use a component at all. Version with semver and mean it — a changed default value is
      breaking. Ship codemods with deprecations, keep the old API working for at least one minor
      release, and write a migration note per change. Decide governance early: who reviews a
      contribution, how a product team proposes a new component, who owns the roadmap. Then
      measure adoption — share of UI built from system components, count of one-off overrides,
      number of forks — because that is the number that tells you whether the API is working.

      ### Mistakes people actually make

      - Publishing primitives only, so `blue-600` appears in fifty components and dark mode
        becomes a manual audit.
      - A `Button` with fourteen boolean props, where nobody knows what `ghost` plus `danger`
        plus `loading` renders.
      - No escape hatch, so a team needing one extra class forks the component and never comes
        back. You now maintain two systems.
      - Building a bespoke combobox or dialog because the primitive "was too heavy", then
        shipping one with no keyboard support and no focus return on close.
      - Documentation that describes what components look like but never when to choose one over
        another.

      **What you can do after this:** design a three-layer token set with a working dark theme,
      and refactor an existing component into a variant-based API with `asChild`, a forwarded ref
      and a documented deprecation for the props you removed.
    resources:
      - kind: doc
        title: 'W3C WAI: ARIA Authoring Practices Guide'
        url: https://www.w3.org/WAI/ARIA/apg/
      - kind: doc
        title: Design Tokens Community Group (DTCG) format
        url: https://www.designtokens.org/
      - kind: doc
        title: 'Style Dictionary: build tokens for every platform'
        url: https://styledictionary.com/
