  - slug: frontend-css
    name: 'CSS Fundamentals: Cascade, Specificity and the Box Model'
    domain: frontend
    est_hours: 12
    difficulty: beginner
    prerequisites:
      - frontend-html
    summary: |-
      Predict which declaration wins and what size a box will be, by understanding the
      cascade as a resolution algorithm, specificity as a comparable tuple, and the
      box model including margin collapsing and stacking contexts.
    content_md: |-
      CSS is not a list of instructions applied top to bottom. It is a constraint
      system: you declare many potentially conflicting values, and the browser runs a
      defined algorithm to pick one winner per property per element. Almost all CSS
      frustration comes from guessing at that algorithm instead of knowing it. Once
      you can name the step at which your
      declaration lost, debugging stops being trial and error: you see the
      struck-through rule in DevTools and know whether the cause was origin, layer,
      specificity or source order.

      ### The cascade, in its real order

      For each property on each element the browser gathers every applicable
      declaration and sorts by:

      1. **Origin and importance** — user-agent, then user, then author styles, with
         `!important` declarations inverting the order, which is what makes a user
         stylesheet able to override an author one.
      2. **Cascade layers** — within an origin, later `@layer`s beat earlier ones, and
         unlayered author styles beat all layers.
      3. **Specificity** — the selector's weight.
      4. **Order of appearance** — the last one wins.

      Specificity is *fourth*, not first. A high-specificity selector in an early
      layer still loses to a low-specificity one in a later layer.

      ### Specificity is a tuple

      Specificity is `(A, B, C)`: A counts IDs, B counts classes, attribute selectors
      and pseudo-classes, C counts element types and pseudo-elements. They compare
      left to right and do not carry — eleven classes `(0,11,0)` never reach one ID
      `(1,0,0)`, and inline `style` sits above all selectors. `:where()`
      contributes zero, while `:is()` and `:not()` take the specificity of their most
      specific argument, so `:where(.card) .title` publishes a default that any single
      class can override.

      `!important` is a symptom, not a tool: it means your selectors are more specific
      than your architecture needs. Layers are the modern fix: declare
      `@layer reset, base, components, utilities;` once, and order then beats
      specificity.

      ### Inheritance and the global keywords

      Some properties inherit by default (`color`, `font-*`, `line-height`); most do
      not (`border`, `padding`, `display`). Four keywords apply to any property:
      `inherit` takes the parent's computed value; `initial` takes the spec-defined
      initial value, often *not* what the browser default shows; `unset` means inherit
      if inheritable and initial otherwise; `revert` rolls back to the previous
      origin, which is usually what you actually wanted.

      Custom properties are themselves inherited, so they cascade down a subtree and
      can be redefined per component:

      ```css
      .card { --pad: 1rem; padding: var(--pad, 0.5rem); }
      .card.compact { --pad: 0.5rem; }
      ```

      ### Boxes, collapsing and contexts

      Every box is content, padding, border, margin. The default `box-sizing:
      content-box` makes `width` mean the *content* width, so padding and border add
      on top; you almost always want `box-sizing: border-box`.

      Adjacent vertical margins **collapse**: two 20px margins between siblings give
      20px, not 40px. Parent and first/last child margins collapse *through* the
      parent when no border, padding, inline content or clearance sits between them —
      which is why a child's `margin-top` mysteriously pushes the parent down.
      Margins do not collapse across a new block formatting context (`overflow:
      hidden|auto`, `display: flow-root`, floats, absolute positioning), and never
      between flex or grid items.

      Stacking contexts control `z-index`. The root element, a positioned element with
      a `z-index` other than `auto`, and any element with `opacity` below 1,
      `transform`, `filter` or `isolation: isolate` all start one, and `z-index`
      values compare only with siblings inside the same context.

      ### Units

      `em` is relative to the element's own font size and compounds when nested; `rem`
      is relative to the root font size and so respects the user's browser font
      setting — use it for type and spacing. Percentages resolve against the
      containing block and differ per property (vertical padding resolves against
      *width*). `vh` is the large viewport height, while `dvh` tracks the dynamic
      viewport as mobile chrome shows and hides.

      ### The mistakes people actually make

      Answering a specificity conflict with `!important`, which the next developer
      answers with a more specific `!important`, until nothing can be overridden.

      Assuming `z-index: 9999` is global. If an ancestor has `transform` or `opacity`
      below 1, your element is trapped in that ancestor's stacking context and cannot
      rise above its siblings.

      Using `100vh` for a full-height mobile layout: it measures the large viewport
      and so overflows behind the browser toolbar. Use `100dvh`.

      Writing deeply nested selectors like `.page .content .card .title span`, which
      accumulates specificity you must fight everywhere else.

      **What you can do after this:** given two competing rules and the DevTools
      Styles panel, state which cascade step decided the winner, and fix the losing
      rule without adding `!important`.
