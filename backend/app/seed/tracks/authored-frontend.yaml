  - slug: frontend-vue-js
    name: Vue 3 and Fine-Grained Reactivity
    domain: frontend
    est_hours: 16
    difficulty: intermediate
    prerequisites:
      - frontend-learn-the-basics
    summary: Use Vue 3 to learn a genuinely different reactivity model — Proxy-based dependency tracking, refs, computed and watchers — and understand why signals have converged across Solid, Angular, Svelte and Vue.
    content_md: |-
      Learning Vue after React is worth more than a second syntax. Vue tracks
      dependencies at runtime, per property, which removes an entire category of
      problem that React solves with dependency arrays and memoisation. Seeing both
      models makes the design space visible: you stop treating your first
      framework's constraints as facts about UI programming.

      ### Single-File Components

      A `.vue` file colocates `<template>`, `<script setup>` and a `<style scoped>`
      block for one component. The ergonomic argument is real: the styles that only
      this component uses live next to it and are automatically scoped by a generated
      attribute, so you get encapsulation without naming conventions. The compiler
      also sees the template statically, which is how Vue emits patch hints that skip
      diffing static parts of the tree.

      ### The reactivity system

      `reactive(obj)` returns a **Proxy**. When a component renders, Vue runs the
      render function inside a tracked **effect**; every property read through the
      proxy registers that effect as a subscriber of that exact property. Write to
      the property and only the subscribed effects re-run.

      This is why Vue has no dependency arrays. Dependencies are discovered by
      execution, not declared by hand, so they cannot go stale or be wrong.

      A Proxy can only intercept property access, which is where `ref` comes in. For
      a primitive there is no object to proxy, so `ref(0)` wraps the value in an
      object with a `.value` accessor and tracks reads of that one property.

      ```js
      const count = ref(0)
      count.value++            // .value required in script
      const state = reactive({ n: 0 })
      const { n } = state      // WRONG: n is now a plain number, not tracked
      ```

      Templates unwrap top-level refs automatically, which is exactly why the
      `.value` boundary trips everyone: `{{ count }}` in the template, `count.value`
      in the script.

      ### computed, watch and watchEffect

      `computed(() => a.value + b.value)` creates a cached derived value: it re-runs
      only when a tracked dependency changes and otherwise returns the cached result.
      Derived state should almost always be `computed`.

      `watchEffect(fn)` runs `fn` immediately and re-runs it whenever anything it
      read changes — dependencies inferred. `watch(source, cb)` watches explicit
      sources and gives you the old and new values, which you need when the reaction
      depends on what changed. Use watchers for side effects: fetching, logging,
      writing to storage. If you find yourself watching one value to assign another,
      you wanted `computed`.

      ### Templates, composition and shared state

      Directives (`v-if`, `v-for` with `:key`, `v-bind`, `v-on`) compile to render
      code. `v-model` is sugar: a `modelValue` prop plus an `update:modelValue`
      emit — props down, events up, exactly as before.

      **Slots** let a parent pass markup into a child; **scoped slots** let the child
      pass data back out to that markup, which is how you build a list component that
      owns fetching and paging while the caller owns row rendering.
      **provide/inject** supplies values down a subtree without prop drilling.
      **Composables** — plain functions that create refs and computeds and return
      them — are Vue's answer to hooks, but with no ordering rules, because they are
      just function calls creating objects. **Pinia** is the recommended store: typed
      stores with state, getters and actions, and no need to declare mutations.

      ### How this compares, and where the industry landed

      React re-runs a component and everything below it, then diffs. Vue re-runs only
      the effects that read the changed property. That is why React needs `memo` and
      stable callbacks and Vue mostly does not, and why Vue's cost is per-dependency
      bookkeeping instead of per-render diffing.

      The wider point is convergence. Solid built on fine-grained signals from the
      start, Angular adopted signals, Svelte 5 introduced runes, and Vue's refs are
      the same primitive under another name. If you learn Vue's reactivity you have
      largely learned all four.

      ### The mistakes people actually make

      Destructuring a `reactive` object and losing reactivity, because the Proxy is
      gone the moment you copy a primitive out — use `toRefs` or keep the object.
      Forgetting `.value` in script code while it works in the template, and
      comparing a ref object to a number. Using `watch` to keep a second piece of
      state in sync when `computed` would have made it impossible to drift. Mutating
      a prop directly: props are one-way, and the parent's next render overwrites
      you — emit an event instead.

      **What you can do after this:** explain why a Vue value stopped updating by
      naming the exact point where reactivity was lost, and say what React would
      have required for the same feature.
