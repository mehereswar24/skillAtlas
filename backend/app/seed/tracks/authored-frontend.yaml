        url: https://web.dev/articles/cls
  - slug: frontend-forms-and-validation
    name: Forms, Validation and Input UX
    domain: frontend
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - frontend-html
      - frontend-accessibility
      - frontend-learn-the-basics
    summary: Build forms on the platform's own submission and constraint validation, add schema validation shared with the server, and report errors accessibly with correct timing so people can actually complete them.
    content_md: |-
      Forms are where most real frontend bugs live. They are also where the money is:
      checkout, signup, settings, anything that changes data. Yet most syllabuses
      skip them, so people rebuild submission, validation and error reporting badly
      from scratch every time — usually by discarding platform behaviour that already
      worked.

      ### Start from the platform

      A `<form>` with an `action` and a submit button posts without any JavaScript.
      That gives you Enter-to-submit, the implicit submission rules, browser autofill
      and password-manager integration for free. Build on it: intercept `submit`,
      read the fields with `new FormData(form)`, and if your script fails to load the
      form still works. That is progressive enhancement, and for a signup form it is
      the difference between a degraded experience and no experience.

      Constraint validation is built in. `required`, `type="email"`, `min`, `max`,
      `pattern` and `maxlength` are checked by the browser, which exposes the result
      through `element.validity` and `element.checkValidity()`. Style the outcome
      with `:user-invalid`, which — unlike `:invalid` — only matches after the user
      has interacted, so an empty required field is not red before it is touched. For
      rules the platform cannot express, `setCustomValidity(message)` marks a field
      invalid with your own text and blocks native submission until cleared.

      ### Controlled, uncontrolled, and re-render cost

      A **controlled** input has its value in framework state and an `onChange` that
      writes it back, so every keystroke re-renders. That is fine for five fields and
      measurable on forty. An **uncontrolled** input lets the DOM own the value and
      you read it on submit, via a ref or `FormData`. Libraries such as React Hook
      Form default to uncontrolled precisely to avoid per-keystroke renders,
      subscribing only the field that changed.

      ### Schema-driven validation

      Define the shape once with a schema library (Zod, Valibot) and use it on both
      sides.

      ```ts
      const Signup = z.object({
        email: z.string().email(),
        password: z.string().min(12),
      });
      ```

      The client runs it for instant feedback; the server runs the same schema before
      touching the database. Be clear about why: **client validation is UX, server
      validation is the security boundary.** Anyone can post directly to your
      endpoint, so client-side rules are a convenience, never a control. As a bonus,
      the schema gives you the request type.

      Timing matters as much as the rules. Validating on every keystroke tells people
      their email is invalid while they are typing it. The behaviour that tests well:
      validate a field on blur, validate everything on submit, and only after a
      failed submit switch that field to re-validating on change so the user sees the
      error clear as they fix it.

      ### Accessible errors

      Mark the field with `aria-invalid="true"` and point `aria-describedby` at the
      element containing its message, so a screen reader announces the error when the
      field takes focus. On a failed submit, render an **error summary** at the top
      listing each problem as a link to its field, and move focus to it — otherwise a
      keyboard user has no idea why nothing happened. Never signal an error with
      colour alone: pair it with text and an icon, and keep the message specific
      ("Password must be at least 12 characters", not "Invalid").

      ### The rest of real forms

      Persist multi-step form data so a refresh or a back-navigation does not erase
      twenty fields. Show real progress for file uploads and handle failure per file.
      Use correct `autocomplete` tokens (`email`, `new-password`, `postal-code`) so
      autofill and password managers work. Set `inputmode` and `type` so phones show
      the right keyboard. Disable the submit button *after* the first submit starts,
      and guard server-side with an idempotency key, or a double click creates two
      orders.

      ### The mistakes people actually make

      Validating only on the client and trusting the payload, which is a security
      hole, not a bug. Using `<div role="form">` with a click handler, losing
      Enter-to-submit, autofill and native validation. Using the placeholder as the
      label, so the field's purpose vanishes as soon as the user types and screen
      readers have nothing reliable to announce. Wiping the whole form on a server
      error and asking the user to retype everything. Disabling submit until the form
      is valid, so the user is blocked with no explanation and cannot trigger the
      validation that would tell them what is wrong.

      **What you can do after this:** take an existing form and list every failure —
      unlabelled fields, unannounced errors, wrong validation timing, missing server
      checks, double submission — and fix them without a library.
    resources:
      - kind: doc
        title: 'MDN: FormData'
        url: https://developer.mozilla.org/en-US/docs/Web/API/FormData
