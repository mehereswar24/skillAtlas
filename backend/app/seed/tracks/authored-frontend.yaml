  - slug: frontend-learn-the-basics
    name: 'Component Thinking: The Model Every Framework Shares'
    domain: frontend
    est_hours: 8
    difficulty: intermediate
    prerequisites:
      - frontend-dom-events
      - frontend-type-checkers
    summary: Learn the ideas that React, Vue, Svelte, Solid and Angular all share — declarative rendering, reconciliation, unidirectional data flow, derived state — so that learning your second framework costs days rather than months.
    content_md: |-
      Every mainstream frontend framework is a different implementation of the same
      small set of ideas. Hold those ideas separately from any one library's syntax
      and picking up the next framework becomes a matter of learning names, not
      concepts. You also stop arguing about which framework is "better" and start
      arguing about what actually determines whether a codebase is pleasant: where
      state lives and who is allowed to change it.

      This matters practically because you will not spend a career in one framework.
      A developer who understands declarative rendering, reconciliation and component
      boundaries reads an unfamiliar codebase on the first day.

      ### `UI = f(state)` is a determinism claim

      The central promise is that your view is a pure function of state: same state
      in, same UI out, every time. That is a contract, and it is what allows a
      framework to re-run your rendering code whenever it likes. Imperative DOM code
      breaks it because the DOM accumulates history — after twenty calls to
      `el.classList.add(...)` you cannot say what is on screen without replaying all
      twenty. Declarative rendering deletes that history: you describe the target,
      the framework computes the mutations.

      The discipline that follows is simple: never reach into the DOM to change
      something your render function also controls, or you have two writers for one
      cell and the next render silently wins.

      ### Three answers to "how do we know what changed"

      A **virtual DOM** (React, and Vue for its template output) builds a cheap
      object tree describing the desired UI, diffs it against the previous tree and
      applies the difference, re-running component functions to do so.

      **Fine-grained reactivity** (Solid, Angular signals, Vue's refs, Svelte 5
      runes) tracks which piece of UI read which piece of state at runtime. When that
      state changes, only the subscribed expression re-runs — often a single text-node
      update, with no diff.

      **Compiled updates** (Svelte) move the analysis to build time: the compiler
      knows statically which DOM nodes depend on which variables, emits direct update
      instructions, and ships no diffing runtime.

      All three reach the same DOM; they differ in when the work happens — render,
      subscription or compile time.

      ### Reconciliation and stable identity

      When a list re-renders, the framework must decide whether item three is the
      same item three as before, so it can keep its DOM node and its internal state.
      It decides using **keys**. A key must be stable across renders and belong to
      the item, not the position — a database id, not an array index.

      Use the index and you get the classic bug: type into the third input, delete
      the first row, and your text jumps rows. The framework matched key `2` to key
      `2`, kept the DOM node, and swapped the data underneath it.

      ### Props down, events up, and composition

      Data flows one way. A parent passes **props** down; a child reports upward by
      calling a function it was given, or emitting an event. That single direction is
      why you can answer "why did this value change" by reading upward instead of
      searching the whole app. Two-way binding (`v-model`, `[(ngModel)]`) is sugar
      over exactly this — a value prop plus a change handler.

      For reuse, prefer composition to configuration: rather than a component with
      fourteen boolean flags, accept **slots/children** so the caller supplies the
      markup, and extract shared behaviour into hooks or composables. Inputs come in
      two flavours — **controlled**, where the framework owns the value, and
      **uncontrolled**, where the DOM owns it and you read it on submit. Controlled
      buys validation on every keystroke and costs a render per keystroke.

      ### Derived state, stored state and lifecycle

      If a value can be computed from other state, compute it during render; store
      only what you cannot derive. Lifecycle reduces to three moments — mount, update,
      unmount — and side effects (subscriptions, timers, imperative widgets) belong
      there, with unmount undoing whatever mount did.

      ### The mistakes people actually make

      Copying server data into three components so each has "its own copy": the
      copies diverge the moment one refetches. Using the array index as a key, then
      spending an afternoon on the input-value-jumps bug. Putting `fullName` in state
      beside `firstName` and `lastName`, then finding the path that updates two of
      the three. Drilling a prop through six components instead of admitting the tree
      is shaped wrong.

      **What you can do after this:** open an unfamiliar Vue or Svelte component and
      correctly identify its state, its derived values, its props-down/events-up
      boundary, and whether its list keys are safe.
