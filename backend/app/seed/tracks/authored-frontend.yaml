  - slug: frontend-responsive-design
    name: Responsive and Adaptive Interfaces
    domain: frontend
    est_hours: 8
    difficulty: beginner
    prerequisites:
      - frontend-css-layout
    summary: |-
      Build components that adapt to the space they are given rather than to the
      device, using container queries, fluid sizing and responsive images, and respect
      the user preferences the browser already exposes.
    content_md: |-
      Responsive design is usually taught as "the page reacts to screen width". That
      framing is now the wrong one. In a component-based codebase the same card can
      appear in a wide main column, a narrow sidebar and a modal on the same screen
      size, and screen width tells it nothing useful. Responsiveness belongs to the
      *component*, and the question it should ask is how much space it has been given.

      The second half of responsiveness is not size at all. The browser exposes what
      the user has asked for — colour scheme, motion, contrast, font size — and
      honouring those is what makes an interface belong on their device.

      ### The viewport, and mobile-first ordering

      Without `<meta name="viewport" content="width=device-width, initial-scale=1">`
      a mobile browser renders at roughly 980px and scales the result down, so your
      media queries never match. That one tag is the precondition for everything else.

      Write the narrow layout as the unconditional base and add complexity in
      `min-width` queries. The narrow layout is usually the simplest, so the base
      stylesheet stays small and every query adds rather than undoes.

      ### Media queries versus container queries

      A media query asks about the viewport or the device. A container query asks
      about an ancestor element, which is what a component actually needs:

      ```css
      .card-wrap { container-type: inline-size; container-name: card; }

      @container card (min-width: 30rem) {
        .card { display: grid; grid-template-columns: 12rem 1fr; }
      }
      ```

      `container-type: inline-size` applies inline-size containment, meaning the
      element's inline size no longer depends on its contents — that independence is
      exactly what makes the query non-circular and therefore possible. Because the
      rule keys off the container, the same component adapts correctly in a sidebar
      and in a full-width region. Media queries remain right for page-level decisions:
      the shell's column count, print styles, preference queries.

      ### Fluid and intrinsic sizing

      `clamp(min, preferred, max)` gives you a value that scales but cannot escape its
      bounds. For type, express the preferred term with a viewport unit plus a `rem`
      term so the result still responds to the user's font-size setting:

      ```css
      h1 { font-size: clamp(1.75rem, 1.2rem + 2.5vw, 3rem); }
      ```

      `min()` and `max()` do the same job for widths: `width: min(65ch, 100%)` gives a
      comfortable reading measure that never overflows a narrow parent. The intrinsic
      keywords `min-content`, `max-content` and `fit-content` size a box from its
      content rather than from its parent.

      ### Responsive images, and not shifting the layout

      `srcset` with `w` descriptors offers the browser several resolutions of the same
      image; `sizes` tells it how wide the image will be *laid out*, which it needs
      before layout in order to choose. Use `<picture>` with `<source>` only when the
      images genuinely differ — a different crop, or AVIF with a JPEG fallback.

      Always give images intrinsic dimensions: `width` and `height` attributes, or an
      `aspect-ratio` in CSS. The browser then reserves the correct space before the
      bytes arrive, which is the single most effective fix for Cumulative Layout
      Shift. Add `loading="lazy"` to images below the fold, and never to your largest
      above-the-fold image, which would delay it.

      ### Preference queries

      `prefers-color-scheme` reports light or dark; pair it with `color-scheme: light
      dark` so form controls and scrollbars follow too. `prefers-reduced-motion:
      reduce` means the user asked the operating system to stop animation — honour it
      by removing transforms and parallax, not by removing feedback. `prefers-contrast:
      more` asks for stronger separation. Touch targets must be at least 24 by 24 CSS
      pixels for WCAG 2.2 AA; 44px is more comfortable.

      ### The mistakes people actually make

      Choosing breakpoints from a list of device widths. Devices change constantly and
      the number was never about the phone: pick the width at which *your content*
      stops looking right, and put the breakpoint there.

      Shipping `user-scalable=no` or `maximum-scale=1`. This blocks pinch zoom, which
      is a primary accommodation for low vision, and fails WCAG. There is no layout
      problem that justifies it.

      Serving images with no width, height or aspect ratio. Every one of them shoves
      the page down when it decodes, and the user taps the wrong thing.

      Adding `container-type` without thought. Container queries are widely supported
      now, but the property changes the sizing behaviour of the element it is applied
      to, so verify the container still sizes as you expect.

      **What you can do after this:** take a component, make it adapt to its container
      rather than the viewport, and demonstrate that it renders correctly in a sidebar
      and a full-width slot without any layout shift as images load.
    resources:
      - kind: course
        title: 'web.dev: Learn Responsive Design'
        url: https://web.dev/learn/design
      - kind: doc
        title: 'MDN: @container'
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/@container
