        url: https://web.dev/articles/cls
      - kind: doc
        title: 'W3C WAI: Understanding WCAG 2.2'
        url: https://www.w3.org/WAI/WCAG22/Understanding/
  - slug: frontend-deployment
    name: 'Putting It Online: Hosting, DNS, TLS and CDNs'
    domain: frontend
    est_hours: 6
    difficulty: beginner
    prerequisites:
      - frontend-internet
      - frontend-css-layout
    summary: |-
      Take a site you have built and put it on the public internet under your own
      domain with HTTPS, a sane caching strategy, and a deploy you can roll back -
      understanding what each piece of that pipeline is actually doing.
    content_md: |-
      A site that only runs on `localhost` is an exercise. Publishing one closes the
      loop opened in the first concept: you followed a page load inwards, and now you
      stand at the other end and configure the machinery that answers it. The
      decisions have long tails: a caching header you set once can leave users stuck
      on a broken build for a year, and a key you paste into a component is public the
      moment you deploy.

      ### Static hosting versus a server

      A static host stores files and serves them by path; a server runs code per
      request. If your build produces HTML, CSS, JS and assets with no per-request
      logic, you need only the former.

      A bundler such as Vite emits an `index.html` plus hashed assets like
      `app-B7f2c1.js`. The hash is a fingerprint of the contents: change one byte, get
      a new filename. That property is what makes the caching strategy below safe.
      Single-page apps additionally need the host to rewrite unknown paths to
      `index.html`, or a deep link returns a genuine 404.

      ### DNS records you will actually set

      `A` maps a name to an IPv4 address, `AAAA` to IPv6, and `CNAME` aliases one name
      to another. The catch is that DNS forbids a `CNAME` at the zone apex —
      `example.com` itself — because the apex must also carry `SOA` and `NS` records.
      Providers work around this with a non-standard `ALIAS` or `ANAME`, so the usual
      shape is a `CNAME` on `www` and an `ALIAS` or `A` at the apex. Pick one
      canonical host and permanently redirect the other, or you split SEO and cookies
      across two origins.

      ### Certificates without a purchase order

      ACME automates certificate issuance. Your host asks a CA such as Let's Encrypt
      for a certificate, the CA issues a challenge, and you prove control of the name
      by serving a token at a well-known HTTP path or publishing a DNS `TXT` record.
      You then get a short-lived certificate, renewed automatically. Managed hosts run
      this the moment DNS points at them — which is why certificate errors on a fresh
      domain are usually just DNS that has not propagated yet.

      ### Edge caching and a cache strategy that works

      A CDN keeps copies at points of presence near users, shortening the round trips
      you learned about. What it caches is governed by your headers, and the strategy
      that follows from hashed filenames is two-tier:

      ```
      /assets/app-B7f2c1.js   Cache-Control: public, max-age=31536000, immutable
      /index.html             Cache-Control: no-cache
      ```

      Hashed assets are cached forever because a changed file gets a different URL.
      `index.html` uses `no-cache`, which does *not* mean "do not store" — it means
      revalidate before use, so the browser sends `If-None-Match` and usually gets a
      cheap `304`. Because the HTML names the current asset filenames, revalidating
      that one small document switches a user to the new build.

      ### Deploys you can undo

      An atomic deploy uploads a complete new version, then flips a pointer, so no
      user ever sees a half-uploaded site. Because the old version still exists, a
      rollback is flipping the pointer back — seconds, not a rebuild. Preview
      deployments give every pull request its own URL built from that branch, turning
      review from reading a diff into using the change.

      Environment variables at build time are inlined into the bundle. A variable
      prefixed for client exposure (Vite's `VITE_`, for example) ends up as a literal
      string in a file anyone can read. Client-side configuration is public; anything
      genuinely secret belongs behind a server endpoint you control.

      ### The mistakes people actually make

      Serving `index.html` with a long `max-age`. Returning users are pinned to an old
      HTML file that references deleted asset hashes, so the app fails to load and you
      cannot fix it until the cache expires.

      Putting an API key in the client bundle because it was in a `.env` file. Build
      tooling inlines it; view-source finds it.

      Configuring only `www` or only the apex. Half your visitors get a certificate
      error or a dead name, because they typed the other one.

      Reading a green deploy as proof the new code is live. The build succeeded, but a
      CDN may still be serving cached objects. Check the asset filename in the network
      panel against the hash your build just produced.

      **What you can do after this:** deploy a static site to your own domain over
      HTTPS, explain each cache header you set, and roll back to the previous version
      while proving from the network panel which build is being served.
    resources:
      - kind: doc
        title: 'RFC 8555: Automatic Certificate Management Environment (ACME)'
        url: https://www.rfc-editor.org/rfc/rfc8555
      - kind: doc
        title: 'Let''s Encrypt: How It Works'
        url: https://letsencrypt.org/how-it-works/
