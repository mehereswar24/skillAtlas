# Career assessment. Each option adds `weight` to one category; the highest
# total wins and maps to a track below.
#
# `track` may be null when we do not yet have curated content for that
# category — the API then returns the nearest available track and says plainly
# that the ideal one is not built yet, rather than silently recommending
# something unrelated.

categories:
  - name: Systems & Backend
    track: backend-developer
    blurb: >-
      You think in terms of correctness, structure and what happens under load.
      Backend engineering rewards exactly that.
  - name: AI & Machine Learning
    track: ai-engineer
    blurb: >-
      You are drawn to problems where the rules are learned rather than
      written. That is machine learning.
  - name: Data & Analytics
    track: ai-engineer
    fallback_note: >-
      A dedicated Data Analyst track is on the way; the AI Engineer path shares
      its statistics, Pandas and evaluation foundations.
    blurb: >-
      You reach for evidence before opinion and enjoy making a messy dataset
      tell the truth.
  - name: Product & Design
    track: null
    fallback_track: backend-developer
    fallback_note: >-
      The UI/UX Design track is not built yet. In the meantime the Backend
      Developer path gives you the technical literacy product roles increasingly
      expect.
    blurb: >-
      You start from the person using the thing, and work backwards to how it
      should be built.

questions:
  - prompt: When you are handed a complex, ambiguous project, what is your instinct?
    options:
      - text: Break it into components and work out how the pieces fit together.
        category: Systems & Backend
      - text: Look for patterns in whatever data already exists before deciding anything.
        category: Data & Analytics
      - text: Ask who this is for and what problem it actually solves for them.
        category: Product & Design
      - text: Wonder whether a model could learn the rules instead of you writing them.
        category: AI & Machine Learning

  - prompt: Which of these would you happily spend a whole Saturday on?
    options:
      - text: Making a slow endpoint fast and understanding exactly why it was slow.
        category: Systems & Backend
      - text: Getting a model's accuracy from 84% to 91%.
        category: AI & Machine Learning
      - text: Cleaning a messy spreadsheet until it finally tells a clear story.
        category: Data & Analytics
      - text: Redesigning a confusing screen until it needs no explanation.
        category: Product & Design

  - prompt: What kind of feedback would mean the most to you?
    options:
      - text: "\"It has not gone down once since you shipped it.\""
        category: Systems & Backend
      - text: "\"Your model is now making the decision we used to guess at.\""
        category: AI & Machine Learning
      - text: "\"Your analysis changed what we decided to do.\""
        category: Data & Analytics
      - text: "\"Users stopped complaining — they just use it now.\""
        category: Product & Design

  - prompt: Which sentence sounds most like something you would say?
    options:
      - text: "\"What happens to this if a hundred thousand people hit it at once?\""
        category: Systems & Backend
      - text: "\"What is the baseline, and are we actually beating it?\""
        category: AI & Machine Learning
      - text: "\"Is that difference real, or could it be noise?\""
        category: Data & Analytics
      - text: "\"Let's watch someone try to use it before we argue about it.\""
        category: Product & Design

  - prompt: A system is behaving strangely in production. What is the part you enjoy?
    options:
      - text: Reading the logs and traces until the root cause is undeniable.
        category: Systems & Backend
      - text: Working out whether the inputs have drifted away from what it was trained on.
        category: AI & Machine Learning
      - text: Quantifying how many users were affected and how badly.
        category: Data & Analytics
      - text: Deciding what to tell users and how to make the failure less painful.
        category: Product & Design

  - prompt: Which subject would you most want to go deep on?
    options:
      - text: Distributed systems, databases and how they fail.
        category: Systems & Backend
      - text: Neural networks, optimisation and representation learning.
        category: AI & Machine Learning
      - text: Statistics, causal inference and experiment design.
        category: Data & Analytics
      - text: Human perception, interaction design and research methods.
        category: Product & Design

  - prompt: Your ideal working day is mostly...
    options:
      - text: Deep, uninterrupted focus on a hard technical problem.
        category: Systems & Backend
        weight: 1.0
      - text: Experimenting, iterating and reading recent papers.
        category: AI & Machine Learning
      - text: Querying, exploring and turning findings into something people can act on.
        category: Data & Analytics
      - text: Talking to people, sketching, and testing ideas quickly.
        category: Product & Design

  - prompt: Which failure would bother you the most?
    options:
      - text: The service was down for an hour and nobody noticed until users complained.
        category: Systems & Backend
      - text: The model looked excellent offline and was useless in production.
        category: AI & Machine Learning
      - text: The conclusion was confidently wrong because of a sampling mistake.
        category: Data & Analytics
      - text: The feature shipped exactly as specified and nobody wanted it.
        category: Product & Design
